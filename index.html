};
function moduleLink(m){
  if(!m.link) return "";
  if(m.link.indexOf("tut:")===0) return `<a href="javascript:showTutorial('${m.link.slice(4)}')" style="color:var(--green)">开始学习 →</a>`;
  if(m.link.indexOf("col-")===0) return `<a href="javascript:go('${m.link}')" style="color:var(--green)">查看相关栏目 →</a>`;
  return `<a href="javascript:go('${m.link}')" style="color:var(--green)">开始学习 →</a>`;
}
function renderColumn(id){
  const c = COLUMNS.find(x=>x.id===id);
  if(!c) return '<div class="card"><p>栏目不存在。</p></div>';
  let h = crumb([["首页","home"],[c.name,null]]);
  h += `<div class="card"><h3>${c.icon} ${c.name}</h3><p style="color:var(--muted)">${esc(c.intro)}</p><p style="margin-top:6px">${statusBadge(c.status)} <span style="font-size:13px;color:var(--muted)">${c.modules.length} 个二级模块</span></p></div>`;
  h += `<h4 style="margin:16px 4px 8px">二级模块</h4><div class="col-grid">`;
  c.modules.forEach(m=>{
    h += `<div class="col-card"><div class="t">${esc(m.name)}</div><div class="ds">${esc(m.topics)}</div><div style="margin-top:8px;font-size:13px">`;
    if(m.count!==null&&m.count!==undefined) h += `<span style="color:var(--muted)">${m.count} 条/篇</span> · `;
    if(m.note) h += `<span style="color:var(--amber)">${esc(m.note)}</span> `;
    h += moduleLink(m);
    h += `</div></div>`;
  });
  h += `</div>`;
  const links = COLUMN_LINKS[id]||[];
  if(links.length){
    h += `<div class="card"><h4>🔗 本栏目相关内容</h4><p style="font-size:14px">` +
      links.map(l=>`<a href="javascript:go('${l[1]}')" style="color:var(--green);margin-right:14px">${esc(l[0])}</a>`).join("") + `</p></div>`;
  }
  h += `<div class="card"><h4>📝 本栏目练习题</h4><div class="note-pending">练习题库建设中（阶段 8），将与 4 个示例数据集绑定，目标 ≥30 道；参考答案与题目成对出现。</div></div>`;
  h += `<div class="card"><h4>🛠️ 本栏目相关工具</h4><p style="font-size:14px"><a href="javascript:go('tools')" style="color:var(--green)">去在线工具（26 个）→</a></p></div>`;
  return h;
}
/* ---------- 教程详情页（§4.3 十二区块，按 §7.1 取舍） ---------- */
function showTutorial(id){
  const M = document.getElementById("main");
  const t = (DATA.tutorials||[]).find(x=>x.id===id);
  if(!t){ M.innerHTML = '<div class="card"><p>教程不存在。</p></div>'; return; }
  const col = COLUMNS.find(c=>c.id===t.column);
  const group = (DATA.tutorials||[]).filter(x=>x.group===t.group);
  const gi = group.findIndex(x=>x.id===id);
  const prev = gi>0 ? group[gi-1] : null, next = gi>=0 && gi<group.length-1 ? group[gi+1] : null;
  const readMin = Math.max(2, Math.round(((t.body||"").length + group.reduce((a,x)=>a+0,0)) / 600));
  let h = crumb([["首页","home"],[col?col.name:t.column,"col-"+t.column],[t.title,null]]);
  h += `<div class="card"><h3>${esc(t.title)}</h3><div class="detail-meta">所属栏目：<b>${col?col.name:t.column}</b> · 二级模块：<b>${esc(t.level2||"")}</b><br>难度：<b>${esc(t.level||"未标注")}</b> · 预计阅读时长：<b>约 ${readMin} 分钟</b> · 适用版本：<b>${esc(t.versions||"Excel 2016 及以上")}</b> · 更新日期：<b>${esc(t.updated||"2026-11-09")}</b><br>来源：<b>${esc(t.source||"站内数据")}</b></div></div>`;
  if(t.objectives && t.objectives.length){ h += `<div class="card"><h4>🎯 学习目标</h4><p style="font-size:14px">学完本篇，你将能够：</p><ul style="font-size:14px">` + t.objectives.map(o=>`<li>${esc(o)}</li>`).join("") + `</ul></div>`; }
  else { h += `<div class="card"><h4>🎯 学习目标</h4><div class="note-pending">本篇学习目标待后续阶段按教程模板（§7.1）回填；先掌握正文的操作步骤与示例。</div></div>`; }
  if(t.sections && t.sections.length){
    h += `<div class="card"><h4>📖 基础概念</h4>`;
    t.sections.forEach(s=>{ h += `<h4 style="margin-top:10px">${esc(s.title)}</h4><p style="font-size:14px;white-space:pre-line">${esc(s.body)}</p>`; });
    h += `</div>`;
  } else if(t.body){
    h += `<div class="card"><h4>📖 基础概念</h4><p style="font-size:14px;white-space:pre-line">${esc(t.body)}</p></div>`;
  }
  if(t.steps && t.steps.length){
    h += `<div class="card"><h4>👣 操作步骤</h4><table>` + t.steps.map((s,i)=>`<tr><td style="width:36px;font-weight:700;color:var(--green)">${i+1}</td><td>${esc(s)}</td></tr>`).join("") + `</table></div>`;
  }
  h += `<div class="card"><h4>🖼️ 图文示例</h4><p style="font-size:14px">文字示例见上文；截图位：（待补图）</p></div>`;
  if(t.formulas && t.formulas.length){ h += `<div class="card"><h4>🧮 公式和代码</h4><pre style="white-space:pre-wrap;font-size:13px">` + t.formulas.map(f=>esc(f)).join(String.fromCharCode(10)) + `</pre></div>`; }
  else { h += `<div class="card"><h4>🧮 公式和代码</h4><div class="note-pending">本篇公式/代码示例待后续阶段按教程模板回填（每示例必标 → 结果值）。</div></div>`; }
  if(t.scenarios && t.scenarios.length){ h += `<div class="card"><h4>💼 实际工作场景</h4>` + t.scenarios.map(sc=>`<h4 style="margin-top:10px">${esc(sc.title)}</h4><p style="font-size:14px;white-space:pre-line">${esc(sc.body)}</p>`).join("") + `</div>`; }
  else { h += `<div class="card"><h4>💼 实际工作场景</h4><div class="note-pending">本篇工作场景待后续阶段回填（1–2 个真实场景：场景描述＋数据＋做法＋结果）。</div></div>`; }
  if(t.pitfalls && t.pitfalls.length){ h += `<div class="card"><h4>⚠️ 常见错误与解决方案</h4><table><tr><th>错误现象</th><th>原因</th><th>解决方案</th></tr>` + t.pitfalls.map(p=>`<tr><td>${esc(p.problem)}</td><td>${esc(p.cause)}</td><td>${esc(p.solution)}</td></tr>`).join("") + `</table></div>`; }
  else { h += `<div class="card"><h4>⚠️ 常见错误与解决方案</h4><div class="note-pending">本篇常见错误表待后续阶段回填；通用报错先查<a href="javascript:go('errors')" style="color:var(--green)">错误代码大全</a>与<a href="javascript:go('solve')" style="color:var(--green)">问题解决中心</a>。</div></div>`; }
  const _hay = ((t.title||"")+" "+(t.body||"")+" "+(t.sections||[]).map(s=>s.title+" "+s.body).join(" ")).toUpperCase();
  const _used = (DATA.functions_v2||[]).filter(v=>new RegExp("\\b"+v.id+"\\b").test(_hay)).slice(0,8);
  if(_used.length){ h += `<div class="card"><h4>∑ 本篇用到的函数</h4><p style="font-size:14px">${_used.map(v=>`<a href="javascript:showFunc('${v.id}')" style="color:var(--green);margin-right:12px">${v.id}（${esc(v.name_cn)}）</a>`).join("")}</p></div>`; }
  h += `<div class="card"><h4>🔗 相关教程</h4><p style="font-size:14px">` +
    (prev?`<a href="javascript:showTutorial('${prev.id}')" style="color:var(--green)">← 上一篇：${esc(prev.title)}</a><br>`:"") +
    (next?`<a href="javascript:showTutorial('${next.id}')" style="color:var(--green)">下一篇：${esc(next.title)} →</a><br>`:"") +
    `<a href="javascript:go('col-${t.column}')" style="color:var(--green)">回 ${col?esc(col.name):t.column} 栏目页 →</a></p></div>`;
  if(t.exercises && t.exercises.length){ h += `<div class="card"><h4>📝 练习题</h4><ol style="font-size:14px">` + t.exercises.map(q=>`<li>${esc(q)}</li>`).join("") + `</ol></div>`; }
  else { h += `<div class="card"><h4>📝 练习题</h4><div class="note-pending">本题练习题待练习题库建设（阶段 8）。</div></div>`; }
  if(t.answers && t.answers.length){ h += `<div class="card"><h4>✅ 参考答案</h4><details><summary>点击查看答案</summary><ol style="font-size:14px">` + t.answers.map(a=>`<li>${esc(a)}</li>`).join("") + `</ol></details></div>`; }
  else { h += `<div class="card"><h4>✅ 参考答案</h4><details><summary>点击查看答案</summary><div class="note-pending">参考答案与练习题成对建设（阶段 8）。</div></details></div>`; }
  if(t.file){
    const exists = (DATA.templates||[]).some(x=>x.file===t.file);
    if(exists) h += `<div class="card"><h4>📥 可下载示例文件</h4><p><a class="dlbtn" href="templates/${encodeURIComponent(t.file)}" download>下载 ${esc(t.file)}</a></p></div>`;
  }
  M.innerHTML = h;
  window.scrollTo({top:0,behavior:"smooth"});
}
/* ---------- 搜索（§6.5：search_index.json，9 类来源） ---------- */
const SEARCH_TYPE_CN = {function:"函数", tutorial:"教程", tip:"技巧", solve:"问题", faq:"问答", chart:"图表", case:"案例", template:"模板", vba:"VBA"};
function searchMatch(q, hay){
  const isAscii = /^[a-z0-9]+$/.test(q);
  if(!isAscii) return hay.indexOf(q)!==-1;
  const tokens = hay.split(/[^a-z0-9一-龥]+/);
  return tokens.some(tk=>tk===q || tk.indexOf(q)===0);
}
function doSearch(q){
  const raw = q;
  q = (q||"").trim().toLowerCase();
  const M = document.getElementById("main");
  if(!q){ render(cur); return; }
  let h = `<div class="card"><h3>🔍 搜索「${esc(raw.trim())}」</h3><p style="color:var(--muted);font-size:13px">覆盖函数 / 教程 / 技巧 / 问题 / 问答 / 图表 / 案例 / 模板 / VBA 共 9 类来源</p></div>`;
  const idx = DATA.search_index||[];
  const hits = idx.filter(it=>searchMatch(q, (it.title+" "+it.text).toLowerCase()));
  if(!hits.length){
    h += `<div class="card"><p>没有找到，换个关键词试试。</p><p style="margin-top:8px;font-size:14px">热门词：<a href="javascript:doSearch('VLOOKUP')" style="color:var(--green);margin-right:10px">VLOOKUP</a><a href="javascript:doSearch('透视表')" style="color:var(--green);margin-right:10px">透视表</a><a href="javascript:doSearch('求和')" style="color:var(--green)">求和</a></p></div>`;
    M.innerHTML = h; return;
  }
  const groups = {};
  hits.slice(0,40).forEach(it=>{ (groups[it.type]=groups[it.type]||[]).push(it); });
  Object.keys(groups).forEach(tp=>{
    const list = groups[tp].slice(0,8);
    h += `<div class="search-group">${SEARCH_TYPE_CN[tp]||tp}（${groups[tp].length}）</div>`;
    list.forEach(it=>{
      let act = "go('"+it.section+"')";
      if(it.type==="function") act = "showFunc('"+it.ref.replace(/'/g,"")+"')";
      else if(it.type==="tutorial") act = "showTutorial('"+it.ref.replace(/'/g,"")+"')";
      h += `<div class="search-item" onclick="${act}"><b>${esc(it.title)}</b><div class="st">${SEARCH_TYPE_CN[it.type]||it.type}${it.column?" · "+it.column:""} · ${esc((it.text||"").slice(0,60))}</div></div>`;
    });
  });
  h += `<p style="font-size:12px;color:var(--muted)">共 ${hits.length} 条${hits.length>40?"（仅显示前 40 条）":""}</p>`;
  M.innerHTML = h;
}
function compareFuncs(){
  const a = document.getElementById("cmp1").value, b = document.getElementById("cmp2").value, c = document.getElementById("cmp3").value;
  const o = document.getElementById("o_cmp"); o.classList.remove("hidden");
  const sel = [a,b,c].filter(x=>x);
  if(sel.length<2){ o.innerHTML = "请至少选 2 个函数"; return; }
  if(new Set(sel).size!==sel.length){ o.innerHTML = "请不要重复选择同一个函数"; return; }
  const vs = sel.map(n=>(DATA.functions_v2||[]).find(x=>x.id===n)).filter(Boolean);
  if(vs.length<2){ o.innerHTML = "未找到函数数据"; return; }
  const rows = [
    ["中文名称", v=>esc(v.name_cn)],
    ["分类", v=>esc(v.category_cn)],
    ["语法", v=>"<code>"+esc(v.syntax)+"</code>"],
    ["参数", v=>v.params.length + " 个：" + v.params.map(p=>esc(p.name)+(p.optional?"（可选）":"（必需）")).join("、")],
    ["返回结果", v=>esc(v.returns)],
    ["适用场景", v=>esc(v.desc_cn)],
    ["引入版本", v=>esc(v.versions.introduced)+"；兼容 "+v.versions.compatible.map(x=>"Excel "+x).join("、")],
    ["相关函数", v=>v.related.map(r=>`<a href="javascript:showFunc('${r}')" style="color:var(--green)">${r}</a>`).join("、")],
  ];
  let t = `<table><tr><th>对比项</th>${vs.map(v=>`<th>${v.id}</th>`).join("")}</tr>`;
  rows.forEach(r=>{ t += `<tr><td><b>${r[0]}</b></td>${vs.map(v=>`<td style="font-size:13px">${r[1](v)}</td>`).join("")}</tr>`; });
  t += `</table><p style="font-size:12px;color:var(--muted)">对比数据取自函数 v2 schema（data.json functions_v2），未手写对比文案。</p>`;
  o.innerHTML = t;
}
function calcDate(){
  const a = new Date(document.getElementById("dc1").value), b = new Date(document.getElementById("dc2").value);
  const o = document.getElementById("o_dc"); o.classList.remove("hidden");
  if(isNaN(a)||isNaN(b)){ o.textContent = "请选择两个日期"; return; }
  const d = Math.round((b-a)/86400000);
  o.innerHTML = `相差 <b>${d}</b> 天（${(d/365).toFixed(1)} 年 / ${(d/30.44).toFixed(1)} 个月）<br><span style="color:var(--muted);font-size:12px">Excel公式：=DATEDIF(开始,结束,"D") / =B2-A2</span>`;
}
function calcWork(){
  const a = new Date(document.getElementById("wc1").value), b = new Date(document.getElementById("wc2").value);
  const o = document.getElementById("o_wc"); o.classList.remove("hidden");
  if(isNaN(a)||isNaN(b)){ o.textContent = "请选择两个日期"; return; }
  let n = 0; const d = new Date(a);
  while(d <= b){ const w = d.getDay(); if(w!==0&&w!==6) n++; d.setDate(d.getDate()+1); }
  o.innerHTML = `工作日 <b>${n}</b> 天（不含周末）<br><span style="color:var(--muted);font-size:12px">Excel公式：=NETWORKDAYS(开始,结束)</span>`;
}
function calcPct(){
  const a = parseFloat(document.getElementById("pc1").value), b = parseFloat(document.getElementById("pc2").value);
  const o = document.getElementById("o_pc"); o.classList.remove("hidden");
  if(!b){ o.textContent = "请输入有效数字"; return; }
  o.innerHTML = `<b>${(a/b*100).toFixed(2)}%</b><br><span style="color:var(--muted);font-size:12px">Excel公式：=A2/B2，设为百分比格式</span>`;
}
function calcLoan(){
  const P = parseFloat(document.getElementById("lc1").value)||1000000, yr = parseFloat(document.getElementById("lc2").value)||3.8, ys = parseFloat(document.getElementById("lc3").value)||30;
  const r = yr/100/12, n = ys*12, m = P*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1);
  const o = document.getElementById("o_lc"); o.classList.remove("hidden");
  o.innerHTML = `月供 <b>¥${m.toFixed(2)}</b>，总利息 ¥${(m*n-P).toFixed(2)}<br><span style="color:var(--muted);font-size:12px">Excel公式：=PMT(年利率/12, 年限*12, 贷款额)</span>`;
}
function calcAge(){
  const a = new Date(document.getElementById("ac1").value), now = new Date();
  const o = document.getElementById("o_ac"); o.classList.remove("hidden");
  if(isNaN(a)){ o.textContent = "请选择出生日期"; return; }
  let y = now.getFullYear()-a.getFullYear(), m = now.getMonth()-a.getMonth(), d = now.getDate()-a.getDate();
  if(d<0){ m--; } if(m<0){ y--; m+=12; }
  o.innerHTML = `<b>${y}</b> 岁 ${m} 个月<br><span style="color:var(--muted);font-size:12px">Excel公式：=DATEDIF(出生日期,TODAY(),"Y")</span>`;
}
function copyCode(btn){
  const code = btn.parentNode.querySelector("code").innerText;
  navigator.clipboard.writeText(code).then(()=>{ btn.textContent="已复制"; setTimeout(()=>btn.textContent="复制",1500); });
}
