配类型])", "section": "func", "ref": "MATCH"}, {"id": "func-OFFSET", "type": "function", "column": "C04", "title": "OFFSET 偏移引用", "text": "OFFSET 偏移引用 查找与引用函数 以某个单元格为基准偏移取区域 OFFSET(基准单元格, 下移行数, 右移列数, [高度], [宽度])", "section": "func", "ref": "OFFSET"}, {"id": "func-ROW", "type": "function", "column": "C04", "title": "ROW 返回行号", "text": "ROW 返回行号 查找与引用函数 返回行号 ROW([单元格])", "section": "func", "ref": "ROW"}, {"id": "func-SORT", "type": "function", "column": "C04", "title": "SORT 动态排序", "text": "SORT 动态排序 查找与引用函数 动态数组：自动排序（新函数） SORT(数组, [排序列], [升/降序], [按行/列])", "section": "func", "ref": "SORT"}, {"id": "func-TRANSPOSE", "type": "function", "column": "C04", "title": "TRANSPOSE 行列转置", "text": "TRANSPOSE 行列转置 查找与引用函数 行列转置 TRANSPOSE(数组)", "section": "func", "ref": "TRANSPOSE"}, {"id": "func-UNIQUE", "type": "function", "column": "C04", "title": "UNIQUE 去重取唯一值", "text": "UNIQUE 去重取唯一值 查找与引用函数 动态数组：去重取唯一值（新函数） UNIQUE(数组, [按列], [只取唯一值])", "section": "func", "ref": "UNIQUE"}, {"id": "func-VLOOKUP", "type": "function", "column": "C04", "title": "VLOOKUP 纵向查找", "text": "VLOOKUP 纵向查找 查找与引用函数 纵向查找：按关键字在表格中找对应值 VLOOKUP(查找值, 表格区域, 返回第几列, [精确/模糊匹配])", "section": "func", "ref": "VLOOKUP"}, {"id": "func-XLOOKUP", "type": "function", "column": "C04", "title": "XLOOKUP 新一代查找", "text": "XLOOKUP 新一代查找 查找与引用函数 新一代查找：VLOOKUP 的完美替代品 XLOOKUP(查找值, 查找区域, 返回区域, [未找到时], [匹配模式], [搜索模式])", "section": "func", "ref": "XLOOKUP"}, {"id": "func-AVERAGEIF", "type": "function", "column": "C04", "title": "AVERAGEIF 条件平均", "text": "AVERAGEIF 条件平均 统计函数 条件平均：只对满足条件的求平均 AVERAGEIF(条件区域, 条件, [平均区域])", "section": "func", "ref": "AVERAGEIF"}, {"id": "func-AVERAGEIFS", "type": "function", "column": "C04", "title": "AVERAGEIFS 多条件平均", "text": "AVERAGEIFS 多条件平均 统计函数 多条件平均 AVERAGEIFS(平均区域, 条件区域1, 条件1, ...)", "section": "func", "ref": "AVERAGEIFS"}, {"id": "func-COUNT", "type": "function", "column": "C04", "title": "COUNT 计数", "text": "COUNT 计数 统计函数 计数：数一数有多少个数字 COUNT(数值1, [数值2], ...)", "section": "func", "ref": "COUNT"}, {"id": "func-COUNTA", "type": "function", "column": "C04", "title": "COUNTA 数非空单元格", "text": "COUNTA 数非空单元格 统计函数 计数：数一数有多少个非空单元格 COUNTA(数值1, [数值2], ...)", "section": "func", "ref": "COUNTA"}, {"id": "func-COUNTBLANK", "type": "function", "column": "C04", "title": "COUNTBLANK 数空单元格", "text": "COUNTBLANK 数空单元格 统计函数 数一数有多少个空单元格 COUNTBLANK(区域)", "section": "func", "ref": "COUNTBLANK"}, {"id": "func-COUNTIF", "type": "function", "column": "C04", "title": "COUNTIF 条件计数", "text": "COUNTIF 条件计数 统计函数 条件计数：满足条件的有几个 COUNTIF(条件区域, 条件)", "section": "func", "ref": "COUNTIF"}, {"id": "func-COUNTIFS", "type": "function", "column": "C04", "title": "COUNTIFS 多条件计数", "text": "COUNTIFS 多条件计数 统计函数 多条件计数 COUNTIFS(条件区域1, 条件1, [条件区域2, 条件2], ...)", "section": "func", "ref": "COUNTIFS"}, {"id": "func-LARGE", "type": "function", "column": "C04", "title": "LARGE 取第 N 大", "text": "LARGE 取第 N 大 统计函数 取第 N 大的值 LARGE(数组, k)", "section": "func", "ref": "LARGE"}, {"id": "func-MAX", "type": "function", "column": "C04", "title": "MAX 取最大值", "text": "MAX 取最大值 统计函数 取最大值 MAX(数值1, [数值2], ...)", "section": "func", "ref": "MAX"}, {"id": "func-MEDIAN", "type": "function", "column": "C04", "title": "MEDIAN 取中位数", "text": "MEDIAN 取中位数 统计函数 取中位数 MEDIAN(数值1, [数值2], ...)", "section": "func", "ref": "MEDIAN"}, {"id": "func-MIN", "type": "function", "column": "C04", "title": "MIN 取最小值", "text": "MIN 取最小值 统计函数 取最小值 MIN(数值1, [数值2], ...)", "section": "func", "ref": "MIN"}, {"id": "func-MODE", "type": "function", "column": "C04", "title": "MODE 取众数", "text": "MODE 取众数 统计函数 取众数 MODE(数值1, [数值2], ...)", "section": "func", "ref": "MODE"}, {"id": "func-RANK", "type": "function", "column": "C04", "title": "RANK 排名", "text": "RANK 排名 统计函数 排名 RANK(数值, 引用区域, [排序方式])", "section": "func", "ref": "RANK"}, {"id": "func-SMALL", "type": "function", "column": "C04", "title": "SMALL 取第 N 小", "text": "SMALL 取第 N 小 统计函数 取第 N 小的值 SMALL(数组, k)", "section": "func", "ref": "SMALL"}, {"id": "func-STDEV", "type": "function", "column": "C04", "title": "STDEV 标准差", "text": "STDEV 标准差 统计函数 标准差（样本） STDEV(数值1, [数值2], ...)", "section": "func", "ref": "STDEV"}, {"id": "func-VAR", "type": "function", "column": "C04", "title": "VAR 方差", "text": "VAR 方差 统计函数 方差（样本） VAR(数值1, [数值2], ...)", "section": "func", "ref": "VAR"}, {"id": "func-DB", "type": "function", "column": "C04", "title": "DB 余额递减折旧", "text": "DB 余额递减折旧 财务函数 余额递减折旧法 DB(原值, 残值, 使用年限, 第几年, [首年月份数])", "section": "func", "ref": "DB"}, {"id": "func-FV", "type": "function", "column": "C04", "title": "FV 终值", "text": "FV 终值 财务函数 终值：现在存钱未来值多少 FV(利率, 期数, 每期付款, [现值], [类型])", "section": "func", "ref": "FV"}, {"id": "func-IRR", "type": "function", "column": "C04", "title": "IRR 内部收益率", "text": "IRR 内部收益率 财务函数 内部收益率 IRR(现金流数组, [预估值])", "section": "func", "ref": "IRR"}, {"id": "func-NPER", "type": "function", "column": "C04", "title": "NPER 期数", "text": "NPER 期数 财务函数 期数 NPER(利率, 每期付款, 现值, [终值], [类型])", "section": "func", "ref": "NPER"}, {"id": "func-NPV", "type": "function", "column": "C04", "title": "NPV 净现值", "text": "NPV 净现值 财务函数 净现值：评估投资值不值 NPV(利率, 现金流1, [现金流2], ...)", "section": "func", "ref": "NPV"}, {"id": "func-PMT", "type": "function", "column": "C04", "title": "PMT 每期还款额", "text": "PMT 每期还款额 财务函数 计算每期还款额（房贷月供） PMT(利率, 期数, 现值, [终值], [类型])", "section": "func", "ref": "PMT"}, {"id": "func-PV", "type": "function", "column": "C04", "title": "PV 现值", "text": "PV 现值 财务函数 现值：未来的钱现在值多少 PV(利率, 期数, 每期付款, [终值], [类型])", "section": "func", "ref": "PV"}, {"id": "func-RATE", "type": "function", "column": "C04", "title": "RATE 利率", "text": "RATE 利率 财务函数 利率 RATE(期数, 每期付款, 现值, [终值], [类型], [预估值])", "section": "func", "ref": "RATE"}, {"id": "func-SLN", "type": "function", "column": "C04", "title": "SLN 直线折旧", "text": "SLN 直线折旧 财务函数 直线折旧法 SLN(原值, 残值, 使用年限)", "section": "func", "ref": "SLN"}, {"id": "tut-interface", "type": "tutorial", "column": "C01", "title": "认识 Excel 界面", "text": "认识 Excel 界面 标题栏→功能区（选项卡+命令组）→编辑栏（显示/输入公式）→工作表区（行列交叉为单元格，如 B3）→工作表标签（底部切换/新增）→状态栏（快速看求和/平均）。记住：名称框可直接输入 B100 跳转，编辑栏是公式的家。 ", "section": "tut", "ref": "interface"}, {"id": "tut-enter", "type": "tutorial", "column": "C01", "title": "数据录入技巧", "text": "数据录入技巧 Enter 下移、Tab 右移、Shift+Enter 上移。选中区域后按 Enter 在区域内循环。Ctrl+Enter 批量填充选中区域。Alt+↓ 调出下拉历史。Ctrl+; 输入今天日期，Ctrl+Shift+; 输入当前时间。 ", "section": "tut", "ref": "enter"}, {"id": "tut-format", "type": "tutorial", "column": "C01", "title": "单元格格式", "text": "单元格格式 数字格式决定显示方式：常规/数值/货币/百分比/日期。Ctrl+1 打开设置单元格格式对话框。对齐、字体、边框、填充都在「开始」选项卡。格式刷（双击可多次使用）是排版神器。 ", "section": "tut", "ref": "format"}, {"id": "tut-sortfilter", "type": "tutorial", "column": "C01", "title": "排序与筛选", "text": "排序与筛选 筛选（Ctrl+Shift+L）：按条件只显示想要的行，箭头图标点开设条件。排序：按某列升序/降序，多关键字排序用「自定义排序」。注意：排序前先选中整个数据区域，否则会错乱！ ", "section": "tut", "ref": "sortfilter"}, {"id": "tut-print", "type": "tutorial", "column": "C01", "title": "打印设置", "text": "打印设置 页面布局→打印标题（顶端标题行每页重复）→设置打印区域→分页预览拖蓝线。页眉页脚加页码。打印前一定用「打印预览」检查。 ", "section": "tut", "ref": "print"}, {"id": "tut-pivottable", "type": "tutorial", "column": "C08", "title": "数据透视表", "text": "数据透视表 1. 为什么用数据透视表 想象你有一张 5000 行的销售明细：日期、销售员、产品、金额。老板问：\"每个销售员每个月的销售额是多少？\" - 不用透视表：写一堆 SUMIFS，还要手动列出所有销售员和月份，容易漏。 - 用透视表：**拖三下鼠标，3 秒出结果**。源数据增删行后点一下\"刷新\"即可更新。 核心思想：**把\"分组+聚合\"这个动作交给 Excel**，你只负责告诉它\"按什么分组、对什么求和\"。 2. 创建步骤 1. 点击源数据区域任意单元格（确保数据是规范的二维表：第一行是标题行，无合并单元格、无空行空列）。 2. 「插入」→「数据透视表」。 3. 选择放置位置：建议选\"新工作表\"，报表和源数据分开更清爽。 4. 右侧出现「数据透视表字段」窗格，开始拖字段。 > 数据规范是透视表好用的前提：一列只放一种含义的数据，日期列全是日期，不要出现\"合计\"行混在明细里。 3. 四个区域详解 操作要点： - 同一字段可以拖到多个区域（如\"日期\"同时拖到行和筛选器）。 - 拖错了直接把字段拖出窗格即可移除。 - 字段顺序决定层级：行区域里\"年份\"在上、\"月份\"在下，就是先按年再按月展开。 4. 值汇总方式 默认对数字字段\"求和\"，对文本字段\"计数\"。右键值字段 →「值字段设置」可切换： **显示方式**（同一对话框的「值显示方式」选项卡，更实用）： - **占总和的百分比**", "section": "tut", "ref": "pivottable"}, {"id": "tut-array-formulas", "type": "tutorial", "column": "C03", "title": "数组公式", "text": "数组公式 1. 先理解\"数组\"是什么 数组就是\"一串值\"。`{1,2,3}` 是横向数组，`{1;2;3}` 是纵向数组（分号换行）。Excel 公式本来就是按数组思维设计的： [代码示例] 这行公式的含义是\"把 A1、A2、A3 每个都乘以 2\"，得到 `{A1*2, A2*2, A3*2}`。普通公式只显示第一个结果，数组公式则能把全部结果\"摊开\"显示。 2. 传统数组公式（Ctrl+Shift+Enter） 在旧版本 Excel 里，想让公式返回多个结果： 1. 先选中**多个**单元格（结果要占几格就选几格）。 2. 输入公式，如 `=A1:A3*2`。 3. 按 **Ctrl+Shift+Enter**（不是只按 Enter）。 公式两端会自动加上花括号 `{=A1:A3*2}`，表示这是数组公式。**花括号是 Excel 自己加的，手工输入无效。** 经典用途——多条件计数（COUNTIFS 出现之前的写法，现在仍有人用）： [代码示例] 原理：`(A2:A100=\"销售部\")` 得到一串 TRUE/FALSE，`(B2:B100>5000)` 得到另一串，两串相乘（TRUE=1、FALSE=0），只有两个条件都成立的位置是 1，SUM 加总即为同时满足的人数。 3. 动态数组：新时代的写法 Microsoft 365 引入动态数组后，**只按 Enter**，结果自动", "section": "tut", "ref": "array-formulas"}, {"id": "tut-powerquery", "type": "tutorial", "column": "C09", "title": "Power Query", "text": "Power Query 1. Power Query 是什么 它是 Excel 里的一个**数据加工流水线**：你把\"获取→清洗→整理\"的每一步操作点一遍，Power Query 会把步骤记下来。下个月拿到新的源文件，点一下\"刷新\"，所有步骤自动重跑一遍。 和公式的区别： - 公式是\"算出一个结果\"，Power Query 是\"产出一张干净的表\"。 - 公式适合行内计算；Power Query 适合**结构性整理**：拆分列、转置、合并文件、逆透视——这些用公式写会很痛苦。 核心观念：**你点的每一步都会变成一行 M 代码**，记录在右侧「应用的步骤」里。可以回头修改、删除、调整顺序。 2. 获取数据 「数据」→「获取数据」，来源非常多： 选中来源后点「转换数据」进入 Power Query 编辑器，开始清洗。 3. 常用清洗步骤 ### 拆分列 一列里混着\"省-市-区\"？选中列 →「拆分列」→「按分隔符」→ 输入 `-`。一列变三列。也可以按固定宽度、按大小写转换处拆分。 ### 替换值 选中列 → 右键 →「替换值」：把\"男/女\"换成\"M/F\"，把\"N/A\"换成空。支持整列批量。 ### 填充 导出的报表经常只有第一行有\"部门\"名，下面是空的（合并单元格拆开后的样子）。选中列 →「转换」→「填充」→「向下」。空单元格自动填上上方的值，透视表分组的前提。 ### 更改类型 每列顶", "section": "tut", "ref": "powerquery"}, {"id": "tut-conditional-formatting", "type": "tutorial", "column": "C06", "title": "条件格式", "text": "条件格式 1. 核心原理 条件格式 = **\"规则\" + \"格式\"**。规则判断每个单元格\"达不达标\"，达标就套用你设的格式（红底、加粗等）。 关键理解：**格式是\"活\"的**。单元格的值变了，格式自动跟着变——和你手工涂色有本质区别。删掉规则（「开始」→「条件格式」→「清除规则」）就恢复原样，不破坏数据。 操作入口：「开始」→「条件格式」。先**选中要应用的区域**再设规则，这点最重要。 2. 内置规则：突出显示单元格规则 最常用的一类：「条件格式」→「突出显示单元格规则」： 每个规则点开后选格式（浅红填充深红文本等），也可以点「自定义格式」自己配。 3. 数据条：在单元格里画\"进度条\" 「条件格式」→「数据条」→ 选一种颜色。数值越大，条越长。 - 适合：完成率、销售额对比——一眼看出谁高谁低，不用看数字。 - 技巧：勾选「仅显示数据条」（管理规则→编辑规则），隐藏数字，只留条形，更像仪表盘。 - 注意：数据条的长度是按**选中区域内的最大/最小值**自动缩放的，区域不同不能直接比长短。 4. 色阶：热力图 「条件格式」→「色阶」→ 如\"绿-黄-红\"。数值映射到颜色渐变，**适合看分布**： - 12 个月的销售热力图，旺季月份自动变红。 - 学生成绩表，一眼看出哪科普遍偏低。 双色刻度和三色刻度：三色多一个中间色，适合\"中间值也想区分\"的场景。 5. 图标集：红绿灯 「条件格", "section": "tut", "ref": "conditional-formatting"}, {"id": "tut-data-validation", "type": "tutorial", "column": "C05", "title": "数据验证", "text": "数据验证 1. 数据验证是什么 「数据」→「数据验证」。它在**输入的那一刻**拦截不合法的值，而不是事后检查。 三个可配置项： 1. **设置**：允许输入什么（整数/小数/日期/序列/文本长度…）。 2. **输入信息**：选中单元格时弹出的提示（\"请输入 1-100 的整数\"）——主动引导。 3. **出错警告**：输错时的弹窗，样式可选\"停止\"（硬拦截）/\"警告\"（可继续）/\"信息\"（仅提醒）。 2. 下拉列表（最常用） ### 固定选项 选中单元格 → 数据验证 → 允许「序列」→ 来源填 `男,女`（中文逗号不行，必须用**英文逗号**分隔）。单元格右侧出现下拉箭头。 ### 引用区域 来源填 `=$F$2:$F$10`（部门清单）。清单变了下拉自动变。建议把清单放在单独的\"基础数据\"表，隐藏起来。 ### 动态二级联动：选\"省\"后\"市\"跟着变 这是数据验证的经典难题，标准解法是 **INDIRECT + 命名区域**： 1. 准备对照表：A 列是省名（广东、江苏…），B 列开始每列是一个省的城市，第一行是省名。 2. 给每个省的城市区域**定义名称**：选中广东的城市 → 名称框输入 `广东` → 回车。注意名称不能含空格，省名有空格先替换。 3. 输入限制 自定义公式的心法和条件格式一样：**相对左上角写**。选中 B2:B100 后公式写 `=LEN(B2)=11", "section": "tut", "ref": "data-validation"}, {"id": "tut-pivot_adv-0", "type": "tutorial", "column": "C08", "title": "基础操作", "text": "基础操作 选中数据→插入→数据透视表。四个区：行、列、值、筛选。值字段默认求和，右键可改计数/平均/最大值。 ", "section": "tut", "ref": "pivot_adv-0"}, {"id": "tut-pivot_adv-1", "type": "tutorial", "column": "C08", "title": "分组统计", "text": "分组统计 日期右键→组合：按年/季度/月分组。数字右键→组合：按区间分组（如成绩段 60-70/70-80）。 ", "section": "tut", "ref": "pivot_adv-1"}, {"id": "tut-pivot_adv-2", "type": "tutorial", "column": "C08", "title": "多维分析", "text": "多维分析 行放「区域」、列放「季度」、值放「销售额」，一眼看交叉汇总。值显示方式→差异/百分比，做同比环比。 ", "section": "tut", "ref": "pivot_adv-2"}, {"id": "tut-pivot_adv-3", "type": "tutorial", "column": "C08", "title": "切片器", "text": "切片器 插入切片器→选字段，点按钮即筛选，多表联动（报表连接）。比筛选直观 10 倍，汇报必备。 ", "section": "tut", "ref": "pivot_adv-3"}, {"id": "tut-pivot_adv-4", "type": "tutorial", "column": "C08", "title": "时间轴", "text": "时间轴 日期字段专用筛选器，按年/季度/月/日切换，比切片器更适合时间。 ", "section": "tut", "ref": "pivot_adv-4"}, {"id": "tut-pivot_adv-5", "type": "tutorial", "column": "C08", "title": "数据模型", "text": "数据模型 多表关联：把订单表+产品表都添加到数据模型，用字段关联，一张透视表跨表分析。Power Pivot 的地基。 ", "section": "tut", "ref": "pivot_adv-5"}, {"id": "tut-pq_adv-0", "type": "tutorial", "column": "C09", "title": "导入 CSV", "text": "导入 CSV 数据→获取数据→从文本/CSV。乱码？改编码为 65001（UTF-8）或 936（GBK）。 ", "section": "tut", "ref": "pq_adv-0"}, {"id": "tut-pq_adv-1", "type": "tutorial", "column": "C09", "title": "导入网页", "text": "导入网页 数据→自网站→粘贴 URL。网页表格结构变化时需重新检查步骤。 ", "section": "tut", "ref": "pq_adv-1"}, {"id": "tut-pq_adv-2", "type": "tutorial", "column": "C09", "title": "数据清洗", "text": "数据清洗 删空行、替换值、填充、修剪、分列、更改类型。每一步都记录在右侧「应用的步骤」，可回退。 ", "section": "tut", "ref": "pq_adv-2"}, {"id": "tut-pq_adv-3", "type": "tutorial", "column": "C09", "title": "合并表", "text": "合并表 追加查询=上下堆叠（多月数据合并）；合并查询=左右连接（VLOOKUP 的批量版）。 ", "section": "tut", "ref": "pq_adv-3"}, {"id": "tut-pq_adv-4", "type": "tutorial", "column": "C09", "title": "拆分列", "text": "拆分列 按分隔符/字符数拆分。\"2026-10-01\" 按 \"-\" 拆成年/月/日三列。 ", "section": "tut", "ref": "pq_adv-4"}, {"id": "tut-pq_adv-5", "type": "tutorial", "column": "C09", "title": "自动刷新", "text": "自动刷新 关闭并上载后，源文件更新→右键刷新。还可设置打开文件自动刷新：数据→查询属性。 ", "section": "tut", "ref": "pq_adv-5"}, {"id": "tut-ppivot-0", "type": "tutorial", "column": "C10", "title": "数据模型", "text": "数据模型 Power Pivot→添加到数据模型。多表不用 VLOOKUP，用关系关联，百万行不卡。 ", "section": "tut", "ref": "ppivot-0"}, {"id": "tut-ppivot-1", "type": "tutorial", "column": "C10", "title": "多表关联", "text": "多表关联 关系视图拖线连主外键。一对多：产品表（1）→订单表（多）。 ", "section": "tut", "ref": "ppivot-1"}, {"id": "tut-ppivot-2", "type": "tutorial", "column": "C10", "title": "DAX 公式入门", "text": "DAX 公式入门 DAX 长得像 Excel 函数但思维是列式。SUM(表[列])、CALCULATE(表达式, 筛选)、RELATED(取关联表字段)。 ", "section": "tut", "ref": "ppivot-2"}, {"id": "tut-ppivot-3", "type": "tutorial", "column": "C10", "title": "常用 DAX", "text": "常用 DAX 总销售额 =SUM(订单[金额]) 当年累计 =CALCULATE([总销售额], DATESYTD(日期表[日期])) 同比 =DIVIDE([总销售额]-[去年同期], [去年同期]) ", "section": "tut", "ref": "ppivot-3"}, {"id": "tut-ppivot-4", "type": "tutorial", "column": "C10", "title": "KPI 指标", "text": "KPI 指标 在数据模型中建度量值：销售额、利润率、完成率。度量值随切片器自动重算，一处定义处处用。 ", "section": "tut", "ref": "ppivot-4"}, {"id": "tut-cfmt-0", "type": "tutorial", "column": "C06", "title": "颜色标记", "text": "颜色标记 开始→条件格式→突出显示单元格规则：大于/小于/介于/等于，自动上色。 ", "section": "tut", "ref": "cfmt-0"}, {"id": "tut-cfmt-1", "type": "tutorial", "column": "C06", "title": "数据条", "text": "数据条 在单元格内画横向条形图，数值大小一目了然。适合业绩对比。 ", "section": "tut", "ref": "cfmt-1"}, {"id": "tut-cfmt-2", "type": "tutorial", "column": "C06", "title": "图标集", "text": "图标集 红绿灯/箭头/旗帜，按阈值自动打标。管理驾驶舱常用。 ", "section": "tut", "ref": "cfmt-2"}, {"id": "tut-cfmt-3", "type": "tutorial", "column": "C06", "title": "自定义公式", "text": "自定义公式 新建规则→使用公式。注意 $ 锁定：=$B2>100 整行变色（选中整行时列锁定行不锁定）。 ", "section": "tut", "ref": "cfmt-3"}, {"id": "tut-cfmt-4", "type": "tutorial", "column": "C06", "title": "案例：自动标红逾期", "text": "案例：自动标红逾期 =AND($E2<TODAY(),$G2<>\"已完成\") → 逾期未完成的整行变红。 ", "section": "tut", "ref": "cfmt-4"}, {"id": "tut-cfmt-5", "type": "tutorial", "column": "C06", "title": "案例：高亮重复", "text": "案例：高亮重复 选中区域→条件格式→突出显示→重复值。或公式 =COUNTIF($A:$A,$A2)>1 自定义颜色。 ", "section": "tut", "ref": "cfmt-5"}, {"id": "tut-dval-0", "type": "tutorial", "column": "C05", "title": "下拉菜单", "text": "下拉菜单 数据→数据验证→序列，来源输入：男,女（英文逗号）。或引用一列区域。 ", "section": "tut", "ref": "dval-0"}, {"id": "tut-dval-1", "type": "tutorial", "column": "C05", "title": "联动下拉框", "text": "联动下拉框 一级菜单选「省份」→二级自动出该省城市。做法：定义名称+INDIRECT($A2)。先做各省名单，再建一级下拉，二级来源 =INDIRECT(A2)。 ", "section": "tut", "ref": "dval-1"}, {"id": "tut-dval-2", "type": "tutorial", "column": "C05", "title": "日期限制", "text": "日期限制 数据验证→日期→介于 2026-1-1 到 2026-12-31，只能输今年日期。 ", "section": "tut", "ref": "dval-2"}, {"id": "tut-dval-3", "type": "tutorial", "column": "C05", "title": "输入规则", "text": "输入规则 整数/小数/文本长度：手机号设文本长度=11；年龄设整数介于 18-65。出错警告可自定义提示语。 ", "section": "tut", "ref": "dval-3"}, {"id": "tut-dval-4", "type": "tutorial", "column": "C05", "title": "圈释无效数据", "text": "圈释无效数据 数据→数据验证→圈释无效数据，已有违规的一眼现形。 ", "section": "tut", "ref": "dval-4"}, {"id": "tut-choose", "type": "tutorial", "column": "C07", "title": "图表类型选择指南", "text": "图表类型选择指南 比较大小用柱状图/条形图，看趋势用折线图，看占比用饼图/环形图（类别≤6），看关系用散点图/气泡图，看分布用直方图/箱线图。双坐标用组合图。记住：一图只讲一件事。 ", "section": "tut", "ref": "choose"}, {"id": "tut-make", "type": "tutorial", "column": "C07", "title": "图表制作步骤", "text": "图表制作步骤 选中数据→插入→选图表类型→切换行列（数据反了就点它）→添加数据标签→调坐标轴。数据源：右键→选择数据，可增删系列。 ", "section": "tut", "ref": "make"}, {"id": "tut-beauty", "type": "tutorial", "column": "C07", "title": "图表美化技巧", "text": "图表美化技巧 删网格线、删图例（直接标数据）、统一配色（莫兰迪/商务蓝）、加粗标题讲结论、坐标轴从 0 开始（柱状图）。少即是多：每删一个元素，图表清晰一度。 ", "section": "tut", "ref": "beauty"}, {"id": "tut-dynamic", "type": "tutorial", "column": "C07", "title": "动态图表", "text": "动态图表 下拉菜单联动图表：数据验证做下拉→INDEX+MATCH 取数→图表数据源引用。用复选框控制系列显示。用 OFFSET 做动态区域，新增数据自动进图。 ", "section": "tut", "ref": "dynamic"}, {"id": "tut-scenario-0", "type": "tutorial", "column": "C13", "title": "财务报销统计", "text": "财务报销统计 每月上百条报销记录，自动汇总到部门/类别 ", "section": "tut", "ref": "scenario-0"}, {"id": "tut-scenario-1", "type": "tutorial", "column": "C13", "title": "销售业绩分析", "text": "销售业绩分析 销售明细表 → 自动排名、环比、Top10 ", "section": "tut", "ref": "scenario-1"}, {"id": "tut-scenario-2", "type": "tutorial", "column": "C13", "title": "人事考勤统计", "text": "人事考勤统计 打卡记录 → 迟到/早退/缺勤自动统计 ", "section": "tut", "ref": "scenario-2"}, {"id": "tut-scenario-3", "type": "tutorial", "column": "C13", "title": "库存预警管理", "text": "库存预警管理 出入库流水 → 实时库存 + 低库存预警 ", "section": "tut", "ref": "scenario-3"}, {"id": "tut-scenario-4", "type": "tutorial", "column": "C13", "title": "经营仪表盘", "text": "经营仪表盘 一页看懂公司经营：KPI 卡片 + 趋势图 + 明细 ", "section": "tut", "ref": "scenario-4"}, {"id": "tut-basics-01-getting-started", "type": "tutorial", "column": "C01", "title": "认识 Excel：界面、工作簿与工作表", "text": "认识 Excel：界面、工作簿与工作表 **工作簿与工作表**：一个 Excel 文件就是一个工作簿（Workbook），扩展名通常是 `.xlsx`；工作簿里可以放多张工作表（Worksheet），底部的工作表标签就是各张表的入口。日常说的\"打开一张表\"，多数时候是指打开一个工作簿里的一张工作表。 **功能区（Ribbon）**：窗口顶部的带状工具栏，由\"选项卡＋命令组\"构成。\"开始\"选项卡放最常用的字体、对齐、数字格式；\"插入\"放图表、数据透视表；\"公式\"放函数库；\"数据\"放排序、筛选、分列、获取数据。找不到某个命令时，先想它属于哪类操作，再去对应选项卡找，比满屏乱点快得多。 **单元格与名称框**：行列交叉处就是单元格，用列字母＋行号定位，如 `B3` 表示 B 列第 3 行。左上角的名称框显示当前选中单元格的地址，直接输入 `D20` 回车即可跳转到 D20；输入 `B2:B10` 回车可一次选中一个区域。 **文件格式**：`.xlsx` 是不含宏的常规工作簿；`.xlsm` 是启用宏的工作簿，含 VBA 代码时必须存为此格式，否则宏会被丢弃；`.xls` 是 2003 及更早版本的旧格式，功能受限，新文件不要用它；`.csv` 只有纯文本数据，无格式、无公式、无多表，导出给其他系统时常用。 **视图与窗口**：普通视图是日常编辑视图；页面布局视图按打印效果显示，能看到页", "section": "tut", "ref": "basics-01-getting-started"}, {"id": "tut-basics-02-data-entry", "type": "tutorial", "column": "C01", "title": "数据录入与编辑：输入技巧、填充柄与复制粘贴", "text": "数据录入与编辑：输入技巧、填充柄与复制粘贴 **自动识别**：Excel 按输入内容猜类型——纯数字进数值、带 `-` 或 `/` 的进日期、其余进文本。身份证号、银行卡号这类长数字串会被当成数值并用科学计数法显示，必须先把单元格设为文本格式，或先输入英文单引号 `'` 再输数字。 **填充柄**：选中单元格右下角的小方块就是填充柄，拖动它可向下/向右复制或按规律填充。拖动后右下角会出现\"自动填充选项\"小图标，可切换\"复制单元格\"、\"填充序列\"、\"仅填充格式\"等模式。 **复制粘贴专项**：`Ctrl + C` 复制的是内容＋格式＋公式。只想粘其中一部分时用\"选择性粘贴\"（右键→选择性粘贴，或开始→粘贴下拉）：\"数值\"只粘结果不粘公式，\"格式\"只粘样式，\"转置\"把行列互换。 **查找替换**：`Ctrl + H` 打开查找替换，可批量改错别字、统一部门名。点\"选项\"可限定\"单元格匹配\"（整格相等才换，避免\"销售部\"被\"销售\"替换误伤）与\"区分大小写\"。`Ctrl + F` 只查找不替换。 **定位条件**：`F5`→\"定位条件\"可一次选中某类单元格：全部空值（批量填\"待补\"）、全部公式（检查公式区）、全部常量。配合 `Ctrl + Enter` 可对所有选中格一次填入相同内容。 2. 基础概念 **自动识别**：Excel 按输入内容猜类型——纯数字进数值、带 `-` 或 `/` ", "section": "tut", "ref": "basics-02-data-entry"}, {"id": "tut-basics-03-cells-ranges", "type": "tutorial", "column": "C01", "title": "单元格与区域操作：选定、行列、合并与名称框", "text": "单元格与区域操作：选定、行列、合并与名称框 **区域（Range）**：一组连续单元格，用左上角:右下角表示，如 `B2:D10`。多数操作（求和、排序、复制）都是以区域为单位进行的；先选对区域，再执行操作，是 Excel 操作的第一性原理。 **选定技巧**：点列标选整列、点行号选整行；`Ctrl + A` 在数据区按一次选当前连续区域，按两次选全表；`Ctrl + Shift + 方向键` 扩展到数据边缘，是选中整列数据的神器；`Ctrl + 点击` 加选不连续区域；`Ctrl + Shift + *`（数字 8 上档键）选中当前数据区域。 **行列操作**：右键行号/列标可插入、删除、隐藏行列。插入行会把公式引用自动下移（引用跟着数据走），删除行则可能让引用该行的公式变成 `#REF!`——删行前先检查有没有公式引用它。 **合并单元格**：开始→合并后居中。合并后只有左上角单元格保留内容，其余格的内容会被丢弃；合并过的区域不能直接排序、不能用填充柄、透视表也不认它。标题行合并一次尚可，数据区不要合并。 **名称框跳转**：名称框输入地址回车即跳转；输入区域如 `B2:D100` 回车即选中该区域；输入已定义名称（如\"销售数据\"）可跳到命名区域。配合 `Ctrl + End`（已用区域右下角）与 `Ctrl + Home`（回 A1），大表导航不用滚轮。 2. 基础概念 **", "section": "tut", "ref": "basics-03-cells-ranges"}, {"id": "tut-basics-05-versions", "type": "tutorial", "column": "C01", "title": "版本与兼容：从 Excel 2003 到 Microsoft 365", "text": "版本与兼容：从 Excel 2003 到 Microsoft 365 **版本沿革**：Excel 2003 是最后一个 `.xls` 时代版本；2007 引入功能区与 `.xlsx`；2010 加入切片器与 Power Pivot；2013 加入快速填充与时间线；2016 加入 Power Query 内置与 6 个新函数；2019 新增 IFS、SWITCH、CONCAT、TEXTJOIN、MAXIFS、MINIFS；2021 新增 XLOOKUP 与动态数组函数 FILTER、SORT、UNIQUE；Microsoft 365 在此基础上持续新增 TEXTSPLIT、TEXTBEFORE、LAMBDA 等，且只有 365 能用最新函数。 **一个常见误标**：IFS、SWITCH、CONCAT、TEXTJOIN 是 Excel 2019 新增，不是 2016。很多旧教程写\"2016+\"是错的——在 Excel 2016 打开含 IFS 的文件会报 `#NAME?`。本站函数库的版本字段以 `versions.func_ver` 为准：IFS、SWITCH、TEXTJOIN、CONCAT、MAXIFS、MINIFS 均为 2019／365；XLOOKUP、FILTER、SORT、UNIQUE 为 2021／365；TEXTSPLIT、TEXTBEFORE、TEXTAFTER、L", "section": "tut", "ref": "basics-05-versions"}, {"id": "tut-formatting-01-number-format", "type": "tutorial", "column": "C02", "title": "数字格式：常规、货币、日期、百分比与自定义格式代码", "text": "数字格式：常规、货币、日期、百分比与自定义格式代码 **值与格式分离**：单元格里存的是值（如 0.25），显示的是格式（如 25%）。改格式只改变观感，不改变参与计算的值——`0.25` 显示成 25% 后，求和结果不变。这是理解数字格式的第一性原理，也是\"百分比放大 100 倍\"事故的根源：先输入 25 再设百分比格式，Excel 会把 25 理解成 2500%。 **常规格式**：默认格式，数字按原样显示，超过 11 位的大数字自动变科学计数法。身份证号、银行卡号变科学计数法，就是常规格式在作怪——解法是先设文本格式再输入。 **货币与会计专用**：货币格式给数字加 ¥ 符号与千分位（如 ¥1,234.56）；会计专用格式把 ¥ 符号左对齐、小数点对齐，适合财务报表。两者都不改变数值本身。 **日期格式**：Excel 的日期本质是序列值（1900-01-01 是 1，2026-11-09 是 45961），显示格式决定它看起来是\"2026/11/9\"还是\"2026 年 11 月 9 日\"。日期能直接加减（`2026-11-09 减 2026-11-02 = 7`），靠的就是序列值。 **自定义格式代码**：格式代码分四段\"正数;负数;零值;文本\"，如 `#,##0.00;[红色]-#,##0.00;\"-\"` 表示正数带千分位两位小数、负数红色带减号、零显示一个短横。常用占位", "section": "tut", "ref": "formatting-01-number-format"}, {"id": "tut-formatting-02-font-alignment", "type": "tutorial", "column": "C02", "title": "字体与对齐：字号颜色、对齐缩进与自动换行", "text": "字体与对齐：字号颜色、对齐缩进与自动换行 **字体三要素**：字体、字号、颜色。报表惯例：标题 16 号加粗、表头 11 号加粗配填充色、数据 11 号常规。同一张表字体不超过两种，字号不超过三个档次，否则显乱。 **对齐**：水平对齐分左对齐（文本默认）、居中、右对齐（数值默认）；垂直对齐分靠上、居中、靠下。数字右对齐、文本左对齐、标题居中，是表格的默认美学；跨列居中（设置单元格格式→对齐→水平对齐→跨列居中）能让标题居中又不破坏数据区结构，比合并单元格更安全。 **缩进**：增加缩进量可以把层级关系可视化（如\"销售部\"下一级\"华东区\"缩进一格），比用空格对齐可靠——空格缩进在换字体后会错位。 **自动换行**：长文本超出列宽时，自动换行让它在格内折成多行显示，同时行高自动撑高；配合\"缩小字体填充\"可在不换行时把字缩到能放下。两者不要同时开。 **格式刷**：选中带格式的格点格式刷，再点目标格，只刷格式不刷内容；双击格式刷可连续刷多个区域，按 Esc 退出。格式刷是\"复制格式\"最快的方式，比逐项点工具栏快一个数量级。 2. 基础概念 **字体三要素**：字体、字号、颜色。报表惯例：标题 16 号加粗、表头 11 号加粗配填充色、数据 11 号常规。同一张表字体不超过两种，字号不超过三个档次，否则显乱。 **对齐**：水平对齐分左对齐（文本默认）、居中、右对齐（数值默认）；垂直对齐", "section": "tut", "ref": "formatting-02-font-alignment"}, {"id": "tut-formatting-03-border-fill", "type": "tutorial", "column": "C02", "title": "边框与填充：边框样式、填充图案与网格线", "text": "边框与填充：边框样式、填充图案与网格线 **边框三层级**：外边框（粗线，框住整张表）、内边框（细线，分隔行列）、合计行顶边框（双线或粗线，标出合计）。一张报表通常只需要这三层：外粗内细、合计加粗，线多了反而乱。 **填充色**：表头浅灰、合计行浅黄、异常行浅红，是报表的通用语义。填充只改背景，不改值；隔行变色（斑马纹）能显著降低看错行的概率，大表必备。 **网格线 vs 边框**：网格线是屏幕上的浅灰虚线、只辅助编辑，打印时默认不出来；边框是实打实的格式，打印会出来。视图→取消勾选\"网格线\"可让表格在屏幕上也干净，靠边框来分隔。 **套用表格格式**：开始→套用表格格式，选一个样式一键生成带边框、表头色、隔行变色的表格。它与超级表（Ctrl + T）是两回事：前者只刷格式，后者还带筛选与结构化引用。本篇只讲格式，超级表见下一篇。 2. 基础概念 **边框三层级**：外边框（粗线，框住整张表）、内边框（细线，分隔行列）、合计行顶边框（双线或粗线，标出合计）。一张报表通常只需要这三层：外粗内细、合计加粗，线多了反而乱。 **填充色**：表头浅灰、合计行浅黄、异常行浅红，是报表的通用语义。填充只改背景，不改值；隔行变色（斑马纹）能显著降低看错行的概率，大表必备。 **网格线 vs 边框**：网格线是屏幕上的浅灰虚线、只辅助编辑，打印时默认不出来；边框是实打实的格式，打印会出来。视图→取", "section": "tut", "ref": "formatting-03-border-fill"}, {"id": "tut-formatting-04-styles-themes", "type": "tutorial", "column": "C02", "title": "样式与主题：单元格样式、套用表格格式与主题配色", "text": "样式与主题：单元格样式、套用表格格式与主题配色 **单元格样式**：开始→单元格样式，内置\"标题\"、\"强调\"、\"好\"（绿底）、\"差\"（红底）、\"适中\"（黄底）等语义样式。点一下即套用一整套字体、填充与边框，比逐项点工具栏快；语义样式还能让\"好/差\"一眼可辨。 **套用表格格式**：选一个样式，一键生成带表头色、隔行变色、首列加粗的表格。它只刷格式，不带筛选功能；想要筛选与结构化引用，改用 `Ctrl + T` 创建超级表（见下一篇）。 **自定义样式**：开始→单元格样式→新建单元格样式，把\"公司红标题\"存成样式，全工作簿点一下即用。样式存在工作簿里，换电脑、发给别人都跟着走。 **主题**：页面布局→主题，一键换全表的配色方案与字体组合（标题字体＋正文字体）。主题色是联动的：用主题色做的填充与字体，换主题后自动跟着变；用标准色做的则不变。做公司模板时一律用主题色，换 VI 色一次改全套。 2. 基础概念 **单元格样式**：开始→单元格样式，内置\"标题\"、\"强调\"、\"好\"（绿底）、\"差\"（红底）、\"适中\"（黄底）等语义样式。点一下即套用一整套字体、填充与边框，比逐项点工具栏快；语义样式还能让\"好/差\"一眼可辨。 **套用表格格式**：选一个样式，一键生成带表头色、隔行变色、首列加粗的表格。它只刷格式，不带筛选功能；想要筛选与结构化引用，改用 `Ctrl + T` 创建超级表（见下", "section": "tut", "ref": "formatting-04-styles-themes"}, {"id": "tut-formatting-05-tables", "type": "tutorial", "column": "C02", "title": "超级表：创建、结构化引用、表样式与汇总行", "text": "超级表：创建、结构化引用、表样式与汇总行 **超级表（结构化表格）**：`Ctrl + T` 创建的带格式、带筛选、带结构化引用的智能表格。它与普通区域的根本区别是\"表知道自己的边界\"：新增一行，格式、公式、汇总行自动扩展；删除一行，引用自动收缩。 **结构化引用**：超级表里的公式不用 `B2:B6` 这种地址，改用表名加列名，如 `=SUM(表1[金额])`。好处是公式自带语义（\"对表 1 的金额列求和\"），新增行后引用范围自动扩大，不用改公式；跨表引用时也不怕插行错位。 **表样式与汇总行**：表设计选项卡可换样式、开关筛选按钮、开关首行/末行、开汇总行。汇总行在表底加一行，每列可下拉选求和、计数、平均值、最大值等，一键出合计，不用手写公式。 **表名管理**：表名默认是\"表1\"、\"表2\"，应在表设计选项卡改成有意义的名字（如\"销售明细\"），结构化引用才可读。表名不能与单元格地址重名（如不能叫 A1），不能含空格。 **与数据管理的分工**：超级表本身归属本栏目（C02-L2-5）；数据管理栏目（C05-L2-3）只做交叉引用，不重复建内容。排序筛选、数据清洗在超级表上操作与普通区域一致，但体验更好（筛选箭头常驻、新增行自动纳入）。 2. 基础概念 **超级表（结构化表格）**：`Ctrl + T` 创建的带格式、带筛选、带结构化引用的智能表格。它与普通区域的根本区别是\"表知", "section": "tut", "ref": "formatting-05-tables"}, {"id": "tut-formulas-01-formula-basics", "type": "tutorial", "column": "C03", "title": "公式入门：公式结构、运算符与输入编辑", "text": "公式入门：公式结构、运算符与输入编辑 **公式结构**：所有公式都以 `=` 开头，如 `=B2+C2`。等号后面是操作数（数字、单元格引用、函数结果）与运算符的组合。`SUM`、`IF` 这类现成的计算单元叫函数，写法是 `函数名(参数1, 参数2)`，参数之间用英文逗号分隔。 **运算符三类**：算术运算符 `+ - * / % ^`（加减乘除、百分号、乘方）；比较运算符 `= > < >= <= <>`（返回 TRUE 或 FALSE）；文本连接符 `&`（把两段文本拼成一段，如 `=A2&\"部\"`）。优先级：括号最先，接着乘方、乘除、加减，最后是连接与比较；记不住就加括号，括号永远最优先。 **公式与结果**：单元格显示的是计算结果，编辑栏显示的是公式本身。双击单元格或按 `F2` 可进入编辑状态，光标定位到公式末尾；按 `Esc` 放弃修改，按 `Enter` 确认。公式→显示公式（`Ctrl + ``，反引号键）可让全表显示公式而不是结果，检查时用它。 **相对引用入门**：公式里的 `B2` 是相对引用，复制到下一行会自动变成 `B3`，复制到右一列会变成 `C2`。这是公式能\"一写多用\"的关键；想让它不跟着变，见下一篇引用方式（加 `$` 锁定）。 **常见第一错**：公式不以 `=` 开头（直接写 `SUM(B2:B10)` 只会显示文本）；用了中文括号 `（）`", "section": "tut", "ref": "formulas-01-formula-basics"}, {"id": "tut-formulas-02-references", "type": "tutorial", "column": "C03", "title": "引用方式：相对引用、绝对引用、混合引用与跨表引用", "text": "引用方式：相对引用、绝对引用、混合引用与跨表引用 **相对引用**：`B2` 这样不带 `$` 的引用。公式复制到别处时，引用跟着目标位置同步移动：下移一行变 `B3`，右移一列变 `C2`。它是公式\"一写多用\"的基础。 **绝对引用**：`$B$2`，行列都锁定。公式复制到任何地方都指向 B2 不变。适用场景：引用某个固定参数格（如税率、提成比例、单价），全表共用一个格。 **混合引用**：`$B2`（锁列不锁行）或 `B$2`（锁行不锁列）。乘法表是经典场景：行标题在 A 列、列标题在第 1 行，公式 `=$A2*B$1` 往右拖时 A 列锁定、往下拖时第 1 行锁定，一张乘法表一个公式搞定。 **F4 切换**：编辑公式时光标放在引用上，按 `F4` 循环切换 `B2` → `$B$2` → `B$2` → `$B2` → `B2`。记住顺序，锁引用不用手敲 `$`。 **跨表引用**：引用其他工作表的单元格，写法是 `表名!地址`，如 `='11月'!C10`。表名含中文或空格时必须加单引号。跨工作簿引用还要带工作簿名，如 `[报表.xlsx]11月!C10`，源文件改名或移动后链接会断，慎用。 **三维引用**：对多个连续工作表的同一位置求和，如 `=SUM(一月:三月!B2)`，表示一月到三月这三张表 B2 的和。要求各表结构完全一致，适合\"每月一张表、结构相同\"的汇总", "section": "tut", "ref": "formulas-02-references"}, {"id": "tut-formulas-03-names", "type": "tutorial", "column": "C03", "title": "名称与定义：定义名称、名称管理器与动态名称", "text": "名称与定义：定义名称、名称管理器与动态名称 **名称**：给单元格或区域起一个名字，如把 E1 命名为\"提成比例\"，公式写 `=B2*提成比例`，比 `=B2*$E$1` 好读得多。名称是工作簿级的：全工作簿任何一张表都能用同一个名称。 **定义名称**：选中单元格或区域，公式→定义名称，输入名字、确认引用范围。命名规则：不能与单元格地址重名（如 A1、B2），不能含空格（用下划线代替），不能以数字开头。名字里用\"税率\"、\"提成比例\"这类业务词，公式立刻自带文档。 **名称管理器**：公式→名称管理器，列出全部名称：名字、引用位置、范围。改引用、改名字、删名称都在这里；名称引用错了（如指向了被删的表）会在这里显示 `#REF!`，是排查断链的第一站。 **名称框快捷定义**：选中区域后点左上角名称框，直接输入名字回车，即完成定义——比打开对话框更快。输入已定义名称回车，可瞬间跳转到该区域。 **动态名称**：引用范围会自己变长的名称。经典写法是用 OFFSET：`=OFFSET($A$2,0,0,COUNTA($A:$A)-1,1)`，表示\"从 A2 开始、高度等于 A 列非空数减 1\"，A 列新增一行，名称范围自动加一行。更稳妥的写法是用 INDEX：`= $A$2:INDEX($A:$A,COUNTA($A:$A))`，INDEX 是非易失性函数，不会每次重算全表。 **适用边", "section": "tut", "ref": "formulas-03-names"}, {"id": "tut-formulas-05-auditing", "type": "tutorial", "column": "C03", "title": "公式审核与调试：追踪引用、公式求值与错误检查", "text": "公式审核与调试：追踪引用、公式求值与错误检查 **追踪引用单元格**：选中一个公式格，公式→追踪引用单元格，箭头从它引用的格指向它。箭头指错地方，就是引用错了。**追踪从属单元格**反过来：箭头从它指向引用它的公式格，删格、删行前先看它，知道谁会受影响。 **公式求值**：公式→公式求值，打开逐步求值窗口，每点一次\"求值\"就算一步，能看到 `VLOOKUP` 的查找值、`IF` 的条件判断、`SUM` 的求和范围每一步的中间结果。公式结果不对但不知道哪一步错时，用它逐段定位。 **错误检查**：公式→错误检查，逐个扫描全表的错误值（#VALUE!、#N/A、#REF! 等），每个错误给\"帮助\"、\"显示计算步骤\"、\"忽略错误\"等选项。左上角绿色小三角就是错误检查的标记：有三角不一定真有错，可能是\"公式与相邻公式不一致\"这类提醒。 **监视窗口**：公式→监视窗口，把关键结果格（如合计、税率）加进去，窗口常驻显示它们的当前值。改动源数据时不用翻页找合计格，在监视窗口直接看变化。 **显示公式**：公式→显示公式（`Ctrl + ``），全表切换显示公式文本而非结果。检查引用、核对公式结构时用它；检查完再按一次切回。 **定位条件找问题格**：`F5`→定位条件→公式/常量，可一次选中全表所有公式格或所有文本格。\"看起来是数、实际是文本\"的格（左上角绿三角、左对齐显示）最适合这样批量找出", "section": "tut", "ref": "formulas-05-auditing"}, {"id": "tut-formulas-06-advanced-tricks", "type": "tutorial", "column": "C03", "title": "高级公式技巧：LET、LAMBDA、嵌套与条件求和进阶", "text": "高级公式技巧：LET、LAMBDA、嵌套与条件求和进阶 **LET（2021／365）**：`LET(名字1, 值1, 名字2, 值2, 计算式)`，先定义、后计算。长公式里同一个子表达式出现多次时，用 LET 只算一次、起个名字，后面直接用名字。公式变短、变快、变好读。示例：`=LET(单价,B2,数量,C2,单价*数量)`。 **LAMBDA（365 专属）**：`LAMBDA(参数, 计算式)`，定义一个自己的函数。` =LAMBDA(x, x*2)(5)` 返回 10。更实用的用法是先在名称管理器里把 LAMBDA 存成名称（如\"税额\"），以后全表像用内置函数一样调用 `=税额(10000)`。LAMBDA 配合 MAP、BYROW 等函数可对整列逐行计算，是 365 的高阶玩法。 **嵌套的度**：IF 嵌套超过 3 层就难读难维护，优先换 IFS（2019／365）、SWITCH（2019／365）或 VLOOKUP/XLOOKUP 查表。嵌套不是炫技，少一层是一层。 **SUMPRODUCT 多条件求和**：`=SUMPRODUCT((条件1)*(条件2)*求和区域)`，不用辅助列、不用数组三键。原理：条件相乘得 0/1 掩码，只有全满足的行是 1，再与求和区域相乘后加总。它是 SUMIFS 出现之前的通用解法，条件更灵活（可做或条件、可做不等式）。 **文本拼接公式", "section": "tut", "ref": "formulas-06-advanced-tricks"}, {"id": "tut-data-management-01-sort-filter", "type": "tutorial", "column": "C05", "title": "排序与筛选：单条件、多条件、自动筛选与高级筛选", "text": "排序与筛选：单条件、多条件、自动筛选与高级筛选 **排序的铁律**：排序前选中整个数据区，或点数据区内任一格直接排序（Excel 自动扩展选区）。只选中一列就排序，会把行与行之间的对应关系打乱——这是新手最常见的毁表操作，没有之一。排序前备份，或确认能 `Ctrl + Z` 撤销。 **单条件排序**：数据→排序，按一列升序/降序。数值按大小、日期按先后、文本按拼音/字母。金额列降序即\"从大到小\"，看 Top 5 直接取前 5 行。 **多条件排序**：数据→排序→添加条件，先按部门升序、再按金额降序。Excel 按条件顺序逐层排：部门相同的人内部再按金额排。层数没有实用上限，但超过 3 层就要想想是不是该用透视表了。 **自动筛选**：选中表头行，数据→筛选，每列出现下拉箭头。点箭头可选文本筛选（包含/开头是）、数字筛选（大于/前 10 项）、按颜色筛选。筛选只是隐藏行，不删除数据；清除筛选后全部恢复。 **高级筛选**：数据→高级筛选，条件区域单独写在表外。同一行多个条件是\"与\"（同时满足），不同行是\"或\"（满足其一）。还能勾选\"选择不重复的记录\"，一键提取不重复客户名单。高级筛选可把结果复制到其他位置，原表不动。 **按颜色排序**：先用条件格式或手动填充把异常行标色，再按颜色排序，异常行自动聚到一起。适合\"先标后排\"的人工复核流程。 2. 基础概念 **排序的铁律**：排序", "section": "tut", "ref": "data-management-01-sort-filter"}, {"id": "tut-data-management-02-clean-data", "type": "tutorial", "column": "C05", "title": "数据清洗：分列、去重、TRIM/CLEAN 与查找替换清理", "text": "数据清洗：分列、去重、TRIM/CLEAN 与查找替换清理 **脏数据的四种**：多余空格（\"张三 \"）、不可见字符（从系统导出的换行符、制表符）、文本型数字（\"100\" 当文本）、重复行（同一订单导了两次）。清洗就是按固定顺序把这四种逐一处理掉。 **分列**：数据→分列，把一格里的多个值按分隔符（逗号、分号、空格）或固定宽度拆成多列。系统导出的 CSV 常常是\"姓名，部门，金额\"挤在一格，分列是第一步。分列前先在右侧留出空列，否则会覆盖已有数据。 **删除重复项**：数据→删除重复项，勾选作为判断依据的列（如订单号），重复行整行删除，并报告删了几行。它是破坏性操作，清洗前必须先备份原表。 **TRIM 与 CLEAN**：`TRIM` 删首尾空格、把连续多个空格压成一个；`CLEAN` 删不可见字符（如换行符 CHAR(10) 以外的控制字符）。两者常组合用：`=TRIM(CLEAN(A2))`。注意 TRIM 不删不间断空格（CHAR(160)，从网页复制来的常见），那种要用 SUBSTITUTE 换掉：`=SUBSTITUTE(A2,CHAR(160),\"\")`。 **UNIQUE（2021／365）**：`=UNIQUE(A2:A100)` 一公式返回去重后的列表，原表不动。想保留原表、只在新位置看去重结果时用它；想直接在原表上删重复行时用\"删除重复项\"。 **清洗流程*", "section": "tut", "ref": "data-management-02-clean-data"}, {"id": "tut-data-management-03-tables-ref", "type": "tutorial", "column": "C05", "title": "超级表应用（交叉引用索引）", "text": "超级表应用（交叉引用索引） ", "section": "tut", "ref": "data-management-03-tables-ref"}, {"id": "tut-data-management-05-import-export", "type": "tutorial", "column": "C05", "title": "数据导入导出：文本/CSV 导入、从数据库与网页获取、导出格式", "text": "数据导入导出：文本/CSV 导入、从数据库与网页获取、导出格式 **CSV 导入三要素**：分隔符（逗号/分号/制表符）、编码（UTF-8/GBK）、列格式（文本/日期/常规）。三者任一错，导入即乱：分隔符错会整行挤进一列，编码错会出乱码，列格式错会丢前导 0 或把长数字变科学计数法。 **两种导入路径**：直接双击打开 CSV（快，但分隔符与编码按系统默认猜，常猜错）；数据→从文本/CSV（走 Power Query 导入向导，可选分隔符、编码、列格式，推荐）。后者还能把导入步骤存成查询，下月同样文件一键刷新。 **从文件夹获取**：数据→获取数据→自文件→从文件夹，选文件夹后 Power Query 合并其中全部同结构文件。每月 12 个分表合并成一张总表，用它 1 分钟搞定；新文件丢进文件夹后刷新即可。 **从数据库与网页获取**：数据→获取数据→自数据库（SQL Server、Access 等）或自网站（输入 URL 抓表格）。网页表格结构一变就要重配查询，适合结构稳定的公开表格（如汇率表）。 **导出格式取舍**：另存为 CSV 只保留当前工作表、无格式无公式，适合导给其他系统；导出 PDF（文件→导出→创建 PDF）保留排版与格式，适合发给领导；发给对方继续编辑的，一律发 .xlsx 原文件。 **刷新**：Power Query 导入的数据，源文件更新后在 Excel", "section": "tut", "ref": "data-management-05-import-export"}, {"id": "tip-数据录入技巧-0", "type": "tip", "column": "C01", "title": "自动填充序号", "text": "数据录入技巧 自动填充序号 首格输入 1、第二格输入 2，选中两格拖填充柄；或用 =ROW()-1 下拉，删行不中断", "section": "tips", "ref": ""}, {"id": "tip-数据录入技巧-1", "type": "tip", "column": "C01", "title": "自动生成流水号", "text": "数据录入技巧 自动生成流水号 用 =\"NO.\"&TEXT(ROW()-1,\"0000\") 下拉，序号自动补零对齐", "section": "tips", "ref": ""}, {"id": "tip-数据录入技巧-2", "type": "tip", "column": "C01", "title": "快速录入当前日期", "text": "数据录入技巧 快速录入当前日期 按 Ctrl+; 直接输入今天日期（静态值，不会每天变）", "section": "tips", "ref": ""}, {"id": "tip-数据录入技巧-3", "type": "tip", "column": "C01", "title": "快速录入当前时间", "text": "数据录入技巧 快速录入当前时间 按 Ctrl+Shift+; 输入当前时间；日期时间一起按 Ctrl+; 空格 Ctrl+Shift+;", "section": "tips", "ref": ""}, {"id": "tip-数据录入技巧-4", "type": "tip", "column": "C01", "title": "快速输入重复内容", "text": "数据录入技巧 快速输入重复内容 输入前几个字后按 Alt+↓，从本列已录入的值里直接选", "section": "tips", "ref": ""}, {"id": "tip-数据录入技巧-5", "type": "tip", "column": "C01", "title": "下拉选择录入", "text": "数据录入技巧 下拉选择录入 数据→数据验证→序列，来源输入 男,女，只能点选不能乱填", "section": "tips", "ref": ""}, {"id": "tip-数据录入技巧-6", "type": "tip", "column": "C01", "title": "联动下拉菜单", "text": "数据录入技巧 联动下拉菜单 一级菜单做命名区域，二级数据验证→序列用 =INDIRECT($A2) 引用", "section": "tips", "ref": ""}, {"id": "tip-数据录入技巧-7", "type": "tip", "column": "C01", "title": "防止重复输入", "text": "数据录入技巧 防止重复输入 数据验证→自定义，公式 =COUNTIF(A:A,A1)=1，重复就报错", "section": "tips", "ref": ""}, {"id": "tip-数据录入技巧-8", "type": "tip", "column": "C01", "title": "批量导入数据", "text": "数据录入技巧 批量导入数据 数据→获取数据→从文本/CSV，一次把外部数据整份导进来", "section": "tips", "ref": ""}, {"id": "tip-数据清洗技巧-0", "type": "tip", "column": "C05", "title": "一秒删除空行", "text": "数据清洗技巧 一秒删除空行 选中区域→Ctrl+G 定位→空值→右键删除整行", "section": "tips", "ref": ""}, {"id": "tip-数据清洗技巧-1", "type": "tip", "column": "C05", "title": "删除空列", "text": "数据清洗技巧 删除空列 选中区域→Ctrl+G 空值→右键删除整列（先备份原表）", "section": "tips", "ref": ""}, {"id": "tip-数据清洗技巧-2", "type": "tip", "column": "C05", "title": "删除重复值", "text": "数据清洗技巧 删除重复值 数据→删除重复项，勾选关键列，一键去重", "section": "tips", "ref": ""}, {"id": "tip-数据清洗技巧-3", "type": "tip", "column": "C05", "title": "合并重复记录", "text": "数据清洗技巧 合并重复记录 数据透视表按关键字段分组，对金额求和、对订单计数", "section": "tips", "ref": ""}, {"id": "tip-数据清洗技巧-4", "type": "tip", "column": "C05", "title": "去除隐藏空格", "text": "数据清洗技巧 去除隐藏空格 =TRIM(A1) 去首尾空格；=CLEAN(A1) 去换行等不可见字符", "section": "tips", "ref": ""}, {"id": "tip-数据清洗技巧-5", "type": "tip", "column": "C05", "title": "去除换行符", "text": "数据清洗技巧 去除换行符 查找替换：查找内容处按 Ctrl+J，替换为留空，全部替换", "section": "tips", "ref": ""}, {"id": "tip-数据清洗技巧-6", "type": "tip", "column": "C05", "title": "统一日期格式", "text": "数据清洗技巧 统一日期格式 选中列→数据→分列→下一步→日期 YMD，一次把文本日期转正", "section": "tips", "ref": ""}, {"id": "tip-数据清洗技巧-7", "type": "tip", "column": "C05", "title": "统一手机号格式", "text": "数据清洗技巧 统一手机号格式 先设为文本格式再录入；已变形用 =TEXT(A1,\"0\") 恢复显示", "section": "tips", "ref": ""}, {"id": "tip-数据清洗技巧-8", "type": "tip", "column": "C05", "title": "数字文本互转", "text": "数据清洗技巧 数字文本互转 数字转文本用 =TEXT(A1,\"0\")；文本转数字用 =A1*1 或分列→常规", "section": "tips", "ref": ""}, {"id": "tip-函数应用技巧-0", "type": "tip", "column": "C04", "title": "VLOOKUP精确匹配", "text": "函数应用技巧 VLOOKUP精确匹配 =VLOOKUP(值,区域,列号,0)，第四参数写 0 才是精确查找", "section": "tips", "ref": ""}, {"id": "tip-函数应用技巧-1", "type": "tip", "column": "C04", "title": "VLOOKUP反向查询", "text": "函数应用技巧 VLOOKUP反向查询 右查左改用 =INDEX(B:B,MATCH(值,A:A,0))", "section": "tips", "ref": ""}, {"id": "tip-函数应用技巧-2", "type": "tip", "column": "C04", "title": "XLOOKUP一步到位", "text": "函数应用技巧 XLOOKUP一步到位 =XLOOKUP(值,查找列,返回列,\"未找到\")，不用数第几列", "section": "tips", "ref": ""}, {"id": "tip-函数应用技巧-3", "type": "tip", "column": "C04", "title": "INDEX+MATCH多条件", "text": "函数应用技巧 INDEX+MATCH多条件 =INDEX(返回列,MATCH(1,(条件列1=条件1)*(条件列2=条件2),0))", "section": "tips", "ref": ""}, {"id": "tip-函数应用技巧-4", "type": "tip", "column": "C04", "title": "模糊匹配查询", "text": "函数应用技巧 模糊匹配查询 =VLOOKUP(\"*\"&关键词&\"*\",区域,2,0)，通配符前后包夹", "section": "tips", "ref": ""}, {"id": "tip-函数应用技巧-5", "type": "tip", "column": "C04", "title": "双向查询", "text": "函数应用技巧 双向查询 =INDEX(区域,MATCH(行值,首列,0),MATCH(列值,首行,0)) 行列交叉定位", "section": "tips", "ref": ""}, {"id": "tip-函数应用技巧-6", "type": "tip", "column": "C04", "title": "跨表查询", "text": "函数应用技巧 跨表查询 =VLOOKUP(A2,INDIRECT(\"'\"&B2&\"'!A:B\"),2,0)，按表名动态切换", "section": "tips", "ref": ""}, {"id": "tip-函数应用技巧-7", "type": "tip", "column": "C04", "title": "动态查询面板", "text": "函数应用技巧 动态查询面板 数据验证做下拉选关键词，XLOOKUP 引用该单元格，选谁查谁", "section": "tips", "ref": ""}, {"id": "tip-函数应用技巧-8", "type": "tip", "column": "C04", "title": "多条件统计", "text": "函数应用技巧 多条件统计 =SUMIFS(求和列,条件列1,条件1,条件列2,条件2)，条件可继续加", "section": "tips", "ref": ""}, {"id": "tip-函数应用技巧-9", "type": "tip", "column": "C04", "title": "动态汇总区域", "text": "函数应用技巧 动态汇总区域 =SUM(OFFSET(首格,0,0,COUNTA(列),1))，新增行自动纳入", "section": "tips", "ref": ""}, {"id": "tip-文本处理技巧-0", "type": "tip", "column": "C04", "title": "提取姓名中的姓", "text": "文本处理技巧 提取姓名中的姓 =LEFT(A2,1)，复姓手动处理或用快速填充", "section": "tips", "ref": ""}, {"id": "tip-文本处理技巧-1", "type": "tip", "column": "C04", "title": "提取手机号", "text": "文本处理技巧 提取手机号 固定位置用 =MID(A2,12,11)；不固定用 Ctrl+E 快速填充", "section": "tips", "ref": ""}, {"id": "tip-文本处理技巧-2", "type": "tip", "column": "C04", "title": "提取邮箱", "text": "文本处理技巧 提取邮箱 用 Ctrl+E 按示例提取；或 =MID(A2,FIND(\"@\",A2)-6,20) 再 TRIM", "section": "tips", "ref": ""}, {"id": "tip-文本处理技巧-3", "type": "tip", "column": "C04", "title": "分离姓和名", "text": "文本处理技巧 分离姓和名 姓 =LEFT(A2,1)，名 =RIGHT(A2,LEN(A2)-1)", "section": "tips", "ref": ""}, {"id": "tip-文本处理技巧-4", "type": "tip", "column": "C04", "title": "中英文拆分", "text": "文本处理技巧 中英文拆分 旁边列手写一行英文示例，选中→Ctrl+E，自动按规律拆分", "section": "tips", "ref": ""}, {"id": "tip-文本处理技巧-5", "type": "tip", "column": "C04", "title": "字符串替换", "text": "文本处理技巧 字符串替换 =SUBSTITUTE(A2,\"旧\",\"新\")，嵌套可做多重替换", "section": "tips", "ref": ""}, {"id": "tip-文本处理技巧-6", "type": "tip", "column": "C04", "title": "批量修改内容", "text": "文本处理技巧 批量修改内容 Ctrl+H 查找替换，支持通配符 * ?，可限定范围", "section": "tips", "ref": ""}, {"id": "tip-文本处理技巧-7", "type": "tip", "column": "C04", "title": "批量添加前缀", "text": "文本处理技巧 批量添加前缀 =\"前缀\"&A2；纯显示用自定义格式 \"前缀\"@", "section": "tips", "ref": ""}, {"id": "tip-文本处理技巧-8", "type": "tip", "column": "C04", "title": "批量添加后缀", "text": "文本处理技巧 批量添加后缀 =A2&\"元\"；数字加单位也可用自定义格式 0\"元\"", "section": "tips", "ref": ""}, {"id": "tip-日期时间技巧-0", "type": "tip", "column": "C04", "title": "计算年龄", "text": "日期时间技巧 计算年龄 =DATEDIF(出生日期,TODAY(),\"Y\")，周岁一键得出", "section": "tips", "ref": ""}, {"id": "tip-日期时间技巧-1", "type": "tip", "column": "C04", "title": "计算工龄", "text": "日期时间技巧 计算工龄 =DATEDIF(入职日,TODAY(),\"Y\")&\"年\"&DATEDIF(入职日,TODAY(),\"YM\")&\"月\"", "section": "tips", "ref": ""}, {"id": "tip-日期时间技巧-2", "type": "tip", "column": "C04", "title": "工作日计算", "text": "日期时间技巧 工作日计算 =NETWORKDAYS(开始,结束)，自动排除周六日", "section": "tips", "ref": ""}, {"id": "tip-日期时间技巧-3", "type": "tip", "column": "C04", "title": "节假日排除", "text": "日期时间技巧 节假日排除 =NETWORKDAYS(开始,结束,节假日区域)，第三参数放假日清单", "section": "tips", "ref": ""}, {"id": "tip-日期时间技巧-4", "type": "tip", "column": "C04", "title": "倒计时计算", "text": "日期时间技巧 倒计时计算 =目标日期-TODAY()&\"天\"，过期变负数可标红", "section": "tips", "ref": ""}, {"id": "tip-日期时间技巧-5", "type": "tip", "column": "C04", "title": "取月初日期", "text": "日期时间技巧 取月初日期 =EOMONTH(日期,-1)+1，上月月末加一天即本月初", "section": "tips", "ref": ""}, {"id": "tip-日期时间技巧-6", "type": "tip", "column": "C04", "title": "取月末日期", "text": "日期时间技巧 取月末日期 =EOMONTH(日期,0)，自动处理大小月和闰年", "section": "tips", "ref": ""}, {"id": "tip-日期时间技巧-7", "type": "tip", "column": "C04", "title": "季度统计", "text": "日期时间技巧 季度统计 辅助列 =\"Q\"&INT((MONTH(日期)+2)/3)，再透视表汇总", "section": "tips", "ref": ""}, {"id": "tip-日期时间技巧-8", "type": "tip", "column": "C04", "title": "周数计算", "text": "日期时间技巧 周数计算 =WEEKNUM(日期,2)，第二参数 2 表示周一起始", "section": "tips", "ref": ""}, {"id": "tip-格式美化技巧-0", "type": "tip", "column": "C02", "title": "隔行变色", "text": "格式美化技巧 隔行变色 条件格式→新建规则→公式 =MOD(ROW(),2)=0，设填充色", "section": "tips", "ref": ""}, {"id": "tip-格式美化技巧-1", "type": "tip", "column": "C02", "title": "自动高亮整行", "text": "格式美化技巧 自动高亮整行 选中区域→条件格式公式 =$A1=\"重点\"，整行自动上色", "section": "tips", "ref": ""}, {"id": "tip-格式美化技巧-2", "type": "tip", "column": "C02", "title": "数据条", "text": "格式美化技巧 数据条 开始→条件格式→数据条，数值大小一目了然", "section": "tips", "ref": ""}, {"id": "tip-格式美化技巧-3", "type": "tip", "column": "C02", "title": "图标集", "text": "格式美化技巧 图标集 条件格式→图标集，达标/预警/异常自动打对勾感叹号", "section": "tips", "ref": ""}, {"id": "tip-格式美化技巧-4", "type": "tip", "column": "C02", "title": "自动标红逾期", "text": "格式美化技巧 自动标红逾期 条件格式公式 =A2<TODAY()，过期日期自动变红", "section": "tips", "ref": ""}, {"id": "tip-格式美化技巧-5", "type": "tip", "column": "C02", "title": "自动标绿达标", "text": "格式美化技巧 自动标绿达标 =B2>=目标值 标绿，低于目标再加一条标红", "section": "tips", "ref": ""}, {"id": "tip-格式美化技巧-6", "type": "tip", "column": "C02", "title": "动态颜色变化", "text": "格式美化技巧 动态颜色变化 条件格式+公式绑定数值，数据变颜色自动跟", "section": "tips", "ref": ""}, {"id": "tip-格式美化技巧-7", "type": "tip", "column": "C02", "title": "重复值高亮", "text": "格式美化技巧 重复值高亮 条件格式→突出显示单元格规则→重复值", "section": "tips", "ref": ""}, {"id": "tip-格式美化技巧-8", "type": "tip", "column": "C02", "title": "仪表盘美化", "text": "格式美化技巧 仪表盘美化 大字号 KPI + 条件格式图标 + 迷你图，注意留白对齐", "section": "tips", "ref": ""}, {"id": "tip-图表技巧-0", "type": "tip", "column": "C07", "title": "一键生成图表", "text": "图表技巧 一键生成图表 选中数据按 Alt+F1 生成嵌入图表；F11 生成独立图表工作表", "section": "tips", "ref": ""}, {"id": "tip-图表技巧-1", "type": "tip", "column": "C07", "title": "动态图表", "text": "图表技巧 动态图表 定义名称 =OFFSET(首格,0,0,COUNTA(列),1) 做数据源，新增自动扩展", "section": "tips", "ref": ""}, {"id": "tip-图表技巧-2", "type": "tip", "column": "C07", "title": "手绘甘特图", "text": "图表技巧 手绘甘特图 条形图：开始日期为起点、工期为长度，逆序类别+调透明度", "section": "tips", "ref": ""}, {"id": "tip-图表技巧-3", "type": "tip", "column": "C07", "title": "漏斗图", "text": "图表技巧 漏斗图 插入→漏斗图（2016 及以上），看各环节转化流失", "section": "tips", "ref": ""}, {"id": "tip-图表技巧-4", "type": "tip", "column": "C07", "title": "KPI达成图", "text": "图表技巧 KPI达成图 环形图 + 大数字文本框，目标完成率一目了然", "section": "tips", "ref": ""}, {"id": "tip-图表技巧-5", "type": "tip", "column": "C07", "title": "销售驾驶舱", "text": "图表技巧 销售驾驶舱 切片器 + 数据透视表 + 组合图，点选维度图表联动", "section": "tips", "ref": ""}, {"id": "tip-图表技巧-6", "type": "tip", "column": "C07", "title": "地图图表", "text": "图表技巧 地图图表 插入→地图（365），按省份/国家数值自动着色", "section": "tips", "ref": ""}, {"id": "tip-图表技巧-7", "type": "tip", "column": "C07", "title": "单元格热力图", "text": "图表技巧 单元格热力图 不用图表，条件格式→色阶直接在区域上画热力分布", "section": "tips", "ref": ""}, {"id": "tip-打印技巧-0", "type": "tip", "column": "C01", "title": "一页打印", "text": "打印技巧 一页打印 页面布局→宽度/高度设为 1 页，超宽表格自动缩放", "section": "tips", "ref": ""}, {"id": "tip-打印技巧-1", "type": "tip", "column": "C01", "title": "打印标题行", "text": "打印技巧 打印标题行 页面布局→打印标题→顶端标题行设为 $1:$1，每页重复表头", "section": "tips", "ref": ""}, {"id": "tip-打印技巧-2", "type": "tip", "column": "C01", "title": "自动分页调整", "text": "打印技巧 自动分页调整 视图→分页预览，拖动蓝色分页线控制每页内容", "section": "tips", "ref": ""}, {"id": "tip-打印技巧-3", "type": "tip", "column": "C01", "title": "打印网格线", "text": "打印技巧 打印网格线 页面设置→工作表→勾选网格线，表格线才能印出来", "section": "tips", "ref": ""}, {"id": "tip-打印技巧-4", "type": "tip", "column": "C01", "title": "打印批注", "text": "打印技巧 打印批注 页面设置→工作表→批注选“工作表末尾”，批注集中打印", "section": "tips", "ref": ""}, {"id": "tip-打印技巧-5", "type": "tip", "column": "C01", "title": "横向打印", "text": "打印技巧 横向打印 页面布局→纸张方向→横向，列多的表横过来打", "section": "tips", "ref": ""}, {"id": "tip-打印技巧-6", "type": "tip", "column": "C01", "title": "批量打印多表", "text": "打印技巧 批量打印多表 按住 Ctrl 点多个工作表标签→文件→打印，一次全打", "section": "tips", "ref": ""}, {"id": "tip-打印技巧-7", "type": "tip", "column": "C01", "title": "只打印选中区域", "text": "打印技巧 只打印选中区域 选中区域→页面布局→打印区域→设置打印区域", "section": "tips", "ref": ""}, {"id": "tip-快捷键技巧-0", "type": "tip", "column": "C01", "title": "Ctrl+D 向下填充", "text": "快捷键技巧 Ctrl+D 向下填充 选中区域按 Ctrl+D，把最上一格内容/公式填满下方", "section": "tips", "ref": ""}, {"id": "tip-快捷键技巧-1", "type": "tip", "column": "C01", "title": "Ctrl+R 向右填充", "text": "快捷键技巧 Ctrl+R 向右填充 选中区域按 Ctrl+R，把最左一格内容填满右侧", "section": "tips", "ref": ""}, {"id": "tip-快捷键技巧-2", "type": "tip", "column": "C01", "title": "Ctrl+E 快速填充", "text": "快捷键技巧 Ctrl+E 快速填充 手写一个示例后按 Ctrl+E，自动识别规律拆分合并，提取手机号神器", "section": "tips", "ref": ""}, {"id": "tip-快捷键技巧-3", "type": "tip", "column": "C01", "title": "Alt+= 一键求和", "text": "快捷键技巧 Alt+= 一键求和 自动对上方或左侧连续数字求和，月末汇总最快", "section": "tips", "ref": ""}, {"id": "tip-快捷键技巧-4", "type": "tip", "column": "C01", "title": "F4 重复与锁定", "text": "快捷键技巧 F4 重复与锁定 重复上一步操作；在公式中按 F4 切换 $ 绝对引用", "section": "tips", "ref": ""}, {"id": "tip-快捷键技巧-5", "type": "tip", "column": "C01", "title": "Ctrl+Shift+L 筛选", "text": "快捷键技巧 Ctrl+Shift+L 筛选 一键开关自动筛选，不用再去点菜单", "section": "tips", "ref": ""}, {"id": "tip-快捷键技巧-6", "type": "tip", "column": "C01", "title": "Ctrl+方向键跳转", "text": "快捷键技巧 Ctrl+方向键跳转 瞬间跳到数据区域边缘，万行表格秒穿越", "section": "tips", "ref": ""}, {"id": "tip-快捷键技巧-7", "type": "tip", "column": "C01", "title": "Ctrl+空格选整列", "text": "快捷键技巧 Ctrl+空格选整列 选中当前整列；Shift+空格选中整行", "section": "tips", "ref": ""}, {"id": "tip-快捷键技巧-8", "type": "tip", "column": "C01", "title": "Ctrl+` 公式透视", "text": "快捷键技巧 Ctrl+` 公式透视 切换显示公式与计算结果，查错时一眼看穿", "section": "tips", "ref": ""}, {"id": "tip-数据透视表技巧-0", "type": "tip", "column": "C08", "title": "一键创建数据透视表", "text": "数据透视表技巧 一键创建数据透视表 选中数据区域任意单元格 → 插入 → 数据透视表 → 确定，3 秒生成汇总。记住：源数据第一行必须是标题行，且不能有合并单元格。", "section": "tips", "ref": ""}, {"id": "tip-数据透视表技巧-1", "type": "tip", "column": "C08", "title": "拖字段三步出报表", "text": "数据透视表技巧 拖字段三步出报表 行：销售员；列：月份；值：销售额。拖三个字段，一张交叉统计表就出来了，比写几十个 SUMIFS 快十倍。", "section": "tips", "ref": ""}, {"id": "tip-数据透视表技巧-2", "type": "tip", "column": "C08", "title": "值字段设置", "text": "数据透视表技巧 值字段设置 值区域默认是「求和」，点字段旁小箭头 → 值字段设置，可切换计数/平均值/最大值。同一字段拖两次可同时看求和与占比。", "section": "tips", "ref": ""}, {"id": "tip-数据透视表技巧-3", "type": "tip", "column": "C08", "title": "日期自动分组", "text": "数据透视表技巧 日期自动分组 右键日期字段 → 组合 → 按月/季度/年分组，一键把 365 天的明细变成 12 个月汇总。", "section": "tips", "ref": ""}, {"id": "tip-数据透视表技巧-4", "type": "tip", "column": "C08", "title": "切片器秒筛选", "text": "数据透视表技巧 切片器秒筛选 数据透视表分析 → 插入切片器 → 勾选「部门」。点一下按钮报表即时过滤，开会演示神器。", "section": "tips", "ref": ""}, {"id": "tip-数据透视表技巧-5", "type": "tip", "column": "C08", "title": "值显示方式", "text": "数据透视表技巧 值显示方式 右键值字段 → 值显示方式 → 占总和的百分比，直接算出每个销售员的业绩占比，不用再写公式。", "section": "tips", "ref": ""}, {"id": "tip-数据透视表技巧-6", "type": "tip", "column": "C08", "title": "一键刷新", "text": "数据透视表技巧 一键刷新 源数据增删行后，在透视表上右键 → 刷新即可更新。建议把源数据转为「表格」（Ctrl+T），新增行自动纳入。", "section": "tips", "ref": ""}, {"id": "tip-数据透视表技巧-7", "type": "tip", "column": "C08", "title": "更改数据源", "text": "数据透视表技巧 更改数据源 数据多了要换表？数据透视表分析 → 更改数据源，重新框选区域，之前搭好的版式原样保留。", "section": "tips", "ref": ""}, {"id": "tip-Power Query技巧-0", "type": "tip", "column": "C09", "title": "从表格导入 PQ", "text": "Power Query技巧 从表格导入 PQ 选中数据 → 数据 → 自表格/区域，一键进入 Power Query 编辑器。从此告别重复的手工清洗。", "section": "tips", "ref": ""}, {"id": "tip-Power Query技巧-1", "type": "tip", "column": "C09", "title": "一键删除空行空列", "text": "Power Query技巧 一键删除空行空列 在 PQ 里选中列 → 右键 → 删除空行；开始 → 删除列 → 删除空列。刷新后新数据自动同样处理。", "section": "tips", "ref": ""}, {"id": "tip-Power Query技巧-2", "type": "tip", "column": "C09", "title": "分列拆数据", "text": "Power Query技巧 分列拆数据 选中列 → 拆分列 → 按分隔符（如 - 或空格），身份证拆生日、地址拆省市，一步到位。", "section": "tips", "ref": ""}, {"id": "tip-Power Query技巧-3", "type": "tip", "column": "C09", "title": "合并查询代替 VLOOKUP", "text": "Power Query技巧 合并查询代替 VLOOKUP 开始 → 合并查询，把两表按关键列连接，比 VLOOKUP 快且不会列错位。", "section": "tips", "ref": ""}, {"id": "tip-Power Query技巧-4", "type": "tip", "column": "C09", "title": "逆透视整理报表", "text": "Power Query技巧 逆透视整理报表 选中月份列 → 转换 → 逆透视列，把横表变纵表，透视表最爱这种干净数据。", "section": "tips", "ref": ""}, {"id": "tip-Power Query技巧-5", "type": "tip", "column": "C09", "title": "替换值批量清洗", "text": "Power Query技巧 替换值批量清洗 选中列 → 右键 → 替换值，把「男/女」换成「先生/女士」，或把错别字批量修正。", "section": "tips", "ref": ""}, {"id": "tip-Power Query技巧-6", "type": "tip", "column": "C09", "title": "添加条件列", "text": "Power Query技巧 添加条件列 添加列 → 条件列，按销售额自动打标签：>=10万为A级，公式写一次、刷新终身受用。", "section": "tips", "ref": ""}, {"id": "tip-Power Query技巧-7", "type": "tip", "column": "C09", "title": "关闭并上载+刷新", "text": "Power Query技巧 关闭并上载+刷新 做完点「关闭并上载」，结果回到 Excel。以后源数据更新，数据 → 全部刷新，一键重跑全流程。", "section": "tips", "ref": ""}, {"id": "solve-公式问题-0", "type": "solve", "column": "C16", "title": "公式不计算", "text": "公式问题 公式不计算 先看公式→计算选项是否为“手动”，改回“自动”；再看单元格是否为文本格式，是则改常规后双击回车。", "section": "solve", "ref": ""}, {"id": "solve-公式问题-1", "type": "solve", "column": "C16", "title": "显示公式而非结果", "text": "公式问题 显示公式而非结果 单元格格式为“文本”，或误开了“显示公式”（Ctrl+` 切换）。改为常规格式后双击单元格回车即可。", "section": "solve", "ref": ""}, {"id": "solve-公式问题-2", "type": "solve", "column": "C16", "title": "结果错误但无报错", "text": "公式问题 结果错误但无报错 检查引用区域是否因增删行漂移、括号是否配对、VLOOKUP 是否误用近似匹配（第四参数应为 0）。", "section": "solve", "ref": ""}, {"id": "solve-公式问题-3", "type": "solve", "column": "C16", "title": "自动计算失效", "text": "公式问题 自动计算失效 大文件常被设为手动计算。按 F9 立即重算，或公式→计算选项改回自动。", "section": "solve", "ref": ""}, {"id": "solve-公式问题-4", "type": "solve", "column": "C16", "title": "循环引用", "text": "公式问题 循环引用 公式直接或间接引用了自己。看状态栏提示定位单元格，改写逻辑打破循环。", "section": "solve", "ref": ""}, {"id": "solve-公式问题-5", "type": "solve", "column": "C16", "title": "公式被锁定改不动", "text": "公式问题 公式被锁定改不动 工作表被保护了。审阅→撤销工作表保护（需要密码），或联系表主。", "section": "solve", "ref": ""}, {"id": "solve-公式问题-6", "type": "solve", "column": "C16", "title": "下拉填充公式不变", "text": "公式问题 下拉填充公式不变 检查是否为手动计算；或填充的只是值。确认引用方式（相对/绝对）是否符合预期。", "section": "solve", "ref": ""}, {"id": "solve-错误代码专区-0", "type": "solve", "column": "C16", "title": "#N/A 查找不到", "text": "错误代码专区 #N/A 查找不到 VLOOKUP/XLOOKUP 没找到匹配值。检查多余空格（TRIM）、数字与文本格式不一致；用 IFNA 包裹给友好提示。", "section": "solve", "ref": ""}, {"id": "solve-错误代码专区-1", "type": "solve", "column": "C16", "title": "#VALUE! 类型错误", "text": "错误代码专区 #VALUE! 类型错误 文本参与了数值运算。检查隐藏空格、特殊字符，用 VALUE 转换或清理后再算。", "section": "solve", "ref": ""}, {"id": "solve-错误代码专区-2", "type": "solve", "column": "C16", "title": "#REF! 引用失效", "text": "错误代码专区 #REF! 引用失效 引用的单元格/区域被删除。撤销删除，或把公式中的引用改为有效区域。", "section": "solve", "ref": ""}, {"id": "solve-错误代码专区-3", "type": "solve", "column": "C16", "title": "#NAME? 名称错误", "text": "错误代码专区 #NAME? 名称错误 函数名拼错或用了中文括号。检查拼写，括号一律用英文半角。", "section": "solve", "ref": ""}, {"id": "solve-错误代码专区-4", "type": "solve", "column": "C16", "title": "#DIV/0! 除数为零", "text": "错误代码专区 #DIV/0! 除数为零 除数为 0 或空单元格。用 =IF(除数=0,\"-\",分子/除数) 规避。", "section": "solve", "ref": ""}, {"id": "solve-错误代码专区-5", "type": "solve", "column": "C16", "title": "#NUM! 数值超范围", "text": "错误代码专区 #NUM! 数值超范围 结果太大或迭代不收敛。检查参数数量级，迭代公式调大迭代次数。", "section": "solve", "ref": ""}, {"id": "solve-错误代码专区-6", "type": "solve", "column": "C16", "title": "#SPILL! 溢出被挡", "text": "错误代码专区 #SPILL! 溢出被挡 动态数组目标区域有内容挡住。清空溢出区域，或把公式移到空旷处。", "section": "solve", "ref": ""}, {"id": "solve-错误代码专区-7", "type": "solve", "column": "C16", "title": "#CALC! 计算异常", "text": "错误代码专区 #CALC! 计算异常 动态数组返回空或逻辑错误。检查筛选条件是否全不满足，调整条件。", "section": "solve", "ref": ""}, {"id": "solve-文件问题-0", "type": "solve", "column": "C16", "title": "文件打不开", "text": "文件问题 文件打不开 打开 Excel→文件→打开→选中文件→点“打开”按钮下拉箭头→“打开并修复”。", "section": "solve", "ref": ""}, {"id": "solve-文件问题-1", "type": "solve", "column": "C16", "title": "文件损坏", "text": "文件问题 文件损坏 先用“打开并修复”→“修复”；不行选“提取数据”；还可改后缀为 zip 解压取 xl/worksheets 下 xml 抢救。", "section": "solve", "ref": ""}, {"id": "solve-文件问题-2", "type": "solve", "column": "C16", "title": "文件恢复", "text": "文件问题 文件恢复 文件→信息→管理工作簿→恢复未保存的工作簿。建议把自动恢复间隔设为 5 分钟。", "section": "solve", "ref": ""}, {"id": "solve-文件问题-3", "type": "solve", "column": "C16", "title": "文件变成只读", "text": "文件问题 文件变成只读 右键文件→属性，取消只读勾选；或文件被他人占用，另存一份副本编辑。", "section": "solve", "ref": ""}, {"id": "solve-文件问题-4", "type": "solve", "column": "C16", "title": "自动关闭/闪退", "text": "文件问题 自动关闭/闪退 运行 excel /safe 进安全模式排查；逐个禁用 COM 加载项，找到肇事者。", "section": "solve", "ref": ""}, {"id": "solve-文件问题-5", "type": "solve", "column": "C16", "title": "保存失败", "text": "文件问题 保存失败 磁盘满、路径过长或云同步冲突。另存到本地短路径，暂停网盘同步再试。", "section": "solve", "ref": ""}, {"id": "solve-文件问题-6", "type": "solve", "column": "C16", "title": "内容/公式丢失", "text": "文件问题 内容/公式丢失 可能只保存了值。去自动恢复版本或文件历史版本里找回，别覆盖原文件。", "section": "solve", "ref": ""}, {"id": "solve-性能问题-0", "type": "solve", "column": "C16", "title": "Excel卡顿", "text": "性能问题 Excel卡顿 计算选项改手动；删除多余条件格式；避免整列引用 A:A，改精确区域。", "section": "solve", "ref": ""}, {"id": "solve-性能问题-1", "type": "solve", "column": "C16", "title": "Excel无响应", "text": "性能问题 Excel无响应 大运算时耐心等；真死机用任务管理器结束进程，再用自动恢复版本找回。", "section": "solve", "ref": ""}, {"id": "solve-性能问题-2", "type": "solve", "column": "C16", "title": "Excel崩溃", "text": "性能问题 Excel崩溃 更新 Office 到最新；禁用可疑加载项；控制面板→修复 Office 安装。", "section": "solve", "ref": ""}, {"id": "solve-性能问题-3", "type": "solve", "column": "C16", "title": "启动慢", "text": "性能问题 启动慢 清理 XLSTART 启动文件夹里的多余文件；文件→选项→加载项禁用不用的。", "section": "solve", "ref": ""}, {"id": "solve-性能问题-4", "type": "solve", "column": "C16", "title": "文件打开慢", "text": "性能问题 文件打开慢 Ctrl+End 看已用区域是否虚大，删除空白行列的格式后保存，体积立减。", "section": "solve", "ref": ""}, {"id": "solve-性能问题-5", "type": "solve", "column": "C16", "title": "文件保存慢", "text": "性能问题 文件保存慢 图片压缩一下；删掉大量图形对象；老 xls 另存为 xlsx。", "section": "solve", "ref": ""}, {"id": "solve-性能问题-6", "type": "solve", "column": "C16", "title": "计算速度慢", "text": "性能问题 计算速度慢 少用易失函数 NOW/TODAY/INDIRECT；数组公式改精确区域；能透视表就别堆公式。", "section": "solve", "ref": ""}, {"id": "solve-筛选排序问题-0", "type": "solve", "column": "C16", "title": "筛选不完整", "text": "筛选排序问题 筛选不完整 数据中有空行空列把区域隔断。删除空行后重新开启筛选。", "section": "solve", "ref": ""}, {"id": "solve-筛选排序问题-1", "type": "solve", "column": "C16", "title": "部分数据无法筛选", "text": "筛选排序问题 部分数据无法筛选 筛选只覆盖了部分区域。选中整表（Ctrl+A）再开筛选。", "section": "solve", "ref": ""}, {"id": "solve-筛选排序问题-2", "type": "solve", "column": "C16", "title": "排序错乱串行", "text": "筛选排序问题 排序错乱串行 只选中单列排序导致错位。务必选“扩展选定区域”再排序。", "section": "solve", "ref": ""}, {"id": "solve-筛选排序问题-3", "type": "solve", "column": "C16", "title": "日期排序错误", "text": "筛选排序问题 日期排序错误 日期是文本格式。数据→分列→日期 YMD 转正后再排序。", "section": "solve", "ref": ""}, {"id": "solve-筛选排序问题-4", "type": "solve", "column": "C16", "title": "数字排序错误", "text": "筛选排序问题 数字排序错误 数字存成了文本。选中列→感叹号→转换为数字。", "section": "solve", "ref": ""}, {"id": "solve-筛选排序问题-5", "type": "solve", "column": "C16", "title": "合并单元格排不了", "text": "筛选排序问题 合并单元格排不了 先取消合并，用 Ctrl+D 填充内容后再排序。", "section": "solve", "ref": ""}, {"id": "solve-打印问题-0", "type": "solve", "column": "C16", "title": "打印不全", "text": "打印问题 打印不全 页面布局→缩放→调整为 1 页宽；检查打印区域是否框小了。", "section": "solve", "ref": ""}, {"id": "solve-打印问题-1", "type": "solve", "column": "C16", "title": "打印出空白页", "text": "打印问题 打印出空白页 分页预览里拖蓝线收掉多余分页；删除打印区域外的残留格式。", "section": "solve", "ref": ""}, {"id": "solve-打印问题-2", "type": "solve", "column": "C16", "title": "打印内容偏移", "text": "打印问题 打印内容偏移 页面设置→页边距→勾选水平居中；检查纸张大小是否匹配。", "section": "solve", "ref": ""}, {"id": "solve-打印问题-3", "type": "solve", "column": "C16", "title": "页码错误", "text": "打印问题 页码错误 页眉页脚→自定义页脚插入 &[页码]；检查起始页码设置。", "section": "solve", "ref": ""}, {"id": "solve-打印问题-4", "type": "solve", "column": "C16", "title": "打印缩放异常", "text": "打印问题 打印缩放异常 缩放设为“调整为 1 页”；宽表用横向打印。", "section": "solve", "ref": ""}, {"id": "solve-打印问题-5", "type": "solve", "column": "C16", "title": "表格线印不出", "text": "打印问题 表格线印不出 页面设置→工作表→勾选“网格线”；或给区域加边框。", "section": "solve", "ref": ""}, {"id": "solve-数据导入问题-0", "type": "solve", "column": "C16", "title": "CSV乱码", "text": "数据导入问题 CSV乱码 别双击打开。用数据→从文本/CSV 导入，文件原始格式选 65001:UTF-8 或 936。", "section": "solve", "ref": ""}, {"id": "solve-数据导入问题-1", "type": "solve", "column": "C16", "title": "中文乱码", "text": "数据导入问题 中文乱码 导入时选对编码；已乱码的用 Power Query 重新指定编码导入一次。", "section": "solve", "ref": ""}, {"id": "solve-数据导入问题-2", "type": "solve", "column": "C16", "title": "日期错乱", "text": "数据导入问题 日期错乱 导入向导第三步把该列设为“日期 YMD”；事后也可用分列转换。", "section": "solve", "ref": ""}, {"id": "solve-数据导入问题-3", "type": "solve", "column": "C16", "title": "数字变文本", "text": "数据导入问题 数字变文本 数据→分列→完成；或 =A1*1 批量转数值。", "section": "solve", "ref": ""}, {"id": "solve-数据导入问题-4", "type": "solve", "column": "C16", "title": "列错位", "text": "数据导入问题 列错位 分隔符选错了。导入时勾选正确的逗号/制表符分隔，预览对齐再加载。", "section": "solve", "ref": ""}, {"id": "solve-数据导入问题-5", "type": "solve", "column": "C16", "title": "前导零丢失", "text": "数据导入问题 前导零丢失 导入前把该列设为文本；或公式 =\"'\"&编号 保留 001 开头。", "section": "solve", "ref": ""}, {"id": "solve-图表问题-0", "type": "solve", "column": "C16", "title": "图表不更新", "text": "图表问题 图表不更新 数据源是固定区域。转成智能表格（Ctrl+T）或用 OFFSET 动态名称，新增自动进图。", "section": "solve", "ref": ""}, {"id": "solve-图表问题-1", "type": "solve", "column": "C16", "title": "图表数据丢失", "text": "图表问题 图表数据丢失 隐藏行列被排除。右键图表→选择数据→勾选“显示隐藏行列中的数据”。", "section": "solve", "ref": ""}, {"id": "solve-图表问题-2", "type": "solve", "column": "C16", "title": "坐标轴错误", "text": "图表问题 坐标轴错误 右键坐标轴→设置坐标轴格式，检查最小值/最大值、单位和对数刻度。", "section": "solve", "ref": ""}, {"id": "solve-图表问题-3", "type": "solve", "column": "C16", "title": "图表显示异常", "text": "图表问题 图表显示异常 图表被拉伸变形，重置大小；兼容模式文件另存为 xlsx 再试。", "section": "solve", "ref": ""}, {"id": "solve-图表问题-4", "type": "solve", "column": "C16", "title": "图例错乱", "text": "图表问题 图例错乱 右键→选择数据，重新指定系列名称和水平分类标签。", "section": "solve", "ref": ""}, {"id": "solve-图表问题-5", "type": "solve", "column": "C16", "title": "新增数据不进图表", "text": "图表问题 新增数据不进图表 数据源转智能表格后图表自动扩展；或手动更改数据区域。", "section": "solve", "ref": ""}, {"id": "solve-数据透视表问题-0", "type": "solve", "column": "C16", "title": "无法刷新", "text": "数据透视表问题 无法刷新 右键→刷新；若源区域变了，去数据透视表分析→更改数据源重框选。", "section": "solve", "ref": ""}, {"id": "solve-数据透视表问题-1", "type": "solve", "column": "C16", "title": "数据源错误", "text": "数据透视表问题 数据源错误 源表有空行空列或列名重复。清理后重新指定数据源。", "section": "solve", "ref": ""}, {"id": "solve-数据透视表问题-2", "type": "solve", "column": "C16", "title": "分组失败", "text": "数据透视表问题 分组失败 同一字段混有文本和日期/数字。先统一格式再分组。", "section": "solve", "ref": ""}, {"id": "solve-数据透视表问题-3", "type": "solve", "column": "C16", "title": "字段消失", "text": "数据透视表问题 字段消失 字段列表里重新勾选；检查源表列名是否被改名。", "section": "solve", "ref": ""}, {"id": "solve-数据透视表问题-4", "type": "solve", "column": "C16", "title": "统计错误", "text": "数据透视表问题 统计错误 值字段设置→改求和/计数/平均；文本字段默认计数是正常的。", "section": "solve", "ref": ""}, {"id": "solve-数据透视表问题-5", "type": "solve", "column": "C16", "title": "日期不自动分组", "text": "数据透视表问题 日期不自动分组 365 才支持自动分组；旧版用右键→分组，或加年月辅助列。", "section": "solve", "ref": ""}, {"id": "solve-Power Query问题-0", "type": "solve", "column": "C16", "title": "无法刷新", "text": "Power Query问题 无法刷新 查询→刷新全部；源文件路径移动了就重新定位源。", "section": "solve", "ref": ""}, {"id": "solve-Power Query问题-1", "type": "solve", "column": "C16", "title": "导入失败", "text": "Power Query问题 导入失败 源文件被占用或格式不支持。关闭占用后重试，或换格式。", "section": "solve", "ref": ""}, {"id": "solve-Power Query问题-2", "type": "solve", "column": "C16", "title": "合并失败", "text": "Power Query问题 合并失败 连接键两边类型不一致。先把两边键统一为文本再合并。", "section": "solve", "ref": ""}, {"id": "solve-Power Query问题-3", "type": "solve", "column": "C16", "title": "类型错误", "text": "Power Query问题 类型错误 删除“更改的类型”步骤重设；或手动改回正确类型。", "section": "solve", "ref": ""}, {"id": "solve-Power Query问题-4", "type": "solve", "column": "C16", "title": "数据丢失", "text": "Power Query问题 数据丢失 逐步点击应用步骤回看，检查筛选/删除步骤是否误删。", "section": "solve", "ref": ""}, {"id": "solve-Power Query问题-5", "type": "solve", "column": "C16", "title": "刷新很慢", "text": "Power Query问题 刷新很慢 先筛选缩小数据量再做复杂转换；减少破坏折叠的步骤。", "section": "solve", "ref": ""}, {"id": "faq-0", "type": "faq", "column": "", "title": "如何统计重复数据？", "text": "如何统计重复数据？ 用 COUNTIF：=COUNTIF(A:A,A2)>1 标出重复；或数据→删除重复项直接去重；365 用 =UNIQUE(A:A) 取唯一值。", "section": "faq", "ref": ""}, {"id": "faq-1", "type": "faq", "column": "", "title": "如何制作动态下拉框？", "text": "如何制作动态下拉框？ 二级联动：先定义各省城市为名称，一级下拉选省份，二级数据验证来源写 =INDIRECT($A2)。", "section": "faq", "ref": ""}, {"id": "faq-2", "type": "faq", "column": "", "title": "为什么 VLOOKUP 返回 #N/A？", "text": "为什么 VLOOKUP 返回 #N/A？ 四查：①查找值前后有空格没（TRIM）；②首列真有这个值吗；③数字存成文本（格式统一）；④第四参数写 FALSE 了吗。还不行就换 XLOOKUP。", "section": "faq", "ref": ""}, {"id": "faq-3", "type": "faq", "column": "", "title": "筛选后求和不对怎么办？", "text": "筛选后求和不对怎么办？ SUM 会把隐藏行也加进去，改用 =SUBTOTAL(109,区域)，109 表示只对可见单元格求和。", "section": "faq", "ref": ""}, {"id": "faq-4", "type": "faq", "column": "", "title": "日期显示成数字怎么办？", "text": "日期显示成数字怎么办？ 那是日期序列值，选中→Ctrl+1→设为日期格式。反过来文本日期转真日期用 DATEVALUE 或分列。", "section": "faq", "ref": ""}, {"id": "faq-5", "type": "faq", "column": "", "title": "如何合并多个工作表？", "text": "如何合并多个工作表？ 结构相同的表：Power Query→追加查询，一键合并几十个表，还能自动刷新。", "section": "faq", "ref": ""}, {"id": "faq-6", "type": "faq", "column": "", "title": "公式太长看不懂怎么办？", "text": "公式太长看不懂怎么办？ 用 LET 给中间结果起名：=LET(x,SUM(A:A),y,COUNT(A:A),x/y)。或按 Alt+Enter 在编辑栏换行。", "section": "faq", "ref": ""}, {"id": "faq-7", "type": "faq", "column": "", "title": "文件太大打不开？", "text": "文件太大打不开？ 先关自动重算（公式→手动）；删多余格式（Ctrl+End 看看用到哪）；另存为 xlsb 二进制格式体积减半。", "section": "faq", "ref": ""}, {"id": "faq-8", "type": "faq", "column": "", "title": "如何防止别人改公式？", "text": "如何防止别人改公式？ 全选→取消锁定→只选中公式区→锁定→审阅→保护工作表设密码。只锁公式，数据区可填。", "section": "faq", "ref": ""}, {"id": "faq-9", "type": "faq", "column": "", "title": "打印时每页都有标题行？", "text": "打印时每页都有标题行？ 页面布局→打印标题→顶端标题行→选 $1:$1。", "section": "faq", "ref": ""}, {"id": "faq-10", "type": "faq", "column": "", "title": "下拉数字变成日期？", "text": "下拉数字变成日期？ 如 1-2 被认成 1月2日。先设单元格为文本格式再输，或前面加英文单引号 '1-2。", "section": "faq", "ref": ""}, {"id": "faq-11", "type": "faq", "column": "", "title": "VLOOKUP 只能向右找怎么办？", "text": "VLOOKUP 只能向右找怎么办？ 用 INDEX+MATCH：=INDEX(返回列,MATCH(查找值,查找列,0))，方向随意。或直接 XLOOKUP。", "section": "faq", "ref": ""}, {"id": "faq-12", "type": "faq", "column": "", "title": "如何批量提取括号内容？", "text": "如何批量提取括号内容？ Ctrl+E 快速填充最省事；公式法 =MID(A2,FIND(\"(\",A2)+1,FIND(\")\",A2)-FIND(\"(\",A2)-1)。", "section": "faq", "ref": ""}, {"id": "faq-13", "type": "faq", "column": "", "title": "条件格式太多卡顿？", "text": "条件格式太多卡顿？ 条件格式→管理规则，删掉整列引用的（如 $A:$A），改成实际区域 $A$1:$A$1000。", "section": "faq", "ref": ""}, {"id": "faq-14", "type": "faq", "column": "", "title": "共享后公式被改乱？", "text": "共享后公式被改乱？ 保护工作表+只允许填数据区；或存 OneDrive 用版本历史找回。", "section": "faq", "ref": ""}, {"id": "faq-15", "type": "faq", "column": "", "title": "如何让序号下拉不中断？", "text": "如何让序号下拉不中断？ 用 =ROW()-1 公式下拉，删行不断号；或转智能表格，公式自动填充。", "section": "faq", "ref": ""}, {"id": "faq-16", "type": "faq", "column": "", "title": "身份证号变成科学计数法怎么办？", "text": "身份证号变成科学计数法怎么办？ 先设文本格式再录入；已变形用 =TEXT(A1,\"0\") 恢复显示。", "section": "faq", "ref": ""}, {"id": "faq-17", "type": "faq", "column": "", "title": "VLOOKUP 返回 #N/A 但值明明存在？", "text": "VLOOKUP 返回 #N/A 但值明明存在？ 检查多余空格（TRIM 清理）、数字与文本格式不一致，统一后再查。", "section": "faq", "ref": ""}, {"id": "faq-18", "type": "faq", "column": "", "title": "如何快速删除重复行？", "text": "如何快速删除重复行？ 数据→删除重复项；365 也可用 =UNIQUE(A:A) 提取唯一值。", "section": "faq", "ref": ""}, {"id": "faq-19", "type": "faq", "column": "", "title": "筛选后序号不连续怎么办？", "text": "筛选后序号不连续怎么办？ 用 =SUBTOTAL(103,$A$2:A2) 下拉，筛选后序号自动连续。", "section": "faq", "ref": ""}, {"id": "faq-20", "type": "faq", "column": "", "title": "公式下拉后结果都一样？", "text": "公式下拉后结果都一样？ 检查计算选项是否为手动，改回自动；或单元格被设为文本格式。", "section": "faq", "ref": ""}, {"id": "faq-21", "type": "faq", "column": "", "title": "如何跨表汇总多个分表？", "text": "如何跨表汇总多个分表？ 用 =SUM(表1:表3!B2) 三维引用；或 Power Query 合并文件夹。", "section": "faq", "ref": ""}, {"id": "faq-22", "type": "faq", "column": "", "title": "打印时每页都显示标题行？", "text": "打印时每页都显示标题行？ 页面布局→打印标题→顶端标题行设为 $1:$1。", "section": "faq", "ref": ""}, {"id": "faq-23", "type": "faq", "column": "", "title": "CSV 打开中文乱码？", "text": "CSV 打开中文乱码？ 用数据→从文本/CSV 导入，编码选 UTF-8 或 936。", "section": "faq", "ref": ""}, {"id": "faq-24", "type": "faq", "column": "", "title": "文件太大打开很慢？", "text": "文件太大打开很慢？ Ctrl+End 看已用区域是否虚大，删多余行列格式后保存。", "section": "faq", "ref": ""}, {"id": "faq-25", "type": "faq", "column": "", "title": "如何防止别人改我的公式？", "text": "如何防止别人改我的公式？ 审阅→保护工作表，锁定含公式单元格后设密码。", "section": "faq", "ref": ""}, {"id": "faq-26", "type": "faq", "column": "", "title": "数据透视表日期不能按月分组？", "text": "数据透视表日期不能按月分组？ 检查该列是否混入文本，先统一为日期格式再分组。", "section": "faq", "ref": ""}, {"id": "faq-27", "type": "faq", "column": "", "title": "图表新增数据不自动更新？", "text": "图表新增数据不自动更新？ 数据源转智能表格（Ctrl+T），图表会自动扩展。", "section": "faq", "ref": ""}, {"id": "faq-28", "type": "faq", "column": "", "title": "如何批量把文本型数字转数值？", "text": "如何批量把文本型数字转数值？ 选中列→分列→完成；或空单元格写 1 复制→选择性粘贴→乘。", "section": "faq", "ref": ""}, {"id": "faq-29", "type": "faq", "column": "", "title": "Excel 卡死没保存能找回吗？", "text": "Excel 卡死没保存能找回吗？ 文件→信息→管理工作簿→恢复未保存的工作簿；建议开 5 分钟自动恢复。", "section": "faq", "ref": ""}, {"id": "chart-0", "type": "chart", "column": "C07", "title": "柱状图", "text": "柱状图 比较各类别数值 选中数据（含表头） 插入→柱状图→簇状 右键→添加数据标签 删除网格线", "section": "chartlib", "ref": ""}, {"id": "chart-1", "type": "chart", "column": "C07", "title": "条形图", "text": "条形图 类别名称长时的比较 选中数据 插入→条形图 类别放纵轴，名称再长也不挤", "section": "chartlib", "ref": ""}, {"id": "chart-2", "type": "chart", "column": "C07", "title": "饼图", "text": "饼图 占比（类别≤6） 选中两列（类别+数值） 插入→饼图 右键→添加数据标签→百分比", "section": "chartlib", "ref": ""}, {"id": "chart-3", "type": "chart", "column": "C07", "title": "折线图", "text": "折线图 随时间趋势 日期放横轴 插入→折线图→带数据标记 右键→添加趋势线", "section": "chartlib", "ref": ""}, {"id": "chart-4", "type": "chart", "column": "C07", "title": "散点图", "text": "散点图 两变量关系 X/Y 两列数值 插入→散点图 添加趋势线看相关性", "section": "chartlib", "ref": ""}, {"id": "chart-5", "type": "chart", "column": "C07", "title": "雷达图", "text": "雷达图 多维度评价 维度放第一列 插入→雷达图 适合 5-8 个维度", "section": "chartlib", "ref": ""}, {"id": "chart-6", "type": "chart", "column": "C07", "title": "甘特图", "text": "甘特图 项目进度 任务/开始/工期三列 插入→条形图→堆积 把「开始」系列设为无填充 调整纵轴逆序", "section": "chartlib", "ref": ""}, {"id": "chart-7", "type": "chart", "column": "C07", "title": "漏斗图", "text": "漏斗图 转化流程 阶段+人数两列 插入 译时确定，不能在运行中修改。魔法数字（税率、上限等）都应该用常量。", "section": "vba", "ref": "Const"}, {"id": "vba-ReDim", "type": "vba", "column": "C11", "title": "ReDim", "text": "ReDim 重定义动态数组 规则： - 只能用于动态数组（声明时不写上下界）。", "section": "vba", "ref": "ReDim"}, {"id": "vba-Option Explicit", "type": "vba", "column": "C11", "title": "Option Explicit", "text": "Option Explicit 强制变量声明 开启后，未经 `Dim` 的变量直接报错。防止拼写错误产生难以察觉的 bug。**所有模块都应该加。** ---", "section": "vba", "ref": "Option Explicit"}, {"id": "vba-Select / Case", "type": "vba", "column": "C11", "title": "Select / Case", "text": "Select / Case 多分支选择 `Case` 的四种形式：`Is` 比较、`To` 范围、逗号多值、`Else` 兜底。", "section": "vba", "ref": "Select / Case"}, {"id": "vba-For / Next", "type": "vba", "column": "C11", "title": "For / Next", "text": "For / Next 计数循环 ", "section": "vba", "ref": "For / Next"}, {"id": "vba-For Each", "type": "vba", "column": "C11", "title": "For Each", "text": "For Each 集合遍历 注意：`For Each` 的循环变量**必须是 Variant 或对象类型**，不能是 `Long`。", "section": "vba", "ref": "For Each"}, {"id": "vba-Do / Loop", "type": "vba", "column": "C11", "title": "Do / Loop", "text": "Do / Loop 条件循环 四种形式：", "section": "vba", "ref": "Do / Loop"}, {"id": "vba-While / Wend", "type": "vba", "column": "C11", "title": "While / Wend", "text": "While / Wend 旧式循环 功能与 `Do While...Loop` 相同，是老式写法。新代码推荐用 `Do...Loop`。", "section": "vba", "ref": "While / Wend"}, {"id": "vba-GoTo", "type": "vba", "column": "C11", "title": "GoTo", "text": "GoTo 跳转 现代 VBA 中 `GoTo` 主要用于错误处理。随意跳转会让代码难以维护，**不要**用它代替正常的条件分支。", "section": "vba", "ref": "GoTo"}, {"id": "vba-Exit", "type": "vba", "column": "C11", "title": "Exit", "text": "Exit 提前退出 常用于\"卫语句\"：先处理异常情况并退出，主逻辑保持平直：", "section": "vba", "ref": "Exit"}, {"id": "vba-End", "type": "vba", "column": "C11", "title": "End", "text": "End 终止程序 > **警告**：`End` 会粗暴终止一切，不触发任何清理代码。正常结束过程用 `Exit Sub`，几乎用不到 `End`。 ---", "section": "vba", "ref": "End"}, {"id": "vba-Sub", "type": "vba", "column": "C11", "title": "Sub", "text": "Sub 过程（做事） ", "section": "vba", "ref": "Sub"}, {"id"           const rows = txt.split(/\r?\n/).filter(x=>x.trim()).map(x=>x.split(",").map(c=>c.trim().replace(/^"|"$/g,"")));
          res(rows);
        } else {
          const wb = XLSX.read(e.target.result, {type:"array"});
          res(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1}));
        }
      }catch(err){ rej(err); }
    };
    if(/\.csv$/i.test(file.name)) r.readAsText(file, "UTF-8"); else r.readAsArrayBuffer(file);
  });
}

function formulaCheck(){
  const t = document.getElementById("t_fx").value;
  const o = document.getElementById("o_fx"); o.classList.remove("hidden");
  const issues = [];
  const pairs = {"(":")", "[":"]", "{":"}"};
  const stack = [];
  for(const ch of t){ if(pairs[ch]) stack.push(ch); else if(Object.values(pairs).includes(ch)){ const last = stack.pop(); if(!last || pairs[last]!==ch){ issues.push("括号不配对：多余的 " + ch); break; } } }
  if(stack.length) issues.push("括号不配对：少了右括号 " + stack.map(c=>pairs[c]).join(""));
  const fullw = t.match(/[（）【】，；：！？＝]/g);
  if(fullw) issues.push("发现全角符号 " + [...new Set(fullw)].join(" ") + "：公式里只能用半角符号");
  if(/!\s*[A-Z]+\d+/.test(t) && /！/.test(t)) issues.push("工作表感叹号用了全角 ！");
  if(!t.trim().startsWith("=")) issues.push("公式一般以 = 开头");
  o.innerHTML = issues.length
    ? "<b>发现 " + issues.length + " 个问题：</b>" + issues.map(x=>`<div class="tip">⚠️ ${esc(x)}</div>`).join("")
    : "<b>✅ 体检通过</b><br><span style='color:var(--muted);font-size:12px'>括号配对正常，未发现全角符号</span>";
}

  if(!/^\d{17}[\dX]$/.test(t)){ o.textContent = "格式不对：需要 18 位，前 17 位数字、最后一位数字或 X"; return; }
  const w = [7,9,10,5,8,4,2,1,6,3,7,9,10,5,8,4,2], cc = "10X98765432";
  let s = 0; for(let i=0;i<17;i++) s += (+t[i])*w[i];

  const sex = (+t[16]%2===1) ? "男" : "女";

  C13: [["案例中心","case"],["模板中心","tpl"]],
  C14: [["图表中心","chartlib"],["模板中心","tpl"]],
  C15: [["VBA 编程（自动化对照）","vba"]],
  C16: [["错误代码","errors"],["问题解决中心","solve"]],
  C17: [["模板中心","tpl"],["资源下载","res"]],
