性"], "tpl": "chart-scatter"}, {"name": "雷达图", "use": "多维度评价", "steps": ["维度放第一列", "插入→雷达图", "适合 5-8 个维度"], "tpl": "chart-radar"}, {"name": "甘特图", "use": "项目进度", "steps": ["任务/开始/工期三列", "插入→条形图→堆积", "把「开始」系列设为无填充", "调整纵轴逆序"], "tpl": "chart-gantt"}, {"name": "漏斗图", "use": "转化流程", "steps": ["阶段+人数两列", "插入→漏斗图（2019+）", "老版本用条形图模拟"], "tpl": "chart-funnel"}, {"name": "旭日图", "use": "多层级占比", "steps": ["层级从左到右排", "插入→旭日图（2016+）", "适合 2-3 层"], "tpl": "chart-sunburst"}, {"name": "地图图表", "use": "地域分布", "steps": ["地名要规范（省/国家）", "插入→地图（2019+）", "值用颜色深浅表示"], "tpl": "chart-map"}], "pivot_adv": [{"t": "基础操作", "body": "选中数据→插入→数据透视表。四个区：行、列、值、筛选。值字段默认求和，右键可改计数/平均/最大值。"}, {"t": "分组统计", "body": "日期右键→组合：按年/季度/月分组。数字右键→组合：按区间分组（如成绩段 60-70/70-80）。"}, {"t": "多维分析", "body": "行放「区域」、列放「季度」、值放「销售额」，一眼看交叉汇总。值显示方式→差异/百分比，做同比环比。"}, {"t": "切片器", "body": "插入切片器→选字段，点按钮即筛选，多表联动（报表连接）。比筛选直观 10 倍，汇报必备。"}, {"t": "时间轴", "body": "日期字段专用筛选器，按年/季度/月/日切换，比切片器更适合时间。"}, {"t": "数据模型", "body": "多表关联：把订单表+产品表都添加到数据模型，用字段关联，一张透视表跨表分析。Power Pivot 的地基。"}], "pq_adv": [{"t": "导入 CSV", "body": "数据→获取数据→从文本/CSV。乱码？改编码为 65001（UTF-8）或 936（GBK）。"}, {"t": "导入网页", "body": "数据→自网站→粘贴 URL。网页表格结构变化时需重新检查步骤。"}, {"t": "数据清洗", "body": "删空行、替换值、填充、修剪、分列、更改类型。每一步都记录在右侧「应用的步骤」，可回退。"}, {"t": "合并表", "body": "追加查询=上下堆叠（多月数据合并）；合并查询=左右连接（VLOOKUP 的批量版）。"}, {"t": "拆分列", "body": "按分隔符/字符数拆分。\"2026-10-01\" 按 \"-\" 拆成年/月/日三列。"}, {"t": "自动刷新", "body": "关闭并上载后，源文件更新→右键刷新。还可设置打开文件自动刷新：数据→查询属性。"}], "ppivot": [{"t": "数据模型", "body": "Power Pivot→添加到数据模型。多表不用 VLOOKUP，用关系关联，百万行不卡。"}, {"t": "多表关联", "body": "关系视图拖线连主外键。一对多：产品表（1）→订单表（多）。"}, {"t": "DAX 公式入门", "body": "DAX 长得像 Excel 函数但思维是列式。SUM(表[列])、CALCULATE(表达式, 筛选)、RELATED(取关联表字段)。"}, {"t": "常用 DAX", "body": "总销售额 =SUM(订单[金额])\n当年累计 =CALCULATE([总销售额], DATESYTD(日期表[日期]))\n同比 =DIVIDE([总销售额]-[去年同期], [去年同期])"}, {"t": "KPI 指标", "body": "在数据模型中建度量值：销售额、利润率、完成率。度量值随切片器自动重算，一处定义处处用。"}], "cfmt": [{"t": "颜色标记", "body": "开始→条件格式→突出显示单元格规则：大于/小于/介于/等于，自动上色。"}, {"t": "数据条", "body": "在单元格内画横向条形图，数值大小一目了然。适合业绩对比。"}, {"t": "图标集", "body": "红绿灯/箭头/旗帜，按阈值自动打标。管理驾驶舱常用。"}, {"t": "自定义公式", "body": "新建规则→使用公式。注意 $ 锁定：=$B2>100 整行变色（选中整行时列锁定行不锁定）。"}, {"t": "案例：自动标红逾期", "body": "=AND($E2<TODAY(),$G2<>\"已完成\") → 逾期未完成的整行变红。"}, {"t": "案例：高亮重复", "body": "选中区域→条件格式→突出显示→重复值。或公式 =COUNTIF($A:$A,$A2)>1 自定义颜色。"}], "dval": [{"t": "下拉菜单", "body": "数据→数据验证→序列，来源输入：男,女（英文逗号）。或引用一列区域。"}, {"t": "联动下拉框", "body": "一级菜单选「省份」→二级自动出该省城市。做法：定义名称+INDIRECT($A2)。先做各省名单，再建一级下拉，二级来源 =INDIRECT(A2)。"}, {"t": "日期限制", "body": "数据验证→日期→介于 2026-1-1 到 2026-12-31，只能输今年日期。"}, {"t": "输入规则", "body": "整数/小数/文本长度：手机号设文本长度=11；年龄设整数介于 18-65。出错警告可自定义提示语。"}, {"t": "圈释无效数据", "body": "数据→数据验证→圈释无效数据，已有违规的一眼现形。"}], "case_center": [{"cat": "财务案例", "items": [{"t": "工资表", "d": "应发=基本+绩效+补贴-社保，用 IF 判断个税", "f": "=D2+E2+F2-G2"}, {"t": "预算表", "d": "SUMIFS 按部门+月份汇总，条件格式超预算标红", "f": "=SUMIFS(实际列,部门列,A2,月份列,B2)"}]}, {"cat": "人事案例", "items": [{"t": "考勤管理", "d": "COUNTIF 统计迟到，NETWORKDAYS 算出勤", "f": "=COUNTIF(B2:AF2,\"迟\")"}, {"t": "花名册", "d": "DATEDIF 算工龄，VLOOKUP 关联部门", "f": "=DATEDIF(C2,TODAY(),\"Y\")"}]}, {"cat": "销售案例", "items": [{"t": "销售统计", "d": "RANK 排名，SUMPRODUCT 加权", "f": "=RANK(B2,B:B)"}, {"t": "环比分析", "d": "透视表按月分组，值显示差异百分比", "f": "=(本月-上月)/上月"}]}, {"cat": "仓库案例", "items": [{"t": "库存管理", "d": "SUMIF 分开汇总出入库，IF 预警", "f": "=SUMIF(类型,\"入库\",数量)-SUMIF(类型,\"出库\",数量)"}, {"t": "盘点差异", "d": "实盘-账面，条件格式标差异", "f": "=D2-C2"}]}, {"cat": "采购案例", "items": [{"t": "采购跟踪", "d": "EOMONTH 算账期，逾期标红", "f": "=EOMONTH(下单日期,1)"}, {"t": "比价表", "d": "MIN 取最低价，INDEX+MATCH 反查供应商", "f": "=INDEX(供应商列,MATCH(MIN(价格区),价格区,0))"}]}, {"cat": "物流案例", "items": [{"t": "运费统计", "d": "SUMIFS 按线路+月份汇总", "f": "=SUMIFS(运费列,线路列,A2)"}, {"t": "报关数据分析", "d": "透视表按 HS 编码汇总，TOP10 品名", "f": "数据透视表：行=品名，值=金额求和"}]}], "exam": [{"t": "MOS 认证", "d": "微软官方 Office 认证，分 Associate/Expert/Master 三级，全球通用，外企认可度高。考试为实操题，Excel 侧重函数/图表/透视表。", "tips": ["官网报名，国内有考点", "Expert 含 VBA 和高级数据管理"]}, {"t": "全国计算机等级考试", "d": "教育部考试中心。二级 MS Office 是大学生最热门科目：选择题+Word+Excel+PPT 实操。证书可加综测分、求职有用。", "tips": ["二级考大纲每年微调", "Excel 重点：函数、图表、数据处理"]}, {"t": "企业办公技能考试", "d": "很多大企业校招/内训自设：限时完成数据清洗+报表+PPT。用本站学习路线「中级」水平即可应对。", "tips": ["练速度：快捷键是关键", "透视表+图表是必考"]}], "faq": [{"q": "如何统计重复数据？", "a": "用 COUNTIF：=COUNTIF(A:A,A2)>1 标出重复；或数据→删除重复项直接去重；365 用 =UNIQUE(A:A) 取唯一值。"}, {"q": "如何制作动态下拉框？", "a": "二级联动：先定义各省城市为名称，一级下拉选省份，二级数据验证来源写 =INDIRECT($A2)。"}, {"q": "为什么 VLOOKUP 返回 #N/A？", "a": "四查：①查找值前后有空格没（TRIM）；②首列真有这个值吗；③数字存成文本（格式统一）；④第四参数写 FALSE 了吗。还不行就换 XLOOKUP。"}, {"q": "筛选后求和不对怎么办？", "a": "SUM 会把隐藏行也加进去，改用 =SUBTOTAL(109,区域)，109 表示只对可见单元格求和。"}, {"q": "日期显示成数字怎么办？", "a": "那是日期序列值，选中→Ctrl+1→设为日期格式。反过来文本日期转真日期用 DATEVALUE 或分列。"}, {"q": "如何合并多个工作表？", "a": "结构相同的表：Power Query→追加查询，一键合并几十个表，还能自动刷新。"}, {"q": "公式太长看不懂怎么办？", "a": "用 LET 给中间结果起名：=LET(x,SUM(A:A),y,COUNT(A:A),x/y)。或按 Alt+Enter 在编辑栏换行。"}, {"q": "文件太大打不开？", "a": "先关自动重算（公式→手动）；删多余格式（Ctrl+End 看看用到哪）；另存为 xlsb 二进制格式体积减半。"}, {"q": "如何防止别人改公式？", "a": "全选→取消锁定→只选中公式区→锁定→审阅→保护工作表设密码。只锁公式，数据区可填。"}, {"q": "打印时每页都有标题行？", "a": "页面布局→打印标题→顶端标题行→选 $1:$1。"}, {"q": "下拉数字变成日期？", "a": "如 1-2 被认成 1月2日。先设单元格为文本格式再输，或前面加英文单引号 '1-2。"}, {"q": "VLOOKUP 只能向右找怎么办？", "a": "用 INDEX+MATCH：=INDEX(返回列,MATCH(查找值,查找列,0))，方向随意。或直接 XLOOKUP。"}, {"q": "如何批量提取括号内容？", "a": "Ctrl+E 快速填充最省事；公式法 =MID(A2,FIND(\"(\",A2)+1,FIND(\")\",A2)-FIND(\"(\",A2)-1)。"}, {"q": "条件格式太多卡顿？", "a": "条件格式→管理规则，删掉整列引用的（如 $A:$A），改成实际区域 $A$1:$A$1000。"}, {"q": "共享后公式被改乱？", "a": "保护工作表+只允许填数据区；或存 OneDrive 用版本历史找回。"}, {"q": "如何让序号下拉不中断？", "a": "用 =ROW()-1 公式下拉，删行不断号；或转智能表格，公式自动填充。"}, {"q": "身份证号变成科学计数法怎么办？", "a": "先设文本格式再录入；已变形用 =TEXT(A1,\"0\") 恢复显示。"}, {"q": "VLOOKUP 返回 #N/A 但值明明存在？", "a": "检查多余空格（TRIM 清理）、数字与文本格式不一致，统一后再查。"}, {"q": "如何快速删除重复行？", "a": "数据→删除重复项；365 也可用 =UNIQUE(A:A) 提取唯一值。"}, {"q": "筛选后序号不连续怎么办？", "a": "用 =SUBTOTAL(103,$A$2:A2) 下拉，筛选后序号自动连续。"}, {"q": "公式下拉后结果都一样？", "a": "检查计算选项是否为手动，改回自动；或单元格被设为文本格式。"}, {"q": "如何跨表汇总多个分表？", "a": "用 =SUM(表1:表3!B2) 三维引用；或 Power Query 合并文件夹。"}, {"q": "打印时每页都显示标题行？", "a": "页面布局→打印标题→顶端标题行设为 $1:$1。"}, {"q": "CSV 打开中文乱码？", "a": "用数据→从文本/CSV 导入，编码选 UTF-8 或 936。"}, {"q": "文件太大打开很慢？", "a": "Ctrl+End 看已用区域是否虚大，删多余行列格式后保存。"}, {"q": "如何防止别人改我的公式？", "a": "审阅→保护工作表，锁定含公式单元格后设密码。"}, {"q": "数据透视表日期不能按月分组？", "a": "检查该列是否混入文本，先统一为日期格式再分组。"}, {"q": "图表新增数据不自动更新？", "a": "数据源转智能表格（Ctrl+T），图表会自动扩展。"}, {"q": "如何批量把文本型数字转数值？", "a": "选中列→分列→完成；或空单元格写 1 复制→选择性粘贴→乘。"}, {"q": "Excel 卡死没保存能找回吗？", "a": "文件→信息→管理工作簿→恢复未保存的工作簿；建议开 5 分钟自动恢复。"}], "repair": [{"t": "文件打不开", "body": "①打开 Excel→文件→打开→选中文件→打开按钮下拉→打开并修复；②改后缀 xlsx→zip 解压取 xl/worksheets 下的 xml；③用 WPS 试试，兼容性有时更好。"}, {"t": "文件损坏", "body": "从备份/OneDrive 版本历史恢复；用「打开并修复」→提取数据；新建工作簿用外部引用 =['坏文件.xlsx']Sheet1'!A1 抢救数据。"}, {"t": "文件变成只读", "body": "右键文件→属性→取消只读勾选；文件→另存为换个名字；检查是否被别人打开（共享盘）。"}, {"t": "内容丢失", "body": "文件→信息→管理工作簿→恢复未保存的工作簿；自动恢复位置：文件→选项→保存→看路径。平时开自动恢复 5 分钟。"}, {"t": "公式丢失（变数值）", "body": "可能误做了选择性粘贴为值。用版本历史找回；教训：重要表做公式前先备份一份。"}, {"t": "预防指南", "body": "①开自动保存/自动恢复 ②重要文件每天另存版本号 ③存 OneDrive 有 30 天版本历史 ④大公式表定期另存 xlsb。"}], "roadmap": [{"lv": "新手", "color": "#22c55e", "items": ["认识界面：功能区/编辑栏/工作表", "单元格：输入/选中/填充", "格式：字体/对齐/边框/数字格式", "基础操作：排序/筛选/冻结/打印"]}, {"lv": "初级", "color": "#3b82f6", "items": ["基础函数：SUM/AVERAGE/COUNT/MAX/MIN", "条件函数：IF/SUMIF/COUNTIF", "查找函数：VLOOKUP", "文本日期：LEFT/MID/TODAY/DATEDIF"]}, {"lv": "中级", "color": "#f59e0b", "items": ["图表：选型/制作/美化", "条件格式：标记/数据条/公式", "数据验证：下拉/联动/规则", "数据透视表：汇总/分组/切片器", "高级函数：INDEX+MATCH/SUMPRODUCT"]}, {"lv": "高级", "color": "#ef4444", "items": ["Power Query：清洗/合并/自动刷新", "Power Pivot：数据模型/DAX", "VBA：录制/语法/自动化", "动态数组：FILTER/SORT/XLOOKUP", "综合：仪表盘/多表联动"]}], "resources": [{"cat": "模板", "items": ["21 个模板（本站模板下载区：4 图表模板 + 4 数据文件）", "数据文件：销售数据1000行/人事考勤样本/函数练习题/透视表练习数据（配练习任务）"]}, {"cat": "示例数据集", "items": ["销售数据 1000 行（订单/区域/品类齐全，配 6 个练习任务 → 模板下载区「数据」分类下载）", "人事考勤样本（25 人 9 月考勤，迟到/请假公式+部门汇总 → 模板下载区「数据」分类下载）"]}, {"cat": "VBA 代码库", "items": ["8 个实例代码（本站 VBA 区一键复制）", "33 个关键字手册"]}, {"cat": "练习文件", "items": ["函数练习题（12 道 VLOOKUP/SUMIFS/XLOOKUP 实战，附参考答案 → 模板下载区「数据」分类下载）", "透视表练习数据（500 行明细，配 6 个透视表任务+避坑 → 模板下载区「数据」分类下载）"]}], "tip_cats": [{"cat": "数据录入技巧", "icon": "⌨️", "items": [{"t": "自动填充序号", "how": "首格输入 1、第二格输入 2，选中两格拖填充柄；或用 =ROW()-1 下拉，删行不中断"}, {"t": "自动生成流水号", "how": "用 =\"NO.\"&TEXT(ROW()-1,\"0000\") 下拉，序号自动补零对齐"}, {"t": "快速录入当前日期", "how": "按 Ctrl+; 直接输入今天日期（静态值，不会每天变）"}, {"t": "快速录入当前时间", "how": "按 Ctrl+Shift+; 输入当前时间；日期时间一起按 Ctrl+; 空格 Ctrl+Shift+;"}, {"t": "快速输入重复内容", "how": "输入前几个字后按 Alt+↓，从本列已录入的值里直接选"}, {"t": "下拉选择录入", "how": "数据→数据验证→序列，来源输入 男,女，只能点选不能乱填"}, {"t": "联动下拉菜单", "how": "一级菜单做命名区域，二级数据验证→序列用 =INDIRECT($A2) 引用"}, {"t": "防止重复输入", "how": "数据验证→自定义，公式 =COUNTIF(A:A,A1)=1，重复就报错"}, {"t": "批量导入数据", "how": "数据→获取数据→从文本/CSV，一次把外部数据整份导进来"}]}, {"cat": "数据清洗技巧", "icon": "🧹", "items": [{"t": "一秒删除空行", "how": "选中区域→Ctrl+G 定位→空值→右键删除整行"}, {"t": "删除空列", "how": "选中区域→Ctrl+G 空值→右键删除整列（先备份原表）"}, {"t": "删除重复值", "how": "数据→删除重复项，勾选关键列，一键去重"}, {"t": "合并重复记录", "how": "数据透视表按关键字段分组，对金额求和、对订单计数"}, {"t": "去除隐藏空格", "how": "=TRIM(A1) 去首尾空格；=CLEAN(A1) 去换行等不可见字符"}, {"t": "去除换行符", "how": "查找替换：查找内容处按 Ctrl+J，替换为留空，全部替换"}, {"t": "统一日期格式", "how": "选中列→数据→分列→下一步→日期 YMD，一次把文本日期转正"}, {"t": "统一手机号格式", "how": "先设为文本格式再录入；已变形用 =TEXT(A1,\"0\") 恢复显示"}, {"t": "数字文本互转", "how": "数字转文本用 =TEXT(A1,\"0\")；文本转数字用 =A1*1 或分列→常规"}]}, {"cat": "函数应用技巧", "icon": "∑", "items": [{"t": "VLOOKUP精确匹配", "how": "=VLOOKUP(值,区域,列号,0)，第四参数写 0 才是精确查找"}, {"t": "VLOOKUP反向查询", "how": "右查左改用 =INDEX(B:B,MATCH(值,A:A,0))"}, {"t": "XLOOKUP一步到位", "how": "=XLOOKUP(值,查找列,返回列,\"未找到\")，不用数第几列"}, {"t": "INDEX+MATCH多条件", "how": "=INDEX(返回列,MATCH(1,(条件列1=条件1)*(条件列2=条件2),0))"}, {"t": "模糊匹配查询", "how": "=VLOOKUP(\"*\"&关键词&\"*\",区域,2,0)，通配符前后包夹"}, {"t": "双向查询", "how": "=INDEX(区域,MATCH(行值,首列,0),MATCH(列值,首行,0)) 行列交叉定位"}, {"t": "跨表查询", "how": "=VLOOKUP(A2,INDIRECT(\"'\"&B2&\"'!A:B\"),2,0)，按表名动态切换"}, {"t": "动态查询面板", "how": "数据验证做下拉选关键词，XLOOKUP 引用该单元格，选谁查谁"}, {"t": "多条件统计", "how": "=SUMIFS(求和列,条件列1,条件1,条件列2,条件2)，条件可继续加"}, {"t": "动态汇总区域", "how": "=SUM(OFFSET(首格,0,0,COUNTA(列),1))，新增行自动纳入"}]}, {"cat": "文本处理技巧", "icon": "🔤", "items": [{"t": "提取姓名中的姓", "how": "=LEFT(A2,1)，复姓手动处理或用快速填充"}, {"t": "提取手机号", "how": "固定位置用 =MID(A2,12,11)；不固定用 Ctrl+E 快速填充"}, {"t": "提取邮箱", "how": "用 Ctrl+E 按示例提取；或 =MID(A2,FIND(\"@\",A2)-6,20) 再 TRIM"}, {"t": "分离姓和名", "how": "姓 =LEFT(A2,1)，名 =RIGHT(A2,LEN(A2)-1)"}, {"t": "中英文拆分", "how": "旁边列手写一行英文示例，选中→Ctrl+E，自动按规律拆分"}, {"t": "字符串替换", "how": "=SUBSTITUTE(A2,\"旧\",\"新\")，嵌套可做多重替换"}, {"t": "批量修改内容", "how": "Ctrl+H 查找替换，支持通配符 * ?，可限定范围"}, {"t": "批量添加前缀", "how": "=\"前缀\"&A2；纯显示用自定义格式 \"前缀\"@"}, {"t": "批量添加后缀", "how": "=A2&\"元\"；数字加单位也可用自定义格式 0\"元\""}]}, {"cat": "日期时间技巧", "icon": "📅", "items": [{"t": "计算年龄", "how": "=DATEDIF(出生日期,TODAY(),\"Y\")，周岁一键得出"}, {"t": "计算工龄", "how": "=DATEDIF(入职日,TODAY(),\"Y\")&\"年\"&DATEDIF(入职日,TODAY(),\"YM\")&\"月\""}, {"t": "工作日计算", "how": "=NETWORKDAYS(开始,结束)，自动排除周六日"}, {"t": "节假日排除", "how": "=NETWORKDAYS(开始,结束,节假日区域)，第三参数放假日清单"}, {"t": "倒计时计算", "how": "=目标日期-TODAY()&\"天\"，过期变负数可标红"}, {"t": "取月初日期", "how": "=EOMONTH(日期,-1)+1，上月月末加一天即本月初"}, {"t": "取月末日期", "how": "=EOMONTH(日期,0)，自动处理大小月和闰年"}, {"t": "季度统计", "how": "辅助列 =\"Q\"&INT((MONTH(日期)+2)/3)，再透视表汇总"}, {"t": "周数计算", "how": "=WEEKNUM(日期,2)，第二参数 2 表示周一起始"}]}, {"cat": "格式美化技巧", "icon": "🎨", "items": [{"t": "隔行变色", "how": "条件格式→新建规则→公式 =MOD(ROW(),2)=0，设填充色"}, {"t": "自动高亮整行", "how": "选中区域→条件格式公式 =$A1=\"重点\"，整行自动上色"}, {"t": "数据条", "how": "开始→条件格式→数据条，数值大小一目了然"}, {"t": "图标集", "how": "条件格式→图标集，达标/预警/异常自动打对勾感叹号"}, {"t": "自动标红逾期", "how": "条件格式公式 =A2<TODAY()，过期日期自动变红"}, {"t": "自动标绿达标", "how": "=B2>=目标值 标绿，低于目标再加一条标红"}, {"t": "动态颜色变化", "how": "条件格式+公式绑定数值，数据变颜色自动跟"}, {"t": "重复值高亮", "how": "条件格式→突出显示单元格规则→重复值"}, {"t": "仪表盘美化", "how": "大字号 KPI + 条件格式图标 + 迷你图，注意留白对齐"}]}, {"cat": "图表技巧", "icon": "📈", "items": [{"t": "一键生成图表", "how": "选中数据按 Alt+F1 生成嵌入图表；F11 生成独立图表工作表"}, {"t": "动态图表", "how": "定义名称 =OFFSET(首格,0,0,COUNTA(列),1) 做数据源，新增自动扩展"}, {"t": "手绘甘特图", "how": "条形图：开始日期为起点、工期为长度，逆序类别+调透明度"}, {"t": "漏斗图", "how": "插入→漏斗图（2016 及以上），看各环节转化流失"}, {"t": "KPI达成图", "how": "环形图 + 大数字文本框，目标完成率一目了然"}, {"t": "销售驾驶舱", "how": "切片器 + 数据透视表 + 组合图，点选维度图表联动"}, {"t": "地图图表", "how": "插入→地图（365），按省份/国家数值自动着色"}, {"t": "单元格热力图", "how": "不用图表，条件格式→色阶直接在区域上画热力分布"}]}, {"cat": "打印技巧", "icon": "🖨️", "items": [{"t": "一页打印", "how": "页面布局→宽度/高度设为 1 页，超宽表格自动缩放"}, {"t": "打印标题行", "how": "页面布局→打印标题→顶端标题行设为 $1:$1，每页重复表头"}, {"t": "自动分页调整", "how": "视图→分页预览，拖动蓝色分页线控制每页内容"}, {"t": "打印网格线", "how": "页面设置→工作表→勾选网格线，表格线才能印出来"}, {"t": "打印批注", "how": "页面设置→工作表→批注选“工作表末尾”，批注集中打印"}, {"t": "横向打印", "how": "页面布局→纸张方向→横向，列多的表横过来打"}, {"t": "批量打印多表", "how": "按住 Ctrl 点多个工作表标签→文件→打印，一次全打"}, {"t": "只打印选中区域", "how": "选中区域→页面布局→打印区域→设置打印区域"}]}, {"cat": "快捷键技巧", "icon": "⚡", "items": [{"t": "Ctrl+D 向下填充", "how": "选中区域按 Ctrl+D，把最上一格内容/公式填满下方"}, {"t": "Ctrl+R 向右填充", "how": "选中区域按 Ctrl+R，把最左一格内容填满右侧"}, {"t": "Ctrl+E 快速填充", "how": "手写一个示例后按 Ctrl+E，自动识别规律拆分合并，提取手机号神器"}, {"t": "Alt+= 一键求和", "how": "自动对上方或左侧连续数字求和，月末汇总最快"}, {"t": "F4 重复与锁定", "how": "重复上一步操作；在公式中按 F4 切换 $ 绝对引用"}, {"t": "Ctrl+Shift+L 筛选", "how": "一键开关自动筛选，不用再去点菜单"}, {"t": "Ctrl+方向键跳转", "how": "瞬间跳到数据区域边缘，万行表格秒穿越"}, {"t": "Ctrl+空格选整列", "how": "选中当前整列；Shift+空格选中整行"}, {"t": "Ctrl+` 公式透视", "how": "切换显示公式与计算结果，查错时一眼看穿"}]}, {"cat": "数据透视表技巧", "icon": "🔄", "items": [{"t": "一键创建数据透视表", "how": "选中数据区域任意单元格 → 插入 → 数据透视表 → 确定，3 秒生成汇总。记住：源数据第一行必须是标题行，且不能有合并单元格。"}, {"t": "拖字段三步出报表", "how": "行：销售员；列：月份；值：销售额。拖三个字段，一张交叉统计表就出来了，比写几十个 SUMIFS 快十倍。"}, {"t": "值字段设置", "how": "值区域默认是「求和」，点字段旁小箭头 → 值字段设置，可切换计数/平均值/最大值。同一字段拖两次可同时看求和与占比。"}, {"t": "日期自动分组", "how": "右键日期字段 → 组合 → 按月/季度/年分组，一键把 365 天的明细变成 12 个月汇总。"}, {"t": "切片器秒筛选", "how": "数据透视表分析 → 插入切片器 → 勾选「部门」。点一下按钮报表即时过滤，开会演示神器。"}, {"t": "值显示方式", "how": "右键值字段 → 值显示方式 → 占总和的百分比，直接算出每个销售员的业绩占比，不用再写公式。"}, {"t": "一键刷新", "how": "源数据增删行后，在透视表上右键 → 刷新即可更新。建议把源数据转为「表格」（Ctrl+T），新增行自动纳入。"}, {"t": "更改数据源", "how": "数据多了要换表？数据透视表分析 → 更改数据源，重新框选区域，之前搭好的版式原样保留。"}]}, {"cat": "Power Query技巧", "icon": "🔗", "items": [{"t": "从表格导入 PQ", "how": "选中数据 → 数据 → 自表格/区域，一键进入 Power Query 编辑器。从此告别重复的手工清洗。"}, {"t": "一键删除空行空列", "how": "在 PQ 里选中列 → 右键 → 删除空行；开始 → 删除列 → 删除空列。刷新后新数据自动同样处理。"}, {"t": "分列拆数据", "how": "选中列 → 拆分列 → 按分隔符（如 - 或空格），身份证拆生日、地址拆省市，一步到位。"}, {"t": "合并查询代替 VLOOKUP", "how": "开始 → 合并查询，把两表按关键列连接，比 VLOOKUP 快且不会列错位。"}, {"t": "逆透视整理报表", "how": "选中月份列 → 转换 → 逆透视列，把横表变纵表，透视表最爱这种干净数据。"}, {"t": "替换值批量清洗", "how": "选中列 → 右键 → 替换值，把「男/女」换成「先生/女士」，或把错别字批量修正。"}, {"t": "添加条件列", "how": "添加列 → 条件列，按销售额自动打标签：>=10万为A级，公式写一次、刷新终身受用。"}, {"t": "关闭并上载+刷新", "how": "做完点「关闭并上载」，结果回到 Excel。以后源数据更新，数据 → 全部刷新，一键重跑全流程。"}]}], "solve_cats": [{"cat": "公式问题", "icon": "🧮", "items": [{"t": "公式不计算", "body": "先看公式→计算选项是否为“手动”，改回“自动”；再看单元格是否为文本格式，是则改常规后双击回车。"}, {"t": "显示公式而非结果", "body": "单元格格式为“文本”，或误开了“显示公式”（Ctrl+` 切换）。改为常规格式后双击单元格回车即可。"}, {"t": "结果错误但无报错", "body": "检查引用区域是否因增删行漂移、括号是否配对、VLOOKUP 是否误用近似匹配（第四参数应为 0）。"}, {"t": "自动计算失效", "body": "大文件常被设为手动计算。按 F9 立即重算，或公式→计算选项改回自动。"}, {"t": "循环引用", "body": "公式直接或间接引用了自己。看状态栏提示定位单元格，改写逻辑打破循环。"}, {"t": "公式被锁定改不动", "body": "工作表被保护了。审阅→撤销工作表保护（需要密码），或联系表主。"}, {"t": "下拉填充公式不变", "body": "检查是否为手动计算；或填充的只是值。确认引用方式（相对/绝对）是否符合预期。"}]}, {"cat": "错误代码专区", "icon": "❌", "items": [{"t": "#N/A 查找不到", "body": "VLOOKUP/XLOOKUP 没找到匹配值。检查多余空格（TRIM）、数字与文本格式不一致；用 IFNA 包裹给友好提示。"}, {"t": "#VALUE! 类型错误", "body": "文本参与了数值运算。检查隐藏空格、特殊字符，用 VALUE 转换或清理后再算。"}, {"t": "#REF! 引用失效", "body": "引用的单元格/区域被删除。撤销删除，或把公式中的引用改为有效区域。"}, {"t": "#NAME? 名称错误", "body": "函数名拼错或用了中文括号。检查拼写，括号一律用英文半角。"}, {"t": "#DIV/0! 除数为零", "body": "除数为 0 或空单元格。用 =IF(除数=0,\"-\",分子/除数) 规避。"}, {"t": "#NUM! 数值超范围", "body": "结果太大或迭代不收敛。检查参数数量级，迭代公式调大迭代次数。"}, {"t": "#SPILL! 溢出被挡", "body": "动态数组目标区域有内容挡住。清空溢出区域，或把公式移到空旷处。"}, {"t": "#CALC! 计算异常", "body": "动态数组返回空或逻辑错误。检查筛选条件是否全不满足，调整条件。"}]}, {"cat": "文件问题", "icon": "📁", "items": [{"t": "文件打不开", "body": "打开 Excel→文件→打开→选中文件→点“打开”按钮下拉箭头→“打开并修复”。"}, {"t": "文件损坏", "body": "先用“打开并修复”→“修复”；不行选“提取数据”；还可改后缀为 zip 解压取 xl/worksheets 下 xml 抢救。"}, {"t": "文件恢复", "body": "文件→信息→管理工作簿→恢复未保存的工作簿。建议把自动恢复间隔设为 5 分钟。"}, {"t": "文件变成只读", "body": "右键文件→属性，取消只读勾选；或文件被他人占用，另存一份副本编辑。"}, {"t": "自动关闭/闪退", "body": "运行 excel /safe 进安全模式排查；逐个禁用 COM 加载项，找到肇事者。"}, {"t": "保存失败", "body": "磁盘满、路径过长或云同步冲突。另存到本地短路径，暂停网盘同步再试。"}, {"t": "内容/公式丢失", "body": "可能只保存了值。去自动恢复版本或文件历史版本里找回，别覆盖原文件。"}]}, {"cat": "性能问题", "icon": "🐢", "items": [{"t": "Excel卡顿", "body": "计算选项改手动；删除多余条件格式；避免整列引用 A:A，改精确区域。"}, {"t": "Excel无响应", "body": "大运算时耐心等；真死机用任务管理器结束进程，再用自动恢复版本找回。"}, {"t": "Excel崩溃", "body": "更新 Office 到最新；禁用可疑加载项；控制面板→修复 Office 安装。"}, {"t": "启动慢", "body": "清理 XLSTART 启动文件夹里的多余文件；文件→选项→加载项禁用不用的。"}, {"t": "文件打开慢", "body": "Ctrl+End 看已用区域是否虚大，删除空白行列的格式后保存，体积立减。"}, {"t": "文件保存慢", "body": "图片压缩一下；删掉大量图形对象；老 xls 另存为 xlsx。"}, {"t": "计算速度慢", "body": "少用易失函数 NOW/TODAY/INDIRECT；数组公式改精确区域；能透视表就别堆公式。"}]}, {"cat": "筛选排序问题", "icon": "🔀", "items": [{"t": "筛选不完整", "body": "数据中有空行空列把区域隔断。删除空行后重新开启筛选。"}, {"t": "部分数据无法筛选", "body": "筛选只覆盖了部分区域。选中整表（Ctrl+A）再开筛选。"}, {"t": "排序错乱串行", "body": "只选中单列排序导致错位。务必选“扩展选定区域”再排序。"}, {"t": "日期排序错误", "body": "日期是文本格式。数据→分列→日期 YMD 转正后再排序。"}, {"t": "数字排序错误", "body": "数字存成了文本。选中列→感叹号→转换为数字。"}, {"t": "合并单元格排不了", "body": "先取消合并，用 Ctrl+D 填充内容后再排序。"}]}, {"cat": "打印问题", "icon": "🖨️", "items": [{"t": "打印不全", "body": "页面布局→缩放→调整为 1 页宽；检查打印区域是否框小了。"}, {"t": "打印出空白页", "body": "分页预览里拖蓝线收掉多余分页；删除打印区域外的残留格式。"}, {"t": "打印内容偏移", "body": "页面设置→页边距→勾选水平居中；检查纸张大小是否匹配。"}, {"t": "页码错误", "body": "页眉页脚→自定义页脚插入 &[页码]；检查起始页码设置。"}, {"t": "打印缩放异常", "body": "缩放设为“调整为 1 页”；宽表用横向打印。"}, {"t": "表格线印不出", "body": "页面设置→工作表→勾选“网格线”；或给区域加边框。"}]}, {"cat": "数据导入问题", "icon": "📥", "items": [{"t": "CSV乱码", "body": "别双击打开。用数据→从文本/CSV 导入，文件原始格式选 65001:UTF-8 或 936。"}, {"t": "中文乱码", "body": "导入时选对编码；已乱码的用 Power Query 重新指定编码导入一次。"}, {"t": "日期错乱", "body": "导入向导第三步把该列设为“日期 YMD”；事后也可用分列转换。"}, {"t": "数字变文本", "body": "数据→分列→完成；或 =A1*1 批量转数值。"}, {"t": "列错位", "body": "分隔符选错了。导入时勾选正确的逗号/制表符分隔，预览对齐再加载。"}, {"t": "前导零丢失", "body": "导入前把该列设为文本；或公式 =\"'\"&编号 保留 001 开头。"}]}, {"cat": "图表问题", "icon": "📊", "items": [{"t": "图表不更新", "body": "数据源是固定区域。转成智能表格（Ctrl+T）或用 OFFSET 动态名称，新增自动进图。"}, {"t": "图表数据丢失", "body": "隐藏行列被排除。右键图表→选择数据→勾选“显示隐藏行列中的数据”。"}, {"t": "坐标轴错误", "body": "右键坐标轴→设置坐标轴格式，检查最小值/最大值、单位和对数刻度。"}, {"t": "图表显示异常", "body": "图表被拉伸变形，重置大小；兼容模式文 "工资条模板", "file": "财务-工资表模板.xlsx", "desc": "自动计算应发工资"}, {"cat": "财务", "name": "应收账款模板", "file": "财务-应收账款模板.xlsx", "desc": "自动算未收与逾期"}, {"cat": "人事", "name": "员工花名册模板", "file": "人事-员工花名册模板.xlsx", "desc": "员工基础信息"}, {"cat": "人事", "name": "考勤统计模板", "file": "人事-考勤表模板.xlsx", "desc": "自动统计迟到缺勤"}, {"cat": "人事", "name": "招聘进度模板", "file": "人事-招聘进度模板.xlsx", "desc": "招聘漏斗跟踪"}, {"cat": "仓库", "name": "出入库流水模板", "file": "仓库-出入库流水模板.xlsx", "desc": "库存流水记录"}, {"cat": "仓库", "name": "库存盘点模板", "file": "仓库-库存盘点模板.xlsx", "desc": "自动算盘点差异"}, {"cat": "国际物流", "name": "海运跟踪模板", "file": "物流-海运跟踪模板.xlsx", "desc": "船期跟踪"}, {"cat": "国际物流", "name": "报关单模板", "file": "物流-报关单模板.xlsx", "desc": "自动算总价"}, {"cat": "图表", "name": "甘特图模板", "file": "图表-甘特图模板.xlsx", "desc": "项目排期，附图表制作步骤"}, {"cat": "图表", "name": "漏斗图模板", "file": "图表-漏斗图模板.xlsx", "desc": "销售转化分析，附制作步骤"}, {"cat": "图表", "name": "销售仪表盘模板", "file": "图表-销售仪表盘模板.xlsx", "desc": "KPI+组合图，附制作步骤"}, {"cat": "图表", "name": "KPI看板模板", "file": "图表-KPI看板模板.xlsx", "desc": "指标跟踪，附制作步骤"}, {"cat": "数据", "name": "销售数据1000行", "file": "数据-销售数据1000行.xlsx", "desc": "订单/区域/品类齐全，配 6 个练习任务"}, {"cat": "数据", "name": "人事考勤样本", "file": "数据-人事考勤样本.xlsx", "desc": "25 人 9 月考勤，迟到/请假公式+部门汇总"}, {"cat": "数据", "name": "函数练习题", "file": "数据-函数练习题.xlsx", "desc": "12 道 VLOOKUP/SUMIFS/XLOOKUP 实战，附参考答案"}, {"cat": "数据", "name": "透视表练习数据", "file": "数据-透视表练习数据.xlsx", "desc": "500 行明细，配 6 个透视表任务+避坑"}], "tutorials": [{"id": "interface", "group": "basics", "column": "C01", "level2": "C01-L2-1", "title": "认识 Excel 界面", "level": "入门", "body": "标题栏→功能区（选项卡+命令组）→编辑栏（显示/输入公式）→工作表区（行列交叉为单元格，如 B3）→工作表标签（底部切换/新增）→状态栏（快速看求和/平均）。记住：名称框可直接输入 B100 跳转，编辑栏是公式的家。", "steps": ["打开 Excel，观察功能区：文件/开始/插入/页面布局/公式/数据/审阅/视图", "点击名称框输入 D20，回车直接跳转", "在编辑栏输入 =1+2，回车看结果"], "sections": [], "source": "docs/basics（站内数据 basics）", "updated": "2026-11-09"}, {"id": "enter", "group": "basics", "column": "C01", "level2": "C01-L2-1", "title": "数据录入技巧", "level": "入门", "body": "Enter 下移、Tab 右移、Shift+Enter 上移。选中区域后按 Enter 在区域内循环。Ctrl+Enter 批量填充选中区域。Alt+↓ 调出下拉历史。Ctrl+; 输入今天日期，Ctrl+Shift+; 输入当前时间。", "steps": ["选中 A1:A10，输入内容后按 Ctrl+Enter 批量填充", "按 Ctrl+; 快速输入今天日期", "用 Alt+↓ 在已有列表中快速选择"], "sections": [], "source": "docs/basics（站内数据 basics）", "updated": "2026-11-09"}, {"id": "format", "group": "basics", "column": "C01", "level2": "C01-L2-1", "title": "单元格格式", "level": "入门", "body": "数字格式决定显示方式：常规/数值/货币/百分比/日期。Ctrl+1 打开设置单元格格式对话框。对齐、字体、边框、填充都在「开始」选项卡。格式刷（双击可多次使用）是排版神器。", "steps": ["选中金额列，按 Ctrl+Shift+4 设为货币格式", "选中日期列，Ctrl+1 设为日期格式", "双击格式刷，把标题格式刷到多个地方"], "sections": [], "source": "docs/basics（站内数据 basics）", "updated": "2026-11-09"}, {"id": "sortfilter", "group": "basics", "column": "C01", "level2": "C01-L2-1", "title": "排序与筛选", "level": "入门", "body": "筛选（Ctrl+Shift+L）：按条件只显示想要的行，箭头图标点开设条件。排序：按某列升序/降序，多关键字排序用「自定义排序」。注意：排序前先选中整个数据区域，否则会错乱！", "steps": ["选中表头，按 Ctrl+Shift+L 开启筛选", "点箭头，只勾选「销售部」", "按销售额列降序排列"], "sections": [], "source": "docs/basics（站内数据 basics）", "updated": "2026-11-09"}, {"id": "print", "group": "basics", "column": "C01", "level2": "C01-L2-1", "title": "打印设置", "level": "入门", "body": "页面布局→打印标题（顶端标题行每页重复）→设置打印区域→分页预览拖蓝线。页眉页脚加页码。打印前一定用「打印预览」检查。", "steps": ["页面布局→打印标题，设置顶端标题行", "选中区域→页面布局→打印区域→设置", "视图→分页预览，拖动蓝线调整"], "sections": [], "source": "docs/basics（站内数据 basics）", "updated": "2026-11-09"}, {"id": "pivottable", "group": "advanced", "column": "C08", "level2": "C08-L2-1", "title": "数据透视表", "level": "进阶", "body": "", "steps": [], "sections": [{"title": "1. 为什么用数据透视表", "body": "想象你有一张 5000 行的销售明细：日期、销售员、产品、金额。老板问：\"每个销售员每个月的销售额是多少？\"\n- 不用透视表：写一堆 SUMIFS，还要手动列出所有销售员和月份，容易漏。\n- 用透视表：**拖三下鼠标，3 秒出结果**。源数据增删行后点一下\"刷新\"即可更新。\n核心思想：**把\"分组+聚合\"这个动作交给 Excel**，你只负责告诉它\"按什么分组、对什么求和\"。"}, {"title": "2. 创建步骤", "body": "1. 点击源数据区域任意单元格（确保数据是规范的二维表：第一行是标题行，无合并单元格、无空行空列）。\n2. 「插入」→「数据透视表」。\n3. 选择放置位置：建议选\"新工作表\"，报表和源数据分开更清爽。\n4. 右侧出现「数据透视表字段」窗格，开始拖字段。\n> 数据规范是透视表好用的前提：一列只放一种含义的数据，日期列全是日期，不要出现\"合计\"行混在明细里。"}, {"title": "3. 四个区域详解", "body": "操作要点：\n- 同一字段可以拖到多个区域（如\"日期\"同时拖到行和筛选器）。\n- 拖错了直接把字段拖出窗格即可移除。\n- 字段顺序决定层级：行区域里\"年份\"在上、\"月份\"在下，就是先按年再按月展开。"}, {"title": "4. 值汇总方式", "body": "默认对数字字段\"求和\"，对文本字段\"计数\"。右键值字段 →「值字段设置」可切换：\n**显示方式**（同一对话框的「值显示方式」选项卡，更实用）：\n- **占总和的百分比**：每个销售员占总销售额的比例。\n- **父行汇总的百分比**：某产品占其所属类别的比例。\n- **差异**：本月 vs 上月的差额（需配合日期分组）。\n- **差异百分比**：环比增长率——做月报的神器。"}, {"title": "5. 分组", "body": "### 日期分组\n右键行区域的日期字段 →「组合」：\n- 按月：选\"月\"，自动按年月分组。\n- 按季度+年：同时勾选\"季度\"和\"年\"。\n- 按周：选\"日\"，天数填 7。\n### 数字分组\n右键数字字段 →「组合」：如把年龄按 10 岁一段分组（起始 20，终止 60，步长 10），快速做年龄段分布。"}, {"title": "6. 切片器与时间线", "body": "- **切片器**：「数据透视表分析」→「插入切片器」→ 勾选字段（如\"产品类别\"）。生成一排可点击的按钮，点选即筛选，比下拉框直观，适合做仪表盘。\n- **时间线**：专门用于日期字段，拖动滑块筛选时间段。\n- 一个切片器可以同时控制**多个**透视表：右键切片器 →「报表连接」，勾选其他透视表——做联动仪表盘的核心技巧。"}], "source": "docs/advanced/pivottable.md", "updated": "2026-11-09", "file": "数据-透视表练习数据.xlsx", "objectives": ["创建数据透视表并拖字段完成分组求和", "设置值字段的汇总方式（求和/计数/平均值）", "用切片器与日程表筛选透视表"], "formulas": [], "scenarios": [], "pitfalls": [], "exercises": ["把\"销售员\"拖到行、\"金额\"拖到值，默认汇总方式是什么？想改成计数怎么改？", "透视表不显示新追加的数据，原因与解决办法是什么？", "切片器是干什么用的？"], "answers": ["默认对数值求和。点值字段→值字段设置→改成\"计数\"。", "数据源范围没包含新行。点透视表→更改数据源扩大范围，或把源数据做成超级表后刷新。", "可视化筛选器：点切片器上的项，透视表即时筛选；多个透视表可共用一个切片器联动。"], "versions": ""}, {"id": "array-formulas", "group": "formulas", "column": "C03", "level2": "C03-L2-4", "title": "数组公式", "level": "进阶", "body": "", "steps": [], "sections": [{"title": "1. 先理解\"数组\"是什么", "body": "数组就是\"一串值\"。`{1,2,3}` 是横向数组，`{1;2;3}` 是纵向数组（分号换行）。Excel 公式本来就是按数组思维设计的：\n[代码示例]\n这行公式的含义是\"把 A1、A2、A3 每个都乘以 2\"，得到 `{A1*2, A2*2, A3*2}`。普通公式只显示第一个结果，数组公式则能把全部结果\"摊开\"显示。"}, {"title": "2. 传统数组公式（Ctrl+Shift+Enter）", "body": "在旧版本 Excel 里，想让公式返回多个结果：\n1. 先选中**多个**单元格（结果要占几格就选几格）。\n2. 输入公式，如 `=A1:A3*2`。\n3. 按 **Ctrl+Shift+Enter**（不是只按 Enter）。\n公式两端会自动加上花括号 `{=A1:A3*2}`，表示这是数组公式。**花括号是 Excel 自己加的，手工输入无效。**\n经典用途——多条件计数（COUNTIFS 出现之前的写法，现在仍有人用）：\n[代码示例]\n原理：`(A2:A100=\"销售部\")` 得到一串 TRUE/FALSE，`(B2:B100>5000)` 得到另一串，两串相乘（TRUE=1、FALSE=0），只有两个条件都成立的位置是 1，SUM 加总即为同时满足的人数。"}, {"title": "3. 动态数组：新时代的写法", "body": "Microsoft 365 引入动态数组后，**只按 Enter**，结果自动\"溢出\"到相邻单元格。不再需要三键，也不再需要预选区域。\n### FILTER：按条件筛选\n[代码示例]\n返回 B 列等于\"销售部\"的所有行（A:C 三列）。做\"部门人员清单\"一公式搞定，源数据增减行自动更新。\n加\"无结果\"提示：\n[代码示例]\n### SORT：排序\n[代码示例]"}, {"title": "4. #溢出! 错误处理", "body": "当动态数组的结果没地方\"摊开\"时，报 `#溢出!`。常见原因和解法：\n`#` 引用是动态数组时代的重要符号：公式结果变长变短，`A2#` 自动跟着变，SUM 永远求和的是最新结果。"}, {"title": "5. 实战案例", "body": "### 案例 1：多条件求和（替代 SUMIFS 的数组思路）\n统计\"销售部\"且\"金额>5000\"的总额：\n[代码示例]\n普通 Enter 即可（365 会自动按数组算）。\n### 案例 2：动态部门筛选器\n[代码示例]\nF1 做下拉选部门，右侧自动列出该部门所有人——简易查询系统。\n### 案例 3：自动去重+计数"}, {"title": "6. 新旧对照速查", "body": ""}], "source": "docs/formulas/04-array-formulas.md", "updated": "2026-11-09", "file": "数据-函数练习题.xlsx", "objectives": ["理解数组的概念与传统数组公式的三键输入", "用 FILTER、SORT、UNIQUE 实现动态数组筛选排序去重", "用 SEQUENCE、RANDARRAY 生成序号与随机数组，并处理 #SPILL! 错误"], "formulas": [], "scenarios": [], "pitfalls": [], "exercises": ["=SEQUENCE(5) 会返回什么？", "公式返回 #SPILL! 最常见的原因是什么？", "FILTER 与高级筛选有什么区别？"], "answers": ["返回 1、2、3、4、5 纵向溢出到 5 格；SEQUENCE(n) 生成 1 到 n 的序列。", "溢出区域被占用：目标区域已有内容挡住结果。清空溢出区域即可。", "FILTER 是公式，结果随源数据自动更新；高级筛选是手动操作，结果静态。FILTER 需 2021／365。"], "versions": ""}, {"id": "powerquery", "group": "advanced", "column": "C09", "level2": "C09-L2-1", "title": "Power Query", "level": "进阶", "body": "", "steps": [], "sections": [{"title": "1. Power Query 是什么", "body": "它是 Excel 里的一个**数据加工流水线**：你把\"获取→清洗→整理\"的每一步操作点一遍，Power Query 会把步骤记下来。下个月拿到新的源文件，点一下\"刷新\"，所有步骤自动重跑一遍。\n和公式的区别：\n- 公式是\"算出一个结果\"，Power Query 是\"产出一张干净的表\"。\n- 公式适合行内计算；Power Query 适合**结构性整理**：拆分列、转置、合并文件、逆透视——这些用公式写会很痛苦。\n核心观念：**你点的每一步都会变成一行 M 代码**，记录在右侧「应用的步骤」里。可以回头修改、删除、调整顺序。"}, {"title": "2. 获取数据", "body": "「数据」→「获取数据」，来源非常多：\n选中来源后点「转换数据」进入 Power Query 编辑器，开始清洗。"}, {"title": "3. 常用清洗步骤", "body": "### 拆分列\n一列里混着\"省-市-区\"？选中列 →「拆分列」→「按分隔符」→ 输入 `-`。一列变三列。也可以按固定宽度、按大小写转换处拆分。\n### 替换值\n选中列 → 右键 →「替换值」：把\"男/女\"换成\"M/F\"，把\"N/A\"换成空。支持整列批量。\n### 填充\n导出的报表经常只有第一行有\"部门\"名，下面是空的（合并单元格拆开后的样子）。选中列 →「转换」→「填充」→「向下」。空单元格自动填上上方的值，透视表分组的前提。\n### 更改类型\n每列顶上有个类型图标（ABC/123/日历）。点它把文本改成数字、日期。**类型不对会导致求和变计数、日期无法分组**，清洗时务必检查。"}, {"title": "4. 合并查询：比 VLOOKUP 更强的关联", "body": "场景：A 表是订单（有\"客户编号\"），B 表是客户档案（\"客户编号\"→\"客户名称\"），想给订单带上客户名称。\n1. 在编辑器里选中订单查询 →「合并查询」。\n2. 上表选\"客户编号\"，下表选\"客户档案\"的\"客户编号\"（点列表头选中，两边都要点）。\n3. 联接种类选\"左外部\"（保留订单全部行，档案对不上的留空——对应 VLOOKUP 的精确匹配）。\n4. 确定后多出一列，点列头的展开按钮，勾选\"客户名称\"。\n比 VLOOKUP 强的点：\n- **可按多列关联**：Ctrl+点选多个列头，一次按\"省+市\"两列匹配，VLOOKUP 要拼辅助列。\n- **模糊匹配**：联接时勾选\"模糊匹配\"，自动处理\"北京\"vs\"北京市\"这种差异，还能设相似度阈值。"}, {"title": "5. 追加查询：纵向堆叠", "body": "场景：12 个月的销售表结构相同，要拼成一张全年表。\n「追加查询」→ 选\"三个或更多表\" → 把 12 个表都加进来。列名相同的自动对齐，某表多出的列会以空值补齐。\n**从文件夹追加**（更常用）：「获取数据」→「从文件夹」→ 选存放 12 个文件的文件夹 →「合并和转换」。以后每月往文件夹里丢新文件，刷新一次全进来——月报自动化。"}, {"title": "6. 透视列与逆透视列", "body": "### 逆透视（Unpivot）：把交叉表\"拆长\"\n源数据是\"姓名×12个月\"的矩阵（1 月、2 月…各一列），透视表吃不了这种格式。\n选中 12 个月份列 → 右键 →「逆透视列」。变成三列：姓名、月份、销售额。**这是 Power Query 最经典的用途之一。**\n### 透视列（Pivot）：反向操作\n把\"月份、销售额\"两列转回交叉表：选中\"月份\"列 →「透视列」→ 值列选\"销售额\"、聚合选\"求和\"。"}], "source": "docs/advanced/powerquery.md", "updated": "2026-11-09", "file": "数据-销售数据1000行.xlsx", "objectives": ["从文件、文件夹、数据库、网页获取数据", "用拆分列、合并列、逆透视完成清洗", "区分合并查询与追加查询的适用场景"], "formulas": [], "scenarios": [], "pitfalls": [], "exercises": ["追加查询与合并查询有什么区别？", "交叉表（月份做列）转成明细表（月份做行）用什么操作？", "源文件更新后，Power Query 的结果怎么同步？"], "answers": ["追加是纵向堆叠（行数增加，结构要一致）；合并是横向关联（按关键列匹配，类似 VLOOKUP）。", "逆透视列：选中月份列→转换→逆透视列，月份变行值。", "数据→全部刷新。查询步骤存在工作簿里，刷新即按步骤重跑一遍。"], "versions": ""}, {"id": "conditional-formatting", "group": "advanced", "column": "C06", "level2": "C06-L2-1", "title": "条件格式", "level": "进阶", "body": "", "steps": [], "sections": [{"title": "1. 核心原理", "body": "条件格式 = **\"规则\" + \"格式\"**。规则判断每个单元格\"达不达标\"，达标就套用你设的格式（红底、加粗等）。\n关键理解：**格式是\"活\"的**。单元格的值变了，格式自动跟着变——和你手工涂色有本质区别。删掉规则（「开始」→「条件格式」→「清除规则」）就恢复原样，不破坏数据。\n操作入口：「开始」→「条件格式」。先**选中要应用的区域**再设规则，这点最重要。"}, {"title": "2. 内置规则：突出显示单元格规则", "body": "最常用的一类：「条件格式」→「突出显示单元格规则」：\n每个规则点开后选格式（浅红填充深红文本等），也可以点「自定义格式」自己配。"}, {"title": "3. 数据条：在单元格里画\"进度条\"", "body": "「条件格式」→「数据条」→ 选一种颜色。数值越大，条越长。\n- 适合：完成率、销售额对比——一眼看出谁高谁低，不用看数字。\n- 技巧：勾选「仅显示数据条」（管理规则→编辑规则），隐藏数字，只留条形，更像仪表盘。\n- 注意：数据条的长度是按**选中区域内的最大/最小值**自动缩放的，区域不同不能直接比长短。"}, {"title": "4. 色阶：热力图", "body": "「条件格式」→「色阶」→ 如\"绿-黄-红\"。数值映射到颜色渐变，**适合看分布**：\n- 12 个月的销售热力图，旺季月份自动变红。\n- 学生成绩表，一眼看出哪科普遍偏低。\n双色刻度和三色刻度：三色多一个中间色，适合\"中间值也想区分\"的场景。"}, {"title": "5. 图标集：红绿灯", "body": "「条件格式」→「图标集」→ 如\"三色旗/红绿灯\"。数值分三档，分别显示 ●●●。\n默认按百分比划分（67%/33%），想按绝对值：管理规则 → 编辑规则 → 类型改成\"数字\"，填阈值。如：完成率 ≥100% 绿灯、≥80% 黄灯、<80% 红灯。"}, {"title": "6. 重点：自定义公式规则", "body": "内置规则不够用时，用公式。入口：「条件格式」→「新建规则」→「使用公式确定要设置格式的单元格」。\n**核心心法**：公式是**相对选中区域左上角**写的。选中 A2:D100 后写公式，公式里的 A2 指\"当前正在判断的行的 A 列\"。Excel 会把公式逐行（逐格）套用一遍。\n### 示例 1：整行标红（金额>10000 的行整行变红）\n选中 A2:D100，公式：\n[代码示例]\n`$C` 锁定列（每行都看 C 列），`2` 不锁定行（随行变化）。这就是整行格式化的标准写法：**列锁定、行不锁定**。\n### 示例 2：标出重复值（内置规则只能标单元格，公式可标整行）\n[代码示例]"}], "source": "docs/advanced/conditional-formatting.md", "updated": "2026-11-09", "objectives": ["用内置规则（数据条、色阶、图标集）做可视化", "用公式规则实现整行高亮与跨表条件", "管理规则优先级并排查规则冲突"], "formulas": [], "scenarios": [], "pitfalls": [], "exercises": ["要把金额大于 5000 的整行标红，应该用什么规则、公式怎么写？", "数据条与色阶有什么区别？", "两个规则同时命中一个单元格，谁先生效？"], "answers": ["用公式规则，公式 `=$C2>5000`（C 列是金额，$ 锁列不锁行），应用范围选整表。", "数据条按值长短显示条形；色阶按值大小显示颜色渐变。数据条适合看相对大小，色阶适合看分布。", "规则列表中靠上的优先；勾选\"如果为真则停止\"后不再往下判断。"], "versions": ""}, {"id": "data-validation", "group": "data-management", "column": "C05", "level2": "C05-L2-4", "title": "数据验证", "level": "进阶", "body": "", "steps": [], "sections": [{"title": "1. 数据验证是什么", "body": "「数据」→「数据验证」。它在**输入的那一刻**拦截不合法的值，而不是事后检查。\n三个可配置项：\n1. **设置**：允许输入什么（整数/小数/日期/序列/文本长度…）。\n2. **输入信息**：选中单元格时弹出的提示（\"请输入 1-100 的整数\"）——主动引导。\n3. **出错警告**：输错时的弹窗，样式可选\"停止\"（硬拦截）/\"警告\"（可继续）/\"信息\"（仅提醒）。"}, {"title": "2. 下拉列表（最常用）", "body": "### 固定选项\n选中单元格 → 数据验证 → 允许「序列」→ 来源填 `男,女`（中文逗号不行，必须用**英文逗号**分隔）。单元格右侧出现下拉箭头。\n### 引用区域\n来源填 `=$F$2:$F$10`（部门清单）。清单变了下拉自动变。建议把清单放在单独的\"基础数据\"表，隐藏起来。\n### 动态二级联动：选\"省\"后\"市\"跟着变\n这是数据验证的经典难题，标准解法是 **INDIRECT + 命名区域**：\n1. 准备对照表：A 列是省名（广东、江苏…），B 列开始每列是一个省的城市，第一行是省名。\n2. 给每个省的城市区域**定义名称**：选中广东的城市 → 名称框输入 `广东` → 回车。注意名称不能含空格，省名有空格先替换。"}, {"title": "3. 输入限制", "body": "自定义公式的心法和条件格式一样：**相对左上角写**。选中 B2:B100 后公式写 `=LEN(B2)=11`，表示\"本单元格长度必须 11\"。"}, {"title": "4. 圈释无效数据", "body": "数据验证只拦**新输入**，历史脏数据怎么办？「数据」→「数据验证」→「圈释无效数据」。所有违反规则的旧数据会被红圈圈出来，改完后「清除无效数据标识」去掉圈。\n用途：接手别人的表，先圈一遍，脏数据一目了然。"}, {"title": "5. 工作表保护：锁公式、开放录入区", "body": "场景：模板发给 20 个人填，只允许填黄色区域，公式列不许碰。\n1. **先解锁录入区**：选中允许填写的单元格 → 右键「设置单元格格式」→「保护」→ **取消勾选\"锁定\"**。默认所有单元格都是\"锁定\"状态，但不保护时锁无效。\n2. 「审阅」→「保护工作表」→ 设密码 → 勾选允许的操作（一般保留\"选定未锁定的单元格\"）。\n3. 效果： locked 的公式格点不进去，未锁定的可填。有人想改公式？弹密码框。\n取消：审阅 → 撤销工作表保护 → 输密码。"}, {"title": "6. 允许编辑区域：多人分工", "body": "保护工作表是一刀切，\"允许编辑区域\"可以**按区域设不同密码**：\n「审阅」→「允许编辑区域」→「新建」：\n- 区域 A1:B10，密码 111 → 销售部用密码 111 可改\n- 区域 C1:D10，密码 222 → 财务部用密码 222 可改\n每人只能改自己的区，保护工作表后依然有效。适合部门分工录入同一张表。"}], "source": "docs/data-management/04-data-validation.md", "updated": "2026-11-09", "file": "数据-人事考勤样本.xlsx", "objectives": ["用序列验证做下拉列表（含二级联动）", "用整数、日期验证限制输入范围", "用圈释无效数据检查已录入的违规值"], "formulas": [], "scenarios": [], "pitfalls": [], "exercises": ["给一列设置\"只能输入 1 到 100 的整数\"，验证条件怎么设？", "为什么复制粘贴能绕过数据验证？事后怎么检查？", "下拉列表的来源写在哪里？想让下拉随清单增减自动扩展怎么办？"], "answers": ["数据→数据验证→允许选\"整数\"、数据选\"介于\"、最小值 1、最大值 100。", "粘贴会连格式带验证一起覆盖。用数据→数据验证→圈释无效数据，把违规格圈出来复核。", "来源写在某列区域或直接写 \"是,否\"；随清单扩展时把来源做成超级表列或动态名称。"], "versions": ""}, {"id": "pivot_adv-0", "group": "pivot_adv", "column": "C08", "level2": "C08-L2-2", "title": "基础操作", "level": "进阶", "body": "选中数据→插入→数据透视表。四个区：行、列、值、筛选。值字段默认求和，右键可改计数/平均/最大值。", "steps": [], "sections": [], "source": "站内数据 pivot_adv", "updated": "2026-11-09"}, {"id": "pivot_adv-1", "group": "pivot_adv", "column": "C08", "level2": "C08-L2-2", "title": "分组统计", "level": "进阶", "body": "日期右键→组合：按年/季度/月分组。数字右键→组合：按区间分组（如成绩段 60-70/70-80）。", "steps": [], "sections": [], "source": "站内数据 pivot_adv", "updated": "2026-11-09"}, {"id": "pivot_adv-2", "group": "pivot_adv", "column": "C08", "level2": "C08-L2-2", "title": "多维分析", "level": "进阶", "body": "行放「区域」、列放「季度」、值放「销售额」，一眼看交叉汇总。值显示方式→差异/百分比，做同比环比。", "steps": [], "sections": [], "source": "站内数据 pivot_adv", "updated": "2026-11-09"}, {"id": "pivot_adv-3", "group": "pivot_adv", "column": "C08", "level2": "C08-L2-2", "title": "切片器", "level": "进阶", "body": "插入切片器→选字段，点按钮即筛选，多表联动（报表连接）。比筛选直观 10 倍，汇报必备。", "steps": [], "sections": [], "source": "站内数据 pivot_adv", "updated": "2026-11-09"}, {"id": "pivot_adv-4", "group": "pivot_adv", "column": "C08", "level2": "C08-L2-2", "title": "时间轴", "level": "进阶", "body": "日期字段专用筛选器，按年/季度/月/日切换，比切片器更适合时间。", "steps": [], "sections": [], "source": "站内数据 pivot_adv", "updated": "2026-11-09"}, {"id": "pivot_adv-5", "group": "pivot_adv", "column": "C08", "level2": "C08-L2-2", "title": "数据模型", "level": "进阶", "body": "多表关联：把订单表+产品表都添加到数据模型，用字段关联，一张透视表跨表分析。Power Pivot 的地基。", "steps": [], "sections": [], "source": "站内数据 pivot_adv", "updated": "2026-11-09"}, {"id": "pq_adv-0", "group": "pq_adv", "column": "C09", "level2": "C09-L2-3", "title": "导入 CSV", "level": "进阶", "body": "数据→获取数据→从文本/CSV。乱码？改编码为 65001（UTF-8）或 936（GBK）。", "steps": [], "sections": [], "source": "站内数据 pq_adv", "updated": "2026-11-09"}, {"id": "pq_adv-1", "group": "pq_adv", "column": "C09", "level2": "C09-L2-3", "title": "导入网页", "level": "进阶", "body": "数据→自网站→粘贴 URL。网页表格结构变化时需重新检查步骤。", "steps": [], "sections": [], "source": "站内数据 pq_adv", "updated": "2026-11-09"}, {"id": "pq_adv-2", "group": "pq_adv", "column": "C09", "level2": "C09-L2-3", "title": "数据清洗", "level": "进阶", "body": "删空行、替换值、填充、修剪、分列、更改类型。每一步都记录在右侧「应用的步骤」，可回退。", "steps": [], "sections": [], "source": "站内数据 pq_adv", "updated": "2026-11-09"}, {"id": "pq_adv-3", "group": "pq_adv", "column": "C09", "level2": "C09-L2-3", "title": "合并表", "level": "进阶", "body": "追加查询=上下堆叠（多月数据合并）；合并查询=左右连接（VLOOKUP 的批量版）。", "steps": [], "sections": [], "source": "站内数据 pq_adv", "updated": "2026-11-09"}, {"id": "pq_adv-4", "group": "pq_adv", "column": "C09", "level2": "C09-L2-3", "title": "拆分列", "level": "进阶", "body": "按分隔符/字符数拆分。\"2026-10-01\" 按 \"-\" 拆成年/月/日三列。", "steps": [], "sections": [], "source": "站内数据 pq_adv", "updated": "2026-11-09"}, {"id": "pq_adv-5", "group": "pq_adv", "column": "C09", "level2": "C09-L2-3", "title": "自动刷新", "level": "进阶", "body": "关闭并上载后，源文件更新→右键刷新。还可设置打开文件自动刷新：数据→查询属性。", "steps": [], "sections": [], "source": "站内数据 pq_adv", "updated": "2026-11-09"}, {"id": "ppivot-0", "group": "ppivot", "column": "C10", "level2": "C10-L2-1", "title": "数据模型", "level": "专家", "body": "Power Pivot→添加到数据模型。多表不用 VLOOKUP，用关系关联，百万行不卡。", "steps": [], "sections": [], "source": "站内数据 ppivot", "updated": "2026-11-09"}, {"id": "ppivot-1", "group": "ppivot", "column": "C10", "level2": "C10-L2-1", "title": "多表关联", "level": "专家", "body": "关系视图拖线连主外键。一对多：产品表（1）→订单表（多）。", "steps": [], "sections": [], "source": "站内数据 ppivot", "updated": "2026-11-09"}, {"id": "ppivot-2", "group": "ppivot", "column": "C10", "level2": "C10-L2-1", "title": "DAX 公式入门", "level": "专家", "body": "DAX 长得像 Excel 函数但思维是列式。SUM(表[列])、CALCULATE(表达式, 筛选)、RELATED(取关联表字段)。", "steps": [], "sections": [], "source": "站内数据 ppivot", "updated": "2026-11-09"}, {"id": "ppivot-3", "group": "ppivot", "column": "C10", "level2": "C10-L2-1", "title": "常用 DAX", "level": "专家", "body": "总销售额 =SUM(订单[金额])\n当年累计 =CALCULATE([总销售额], DATESYTD(日期表[日期]))\n同比 =DIVIDE([总销售额]-[去年同期], [去年同期])", "steps": [], "sections": [], "source": "站内数据 ppivot", "updated": "2026-11-09"}, {"id": "ppivot-4", "group": "ppivot", "column": "C10", "level2": "C10-L2-1", "title": "KPI 指标", "level": "专家", "body": "在数据模型中建度量值：销售额、利润率、完成率。度量值随切片器自动重算，一处定义处处用。", "steps": [], "sections": [], "source": "站内数据 ppivot", "updated": "2026-11-09"}, {"id": "cfmt-0", "group": "cfmt", "column": "C06", "level2": "C06-L2-1", "title": "颜色标记", "level": "进阶", "body": "开始→条件格式→突出显示单元格规则：大于/小于/介于/等于，自动上色。", "steps": [], "sections": [], "source": "站内数据 cfmt", "updated": "2026-11-09"}, {"id": "cfmt-1", "group": "cfmt", "column": "C06", "level2": "C06-L2-1", "title": "数据条", "level": "进阶", "body": "在单元格内画横向条形图，数值大小一目了然。适合业绩对比。", "steps": [], "sections": [], "source": "站内数据 cfmt", "updated": "2026-11-09"}, {"id": "cfmt-2", "group": "cfmt", "column": "C06", "level2": "C06-L2-1", "title": "图标集", "level": "进阶", "body": "红绿灯/箭头/旗帜，按阈值自动打标。管理驾驶舱常用。", "steps": [], "sections": [], "source": "站内数据 cfmt", "updated": "2026-11-09"}, {"id": "cfmt-3", "group": "cfmt", "column": "C06", "level2": "C06-L2-1", "title": "自定义公式", "level": "进阶", "body": "新建规则→使用公式。注意 $ 锁定：=$B2>100 整行变色（选中整行时列锁定行不锁定）。", "steps": [], "sections": [], "source": "站内数据 cfmt", "updated": "2026-11-09"}, {"id": "cfmt-4", "group": "cfmt", "column": "C06", "level2": "C06-L2-1", "title": "案例：自动标红逾期", "level": "进阶", "body": "=AND($E2<TODAY(),$G2<>\"已完成\") → 逾期未完成的整行变红。", "steps": [], "sections": [], "source": "站内数据 cfmt", "updated": "2026-11-09"}, {"id": "cfmt-5", "group": "cfmt", "column": "C06", "level2": "C06-L2-1", "title": "案例：高亮重复", "level": "进阶", "body": "选中区域→条件格式→突出显示→重复值。或公式 =COUNTIF($A:$A,$A2)>1 自定义颜色。", "steps": [], "sections": [], "source": "站内数据 cfmt", "updated": "2026-11-09"}, {"id": "dval-0", "group": "dval", "column": "C05", "level2": "C05-L2-4", "title": "下拉菜单", "level": "入门", "body": "数据→数据验证→序列，来源输入：男,女（英文逗号）。或引用一列区域。", "steps": [], "sections": [], "source": "站内数据 dval", "updated": "2026-11-09"}, {"id": "dval-1", "group": "dval", "column": "C05", "level2": "C05-L2-4", "title": "联动下拉框", "level": "入门", "body": "一级菜单选「省份」→二级自动出该省城市。做法：定义名称+INDIRECT($A2)。先做各省名单，再建一级下拉，二级来源 =INDIRECT(A2)。", "steps": [], "sections": [], "source": "站内数据 dval", "updated": "2026-11-09"}, {"id": "dval-2", "group": "dval", "column": "C05", "level2": "C05-L2-4", "title": "日期限制", "level": "入门", "body": "数据验证→日期→介于 2026-1-1 到 2026-12-31，只能输今年日期。", "steps": [], "sections": [], "source": "站内数据 dval", "updated": "2026-11-09"}, {"id": "dval-3", "group": "dval", "column": "C05", "level2": "C05-L2-4", "title": "输入规则", "level": "入门", "body": "整数/小数/文本长度：手机号设文本长度=11；年龄设整数介于 18-65。出错警告可自定义提示语。", "steps": [], "sections": [], "source": "站内数据 dval", "updated": "2026-11-09"}, {"id": "dval-4", "group": "dval", "column": "C05", "level2": "C05-L2-4", "title": "圈释无效数据", "level": "入门", "body": "数据→数据验证→圈释无效数据，已有违规的一眼现形。", "steps": [], "sections": [], "source": "站内数据 dval", "updated": "2026-11-09"}, {"id": "choose", "group": "charts", "column": "C07", "level2": "C07-L2-1", "title": "图表类型选择指南", "level": "进阶", "body": "比较大小用柱状图/条形图，看趋势用折线图，看占比用饼图/环形图（类别≤6），看关系用散点图/气泡图，看分布用直方图/箱线图。双坐标用组合图。记住：一图只讲一件事。", "steps": [], "sections": [], "source": "站内数据 charts", "updated": "2026-11-09"}, {"id": "make", "group": "charts", "column": "C07", "level2": "C07-L2-1", "title": "图表制作步骤", "level": "进阶", "body": "选中数据→插入→选图表类型→切换行列（数据反了就点它）→添加数据标签→调坐标轴。数据源：右键→选择数据，可增删系列。", "steps": [], "sections": [], "source": "站内数据 charts", "updated": "2026-11-09"}, {"id": "beauty", "group": "charts", "column": "C07", "level2": "C07-L2-1", "title": "图表美化技巧", "level": "高级", "body": "删网格线、删图例（直接标数据）、统一配色（莫兰迪/商务蓝）、加粗标题讲结论、坐标轴从 0 开始（柱状图）。少即是多：每删一个元素，图表清晰一度。", "steps": [], "sections": [], "source": "站内数据 charts", "updated": "2026-11-09"}, {"id": "dynamic", "group": "charts", "column": "C07", "level2": "C07-L2-1", "title": "动态图表", "level": "高级", "body": "下拉菜单联动图表：数据验证做下拉→INDEX+MATCH 取数→图表数据源引用。用复选框控制系列显示。用 OFFSET 做动态区域，新增数据自动进图。", "steps": [], "sections": [], "source": "站内数据 charts", "updated": "2026-11-09"}, {"id": "scenario-0", "group": "scenarios", "column": "C13", "level2": "C13-L2-3", "title": "财务报销统计", "level": "进阶", "body": "每月上百条报销记录，自动汇总到部门/类别", "steps": [], "sections": [], "source": "站内数据 scenarios", "updated": "2026-11-09"}, {"id": "scenario-1", "group": "scenarios", "column": "C13", "level2": "C13-L2-3", "title": "销售业绩分析", "level": "高级", "body": "销售明细表 → 自动排名、环比、Top10", "steps": [], "sections": [], "source": "站内数据 scenarios", "updated": "2026-11-09"}, {"id": "scenario-2", "group": "scenarios", "column": "C13", "level2": "C13-L2-3", "title": "人事考勤统计", "level": "进阶", "body": "打卡记录 → 迟到/早退/缺勤自动统计", "steps": [], "sections": [], "source": "站内数据 scenarios", "updated": "2026-11-09"}, {"id": "scenario-3", "group": "scenarios", "column": "C13", "level2": "C13-L2-3", "title": "库存预警管理", "level": "高级", "body": "出入库流水 → 实时库存 + 低库存预警", "steps": [], "sections": [], "source": "站内数据 scenarios", "updated": "2026-11-09"}, {"id": "scenario-4", "group": "scenarios", "column": "C13", "level2": "C13-L2-3", "title": "经营仪表盘", "level": "专家", "body": "一页看懂公司经营：KPI 卡片 + 趋势图 + 明细", "steps": [], "sections": [], "source": "站内数据 scenarios", "updated": "2026-11-09"}, {"id": "basics-01-getting-started", "group": "basics", "column": "C01", "level2": "C01-L2-1", "title": "认识 Excel：界面、工作簿与工作表", "level": "入门", "body": "**工作簿与工作表**：一个 Excel 文件就是一个工作簿（Workbook），扩展名通常是 `.xlsx`；工作簿里可以放多张工作表（Worksheet），底部的工作表标签就是各张表的入口。日常说的\"打开一张表\"，多数时候是指打开一个工作簿里的一张工作表。\n\n**功能区（Ribbon）**：窗口顶部的带状工具栏，由\"选项卡＋命令组\"构成。\"开始\"选项卡放最常用的字体、对齐、数字格式；\"插入\"放图表、数据透视表；\"公式\"放函数库；\"数据\"放排序、筛选、分列、获取数据。找不到某个命令时，先想它属于哪类操作，再去对应选项卡找，比满屏乱点快得多。\n\n**单元格与名称框**：行列交叉处就是单元格，用列字母＋行号定位，如 `B3` 表示 B 列第 3 行。左上角的名称框显示当前选中单元格的地址，直接输入 `D20` 回车即可跳转到 D20；输入 `B2:B10` 回车可一次选中一个区域。\n\n**文件格式**：`.xlsx` 是不含宏的常规工作簿；`.xlsm` 是启用宏的工作簿，含 VBA 代码时必须存为此格式，否则宏会被丢弃；`.xls` 是 2003 及更早版本的旧格式，功能受限，新文件不要用它；`.csv` 只有纯文本数据，无格式、无公式、无多表，导出给其他系统时常用。\n\n**视图与窗口**：普通视图是日常编辑视图；页面布局视图按打印效果显示，能看到页边距与页眉页脚；分页预览用蓝色虚线标出打印分页，调打印区域时用它最直观。冻结窗格（视图→冻结窗格）可以把标题行固定在屏幕上方，滚动大表时标题不跑丢。", "steps": ["打开 Excel：开始屏幕选\"空白工作簿\"，或按 `Ctrl + N` 新建一个空白工作簿。", "认识界面：顶部是功能区，左上角是名称框，底部是工作表标签，右侧与底部是滚动条；选中任一单元格，看名称框显示它的地址。", "保存文件：按 `Ctrl + S`，第一次保存会弹出对话框，选位置、起名字、确认格式为\"Excel 工作簿（*.xlsx）\"后保存；此后每改动一次就按一次 `Ctrl + S`。", "管理工作表：右键底部工作表标签可重命名、移动、复制、隐藏、删除；点标签右侧的 `+` 号新建一张工作表；双击标签可直接改名。", "切换视图：视图选项卡里点\"页面布局\"看打印效果，点\"分页预览\"看分页线，点\"普通\"回到编辑视图；用\"视图→冻结窗格→冻结首行\"把标题行固定。", "关闭前检查：确认标题栏没有星号（未保存标记）或已按 `Ctrl + S`；含公式的工作簿关闭时如弹出\"是否保存\"，点\"保存\"。"], "sections": [{"title": "2. 基础概念", "body": "**工作簿与工作表**：一个 Excel 文件就是一个工作簿（Workbook），扩展名通常是 `.xlsx`；工作簿里可以放多张工作表（Worksheet），底部的工作表标签就是各张表的入口。日常说的\"打开一张表\"，多数时候是指打开一个工作簿里的一张工作表。\n\n**功能区（Ribbon）**：窗口顶部的带状工具栏，由\"选项卡＋命令组\"构成。\"开始\"选项卡放最常用的字体、对齐、数字格式；\"插入\"放图表、数据透视表；\"公式\"放函数库；\"数据\"放排序、筛选、分列、获取数据。找不到某个命令时，先想它属于哪类操作，再去对应选项卡找，比满屏乱点快得多。\n\n**单元格与名称框**：行列交叉处就是单元格，用列字母＋行号定位，如 `B3` 表示 B 列第 3 行。左上角的名称框显示当前选中单元格的地址，直接输入 `D20` 回车即可跳转到 D20；输入 `B2:B10` 回车可一次选中一个区域。\n\n**文件格式**：`.xlsx` 是不含宏的常规工作簿；`.xlsm` 是启用宏的工作簿，含 VBA 代码时必须存为此格式，否则宏会被丢弃；`.xls` 是 2003 及更早版本的旧格式，功能受限，新文件不要用它；`.csv` 只有纯文本数据，无格式、无公式、无多表，导出给其他系统时常用。\n\n**视图与窗口**：普通视图是日常编辑视图；页面布局视图按打印效果显示，能看到页边距与页眉页脚；分页预览用蓝色虚线标出打印分页，调打印区域时用它最直观。冻结窗格（视图→冻结窗格）可以把标题行固定在屏幕上方，滚动大表时标题不跑丢。"}, {"title": "4. 图文示例", "body": "新建一个\"一周开支记录\"工作簿练手：A1 输入\"日期\"，B1 输入\"项目\"，C1 输入\"金额\"；A2:A4 依次输入 11 月 2 日、11 月 3 日、11 月 4 日，B2:B4 输入\"午餐\"、\"交通\"、\"文具\"，C2:C4 输入 28、15、36。选中 C2:C4，在开始选项卡把数字格式设为\"货币\"；把工作表标签重命名为\"开支\"，再点 `+` 新建一张表改名\"汇总\"；最后 `Ctrl + S` 存为\"开支记录.xlsx\"。\n\n（截图位：待补图）"}], "source": "docs/basics/01-getting-started.md", "updated": "2026-11-09", "objectives": ["说出功能区六大选项卡（开始、插入、页面布局、公式、数据、审阅）各自的用途", "新建、保存与重命名工作簿，并区分 .xlsx 与 .xlsm 两种文件格式", "在同一个工作簿内新建、重命名、移动、隐藏与删除工作表", "切换普通视图、页面布局视图与分页预览，冻结窗格查看大表"], "formulas": ["=SUM(C2:C4) → 79", "=AVERAGE(C2:C4) → 26.33", "=MAX(C2:C4) → 36", "- `=SUM(C2:C4)` → 79：C2:C4 求和：28+15+36=79，本周三天开支合计", "- `=AVERAGE(C2:C4)` → 26.33：三天日均开支 79÷3≈26.33（保留两位小数）", "- `=MAX(C2:C4)` → 36：单笔最大开支是文具 36 元"], "scenarios": [{"title": "新人第一天：接手同事的报表", "body": "同事发来一个工作簿，底部有 5 张表。先别急着改：点每张表看标题行（冻结窗格帮你定位），用 `Ctrl + End` 跳到每张表的已用区域右下角，确认数据范围；再用名称框跳到关键单元格核对。看懂结构再动手，比直接改少踩一半坑。"}, {"title": "月度报表：每月新建一张表", "body": "每月一张表的做法是：右键上月工作表→\"移动或复制\"→勾选\"建立副本\"，再把副本改名为本月（如\"11 月\"），清空旧数据保留格式与公式。这样表结构与汇总公式每月一致，汇总表用跨表引用（如 `='11月'!C10`）一次取数。"}], "pitfalls": [{"problem": "保存后公式没了", "cause": "存成了 .csv 或旧 .xls 格式", "solution": "另存为时选\"Excel 工作簿（*.xlsx）\"；需要宏才用 .xlsm"}, {"problem": "找不到某个命令", "cause": "在错误的选项卡里找", "solution": "先定性：格式类去\"开始\"，函数类去\"公式\"，数据类去\"数据\"；再用左上角搜索框搜命令名"}, {"problem": "滚动后标题行看不见", "cause": "没有冻结窗格", "solution": "选中标题行下一行，视图→冻结窗格→冻结拆分窗格"}, {"problem": "工作表标签找不到了", "cause": "工作表被隐藏", "solution": "右键任一标签→取消隐藏，勾选要恢复的表"}], "exercises": ["新建一个工作簿，把 Sheet1 改名为\"练习\"，再新建一张表改名为\"备份\"，保存为 .xlsx 格式。名称框输入 D20 会跳到哪里？", "A1:A5 依次是 10、20、30、40、50，用公式求和与求平均，结果分别是多少？", "同事发来的文件是 .csv，打开后发现数字格式与多张表都没了，为什么？"], "answers": ["跳到 D 列第 20 行的 D20 单元格。名称框输入地址回车即跳转，与鼠标点选等价。", "求和 `=SUM(A1:A5)` → 150；平均 `=AVERAGE(A1:A5)` → 30。验算：10+20+30+40+50=150，150÷5=30。", ".csv 只存纯文本数据，不存格式、公式与多张工作表。应请对方发 .xlsx 原文件；.csv 只适合在系统之间导数据。"], "versions": "Excel 2016／2019／2021／365"}, {"id": "basics-02-data-entry", "group": "basics", "column": "C01", "level2": "C01-L2-2", "title": "数据录入与编辑：输入技巧、填充柄与复制粘贴", "level": "入门", "body": "**自动识别**：Excel 按输入内容猜类型——纯数字进数值、带 `-` 或 `/` 的进日期、其余进文本。身份证号、银行卡号这类长数字串会被当成数值并用科学计数法显示，必须先把单元格设为文本格式，或先输入英文单引号 `'` 再输数字。\n\n**填充柄**：选中单元格右下角的小方块就是填充柄，拖动它可向下/向右复制或按规律填充。拖动后右下角会出现\"自动填充选项\"小图标，可切换\"复制单元格\"、\"填充序列\"、\"仅填充格式\"等模式。\n\n**复制粘贴专项**：`Ctrl + C` 复制的是内容＋格式＋公式。只想粘其中一部分时用\"选择性粘贴\"（右键→选择性粘贴，或开始→粘贴下拉）：\"数值\"只粘结果不粘公式，\"格式\"只粘样式，\"转置\"把行列互换。\n\n**查找替换**：`Ctrl + H` 打开查找替换，可批量改错别字、统一部门名。点\"选项\"可限定\"单元格匹配\"（整格相等才换，避免\"销售部\"被\"销售\"替换误伤）与\"区分大小写\"。`Ctrl + F` 只查找不替换。\n\n**定位条件**：`F5`→\"定位条件\"可一次选中某类单元格：全部空值（批量填\"待补\"）、全部公式（检查公式区）、全部常量。配合 `Ctrl + Enter` 可对所有选中格一次填入相同内容。", "steps": ["输入长数字：先选中区域，开始→数字格式下拉选\"文本\"，再输入身份证号等长数字；或先输 `'` 再输数字。", "快速填序号：在 A2 输入 1，A3 输入 2，选中 A2:A3 拖填充柄向下，即得连续序号；或在 A2 输入 1 后用开始→填充→序列，设步长值 1。", "填日期序列：在 A2 输入 2026-11-02，拖填充柄向下即逐日递增；按住右键拖填充柄松开，可选\"按工作日填充\"（跳过周末）。", "只粘数值：复制带公式的区域，右键目标格→选择性粘贴→数值；或粘贴后点右下角粘贴选项选\"值\"。", "批量修正：按 `Ctrl + H`，查找\"销售一部\"、替换为\"销售部\"，点\"全部替换\"；核对替换条数是否与预期一致。", "批量填空值：选中区域按 `F5`→定位条件→空值→确定，输入内容后按 `Ctrl + Enter`，所有空值一次填好。"], "sections": [{"title": "2. 基础概念", "body": "**自动识别**：Excel 按输入内容猜类型——纯数字进数值、带 `-` 或 `/` 的进日期、其余进文本。身份证号、银行卡号这类长数字串会被当成数值并用科学计数法显示，必须先把单元格设为文本格式，或先输入英文单引号 `'` 再输数字。\n\n**填充柄**：选中单元格右下角的小方块就是填充柄，拖动它可向下/向右复制或按规律填充。拖动后右下角会出现\"自动填充选项\"小图标，可切换\"复制单元格\"、\"填充序列\"、\"仅填充格式\"等模式。\n\n**复制粘贴专项**：`Ctrl + C` 复制的是内容＋格式＋公式。只想粘其中一部分时用\"选择性粘贴\"（右键→选择性粘贴，或开始→粘贴下拉）：\"数值\"只粘结果不粘公式，\"格式\"只粘样式，\"转置\"把行列互换。\n\n**查找替换**：`Ctrl + H` 打开查找替换，可批量改错别字、统一部门名。点\"选项\"可限定\"单元格匹配\"（整格相等才换，避免\"销售部\"被\"销售\"替换误伤）与\"区分大小写\"。`Ctrl + F` 只查找不替换。\n\n**定位条件**：`F5`→\"定位条件\"可一次选中某类单元格：全部空值（批量填\"待补\"）、全部公式（检查公式区）、全部常量。配合 `Ctrl + Enter` 可对所有选中格一次填入相同内容。"}, {"title": "4. 图文示例", "body": "做一张 5 人考勤录入表：A 列姓名（张三、李四、王五、赵六、钱七），B 列日期（2026-11-02 起用填充柄逐日填 5 天），C 列\"出勤\"用数据验证下拉（见数据验证篇）选\"出勤/请假\"。D 列输入工号时先把 D 列设为文本格式再输，避免 18 位工号变科学计数法。最后用 `Ctrl + H` 把误输的\"张三 \"（带尾空格）统一替换。\n\n（截图位：待补图）"}], "source": "docs/basics/02-data-entry.md", "updated": "2026-11-09", "objectives": ["区分文本、数值、日期三种输入，知道 Excel 如何自动识别它们", "用填充柄快速生成序号、日期序列与等差数列", "用选择性粘贴实现只粘数值、只粘格式与转置", "用查找替换批量修正数据，并用定位条件一次选中全部空值或公式"], "formulas": ["=COUNTA(A2:A6) → 5", "=COUNTBLANK(C2:C6) → 0", "=LEN(\"张三 \") → 3", "- `=COUNTA(A2:A6)` → 5：A2:A6 非空单元格数：5 个人名，验算录入是否漏人", "- `=COUNTBLANK(C2:C6)` → 0：C2:C6 空值个数：0 表示出勤列全部填完，可交表", "- `=LEN(\"张三 \")` → 3：带尾空格的\"张三 \"长度是 3 不是 2，空格也会被算进去——这就是查找替换前要先清空格的原因"], "scenarios": [{"title": "人事每月收考勤表", "body": "各部门交来的表里姓名带空格、日期格式不一。先用分列或 TRIM 清空格，再用查找替换统一部门名，最后用定位条件找出空值批量填\"待补\"。一套流程 10 分钟，替代逐格肉眼检查。"}, {"title": "销售每天录入订单", "body": "订单号是 12 位数字：录入前把订单号列设为文本格式，否则后三位会变 0。日期列用填充柄逐日递增，金额列只粘数值（防止带入上游表的公式）。"}], "pitfalls": [{"problem": "身份证号变 1.1E+17", "cause": "单元格是常规格式，Excel 按数值存长数字", "solution": "先设文本格式再输入，或先输英文单引号 '"}, {"problem": "日期变成 45934 这样的数字", "cause": "单元格被设成了常规格式，日期的序列值露出来了", "solution": "选中区域，开始→数字格式选\"短日期\""}, {"problem": "填充柄拖出 1、1、1 而不是 1、2、3", "cause": "只输了一个 1 就拖，Excel 默认复制", "solution": "先输 1、2 两个数再一起拖，或拖完点填充选项改\"填充序列\""}, {"problem": "查找替换改错了别处", "cause": "没勾\"单元格匹配\"，子串也被换了", "solution": "点选项勾选\"单元格匹配\"；替换前先\"查找全部\"看命中范围"}], "exercises": ["A2 输入 1、A3 输入 2，选中两格向下拖填充柄到 A10，A10 的值是多少？只输一个 1 再拖会怎样？", "B2:B6 是 5 个金额 100、200、150、300、250，D2 写公式求和，结果是多少？如果其中一格是文本\"200\"（带前导单引号），求和结果会变吗？", "用定位条件选中一片区域的全部空值后，怎样一次填入相同内容？"], "answers": ["A10 是 9（1、2、3…逐个递增）。只输一个 1 就拖会全部复制成 1，因为 Excel 不知道步长。", "求和 `=SUM(B2:B6)` → 1000。文本型\"200\"会被 SUM 忽略，结果变成 800——文本数字不参与求和，这是最常见的求和少算原因。", "输入内容后按 `Ctrl + Enter`（不是只按 Enter），所有选中格一次填入。"], "versions": "Excel 2016／2019／2021／365"}, {"id": "basics-03-cells-ranges", "group": "basics", "column": "C01", "level2": "C01-L2-3", "title": "单元格与区域操作：选定、行列、合并与名称框", "level": "入门", "body": "**区域（Range）**：一组连续单元格，用左上角:右下角表示，如 `B2:D10`。多数操作（求和、排序、复制）都是以区域为单位进行的；先选对区域，再执行操作，是 Excel 操作的第一性原理。\n\n**选定技巧**：点列标选整列、点行号选整行；`Ctrl + A` 在数据区按一次选当前连续区域，按两次选全表；`Ctrl + Shift + 方向键` 扩展到数据边缘，是选中整列数据的神器；`Ctrl + 点击` 加选不连续区域；`Ctrl + Shift + *`（数字 8 上档键）选中当前数据区域。\n\n**行列操作**：右键行号/列标可插入、删除、隐藏行列。插入行会把公式引用自动下移（引用跟着数据走），删除行则可能让引用该行的公式变成 `#REF!`——删行前先检查有没有公式引用它。\n\n**合并单元格**：开始→合并后居中。合并后只有左上角单元格保留内容，其余格的内容会被丢弃；合并过的区域不能直接排序、不能用填充柄、透视表也不认它。标题行合并一次尚可，数据区不要合并。\n\n**名称框跳转**：名称框输入地址回车即跳转；输入区域如 `B2:D100` 回车即选中该区域；输入已定义名称（如\"销售数据\"）可跳到命名区域。配合 `Ctrl + End`（已用区域右下角）与 `Ctrl + Home`（回 A1），大表导航不用滚轮。", "steps": ["选中整列数据：点任意数据格，按 `Ctrl + Shift + ↓` 选中从该格到数据底端；再按 `Ctrl + Shift + →` 可扩展到多列。", "插入一行：在行号上右键→插入；插入一列：在列标上右键→插入列；一次插多行：先选中多行行号再右键插入。", "调整列宽：双击列标右边界自动按内容适配宽度；拖动边界手动调；选中多列后拖动其中一列边界可等宽批量调。", "合并标题：选中标题行区域（如 A1:F1），开始→合并后居中；取消合并用同一按钮再次点击，或右键→取消合并单元格。", "隐藏与取消隐藏：选中行/列右键→隐藏；取消隐藏时先选中跨越隐藏区的行/列再右键→取消隐藏。", "跳转检查：按 `Ctrl + End` 看数据实际用到哪一行哪一列，发现远超预期的\"幽灵区域\"（如到了 XFD1048576）说明有残留格式，用定位条件选常量清理或删除多余行列。"], "sections": [{"title": "2. 基础概念", "body": "**区域（Range）**：一组连续单元格，用左上角:右下角表示，如 `B2:D10`。多数操作（求和、排序、复制）都是以区域为单位进行的；先选对区域，再执行操作，是 Excel 操作的第一性原理。\n\n**选定技巧**：点列标选整列、点行号选整行；`Ctrl + A` 在数据区按一次选当前连续区域，按两次选全表；`Ctrl + Shift + 方向键` 扩展到数据边缘，是选中整列数据的神器；`Ctrl + 点击` 加选不连续区域；`Ctrl + Shift + *`（数字 8 上档键）选中当前数据区域。\n\n**行列操作**：右键行号/列标可插入、删除、隐藏行列。插入行会把公式引用自动下移（引用跟着数据走），删除行则可能让引用该行的公式变成 `#REF!`——删行前先检查有没有公式引用它。\n\n**合并单元格**：开始→合并后居中。合并后只有左上角单元格保留内容，其余格的内容会被丢弃；合并过的区域不能直接排序、不能用填充柄、透视表也不认它。标题行合并一次尚可，数据区不要合并。\n\n**名称框跳转**：名称框输入地址回车即跳转；输入区域如 `B2:D100` 回车即选中该区域；输入已定义名称（如\"销售数据\"）可跳到命名区域。配合 `Ctrl + End`（已用区域右下角）与 `Ctrl + Home`（回 A1），大表导航不用滚轮。"}, {"title": "4. 图文示例", "body": "一张 1000 行销售明细表：点 A2，按 `Ctrl + Shift + ↓` 再 `Ctrl + Shift + →`，一次选中 A2:F1001 整个数据区；右键列标把 F 列（金额）列宽双击自适应；标题行 A1:F1 合并居中并加粗；把第 1 行冻结，滚动到底部核对最后一行；用名称框输入 `F1001` 跳到最后一格核对金额。\n\n（截图位：待补图）"}], "source": "docs/basics/03-cells-ranges.md", "updated": "2026-11-09", "objectives": ["用鼠标与键盘快速选定连续区域、不连续区域、整行整列与全表", "插入、删除、隐藏、调整行高列宽，并理解删除行对公式引用的影响", "正确使用合并单元格，知道它会带来哪些排序与引用问题", "用名称框与定位功能在几千行的大表里瞬间跳转"], "formulas": ["=SUM(B2:B6) → 550", "=ROWS(B2:B6) → 5", "=COLUMNS(B2:D2) → 3", "- `=SUM(B2:B6)` → 550：B2:B6 是 100、120、90、110、130，求和 100+120+90+110+130=550", "- `=ROWS(B2:B6)` → 5：ROWS 返回区域行数：B2 到 B6 共 5 行，核对选区行数时用", "- `=COLUMNS(B2:D2)` → 3：COLUMNS 返回区域列数：B 到 D 共 3 列"], "scenarios": [{"title": "接手一张 2 万行大表", "body": "先 `Ctrl + End` 看已用区域：若到了第 20000 行之后很远，说明底部有残留格式或空行，先删掉多余行再操作，否则排序筛选会把空行也算进去。冻结首行后用名称框跳转，少用滚轮翻页。"}, {"title": "做一张要打印的报表", "body": "标题行合并居中、列宽按内容自适应、行高统一 18；数据区绝不合并单元格（否则排序与筛选全废）。打印前用分页预览确认每页断在哪里。"}], "pitfalls": [{"problem": "排序后数据错位", "cause": "排序前只选中了一列，行与行对应关系被打乱", "solution": "排序前选中整个数据区，或点数据区内任一格直接点排序按钮（Excel 会自动扩展选区）"}, {"problem": "删除行后公式变 #REF!", "cause": "被删的行正被其他公式引用", "solution": "删行前用公式→追踪从属单元格检查引用；改用整列引用可减少此类问题"}, {"problem": "合并单元格后无法排序", "cause": "合并区域破坏了矩形数据区", "solution": "数据区用\"跨列居中\"（设置单元格格式→对齐→水平对齐→跨列居中）代替合并"}, {"problem": "Ctrl + End 跳到很远的空白格", "cause": "曾经输入过内容又删了，格式残留导致已用区域虚大", "solution": "选中多余行/列右键删除（不是按 Delete 清内容），保存后重开即恢复"}], "exercises": ["B2:B6 是 100、120、90、110、130，写公式求和与求行数，结果各是多少？", "为什么数据区不建议用合并单元格？说出至少两个后果。", "一张表按 Ctrl + End 跳到了 Z5000，但实际数据只有 100 行，最可能的原因与修复方法是什么？"], "answers": ["求和 `=SUM(B2:B6)` → 550；行数 `=ROWS(B2:B6)` → 5。", "排序失效、填充柄失效、透视表不认合并区域、公式引用只认左上角格。标题行可用\"跨列居中\"代替。", "残留格式导致已用区域虚大。选中第 101 行到 5000 行右键删除整行（不是 Delete 清内容），保存后重开，Ctrl + End 即回到正常位置。"], "versions": "Excel 2016／2019／2021／365"}, {"id": "basics-05-versions", "group": "basics", "column": "C01", "level2": "C01-L2-5", "title": "版本与兼容：从 Excel 2003 到 Microsoft 365", "level": "入门", "body": "**版本沿革**：Excel 2003 是最后一个 `.xls` 时代版本；2007 引入功能区与 `.xlsx`；2010 加入切片器与 Power Pivot；2013 加入快速填充与时间线；2016 加入 Power Query 内置与 6 个新函数；2019 新增 IFS、SWITCH、CONCAT、TEXTJOIN、MAXIFS、MINIFS；2021 新增 XLOOKUP 与动态数组函数 FILTER、SORT、UNIQUE；Microsoft 365 在此基础上持续新增 TEXTSPLIT、TEXTBEFORE、LAMBDA 等，且只有 365 能用最新函数。\n\n**一个常见误标**：IFS、SWITCH、CONCAT、TEXTJOIN 是 Excel 2019 新增，不是 2016。很多旧教程写\"2016+\"是错的——在 Excel 2016 打开含 IFS 的文件会报 `#NAME?`。本站函数库的版本字段以 `versions.func_ver` 为准：IFS、SWITCH、TEXTJOIN、CONCAT、MAXIFS、MINIFS 均为 2019／365；XLOOKUP、FILTER、SORT、UNIQUE 为 2021／365；TEXTSPLIT、TEXTBEFORE、TEXTAFTER、LAMBDA 为 365 专属。\n\n**兼容性检查器**：文件→信息→检查问题→检查兼容性，可列出当前文件在旧版本里会丢失的功能（如新函数、某些图表类型），并给出受影响的单元格。文件发给别人之前跑一遍，比对方打电话来说\"公式报错\"强。\n\n**365 与买断版的区别**：Microsoft 365 是订阅制，持续获得新函数与新功能；2019、2021 是买断版，功能冻结在发布时。同样叫\"最新版 Excel\"，365 用户能用的函数可能比 2021 用户多。写教程、做模板时要先问清对方的版本。\n\n**旧版本替代写法**：XLOOKUP（2021／365）→ 旧版用 INDEX+MATCH 或 VLOOKUP；IFS（2019／365）→ 旧版用 IF 嵌套；TEXTJOIN（2019／365）→ 旧版用 `&` 连接；FILTER（2021／365）→ 旧版用高级筛选或数组公式。本站每篇涉及新函数的教程都会注明替代写法。", "steps": ["查看自己的版本：文件→账户→关于 Excel，或文件→信息，顶部显示版本号（如\"Microsoft 365\"或\"Excel 2019\"）。", "查函数兼容性：本站函数库每函数详情页有\"版本兼容性\"表；或在微软官方支持页搜函数名，看\"适用于\"一栏。", "跑兼容性检查：文件→信息→检查问题→检查兼容性，选目标旧版本（如 Excel 2016），看报告里列出的问题单元格。", "处理不兼容项：把新函数换成替代写法，或把结果\"选择性粘贴→数值\"固定下来再发给对方；图表类问题换成旧版支持的图表类型。", "保存时降级：另存为时选旧格式（如\"Excel 97-2003 工作簿 *.xls\"）会触发兼容性检查，按提示逐项处理；无特殊原因不要主动降级保存。"], "sections": [{"title": "2. 基础概念", "body": "**版本沿革**：Excel 2003 是最后一个 `.xls` 时代版本；2007 引入功能区与 `.xlsx`；2010 加入切片器与 Power Pivot；2013 加入快速填充与时间线；2016 加入 Power Query 内置与 6 个新函数；2019 新增 IFS、SWITCH、CONCAT、TEXTJOIN、MAXIFS、MINIFS；2021 新增 XLOOKUP 与动态数组函数 FILTER、SORT、UNIQUE；Microsoft 365 在此基础上持续新增 TEXTSPLIT、TEXTBEFORE、LAMBDA 等，且只有 365 能用最新函数。\n\n**一个常见误标**：IFS、SWITCH、CONCAT、TEXTJOIN 是 Excel 2019 新增，不是 2016。很多旧教程写\"2016+\"是错的——在 Excel 2016 打开含 IFS 的文件会报 `#NAME?`。本站函数库的版本字段以 `versions.func_ver` 为准：IFS、SWITCH、TEXTJOIN、CONCAT、MAXIFS、MINIFS 均为 2019／365；XLOOKUP、FILTER、SORT、UNIQUE 为 2021／365；TEXTSPLIT、TEXTBEFORE、TEXTAFTER、LAMBDA 为 365 专属。\n\n**兼容性检查器**：文件→信息→检查问题→检查兼容性，可列出当前文件在旧版本里会丢失的功能（如新函数、某些图表类型），并给出受影响的单元格。文件发给别人之前跑一遍，比对方打电话来说\"公式报错\"强。\n\n**365 与买断版的区别**：Microsoft 365 是订阅制，持续获得新函数与新功能；2019、2021 是买断版，功能冻结在发布时。同样叫\"最新版 Excel\"，365 用户能用的函数可能比 2021 用户多。写教程、做模板时要先问清对方的版本。\n\n**旧版本替代写法**：XLOOKUP（2021／365）→ 旧版用 INDEX+MATCH 或 VLOOKUP；IFS（2019／365）→ 旧版用 IF 嵌套；TEXTJOIN（2019／365）→ 旧版用 `&` 连接；FILTER（2021／365）→ 旧版用高级筛选或数组公式。本站每篇涉及新函数的教程都会注明替代写法。"}, {"title": "4. 图文示例", "body": "同事用 Excel 2016，你用 365。你做的表里用了 `=XLOOKUP(A2, 客户表!A:A, 客户表!B:B)`，对方打开显示 `#NAME?`。处理办法：把 XLOOKUP 换成 `=INDEX(客户表!B:B, MATCH(A2, 客户表!A:A, 0))`，2016 也能跑；或把结果列选择性粘贴为数值再发。反过来，对方发来的 .xls 旧文件，你打开后先另存为 .xlsx 再改，避免旧格式限制（行数上限 65536 行、函数受限）。\n\n（截图位：待补图）"}], "source": "docs/basics/05-versions.md", "updated": "2026-11-09", "objectives": ["说出 Excel 各主要版本的发布时间线与标志性新增功能", "判断一个函数在自己电脑的版本上能不能用（查兼容矩阵）", "用兼容性检查器发现文件发给旧版本用户时会出的问题", "针对旧版本用户选择替代写法（如用 INDEX+MATCH 代替 XLOOKUP）"], "formulas": ["=INDEX(客户表!B:B, MATCH(A2, 客户表!A:A, 0)) → 与 XLOOKUP 相同结果", "=IF(A2>=90,\"优\",IF(A2>=60,\"及格\",\"不及格\")) → 及格（A2=75 时）", "=A2&\"、\"&B2&\"、\"&C2 → 张三、李四、王五", "- `=INDEX(客户表!B:B, MATCH(A2, 客户表!A:A, 0))` → 与 XLOOKUP 相同结果：XLOOKUP 的全版本替代写法：MATCH 定位行号，INDEX 取值；A2 是\"张三\"时返回其对应的客户经理", "- `=IF(A2>=90,\"优\",IF(A2>=60,\"及格\",\"不及格\"))` → 及格：IFS 的旧版替代写法：IF 嵌套；A2=75 时第一层假、第二层真，返回\"及格\"", "- `=A2&\"、\"&B2&\"、\"&C2` → 张三、李四、王五：TEXTJOIN 的旧版替代写法：& 连接符逐个拼接；TEXTJOIN 本身需 2019／365"], "scenarios": [{"title": "模板要发给全公司用", "body": "公司电脑版本混杂（2016、2019、365 都有）。模板里的函数只用 2016 也有的（SUMIF、VLOOKUP、INDEX+MATCH），新函数一律不用；发之前用兼容性检查器跑一遍，确认零问题再群发。"}, {"title": "面试被问\"你会 XLOOKUP 吗\"", "body": "先答会，再补一句适用版本：XLOOKUP 需 2021／365，旧版用 INDEX+MATCH 实现同样效果。能说清版本边界，比只会背语法更像内行。"}], "pitfalls": [{"problem": "对方打开文件公式报 #NAME?", "cause": "用了对方版本没有的新函数", "solution": "查兼容矩阵确认引入版本；换替代写法或粘贴为数值"}, {"problem": "把 IFS 当成老版本就有的函数", "cause": "IFS 是 2019 新增，旧教程误标了版本", "solution": "IFS、SWITCH、CONCAT、TEXTJOIN、MAXIFS、MINIFS 均为 2019 新增；以本站 func_ver 数据为准"}, {"problem": "365 的新函数在 2021 上也不能用", "cause": "TEXTSPLIT、LAMBDA 是 365 专属，不在 2021 内", "solution": "做跨版本模板时只用 2021 及以下版本共有的函数"}, {"problem": ".xls 旧文件行数不够用", "cause": "旧格式上限 65536 行", "solution": "另存为 .xlsx（上限 1048576 行）再继续做"}], "exercises": ["IFS、XLOOKUP、TEXTSPLIT 三个函数的引入版本各是什么？在 Excel 2016 上哪个能用？", "同事用 2016，你的表里用了 TEXTJOIN，要发给他，至少给出两种处理办法。", "文件→信息→检查问题→检查兼容性是干什么用的？"], "answers": ["IFS 是 2019／365，XLOOKUP 是 2021／365，TEXTSPLIT 是 365 专属。2016 上三个都不能用，都会报 #NAME?。", "（1）换成 & 连接符逐个拼接；（2）把结果列选择性粘贴为数值后发送。", "列出当前文件在指定旧版本里会丢失的功能与受影响单元格，发文件给旧版本用户之前跑一遍。"], "versions": "Excel 2003／2007／2010／2013／2016／2019／2021／365"}, {"id": "formatting-01-number-format", "group": "formatting", "column": "C02", "level2": "C02-L2-1", "title": "数字格式：常规、货币、日期、百分比与自定义格式代码", "level": "入门", "body": "**值与格式分离**：单元格里存的是值（如 0.25），显示的是格式（如 25%）。改格式只改变观感，不改变参与计算的值——`0.25` 显示成 25% 后，求和结果不变。这是理解数字格式的第一性原理，也是\"百分比放大 100 倍\"事故的根源：先输入 25 再设百分比格式，Excel 会把 25 理解成 2500%。\n\n**常规格式**：默认格式，数字按原样显示，超过 11 位的大数字自动变科学计数法。身份证号、银行卡号变科学计数法，就是常规格式在作怪——解法是先设文本格式再输入。\n\n**货币与会计专用**：货币格式给数字加 ¥ 符号与千分位（如 ¥1,234.56）；会计专用格式把 ¥ 符号左对齐、小数点对齐，适合财务报表。两者都不改变数值本身。\n\n**日期格式**：Excel 的日期本质是序列值（1900-01-01 是 1，2026-11-09 是 45961），显示格式决定它看起来是\"2026/11/9\"还是\"2026 年 11 月 9 日\"。日期能直接加减（`2026-11-09 减 2026-11-02 = 7`），靠的就是序列值。\n\n**自定义格式代码**：格式代码分四段\"正数;负数;零值;文本\"，如 `#,##0.00;[红色]-#,##0.00;\"-\"` 表示正数带千分位两位小数、负数红色带减号、零显示一个短横。常用占位符：`0` 强制占位显示 0，`#` 有数才显示，`?` 按空格占位对齐小数点。", "steps": ["设货币：选中金额列，开始→数字格式下拉选\"货币\"，或按 `Ctrl + Shift + 4`（货币快捷键）；会计专用在同一菜单里选\"会计专用\"。", "设百分比：先确认值是小数形式（0.25 不是 25），再按 `Ctrl + Shift + 5` 或点 `%` 按钮；需要两位小数时点\"增加小数位数\"。", "设日期：选中日期列，开始→数字格式下拉选\"短日期\"或\"长日期\"；需要\"2026-11-09\"这种形式时用设置单元格格式→自定义→输入 `yyyy-mm-dd`。", "自定义格式：选中区域按 `Ctrl + 1`→数字→自定义，在类型框输入格式代码，如 `0.00\"元\"`（数字后加\"元\"字后缀显示）。", "批量清格式：选中区域，开始→清除→清除格式，回到常规格式；只清格式不删值。", "检查真值：点任一单元格看编辑栏——编辑栏显示的是真实值，单元格显示的是格式效果；两者不一致时以编辑栏为准。"], "sections": [{"title": "2. 基础概念", "body": "**值与格式分离**：单元格里存的是值（如 0.25），显示的是格式（如 25%）。改格式只改变观感，不改变参与计算的值——`0.25` 显示成 25% 后，求和结果不变。这是理解数字格式的第一性原理，也是\"百分比放大 100 倍\"事故的根源：先输入 25 再设百分比格式，Excel 会把 25 理解成 2500%。\n\n**常规格式**：默认格式，数字按原样显示，超过 11 位的大数字自动变科学计数法。身份证号、银行卡号变科学计数法，就是常规格式在作怪——解法是先设文本格式再输入。\n\n**货币与会计专用**：货币格式给数字加 ¥ 符号与千分位（如 ¥1,234.56）；会计专用格式把 ¥ 符号左对齐、小数点对齐，适合财务报表。两者都不改变数值本身。\n\n**日期格式**：Excel 的日期本质是序列值（1900-01-01 是 1，2026-11-09 是 45961），显示格式决定它看起来是\"2026/11/9\"还是\"2026 年 11 月 9 日\"。日期能直接加减（`2026-11-09 减 2026-11-02 = 7`），靠的就是序列值。\n\n**自定义格式代码**：格式代码分四段\"正数;负数;零值;文本\"，如 `#,##0.00;[红色]-#,##0.00;\"-\"` 表示正数带千分位两位小数、负数红色带减号、零显示一个短横。常用占位符：`0` 强制占位显示 0，`#` 有数才显示，`?` 按空格占位对齐小数点。"}, {"title": "4. 图文示例", "body": "一张报销表：A 列日期（2026-11-02），B 列金额 1234.5，C 列占比 0.25。把 A 列设为 `yyyy-mm-dd` 显示\"2026-11-02\"；B 列设货币格式显示\"¥1,234.50\"；C 列设百分比显示\"25%\"。D 列自定义格式 `0.00\"元\"`，输入 80 显示\"80.00元\"，值仍是 80，可正常求和。核对：选中 C2 看编辑栏仍是 0.25，证明格式没改值。\n\n（截图位：待补图）"}], "source": "docs/formatting/01-number-format.md", "updated": "2026-11-09", "objectives": ["区分\"单元格的值\"与\"单元格的显示格式\"，知道改格式不改值", "正确设置货币、百分比、日期三种最常用数字格式", "写出常用的自定义格式代码（如 0.00、#,##0、yyyy-mm-dd、[红色]负数）", "诊断并修复\"数字变日期\"、\"百分比放大 100 倍\"、\"前导 0 丢失\"三类格式事故"], "formulas": ["=B2*0.13 → 160.49（B2=1234.5 时）", "=A3-A2 → 7（A2=2026-11-02，A3=2026-11-09 时）", "=TEXT(0.25,\"0%\") → 25%", "- `=B2*0.13` → 160.49：1234.5×0.13=160.485，四舍五入到分是 160.49；货币格式显示 ¥160.49，值不变", "- `=A3-A2` → 7：日期相减得天数：11 月 9 日减 11 月 2 日是 7 天（序列值相减）", "- `=TEXT(0.25,\"0%\")` → 25%：TEXT 函数把值按格式代码转成文本\"25%\"，结果是文本，不再参与数值计算"], "scenarios": [{"title": "财务做报销汇总表", "body": "金额列统一货币格式两位小数，合计行加粗；占比列用百分比格式一位小数。发给领导前检查：合计值用 SUM 重算一遍，确认格式没有掩盖真实值（编辑栏核对）。"}, {"title": "人事做工号表", "body": "工号\"00123\"前导 0 会丢失：先把列设为文本格式再录入，或自定义格式 `00000`（5 位不足补 0）。已录丢的 0 无法找回，只能重新录入。"}], "pitfalls": [{"problem": "百分比显示 2500%", "cause": "先输 25 再设百分比格式", "solution": "先设格式再输 0.25，或输入后除以 100；已错的批量用选择性粘贴→除 100 修正"}, {"problem": "身份证号变科学计数法", "cause": "常规格式下长数字被当数值", "solution": "先设文本格式再输入；已变的无法恢复原值，需重新录入"}, {"problem": "日期输入后变 45961", "cause": "单元格是常规格式，序列值露出来了", "solution": "选中区域设为短日期格式"}, {"problem": "前导 0 丢失（00123 变 123）", "cause": "数值格式不保留前导 0", "solution": "先设文本格式，或自定义格式 00000"}, {"problem": "自定义格式代码不生效", "cause": "代码写错段或用了中文标点", "solution": "分号用英文 ;，引号用英文双引号，代码分段不超过四段"}], "exercises": ["单元格值是 0.25，设为百分比格式后显示什么？参与求和的值变了吗？", "A2=2026-11-02，A3=2026-11-09，=A3-A2 的结果是多少？为什么日期能相减？", "写一个自定义格式代码：正数显示千分位两位小数，负数显示红色带减号，零显示一个短横。"], "answers": ["显示 25%，求和用的值仍是 0.25。格式只改显示不改值。", "结果 7（天）。日期本质是序列值，2026-11-09 减 2026-11-02 等于序列值之差 7。", "`#,##0.00;[红色]-#,##0.00;\"-\"`。四段结构：正数;负数;零值；文本段省略。"], "versions": "Excel 2016／2019／2021／365"}, {"id": "formatting-02-font-alignment", "group": "formatting", "column": "C02", "level2": "C02-L2-2", "title": "字体与对齐：字号颜色、对齐缩进与自动换行", "level": "入门", "body": "**字体三要素**：字体、字号、颜色。报表惯例：标题 16 号加粗、表头 11 号加粗配填充色、数据 11 号常规。同一张表字体不超过两种，字号不超过三个档次，否则显乱。\n\n**对齐**：水平对齐分左对齐（文本默认）、居中、右对齐（数值默认）；垂直对齐分靠上、居中、靠下。数字右对齐、文本左对齐、标题居中，是表格的默认美学；跨列居中（设置单元格格式→对齐→水平对齐→跨列居中）能让标题居中又不破坏数据区结构，比合并单元格更安全。\n\n**缩进**：增加缩进量可以把层级关系可视化（如\"销售部\"下一级\"华东区\"缩进一格），比用空格对齐可靠——空格缩进在换字体后会错位。\n\n**自动换行**：长文本超出列宽时，自动换行让它在格内折成多行显示，同时行高自动撑高；配合\"缩小字体填充\"可在不换行时把字缩到能放下。两者不要同时开。\n\n**格式刷**：选中带格式的格点格式刷，再点目标格，只刷格式不刷内容；双击格式刷可连续刷多个区域，按 Esc 退出。格式刷是\"复制格式\"最快的方式，比逐项点工具栏快一个数量级。", "steps": ["设标题：选中标题行，字号 16、加粗、居中；表头行字号 11、加粗、填充浅灰、居中。", "调对齐：选中数据区，开始→对齐方式组，数值列点右对齐、文本列点左对齐；标题行点\"合并后居中\"或改用\"跨列居中\"。", "长文本换行：选中长文本列，开始→自动换行；行高不够时双击行号下边界自适应行高。", "缩进层级：选中下级行，开始→增加缩进量（每点一次缩进一格）。", "复制格式：选中样板格，点格式刷（双击可连续用），再刷目标区域；完成后按 Esc 退出。", "检查：按 `Ctrl + End` 看全表，确认没有字体混用、没有某列突然左对齐/右对齐不一致。"], "sections": [{"title": "2. 基础概念", "body": "**字体三要素**：字体、字号、颜色。报表惯例：标题 16 号加粗、表头 11 号加粗配填充色、数据 11 号常规。同一张表字体不超过两种，字号不超过三个档次，否则显乱。\n\n**对齐**：水平对齐分左对齐（文本默认）、居中、右对齐（数值默认）；垂直对齐分靠上、居中、靠下。数字右对齐、文本左对齐、标题居中，是表格的默认美学；跨列居中（设置单元格格式→对齐→水平对齐→跨列居中）能让标题居中又不破坏数据区结构，比合并单元格更安全。\n\n**缩进**：增加缩进量可以把层级关系可视化（如\"销售部\"下一级\"华东区\"缩进一格），比用空格对齐可靠——空格缩进在换字体后会错位。\n\n**自动换行**：长文本超出列宽时，自动换行让它在格内折成多行显示，同时行高自动撑高；配合\"缩小字体填充\"可在不换行时把字缩到能放下。两者不要同时开。\n\n**格式刷**：选中带格式的格点格式刷，再点目标格，只刷格式不刷内容；双击格式刷可连续刷多个区域，按 Esc 退出。格式刷是\"复制格式\"最快的方式，比逐项点工具栏快一个数量级。"}, {"title": "4. 图文示例", "body": "一张部门费用表：标题\"11 月部门费用表\"16 号加粗居中（跨列居中，不合并）；表头行（部门/项目/金额）11 号加粗、浅灰填充、居中；金额列右对齐货币格式；部门列左对齐，下级\"华东区\"、\"华北区\"各缩进一格；备注列长文本开自动换行。最后用格式刷把表头格式刷到汇总行。\n\n（截图位：待补图）"}], "source": "docs/formatting/02-font-alignment.md", "updated": "2026-11-09", "objectives": ["用字体、字号、颜色与加粗区分标题、表头与数据", "用水平/垂直对齐与缩进让表格对齐整齐", "用自动换行与合并居中处理长文本标题", "用格式刷快速复制格式而不复制内容"], "formulas": ["=SUM(C2:C6) → 4860（C2:C6 是 1200、980、1500、640、540 时）", "=C2/SUM($C$2:$C$6) → 24.69%（C2=1200 时）", "- `=SUM(C2:C6)` → 4860：1200+980+1500+640+540=4860；格式不影响求和，只影响显示", "- `=C2/SUM($C$2:$C$6)` → 24.69%：1200÷4860≈0.2469，显示为百分比两位小数 24.69%"], "scenarios": [{"title": "给领导看的周报", "body": "标题 16 号加粗、表头浅灰加粗、金额右对齐货币格式、关键合计行加粗并加顶边框。领导 10 秒扫完要能抓住总额与最大项——格式就是信息的优先级。"}, {"title": "接手同事的乱表", "body": "字体五花八门时：全选→字体统一为等线 11 号→清除多余加粗与颜色→表头单独加粗加填充。先统一再局部强调，比逐格改快。"}], "pitfalls": [{"problem": "标题用合并单元格后无法排序", "cause": "合并破坏了矩形数据区", "solution": "标题行用\"跨列居中\"代替合并；数据区绝不合并"}, {"problem": "自动换行开了但行高没撑起来", "cause": "行高被手动固定过", "solution": "双击行号下边界自适应行高，或选中行→开始→格式→自动调整行高"}, {"problem": "格式刷刷完内容也被复制了", "cause": "用了复制粘贴而不是格式刷", "solution": "格式刷只刷格式；粘贴时想只粘格式用选择性粘贴→格式"}, {"problem": "数字左对齐、文本右对齐显得乱", "cause": "对齐方式与数据类型不匹配", "solution": "数值右对齐、文本左对齐、标题居中；整列统一改，不要逐格点"}], "exercises": ["C2=1200，C2:C6 合计 4860，=C2/SUM($C$2:$C$6) 显示百分比两位小数是多少？", "标题行想居中但又不想破坏排序，应该用合并后居中还是跨列居中？为什么？", "格式刷双击与单击有什么区别？"], "answers": ["24.69%。1200÷4860≈0.246913…，百分比两位小数是 24.69%。", "跨列居中。它只改变显示效果，不合并单元格，数据区仍是完整矩形，排序筛选不受影响。", "单击只能刷一次，刷完自动退出；双击可连续刷多个区域，按 Esc 退出。"], "versions": "Excel 2016／2019／2021／365"}, {"id": "formatting-03-border-fill", "group": "formatting", "column": "C02", "level2": "C02-L2-3", "title": "边框与填充：边框样式、填充图案与网格线", "level": "入门", "body": "**边框三层级**：外边框（粗线，框住整张表）、内边框（细线，分隔行列）、合计行顶边框（双线或粗线，标出合计）。一张报表通常只需要这三层：外粗内细、合计加粗，线多了反而乱。\n\n**填充色**：表头浅灰、合计行浅黄、异常行浅红，是报表的通用语义。填充只改背景，不改值；隔行变色（斑马纹）能显著降低看错行的概率，大表必备。\n\n**网格线 vs 边框**：网格线是屏幕上的浅灰虚线、只辅助编辑，打印时默认不出来；边框是实打实的格式，打印会出来。视图→取消勾选\"网格线\"可让表格在屏幕上也干净，靠边框来分隔。\n\n**套用表格格式**：开始→套用表格格式，选一个样式一键生成带边框、表头色、隔行变色的表格。它与超级表（Ctrl + T）是两回事：前者只刷格式，后者还带筛选与结构化引用。本篇只讲格式，超级表见下一篇。", "steps": ["加边框：选中数据区，开始→边框下拉→所有框线（内细）；再选中整表范围，边框下拉→粗匣框线（外粗）。", "合计行顶边框：选中合计行，边框下拉→顶端双框线（或上框线粗线）。", "填充表头：选中表头行，开始→填充颜色选浅灰；合计行选浅黄；异常行选浅红。", "隔行变色：选中数据区，开始→条件格式→新建规则→使用公式 `=MOD(ROW(),2)=0` →格式→填充浅灰；或直接用套用表格格式选带隔行色的样式。", "隐藏网格线：视图→取消勾选\"网格线\"，屏幕上只剩你画的边框，检查边框有没有漏画。", "打印检查：文件→打印预览，确认边框都出来了、没有多余的线；页面布局→打印标题可重复标题行。"], "sections": [{"title": "2. 基础概念", "body": "**边框三层级**：外边框（粗线，框住整张表）、内边框（细线，分隔行列）、合计行顶边框（双线或粗线，标出合计）。一张报表通常只需要这三层：外粗内细、合计加粗，线多了反而乱。\n\n**填充色**：表头浅灰、合计行浅黄、异常行浅红，是报表的通用语义。填充只改背景，不改值；隔行变色（斑马纹）能显著降低看错行的概率，大表必备。\n\n**网格线 vs 边框**：网格线是屏幕上的浅灰虚线、只辅助编辑，打印时默认不出来；边框是实打实的格式，打印会出来。视图→取消勾选\"网格线\"可让表格在屏幕上也干净，靠边框来分隔。\n\n**套用表格格式**：开始→套用表格格式，选一个样式一键生成带边框、表头色、隔行变色的表格。它与超级表（Ctrl + T）是两回事：前者只刷格式，后者还带筛选与结构化引用。本篇只讲格式，超级表见下一篇。"}, {"title": "4. 图文示例", "body": "一张 5 行费用表：外边框粗线、内边框细线、合计行顶端双框线；表头浅灰填充、合计行浅黄填充、金额超 1500 的行浅红填充（条件格式公式 `=$C2>1500`）；隐藏网格线后屏幕干净，打印预览确认三层边框齐全。\n\n（截图位：待补图）"}], "source": "docs/formatting/03-border-fill.md", "updated": "2026-11-09", "objectives": ["给表格加外边框、内边框与合计行顶边框，区分三个层级", "用填充色区分表头、合计行与异常行", "理解网格线与边框的区别，知道打印时哪个会出来", "用套用表格格式一键生成带边框与隔行变色的表格"], "formulas": ["=MOD(ROW(),2)=0 → TRUE（偶数行时）", "=SUM(C2:C6) → 4860", "- `=MOD(ROW(),2)=0` → TRUE：隔行变色的条件格式公式：偶数行返回 TRUE，刷浅灰；ROW() 返回当前行号", "- `=SUM(C2:C6)` → 4860：边框与填充不影响计算；1200+980+1500+640+540=4860"], "scenarios": [{"title": "打印出来给财务签字", "body": "外粗内细、合计双线、表头浅灰；打印前隐藏网格线、预览确认分页；金额列货币格式。签字的表要一眼分清表头、数据、合计三层。"}, {"title": "大表看错行", "body": "30 列 500 行的表，隔行变色是刚需：条件格式 `=MOD(ROW(),2)=0` 刷浅灰，或套用表格格式选斑马纹样式。看错行的错误率立刻下降。"}], "pitfalls": [{"problem": "打印出来没有线", "cause": "只依赖网格线，没画边框", "solution": "网格线默认不打印；必须用开始→边框画实线"}, {"problem": "边框线型不统一", "cause": "多次叠加不同线型", "solution": "先清除边框再重画；外粗内细一次成型"}, {"problem": "填充色太深导致字看不清", "cause": "深色填充配黑色字", "solution": "浅色填充（浅灰/浅黄/浅蓝）配黑字；深色填充必须配白字"}, {"problem": "隔行变色与手动填充冲突", "cause": "手动填充盖住了条件格式", "solution": "二选一：要么全手动，要么全条件格式；不要混用"}], "exercises": ["网格线与边框有什么区别？打印时哪个会出来？", "写出隔行变色的条件格式公式，并说明它为什么能隔行刷色。", "一张表外边框、内边框、合计行顶边框分别建议用什么线型？"], "answers": ["网格线是屏幕辅助线，默认不打印；边框是单元格格式，打印会出来。", "`=MOD(ROW(),2)=0`。ROW() 取当前行号，偶数行余数为 0 返回 TRUE，条件格式对该行刷填充色。", "外边框粗线、内边框细线、合计行顶端双框线（或粗线）。外粗内细、合计加重。"], "versions": "Excel 2016／2019／2021／365"}, {"id": "formatting-04-styles-themes", "group": "formatting", "column": "C02", "level2": "C02-L2-4", "title": "样式与主题：单元格样式、套用表格格式与主题配色", "level": "入门", "body": "**单元格样式**：开始→单元格样式，内置\"标题\"、\"强调\"、\"好\"（绿底）、\"差\"（红底）、\"适中\"（黄底）等语义样式。点一下即套用一整套字体、填充与边框，比逐项点工具栏快；语义样式还能让\"好/差\"一眼可辨。\n\n**套用表格格式**：选一个样式，一键生成带表头色、隔行变色、首列加粗的表格。它只刷格式，不带筛选功能；想要筛选与结构化引用，改用 `Ctrl + T` 创建超级表（见下一篇）。\n\n**自定义样式**：开始→单元格样式→新建单元格样式，把\"公司红标题\"存成样式，全工作簿点一下即用。样式存在工作簿里，换电脑、发给别人都跟着走。\n\n**主题**：页面布局→主题，一键换全表的配色方案与字体组合（标题字体＋正文字体）。主题色是联动的：用主题色做的填充与字体，换主题后自动跟着变；用标准色做的则不变。做公司模板时一律用主题色，换 VI 色一次改全套。", "steps": ["套语义样式：选中结果格，开始→单元格样式→点\"好\"/\"差\"/\"适中\"；达标绿、超标红，状态一眼可见。", "套表格样式：选中数据区，开始→套用表格格式，选一个带隔行变色的样式，勾选\"表包含标题\"。", "新建样式：设置好一个单元格的全部格式，开始→单元格样式→新建单元格样式，起名\"公司标题\"，以后点一下即用。", "换主题：页面布局→主题，选一个主题；再点\"颜色\"可只换配色、点\"字体\"可只换字体组合。", "清理样式：开始→单元格样式→右键自定义样式→删除；或选中区域→清除→清除格式，回到常规格式。"], "sections": [{"title": "2. 基础概念", "body": "**单元格样式**：开始→单元格样式，内置\"标题\"、\"强调\"、\"好\"（绿底）、\"差\"（红底）、\"适中\"（黄底）等语义样式。点一下即套用一整套字体、填充与边框，比逐项点工具栏快；语义样式还能让\"好/差\"一眼可辨。\n\n**套用表格格式**：选一个样式，一键生成带表头色、隔行变色、首列加粗的表格。它只刷格式，不带筛选功能；想要筛选与结构化引用，改用 `Ctrl + T` 创建超级表（见下一篇）。\n\n**自定义样式**：开始→单元格样式→新建单元格样式，把\"公司红标题\"存成样式，全工作簿点一下即用。样式存在工作簿里，换电脑、发给别人都跟着走。\n\n**主题**：页面布局→主题，一键换全表的配色方案与字体组合（标题字体＋正文字体）。主题色是联动的：用主题色做的填充与字体，换主题后自动跟着变；用标准色做的则不变。做公司模板时一律用主题色，换 VI 色一次改全套。"}, {"title": "4. 图文示例", "body": "考核表：得分≥90 的格套\"好\"样式（绿底），60 分以下套\"差\"样式（红底），60–90 套\"适中\"（黄底）。整表套用表格格式\"浅色 1\"得隔行变色；标题用新建样式\"公司标题\"（16 号加粗、公司蓝）。换主题\"简约\"后，全表配色一次变灰蓝，语义色（好/差）不受影响。\n\n（截图位：待补图）"}], "source": "docs/formatting/04-styles-themes.md", "updated": "2026-11-09", "objectives": ["用内置单元格样式一键套用标题、强调、好/差等语义格式", "用套用表格格式快速生成带隔行变色的表格", "新建自定义单元格样式并在全工作簿复用", "换主题一键改全表的配色与字体，并理解主题色的联动规则"], "formulas": ["=IF(B2>=90,\"好\",IF(B2>=60,\"适中\",\"差\")) → 好（B2=95 时）", "=COUNTIF(B2:B6,\">=90\") → 2（B2:B6 是 95、88、92、58、76 时）", "- `=IF(B2>=90,\"好\",IF(B2>=60,\"适中\",\"差\"))` → 好：B2=95 时第一层为真返回\"好\"；配合单元格样式，好/差/适中三档自动上色", "- `=COUNTIF(B2:B6,\">=90\")` → 2：95 与 92 两个≥90，计数为 2；与\"好\"样式的格数一致，可互相核对"], "scenarios": [{"title": "公司统一报表模板", "body": "新建样式\"公司标题\"、\"公司表头\"、\"公司合计\"，主题色用公司 VI 蓝。以后每张报表点三下样式即成型，换 VI 时改一次主题色，全公司模板跟着变。"}, {"title": "考核结果公示表", "body": "分数列用 IF 分档＋语义样式（好绿/差红/适中黄），公示时不用逐行解释，颜色即结论。注意色盲友好：同时保留文字档位，不要只靠颜色。"}], "pitfalls": [{"problem": "套用表格格式后筛选箭头没了", "cause": "把\"套用表格格式\"当成了超级表", "solution": "套用表格格式只刷格式；要筛选与结构化引用用 Ctrl + T 创建超级表"}, {"problem": "换主题后部分颜色没变", "cause": "那些颜色用的是标准色而非主题色", "solution": "做模板时一律用主题色；标准色不参与主题联动"}, {"problem": "样式越用越乱", "cause": "自定义样式起名随意、无人维护", "solution": "样式名写清用途（如\"公司标题-16号蓝\"），定期清理无用样式"}, {"problem": "语义样式只靠颜色传达信息", "cause": "色盲用户无法区分红绿", "solution": "颜色之外保留文字（好/差/及格），不要只用颜色做唯一信号"}], "exercises": ["B2:B6 是 95、88、92、58、76，=COUNTIF(B2:B6,\">=90\") 的结果是多少？哪两个数被数进去了？", "套用表格格式与 Ctrl + T 创建超级表有什么区别？", "为什么做公司模板要用主题色而不是标准色？"], "answers": ["结果 2，数进去的是 95 与 92。88、58、76 都小于 90。", "前者只刷格式（边框、隔行色），不带筛选与结构化引用；后者是结构化表格，带筛选箭头、汇总行与结构化引用。", "主题色随主题联动：换一次主题色，全表用主题色的地方自动跟着变；标准色不变，换 VI 时要逐格改。"], "versions": "Excel 2016／2019／2021／365"}, {"id": "formatting-05-tables", "group": "formatting", "column": "C02", "level2": "C02-L2-5", "title": "超级表：创建、结构化引用、表样式与汇总行", "level": "进阶", "body": "**超级表（结构化表格）**：`Ctrl + T` 创建的带格式、带筛选、带结构化引用的智能表格。它与普通区域的根本区别是\"表知道自己的边界\"：新增一行，格式、公式、汇总行自动扩展；删除一行，引用自动收缩。\n\n**结构化引用**：超级表里的公式不用 `B2:B6` 这种地址，改用表名加列名，如 `=SUM(表1[金额])`。好处是公式自带语义（\"对表 1 的金额列求和\"），新增行后引用范围自动扩大，不用改公式；跨表引用时也不怕插行错位。\n\n**表样式与汇总行**：表设计选项卡可换样式、开关筛选按钮、开关首行/末行、开汇总行。汇总行在表底加一行，每列可下拉选求和、计数、平均值、最大值等，一键出合计，不用手写公式。\n\n**表名管理**：表名默认是\"表1\"、\"表2\"，应在表设计选项卡改成有意义的名字（如\"销售明细\"），结构化引用才可读。表名不能与单元格地址重名（如不能叫 A1），不能含空格。\n\n**与数据管理的分工**：超级表本身归属本栏目（C02-L2-5）；数据管理栏目（C05-L2-3）只做交叉引用，不重复建内容。排序筛选、数据清洗在超级表上操作与普通区域一致，但体验更好（筛选箭头常驻、新增行自动纳入）。", "steps": ["创建：点数据区内任一格，按 `Ctrl + T`，确认\"表包含标题\"已勾选，点确定；或插入→表格。", "改名：选中表内任一格，表设计→表名称，改成\"销售明细\"这类有意义的名字。", "写结构化引用：在汇总格输入 `=SUM(销售明细[金额])`，输入表名后按 `[` 会自动提示列名，Tab 选中。", "开汇总行：表设计→勾选\"汇总行\"，表底出现一行，每列点下拉选求和/计数/平均值。", "换样式：表设计→表样式，选一个样式；勾选\"镶边行\"得隔行变色，勾选\"首行\"加粗表头。", "转回普通区域：表设计→转换为区域（结构化引用会变成普通地址引用，汇总行保留为数值行，需确认）。"], "sections": [{"title": "2. 基础概念", "body": "**超级表（结构化表格）**：`Ctrl + T` 创建的带格式、带筛选、带结构化引用的智能表格。它与普通区域的根本区别是\"表知道自己的边界\"：新增一行，格式、公式、汇总行自动扩展；删除一行，引用自动收缩。\n\n**结构化引用**：超级表里的公式不用 `B2:B6` 这种地址，改用表名加列名，如 `=SUM(表1[金额])`。好处是公式自带语义（\"对表 1 的金额列求和\"），新增行后引用范围自动扩大，不用改公式；跨表引用时也不怕插行错位。\n\n**表样式与汇总行**：表设计选项卡可换样式、开关筛选按钮、开关首行/末行、开汇总行。汇总行在表底加一行，每列可下拉选求和、计数、平均值、最大值等，一键出合计，不用手写公式。\n\n**表名管理**：表名默认是\"表1\"、\"表2\"，应在表设计选项卡改成有意义的名字（如\"销售明细\"），结构化引用才可读。表名不能与单元格地址重名（如不能叫 A1），不能含空格。\n\n**与数据管理的分工**：超级表本身归属本栏目（C02-L2-5）；数据管理栏目（C05-L2-3）只做交叉引用，不重复建内容。排序筛选、数据清洗在超级表上操作与普通区域一致，但体验更好（筛选箭头常驻、新增行自动纳入）。"}, {"title": "4. 图文示例", "body": "销售明细表（A 列日期、B 列销售员、C 列金额，共 5 行，金额 1200、980、1500、640、540）：`Ctrl + T` 创建超级表并改名\"销售明细\"；汇总行对金额列选\"求和\"得 4860；旁边写 `=SUM(销售明细[金额])` 同样得 4860，两处互相核对；新增一行（张三、11 月 9 日、700），汇总行与结构化引用自动变成 5560，不用改任何公式。\n\n（截图位：待补图）"}], "source": "docs/formatting/05-tables.md", "updated": "2026-11-09", "objectives": ["用 Ctrl + T 把普通区域转成超级表，并给表起一个有意义的名字", "读懂并写出结构化引用（如 表1[金额]、表1[[#汇总],[金额]]）", "用汇总行一键求和、计数、求平均，并用切片器筛选超级表", "知道超级表新增行时公式与格式自动扩展，替代手工拖公式"], "formulas": ["=SUM(销售明细[金额]) → 4860", "=AVERAGE(销售明细[金额]) → 972", "=COUNTIF(销售明细[销售员],\"张三\") → 2", "- `=SUM(销售明细[金额])` → 4860：结构化引用求和：1200+980+1500+640+540=4860；新增行后自动纳入", "- `=AVERAGE(销售明细[金额])` → 972：4860÷5=972，金额列平均值", "- `=COUNTIF(销售明细[销售员],\"张三\")` → 2：示例中张三出现 2 次；结构化引用同样适用于 COUNTIF 等条件函数"], "scenarios": [{"title": "每天追加的销售流水", "body": "流水每天新增几十行：做成超级表后，汇总行的合计与旁边的结构化引用公式自动包含新行，透视表的数据源设为表名后刷新即含新数据。普通区域每次都要改引用范围，迟早漏一次。"}, {"title": "多人协作的台账", "body": "表名即文档：公式里写 `销售明细[金额]`，接手的人不用猜 B 列是什么。表头重命名后公式里的列名自动跟着改，不会断链。"}], "pitfalls": [{"problem": "结构化引用公式报错 #NAME?", "cause": "表名含空格或与单元格地址重名", "solution": "表名用无空格的名字（如\"销售明细\"不要用\"销售 明细\"），不要叫 A1、R1C1 这类地址"}, {"problem": "新增行后公式没跟上", "cause": "新增的行不在表内（空了一行再写）", "solution": "紧贴表底最后一行新增，或直接在汇总行上方插入行；空行会断开表的扩展"}, {"problem": "汇总行求和结果不对", "cause": "金额列混入了文本型数字", "solution": "文本数字不参与求和：先分列或乘 1 转数值，再看汇总行"}, {"problem": "想取消超级表但公式全断了", "cause": "直接删表或清格式", "solution": "用表设计→转换为区域，结构化引用会转回普通地址，公式不断"}], "exercises": ["金额列 1200、980、1500、640、540，用结构化引用写求和与求平均公式，结果各是多少？新增一行 700 后求和变多少？", "超级表与普通区域的根本区别是什么？说出两点。", "表名为什么不能叫 A1、不能含空格？"], "answers": ["求和 `=SUM(销售明细[金额])` → 4860；平均 `=AVERAGE(销售明细[金额])` → 972。新增 700 后求和自动变 5560（4860+700）。", "表知道自己的边界：新增行格式与公式自动扩展；引用用结构化引用（表名+列名），新增行自动纳入。", "A1 会与单元格地址冲突，Excel 无法区分；空格会让结构化引用解析失败。改名用无空格的有意义名字。"], "versions": "Excel 2016／2019／2021／365"}, {"id": "formulas-01-formula-basics", "group": "formulas", "column": "C03", "level2": "C03-L2-1", "title": "公式入门：公式结构、运算符与输入编辑", "level": "入门", "body": "**公式结构**：所有公式都以 `=` 开头，如 `=B2+C2`。等号后面是操作数（数字、单元格引用、函数结果）与运算符的组合。`SUM`、`IF` 这类现成的计算单元叫函数，写法是 `函数名(参数1, 参数2)`，参数之间用英文逗号分隔。\n\n**运算符三类**：算术运算符 `+ - * / % ^`（加减乘除、百分号、乘方）；比较运算符 `= > < >= <= <>`（返回 TRUE 或 FALSE）；文本连接符 `&`（把两段文本拼成一段，如 `=A2&\"部\"`）。优先级：括号最先，接着乘方、乘除、加减，最后是连接与比较；记不住就加括号，括号永远最优先。\n\n**公式与结果**：单元格显示的是计算结果，编辑栏显示的是公式本身。双击单元格或按 `F2` 可进入编辑状态，光标定位到公式末尾；按 `Esc` 放弃修改，按 `Enter` 确认。公式→显示公式（`Ctrl + ``，反引号键）可让全表显示公式而不是结果，检查时用它。\n\n**相对引用入门**：公式里的 `B2` 是相对引用，复制到下一行会自动变成 `B3`，复制到右一列会变成 `C2`。这是公式能\"一写多用\"的关键；想让它不跟着变，见下一篇引用方式（加 `$` 锁定）。\n\n**常见第一错**：公式不以 `=` 开头（直接写 `SUM(B2:B10)` 只会显示文本）；用了中文括号 `（）` 或中文逗号 `，`（Excel 只认英文半角符号）；单元格是文本格式，公式被当文本显示（改回常规格式后双击回车重新确认）。", "steps": ["输入第一个公式：点 C2 输入 `=B2*2` 回车，C2 显示结果；再点 C2 看编辑栏，确认公式本身是 `=B2*2`。", "复制公式：选中 C2，拖填充柄向下到 C6，各行自动变成 `=B3*2`、`=B4*2`……（相对引用自动递增）。", "用函数求和：在 C7 输入 `=SUM(C2:C6)`，或点 C7 后按 `Alt + =` 自动求和。", "检查公式：公式→显示公式（或按 `Ctrl + ``）切换全表显示公式，核对每行引用是否正确，再按一次切回结果。", "改公式：双击单元格或按 `F2`，改完按 `Enter`；改错了按 `Esc` 放弃、按 `Ctrl + Z` 撤销。", "固定结果：公式算好后如需发给别人，复制区域→右键→选择性粘贴→数值，把公式变成结果值，防止对方改动源数据后结果跟着变。"], "sections": [{"title": "2. 基础概念", "body": "**公式结构**：所有公式都以 `=` 开头，如 `=B2+C2`。等号后面是操作数（数字、单元格引用、函数结果）与运算符的组合。`SUM`、`IF` 这类现成的计算单元叫函数，写法是 `函数名(参数1, 参数2)`，参数之间用英文逗号分隔。\n\n**运算符三类**：算术运算符 `+ - * / % ^`（加减乘除、百分号、乘方）；比较运算符 `= > < >= <= <>`（返回 TRUE 或 FALSE）；文本连接符 `&`（把两段文本拼成一段，如 `=A2&\"部\"`）。优先级：括号最先，接着乘方、乘除、加减，最后是连接与比较；记不住就加括号，括号永远最优先。\n\n**公式与结果**：单元格显示的是计算结果，编辑栏显示的是公式本身。双击单元格或按 `F2` 可进入编辑状态，光标定位到公式末尾；按 `Esc` 放弃修改，按 `Enter` 确认。公式→显示公式（`Ctrl + ``，反引号键）可让全表显示公式而不是结果，检查时用它。\n\n**相对引用入门**：公式里的 `B2` 是相对引用，复制到下一行会自动变成 `B3`，复制到右一列会变成 `C2`。这是公式能\"一写多用\"的关键；想让它不跟着变，见下一篇引用方式（加 `$` 锁定）。\n\n**常见第一错**：公式不以 `=` 开头（直接写 `SUM(B2:B10)` 只会显示文本）；用了中文括号 `（）` 或中文逗号 `，`（Excel 只认英文半角符号）；单元格是文本格式，公式被当文本显示（改回常规格式后双击回车重新确认）。"}, {"title": "4. 图文示例", "body": "工资表示例：A 列姓名，B 列基本工资（5000、6000、5500、7000、6500），C 列绩效系数（1.1、1.0、1.2、1.0、1.1）。D2 输入 `=B2*C2` 得 5500，拖填充柄到 D6 得 6000、6600、7000、7150；D7 用 `=SUM(D2:D6)` 得 32250；D8 用 `=AVERAGE(D2:D6)` 得 6450。核对：5500+6000+6600+7000+7150=32250，32250÷5=6450。\n\n（截图位：待补图）"}], "source": "docs/formulas/01-formula-basics.md", "updated": "2026-11-09", "objectives": ["说出公式的四个组成部分（等号、操作数、运算符、函数），并用 = 开头输入公式", "正确使用算术、比较、文本连接三类运算符，并说出运算优先级", "区分公式与结果：编辑栏看公式、单元格看结果，双击或按 F2 编辑公式", "用公式审核的\"显示公式\"与\"追踪引用单元格\"快速检查公式"], "formulas": ["=B2*C2 → 5500（B2=5000，C2=1.1 时）", "=SUM(D2:D6) → 32250", "=AVERAGE(D2:D6) → 6450", "=B2&\"部\" → 销售部（B2=销售时）", "- `=B2*C2` → 5500：5000×1.1=5500，实发工资=基本工资×绩效系数", "- `=SUM(D2:D6)` → 32250：5500+6000+6600+7000+7150=32250，五人实发合计", "- `=AVERAGE(D2:D6)` → 6450：32250÷5=6450，人均实发", "- `=B2&\"部\"` → 销售部：& 连接文本：\"销售\"+\"部\"拼成\"销售部\""], "scenarios": [{"title": "销售提成表", "body": "销售额在 B 列，提成比例 5% 写在 E1。C2 写 `=B2*$E$1`（E1 要锁定，见引用方式篇），拖填充柄全员一次算完；月底比例改成 6% 时只改 E1，全表跟着变。"}, {"title": "成绩单：总分与平均分", "body": "语文、数学、英语在 B、C、D 列，E 列 `=SUM(B2:D2)` 求总分，F 列 `=AVERAGE(B2:D2)` 求平均分。拖填充柄一次完成全班，公式→显示公式检查一遍引用无错位。"}], "pitfalls": [{"problem": "公式显示为文本不计算", "cause": "没以 = 开头，或单元格是文本格式", "solution": "补 =；或改回常规格式后双击单元格回车重新确认"}, {"problem": "公式里出现中文括号或中文逗号", "cause": "输入法是中文状态", "solution": "切英文输入法重输；公式体检工具可批量查全角符号"}, {"problem": "复制公式后结果全一样", "cause": "引用被 $ 锁死了（绝对引用）", "solution": "去掉不需要的 $；相对引用才随复制递增"}, {"problem": "结果是 #VALUE!", "cause": "文本参与了数值运算", "solution": "检查参与运算的格有没有文本型数字；用分列或乘 1 转数值"}, {"problem": "按 Enter 后光标乱跑", "cause": "不知道 Enter 是下移、Tab 是右移", "solution": "Enter 下移一格、Shift+Enter 上移、Tab 右移、Shift+Tab 左移"}], "exercises": ["B2=5000，C2=1.1，D2 写 =B2*C2，结果是多少？拖到 D6 后 D6 的公式是什么（假设 D6 对应 B6、C6）？", "D2:D6 是 5500、6000、6600、7000、7150，求和与平均值各是多少？写出公式与结果。", "公式 `=SUM(B2:B10)` 直接写成 `SUM(B2:B10)`（没有等号）会怎样？"], "answers": ["结果 5500。D6 的公式是 =B6*C6（相对引用随行递增）。", "求和 `=SUM(D2:D6)` → 32250；平均 `=AVERAGE(D2:D6)` → 6450。", "Excel 会把它当文本显示，不计算。所有公式必须以 = 开头。"], "versions": "Excel 2016／2019／2021／365"}, {"id": "formulas-02-references", "group": "formulas", "column": "C03", "level2": "C03-L2-2", "title": "引用方式：相对引用、绝对引用、混合引用与跨表引用", "level": "入门", "body": "**相对引用**：`B2` 这样不带 `$` 的引用。公式复制到别处时，引用跟着目标位置同步移动：下移一行变 `B3`，右移一列变 `C2`。它是公式\"一写多用\"的基础。\n\n**绝对引用**：`$B$2`，行列都锁定。公式复制到任何地方都指向 B2 不变。适用场景：引用某个固定参数格（如税率、提成比例、单价），全表共用一个格。\n\n**混合引用**：`$B2`（锁列不锁行）或 `B$2`（锁行不锁列）。乘法表是经典场景：行标题在 A 列、列标题在第 1 行，公式 `=$A2*B$1` 往右拖时 A 列锁定、往下拖时第 1 行锁定，一张乘法表一个公式搞定。\n\n**F4 切换**：编辑公式时光标放在引用上，按 `F4` 循环切换 `B2` → `$B$2` → `B$2` → `$B2` → `B2`。记住顺序，锁引用不用手敲 `$`。\n\n**跨表引用**：引用其他工作表的单元格，写法是 `表名!地址`，如 `='11月'!C10`。表名含中文或空格时必须加单引号。跨工作簿引用还要带工作簿名，如 `[报表.xlsx]11月!C10`，源文件改名或移动后链接会断，慎用。\n\n**三维引用**：对多个连续工作表的同一位置求和，如 `=SUM(一月:三月!B2)`，表示一月到三月这三张表 B2 的和。要求各表结构完全一致，适合\"每月一张表、结构相同\"的汇总场景。", "steps": ["写相对引用：D2 输入 `=B2*C2`，拖填充柄向下，各行自动递增；这是默认行为，不用加任何符号。", "写绝对引用：提成比例在 E1，C2 输入 `=B2*$E$1`（光标放在 E1 上按一次 F4 变成 $E$1），再拖填充柄，E1 始终不变。", "写混合引用：做 9×9 乘法表，B2 输入 `=$A2*B$1`，向右、向下拖满，行标题与列标题各锁一维。", "跨表引用：在汇总表输入 `=` 后直接点另一张表的单元格回车，Excel 自动写出 `='11月'!C10` 这样的引用，不用手敲表名。", "三维引用：汇总表输入 `=SUM(一月:三月!B2)`，一月到三月三张表 B2 相加；增删中间月份表时范围自动变化。", "检查引用：公式→追踪引用单元格，看箭头指向的格是不是你想要的；箭头指错就是引用锁错了。"], "sections": [{"title": "2. 基础概念", "body": "**相对引用**：`B2` 这样不带 `$` 的引用。公式复制到别处时，引用跟着目标位置同步移动：下移一行变 `B3`，右移一列变 `C2`。它是公式\"一写多用\"的基础。\n\n**绝对引用**：`$B$2`，行列都锁定。公式复制到任何地方都指向 B2 不变。适用场景：引用某个固定参数格（如税率、提成比例、单价），全表共用一个格。\n\n**混合引用**：`$B2`（锁列不锁行）或 `B$2`（锁行不锁列）。乘法表是经典场景：行标题在 A 列、列标题在第 1 行，公式 `=$A2*B$1` 往右拖时 A 列锁定、往下拖时第 1 行锁定，一张乘法表一个公式搞定。\n\n**F4 切换**：编辑公式时光标放在引用上，按 `F4` 循环切换 `B2` → `$B$2` → `B$2` → `$B2` → `B2`。记住顺序，锁引用不用手敲 `$`。\n\n**跨表引用**：引用其他工作表的单元格，写法是 `表名!地址`，如 `='11月'!C10`。表名含中文或空格时必须加单引号。跨工作簿引用还要带工作簿名，如 `[报表.xlsx]11月!C10`，源文件改名或移动后链接会断，慎用。\n\n**三维引用**：对多个连续工作表的同一位置求和，如 `=SUM(一月:三月!B2)`，表示一月到三月这三张表 B2 的和。要求各表结构完全一致，适合\"每月一张表、结构相同\"的汇总场景。"}, {"title": "4. 图文示例", "body": "提成表示例：B2:B6 是销售额 10000、20000、15000、30000、25000，提成比例 5% 写在 E1。C2 写 `=B2*$E$1` 得 500，拖到 C6 得 1000、750、1500、1250，合计 `=SUM(C2:C6)` 得 5000。验算：销售额合计 100000×5%=5000，与提成合计一致。反例：C2 写 `=B2*E1` 再拖，C3 会变成 `=B3*E2`（E2 是空值当 0），提成全变 0——这就是没锁定的后果。\n\n（截图位：待补图）"}], "source": "docs/formulas/02-references.md", "updated": "2026-11-09", "objectives": ["说出相对引用、绝对引用、混合引用的区别，并用 $ 正确锁定行或列", "用 F4 在四种引用状态间快速切换", "写出跨表引用与跨工作簿引用，并理解三维引用的适用场景", "诊断\"复制公式后结果错位\"，定位是引用没锁对"], "formulas": ["=B2*$E$1 → 500（B2=10000，E1=5% 时）", "=SUM(C2:C6) → 5000", "=$A2*B$1 → 6（A2=2，B1=3 时）", "=SUM(一月:三月!B2) → 三张表 B2 之和", "- `=B2*$E$1` → 500：10000×0.05=500；$E$1 绝对引用，复制到 C6 仍指向 E1", "- `=SUM(C2:C6)` → 5000：500+1000+750+1500+1250=5000；与销售额合计 100000×5% 互相核对", "- `=$A2*B$1` → 6：混合引用：$A2 锁列、 B$1 锁行，乘法表一公式通用", "- `=SUM(一月:三月!B2)` → 三张表 B2 之和：三维引用：对一月、二月、三月三张表同一位置求和"], "scenarios": [{"title": "提成比例月中调整", "body": "比例只写在 E1 一个格，全表公式都引用 `$E$1`。月中比例从 5% 调到 6%，只改 E1，全表提成自动重算——这就是绝对引用的价值：参数单点存放。"}, {"title": "12 个月汇总表", "body": "每月一张表、结构相同，汇总表用三维引用 `=SUM(一月:十二月!B2)` 一次加总 12 张表。某月表插到中间，范围自动包含；表名改了要同步改公式。"}], "pitfalls": [{"problem": "复制公式后结果全变 0", "cause": "参数格没锁定，引用跟着跑到了空格", "solution": "参数格用 $E$1 绝对引用；复制后用追踪引用单元格检查箭头"}, {"problem": "F4 按了没反应", "cause": "光标不在引用上，或在输入中文时按的", "solution": "编辑公式时把光标放在引用字母上再按 F4；每按一次变一种状态"}, {"problem": "跨表引用显示 #REF!", "cause": "被引用的表被删或改名了", "solution": "恢复表名或重建引用；删表前用追踪从属单元格检查谁在引用它"}, {"problem": "混合引用锁反了", "cause": "$A2 与 A$2 搞混", "solution": "$ 在谁前面就锁谁：$A2 锁列 A，A$2 锁行 2；乘法表行标题锁列、列标题锁行"}], "exercises": ["B2:B6 是 10000、20000、15000、30000、25000，E1 是 5%，C2 写 =B2*$E$1，C6 的公式与结果各是什么？提成合计是多少？", "乘法表 B2 写 =$A2*B$1（A2=2，B1=3），结果是多少？向右拖一格后公式变成什么？", "汇总表要引用\"11月\"表的 C10，正确的写法是什么？表名什么时候要加单引号？"], "answers": ["C6 公式是 =B6*$E$1，结果 1250（25000×5%）。提成合计 =SUM(C2:C6) → 5000。", "结果 6。向右拖一格变成 =$A2*C$1（列锁定 A 不变，行锁定的第 1 行不变，未锁定的列 B→C）。", "写法 `='11月'!C10`。表名含中文、空格或特殊字符时要加单引号；纯英文数字表名可不加，但加上也不错。"], "versions": "Excel 2016／2019／2021／365"}, {"id": "formulas-03-names", "group": "formulas", "column": "C03", "level2": "C03-L2-3", "title": "名称与定义：定义名称、名称管理器与动态名称", "level": "进阶", "body": "**名称**：给单元格或区域起一个名字，如把 E1 命名为\"提成比例\"，公式写 `=B2*提成比例`，比 `=B2*$E$1` 好读得多。名称是工作簿级的：全工作簿任何一张表都能用同一个名称。\n\n**定义名称**：选中单元格或区域，公式→定义名称，输入名字、确认引用范围。命名规则：不能与单元格地址重名（如 A1、B2），不能含空格（用下划线代替），不能以数字开头。名字里用\"税率\"、\"提成比例\"这类业务词，公式立刻自带文档。\n\n**名称管理器**：公式→名称管理器，列出全部名称：名字、引用位置、范围。改引用、改名字、删名称都在这里；名称引用错了（如指向了被删的表）会在这里显示 `#REF!`，是排查断链的第一站。\n\n**名称框快捷定义**：选中区域后点左上角名称框，直接输入名字回车，即完成定义——比打开对话框更快。输入已定义名称回车，可瞬间跳转到该区域。\n\n**动态名称**：引用范围会自己变长的名称。经典写法是用 OFFSET：`=OFFSET($A$2,0,0,COUNT
