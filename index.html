"tpl": "chart-line", "doc": "charts-02-line-area"}, {"name": "散点图", "use": "两变量关系", "steps": ["X/Y 两列数值", "插入→散点图", "添加趋势线看相关性"], "tpl": "chart-scatter", "doc": "charts-04-scatter-bubble"}, {"name": "雷达图", "use": "多维度评价", "steps": ["维度放第一列", "插入→雷达图", "适合 5-8 个维度"], "tpl": "chart-radar", "doc": "charts-06-new-charts"}, {"name": "甘特图", "use": "项目进度", "steps": ["任务/开始/工期三列", "插入→条形图→堆积", "把「开始」系列设为无填充", "调整纵轴逆序"], "tpl": "chart-gantt", "doc": "charts-06-new-charts"}, {"name": "漏斗图", "use": "转化流程", "steps": ["阶段+人数两列", "插入→漏斗图（2019+）", "老版本用条形图模拟"], "tpl": "chart-funnel", "doc": "charts-06-new-charts"}, {"name": "旭日图", "use": "多层级占比", "steps": ["层级从左到右排", "插入→旭日图（2016+）", "适合 2-3 层"], "tpl": "chart-sunburst", "doc": "charts-06-new-charts"}, {"name": "地图图表", "use": "地域分布", "steps": ["地名要规范（省/国家）", "插入→地图（2019+）", "值用颜色深浅表示"], "tpl": "chart-map", "doc": "charts-06-new-charts"}], "pivot_adv": [{"t": "基础操作", "body": "选中数据→插入→数据透视表。四个区：行、列、值、筛选。值字段默认求和，右键可改计数/平均/最大值。"}, {"t": "分组统计", "body": "日期右键→组合：按年/季度/月分组。数字右键→组合：按区间分组（如成绩段 60-70/70-80）。"}, {"t": "多维分析", "body": "行放「区域」、列放「季度」、值放「销售额」，一眼看交叉汇总。值显示方式→差异/百分比，做同比环比。"}, {"t": "切片器", "body": "插入切片器→选字段，点按钮即筛选，多表联动（报表连接）。比筛选直观 10 倍，汇报必备。"}, {"t": "时间轴", "body": "日期字段专用筛选器，按年/季度/月/日切换，比切片器更适合时间。"}, {"t": "数据模型", "body": "多表关联：把订单表+产品表都添加到数据模型，用字段关联，一张透视表跨表分析。Power Pivot 的地基。"}], "pq_adv": [{"t": "导入 CSV", "body": "数据→获取数据→从文本/CSV。乱码？改编码为 65001（UTF-8）或 936（GBK）。"}, {"t": "导入网页", "body": "数据→自网站→粘贴 URL。网页表格结构变化时需重新检查步骤。"}, {"t": "数据清洗", "body": "删空行、替换值、填充、修剪、分列、更改类型。每一步都记录在右侧「应用的步骤」，可回退。"}, {"t": "合并表", "body": "追加查询=上下堆叠（多月数据合并）；合并查询=左右连接（VLOOKUP 的批量版）。"}, {"t": "拆分列", "body": "按分隔符/字符数拆分。\"2026-10-01\" 按 \"-\" 拆成年/月/日三列。"}, {"t": "自动刷新", "body": "关闭并上载后，源文件更新→右键刷新。还可设置打开文件自动刷新：数据→查询属性。"}], "ppivot": [{"t": "数据模型", "body": "Power Pivot→添加到数据模型。多表不用 VLOOKUP，用关系关联，百万行不卡。"}, {"t": "多表关联", "body": "关系视图拖线连主外键。一对多：产品表（1）→订单表（多）。"}, {"t": "DAX 公式入门", "body": "DAX 长得像 Excel 函数但思维是列式。SUM(表[列])、CALCULATE(表达式, 筛选)、RELATED(取关联表字段)。"}, {"t": "常用 DAX", "body": "总销售额 =SUM(订单[金额])\n当年累计 =CALCULATE([总销售额], DATESYTD(日期表[日期]))\n同比 =DIVIDE([总销售额]-[去年同期], [去年同期])"}, {"t": "KPI 指标", "body": "在数据模型中建度量值：销售额、利润率、完成率。度量值随切片器自动重算，一处定义处处用。"}], "cfmt": [{"t": "颜色标记", "body": "开始→条件格式→突出显示单元格规则：大于/小于/介于/等于，自动上色。"}, {"t": "数据条", "body": "在单元格内画横向条形图，数值大小一目了然。适合业绩对比。"}, {"t": "图标集", "body": "红绿灯/箭头/旗帜，按阈值自动打标。管理驾驶舱常用。"}, {"t": "自定义公式", "body": "新建规则→使用公式。注意 $ 锁定：=$B2>100 整行变色（选中整行时列锁定行不锁定）。"}, {"t": "案例：自动标红逾期", "body": "=AND($E2<TODAY(),$G2<>\"已完成\") → 逾期未完成的整行变红。"}, {"t": "案例：高亮重复", "body": "选中区域→条件格式→突出显示→重复值。或公式 =COUNTIF($A:$A,$A2)>1 自定义颜色。"}], "dval": [{"t": "下拉菜单", "body": "数据→数据验证→序列，来源输入：男,女（英文逗号）。或引用一列区域。"}, {"t": "联动下拉框", "body": "一级菜单选「省份」→二级自动出该省城市。做法：定义名称+INDIRECT($A2)。先做各省名单，再建一级下拉，二级来源 =INDIRECT(A2)。"}, {"t": "日期限制", "body": "数据验证→日期→介于 2026-1-1 到 2026-12-31，只能输今年日期。"}, {"t": "输入规则", "body": "整数/小数/文本长度：手机号设文本长度=11；年龄设整数介于 18-65。出错警告可自定义提示语。"}, {"t": "圈释无效数据", "body": "数据→数据验证→圈释无效数据，已有违规的一眼现形。"}], "case_center": [{"cat": "财务案例", "items": [{"t": "工资表", "d": "应发=基本+绩效+补贴-社保，用 IF 判断个税", "f": "=D2+E2+F2-G2"}, {"t": "预算表", "d": "SUMIFS 按部门+月份汇总，条件格式超预算标红", "f": "=SUMIFS(实际列,部门列,A2,月份列,B2)"}]}, {"cat": "人事案例", "items": [{"t": "考勤管理", "d": "COUNTIF 统计迟到，NETWORKDAYS 算出勤", "f": "=COUNTIF(B2:AF2,\"迟\")"}, {"t": "花名册", "d": "DATEDIF 算工龄，VLOOKUP 关联部门", "f": "=DATEDIF(C2,TODAY(),\"Y\")"}]}, {"cat": "销售案例", "items": [{"t": "销售统计", "d": "RANK 排名，SUMPRODUCT 加权", "f": "=RANK(B2,B:B)"}, {"t": "环比分析", "d": "透视表按月分组，值显示差异百分比", "f": "=(本月-上月)/上月"}]}, {"cat": "仓库案例", "items": [{"t": "库存管理", "d": "SUMIF 分开汇总出入库，IF 预警", "f": "=SUMIF(类型,\"入库\",数量)-SUMIF(类型,\"出库\",数量)"}, {"t": "盘点差异", "d": "实盘-账面，条件格式标差异", "f": "=D2-C2"}]}, {"cat": "采购案例", "items": [{"t": "采购跟踪", "d": "EOMONTH 算账期，逾期标红", "f": "=EOMONTH(下单日期,1)"}, {"t": "比价表", "d": "MIN 取最低价，INDEX+MATCH 反查供应商", "f": "=INDEX(供应商列,MATCH(MIN(价格区),价格区,0))"}]}, {"cat": "物流案例", "items": [{"t": "运费统计", "d": "SUMIFS 按线路+月份汇总", "f": "=SUMIFS(运费列,线路列,A2)"}, {"t": "报关数据分析", "d": "透视表按 HS 编码汇总，TOP10 品名", "f": "数据透视表：行=品名，值=金额求和"}]}], "exam": [{"t": "MOS 认证", "d": "微软官方 Office 认证，分 Associate/Expert/Master 三级，全球通用，外企认可度高。考试为实操题，Excel 侧重函数/图表/透视表。", "tips": ["官网报名，国内有考点", "Expert 含 VBA 和高级数据管理"]}, {"t": "全国计算机等级考试", "d": "教育部考试中心。二级 MS Office 是大学生最热门科目：选择题+Word+Excel+PPT 实操。证书可加综测分、求职有用。", "tips": ["二级考大纲每年微调", "Excel 重点：函数、图表、数据处理"]}, {"t": "企业办公技能考试", "d": "很多大企业校招/内训自设：限时完成数据清洗+报表+PPT。用本站学习路线「中级」水平即可应对。", "tips": ["练速度：快捷键是关键", "透视表+图表是必考"]}], "faq": [{"q": "如何统计重复数据？", "a": "用 COUNTIF：=COUNTIF(A:A,A2)>1 标出重复；或数据→删除重复项直接去重；365 用 =UNIQUE(A:A) 取唯一值。"}, {"q": "如何制作动态下拉框？", "a": "二级联动：先定义各省城市为名称，一级下拉选省份，二级数据验证来源写 =INDIRECT($A2)。"}, {"q": "为什么 VLOOKUP 返回 #N/A？", "a": "四查：①查找值前后有空格没（TRIM）；②首列真有这个值吗；③数字存成文本（格式统一）；④第四参数写 FALSE 了吗。还不行就换 XLOOKUP。"}, {"q": "筛选后求和不对怎么办？", "a": "SUM 会把隐藏行也加进去，改用 =SUBTOTAL(109,区域)，109 表示只对可见单元格求和。"}, {"q": "日期显示成数字怎么办？", "a": "那是日期序列值，选中→Ctrl+1→设为日期格式。反过来文本日期转真日期用 DATEVALUE 或分列。"}, {"q": "如何合并多个工作表？", "a": "结构相同的表：Power Query→追加查询，一键合并几十个表，还能自动刷新。"}, {"q": "公式太长看不懂怎么办？", "a": "用 LET 给中间结果起名：=LET(x,SUM(A:A),y,COUNT(A:A),x/y)。或按 Alt+Enter 在编辑栏换行。"}, {"q": "文件太大打不开？", "a": "先关自动重算（公式→手动）；删多余格式（Ctrl+End 看看用到哪）；另存为 xlsb 二进制格式体积减半。"}, {"q": "如何防止别人改公式？", "a": "全选→取消锁定→只选中公式区→锁定→审阅→保护工作表设密码。只锁公式，数据区可填。"}, {"q": "打印时每页都有标题行？", "a": "页面布局→打印标题→顶端标题行→选 $1:$1。"}, {"q": "下拉数字变成日期？", "a": "如 1-2 被认成 1月2日。先设单元格为文本格式再输，或前面加英文单引号 '1-2。"}, {"q": "VLOOKUP 只能向右找怎么办？", "a": "用 INDEX+MATCH：=INDEX(返回列,MATCH(查找值,查找列,0))，方向随意。或直接 XLOOKUP。"}, {"q": "如何批量提取括号内容？", "a": "Ctrl+E 快速填充最省事；公式法 =MID(A2,FIND(\"(\",A2)+1,FIND(\")\",A2)-FIND(\"(\",A2)-1)。"}, {"q": "条件格式太多卡顿？", "a": "条件格式→管理规则，删掉整列引用的（如 $A:$A），改成实际区域 $A$1:$A$1000。"}, {"q": "共享后公式被改乱？", "a": "保护工作表+只允许填数据区；或存 OneDrive 用版本历史找回。"}, {"q": "如何让序号下拉不中断？", "a": "用 =ROW()-1 公式下拉，删行不断号；或转智能表格，公式自动填充。"}, {"q": "身份证号变成科学计数法怎么办？", "a": "先设文本格式再录入；已变形用 =TEXT(A1,\"0\") 恢复显示。"}, {"q": "VLOOKUP 返回 #N/A 但值明明存在？", "a": "检查多余空格（TRIM 清理）、数字与文本格式不一致，统一后再查。"}, {"q": "如何快速删除重复行？", "a": "数据→删除重复项；365 也可用 =UNIQUE(A:A) 提取唯一值。"}, {"q": "筛选后序号不连续怎么办？", "a": "用 =SUBTOTAL(103,$A$2:A2) 下拉，筛选后序号自动连续。"}, {"q": "公式下拉后结果都一样？", "a": "检查计算选项是否为手动，改回自动；或单元格被设为文本格式。"}, {"q": "如何跨表汇总多个分表？", "a": "用 =SUM(表1:表3!B2) 三维引用；或 Power Query 合并文件夹。"}, {"q": "打印时每页都显示标题行？", "a": "页面布局→打印标题→顶端标题行设为 $1:$1。"}, {"q": "CSV 打开中文乱码？", "a": "用数据→从文本/CSV 导入，编码选 UTF-8 或 936。"}, {"q": "文件太大打开很慢？", "a": "Ctrl+End 看已用区域是否虚大，删多余行列格式后保存。"}, {"q": "如何防止别人改我的公式？", "a": "审阅→保护工作表，锁定含公式单元格后设密码。"}, {"q": "数据透视表日期不能按月分组？", "a": "检查该列是否混入文本，先统一为日期格式再分组。"}, {"q": "图表新增数据不自动更新？", "a": "数据源转智能表格（Ctrl+T），图表会自动扩展。"}, {"q": "如何批量把文本型数字转数值？", "a": "选中列→分列→完成；或空单元格写 1 复制→选择性粘贴→乘。"}, {"q": "Excel 卡死没保存能找回吗？", "a": "文件→信息→管理工作簿→恢复未保存的工作簿；建议开 5 分钟自动恢复。"}], "repair": [{"t": "文件打不开", "body": "①打开 Excel→文件→打开→选中文件→打开按钮下拉→打开并修复；②改后缀 xlsx→zip 解压取 xl/worksheets 下的 xml；③用 WPS 试试，兼容性有时更好。"}, {"t": "文件损坏", "body": "从备份/OneDrive 版本历史恢复；用「打开并修复」→提取数据；新建工作簿用外部引用 =['坏文件.xlsx']Sheet1'!A1 抢救数据。"}, {"t": "文件变成只读", "body": "右键文件→属性→取消只读勾选；文件→另存为换个名字；检查是否被别人打开（共享盘）。"}, {"t": "内容丢失", "body": "文件→信息→管理工作簿→恢复未保存的工作簿；自动恢复位置：文件→选项→保存→看路径。平时开自动恢复 5 分钟。"}, {"t": "公式丢失（变数值）", "body": "可能误做了选择性粘贴为值。用版本历史找回；教训：重要表做公式前先备份一份。"}, {"t": "预防指南", "body": "①开自动保存/自动恢复 ②重要文件每天另存版本号 ③存 OneDrive 有 30 天版本历史 ④大公式表定期另存 xlsb。"}], "roadmap": [{"lv": "新手", "color": "#22c55e", "items": ["认识界面：功能区/编辑栏/工作表", "单元格：输入/选中/填充", "格式：字体/对齐/边框/数字格式", "基础操作：排序/筛选/冻结/打印"]}, {"lv": "初级", "color": "#3b82f6", "items": ["基础函数：SUM/AVERAGE/COUNT/MAX/MIN", "条件函数：IF/SUMIF/COUNTIF", "查找函数：VLOOKUP", "文本日期：LEFT/MID/TODAY/DATEDIF"]}, {"lv": "中级", "color": "#f59e0b", "items": ["图表：选型/制作/美化", "条件格式：标记/数据条/公式", "数据验证：下拉/联动/规则", "数据透视表：汇总/分组/切片器", "高级函数：INDEX+MATCH/SUMPRODUCT"]}, {"lv": "高级", "color": "#ef4444", "items": ["Power Query：清洗/合并/自动刷新", "Power Pivot：数据模型/DAX", "VBA：录制/语法/自动化", "动态数组：FILTER/SORT/XLOOKUP", "综合：仪表盘/多表联动"]}], "resources": [{"cat": "模板", "items": ["21 个模板（本站模板下载区：4 图表模板 + 4 数据文件）", "数据文件：销售数据1000行/人事考勤样本/函数练习题/透视表练习数据（配练习任务）"]}, {"cat": "示例数据集", "items": ["销售数据 1000 行（订单/区域/品类齐全，配 6 个练习任务 → 模板下载区「数据」分类下载）", "人事考勤样本（25 人 9 月考勤，迟到/请假公式+部门汇总 → 模板下载区「数据」分类下载）"]}, {"cat": "VBA 代码库", "items": ["8 个实例代码（本站 VBA 区一键复制）", "33 个关键字手册"]}, {"cat": "练习文件", "items": ["函数练习题（12 道 VLOOKUP/SUMIFS/XLOOKUP 实战，附参考答案 → 模板下载区「数据」分类下载）", "透视表练习数据（500 行明细，配 6 个透视表任务+避坑 → 模板下载区「数据」分类下载）"]}], "tip_cats": [{"cat": "数据录入技巧", "icon": "⌨️", "items": [{"t": "自动填充序号", "how": "首格输入 1、第二格输入 2，选中两格拖填充柄；或用 =ROW()-1 下拉，删行不中断"}, {"t": "自动生成流水号", "how": "用 =\"NO.\"&TEXT(ROW()-1,\"0000\") 下拉，序号自动补零对齐"}, {"t": "快速录入当前日期", "how": "按 Ctrl+; 直接输入今天日期（静态值，不会每天变）"}, {"t": "快速录入当前时间", "how": "按 Ctrl+Shift+; 输入当前时间；日期时间一起按 Ctrl+; 空格 Ctrl+Shift+;"}, {"t": "快速输入重复内容", "how": "输入前几个字后按 Alt+↓，从本列已录入的值里直接选"}, {"t": "下拉选择录入", "how": "数据→数据验证→序列，来源输入 男,女，只能点选不能乱填"}, {"t": "联动下拉菜单", "how": "一级菜单做命名区域，二级数据验证→序列用 =INDIRECT($A2) 引用"}, {"t": "防止重复输入", "how": "数据验证→自定义，公式 =COUNTIF(A:A,A1)=1，重复就报错"}, {"t": "批量导入数据", "how": "数据→获取数据→从文本/CSV，一次把外部数据整份导进来"}]}, {"cat": "数据清洗技巧", "icon": "🧹", "items": [{"t": "一秒删除空行", "how": "选中区域→Ctrl+G 定位→空值→右键删除整行"}, {"t": "删除空列", "how": "选中区域→Ctrl+G 空值→右键删除整列（先备份原表）"}, {"t": "删除重复值", "how": "数据→删除重复项，勾选关键列，一键去重"}, {"t": "合并重复记录", "how": "数据透视表按关键字段分组，对金额求和、对订单计数"}, {"t": "去除隐藏空格", "how": "=TRIM(A1) 去首尾空格；=CLEAN(A1) 去换行等不可见字符"}, {"t": "去除换行符", "how": "查找替换：查找内容处按 Ctrl+J，替换为留空，全部替换"}, {"t": "统一日期格式", "how": "选中列→数据→分列→下一步→日期 YMD，一次把文本日期转正"}, {"t": "统一手机号格式", "how": "先设为文本格式再录入；已变形用 =TEXT(A1,\"0\") 恢复显示"}, {"t": "数字文本互转", "how": "数字转文本用 =TEXT(A1,\"0\")；文本转数字用 =A1*1 或分列→常规"}]}, {"cat": "函数应用技巧", "icon": "∑", "items": [{"t": "VLOOKUP精确匹配", "how": "=VLOOKUP(值,区域,列号,0)，第四参数写 0 才是精确查找"}, {"t": "VLOOKUP反向查询", "how": "右查左改用 =INDEX(B:B,MATCH(值,A:A,0))"}, {"t": "XLOOKUP一步到位", "how": "=XLOOKUP(值,查找列,返回列,\"未找到\")，不用数第几列"}, {"t": "INDEX+MATCH多条件", "how": "=INDEX(返回列,MATCH(1,(条件列1=条件1)*(条件列2=条件2),0))"}, {"t": "模糊匹配查询", "how": "=VLOOKUP(\"*\"&关键词&\"*\",区域,2,0)，通配符前后包夹"}, {"t": "双向查询", "how": "=INDEX(区域,MATCH(行值,首列,0),MATCH(列值,首行,0)) 行列交叉定位"}, {"t": "跨表查询", "how": "=VLOOKUP(A2,INDIRECT(\"'\"&B2&\"'!A:B\"),2,0)，按表名动态切换"}, {"t": "动态查询面板", "how": "数据验证做下拉选关键词，XLOOKUP 引用该单元格，选谁查谁"}, {"t": "多条件统计", "how": "=SUMIFS(求和列,条件列1,条件1,条件列2,条件2)，条件可继续加"}, {"t": "动态汇总区域", "how": "=SUM(OFFSET(首格,0,0,COUNTA(列),1))，新增行自动纳入"}]}, {"cat": "文本处理技巧", "icon": "🔤", "items": [{"t": "提取姓名中的姓", "how": "=LEFT(A2,1)，复姓手动处理或用快速填充"}, {"t": "提取手机号", "how": "固定位置用 =MID(A2,12,11)；不固定用 Ctrl+E 快速填充"}, {"t": "提取邮箱", "how": "用 Ctrl+E 按示例提取；或 =MID(A2,FIND(\"@\",A2)-6,20) 再 TRIM"}, {"t": "分离姓和名", "how": "姓 =LEFT(A2,1)，名 =RIGHT(A2,LEN(A2)-1)"}, {"t": "中英文拆分", "how": "旁边列手写一行英文示例，选中→Ctrl+E，自动按规律拆分"}, {"t": "字符串替换", "how": "=SUBSTITUTE(A2,\"旧\",\"新\")，嵌套可做多重替换"}, {"t": "批量修改内容", "how": "Ctrl+H 查找替换，支持通配符 * ?，可限定范围"}, {"t": "批量添加前缀", "how": "=\"前缀\"&A2；纯显示用自定义格式 \"前缀\"@"}, {"t": "批量添加后缀", "how": "=A2&\"元\"；数字加单位也可用自定义格式 0\"元\""}]}, {"cat": "日期时间技巧", "icon": "📅", "items": [{"t": "计算年龄", "how": "=DATEDIF(出生日期,TODAY(),\"Y\")，周岁一键得出"}, {"t": "计算工龄", "how": "=DATEDIF(入职日,TODAY(),\"Y\")&\"年\"&DATEDIF(入职日,TODAY(),\"YM\")&\"月\""}, {"t": "工作日计算", "how": "=NETWORKDAYS(开始,结束)，自动排除周六日"}, {"t": "节假日排除", "how": "=NETWORKDAYS(开始,结束,节假日区域)，第三参数放假日清单"}, {"t": "倒计时计算", "how": "=目标日期-TODAY()&\"天\"，过期变负数可标红"}, {"t": "取月初日期", "how": "=EOMONTH(日期,-1)+1，上月月末加一天即本月初"}, {"t": "取月末日期", "how": "=EOMONTH(日期,0)，自动处理大小月和闰年"}, {"t": "季度统计", "how": "辅助列 =\"Q\"&INT((MONTH(日期)+2)/3)，再透视表汇总"}, {"t": "周数计算", "how": "=WEEKNUM(日期,2)，第二参数 2 表示周一起始"}]}, {"cat": "格式美化技巧", "icon": "🎨", "items": [{"t": "隔行变色", "how": "条件格式→新建规则→公式 =MOD(ROW(),2)=0，设填充色"}, {"t": "自动高亮整行", "how": "选中区域→条件格式公式 =$A1=\"重点\"，整行自动上色"}, {"t": "数据条", "how": "开始→条件格式→数据条，数值大小一目了然"}, {"t": "图标集", "how": "条件格式→图标集，达标/预警/异常自动打对勾感叹号"}, {"t": "自动标红逾期", "how": "条件格式公式 =A2<TODAY()，过期日期自动变红"}, {"t": "自动标绿达标", "how": "=B2>=目标值 标绿，低于目标再加一条标红"}, {"t": "动态颜色变化", "how": "条件格式+公式绑定数值，数据变颜色自动跟"}, {"t": "重复值高亮", "how": "条件格式→突出显示单元格规则→重复值"}, {"t": "仪表盘美化", "how": "大字号 KPI + 条件格式图标 + 迷你图，注意留白对齐"}]}, {"cat": "图表技巧", "icon": "📈", "items": [{"t": "一键生成图表", "how": "选中数据按 Alt+F1 生成嵌入图表；F11 生成独立图表工作表"}, {"t": "动态图表", "how": "定义名称 =OFFSET(首格,0,0,COUNTA(列),1) 做数据源，新增自动扩展"}, {"t": "手绘甘特图", "how": "条形图：开始日期为起点、工期为长度，逆序类别+调透明度"}, {"t": "漏斗图", "how": "插入→漏斗图（2016 及以上），看各环节转化流失"}, {"t": "KPI达成图", "how": "环形图 + 大数字文本框，目标完成率一目了然"}, {"t": "销售驾驶舱", "how": "切片器 + 数据透视表 + 组合图，点选维度图表联动"}, {"t": "地图图表", "how": "插入→地图（365），按省份/国家数值自动着色"}, {"t": "单元格热力图", "how": "不用图表，条件格式→色阶直接在区域上画热力分布"}]}, {"cat": "打印技巧", "icon": "🖨️", "items": [{"t": "一页打印", "how": "页面布局→宽度/高度设为 1 页，超宽表格自动缩放"}, {"t": "打印标题行", "how": "页面布局→打印标题→顶端标题行设为 $1:$1，每页重复表头"}, {"t": "自动分页调整", "how": "视图→分页预览，拖动蓝色分页线控制每页内容"}, {"t": "打印网格线", "how": "页面设置→工作表→勾选网格线，表格线才能印出来"}, {"t": "打印批注", "how": "页面设置→工作表→批注选“工作表末尾”，批注集中打印"}, {"t": "横向打印", "how": "页面布局→纸张方向→横向，列多的表横过来打"}, {"t": "批量打印多表", "how": "按住 Ctrl 点多个工作表标签→文件→打印，一次全打"}, {"t": "只打印选中区域", "how": "选中区域→页面布局→打印区域→设置打印区域"}]}, {"cat": "快捷键技巧", "icon": "⚡", "items": [{"t": "Ctrl+D 向下填充", "how": "选中区域按 Ctrl+D，把最上一格内容/公式填满下方"}, {"t": "Ctrl+R 向右填充", "how": "选中区域按 Ctrl+R，把最左一格内容填满右侧"}, {"t": "Ctrl+E 快速填充", "how": "手写一个示例后按 Ctrl+E，自动识别规律拆分合并，提取手机号神器"}, {"t": "Alt+= 一键求和", "how": "自动对上方或左侧连续数字求和，月末汇总最快"}, {"t": "F4 重复与锁定", "how": "重复上一步操作；在公式中按 F4 切换 $ 绝对引用"}, {"t": "Ctrl+Shift+L 筛选", "how": "一键开关自动筛选，不用再去点菜单"}, {"t": "Ctrl+方向键跳转", "how": "瞬间跳到数据区域边缘，万行表格秒穿越"}, {"t": "Ctrl+空格选整列", "how": "选中当前整列；Shift+空格选中整行"}, {"t": "Ctrl+` 公式透视", "how": "切换显示公式与计算结果，查错时一眼看穿"}]}, {"cat": "数据透视表技巧", "icon": "🔄", "items": [{"t": "一键创建数据透视表", "how": "选中数据区域任意单元格 → 插入 → 数据透视表 → 确定，3 秒生成汇总。记住：源数据第一行必须是标题行，且不能有合并单元格。"}, {"t": "拖字段三步出报表", "how": "行：销售员；列：月份；值：销售额。拖三个字段，一张交叉统计表就出来了，比写几十个 SUMIFS 快十倍。"}, {"t": "值字段设置", "how": "值区域默认是「求和」，点字段旁小箭头 → 值字段设置，可切换计数/平均值/最大值。同一字段拖两次可同时看求和与占比。"}, {"t": "日期自动分组", "how": "右键日期字段 → 组合 → 按月/季度/年分组，一键把 365 天的明细变成 12 个月汇总。"}, {"t": "切片器秒筛选", "how": "数据透视表分析 → 插入切片器 → 勾选「部门」。点一下按钮报表即时过滤，开会演示神器。"}, {"t": "值显示方式", "how": "右键值字段 → 值显示方式 → 占总和的百分比，直接算出每个销售员的业绩占比，不用再写公式。"}, {"t": "一键刷新", "how": "源数据增删行后，在透视表上右键 → 刷新即可更新。建议把源数据转为「表格」（Ctrl+T），新增行自动纳入。"}, {"t": "更改数据源", "how": "数据多了要换表？数据透视表分析 → 更改数据源，重新框选区域，之前搭好的版式原样保留。"}]}, {"cat": "Power Query技巧", "icon": "🔗", "items": [{"t": "从表格导入 PQ", "how": "选中数据 → 数据 → 自表格/区域，一键进入 Power Query 编辑器。从此告别重复的手工清洗。"}, {"t": "一键删除空行空列", "how": "在 PQ 里选中列 → 右键 → 删除空行；开始 → 删除列 → 删除空列。刷新后新数据自动同样处理。"}, {"t": "分列拆数据", "how": "选中列 → 拆分列 → 按分隔符（如 - 或空格），身份证拆生日、地址拆省市，一步到位。"}, {"t": "合并查询代替 VLOOKUP", "how": "开始 → 合并查询，把两表按关键列连接，比 VLOOKUP 快且不会列错位。"}, {"t": "逆透视整理报表", "how": "选中月份列 → 转换 → 逆透视列，把横表变纵表，透视表最爱这种干净数据。"}, {"t": "替换值批量清洗", "how": "选中列 → 右键 → 替换值，把「男/女」换成「先生/女士」，或把错别字批量修正。"}, {"t": "添加条件列", "how": "添加列 → 条件列，按销售额自动打标签：>=10万为A级，公式写一次、刷新终身受用。"}, {"t": "关闭并上载+刷新", "how": "做完点「关闭并上载」，结果回到 Excel。以后源数据更新，数据 → 全部刷新，一键重跑全流程。"}]}], "solve_cats": [{"cat": "公式问题", "icon": "🧮", "items": [{"t": "公式不计算", "body": "先看公式→计算选项是否为“手动”，改回“自动”；再看单元格是否为文本格式，是则改常规后双击回车。"}, {"t": "显示公式而非结果", "body": "单元格格式为“文本”，或误开了“显示公式”（Ctrl+` 切换）。改为常规格式后双击单元格回车即可。"}, {"t": "结果错误但无报错", "body": "检查引用区域是否因增删行漂移、括号是否配对、VLOOKUP 是否误用近似匹配（第四参数应为 0）。"}, {"t": "自动计算失效", "body": "大文件常被设为手动计算。按 F9 立即重算，或公式→计算选项改回自动。"}, {"t": "循环引用", "body": "公式直接或间接引用了自己。看状态栏提示定位单元格，改写逻辑打破循环。"}, {"t": "公式被锁定改不动", "body": "工作表被保护了。审阅→撤销工作表保护（需要密码），或联系表主。"}, {"t": "下拉填充公式不变", "body": "检查是否为手动计算；或填充的只是值。确认引用方式（相对/绝对）是否符合预期。"}]}, {"cat": "错误代码专区", "icon": "❌", "items": [{"t": "#N/A 查找不到", "body": "VLOOKUP/XLOOKUP 没找到匹配值。检查多余空格（TRIM）、数字与文本格式不一致；用 IFNA 包裹给友好提示。"}, {"t": "#VALUE! 类型错误", "body": "文本参与了数值运算。检查隐藏空格、特殊字符，用 VALUE 转换或清理后再算。"}, {"t": "#REF! 引用失效", "body": "引用的单元格/区域被删除。撤销删除，或把公式中的引用改为有效区域。"}, {"t": "#NAME? 名称错误", "body": "函数名拼错或用了中文括号。检查拼写，括号一律用英文半角。"}, {"t": "#DIV/0! 除数为零", "body": "除数为 0 或空单元格。用 =IF(除数=0,\"-\",分子/除数) 规避。"}, {"t": "#NUM! 数值超范围", "body": "结果太大或迭代不收敛。检查参数数量级，迭代公式调大迭代次数。"}, {"t": "#SPILL! 溢出被挡", "body": "动态数组目标区域有内容挡住。清空溢出区域，或把公式移到空旷处。"}, {"t": "#CALC! 计算异常", "body": "动态数组返回空或逻辑错误。检查筛选条件是否全不满足，调整条件。"}]}, {"cat": "文件问题", "icon": "📁", "items": [{"t": "文件打不开", "body": "打开 Excel→文件→打开→选中文件→点“打开”按钮下拉箭头→“打开并修复”。"}, {"t": "文件损坏", "body": "先用“打开并修复”→“修复”；不行选“提取数据”；还可改后缀为 zip 解压取 xl/worksheets 下 xml 抢救。"}, {"t": "文件恢复", "body": "文件→信息→管理工作簿→恢复未保存的工作簿。建议把自动恢复间隔设为 5 分钟。"}, {"t": "文件变成只读", "body": "右键文件→属性，取消只读勾选；或文件被他人占用，另存一份副本编辑。"}, {"t": "自动关闭/闪退", "body": "运行 excel /safe 进安全模式排查；逐个禁用 COM 加载项，找到肇事者。"}, {"t": "保存失败", "body": "磁盘满、路径过长或云同步冲突。另存到本地短路径，暂停网盘同步再试。"}, {"t": "内容/公式丢失", "body": "可能只保存了值。去自动恢复版本或文件历史版本里找回，别覆盖原文件。"}]}, {"cat": "性能问题", "icon": "🐢", "items": [{"t": "Excel卡顿", "body": "计算选项改手动；删除多余条件格式；避免整列引用 A:A，改精确区域。"}, {"t": "Excel无响应", "body": "大运算时耐心等；真死机用任务管理器结束进程，再用自动恢复版本找回。"}, {"t": "Excel崩溃", "body": "更新 Office 到最新；禁用可疑加载项；控制面板→修复 Office 安装。"}, {"t": "启动慢", "body": "清理 XLSTART 启动文件夹里的多余文件；文件→选项→加载项禁用不用的。"}, {"t": "文件打开慢", "body": "Ctrl+End 看已用区域是否虚大，删除空白行列的格式后保存，体积立减。"}, {"t": "文件保存慢", "body": "图片压缩一下；删掉大量图形对象；老 xls 另存为 xlsx。"}, {"t": "计算速度慢", "body": "少用易失函数 NOW/TODAY/INDIRECT；数组公式改精确区域；能透视表就别堆公式。"}]}, {"cat": "筛选排序问题", "icon": "🔀", "items": [{"t": "筛选不完整", "body": "数据中有空行空列把区域隔断。删除空行后重新开启筛选。"}, {"t": "部分数据无法筛选", "body": "筛选只覆盖了部分区域。选中整表（Ctrl+A）再开筛选。"}, {"t": "排序错乱串行", "body": "只选中单列排序导致错位。务必选“扩展选定区域”再排序。"}, {"t": "日期排序错误", "body": "日期是文本格式。数据→分列→日期 YMD 转正后再排序。"}, {"t": "数字排序错误", "body": "数字存成了文本。选中列→感叹号→转换为数字。"}, {"t": "合并单元格排不了", "body": "先取消合并，用 Ctrl+D 填充内容后再排序。"}]}, {"cat": "打印问题", "icon": "🖨️", "items": [{"t": "打印不全", "body": "页面布局→缩放→调整为 1 页宽；检查打印区域是否框小了。"}, {"t": "打印出空白页", "body": "分页预览里拖蓝线收掉多余分页；删除打印区域外的残留格式。"}, {"t": "打印内容偏移", "body": "页面设置→页边距→勾选水平居中；检查纸张大小是否匹配。"}, {"t": "页码错误", "body": "页眉页脚→自定义页脚插入 &[页码]；检查起始页码设置。"}, {"t": "打印缩放异常", "body": "缩放设为“调整为 1 页”；宽表用横向打印。"}, {"t": "表格线印不出", "body": "页面设置→工作表→勾选“网格线”；或给区域加边框。"}]}, {"cat": "数据导入问题", "icon": "📥", "items": [{"t": "CSV乱码", "body": "别双击打开。用数据→从文本/CSV 导入，文件原始格式选 65001:UTF-8 或 936。"}, {"t": "中文乱码", "body": "导入时选对编码；已乱码的用 Power Query 重新指定编码导入一次。"}, {"t": "日期错乱", "body": "导入向导第三步把该列设为“日期 YMD”；事后也可用分列转换。"}, {"t": "数字变文本", "body": "数据→分列→完成；或 =A1*1 批量转数值。"}, {"t": "列错位", "body": "分隔符选错了。导入时勾选正确的逗号/制表符分隔，预览对齐再加载。"}, {"t": "前导零丢失", "body": "导入前 ics（站内数据 basics）", "updated": "2026-11-09"}, {"id": "enter", "group": "basics", "column": "C01", "level2": "C01-L2-1", "title": "数据录入技巧", "level": "入门", "body": "Enter 下移、Tab 右移、Shift+Enter 上移。选中区域后按 Enter 在区域内循环。Ctrl+Enter 批量填充选中区域。Alt+↓ 调出下拉历史。Ctrl+; 输入今天日期，Ctrl+Shift+; 输入当前时间。", "steps": ["选中 A1:A10，输入内容后按 Ctrl+Enter 批量填充", "按 Ctrl+; 快速输入今天日期", "用 Alt+↓ 在已有列表中快速选择"], "sections": [], "source": "docs/basics（站内数据 basics）", "updated": "2026-11-09"}, {"id": "format", "group": "basics", "column": "C01", "level2": "C01-L2-1", "title": "单元格格式", "level": "入门", "body": "数字格式决定显示方式：常规/数值/货币/百分比/日期。Ctrl+1 打开设置单元格格式对话框。对齐、字体、边框、填充都在「开始」选项卡。格式刷（双击可多次使用）是排版神器。", "steps": ["选中金额列，按 Ctrl+Shift+4 设为货币格式", "选中日期列，Ctrl+1 设为日期格式", "双击格式刷，把标题格式刷到多个地方"], "sections": [], "source": "docs/basics（站内数据 basics）", "updated": "2026-11-09"}, {"id": "sortfilter", "group": "basics", "column": "C01", "level2": "C01-L2-1", "title": "排序与筛选", "level": "入门", "body": "筛选（Ctrl+Shift+L）：按条件只显示想要的行，箭头图标点开设条件。排序：按某列升序/降序，多关键字排序用「自定义排序」。注意：排序前先选中整个数据区域，否则会错乱！", "steps": ["选中表头，按 Ctrl+Shift+L 开启筛选", "点箭头，只勾选「销售部」", "按销售额列降序排列"], "sections": [], "source": "docs/basics（站内数据 basics）", "updated": "2026-11-09"}, {"id": "print", "group": "basics", "column": "C01", "level2": "C01-L2-1", "title": "打印设置", "level": "入门", "body": "页面布局→打印标题（顶端标题行每页重复）→设置打印区域→分页预览拖蓝线。页眉页脚加页码。打印前一定用「打印预览」检查。", "steps": ["页面布局→打印标题，设置顶端标题行", "选中区域→页面布局→打印区域→设置", "视图→分页预览，拖动蓝线调整"], "sections": [], "source": "docs/basics（站内数据 basics）", "updated": "2026-11-09"}, {"id": "pivottable", "group": "advanced", "column": "C08", "level2": "C08-L2-1", "title": "数据透视表", "level": "进阶", "body": "### 2.1 为什么用数据透视表\n\n想象你有一张 5000 行的销售明细：日期、销售员、产品、金额。老板问：“每个销售员每个月的销售额是多少？”\n\n- 不用透视表：写一堆 SUMIFS，还要手动列出所有销售员和月份，容易漏。\n- 用透视表：**拖三下鼠标，3 秒出结果**。源数据增删行后点一下“刷新”即可更新。\n\n核心思想：**把“分组+聚合”这个动作交给 Excel**，你只负责告诉它“按什么分组、对什么求和”。\n\n### 2.2 四个区域详解\n\n| 区域 | 作用 | 典型拖入字段 |\n|------|------|--------------|\n| **行** | 纵向分组维度 | 销售员、产品类别、部门 |\n| **列** | 横向分组维度 | 月份、季度、年份 |\n| **值** | 要聚合计算的数字 | 金额、数量 |\n| **筛选器** | 报表级筛选 | 年份、区域（拖到这里后报表上方出现下拉筛选） |\n\n操作要点：\n- 同一字段可以拖到多个区域（如“日期”同时拖到行和筛选器）。\n- 拖错了直接把字段拖出窗格即可移除。\n- 字段顺序决定层级：行区域里“年份”在上、“月份”在下，就是先按年再按月展开。\n\n### 2.3 值汇总方式\n\n默认对数字字段“求和”，对文本字段“计数”。右键值字段→“值字段设置”可切换：\n\n| 汇总方式 | 含义 | 常用场景 |\n|----------|------|----------|\n| 求和 | 加总 | 销售额、数量 |\n| 计数 | 非空单元格个数 | 订单笔数 |\n| 平均值 | 算术平均 | 客单价、平均分 |\n| 最大值／最小值 | 极值 | 最高分、最低价 |\n| 乘积 | 连乘（少用） | — |\n\n**显示方式**（同一对话框的“值显示方式”选项卡，更实用）：\n- **占总和的百分比**：每个销售员占总销售额的比例。\n- **父行汇总的百分比**：某产品占其所属类别的比例。\n- **差异**：本月 vs 上月的差额（需配合日期分组）。\n- **差异百分比**：环比增长率——做月报的神器。\n\n### 2.4 分组\n\n**日期分组**：右键行区域的日期字段→“组合”：\n- 按月：选“月”，自动按年月分组。\n- 按季度+年：同时勾选“季度”和“年”。\n- 按周：选“日”，天数填 7。\n\n**数字分组**：右键数字字段→“组合”：如把年龄按 10 岁一段分组（起始 20，终止 60，步长 10），快速做年龄段分布。\n\n### 2.5 L2-3 计算字段与计算项\n\n**计算字段**：当现有字段算不出你要的指标时用。是在**汇总层面**计算的，不是逐行：公式里的字段先各自汇总，再代入公式。\n\n**计算项**：在某个字段内部新增一个“虚拟项”，由该字段已有的两个（或多个）项组合而成（如把“手机”和“电脑”合并成一个“数码产品”项）。\n\n**示例 1：毛利率计算字段**\n\n源数据有“销售额”和“成本”，想算“毛利率”。“数据透视表分析”→“字段、项目和集”→“计算字段”：\n- 名称：`毛利率`\n- 公式：`= (销售额 - 成本) / 销售额`\n\n验算用 3 行小表：\n\n| 产品 | 销售额 | 成本 | 毛利率（逐行算） |\n|---|---|---|---|\n| A | 10000 | 6000 | (10000-6000)/10000 = 40% |\n| B | 20000 | 15000 | (20000-15000)/20000 = 25% |\n| C | 5000 | 2000 | (5000-2000)/5000 = 60% |\n\n注意：透视表里的毛利率是**汇总层面**算的：(35000-23000)/35000 = 34.29%，而不是三行毛利率的平均值 41.67%（(40%+25%+60%)/3）。汇总层面算的才是整体真实毛利率，这正是计算字段的正确用法。计算字段不能引用透视表里的“计数”等聚合结果，只能引用源字段。\n\n**示例 2：占比值显示方式**\n\n不用新建字段，用值显示方式直接出占比。做法：值字段放“金额”（求和），再把同一个字段拖进值区域第二次，右键→“值字段设置”→“值显示方式”→“占总和的百分比”。\n\n用练习数据文件（500 行销售明细，总金额 20957073）验算，5 个产品类别的占比：\n\n| 产品类别 | 金额 | 占总和的百分比 |\n|---|---|---|\n| 电脑 | 8755100 | 41.78% |\n| 手机 | 4656899 | 22.22% |\n| 家电 | 4118100 | 19.65% |\n| 办公 | 2455668 | 11.72% |\n| 配件 | 971306 | 4.63% |\n\n验算：8755100 / 20957073 = 41.78%；4656899 / 20957073 = 22.22%；4118100 / 20957073 = 19.65%；2455668 / 20957073 = 11.72%；971306 / 20957073 = 4.63%。五项合计 100.00%，与总金额 20957073 一致。\n\n**示例 3：计算项——把两个类别合并成一组**\n\n想在报表里单列“数码产品”= 手机 + 电脑，不改源数据：行区域选中“产品类别”字段，“数据透视表分析”→“字段、项目和集”→“计算项”，名称填“数码产品”，公式填 `= 手机 + 电脑`。\n\n验算（练习数据文件）：手机 4656899 + 电脑 8755100 = 13411999；13411999 / 20957073 = 64.00%。也就是说数码产品合计 13411999 元，占总销售额的 64.00%。计算项是字段内的虚拟项，只影响本张透视表，源数据不动；想永久合并类别，改源数据加一列“大类”更稳妥。\n\n### 2.6 L2-4 切片器与日程表\n\n**切片器**：可视化筛选按钮。“数据透视表分析”→“插入切片器”→勾选字段（如“产品类别”）。生成一排可点击的按钮，点选即筛选，比下拉框直观，适合做仪表盘。\n\n**日程表（时间线）**：专门用于日期字段的筛选器。“数据透视表分析”→“插入日程表”→勾选日期字段，拖动滑块筛选时间段；可按年／季度／月／日切换粒度。比切片器更适合时间筛选。\n\n**多表联动**：一个切片器可以同时控制**多个**透视表：右键切片器→“报表连接”，勾选其他透视表——做联动仪表盘的核心技巧。联动前提是多张透视表基于同一数据源（或同一数据模型）。\n\n**切片器与日程表的区别**：切片器用于任意字段（类别、销售员、区域）；日程表只用于日期字段，带时间滑块。月报仪表盘两者常一起用：切片器选区域，日程表拖月份。\n\n### 2.7 L2-5 数据透视图\n\n数据透视图是与透视表联动的图表：透视表一筛选，图跟着变；图上点选系列，也能反向筛选透视表。\n\n- **创建**：点透视表内任一格，“数据透视表分析”→“数据透视图”，选图表类型（常用簇状柱形图、折线图）。也可以在建透视表时直接勾选“添加数据透视图”，表和图一次生成。\n- **与透视表联动**：图和表共用同一字段窗格：行／列字段决定图的分类轴与图例，值字段决定图的数值。改字段布局，图同步重画。\n- **适用场景**：月度趋势用折线图（行=月份，值=金额求和）；各区域对比用簇状柱形图（行=区域，值=金额求和）；类别占比用饼图（行=产品类别，值=金额求和，再把值显示方式改成“占总和的百分比”）。\n- **注意**：透视图不能像普通图表那样自由改数据源或删系列，改动要回透视表的字段窗格做；想做完全自定义的图，先把透视表结果复制为值，再按普通图表做法画。", "steps": ["创建：点击源数据区域任意单元格（确保数据是规范的二维表：第一行是标题行，无合并单元格、无空行空列）。“插入”→“数据透视表”。选择放置位置：建议选“新工作表”，报表和源数据分开更清爽。", "布局：右侧“数据透视表字段”窗格，把分组字段拖到行／列，把数字字段拖到值，把报表级筛选字段拖到筛选器。", "改汇总方式：右键值字段→“值字段设置”，切换求和／计数／平均值；再到“值显示方式”选项卡，选“占总和的百分比”或“差异百分比”。", "分组：右键行区域的日期字段→“组合”，按月／季度／年分组；数字字段右键→“组合”，按区间分组。", "建计算字段：点透视表，“数据透视表分析”→“字段、项目和集”→“计算字段”，填名称与公式（如 `= (销售额 - 成本) / 销售额`），确定后字段出现在值区域。", "建计算项：行区域选中某字段，“数据透视表分析”→“字段、项目和集”→“计算项”，填名称与公式（如 `= 手机 + 电脑`），确定。", "插切片器：点透视表，“数据透视表分析”→“插入切片器”，勾选字段，确定；想联动多表时右键切片器→“报表连接”，勾选其他透视表。", "插日程表：点透视表，“数据透视表分析”→“插入日程表”，勾选日期字段，拖滑块筛选时间段。", "建透视图：点透视表内任一格，“数据透视表分析”→“数据透视图”，选类型，确定；改字段布局时图同步更新。", "刷新：源数据增删行后，点透视表→右键→“刷新”；建议先把源数据转成“表格”（Ctrl+T），新增行自动纳入数据源。"], "sections": [{"title": "2. 基础概念", "body": "### 2.1 为什么用数据透视表\n\n想象你有一张 5000 行的销售明细：日期、销售员、产品、金额。老板问：“每个销售员每个月的销售额是多少？”\n\n- 不用透视表：写一堆 SUMIFS，还要手动列出所有销售员和月份，容易漏。\n- 用透视表：**拖三下鼠标，3 秒出结果**。源数据增删行后点一下“刷新”即可更新。\n\n核心思想：**把“分组+聚合”这个动作交给 Excel**，你只负责告诉它“按什么分组、对什么求和”。\n\n### 2.2 四个区域详解\n\n| 区域 | 作用 | 典型拖入字段 |\n|------|------|--------------|\n| **行** | 纵向分组维度 | 销售员、产品类别、部门 |\n| **列** | 横向分组维度 | 月份、季度、年份 |\n| **值** | 要聚合计算的数字 | 金额、数量 |\n| **筛选器** | 报表级筛选 | 年份、区域（拖到这里后报表上方出现下拉筛选） |\n\n操作要点：\n- 同一字段可以拖到多个区域（如“日期”同时拖到行和筛选器）。\n- 拖错了直接把字段拖出窗格即可移除。\n- 字段顺序决定层级：行区域里“年份”在上、“月份”在下，就是先按年再按月展开。\n\n### 2.3 值汇总方式\n\n默认对数字字段“求和”，对文本字段“计数”。右键值字段→“值字段设置”可切换：\n\n| 汇总方式 | 含义 | 常用场景 |\n|----------|------|----------|\n| 求和 | 加总 | 销售额、数量 |\n| 计数 | 非空单元格个数 | 订单笔数 |\n| 平均值 | 算术平均 | 客单价、平均分 |\n| 最大值／最小值 | 极值 | 最高分、最低价 |\n| 乘积 | 连乘（少用） | — |\n\n**显示方式**（同一对话框的“值显示方式”选项卡，更实用）：\n- **占总和的百分比**：每个销售员占总销售额的比例。\n- **父行汇总的百分比**：某产品占其所属类别的比例。\n- **差异**：本月 vs 上月的差额（需配合日期分组）。\n- **差异百分比**：环比增长率——做月报的神器。\n\n### 2.4 分组\n\n**日期分组**：右键行区域的日期字段→“组合”：\n- 按月：选“月”，自动按年月分组。\n- 按季度+年：同时勾选“季度”和“年”。\n- 按周：选“日”，天数填 7。\n\n**数字分组**：右键数字字段→“组合”：如把年龄按 10 岁一段分组（起始 20，终止 60，步长 10），快速做年龄段分布。\n\n### 2.5 L2-3 计算字段与计算项\n\n**计算字段**：当现有字段算不出你要的指标时用。是在**汇总层面**计算的，不是逐行：公式里的字段先各自汇总，再代入公式。\n\n**计算项**：在某个字段内部新增一个“虚拟项”，由该字段已有的两个（或多个）项组合而成（如把“手机”和“电脑”合并成一个“数码产品”项）。\n\n**示例 1：毛利率计算字段**\n\n源数据有“销售额”和“成本”，想算“毛利率”。“数据透视表分析”→“字段、项目和集”→“计算字段”：\n- 名称：`毛利率`\n- 公式：`= (销售额 - 成本) / 销售额`\n\n验算用 3 行小表：\n\n| 产品 | 销售额 | 成本 | 毛利率（逐行算） |\n|---|---|---|---|\n| A | 10000 | 6000 | (10000-6000)/10000 = 40% |\n| B | 20000 | 15000 | (20000-15000)/20000 = 25% |\n| C | 5000 | 2000 | (5000-2000)/5000 = 60% |\n\n注意：透视表里的毛利率是**汇总层面**算的：(35000-23000)/35000 = 34.29%，而不是三行毛利率的平均值 41.67%（(40%+25%+60%)/3）。汇总层面算的才是整体真实毛利率，这正是计算字段的正确用法。计算字段不能引用透视表里的“计数”等聚合结果，只能引用源字段。\n\n**示例 2：占比值显示方式**\n\n不用新建字段，用值显示方式直接出占比。做法：值字段放“金额”（求和），再把同一个字段拖进值区域第二次，右键→“值字段设置”→“值显示方式”→“占总和的百分比”。\n\n用练习数据文件（500 行销售明细，总金额 20957073）验算，5 个产品类别的占比：\n\n| 产品类别 | 金额 | 占总和的百分比 |\n|---|---|---|\n| 电脑 | 8755100 | 41.78% |\n| 手机 | 4656899 | 22.22% |\n| 家电 | 4118100 | 19.65% |\n| 办公 | 2455668 | 11.72% |\n| 配件 | 971306 | 4.63% |\n\n验算：8755100 / 20957073 = 41.78%；4656899 / 20957073 = 22.22%；4118100 / 20957073 = 19.65%；2455668 / 20957073 = 11.72%；971306 / 20957073 = 4.63%。五项合计 100.00%，与总金额 20957073 一致。\n\n**示例 3：计算项——把两个类别合并成一组**\n\n想在报表里单列“数码产品”= 手机 + 电脑，不改源数据：行区域选中“产品类别”字段，“数据透视表分析”→“字段、项目和集”→“计算项”，名称填“数码产品”，公式填 `= 手机 + 电脑`。\n\n验算（练习数据文件）：手机 4656899 + 电脑 8755100 = 13411999；13411999 / 20957073 = 64.00%。也就是说数码产品合计 13411999 元，占总销售额的 64.00%。计算项是字段内的虚拟项，只影响本张透视表，源数据不动；想永久合并类别，改源数据加一列“大类”更稳妥。\n\n### 2.6 L2-4 切片器与日程表\n\n**切片器**：可视化筛选按钮。“数据透视表分析”→“插入切片器”→勾选字段（如“产品类别”）。生成一排可点击的按钮，点选即筛选，比下拉框直观，适合做仪表盘。\n\n**日程表（时间线）**：专门用于日期字段的筛选器。“数据透视表分析”→“插入日程表”→勾选日期字段，拖动滑块筛选时间段；可按年／季度／月／日切换粒度。比切片器更适合时间筛选。\n\n**多表联动**：一个切片器可以同时控制**多个**透视表：右键切片器→“报表连接”，勾选其他透视表——做联动仪表盘的核心技巧。联动前提是多张透视表基于同一数据源（或同一数据模型）。\n\n**切片器与日程表的区别**：切片器用于任意字段（类别、销售员、区域）；日程表只用于日期字段，带时间滑块。月报仪表盘两者常一起用：切片器选区域，日程表拖月份。\n\n### 2.7 L2-5 数据透视图\n\n数据透视图是与透视表联动的图表：透视表一筛选，图跟着变；图上点选系列，也能反向筛选透视表。\n\n- **创建**：点透视表内任一格，“数据透视表分析”→“数据透视图”，选图表类型（常用簇状柱形图、折线图）。也可以在建透视表时直接勾选“添加数据透视图”，表和图一次生成。\n- **与透视表联动**：图和表共用同一字段窗格：行／列字段决定图的分类轴与图例，值字段决定图的数值。改字段布局，图同步重画。\n- **适用场景**：月度趋势用折线图（行=月份，值=金额求和）；各区域对比用簇状柱形图（行=区域，值=金额求和）；类别占比用饼图（行=产品类别，值=金额求和，再把值显示方式改成“占总和的百分比”）。\n- **注意**：透视图不能像普通图表那样自由改数据源或删系列，改动要回透视表的字段窗格做；想做完全自定义的图，先把透视表结果复制为值，再按普通图表做法画。"}, {"title": "4. 图文示例", "body": "5 行销售明细：张三／手机／1000、张三／电脑／2000、李四／手机／1500、李四／电脑／500、王五／手机／800。合计 5800。\n\n建透视表：行→销售员，值→金额（求和）。结果：张三 3000（1000+2000）、李四 2000（1500+500）、王五 800，总计 5800，与明细合计一致。再把“产品”拖到列，结果变成交叉表：手机列张三 1000、李四 1500、王五 800，电脑列张三 2000、李四 500。\n\n（截图位：待补图）"}], "source": "docs/pivottable/01-pivottable.md", "updated": "2026-11-10", "file": "数据-透视表练习数据.xlsx", "objectives": ["创建数据透视表并拖字段完成分组求和", "设置值字段的汇总方式（求和／计数／平均值）与值显示方式（占比／差异百分比）", "用计算字段算毛利率、用计算项合并类别，并说出汇总层面计算与逐行计算的区别", "用切片器与日程表筛选透视表，并让一个切片器联动多张透视表", "创建数据透视图并与透视表联动", "对照练习数据文件完成 6 个透视表实战任务，并用重算核对每个数字"], "formulas": ["### 5.1 GETPIVOTDATA 函数", "当你在透视表外引用某个汇总值时，Excel 会自动生成 GETPIVOTDATA 公式：", "=GETPIVOTDATA(\"金额\", $A$3, \"销售员\", \"张三\", \"月份\", \"2026-01\")", "意思是：从以 A3 为左上角的透视表中，取出“销售员=张三、月份=2026-01”的金额汇总。", "- 优点：条件变了（如下拉选了“李四”），引用自动跟着变，不会错位。", "- 缺点：公式冗长。想关闭自动生成：点击透视表→“数据透视表分析”→取消“生成 GetPivotData”。", "### 5.2 计算字段公式", "毛利率 = (销售额 - 成本) / 销售额 → 汇总层面：(35000-23000)/35000 = 34.29%", "占比 = 金额 / 总金额 → 电脑 8755100 / 20957073 = 41.78%", "- 毛利率计算字段的公式写在“计算字段”对话框里，不写进单元格；结果 34.29% 是先汇总再相除，不等于逐行毛利率的平均值 41.67%。", "- 占比一般不用计算字段，用值显示方式“占总和的百分比”一步到位，结果与手工相除一致（电脑 41.78%）。"], "scenarios": [{"title": "以下 6 个任务以练习数据文件“使用说明”工作表的 6 个任务为准。数据文件：`数据-透视表练习数据.xlsx`，销售明细 500 行（日期／区域／销售员／产品类别／产品名称／数量／单价／金额）。注意两点：金额列是公式 `=数量*单价`，Excel 打开后自动算出；日期列存的是文本型日期（形如 2026-04-27），做任务 5 的日期组合前，先用“数据”→“分列”把日期列转成真正的日期，否则“组合”按钮不可用。以下每个答案都用 Python 对 xlsx 数据独立重算过。", "body": ""}, {"title": "任务 1（基础）：各区域总额", "body": "做法：行=区域，值=金额（求和）。\n\n| 区域 | 金额 |\n|---|---|\n| 华南 | 5452113 |\n| 华东 | 5283360 |\n| 西南 | 3549711 |\n| 华北 | 3378124 |\n| 华中 | 3293765 |\n| **总计** | **20957073** |\n\n核对：5452113+5283360+3549711+3378124+3293765 = 20957073。华南最高，华中最低。"}, {"title": "任务 2（行列）：各品类在各区域的表现", "body": "做法：行=产品类别，列=区域，值=金额（求和）。\n\n| 产品类别 | 华东 | 华中 | 华北 | 华南 | 西南 | 合计 |\n|---|---|---|---|---|---|---|\n| 办公 | 666163 | 399241 | 460026 | 425274 | 504964 | 2455668 |\n| 家电 | 974400 | 944400 | 799900 | 695200 | 704200 | 4118100 |\n| 手机 | 1203983 | 567907 | 623431 | 1057301 | 1204277 | 4656899 |\n| 电脑 | 2137700 | 1276400 | 1398500 | 3029400 | 913100 | 8755100 |\n| 配件 | 301114 | 105817 | 96267 | 244938 | 223170 | 971306 |\n| **合计** | **5283360** | **3293765** | **3378124** | **5452113** | **3549711** | **20957073** |\n\n核对：每行合计与每列合计交叉相加都等于 20957073。单格最高是“电脑 × 华南”3029400；电脑在 4 个区域都是第一，只有西南的第一是手机（1204277）。"}, {"title": "任务 3（排序筛选）：谁排第一", "body": "做法：在任务 1 的透视表里对金额列降序。\n\n- 按区域：第一是华南 5452113，第二是华东 5283360。\n- 按产品类别：第一是电脑 8755100，第二是手机 4656899。\n- 按区域×品类单格：第一是“电脑 × 华南”3029400。"}, {"title": "任务 4（切片器）：看个人业绩", "body": "做法：插入切片器→勾选“销售员”，点名字即时筛选。\n\n| 销售员 | 金额 | 订单笔数 |\n|---|---|---|\n| 王芳 | 4214138 | 89 |\n| 周敏 | 3204070 | 64 |\n| 刘洋 | 2814799 | 62 |\n| 陈静 | 2412703 | 65 |\n| 黄伟 | 2318303 | 53 |\n| 李明 | 2181886 | 54 |\n| 赵强 | 2067664 | 58 |\n| 吴磊 | 1743510 | 55 |\n| **总计** | **20957073** | **500** |\n\n核对：8 人金额合计 20957073，笔数合计 500。个人第一是王芳 4214138（占 20.11%）；点切片器上的“王芳”，透视表只显示她的 89 笔。"}, {"title": "任务 5（日期组合）：月度趋势与季度汇总", "body": "做法：先把文本型日期列用分列转成真日期；右键日期字段→“组合”→按月；再试按季度。\n\n月度趋势：\n\n| 月份 | 金额 |\n|---|---|\n| 2026-01 | 3145764 |\n| 2026-02 | 2251675 |\n| 2026-03 | 2595681 |\n| 2026-04 | 1736654 |\n| 2026-05 | 2438304 |\n| 2026-06 | 2639209 |\n| 2026-07 | 1634673 |\n| 2026-08 | 2256896 |\n| 2026-09 | 2258217 |\n| **总计** | **20957073** |\n\n按季度：2026-Q1 7993120（3145764+2251675+2595681）、2026-Q2 6814167（1736654+2438304+2639209）、2026-Q3 6149786（1634673+2256896+2258217）。最高月是 1 月 3145764，最低月是 7 月 1634673；季度逐季下降。"}, {"title": "任务 6（值显示方式）：占比", "body": "做法：金额字段→值字段设置→显示方式→“占总和的百分比”。\n\n| 区域 | 金额 | 占总和的百分比 |\n|---|---|---|\n| 华南 | 5452113 | 26.02% |\n| 华东 | 5283360 | 25.21% |\n| 西南 | 3549711 | 16.94% |\n| 华北 | 3378124 | 16.12% |\n| 华中 | 3293765 | 15.72% |\n\n验算：5452113 / 20957073 = 26.02%；5283360 / 20957073 = 25.21%；3549711 / 20957073 = 16.94%；3378124 / 20957073 = 16.12%；3293765 / 20957073 = 15.72%。五项合计 100.01%（四舍五入尾差，精确值合计 100.00%）。"}, {"title": "实战案例补充", "body": "**案例 1：销售员月度业绩表**\n\n源数据：日期、销售员、金额。做法：行→销售员，列→日期（组合为“月”），值→金额（求和）。3 秒得到交叉表，行是人、列是月。\n\n**案例 2：产品类别占比**\n\n值字段放两次：一次“求和”，一次“求和”但值显示方式选“占总和的百分比”。一列看绝对值，一列看占比（见 2.5 示例 2）。\n\n**案例 3：环比增长率**\n\n行→日期（组合为“月”），值→金额，值显示方式选“差异百分比”，基本字段选“日期”，基本项选“（上一个）”。直接得到每月环比。\n\n**案例 4：Top 10 客户**\n\n行→客户名称，值→金额（求和）。右键行标签→“筛选”→“前 10 个”，按金额汇总取前 10。\n\n**案例 5：考勤异常统计**\n\n源数据：姓名、日期、状态（正常／迟到／缺勤）。行→姓名，列→状态，值→状态（计数）。一眼看出谁迟到最多。再加切片器按部门筛选。"}], "pitfalls": [{"problem": "刷新后格式丢失", "cause": "默认勾选了“更新时自动调整列宽”", "solution": "右键透视表→“数据透视表选项”→取消勾选“更新时自动调整列宽”"}, {"problem": "新增数据不进来", "cause": "数据源范围没包含新行", "solution": "把源数据转成“表格”（Ctrl+T）再建透视表，新增行自动纳入；或点透视表→“更改数据源”扩大范围"}, {"problem": "日期无法组合", "cause": "日期列里混入了文本（如“待定”），或整列是文本型日期", "solution": "先清洗成纯日期：文本型日期用“数据”→“分列”转成日期格式，再组合"}, {"problem": "计数不对", "cause": "值字段默认对文本“计数”、对数字“求和”", "solution": "先确认汇总方式：右键值字段→“值字段设置”，改成想要的求和／计数／平均值"}, {"problem": "计算字段结果和逐行算的不一样", "cause": "计算字段是在汇总层面算的，先汇总再代入公式", "solution": "这是正常现象：整体毛利率 34.29% 不等于逐行毛利率的平均值 41.67%，以汇总结果为准"}, {"problem": "切片器不能联动另一张透视表", "cause": "两张透视表数据源不同，“报表连接”里不出现对方", "solution": "联动要求同一数据源（或同一数据模型）；基于同一张源表重建两张透视表再联动"}, {"problem": "透视图改不了系列", "cause": "透视图的系列由透视表字段决定，不能直接改", "solution": "回透视表的字段窗格改行／列／值字段，图同步重画；想完全自定义，先把透视结果复制为值再画普通图"}], "exercises": ["把“销售员”拖到行、“金额”拖到值，默认汇总方式是什么？想改成计数怎么改？", "透视表不显示新追加的数据，原因与解决办法是什么？", "切片器是干什么用的？", "3 行小表：A 产品销售额 10000、成本 6000；B 产品销售额 20000、成本 15000；C 产品销售额 5000、成本 2000。用计算字段算整体毛利率是多少？为什么不是 40%、25%、60% 的平均值？", "练习数据里电脑类金额 8755100、总金额 20957073，用值显示方式“占总和的百分比”会显示多少？写出算式。", "一个切片器想同时控制两张透视表，怎么做？有什么前提条件？"], "answers": ["默认对数值求和。点值字段→值字段设置→改成“计数”。", "数据源范围没包含新行。点透视表→更改数据源扩大范围，或把源数据做成超级表后刷新。", "可视化筛选器：点切片器上的项，透视表即时筛选；多个透视表可共用一个切片器联动。", "整体毛利率 34.29%。计算字段先汇总再算：(35000-23000)/35000 = 34.29%；40%、25%、60% 的平均值 41.67% 是逐行毛利率的平均，不是整体毛利率。", "显示 41.78%。算式：8755100 / 20957073 = 41.78%。", "右键切片器→“报表连接”，勾选另一张透视表。前提是两张透视表基于同一数据源（或同一数据模型）。"], "versions": "Excel 2016／2019／2021／365（切片器／时间线需 2013+）"}, {"id": "array-formulas", "group": "formulas", "column": "C03", "level2": "C03-L2-4", "title": "数组公式", "level": "进阶", "body": "", "steps": [], "sections": [{"title": "1. 先理解\"数组\"是什么", "body": "数组就是\"一串值\"。`{1,2,3}` 是横向数组，`{1;2;3}` 是纵向数组（分号换行）。Excel 公式本来就是按数组思维设计的：\n[代码示例]\n这行公式的含义是\"把 A1、A2、A3 每个都乘以 2\"，得到 `{A1*2, A2*2, A3*2}`。普通公式只显示第一个结果，数组公式则能把全部结果\"摊开\"显示。"}, {"title": "2. 传统数组公式（Ctrl+Shift+Enter）", "body": "在旧版本 Excel 里，想让公式返回多个结果：\n1. 先选中**多个**单元格（结果要占几格就选几格）。\n2. 输入公式，如 `=A1:A3*2`。\n3. 按 **Ctrl+Shift+Enter**（不是只按 Enter）。\n公式两端会自动加上花括号 `{=A1:A3*2}`，表示这是数组公式。**花括号是 Excel 自己加的，手工输入无效。**\n经典用途——多条件计数（COUNTIFS 出现之前的写法，现在仍有人用）：\n[代码示例]\n原理：`(A2:A100=\"销售部\")` 得到一串 TRUE/FALSE，`(B2:B100>5000)` 得到另一串，两串相乘（TRUE=1、FALSE=0），只有两个条件都成立的位置是 1，SUM 加总即为同时满足的人数。"}, {"title": "3. 动态数组：新时代的写法", "body": "Microsoft 365 引入动态数组后，**只按 Enter**，结果自动\"溢出\"到相邻单元格。不再需要三键，也不再需要预选区域。\n### FILTER：按条件筛选\n[代码示例]\n返回 B 列等于\"销售部\"的所有行（A:C 三列）。做\"部门人员清单\"一公式搞定，源数据增减行自动更新。\n加\"无结果\"提示：\n[代码示例]\n### SORT：排序\n[代码示例]"}, {"title": "4. #溢出! 错误处理", "body": "当动态数组的结果没地方\"摊开\"时，报 `#溢出!`。常见原因和解法：\n`#` 引用是动态数组时代的重要符号：公式结果变长变短，`A2#` 自动跟着变，SUM 永远求和的是最新结果。"}, {"title": "5. 实战案例", "body": "### 案例 1：多条件求和（替代 SUMIFS 的数组思路）\n统计\"销售部\"且\"金额>5000\"的总额：\n[代码示例]\n普通 Enter 即可（365 会自动按数组算）。\n### 案例 2：动态部门筛选器\n[代码示例]\nF1 做下拉选部门，右侧自动列出该部门所有人——简易查询系统。\n### 案例 3：自动去重+计数"}, {"title": "6. 新旧对照速查", "body": ""}], "source": "docs/formulas/04-array-formulas.md", "updated": "2026-11-09", "file": "数据-函数练习题.xlsx", "objectives": ["理解数组的概念与传统数组公式的三键输入", "用 FILTER、SORT、UNIQUE 实现动态数组筛选排序去重", "用 SEQUENCE、RANDARRAY 生成序号与随机数组，并处理 #SPILL! 错误"], "formulas": [], "scenarios": [], "pitfalls": [], "exercises": ["=SEQUENCE(5) 会返回什么？", "公式返回 #SPILL! 最常见的原因是什么？", "FILTER 与高级筛选有什么区别？"], "answers": ["返回 1、2、3、4、5 纵向溢出到 5 格；SEQUENCE(n) 生成 1 到 n 的序列。", "溢出区域被占用：目标区域已有内容挡住结果。清空溢出区域即可。", "FILTER 是公式，结果随源数据自动更新；高级筛选是手动操作，结果静态。FILTER 需 2021／365。"], "versions": ""}, {"id": "powerquery", "group": "advanced", "column": "C09", "level2": "C09-L2-1", "title": "Power Query", "level": "进阶", "body": "### 2.1 Power Query 是什么\n\n它是 Excel 里的一个**数据加工流水线**：你把 (获取→清洗→整理) 的每一步操作点一遍，Power Query 会把步骤记下来。下个月拿到新的源文件，点一下 (刷新)，所有步骤自动重跑一遍。\n\n和公式的区别：\n\n- 公式是 (算出一个结果)，Power Query 是 (产出一张干净的表)。\n- 公式适合行内计算；Power Query 适合**结构性整理**：拆分列、转置、合并文件、逆透视——这些用公式写会很痛苦。\n\n核心观念：**你点的每一步都会变成一行 M 代码**，记录在右侧 (应用的步骤) 里。可以回头修改、删除、调整顺序。\n\n### 2.2 三个基本概念：查询、步骤、加载\n\n| 概念 | 含义 | 类比 |\n|---|---|---|\n| 查询 (Query) | 一段取数加清洗的完整定义，从来源到输出结果 | 一条做菜的菜谱 |\n| 步骤 (Step) | 查询里的一次操作，如提升标题、拆分列、筛选行 | 菜谱里的一步 |\n| 加载 (Load) | 把查询结果放进哪里：工作表中的表、仅创建连接、数据模型 | 菜做好端上哪张桌子 |\n\n一个查询可以只加载为 (仅创建连接)，供其他查询引用，不占工作表位置；也可以加载到工作表，成为一张真正的 Excel 表格，后面再接透视表。\n\n### 2.3 查询编辑器里有什么\n\n打开 (数据 → 获取数据 → 启动 Power Query 编辑器)，左侧是查询列表，中间是数据预览，右侧是 (应用的步骤)，顶部是公式栏（显示当前步骤的 M 代码）。左上角 (文件) 菜单里可以改查询的加载方式；(主页 → 关闭并上载) 把结果送回 Excel。\n\n### 2.4 与公式、透视表、Power Pivot 的分工\n\n| 任务 | 首选工具 | 原因 |\n|---|---|---|\n| 行内计算（单价乘数量） | 公式 | 即时、灵活 |\n| 结构性清洗（拆分、合并文件、逆透视） | Power Query | 步骤可重跑、可刷新 |\n| 分组汇总出报表 | 数据透视表 | 拖拽即得，见 C08 |\n| 百万行建模、多表关联度量值 | Power Pivot 与 DAX | 数据模型与度量值，见 C10 |\n\n经验法则：**数据进 Excel 之前先过 Power Query**，让透视表吃到的永远是干净的表。", "steps": ["选中源数据区域任意单元格，点 (数据 → 自表格/区域)，在弹出的 (创建表) 对话框确认 (表包含标题)，点 (确定) 进入 Power Query 编辑器。（待补图）", "检查列类型：每列顶上有类型图标（ABC 表示文本、123 表示数字、日历表示日期）。点图标把 (日期) 改成日期、(金额) 改成数字。**类型不对会导致求和变计数、日期无法按月分组**，清洗时务必先检查。", "提升标题：如果第一行是标题行而非数据，点 (主页 → 将第一行用作标题)。（待补图）", "替换脏值：选中 (产品) 列，右键 → (替换值)，把系统导出的 (N/A) 换成空；把 (男/女) 换成 (M/F) 同理。", "拆分与合并列：见 4.2 节，按分隔符拆分 (省-市)；需要时用 (添加列 → 合并列) 拼回。", "填充空单元格：见 4.2 节，对 (部门) 列做 (向下填充)。", "筛选与去重：点列标题下拉箭头筛选，或选中列 → (删除重复项)。", "逆透视或透视：交叉表先逆透视成明细，见 4.2 节。", "合并或追加其他表：见 4.3 节。", "点 (主页 → 关闭并上载)，结果以表的形式回到工作表；以后源数据更新，在表上右键 → (刷新) 即可。"], "sections": [{"title": "2. 基础概念", "body": "### 2.1 Power Query 是什么\n\n它是 Excel 里的一个**数据加工流水线**：你把 (获取→清洗→整理) 的每一步操作点一遍，Power Query 会把步骤记下来。下个月拿到新的源文件，点一下 (刷新)，所有步骤自动重跑一遍。\n\n和公式的区别：\n\n- 公式是 (算出一个结果)，Power Query 是 (产出一张干净的表)。\n- 公式适合行内计算；Power Query 适合**结构性整理**：拆分列、转置、合并文件、逆透视——这些用公式写会很痛苦。\n\n核心观念：**你点的每一步都会变成一行 M 代码**，记录在右侧 (应用的步骤) 里。可以回头修改、删除、调整顺序。\n\n### 2.2 三个基本概念：查询、步骤、加载\n\n| 概念 | 含义 | 类比 |\n|---|---|---|\n| 查询 (Query) | 一段取数加清洗的完整定义，从来源到输出结果 | 一条做菜的菜谱 |\n| 步骤 (Step) | 查询里的一次操作，如提升标题、拆分列、筛选行 | 菜谱里的一步 |\n| 加载 (Load) | 把查询结果放进哪里：工作表中的表、仅创建连接、数据模型 | 菜做好端上哪张桌子 |\n\n一个查询可以只加载为 (仅创建连接)，供其他查询引用，不占工作表位置；也可以加载到工作表，成为一张真正的 Excel 表格，后面再接透视表。\n\n### 2.3 查询编辑器里有什么\n\n打开 (数据 → 获取数据 → 启动 Power Query 编辑器)，左侧是查询列表，中间是数据预览，右侧是 (应用的步骤)，顶部是公式栏（显示当前步骤的 M 代码）。左上角 (文件) 菜单里可以改查询的加载方式；(主页 → 关闭并上载) 把结果送回 Excel。\n\n### 2.4 与公式、透视表、Power Pivot 的分工\n\n| 任务 | 首选工具 | 原因 |\n|---|---|---|\n| 行内计算（单价乘数量） | 公式 | 即时、灵活 |\n| 结构性清洗（拆分、合并文件、逆透视） | Power Query | 步骤可重跑、可刷新 |\n| 分组汇总出报表 | 数据透视表 | 拖拽即得，见 C08 |\n| 百万行建模、多表关联度量值 | Power Pivot 与 DAX | 数据模型与度量值，见 C10 |\n\n经验法则：**数据进 Excel 之前先过 Power Query**，让透视表吃到的永远是干净的表。"}, {"title": "4. 图文示例", "body": "### 4.1 L2-1 获取数据\n\n入口都在 (数据 → 获取数据)。四种来源各有各的适用场景：\n\n#### 4.1.1 从文件获取：最常用的起点\n\n| 文件类型 | 入口 | 典型场景 |\n|---|---|---|\n| 文本/CSV | 获取数据 → 自文本/CSV | 系统导出的 csv/txt，如每月导出的销售明细 |\n| 工作簿 | 获取数据 → 自文件 → 自工作簿 | 合并多个 Excel 文件里的同名工作表 |\n| JSON/XML | 获取数据 → 自文件 → 自 JSON/XML | 接口、配置文件导出的结构化数据 |\n\n示例：导入配套文件 (销售2026-01.csv)（4 行，1 月总计 14690）。\n\n1. (数据 → 获取数据 → 自文本/CSV)，选中 (销售2026-01.csv)。\n2. 预览窗口显示 4 行数据，确认分隔符是逗号、编码是 UTF-8。\n3. 点 (转换数据) 进入编辑器做清洗，或点 (加载) 直接把原样数据放进工作表。\n\n（待补图：预览窗口截图）\n\n#### 4.1.2 从文件夹获取：月报自动化的关键\n\n场景：12 个月的销售表结构相同，每月一个文件，要拼成一张全年表。配套文件用 3 个小 csv 模拟这个场景：(销售2026-01.csv)（4 行，14690）、(销售2026-02.csv)（4 行，9730）、(销售2026-03.csv)（4 行，18270），合计 12 行、42690，与 (销售明细) 表逐项一致。\n\n1. (数据 → 获取数据 → 自文件 → 自文件夹)，选中存放月度文件的文件夹。\n2. 预览窗口列出文件夹里的全部文件，点 (合并和转换数据)。\n3. 选择 (合并文件) 用的示例文件，Power Query 按第一个文件的结构生成合并步骤。\n4. 以后每月往文件夹里丢新文件，右键查询 → (刷新)，新文件自动并进来——月报自动化就靠这一步。\n\n要点：文件夹里不要混进说明文档或图片，否则合并时会报错；文件结构（列名、列顺序）必须一致。\n\n#### 4.1.3 从数据库获取：大数据的正道\n\n| 数据库 | 入口 | 说明 |\n|---|---|---|\n| SQL Server | 获取数据 → 自数据库 → 自 SQL Server 数据库 | 写服务器名与数据库名，可贴 SQL 语句只取需要的行 |\n| Access | 获取数据 → 自数据库 → 自 Microsoft Access 数据库 | 直接选表或查询 |\n| MySQL/PostgreSQL | 获取数据 → 自数据库 → 自 MySQL/PostgreSQL 数据库 | 需先装对应连接器 |\n\n示例：从 SQL Server 取销售库。\n\n1. (数据 → 获取数据 → 自 SQL Server 数据库)，输入服务器名与数据库名。\n2. 在导航器里勾选需要的表，或点 (高级选项) 贴一条 SQL 只取 2026 年的数据。\n3. 点 (转换数据)，后续清洗与文件来源完全一样。\n\n要点：数据库查询尽量在源头筛选（只取需要的列和行），不要把整库拖进 Excel 再筛；数据库来源支持 (查询折叠)，筛选步骤会被翻译成 SQL 在服务器上执行，速度快得多。\n\n#### 4.1.4 从 Web 获取：抓网页表格\n\n1. (数据 → 获取数据 → 自其他源 → 自 Web)，粘贴网页地址。\n2. 导航器列出该页面上所有能识别的表格，勾选需要的表。\n3. 点 (转换数据)，后续清洗与文件来源完全一样。\n\n要点：需要登录才能看的页面会弹出凭据窗口，按提示输入账号密码；网页结构一改，查询就可能取不到表，刷新报错时先看页面是否改版；只抓公开数据，不要绕过网站的访问限制。\n\n### 4.2 L2-2 转换操作\n\n以下示例都以配套文件的数据为准，手工推演结果附在每节末尾。\n\n#### 拆分列\n\n一列里混着 (省-市-区)？选中列 → (拆分列 → 按分隔符) → 输入 (-)。一列变三列。也可以按固定宽度、按大小写转换处拆分。\n\n示例：\n\n| 拆分前（地址） | 拆分后（省） | 拆分后（市） | 拆分后（区） |\n|---|---|---|---|\n| 广东-深圳-南山区 | 广东 | 深圳 | 南山区 |\n| 浙江-杭州-西湖区 | 浙江 | 杭州 | 西湖区 |\n\n要点：分隔符在值里出现次数不一致时（如有的地址没有区），多余部分按 (额外值) 设置处理，默认忽略；拆完记得给新列改名。\n\n#### 合并列\n\n反向操作：选中 (省) (市) 两列 → (合并列)，分隔符选 (-)，得到 (广东-深圳)。常用于拼辅助键（如 (省-市) 做合并查询的关联列）。\n\n示例：\n\n| 省 | 市 | 合并后（省市） |\n|---|---|---|\n| 广东 | 深圳 | 广东-深圳 |\n| 浙江 | 杭州 | 浙江-杭州 |\n\n#### 填充\n\n导出的报表经常只有第一行有 (部门) 名，下面是空的（合并单元格拆开后的样子）。选中列 → (转换 → 填充 → 向下)。空单元格自动填上上方的值，透视表分组的前提。\n\n示例：\n\n| 填充前（部门） | 填充后（部门） |\n|---|---|\n| 华东 | 华东 |\n| （空） | 华东 |\n| （空） | 华东 |\n| 华北 | 华北 |\n\n要点：先填充、再删分组小计行；顺序反了会把小计行也填上部门名，汇总就错了。\n\n#### 更改类型与替换值\n\n每列顶上有个类型图标（ABC/123/日历）。点它把文本改成数字、日期。**类型不对会导致求和变计数、日期无法分组**，清洗时务必检查。\n\n替换值：选中列 → 右键 → (替换值)，把 (N/A) 换成空，把 (男/女) 换成 (M/F)，支持整列批量。\n\n#### 删除重复项与筛选\n\n选中列 → (删除重复项)。列标题的下拉箭头可以筛选、排序，和 Excel 里一样。删除重复项只认选中列的值：只选 (客户编号) 列去重，得到的是不重复的客户清单；全选所有列去重，删的才是完全相同的整行。\n\n#### 透视列与逆透视列\n\n逆透视 (Unpivot)：把交叉表 (拆长)。源数据是 (姓名×3个月) 的矩阵（1 月、2 月、3 月各一列），透视表吃不了这种格式。选中 3 个月份列 → 右键 → (逆透视列)。变成三列：姓名、月份、销售额。**这是 Power Query 最经典的用途之一。**\n\n配套 (月度交叉表) 逆透视后的结果（9 行，总计 42690）：\n\n| 姓名 | 月份 | 销售额 |\n|---|---|---|\n| 王芳 | 1月 | 9890 |\n| 王芳 | 2月 | 3735 |\n| 王芳 | 3月 | 1196 |\n| 李明 | 1月 | 3600 |\n| 李明 | 2月 | 4500 |\n| 李明 | 3月 | 3574 |\n| 陈静 | 1月 | 1200 |\n| 陈静 | 2月 | 1495 |\n| 陈静 | 3月 | 13500 |\n\n行合计核对：王芳 14821、李明 11674、陈静 16195，三人合计 42690，与 (销售明细) 总计一致。\n\n透视列 (Pivot)：反向操作。把 (月份、销售额) 两列转回交叉表：选中 (月份) 列 → (透视列) → 值列选 (销售额)、聚合选 (求和)，得到的就是上面的 (月度交叉表)。注意：透视要求 (姓名、月份) 组合唯一，否则必须选聚合函数（如求和）先汇总。\n\n### 4.3 L2-3 合并与追加\n\n#### 合并查询：比 VLOOKUP 更强的关联\n\n场景：配套文件里 (订单) 表有 (客户编号)，(客户档案) 表有 (客户编号 → 客户名称)，想给订单带上客户名称。\n\n1. 在编辑器里选中订单查询 → (合并查询)。\n2. 上表选 (客户编号)，下表选 (客户档案) 的 (客户编号)（点列表头选中，两边都要点）。\n3. 联接种类选 (左外部)（保留订单全部行，档案对不上的留空——对应 VLOOKUP 的精确匹配）。\n4. 确定后多出一列，点列头的展开按钮，勾选 (客户名称)。\n\n比 VLOOKUP 强的点：\n\n- **可按多列关联**：Ctrl 加点选多个列头，一次按 (省加市) 两列匹配，VLOOKUP 要拼辅助列。\n- **模糊匹配**：联接时勾选 (模糊匹配)，自动处理 (北京) 与 (北京市) 这种差异，还能设相似度阈值。\n- **左反/右反联接**：直接找出 (有订单但无档案) 的异常数据，做对账极方便。\n\n六种联接类型逐项讲清（以配套数据为准：订单 6 行，客户档案 5 行；订单 O004 的客户编号 K999 在档案中不存在；档案 K005 西部贸易没有任何订单）：\n\n| 联接类型 | 保留的行 | 配套数据结果 | 适用场景 |\n|---|---|---|---|\n| 左外部 (Left Outer) | 左表全部行 | 6 行；O004 的客户名称为空 | 给订单带客户名称（默认，最常用） |\n| 右外部 (Right Outer) | 右表全部行 | 6 行；K005 一行订单字段为空 | 以档案为主，找出没有订单的客户 |\n| 内部 (Inner) | 两边都匹配的行 | 5 行；O004 被去掉，金额合计 17385 | 只要能对上的干净数据 |\n| 完全外部 (Full Outer) | 两边全部行 | 7 行；O004 客户名称为空，K005 订单字段为空 | 两边全要，对账总表 |\n| 左反 (Left Anti) | 左表有、右表没有的行 | 1 行：O004（K999） | 找出 (有订单但无档案) 的异常 |\n| 右反 (Right Anti) | 右表有、左表没有的行 | 1 行：K005 西部贸易 | 找出 (有档案但无订单) 的沉睡客户 |\n\n行数核对：左外部 6 行金额合计 21885（订单总计）；内部 5 行合计 17385（21885 减去 O004 的 4500）；完全外部 7 行是 6 加 1（多出的 K005 行）。\n\n注意：界面上的 (联接种类) 下拉框只有上面六种；M 语言里还有 (左半联接) 与 (右半联接)（只判断是否匹配、不带回右表字段），界面点不出来，要写 M 代码才用得上。\n\n#### 追加查询：纵向堆叠\n\n场景：12 个月的销售表结构相同，要拼成一张全年表。\n\n(追加查询) → 选 (三个或更多表) → 把 12 个表都加进来。列名相同的自动对齐，某表多出的列会以空值补齐。追加查询生成的 M 代码是 `Table.Combine({查询1, 查询2, 查询3})`，参数是一个查询列表。\n\n配套数据：把 (销售2026-01.csv)（4 行，14690）、(销售2026-02.csv)（4 行，9730）、(销售2026-03.csv)（4 行，18270）三个查询追加，得到 12 行、总计 42690，与 (销售明细) 表逐项一致。\n\n**从文件夹追加**（更常用）：(获取数据 → 从文件夹) → 选存放 12 个文件的文件夹 → (合并和转换)。以后每月往文件夹里丢新文件，刷新一次全进来——月报自动化。\n\n合并与追加的区别（一句话）：追加是纵向堆行（行数增加，结构要一致）；合并是横向关联（按关键列匹配，类似 VLOOKUP）。"}], "source": "docs/powerquery/01-power-query.md", "updated": "2026-11-10", "file": "PowerQuery-示例-销售明细.xlsx", "objectives": ["从文件、文件夹、数据库、网页四种来源获取数据，并说出每种来源适用的场景", "用拆分列、合并列、透视列、逆透视列、填充完成常见的数据清洗", "区分合并查询与追加查询，并按六种联接类型（左外部、右外部、内部、完全外部、左反、右反）说出每种的结果行数", "读懂 let/in 结构的 M 代码，用 each、Table. 与 Text. 常用函数写自定义列，并在高级编辑器里修改查询", "管理查询（改名、复制、分组、设置加载方式），设置刷新，并处理刷新报错与步骤顺序问题", "独立完成月度销售报表自动化：把每月新文件丢进文件夹，刷新一次即出干净的全年表"], "formulas": ["### 5.0 验证状态说明（必读）", "本节全部 M 代码的验证状态：**未执行验证（无 Power Query 运行时）**。本机没有可运行 Power Query 的 Excel 环境，因此没有任何一段代码声称已执行成功。", "已做的核对只有两项：", "- **语法经官方文档核对**：每个函数名与参数签名均对照 Microsoft Learn 的 Power Query M 函数参考核对过（Csv.Document、File.Contents、Folder.Files、Excel.Workbook、Sql.Database、Web.Contents、Json.Document、Table.PromoteHeaders、Table.TransformColumnTypes、Table.SelectRows、Table.AddColumn、Table.SplitColumn、Splitter.SplitTextByDelimiter、Table.FillDown、Table.NestedJoin、Table.ExpandTableColumn、Table.Combine、Table.UnpivotOtherColumns、Table.Pivot、Table.Group、Text.Split、Text.Combine、List.Sum、List.Distinct）。", "- **逻辑经手工推演**：每段代码后面都附了预期输出表，数字与配套示例文件逐项一致（销售明细总计 42690、订单总计 21885）。", "读代码时记住三条 M 语言的基本规则：M 区分大小写（Table.SelectRows 不能写成 table.selectrows）；文本用双引号，文本里的双引号要写两遍；列表从 0 开始数（{1} 是第 2 个元素）。", "### 5.1 L2-4 M 语言入门：let/in 与 each", "你点的每一步，Power Query 都翻译成 M 语言，显示在顶部的公式栏。看懂它，就能做界面点不出来的事。", "let", "源 = Csv.Document(File.Contents(\"C:\\data\\销售.csv\"), [Delimiter=\",\", Encoding=65001]),", "提升标题 = Table.PromoteHeaders(源),", "改类型 = Table.TransformColumnTypes(提升标题, {{\"日期\", type date}, {\"金额\", type number}}),", "筛选 = Table.SelectRows(改类型, each [金额] > 0)", "in", "筛选", "读法：", "- `let...in`：定义一串中间变量，最后 `in` 后面的是输出。每个步骤名（如 `提升标题`）都是一个变量，下一步引用上一步。", "- `each [金额] > 0`：对每一行判断，`[金额]` 表示当前行的 (金额) 字段。`each` 是 `(_) => _` 的简写，相当于 M 里的 lambda。", "- `Csv.Document` 的第 2 个参数是选项记录：`[Delimiter=\",\", Encoding=65001]` 表示逗号分隔、UTF-8 编码（65001 是 UTF-8 的代码页）。", "- `Table.TransformColumnTypes` 的第 2 个参数是列表，每个元素是 (列名，类型) 的二元组：`{\"日期\", type date}`。", "预期输出：读入销售 csv，首行提升为标题，(日期) 列为日期型、(金额) 列为数字型，只保留金额大于 0 的行。", "常用手工写法：", "// 新增条件列（界面：添加列 → 条件列 点不出的复杂逻辑自己写）", "Table.AddColumn(上一步, \"等级\", each if [金额] >= 10000 then \"大\" else \"小\")", "// 按分隔符取第 2 段", "Table.AddColumn(上一步, \"城市\", each Text.Split([地址], \"-\"){1})", "`{1}` 是取列表第 2 个元素（从 0 开始数）。`Text.Split(\"广东-深圳-南山区\", \"-\")` 返回列表 `{\"广东\", \"深圳\", \"南山区\"}`，取 `{1}` 得到 (深圳)。", "预期输出（以地址 (广东-深圳-南山区) 为例）：等级列按金额分 (大/小)，城市列为 (深圳)。", "M 的列表、记录、表三种结构是核心，掌握 `each` 和 `[字段名]` 就能写 80% 的自定义步骤：", "| 结构 | 写法 | 取值 |", "|---|---|---|", "| 列表 (List) | `{\"a\", \"b\", \"c\"}` | `列表{1}` 得到 (b) |", "| 记录 (Record) | `[姓名=\"王芳\", 金额=9000]` | `记录[金额]` 得到 9000 |", "| 表 (Table) | 多行多列 | `表{0}` 得到第 1 行记录，`表[金额]` 得到金额列的列表 |", "### 5.2 拆分列与填充的 M 写法", "let", "源 = #\"销售明细\",", "拆分地址 = Table.SplitColumn(源, \"地址\", Splitter.SplitTextByDelimiter(\"-\"), {\"省\", \"市\", \"区\"}),", "填充部门 = Table.FillDown(拆分地址, {\"部门\"}),", "合并省市 = Table.AddColumn(填充部门, \"省市\", each Text.Combine({[省], [市]}, \"-\"), type text)", "in", "合并省市", "读法：", "- `Table.SplitColumn(表, 列名, 拆分器, 新列名列表)`：`Splitter.SplitTextByDelimiter(\"-\")` 是按分隔符拆分的拆分器函数。", "- `Table.FillDown(表, {\"部门\"})`：把 (部门) 列的空单元格用上方的值向下填充。", "- `Text.Combine({[省], [市]}, \"-\")`：把两列文本用 (-) 连起来，得到 (广东-深圳)。也可以写 `[省] & \"-\" & [市]`，`&` 是 M 的文本连接运算符。", "预期输出（以地址 (广东-深圳-南山区)、部门首行 (华东) 其后两行空为例）：拆出 (省/市/区) 三列，部门列三行全为 (华东)，新增 (省市) 列为 (广东-深圳)。", "### 5.3 从文件夹合并的 M 写法", "let", "源 = Folder.Files(\"D:\\月报\"),", "只留CSV = Table.SelectRows(源, each [Extension] = \".csv\"),", "加内容 = Table.AddColumn(只留CSV, \"内容\", each Csv.Document([Content], [Delimiter=\",\", Encoding=65001])),", "展开内容 = Table.ExpandTableColumn(加内容, \"内容\", {\"日期\", \"销售员\", \"地区\", \"产品\", \"数量\", \"单价\", \"金额\"}),", "删多余列 = Table.RemoveColumns(展开内容, {\"Content\", \"Name\", \"Extension\", \"Date accessed\", \"Date modified\", \"Date created\", \"Attributes\", \"Folder Path\"})", "in", "删多余列", "读法：", "- `Folder.Files(\"D:\\月报\")` 返回一张表，每行一个文件，含 (Name)、(Extension)、(Content) 等列，其中 (Content) 是文件内容的二进制值。", "- `each [Extension] = \".csv\"` 只留下 csv 文件；`Csv.Document([Content], ...)` 把每行的二进制内容解析成一张小表。", "- `Table.ExpandTableColumn` 把嵌套的小表展开成普通列；最后删掉文件夹自带的多余列。", "预期输出（以配套 3 个 csv 为例）：12 行、7 列（日期、销售员、地区、产品、数量、单价、金额），总计 42690，与 (销售明细) 表逐项一致。界面点 (合并文件) 生成的代码比这段更长（会多一个转换文件的函数），但逻辑相同；这段是可读的手写简化版。", "### 5.4 合并查询的 M 写法", "let", "订单 = #\"订单\",", "客户档案 = #\"客户档案\",", "合并 = Table.NestedJoin(订单, {\"客户编号\"}, 客户档案, {\"客户编号\"}, \"档案\", JoinKind.LeftOuter),", "展开 = Table.ExpandTableColumn(合并, \"档案\", {\"客户名称\", \"客户等级\"}, {\"客户名称\", \"客户等级\"})", "in", "展开", "读法：", "- `Table.NestedJoin(左表, 左键列表, 右表, 右键列表, 新列名, 联接类型)`：界面 (合并查询) 生成的就是这个函数。键用列表表示，多列关联就写多个列名，如 `{\"省\", \"市\"}`。", "- `JoinKind.LeftOuter` 是默认值，不写也是左外部；换成 `JoinKind.Inner`、`JoinKind.LeftAnti`、`JoinKind.FullOuter`、`JoinKind.RightOuter`、`JoinKind.RightAnti` 即对应 4.3 节的六种联接。", "- `Table.ExpandTableColumn` 把嵌套的档案表展开，只取 (客户名称) 与 (客户等级) 两列。", "预期输出（左外部）：6 行，O001 至 O006 各带客户名称；O004（K999）客户名称与客户等级为空。把 `JoinKind.LeftOuter` 换成 `JoinKind.Inner` 得到 5 行（合计 17385）；换成 `JoinKind.LeftAnti` 得到 1 行（O004）。", "### 5.5 逆透视与透视的 M 写法", "// 逆透视：把 (月度交叉表) 的 3 个月份列拆长", "逆透视 = Table.UnpivotOtherColumns(#\"月度交叉表\", {\"姓名\"}, \"月份\", \"销售额\")", "// 透视：把明细按 (姓名、月份) 转回交叉表（先按姓名和月份求和，再透视）", "let", "源 = #\"销售明细\",", "按月汇总 = Table.Group(源, {\"销售员\", \"月份\"}, {{\"月金额\", each List.Sum([金额]), type number}}),", "透视 = Table.Pivot(按月汇总, List.Distinct(按月汇总[月份]), \"月份\", \"月金额\", List.Sum)", "in", "透视", "读法：", "- `Table.UnpivotOtherColumns(表, 保留列, 属性列名, 值列名)`：除 (姓名) 外的列全部逆透视，新列名 (月份) 与 (销售额)。新增月份列出现时自动跟进，比 (仅逆透视选中列) 更适合月报。", "- `Table.Group(表, 分组列, 聚合列表)`：`{{\"月金额\", each List.Sum([金额]), type number}}` 表示按组求和，`each` 里的 `[金额]` 是当前组的金额列。", "- `Table.Pivot(表, 透视值列表, 属性列, 值列, 聚合函数)`：`List.Distinct(按月汇总[月份])` 取出所有不重复的月份作为新列名。", "预期输出：逆透视得到 9 行（见 4.2 节的表，总计 42690）；透视得到 3 行 4 列的交叉表（姓名、1月、2月、3月），与配套 (月度交叉表) 一致。", "### 5.6 自定义函数：把文件路径变成参数", "// 查询 fn读销售CSV：输入文件路径，输出清洗好的表", "(路径 as text) as table =>", "let", "源 = Csv.Document(File.Contents(路径), [Delimiter=\",\", Encoding=65001]),", "提升标题 = Table.PromoteHeaders(源),", "改类型 = Table.TransformColumnTypes(提升标题, {{\"日期\", type date}, {\"金额\", type number}}),", "筛选 = Table.SelectRows(改类型, each [金额] > 0)", "in", "筛选", "读法：`(路径 as text) as table => ...` 定义一个函数：输入文本型路径，输出表。调用时写 `fn读销售CSV(\"D:\\月报\\销售2026-01.csv\")`。", "要点：函数查询要在编辑器里右键查询 → (创建函数) 或直接在高级编辑器里改写；函数本身不返回数据，只在被调用时才执行；路径写死在代码里是新手最常见的坑，参数化之后换个文件夹只需改调用处。", "### 5.7 从数据库与网页取数的 M 写法", "// SQL Server：只取 2026 年的订单", "源 = Sql.Database(\"服务器名\", \"销售库\", [Query=\"select * from 订单 where year(日期) = 2026\"])", "// 工作簿：读指定工作表（Excel.Workbook 返回导航表，需再展开要用的表）", "源 = Excel.Workbook(File.Contents(\"D:\\数据\\产品目录.xlsx\"))", "// 网页 JSON 接口：先取内容，再解析为 JSON（把地址换成真实接口地址）", "源 = Json.Document(Web.Contents(\"https://api.example.com/sales\"))", "读法：`Sql.Database` 的第 3 个参数是选项记录，`[Query=...]` 可以直接贴 SQL；`Excel.Workbook` 读出的是导航表，要在导航器里点开目标工作表才会展开；`Web.Contents` 取回二进制内容，`Json.Document` 解析成记录或列表。", "要点：这三段是连接模式的写法，服务器名、文件路径、接口地址都要换成真实值；网页接口需要账号密码时，`Web.Contents` 要加凭据选项，或在界面里按提示输入。", "### 5.8 在 Excel 里核对结果的公式", "查询加载回工作表后，用两个公式核对数字是否与配套文件一致：", "=SUM(表1[金额]) → 42690", "(表1) 是加载后的销售明细表结构化引用，合计应为 42690；若不是，先看行数，再看 (金额) 列类型是否为数字。", "=SUM(订单[金额]) → 21885", "(订单) 表合计 21885；做内部联接后，展开表的金额合计应为 17385（21885 减去无档案的 O004 的 4500）。"], "scenarios": [{"title": "6.1 L2-5 查询管理与刷新", "body": "#### 查询属性\n\n右键查询 → (属性)，可以改名、写说明、看查询的加载设置。改名要趁早：查询名默认是 (查询1) 这种无意义的名字，M 代码里引用查询用的是 `#\"查询名\"`，改名后引用处自动跟着改。建议命名：来源加内容，如 (销售明细-2026)、(订单-带客户名称)，不要用 (查询1)。\n\n#### 刷新设置\n\n| 设置位置 | 作用 |\n|---|---|\n| 右键查询 → (刷新) | 只刷新这一个查询 |\n| (数据 → 全部刷新) | 刷新工作簿里全部查询与透视表 |\n| 查询属性 → (打开文件时刷新数据) | 每次打开文件自动刷新，适合固定月报 |\n| (数据 → 查询与连接 → 右键 → 属性 → 使用情况) | 设后台刷新、刷新间隔（分钟） |\n\n要点：源文件变了，Excel 不会自动重算，必须手动刷新；(全部刷新) 的顺序按查询依赖关系自动排，先刷新被引用的查询，再刷新引用它的查询。\n\n#### 错误处理\n\n查询出错时，单元格显示错误值，编辑器里出错的行整行标红。常见处理：\n\n- 点出错的单元格看错误信息（如 (Expression.Error: 找不到列))，按信息定位到具体步骤。\n- (转换 → 替换错误) 可以把某列的错误值统一换成空或 0，适合脏数据。\n- (主页 → 保留错误) 只留出错的行，单独成一张错误清单，逐行修源数据。\n- 不要用 (删除错误) 掩盖问题：删掉的错误行不会再出现，月报总数就悄悄少了。\n\n#### 步骤顺序敏感\n\n步骤是按顺序执行的，后面的步骤引用前面的列。删列之后再引用该列的步骤会报错；改了某步的列名，后面用到旧列名的步骤全红。修法：点报错的步骤，看公式栏里引用的列名，逐个改成新列名；或者删掉报错的步骤重做。改步骤前先看后面的步骤是否依赖它——右侧 (应用的步骤) 里点一步就能看到做到那步的结果。\n\n#### 查询的组织：分组、复制、引用\n\n- 分组：查询多了（十几个）可以在 (查询与连接) 窗格里建组，如 (源数据) (中间表) (输出表)，按流水线分。\n- 引用与复制的区别：右键 → (引用) 是新建一个查询，起点是原查询的结果（改原查询会连带影响）；(复制) 是复制一份 M 代码（改原查询不影响副本）。要基于清洗结果再做分支，用引用；要留一个备份版本，用复制。\n- 加载方式：中间查询设为 (仅创建连接)，不加载到工作表，文件更小、刷新更快；只有最终输出表才加载到工作表。"}, {"title": "6.2 月度销售报表自动化实战", "body": "场景：财务每月从系统导出 (销售2026-XX.csv)，要出 (销售员×月份) 的汇总报表。配套文件用 3 个月模拟 12 个月（真实场景下文件夹里放 12 个文件，做法完全相同）。\n\n1. 每月系统导出 (销售2026-10.csv)，丢进 (D:\\月报\\) 文件夹。\n2. (从文件夹) 获取，合并，得到原始表（3 个月模拟：12 行，总计 42690）。\n3. 清洗：提升标题 → 改类型（日期/数字）→ 填充部门 → 拆分 (省-市) → 删除空行。\n4. 合并查询客户档案带出客户名称（左外部，O004 这类无档案订单会留空，见 4.3 节）。\n5. 逆透视 12 个月份列（如果是交叉表）。\n6. (关闭并上载) → 生成干净的表，上面做透视表出报表。\n7. 下个月：新 CSV 丢进文件夹，右键刷新——全自动。\n\n结果核对：上载后 `=SUM(表1[金额])` 应为 42690；透视表按销售员分组：王芳 14821、李明 11674、陈静 16195；按月份分组：1 月 14690、2 月 9730、3 月 18270。三个口径的总数都是 42690，任一口径对不上，先查清洗步骤是否丢了行。"}], "pitfalls": [{"problem": "刷新后金额求和变计数", "cause": "(金额) 列是文本型", "solution": "点列类型图标改成数字；或在查询里加一步改类型，放在筛选之前"}, {"problem": "(Expression.Error: 找不到列)", "cause": "前面的步骤删了列或改了列名，后面的步骤还在引用旧列名", "solution": "点报错步骤，看公式栏里的旧列名，逐个改成新列名；或删掉报错步骤重做"}, {"problem": "从文件夹合并报错 (找不到文件)", "cause": "文件夹里混进了非数据文件，或示例文件被删改名", "solution": "文件夹只放同结构数据文件；删掉混入的文件后刷新"}, {"problem": "合并查询后匹配全是空", "cause": "关联列类型不一致（文本对数字）或值里有空格", "solution": "两边先统一改类型，再用 Text.Trim 去空格；检查 (客户编号) 是否一边带空格"}, {"problem": "追加查询后列对不齐", "cause": "各表列名不一致（(金额) 与 (金额(元)))", "solution": "先统一列名再追加；或在追加后用 (选择列) 对齐"}, {"problem": "逆透视后多出不需要的列", "cause": "选了 (逆透视列) 只逆透视选中列，漏了新来的月份列", "solution": "改用 (逆透视其他列)，只保留 (姓名) 等标识列，其余自动跟进"}, {"problem": "刷新时弹凭据窗口", "cause": "数据库或网页来源需要账号密码", "solution": "在凭据窗口输入账号密码；或 (数据 → 查询与连接 → 数据源设置) 里清除旧凭据重输"}, {"problem": "打开文件不自动刷新", "cause": "没勾选 (打开文件时刷新数据)", "solution": "查询属性里勾选；或每次手动点 (数据 → 全部刷新)"}, {"problem": "透视列报错 (值重复)", "cause": "(姓名、月份) 组合不唯一，透视不知道取哪一行", "solution": "透视时选聚合函数（求和）；或先按 (姓名、月份) 分组汇总再透视"}, {"problem": "查询结果行数比源文件少", "cause": "某步筛选或去重误删了行，或改类型把非法值变成了错误", "solution": "逐个点 (应用的步骤)，看每步行数变化，定位丢行的步骤"}], "exercises": ["配套 (订单) 表 6 行、(客户档案) 表 5 行，其中 O004 的客户编号 K999 在档案中不存在，K005 西部贸易没有任何订单。用内部联接合并后是几行？金额合计是多少？用左反联接是几行？", "配套 (月度交叉表) 是 (姓名×3个月) 的矩阵。把它变成 (姓名、月份、销售额) 的明细表，用什么操作？逆透视后是几行？总计是多少？", "文件夹里有 12 个结构相同的月度 csv，每月新增一个文件。只做一次设置，以后每月刷新自动并入新文件，应该用什么获取方式？关键步骤是哪一步？", "(地址) 列的值是 (广东-深圳-南山区)，要取 (深圳)。写出 M 代码，并说出 Text.Split 返回的是什么结构、取第 2 个元素为什么写 {1}。", "源文件更新后，Power Query 的结果怎么同步？如果打开文件时想自动刷新，要在哪里设置？", "清洗时先改类型还是先筛选？说出理由。再说一个步骤顺序敏感的例子：删列之后引用该列的步骤会发生什么？"], "answers": ["内部联接 5 行，金额合计 17385（订单总计 21885 减去无档案的 O004 的 4500）。左反联接 1 行：O004（K999），即 (有订单但无档案) 的异常行。", "逆透视列（或逆透视其他列，只保留姓名列）。逆透视后 9 行，总计 42690；行合计王芳 14821、李明 11674、陈静 16195。", "从文件夹获取：(获取数据 → 自文件 → 自文件夹)，选 (合并和转换数据)。关键步骤是 (合并文件) 生成的合并步骤；以后每月把新文件丢进文件夹，右键查询 → (刷新) 即可。", "`Table.AddColumn(上一步, \"城市\", each Text.Split([地址], \"-\"){1})`。Text.Split 返回列表 `{\"广东\", \"深圳\", \"南山区\"}`，列表从 0 开始数，{1} 是第 2 个元素 (深圳)。", "右键查询 → (刷新)，或 (数据 → 全部刷新)；查询步骤存在工作簿里，刷新即按步骤重跑一遍。打开文件自动刷新在查询属性里勾选 (打开文件时刷新数据)。", "先改类型再筛选：筛选、分组、合并都依赖正确的类型，文本型的金额无法求和、文本型的日期无法按月分组。步骤顺序敏感的例子：删列之后再引用该列的步骤会报 (Expression.Error: 找不到列)，要改公式栏里的列名或删掉报错步骤重做。"], "versions": "Excel 2016／2019／2021／365（内置，位于 (数据) 选项卡）；Excel 2013 需单独安装 Power Query 插件；Excel 2010 同样需安装插件"}, {"id": "conditional-formatting", "group": "advanced", "column": "C06", "level2": "C06-L2-1", "title": "条件格式", "level": "进阶", "body": "### 2.1 核心原理：规则加格式\n\n条件格式 = **“规则” + “格式”**。规则判断每个单元格“达不达标”，达标就套用你设的格式（红底、加粗等）。\n\n关键理解：**格式是“活”的**。单元格的值变了，格式自动跟着变——和你手工涂色有本质区别。删掉规则（“开始”→“条件格式”→“清除规则”）就恢复原样，不破坏数据。\n\n操作入口：“开始”→“条件格式”。先**选中要应用的区域**再设规则，这点最重要。\n\n### 2.2 L2-1 内置规则之一：突出显示单元格规则\n\n最常用的一类：“条件格式”→“突出显示单元格规则”：\n\n| 规则 | 示例 |\n|------|------|\n| 大于／小于／介于 | 金额 > 10000 标红 |\n| 等于 | 状态 =“缺货”标黄 |\n| 文本包含 | 备注包含“紧急” |\n| 发生日期 | “最近 7 天”“上个月”——到期提醒常用 |\n| 重复值 | 一键标出重复的身份证号／手机号 |\n\n每个规则点开后选格式（浅红填充深红文本等），也可以点“自定义格式”自己配。\n\n### 2.3 L2-1 内置规则之二：项目选取规则\n\n“条件格式”→“项目选取规则”，不设固定阈值、只按排名取前几名或后几名：\n\n| 规则 | 示例 |\n|------|------|\n| 前 10 项 | 销售额前 10 名标金色，名次变化自动重标 |\n| 前 10% | 前 10% 的订单标绿，数据量变了比例不变 |\n| 后 10 项 | 销量垫底的 10 个产品标灰，提醒下架复核 |\n| 高于／低于平均值 | 高于平均分的学生标蓝，一眼看出分布 |\n\n与“大于某个数”不同：项目选取规则看的是**排名**，阈值随数据自动浮动。做月度 Top 10 榜单时用它，比每月手动改阈值省事。想标前 3 名：选“前 10 项”后把 10 改成 3 即可。\n\n### 2.4 L2-1 内置规则之三：数据条\n\n“条件格式”→“数据条”→选一种颜色。数值越大，条越长。\n\n- 适合：完成率、销售额对比——一眼看出谁高谁低，不用看数字。\n- 技巧：勾选“仅显示数据条”（管理规则→编辑规则），隐藏数字，只留条形，更像仪表盘。\n- 注意：数据条的长度是按**选中区域内的最大／最小值**自动缩放的，区域不同不能直接比长短。\n\n### 2.5 L2-1 内置规则之四：色阶\n\n“条件格式”→“色阶”→如“绿-黄-红”。数值映射到颜色渐变，**适合看分布**：\n\n- 12 个月的销售热力图，旺季月份自动变红。\n- 学生成绩表，一眼看出哪科普遍偏低。\n\n双色刻度和三色刻度：三色多一个中间色，适合“中间值也想区分”的场景。\n\n### 2.6 L2-1 内置规则之五：图标集\n\n“条件格式”→“图标集”→如“三色旗／红绿灯”。数值分三档，分别显示图标。\n\n默认按百分比划分（67%／33%），想按绝对值：管理规则→编辑规则→类型改成“数字”，填阈值。如：完成率 ≥100% 绿灯、≥80% 黄灯、<80% 红灯。\n\n### 2.7 L2-3 规则管理：优先级、管理规则、清除规则\n\n一个单元格可以同时命中多条规则，管理靠三件事：\n\n- **优先级**：规则列表中靠上的优先。多个规则同时命中一个单元格时，先按列表顺序套用，排在上面的格式先生效。\n- **“如果为真则停止”**：某条规则勾选后，一旦命中就不再往下判断。适合“分级提醒只取最高级”的场景（如已过期就只显示深红，不再叠加黄色）。\n- **管理规则**：“条件格式”→“管理规则”，左上角下拉选“当前工作表”，一张表上的全部规则一览无余；在这里改顺序（上移／下移）、改范围、改格式、删除单条规则。\n- **清除规则**：“条件格式”→“清除规则”，可清“所选单元格的规则”“整个工作表的规则”或“整个工作簿的规则”。只清规则不删数据，是安全的回退操作。", "steps": ["建突出显示规则：选中区域（如 B2:B100），“开始”→“条件格式”→“突出显示单元格规则”→“大于”，输入阈值，选格式，确定。", "建项目选取规则：选中区域，“条件格式”→“项目选取规则”→“前 10 项”，把 10 改成想要的名次，选格式，确定。", "建数据条／色阶／图标集：选中数值区域，“条件格式”→对应类型→选一种样式；想按绝对值分档时，进“管理规则”→“编辑规则”改类型为“数字”并填阈值。", "建公式规则：选中要应用的区域，“条件格式”→“新建规则”→“使用公式确定要设置格式的单元格”，输入公式（相对选中区域左上角写，见第 5 节），点“格式”设颜色，确定。", "查看与调整优先级：“条件格式”→“管理规则”→下拉选“当前工作表”，用上移／下移调整顺序；分级提醒场景给高级别规则勾选“如果为真则停止”。", "清除规则：“条件格式”→“清除规则”→按范围选“所选单元格”或“整个工作表”，确认后格式恢复原样。"], "sections": [{"title": "2. 基础概念", "body": "### 2.1 核心原理：规则加格式\n\n条件格式 = **“规则” + “格式”**。规则判断每个单元格“达不达标”，达标就套用你设的格式（红底、加粗等）。\n\n关键理解：**格式是“活”的**。单元格的值变了，格式自动跟着变——和你手工涂色有本质区别。删掉规则（“开始”→“条件格式”→“清除规则”）就恢复原样，不破坏数据。\n\n操作入口：“开始”→“条件格式”。先**选中要应用的区域**再设规则，这点最重要。\n\n### 2.2 L2-1 内置规则之一：突出显示单元格规则\n\n最常用的一类：“条件格式”→“突出显示单元格规则”：\n\n| 规则 | 示例 |\n|------|------|\n| 大于／小于／介于 | 金额 > 10000 标红 |\n| 等于 | 状态 =“缺货”标黄 |\n| 文本包含 | 备注包含“紧急” |\n| 发生日期 | “最近 7 天”“上个月”——到期提醒常用 |\n| 重复值 | 一键标出重复的身份证号／手机号 |\n\n每个规则点开后选格式（浅红填充深红文本等），也可以点“自定义格式”自己配。\n\n### 2.3 L2-1 内置规则之二：项目选取规则\n\n“条件格式”→“项目选取规则”，不设固定阈值、只按排名取前几名或后几名：\n\n| 规则 | 示例 |\n|------|------|\n| 前 10 项 | 销售额前 10 名标金色，名次变化自动重标 |\n| 前 10% | 前 10% 的订单标绿，数据量变了比例不变 |\n| 后 10 项 | 销量垫底的 10 个产品标灰，提醒下架复核 |\n| 高于／低于平均值 | 高于平均分的学生标蓝，一眼看出分布 |\n\n与“大于某个数”不同：项目选取规则看的是**排名**，阈值随数据自动浮动。做月度 Top 10 榜单时用它，比每月手动改阈值省事。想标前 3 名：选“前 10 项”后把 10 改成 3 即可。\n\n### 2.4 L2-1 内置规则之三：数据条\n\n“条件格式”→“数据条”→选一种颜色。数值越大，条越长。\n\n- 适合：完成率、销售额对比——一眼看出谁高谁低，不用看数字。\n- 技巧：勾选“仅显示数据条”（管理规则→编辑规则），隐藏数字，只留条形，更像仪表盘。\n- 注意：数据条的长度是按**选中区域内的最大／最小值**自动缩放的，区域不同不能直接比长短。\n\n### 2.5 L2-1 内置规则之四：色阶\n\n“条件格式”→“色阶”→如“绿-黄-红”。数值映射到颜色渐变，**适合看分布**：\n\n- 12 个月的销售热力图，旺季月份自动变红。\n- 学生成绩表，一眼看出哪科普遍偏低。\n\n双色刻度和三色刻度：三色多一个中间色，适合“中间值也想区分”的场景。\n\n### 2.6 L2-1 内置规则之五：图标集\n\n“条件格式”→“图标集”→如“三色旗／红绿灯”。数值分三档，分别显示图标。\n\n默认按百分比划分（67%／33%），想按绝对值：管理规则→编辑规则→类型改成“数字”，填阈值。如：完成率 ≥100% 绿灯、≥80% 黄灯、<80% 红灯。\n\n### 2.7 L2-3 规则管理：优先级、管理规则、清除规则\n\n一个单元格可以同时命中多条规则，管理靠三件事：\n\n- **优先级**：规则列表中靠上的优先。多个规则同时命中一个单元格时，先按列表顺序套用，排在上面的格式先生效。\n- **“如果为真则停止”**：某条规则勾选后，一旦命中就不再往下判断。适合“分级提醒只取最高级”的场景（如已过期就只显示深红，不再叠加黄色）。\n- **管理规则**：“条件格式”→“管理规则”，左上角下拉选“当前工作表”，一张表上的全部规则一览无余；在这里改顺序（上移／下移）、改范围、改格式、删除单条规则。\n- **清除规则**：“条件格式”→“清除规则”，可清“所选单元格的规则”“整个工作表的规则”或“整个工作簿的规则”。只清规则不删数据，是安全的回退操作。"}, {"title": "4. 图文示例", "body": "销售明细 5 行：张三／销售部／8000、李四／市场部／3000、王五／销售部／6000、赵六／销售部／4500、钱七／市场部／7000。合计 28500。\n\n- 突出显示“金额 > 5000”：命中 3 行（张三 8000、王五 6000、钱七 7000），其余 2 行不变。\n- 数据条：最长是 8000（张三），最短是 3000（李四）；条长按区域内最大 8000、最小 3000 缩放。\n- 项目选取“前 3 项”：命中张三 8000、钱七 7000、王五 6000，与手动排序的前 3 名一致。\n\n（截图位：待补图）"}], "source": "docs/conditional-formatting/01-conditional-formatting.md", "updated": "2026-11-10", "objectives": ["用内置规则（突出显示、项目选取、数据条、色阶、图标集）做可视化", "用公式规则实现整行高亮、跨表条件与到期提醒", "管理规则优先级、查看与清除规则，并排查规则冲突", "判断内置规则与公式规则分别适合什么场景"], "formulas": ["### 5.1 L2-2 公式规则的心法", "内置规则不够用时，用公式。入口：“条件格式”→“新建规则”→“使用公式确定要设置格式的单元格”。", "**核心心法**：公式是**相对选中区域左上角**写的。选中 A2:D100 后写公式，公式里的 A2 指“当前正在判断的行的 A 列”。Excel 会把公式逐行（逐格）套用一遍。", "=$C2>10000 → 选中 A2:D100 时，C 列金额大于 10000 的行整行变红", "=COUNTIF($A$2:$A$100, $A2)>1 → A 列出现 2 次以上的行整行标黄", "=MOD(ROW(),2)=0 → 偶数行上色，隔行变色", "- `=$C2>10000`：`$C` 锁定列（每行都看 C 列），`2` 不锁定行（随行变化）。这就是整行格式化的标准写法：**列锁定、行不锁定**。", "- `=COUNTIF($A$2:$A$100, $A2)>1`：查找范围要绝对引用 `$A$2:$A$100`。", "- `=MOD(ROW(),2)=0`：ROW() 返回当前行号，隔行变色让大表格更易读。", "### 5.2 经典示例", "**示例 1：整行标红（金额 > 10000 的行整行变红）**", "选中 A2:D100，公式 `=$C2>10000`。`$C` 锁定列，`2` 不锁定行。", "**示例 2：标出重复值（内置规则只能标单元格，公式可标整行）**", "=COUNTIF($A$2:$A$100, $A2)>1", "A 列出现 2 次以上的，整行标黄。注意查找范围要绝对引用 `$A$2:$A$100`。", "**示例 3：隔行变色**", "=MOD(ROW(),2)=0", "偶数行上色。ROW() 返回当前行号，隔行变色让大表格更易读。", "### 5.3 L2-2 新增示例（逐一验算）", "**新增示例 1：整行高亮——库存低于安全库存的行标黄**", "库存表（A 列产品、B 列库存、C 列安全库存）：", "| 产品 | 库存 | 安全库存 | 是否高亮（公式 `=$B2<$C2`） |", "|---|---|---|---|", "| 空调 | 5 | 10 | 高亮（5 < 10） |", "| 洗衣机 | 12 | 10 | 不高亮（12 ≥ 10） |", "| 冰箱 | 8 | 10 | 高亮（8 < 10） |", "| 电视 | 20 | 10 | 不高亮（20 ≥ 10） |", "选中 A2:C5，新建公式规则 `=$B2<$C2`，格式设黄底。验算：4 行中 2 行满足 `库存 < 安全库存`（空调、冰箱），与上表一致。库存改动后高亮自动跟着变。", "**新增示例 2：跨表条件——订单表里标出黑名单客户**", "“黑名单”工作表 A2:A100 存着客户名（如张三、王五）；“订单”工作表 A 列是客户名。选中订单表 A2:D100，新建公式规则：", "=COUNTIF(黑名单!$A$2:$A$100, $A2)>0", "验算用订单 3 行：张三（黑名单中有，COUNTIF = 1 > 0，高亮）、李四（黑名单中无，COUNTIF = 0，不高亮）、王五（黑名单中有，COUNTIF = 1 > 0，高亮）。要点：跨表引用要带工作表名加感叹号（`黑名单!`），查找范围用绝对引用；黑名单表新增客户后，订单表高亮自动更新。", "**新增示例 3：到期提醒公式——合同到期分级提醒**", "合同表 A 列合同名、B 列到期日。假设今天是 2026-11-10，三条规则从高到低建，并给前两条勾选“如果为真则停止”：", "| 规则 | 公式 | 预期结果（今天 2026-11-10） |", "|---|---|---|", "| 已过期，深红加粗 | `=AND($B2<>\"\", $B2<TODAY())` | 合同丁到期 2026-11-05（已过 5 天），命中 |", "| 7 天内到期，红色 | `=AND($B2<>\"\", $B2-TODAY()<=7)` | 合同甲到期 2026-11-15（剩 5 天），命中 |", "| 30 天内到期，黄色 | `=AND($B2<>\"\", $B2-TODAY()<=30)` | 合同乙到期 2026-11-25（剩 15 天），命中；合同丙到期 2026-12-20（剩 40 天），不命中 |", "验算：2026-11-15 减 2026-11-10 得 5 天；2026-11-25 减 2026-11-10 得 15 天；2026-12-20 减 2026-11-10 得 40 天；2026-11-05 比今天早 5 天。4 行预期各不相同，与三条规则一一对应。`$B2<>\"\"` 的作用是空单元格不误报。", "### 5.4 实用案例", "**案例 1：到期提醒（合同／证件）**", "A 列是到期日。选中 A2:A100，新建公式规则：", "=AND($A2<>\"\", $A2-TODAY()<=30)", "30 天内到期标黄。想分三级？建三条规则：≤7 天红色、≤30 天黄色、已过期（`<TODAY()`）深红加粗（见 5.3 新增示例 3 的分级做法）。", "**案例 2：考勤异常整行标红**", "A：姓名 B：日期 C：状态。选中 A2:C500：", "=$C2=\"缺勤\"", "整行变红。迟到标黄再加一条 `=$C2=\"迟到\"`。", "**案例 3：数据录入实时校验**", "B 列填手机号（应为 11 位数字）。选中 B2:B1000：", "=OR(LEN($B2)<>11, NOT(ISNUMBER($B2+0)))", "位数不对或含字母，单元格变红——录入时立刻发现，不用事后检查。", "**案例 4：Top 3 高亮**", "A 列是销售额，想标出前 3 名：", "=$A2>=LARGE($A$2:$A$100, 3)", "LARGE 取第 3 大，大于等于它的都标金色。名次变化自动重标。", "**案例 5：周末列自动灰显**", "做排班表，B1:AF1 是日期。选中 B2:AF31：", "=WEEKDAY(B$1, 2)>5", "WEEKDAY 第二参数 2 表示周一=1……周日=7，>5 即周六日。`B$1` 行锁定（看第一行），列不锁定——整列一起灰掉。"], "scenarios": [{"title": "6.1 合同到期分级提醒", "body": "法务表几百份合同，A 列到期日。按 5.3 新增示例 3 建三条规则：已过期深红加粗、7 天内红色、30 天内黄色，高级别勾选“如果为真则停止”。每天打开表，最紧急的合同自己跳出来；合同续签改了日期后，颜色自动降级。"}, {"title": "6.2 考勤异常整行标红", "body": "人事每月收考勤表：姓名、日期、状态三列。公式 `=$C2=\"缺勤\"` 整行标红，`=$C2=\"迟到\"` 整行标黄。复核时只看有颜色的行，不用逐行扫状态列；下月新表直接格式刷刷过去，规则跟着走。"}], "pitfalls": [{"problem": "公式规则没有任何单元格变色", "cause": "公式是按选中区域左上角相对写的，引用锁错了", "solution": "检查 `$` 锁定：整行高亮要锁列不锁行（如 `=$C2>10000`）；逐行判断的公式里行号不能带 `$`"}, {"problem": "规则建好了，但只对第一个单元格生效", "cause": "应用范围只选了一个格", "solution": "在“管理规则”里把“应用于”改成整片区域（如 `=$A$2:$D$100`）"}, {"problem": "两条规则同时命中，颜色和预期不一样", "cause": "列表中靠上的规则优先，低级别盖住了高级别", "solution": "在“管理规则”里把高级别规则移到上面；分级提醒给高级别勾选“如果为真则停止”"}, {"problem": "跨表条件公式报错", "cause": "跨表引用缺工作表名，或表名含空格没加单引号", "solution": "引用写成 `黑名单!$A$2:$A$100`；表名含空格时写成 `'黑名单表'!$A$2:$A$100`"}, {"problem": "整列套复杂公式规则后表格变卡", "cause": "规则应用到整列（如 A:A），每格都重算公式", "solution": "把应用范围限定到具体区域（如 A2:A5000），不要用整列"}, {"problem": "复制粘贴后条件格式乱了", "cause": "格式刷或粘贴把规则范围带偏了", "solution": "粘贴后进“管理规则”检查“应用于”范围；跨表复制时复核 `$` 锁定对不对"}, {"problem": "打印时不想带颜色", "cause": "条件格式默认会打印", "solution": "在“页面设置”里关，或把规则应用范围避开打印区"}], "exercises": ["要把金额大于 5000 的整行标红，应该用什么规则、公式怎么写？", "数据条与色阶有什么区别？", "两个规则同时命中一个单元格，谁先生效？", "库存表里空调库存 5、安全库存 10，洗衣机库存 12、安全库存 10，公式 `=$B2<$C2` 会高亮哪几行？为什么？", "订单表的客户名在另一张“黑名单”表里出现时要整行标红，公式怎么写？跨表引用要注意什么？", "合同 2026-11-15 到期，假设今天是 2026-11-10，公式 `=AND($B2<>\"\", $B2-TODAY()<=7)` 会命中吗？算出剩余天数说明理由。"], "answers": ["用公式规则，公式 `=$C2>5000`（C 列是金额，$ 锁列不锁行），应用范围选整表。", "数据条按值长短显示条形；色阶按值大小显示颜色渐变。数据条适合看相对大小，色阶适合看分布。", "规则列表中靠上的优先；勾选“如果为真则停止”后不再往下判断。", "只高亮空调一行。空调 5 < 10 满足条件；洗衣机 12 ≥ 10 不满足。`$B2` 锁列不锁行，每行都拿本行的 B 列和 C 列比。", "公式 `=COUNTIF(黑名单!$A$2:$A$100, $A2)>0`。跨表引用要带工作表名加感叹号，查找范围用绝对引用；表名含空格时加单引号。", "会命中。2026-11-15 减 2026-11-10 得 5 天，5 ≤ 7 且 B2 非空，两个条件都满足。"], "versions": "Excel 2016／2019／2021／365（数据条／色阶／图标集需 2007+）"}, {"id": "data-validation", "group": "data-management", "column": "C05", "level2": "C05-L2-4", "title": "数据验证", "level": "进阶", "body": "", "steps": ["做下拉列表：选中单元格，“数据”→“数据验证”→允许选“序列”，来源填选项（英文逗号分隔）或引用清单区域，确定。", "做二级联动：先给每个一级选项的下级清单定义名称，再把二级下拉的来源填 `=INDIRECT($A$2)`（A2 是一级下拉所在格）。", "限制输入范围：选中区域，“数据”→“数据验证”→允许选“整数／小数／日期”，设好上下限；在“输入信息”里写提示，在“出错警告”里选“停止”。", "检查历史脏数据：“数据”→“数据验证”→“圈释无效数据”，红圈标出违规格，改完后点“清除无效数据标识”。", "锁公式、开放录入区：先选中录入区取消“锁定”，再“审阅”→“保护工作表”设密码，只保留“选定未锁定的单元格”。", "发模板前自查：按第 8 节防呆表清单逐项核对，最后圈释一遍确认无红圈再发。"], "sections": [{"title": "1. 数据验证是什么", "body": "「数据」→「数据验证」。它在**输入的那一刻**拦截不合法的值，而不是事后检查。\n三个可配置项：\n1. **设置**：允许输入什么（整数/小数/日期/序列/文本长度…）。\n2. **输入信息**：选中单元格时弹出的提示（\"请输入 1-100 的整数\"）——主动引导。\n3. **出错警告**：输错时的弹窗，样式可选\"停止\"（硬拦截）/\"警告\"（可继续）/\"信息\"（仅提醒）。"}, {"title": "2. 下拉列表（最常用）", "body": "### 固定选项\n选中单元格 → 数据验证 → 允许「序列」→ 来源填 `男,女`（中文逗号不行，必须用**英文逗号**分隔）。单元格右侧出现下拉箭头。\n### 引用区域\n来源填 `=$F$2:$F$10`（部门清单）。清单变了下拉自动变。建议把清单放在单独的\"基础数据\"表，隐藏起来。\n### 动态二级联动：选\"省\"后\"市\"跟着变\n这是数据验证的经典难题，标准解法是 **INDIRECT + 命名区域**：\n1. 准备对照表：A 列是省名（广东、江苏…），B 列开始每列是一个省的城市，第一行是省名。\n2. 给每个省的城市区域**定义名称**：选中广东的城市 → 名称框输入 `广东` → 回车。注意名称不能含空格，省名有空格先替换。"}, {"title": "3. 输入限制", "body": "自定义公式的心法和条件格式一样：**相对左上角写**。选中 B2:B100 后公式写 `=LEN(B2)=11`，表示\"本单元格长度必须 11\"。"}, {"title": "4. 圈释无效数据", "body": "数据验证只拦**新输入**，历史脏数据怎么办？「数据」→「数据验证」→「圈释无效数据」。所有违反规则的旧数据会被红圈圈出来，改完后「清除无效数据标识」去掉圈。\n用途：接手别人的表，先圈一遍，脏数据一目了然。"}, {"title": "5. 工作表保护：锁公式、开放录入区", "body": "场景：模板发给 20 个人填，只允许填黄色区域，公式列不许碰。\n1. **先解锁录入区**：选中允许填写的单元格 → 右键「设置单元格格式」→「保护」→ **取消勾选\"锁定\"**。默认所有单元格都是\"锁定\"状态，但不保护时锁无效。\n2. 「审阅」→「保护工作表」→ 设密码 → 勾选允许的操作（一般保留\"选定未锁定的单元格\"）。\n3. 效果： locked 的公式格点不进去，未锁定的可填。有人想改公式？弹密码框。\n取消：审阅 → 撤销工作表保护 → 输密码。"}, {"title": "6. 允许编辑区域：多人分工", "body": "保护工作表是一刀切，\"允许编辑区域\"可以**按区域设不同密码**：\n「审阅」→「允许编辑区域」→「新建」：\n- 区域 A1:B10，密码 111 → 销售部用密码 111 可改\n- 区域 C1:D10，密码 222 → 财务部用密码 222 可改\n每人只能改自己的区，保护工作表后依然有效。适合部门分工录入同一张表。"}], "source": "docs/data-management/04-data-validation.md", "updated": "2026-11-09", "file": "数据-人事考勤样本.xlsx", "objectives": ["用序列验证做下拉列表（含二级联动）", "用整数、日期验证限制输入范围", "用圈释无效数据检查已录入的违规值"], "formulas": [], "scenarios": [], "pitfalls": [{"problem": "复制粘贴后验证失效", "cause": "粘贴会连格式带验证一起覆盖，验证只拦手工输入", "solution": "事后用“圈释无效数据”检查；重要模板配合工作表保护"}, {"problem": "二级下拉选完一级后是空白", "cause": "二级来源的 INDIRECT 指向的名称不存在，或一级选项含空格", "solution": "检查名称是否存在，名称不能含空格，省名有空格先替换；二级来源写 `=INDIRECT($A$2)`"}, {"problem": "下拉选项只有一个且带逗号", "cause": "来源用了中文逗号分隔", "solution": "来源必须用英文逗号分隔，如 `男,女`"}, {"problem": "保护工作表后自己也改不了录入区", "cause": "保护前没取消录入区的“锁定”", "solution": "先取消录入区锁定再保护；已保护的先撤销保护重做"}, {"problem": "整数验证拦住了小数", "cause": "允许类型选了“整数”，输入带小数点", "solution": "需要小数时允许类型改选“小数”，再设范围"}, {"problem": "圈释后红圈去不掉", "cause": "只改了值没清除标识", "solution": "改完后点“数据”→“数据验证”→“清除无效数据标识”"}], "exercises": ["给一列设置\"只能输入 1 到 100 的整数\"，验证条件怎么设？", "为什么复制粘贴能绕过数据验证？事后怎么检查？", "下拉列表的来源写在哪里？想让下拉随清单增减自动扩展怎么办？"], "answers": ["数据→数据验证→允许选\"整数\"、数据选\"介于\"、最小值 1、最大值 100。", "粘贴会连格式带验证一起覆盖。用数据→数据验证→圈释无效数据，把违规格圈出来复核。", "来源写在某列区域或直接写 \"是,否\"；随清单扩展时把来源做成超级表列或动态名称。"], "versions": ""}, {"id": "pivot_adv-0", "group": "pivot_adv", "column": "C08", "level2": "C08-L2-2", "title": "基础操作", "level": "进阶", "body": "选中数据→插入→数据透视表。四个区：行、列、值、筛选。值字段默认求和，右键可改计数/平均/最大值。", "steps": [], "sections": [], "source": "站内数据 pivot_adv", "updated": "2026-11-09"}, {"id": "pivot_adv-1", "group": "pivot_adv", "column": "C08", "level2": "C08-L2-2", "title": "分组统计", "level": "进阶", "body": "日期右键→组合：按年/季度/月分组。数字右键→组合：按区间分组（如成绩段 60-70/70-80）。", "steps": [], "sections": [], "source": "站内数据 pivot_adv", "updated": "2026-11-09"}, {"id": "pivot_adv-2", "group": "pivot_adv", "column": "C08", "level2": "C08-L2-2", "title": "多维分析", "level": "进阶", "body": "行放「区域」、列放「季度」、值放「销售额」，一眼看交叉汇总。值显示方式→差异/百分比，做同比环比。", "steps": [], "sections": [], "source": "站内数据 pivot_adv", "updated": "2026-11-09"}, {"id": "pivot_adv-3", "group": "pivot_adv", "column": "C08", "level2": "C08-L2-2", "title": "切片器", "level": "进阶", "body": "插入切片器→选字段，点按钮即筛选，多表联动（报表连接）。比筛选直观 10 倍，汇报必备。", "steps": [], "sections": [], "source": "站内数据 pivot_adv", "updated": "2026-11-09"}, {"id": "pivot_adv-4", "group": "pivot_adv", "column": "C08", "level2": "C08-L2-2", "title": "时间轴", "level": "进阶", "body": "日期字段专用筛选器，按年/季度/月/日切换，比切片器更适合时间。", "steps": [], "sections": [], "source": "站内数据 pivot_adv", "updated": "2026-11-09"}, {"id": "pivot_adv-5", "group": "pivot_adv", "column": "C08", "level2": "C08-L2-2", "title": "数据模型", "level": "进阶", "body": "多表关联：把订单表+产品表都添加到数据模型，用字段关联，一张透视表跨表分析。Power Pivot 的地基。", "steps": [], "sections": [], "source": "站内数据 pivot_adv", "updated": "2026-11-09"}, {"id": "pq_adv-0", "group": "pq_adv", "column": "C09", "level2": "C09-L2-3", "title": "导入 CSV", "level": "进阶", "body": "数据→获取数据→从文本/CSV。乱码？改编码为 65001（UTF-8）或 936（GBK）。", "steps": [], "sections": [], "source": "站内数据 pq_adv", "updated": "2026-11-09"}, {"id": "pq_adv-1", "group": "pq_adv", "column": "C09", "level2": "C09-L2-3", "title": "导入网页", "level": "进阶", "body": "数据→自网站→粘贴 URL。网页表格结构变化时需重新检查步骤。", "steps": [], "sections": [], "source": "站内数据 pq_adv", "updated": "2026-11-09"}, {"id": "pq_adv-2", "group": "pq_adv", "column": "C09", "level2": "C09-L2-3", "title": "数据清洗", "level": "进阶", "body": "删空行、替换值、填充、修剪、分列、更改类型。每一步都记录在右侧「应用的步骤」，可回退。", "steps": [], "sections": [], "source": "站内数据 pq_adv", "updated": "2026-11-09"}, {"id": "pq_adv-3", "group": "pq_adv", "column": "C09", "level2": "C09-L2-3", "title": "合并表", "level": "进阶", "body": "追加查询=上下堆叠（多月数据合并）；合并查询=左右连接（VLOOKUP 的批量版）。", "steps": [], "sections": [], "source": "站内数据 pq_adv", "updated": "2026-11-09"}, {"id": "pq_adv-4", "group": "pq_adv", "column": "C09", "level2": "C09-L2-3", "title": "拆分列", "level": "进阶", "body": "按分隔符/字符数拆分。\"2026-10-01\" 按 \"-\" 拆成年/月/日三列。", "steps": [], "sections": [], "source": "站内数据 pq_adv", "updated": "2026-11-09"}, {"id": "pq_adv-5", "group": "pq_adv", "column": "C09", "level2": "C09-L2-3", "title": "自动刷新", "level": "进阶", "body": "关闭并上载后，源文件更新→右键刷新。还可设置打开文件自动刷新：数据→查询属性。", "steps": [], "sections": [], "source": "站内数据 pq_adv", "updated": "2026-11-09"}, {"id": "ppivot-0", "group": "ppivot", "column": "C10", "level2": "C10-L2-1", "title": "数据模型", "level": "专家", "body": "Power Pivot→添加到数据模型。多表不用 VLOOKUP，用关系关联，百万行不卡。", "steps": [], "sections": [], "source": "站内数据 ppivot", "updated": "2026-11-09"}, {"id": "ppivot-1", "group": "ppivot", "column": "C10", "level2": "C10-L2-1", "title": "多表关联", "level": "专家", "body": "关系视图拖线连主外键。一对多：产品表（1）→订单表（多）。", "steps": [], "sections": [], "source": "站内数据 ppivot", "updated": "2026-11-09"}, {"id": "ppivot-2", "group": "ppivot", "column": "C10", "level2": "C10-L2-1", "title": "DAX 公式入门", "level": "专家", "body": "DAX 长得像 Excel 函数但思维是列式。SUM(表[列])、CALCULATE(表达式, 筛选)、RELATED(取关联表字段)。", "steps": [], "sections": [], "source": "站内数据 ppivot", "updated": "2026-11-09"}, {"id": "ppivot-3", "group": "ppivot", "column": "C10", "level2": "C10-L2-1", "title": "常用 DAX", "level": "专家", "body": "总销售额 =SUM(订单[金额])\n当年累计 =CALCULATE([总销售额], DATESYTD(日期表[日期]))\n同比 =DIVIDE([总销售额]-[去年同期], [去年同期])", "steps": [], "sections": [], "source": "站内数据 ppivot", "updated": "2026-11-09"}, {"id": "ppivot-4", "group": "ppivot", "column": "C10", "level2": "C10-L2-1", "title": "KPI 指标", "level": "专家", "body": "在数据模型中建度量值：销售额、利润率、完成率。度量值随切片器自动重算，一处定义处处用。", "steps": [], "sections": [], "source": "站内数据 ppivot", "updated": "2026-11-09"}, {"id": "cfmt-0", "group": "cfmt", "column": "C06", "level2": "C06-L2-1", "title": "颜色标记", "level": "进阶", "body": "开始→条件格式→突出显示单元格规则：大于/小于/介于/等于，自动上色。", "steps": [], "sections": [], "source": "站内数据 cfmt", "updated": "2026-11-09"}, {"id": "cfmt-1", "group": "cfmt", "column": "C06", "level2": "C06-L2-1", "title": "数据条", "level": "进阶", "body": "在单元格内画横向条形图，数值大小一目了然。适合业绩对比。", "steps": [], "sections": [], "source": "站内数据 cfmt", "updated": "2026-11-09"}, {"id": "cfmt-2", "group": "cfmt", "column": "C06", "level2": "C06-L2-1", "title": "图标集", "level": "进阶", "body": "红绿灯/箭头/旗帜，按阈值自动打标。管理驾驶舱常用。", "steps": [], "sections": [], "source": "站内数据 cfmt", "updated": "2026-11-09"}, {"id": "cfmt-3", "group": "cfmt", "column": "C06", "level2": "C06-L2-1", "title": "自定义公式", "level": "进阶", "body": "新建规则→使用公式。注意 $ 锁定：=$B2>100 整行变色（选中整行时列锁定行不锁定）。", "steps": [], "sections": [], "source": "站内数据 cfmt", "updated": "2026-11-09"}, {"id": "cfmt-4", "group": "cfmt", "column": "C06", "level2": "C06-L2-1", "title": "案例：自动标红逾期", "level": "进阶", "body": "=AND($E2<TODAY(),$G2<>\"已完成\") → 逾期未完成的整行变红。", "steps": [], "sections": [], "source": "站内数据 cfmt", "updated": "2026-11-09"}, {"id": "cfmt-5", "group": "cfmt", "column": "C06", "level2": "C06-L2-1", "title": "案例：高亮重复", "level": "进阶", "body": "选中区域→条件格式→突出显示→重复值。或公式 =COUNTIF($A:$A,$A2)>1 自定义颜色。", "steps": [], "sections": [], "source": "站内数据 cfmt", "updated": "2026-11-09"}, {"id": "dval-0", "group": "dval", "column": "C05", "level2": "C05-L2-4", "title": "下拉菜单", "level": "入门", "body": "数据→数据验证→序列，来源输入：男,女（英文逗号）。或引用一列区域。", "steps": [], "sections": [], "source": "站内数据 dval", "updated": "2026-11-09"}, {"id": "dval-1", "group": "dval", "column": "C05", "level2": "C05-L2-4", "title": "联动下拉框", "level": "入门", "body": "一级菜单选「省份」→二级自动出该省城市。做法：定义名称+INDIRECT($A2)。先做各省名单，再建一级下拉，二级来源 =INDIRECT(A2)。", "steps": [], "sections": [], "source": "站内数据 dval", "updated": "2026-11-09"}, {"id": "dval-2", "group": "dval", "column": "C05", "level2": "C05-L2-4", "title": "日期限制", "level": "入门", "body": "数据验证→日期→介于 2026-1-1 到 2026-12-31，只能输今年日期。", "steps": [], "sections": [], "source": "站内数据 dval", "updated": "2026-11-09"}, {"id": "dval-3", "group": "dval", "column": "C05", "level2": "C05-L2-4", "title": "输入规则", "level": "入门", "body": "整数/小数/文本长度：手机号设文本长度=11；年龄设整数介于 18-65。出错警告可自定义提示语。", "steps": [], "sections": [], "source": "站内数据 dval", "updated": "2026-11-09"}, {"id": "dval-4", "group": "dval", "column": "C05", "level2": "C05-L2-4", "title": "圈释无效数据", "level": "入门", "body": "数据→数据验证→圈释无效数据，已有违规的一眼现形。", "steps": [], "sections": [], "source": "站内数据 dval", "updated": "2026-11-09"}, {"id": "choose", "group": "charts", "column": "C07", "level2": "C07-L2-1", "title": "图表类型选择指南", "level": "进阶", "body": "比较大小用柱状图/条形图，看趋势用折线图，看占比用饼图/环形图（类别≤6），看关系用散点图/气泡图，看分布用直方图/箱线图。双坐标用组合图。记住：一图只讲一件事。", "steps": [], "sections": [], "source": "站内数据 charts", "updated": "2026-11-09"}, {"id": "make", "group": "charts", "column": "C07", "level2": "C07-L2-1", "title": "图表制作步骤", "level": "进阶", "body": "选中数据→插入→选图表类型→切换行列（数据反了就点它）→添加数据标签→调坐标轴。数据源：右键→选择数据，可增删系列。", "steps": [], "sections": [], "source": "站内数据 charts", "updated": "2026-11-09"}, {"id": "beauty", "group": "charts", "column": "C07", "level2": "C07-L2-1", "title": "图表美化技巧", "level": "高级", "body": "删网格线、删图例（直接标数据）、统一配色（莫兰迪/商务蓝）、加粗标题讲结论、坐标轴从 0 开始（柱状图）。少即是多：每删一个元素，图表清晰一度。", "steps": [], "sections": [], "source": "站内数据 charts", "updated": "2026-11-09"}, {"id": "dynamic", "group": "charts", "column": "C07", "level2": "C07-L2-1", "title": "动态图表", "level": "高级", "body": "下拉菜单联动图表：数据验证做下拉→INDEX+MATCH 取数→图表数据源引用。用复选框控制系列显示。用 OFFSET 做动态区域，新增数据自动进图。", "steps": [], "sections": [], "source": "站内数据 charts", "updated": "2026-11-09"}, {"id": "scenario-0", "group": "scenarios", "column": "C13", "level2": "C13-L2-3", "title": "财务报销统计", "level": "进阶", "body": "每月上百条报销记录，自动汇总到部门/类别", "steps": [], "sections": [], "source": "站内数据 scenarios", "updated": "2026-11-09"}, {"id": "scenario-1", "group": "scenarios", "column": "C13", "level2": "C13-L2-3", "title": "销售业绩分析", "level": "高级", "body": "销售明细表 → 自动排名、环比、Top10", "steps": [], "sections": [], "source": "站内数据 scenarios", "updated": "2026-11-09"}, {"id": "scenario-2", "group": "scenarios", "column": "C13", "level2": "C13-L2-3", "title": "人事考勤统计", "level": "进阶", "body": "打卡记录 → 迟到/早退/缺勤自动统计", "steps": [], "sections": [], "source": "站内数据 scenarios", "updated": "2026-11-09"}, {"id": "scenario-3", "group": "scenarios", "column": "C13", "level2": "C13-L2-3", "title": "库存预警管理", "level": "高级", "body": "出入库流水 → 实时库存 + 低库存预警", "steps": [], "sections": [], "source": "站内数据 scenarios", "updated": "2026-11-09"}, {"id": "scenario-4", "group": "scenarios", "column": "C13", "level2": "C13-L2-3", "title": "经营仪表盘", "level": "专家", "body": "一页看懂公司经营：KPI 卡片 + 趋势图 + 明细", "steps": [], "sections": [], "source": "站内数据 scenarios", "updated": "2026-11-09"}, {"id": "basics-01-getting-started", "group": "basics", "column": "C01", "level2": "C01-L2-1", "title": "认识 Excel：界面、工作簿与工作表", "level": "入门", "body": "**工作簿与工作表**：一个 Excel 文件就是一个工作簿（Workbook），扩展名通常是 `.xlsx`；工作簿里可以放多张工作表（Worksheet），底部的工作表标签就是各张表的入口。日常说的\"打开一张表\"，多数时候是指打开一个工作簿里的一张工作表。\n\n**功能区（Ribbon）**：窗口顶部的带状工具栏，由\"选项卡＋命令组\"构成。\"开始\"选项卡放最常用的字体、对齐、数字格式；\"插入\"放图表、数据透视表；\"公式\"放函数库；\"数据\"放排序、筛选、分列、获取数据。找不到某个命令时，先想它属于哪类操作，再去对应选项卡找，比满屏乱点快得多。\n\n**单元格与名称框**：行列交叉处就是单元格，用列字母＋行号定位，如 `B3` 表示 B 列第 3 行。左上角的名称框显示当前选中单元格的地址，直接输入 `D20` 回车即可跳转到 D20；输入 `B2:B10` 回车可一次选中一个区域。\n\n**文件格式**：`.xlsx` 是不含宏的常规工作簿；`.xlsm` 是启用宏的工作簿，含 VBA 代码时必须存为此格式，否则宏会被丢弃；`.xls` 是 2003 及更早版本的旧格式，功能受限，新文件不要用它；`.csv` 只有纯文本数据，无格式、无公式、无多表，导出给其他系统时常用。\n\n**视图与窗口**：普通视图是日常编辑视图；页面布局视图按打印效果显示，能看到页边距与页眉页脚；分页预览用蓝色虚线标出打印分页，调打印区域时用它最直观。冻结窗格（视图→冻结窗格）可以把标题行固定在屏幕上方，滚动大表时标题不跑丢。", "steps": ["打开 Excel：开始屏幕选\"空白工作簿\"，或按 `Ctrl + N` 新建一个空白工作簿。", "认识界面：顶部是功能区，左上角是名称框，底部是工作表标签，右侧与底部是滚动条；选中任一单元格，看名称框显示它的地址。", "保存文件：按 `Ctrl + S`，第一次保存会弹出对话框，选位置、起名字、确认格式为\"Excel 工作簿（*.xlsx）\"后保存；此后每改动一次就按一次 `Ctrl + S`。", "管理工作表：右键底部工作表标签可重命名、移动、复制、隐藏、删除；点标签右侧的 `+` 号新建一张工作表；双击标签可直接改名。", "切换视图：视图选项卡里点\"页面布局\"看打印效果，点\"分页预览\"看分页线，点\"普通\"回到编辑视图；用\"视图→冻结窗格→冻结首行\"把标题行固定。", "关闭前检查：确认标题栏没有星号（未保存标记）或已按 `Ctrl + S`；含公式的工作簿关闭时如弹出\"是否保存\"，点\"保存\"。"], "sections": [{"title": "2. 基础概念", "body": "**工作簿与工作表**：一个 Excel 文件就是一个工作簿（Workbook），扩展名通常是 `.xlsx`；工作簿里可以放多张工作表（Worksheet），底部的工作表标签就是各张表的入口。日常说的\"打开一张表\"，多数时候是指打开一个工作簿里的一张工作表。\n\n**功能区（Ribbon）**：窗口顶部的带状工具栏，由\"选项卡＋命令组\"构成。\"开始\"选项卡放最常用的字体、对齐、数字格式；\"插入\"放图表、数据透视表；\"公式\"放函数库；\"数据\"放排序、筛选、分列、获取数据。找不到某个命令时，先想它属于哪类操作，再去对应选项卡找，比满屏乱点快得多。\n\n**单元格与名称框**：行列交叉处就是单元格，用列字母＋行号定位，如 `B3` 表示 B 列第 3 行。左上角的名称框显示当前选中单元格的地址，直接输入 `D20` 回车即可跳转到 D20；输入 `B2:B10` 回车可一次选中一个区域。\n\n**文件格式**：`.xlsx` 是不含宏的常规工作簿；`.xlsm` 是启用宏的工作簿，含 VBA 代码时必须存为此格式，否则宏会被丢弃；`.xls` 是 2003 及更早版本的旧格式，功能受限，新文件不要用它；`.csv` 只有纯文本数据，无格式、无公式、无多表，导出给其他系统时常用。\n\n**视图与窗口**：普通视图是日常编辑视图；页面布局视图按打印效果显示，能看到页边距与页眉页脚；分页预览用蓝色虚线标出打印分页，调打印区域时用它最直观。冻结窗格（视图→冻结窗格）可以把标题行固定在屏幕上方，滚动大表时标题不跑丢。"}, {"title": "4. 图文示例", "body": "新建一个\"一周开支记录\"工作簿练手：A1 输入\"日期\"，B1 输入\"项目\"，C1 输入\"金额\"；A2:A4 依次输入 11 月 2 日、11 月 3 日、11 月 4 日，B2:B4 输入\"午餐\"、\"交通\"、\"文具\"，C2:C4 输入 28、15、36。选中 C2:C4，在开始选项卡把数字格式设为\"货币\"；把工作表标签重命名为\"开支\"，再点 `+` 新建一张表改名\"汇总\"；最后 `Ctrl + S` 存为\"开支记录.xlsx\"。\n\n（截图位：待补图）"}], "source": "docs/basics/01-getting-started.md", "updated": "2026-11-09", "objectives": ["说出功能区六大选项卡（开始、插入、页面布局、公式、数据、审阅）各自的用途", "新建、保存与重命名工作簿，并区分 .xlsx 与 .xlsm 两种文件格式", "在同一个工作簿内新建、重命名、移动、隐藏与删除工作表", "切换普通视图、页面布局视图与分页预览，冻结窗格查看大表"], "formulas": ["=SUM(C2:C4) → 79", "=AVERAGE(C2:C4) → 26.33", "=MAX(C2:C4) → 36", "- `=SUM(C2:C4)` → 79：C2:C4 求和：28+15+36=79，本周三天开支合计", "- `=AVERAGE(C2:C4)` → 26.33：三天日均开支 79÷3≈26.33（保留两位小数）", "- `=MAX(C2:C4)` → 36：单笔最大开支是文具 36 元"], "scenarios": [{"title": "新人第一天：接手同事的报表", "body": "同事发来一个工作簿，底部有 5 张表。先别急着改：点每张表看标题行（冻结窗格帮你定位），用 `Ctrl + End` 跳到每张表的已用区域右下角，确认数据范围；再用名称框跳到关键单元格核对。看懂结构再动手，比直接改少踩一半坑。"}, {"title": "月度报表：每月新建一张表", "body": "每月一张表的做法是：右键上月工作表→\"移动或复制\"→勾选\"建立副本\"，再把副本改名为本月（如\"11 月\"），清空旧数据保留格式与公式。这样表结构与汇总公式每月一致，汇总表用跨表引用（如 `='11月'!C10`）一次取数。"}], "pitfalls": [{"problem": "保存后公式没了", "cause": "存成了 .csv 或旧 .xls 格式", "solution": "另存为时选\"Excel 工作簿（*.xlsx）\"；需要宏才用 .xlsm"}, {"problem": "找不到某个命令", "cause": "在错误的选项卡里找", "solution": "先定性：格式类去\"开始\"，函数类去\"公式\"，数据类去\"数据\"；再用左上角搜索框搜命令名"}, {"problem": "滚动后标题行看不见", "cause": "没有冻结窗格", "solution": "选中标题行下一行，视图→冻结窗格→冻结拆分窗格"}, {"problem": "工作表标签找不到了", "cause": "工作表被隐藏", "solution": "右键任一标签→取消隐藏，勾选要恢复的表"}], "exercises": ["新建一个工作簿，把 Sheet1 改名为\"练习\"，再新建一张表改名为\"备份\"，保存为 .xlsx 格式。名称框输入 D20 会跳到哪里？", "A1:A5 依次是 10、20、30、40、50，用公式求和与求平均，结果分别是多少？", "同事发来的文件是 .csv，打开后发现数字格式与多张表都没了，为什么？"], "answers": ["跳到 D 列第 20 行的 D20 单元格。名称框输入地址回车即跳转，与鼠标点选等价。", "求和 `=SUM(A1:A5)` → 150；平均 `=AVERAGE(A1:A5)` → 30。验算：10+20+30+40+50=150，150÷5=30。", ".csv 只存纯文本数据，不存格式、公式与多张工作表。应请对方发 .xlsx 原文件；.csv 只适合在系统之间导数据。"], "versions": "Excel 2016／2019／2021／365"}, {"id": "basics-02-data-entry", "group": "basics", "column": "C01", "level2": "C01-L2-2", "title": "数据录入与编辑：输入技巧、填充柄与复制粘贴", "level": "入门", "body": "**自动识别**：Excel 按输入内容猜类型——纯数字进数值、带 `-` 或 `/` 的进日期、其余进文本。身份证号、银行卡号这类长数字串会被当成数值并用科学计数法显示，必须先把单元格设为文本格式，或先输入英文单引号 `'` 再输数字。\n\n**填充柄**：选中单元格右下角的小方块就是填充柄，拖动它可向下/向右复制或按规律填充。拖动后右下角会出现\"自动填充选项\"小图标，可切换\"复制单元格\"、\"填充序列\"、\"仅填充格式\"等模式。\n\n**复制粘贴专项**：`Ctrl + C` 复制的是内容＋格式＋公式。只想粘其中一部分时用\"选择性粘贴\"（右键→选择性粘贴，或开始→粘贴下拉）：\"数值\"只粘结果不粘公式，\"格式\"只粘样式，\"转置\"把行列互换。\n\n**查找替换**：`Ctrl + H` 打开查找替换，可批量改错别字、统一部门名。点\"选项\"可限定\"单元格匹配\"（整格相等才换，避免\"销售部\"被\"销售\"替换误伤）与\"区分大小写\"。`Ctrl + F` 只查找不替换。\n\n**定位条件**：`F5`→\"定位条件\"可一次选中某类单元格：全部空值（批量填\"待补\"）、全部公式（检查公式区）、全部常量。配合 `Ctrl + Enter` 可对所有选中格一次填入相同内容。", "steps": ["输入长数字：先选中区域，开始→数字格式下拉选\"文本\"，再输入身份证号等长数字；或先输 `'` 再输数字。", "快速填序号：在 A2 输入 1，A3 输入 2，选中 A2:A3 拖填充柄向下，即得连续序号；或在 A2 输入 1 后用开始→填充→序列，设步长值 1。", "填日期序列：在 A2 输入 2026-11-02，拖填充柄向下即逐日递增；按住右键拖填充柄松开，可选\"按工作日填充\"（跳过周末）。", "只粘数值：复制带公式的区域，右键目标格→选择性粘贴→数值；或粘贴后点右下角粘贴选项选\"值\"。", "批量修正：按 `Ctrl + H`，查找\"销售一部\"、替换为\"销售部\"，点\"全部替换\"；核对替换条数是否与预期一致。", "批量填空值：选中区域按 `F5`→定位条件→空值→确定，输入内容后按 `Ctrl + Enter`，所有空值一次填好。"], "sections": [{"title": "2. 基础概念", "body": "**自动识别**：Excel 按输入内容猜类型——纯数字进数值、带 `-` 或 `/` 的进日期、其余进文本。身份证号、银行卡号这类长数字串会被当成数值并用科学计数法显示，必须先把单元格设为文本格式，或先输入英文单引号 `'` 再输数字。\n\n**填充柄**：选中单元
