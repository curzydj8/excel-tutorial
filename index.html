单元格", "solution": "选中 Python 单元格，在公式栏查看代码；点对象卡片看详情与报错信息"}], "exercises": ["说出 Python in Excel 里代码是在哪里运行的（本机还是云端），以及这对联网有什么要求。", "写出引用区域 A1:G13（含标题行）并返回 DataFrame 的 `xl()` 调用；如果忘了加 `headers=True`，读到的 DataFrame 会有什么不同？", "判断：同事用买断版 Excel 2021 打开含有 `=PY()` 公式的你发去的文件，能正常重算吗？为什么？", "用 `=PY()` 写一个公式，算出订单表里“金额”列的总和，并说出输出类型选 Python 对象与选 Excel 值时，单元格分别显示什么。", "用 `=PY()` 写一个公式，按产品分组算销售额，并写出电脑一行的预期结果；再用本地 pandas 等价代码跑一遍，核对数字是否一致。", "解释以下两个限制各会带来什么实际影响：（1）`pandas.read_excel` 在 Python in Excel 里不可用；（2）标准算力下只有自动重算模式。"], "answers": ["代码在微软云端运行（由 Anaconda 提供运行环境），不是在本机运行。因此必须联网，且须开启 Microsoft 365 联网体验；断网时 Python 单元格无法计算。", "`xl(\"A1:G13\", headers=True)`。忘了加 `headers=True`，第一行标题（订单号、日期……）会被当成第一行数据，列名变成 0、1、2 这样的数字，后续 `df[\"金额\"]` 会报 KeyError。", "不能。买断版 Excel 2021 不支持 Python in Excel（见第 2.3 节版本表）；对方打开文件只能看，不能重算 Python 单元格，单元格会显示错误。发给对方前应把输出切换为 Excel 值并粘贴为数值。", "公式见示例 1：`=PY(df = xl(\"A1:G13\", headers=True); df[\"金额\"].sum())`，结果 75600。选 Python 对象时单元格显示对象卡片（一个数值对象）；选 Excel 值时单元格直接显示 75600，可以被其他公式引用。", "公式见示例 2：`=PY(df = xl(\"A1:G13\", headers=True); df.groupby(\"产品\")[\"金额\"].sum())`。电脑一行预期 40000（10000+5000+15000+10000）。本地 pandas 等价代码见示例 2 的本地等价代码，跑出电脑 40000、五产品合计 75600，与预期一致。", "（1）`pandas.read_excel` 不可用意味着不能在 `=PY()` 里直接读磁盘上的文件，数据必须先放进工作表再用 `xl()` 引用；已有的本地 Python 脚本不能原样粘进 `=PY()` 单元格。（2）只有自动重算意味着数据一改就触发云端重算，大表或多个 Python 公式时会反复计算、速度受限；想要手动控制重算时机或更快速度，需购买附加许可证。"], "versions": "仅 Microsoft 365，不支持买断版 Excel 2021／2024 与 Office LTSC；企业与商业用户 Windows 当前频道 2408 版（内部版本 17928.20114）起、网页版 Excel；Mac 企业与商业用户当前频道 16.96 版（内部版本 25041326）起；家庭与个人用户为预览版（见第 2.3 节版本表，口径以 Microsoft 支持文档为准）", "file": "Python-in-excel-demo.py"}], "func_tutorials": {"AND": ["案例：自动标红逾期", "VBA 进阶：用户窗体、类模块、加载宏与错误处理进阶", "Office Scripts 入门：不用 VBA 也能让 Excel 自己干活"], "AVERAGE": ["公式入门：公式结构、运算符与输入编辑", "DAX 基础：语法、计算列与度量值、行上下文与筛选上下文"], "COLUMN": ["DAX 基础：语法、计算列与度量值、行上下文与筛选上下文", "TypeScript 基础：写出你的第一段 Office Scripts 代码", "openpyxl：用 Python 读写 Excel 工作簿"], "CONCAT": ["版本与兼容：从 Excel 2003 到 Microsoft 365"], "COUNT": ["数组公式", "案例：高亮重复", 函数 返回今天的日期 TODAY()", "section": "func", "ref": "TODAY"}, {"id": "func-WEEKDAY", "type": "function", "column": "C04", "title": "WEEKDAY 星期几", "text": "WEEKDAY 星期几 日期与时间函数 返回星期几 WEEKDAY(日期, [类型])", "section": "func", "ref": "WEEKDAY"}, {"id": "func-WORKDAY", "type": "function", "column": "C04", "title": "WORKDAY 工作日推算", "text": "WORKDAY 工作日推算 日期与时间函数 返回 N 个工作日之后/之前的日期 WORKDAY(开始日期, 天数, [节假日区域])", "section": "func", "ref": "WORKDAY"}, {"id": "func-YEAR", "type": "function", "column": "C04", "title": "YEAR 提取年份", "text": "YEAR 提取年份 日期与时间函数 提取年份 YEAR(日期)", "section": "func", "ref": "YEAR"}, {"id": "func-AND", "type": "function", "column": "C04", "title": "AND 并且", "text": "AND 并且 逻辑函数 并且：所有条件都成立才为真 AND(条件1, [条件2], ...)", "section": "func", "ref": "AND"}, {"id": "func-IF", "type": "function", "column": "C04", "title": "IF 条件判断", "text": "IF 条件判断 逻辑函数 如果…就…否则…，最常用的逻辑判断 IF(条件, [条件成立的值], [条件不成立的值])", "section": "func", "ref": "IF"}, {"id": "func-IFERROR", "type": "function", "column": "C04", "title": "IFERROR 容错处理", "text": "IFERROR 容错处理 逻辑函数 出错时显示指定内容，告别 #N/A 满屏 IFERROR(公式, 出错时返回的值)", "section": "func", "ref": "IFERROR"}, {"id": "func-IFNA", "type": "function", "column": "C04", "title": "IFNA 处理 #N/A", "text": "IFNA 处理 #N/A 逻辑函数 只处理 #N/A 错误 IFNA(公式, 为#N/A时返回的值)", "section": "func", "ref": "IFNA"}, {"id": "func-IFS", "type": "function", "column": "C04", "title": "IFS 多条件判断", "text": "IFS 多条件判断 逻辑函数 多条件判断（IF 的嵌套升级版） IFS(条件1, 值1, [条件2, 值2], ...)", "section": "func", "ref": "IFS"}, {"id": "func-LET", "type": "function", "column": "C04", "title": "LET 定义名称", "text": "LET 定义名称 逻辑函数 给公式中的重复计算起个名字，提高可读性 LET(名称1, 值1, [名称2, 值2], ..., 计算式)", "section": "func", "ref": "LET"}, {"id": "func-NOT", "type": "function", "column": "C04", "title": "NOT 取反", "text": "NOT 取反 逻辑函数 取反 NOT(逻辑值)", "section": "func", "ref": "NOT"}, {"id": "func-OR", "type": "function", "column": "C04", "title": "OR 或者", "text": "OR 或者 逻辑函数 或者：任一条件成立即为真 OR(条件1, [条件2], ...)", "section": "func", "ref": "OR"}, {"id": "func-SWITCH", "type": "function", "column": "C04", "title": "SWITCH 多值匹配", "text": "SWITCH 多值匹配 逻辑函数 多值匹配，比嵌套 IF 清晰 SWITCH(表达式, 值1, 结果1, [值2, 结果2], ..., [默认值])", "section": "func", "ref": "SWITCH"}, {"id": "func-XOR", "type": "function", "column": "C04", "title": "XOR 异或", "text": "XOR 异或 逻辑函数 异或：奇数个真才为真 XOR(条件1, [条件2], ...)", "section": "func", "ref": "XOR"}, {"id": "func-CHOOSE", "type": "function", "column": "C04", "title": "CHOOSE 按序号取值", "text": "CHOOSE 按序号取值 查找与引用函数 按序号从列表中取值 CHOOSE(序号, 值1, 值2, ...)", "section": "func", "ref": "CHOOSE"}, {"id": "func-COLUMN", "type": "function", "column": "C04", "title": "COLUMN 返回列号", "text": "COLUMN 返回列号 查找与引用函数 返回列号 COLUMN([单元格])", "section": "func", "ref": "COLUMN"}, {"id": "func-FILTER", "type": "function", "column": "C04", "title": "FILTER 动态筛选", "text": "FILTER 动态筛选 查找与引用函数 动态数组：按条件筛选（新函数） FILTER(数组, 筛选条件, [无结果时显示])", "section": "func", "ref": "FILTER"}, {"id": "func-HLOOKUP", "type": "function", "column": "C04", "title": "HLOOKUP 横向查找", "text": "HLOOKUP 横向查找 查找与引用函数 横向查找（VLOOKUP 的横版） HLOOKUP(查找值, 表格区域, 返回第几行, [精确/模糊匹配])", "section": "func", "ref": "HLOOKUP"}, {"id": "func-INDEX", "type": "function", "column": "C04", "title": "INDEX 按行列号取值", "text": "INDEX 按行列号取值 查找与引用函数 按行列号取区域中的值 INDEX(区域, 行号, [列号])", "section": "func", "ref": "INDEX"}, {"id": "func-INDIRECT", "type": "function", "column": "C04", "title": "INDIRECT 文本转引用", "text": "INDIRECT 文本转引用 查找与引用函数 把文本转成引用，实现动态引用 INDIRECT(文本地址, [A1样式])", "section": "func", "ref": "INDIRECT"}, {"id": "func-MATCH", "type": "function", "column": "C04", "title": "MATCH 查找位置序号", "text": "MATCH 查找位置序号 查找与引用函数 找某个值在区域中的位置 MATCH(查找值, 查找区域, [匹配类型])", "section": "func", "ref": "MATCH"}, {"id": "func-OFFSET", "type": "function", "column": "C04", "title": "OFFSET 偏移引用", "text": "OFFSET 偏移引用 查找与引用函数 以某个单元格为基准偏移取区域 OFFSET(基准单元格, 下移行数, 右移列数, [高度], [宽度])", "section": "func", "ref": "OFFSET"}, {"id": "func-ROW", "type": "function", "column": "C04", "title": "ROW 返回行号", "text": "ROW 返回行号 查找与引用函数 返回行号 ROW([单元格])", "section": "func", "ref": "ROW"}, {"id": "func-SORT", "type": "function", "column": "C04", "title": "SORT 动态排序", "text": "SORT 动态排序 查找与引用函数 动态数组：自动排序（新函数） SORT(数组, [排序列], [升/降序], [按行/列])", "section": "func", "ref": "SORT"}, {"id": "func-TRANSPOSE", "type": "function", "column": "C04", "title": "TRANSPOSE 行列转置", "text": "TRANSPOSE 行列转置 查找与引用函数 行列转置 TRANSPOSE(数组)", "section": "func", "ref": "TRANSPOSE"}, {"id": "func-UNIQUE", "type": "function", "column": "C04", "title": "UNIQUE 去重取唯一值", "text": "UNIQUE 去重取唯一值 查找与引用函数 动态数组：去重取唯一值（新函数） UNIQUE(数组, [按列], [只取唯一值])", "section": "func", "ref": "UNIQUE"}, {"id": "func-VLOOKUP", "type": "function", "column": "C04", "title": "VLOOKUP 纵向查找", "text": "VLOOKUP 纵向查找 查找与引用函数 纵向查找：按关键字在表格中找对应值 VLOOKUP(查找值, 表格区域, 返回第几列, [精确/模糊匹配])", "section": "func", "ref": "VLOOKUP"}, {"id": "func-XLOOKUP", "type": "function", "column": "C04", "title": "XLOOKUP 新一代查找", "text": "XLOOKUP 新一代查找 查找与引用函数 新一代查找：VLOOKUP 的完美替代品 XLOOKUP(查找值, 查找区域, 返回区域, [未找到时], [匹配模式], [搜索模式])", "section": "func", "ref": "XLOOKUP"}, {"id": "func-AVERAGEIF", "type": "function", "column": "C04", "title": "AVERAGEIF 条件平均", "text": "AVERAGEIF 条件平均 统计函数 条件平均：只对满足条件的求平均 AVERAGEIF(条件区域, 条件, [平均区域])", "section": "func", "ref": "AVERAGEIF"}, {"id": "func-AVERAGEIFS", "type": "function", "column": "C04", "title": "AVERAGEIFS 多条件平均", "text": "AVERAGEIFS 多条件平均 统计函数 多条件平均 AVERAGEIFS(平均区域, 条件区域1, 条件1, ...)", "section": "func", "ref": "AVERAGEIFS"}, {"id": "func-COUNT", "type": "function", "column": "C04", "title": "COUNT 计数", "text": "COUNT 计数 统计函数 计数：数一数有多少个数字 COUNT(数值1, [数值2], ...)", "section": "func", "ref": "COUNT"}, {"id": "func-COUNTA", "type": "function", "column": "C04", "title": "COUNTA 数非空单元格", "text": "COUNTA 数非空单元格 统计函数 计数：数一数有多少个非空单元格 COUNTA(数值1, [数值2], ...)", "section": "func", "ref": "COUNTA"}, {"id": "func-COUNTBLANK", "type": "function", "column": "C04", "title": "COUNTBLANK 数空单元格", "text": "COUNTBLANK 数空单元格 统计函数 数一数有多少个空单元格 COUNTBLANK(区域)", "section": "func", "ref": "COUNTBLANK"}, {"id": "func-COUNTIF", "type": "function", "column": "C04", "title": "COUNTIF 条件计数", "text": "COUNTIF 条件计数 统计函数 条件计数：满足条件的有几个 COUNTIF(条件区域, 条件)", "section": "func", "ref": "COUNTIF"}, {"id": "func-COUNTIFS", "type": "function", "column": "C04", "title": "COUNTIFS 多条件计数", "text": "COUNTIFS 多条件计数 统计函数 多条件计数 COUNTIFS(条件区域1, 条件1, [条件区域2, 条件2], ...)", "section": "func", "ref": "COUNTIFS"}, {"id": "func-LARGE", "type": "function", "column": "C04", "title": "LARGE 取第 N 大", "text": "LARGE 取第 N 大 统计函数 取第 N 大的值 LARGE(数组, k)", "section": "func", "ref": "LARGE"}, {"id": "func-MAX", "type": "function", "column": "C04", "title": "MAX 取最大值", "text": "MAX 取最大值 统计函数 取最大值 MAX(数值1, [数值2], ...)", "section": "func", "ref": "MAX"}, {"id": "func-MEDIAN", "type": "function", "column": "C04", "title": "MEDIAN 取中位数", "text": "MEDIAN 取中位数 统计函数 取中位数 MEDIAN(数值1, [数值2], ...)", "section": "func", "ref": "MEDIAN"}, {"id": "func-MIN", "type": "function", "column": "C04", "title": "MIN 取最小值", "text": "MIN 取最小值 统计函数 取最小值 MIN(数值1, [数值2], ...)", "section": "func", "ref": "MIN"}, {"id": "func-MODE", "type": "function", "column": "C04", "title": "MODE 取众数", "text": "MODE 取众数 统计函数 取众数 MODE(数值1, [数值2], ...)", "section": "func", "ref": "MODE"}, {"id": "func-RANK", "type": "function", "column": "C04", "title": "RANK 排名", "text": "RANK 排名 统计函数 排名 RANK(数值, 引用区域, [排序方式])", "section": "func", "ref": "RANK"}, {"id": "func-SMALL", "type": "function", "column": "C04", "title": "SMALL 取第 N 小", "text": "SMALL 取第 N 小 统计函数 取第 N 小的值 SMALL(数组, k)", "section": "func", "ref": "SMALL"}, {"id": "func-STDEV", "type": "function", "column": "C04", "title": "STDEV 标准差", "text": "STDEV 标准差 统计函数 标准差（样本） STDEV(数值1, [数值2], ...)", "section": "func", "ref": "STDEV"}, {"id": "func-VAR", "type": "function", "column": "C04", "title": "VAR 方差", "text": "VAR 方差 统计函数 方差（样本） VAR(数值1, [数值2], ...)", "section": "func", "ref": "VAR"}, {"id": "func-DB", "type": "function", "column": "C04", "title": "DB 余额递减折旧", "text": "DB 余额递减折旧 财务函数 余额递减折旧法 DB(原值, 残值, 使用年限, 第几年, [首年月份数])", "section": "func", "ref": "DB"}, {"id": "func-FV", "type": "function", "column": "C04", "title": "FV 终值", "text": "FV 终值 财务函数 终值：现在存钱未来值多少 FV(利率, 期数, 每期付款, [现值], [类型])", "section": "func", "ref": "FV"}, {"id": "func-IRR", "type": "function", "column": "C04", "title": "IRR 内部收益率", "text": "IRR 内部收益率 财务函数 内部收益率 IRR(现金流数组, [预估值])", "section": "func", "ref": "IRR"}, {"id": "func-NPER", "type": "function", "column": "C04", "title": "NPER 期数", "text": "NPER 期数 财务函数 期数 NPER(利率, 每期付款, 现值, [终值], [类型])", "section": "func", "ref": "NPER"}, {"id": "func-NPV", "type": "function", "column": "C04", "title": "NPV 净现值", "text": "NPV 净现值 财务函数 净现值：评估投资值不值 NPV(利率, 现金流1, [现金流2], ...)", "section": "func", "ref": "NPV"}, {"id": "func-PMT", "type": "function", "column": "C04", "title": "PMT 每期还款额", "text": "PMT 每期还款额 财务函数 计算每期还款额（房贷月供） PMT(利率, 期数, 现值, [终值], [类型])", "section": "func", "ref": "PMT"}, {"id": "func-PV", "type": "function", "column": "C04", "title": "PV 现值", "text": "PV 现值 财务函数 现值：未来的钱现在值多少 PV(利率, 期数, 每期付款, [终值], [类型])", "section": "func", "ref": "PV"}, {"id": "func-RATE", "type": "function", "column": "C04", "title": "RATE 利率", "text": "RATE 利率 财务函数 利率 RATE(期数, 每期付款, 现值, [终值], [类型], [预估值])", "section": "func", "ref": "RATE"}, {"id": "func-SLN", "type": "function", "column": "C04", "title": "SLN 直线折旧", "text": "SLN 直线折旧 财务函数 直线折旧法 SLN(原值, 残值, 使用年限)", "section": "func", "ref": "SLN"}, {"id": "tut-interface", "type": "tutorial", "column": "C01", "title": "认识 Excel 界面", "text": "认识 Excel 界面 标题栏→功能区（选项卡+命令组）→编辑栏（显示/输入公式）→工作表区（行列交叉为单元格，如 B3）→工作表标签（底部切换/新增）→状态栏（快速看求和/平均）。记住：名称框可直接输入 B100 跳转，编辑栏是公式的家。 ", "section": "tut", "ref": "interface"}, {"id": "tut-enter", "type": "tutorial", "column": "C01", "title": "数据录入技巧", "text": "数据录入技巧 Enter 下移、Tab 右移、Shift+Enter 上移。选中区域后按 Enter 在区域内循环。Ctrl+Enter 批量填充选中区域。Alt+↓ 调出下拉历史。Ctrl+; 输入今天日期，Ctrl+Shift+; 输入当前时间。 ", "section": "tut", "ref": "enter"}, {"id": "tut-format", "type": "tutorial", "column": "C01", "title": "单元格格式", "text": "单元格格式 数字格式决定显示方式：常规/数值/货币/百分比/日期。Ctrl+1 打开设置单元格格式对话框。对齐、字体、边框、填充都在「开始」选项卡。格式刷（双击可多次使用）是排版神器。 ", "section": "tut", "ref": "format"}, {"id": "tut-sortfilter", "type": "tutorial", "column": "C01", "title": "排序与筛选", "text": "排序与筛选 筛选（Ctrl+Shift+L）：按条件只显示想要的行，箭头图标点开设条件。排序：按某列升序/降序，多关键字排序用「自定义排序」。注意：排序前先选中整个数据区域，否则会错乱！ ", "section": "tut", "ref": "sortfilter"}, {"id": "tut-print", "type": "tutorial", "column": "C01", "title": "打印设置", "text": "打印设置 页面布局→打印标题（顶端标题行每页重复）→设置打印区域→分页预览拖蓝线。页眉页脚加页码。打印前一定用「打印预览」检查。 ", "section": "tut", "ref": "print"}, {"id": "tut-pivottable", "type": "tutorial", "column": "C08", "title": "数据透视表", "text": "数据透视表 ### 2.1 为什么用数据透视表 想象你有一张 5000 行的销售明细：日期、销售员、产品、金额。老板问：“每个销售员每个月的销售额是多少？” - 不用透视表：写一堆 SUMIFS，还要手动列出所有销售员和月份，容易漏。 - 用透视表：**拖三下鼠标，3 秒出结果**。源数据增删行后点一下“刷新”即可更新。 核心思想：**把“分组+聚合”这个动作交给 Excel**，你只负责告诉它“按什么分组、对什么求和”。 ### 2.2 四个区域详解 | 区域 | 作用 | 典型拖入字段 | |------|------|--------------| | **行** | 纵向分组维度 | 销售员、产品类别、部门 | | **列** | 横向分组维度 | 月份、季度、年份 | | **值** | 要聚合计算的数字 | 金额、数量 | | **筛选器** | 报表级筛选 | 年份、区域（拖到这里后报表上方出现下拉筛选） | 操作要点： - 同一字段可以拖到多个区域（如“日期”同时拖到行和筛选器）。 - 拖错了直接把字段拖出窗格即可移除。 - 字段顺序决定层级：行区域里“年份”在上、“月份”在下，就是先按年再按月展开。 ### 2.3 值汇总方式 默认对数字字段“求和”，对文本字段“计数”。右键值字段→“值字段设置”可切换： | 汇总方式 | 含义 | 常用场景 | |-------", "section": "tut", "ref": "pivottable"}, {"id": "tut-array-formulas", "type": "tutorial", "column": "C03", "title": "数组公式", "text": "数组公式 1. 先理解\"数组\"是什么 数组就是\"一串值\"。`{1,2,3}` 是横向数组，`{1;2;3}` 是纵向数组（分号换行）。Excel 公式本来就是按数组思维设计的： [代码示例] 这行公式的含义是\"把 A1、A2、A3 每个都乘以 2\"，得到 `{A1*2, A2*2, A3*2}`。普通公式只显示第一个结果，数组公式则能把全部结果\"摊开\"显示。 2. 传统数组公式（Ctrl+Shift+Enter） 在旧版本 Excel 里，想让公式返回多个结果： 1. 先选中**多个**单元格（结果要占几格就选几格）。 2. 输入公式，如 `=A1:A3*2`。 3. 按 **Ctrl+Shift+Enter**（不是只按 Enter）。 公式两端会自动加上花括号 `{=A1:A3*2}`，表示这是数组公式。**花括号是 Excel 自己加的，手工输入无效。** 经典用途——多条件计数（COUNTIFS 出现之前的写法，现在仍有人用）： [代码示例] 原理：`(A2:A100=\"销售部\")` 得到一串 TRUE/FALSE，`(B2:B100>5000)` 得到另一串，两串相乘（TRUE=1、FALSE=0），只有两个条件都成立的位置是 1，SUM 加总即为同时满足的人数。 3. 动态数组：新时代的写法 Microsoft 365 引入动态数组后，**只按 Enter**，结果自动", "section": "tut", "ref": "array-formulas"}, {"id": "tut-powerquery", "type": "tutorial", "column": "C09", "title": "Power Query", "text": "Power Query ### 2.1 Power Query 是什么 它是 Excel 里的一个**数据加工流水线**：你把 (获取→清洗→整理) 的每一步操作点一遍，Power Query 会把步骤记下来。下个月拿到新的源文件，点一下 (刷新)，所有步骤自动重跑一遍。 和公式的区别： - 公式是 (算出一个结果)，Power Query 是 (产出一张干净的表)。 - 公式适合行内计算；Power Query 适合**结构性整理**：拆分列、转置、合并文件、逆透视——这些用公式写会很痛苦。 核心观念：**你点的每一步都会变成一行 M 代码**，记录在右侧 (应用的步骤) 里。可以回头修改、删除、调整顺序。 ### 2.2 三个基本概念：查询、步骤、加载 | 概念 | 含义 | 类比 | |---|---|---| | 查询 (Query) | 一段取数加清洗的完整定义，从来源到输出结果 | 一条做菜的菜谱 | | 步骤 (Step) | 查询里的一次操作，如提升标题、拆分列、筛选行 | 菜谱里的一步 | | 加载 (Load) | 把查询结果放进哪里：工作表中的表、仅创建连接、数据模型 | 菜做好端上哪张桌子 | 一个查询可以只加载为 (仅创建连接)，供其他查询引用，不占工作表位置；也可以加载到工作表，成为一张真正的 Excel 表格，后面再接透视表。 ### 2.3 查询编辑", "section": "tut", "ref": "powerquery"}, {"id": "tut-conditional-formatting", "type": "tutorial", "column": "C06", "title": "条件格式", "text": "条件格式 ### 2.1 核心原理：规则加格式 条件格式 = **“规则” + “格式”**。规则判断每个单元格“达不达标”，达标就套用你设的格式（红底、加粗等）。 关键理解：**格式是“活”的**。单元格的值变了，格式自动跟着变——和你手工涂色有本质区别。删掉规则（“开始”→“条件格式”→“清除规则”）就恢复原样，不破坏数据。 操作入口：“开始”→“条件格式”。先**选中要应用的区域**再设规则，这点最重要。 ### 2.2 L2-1 内置规则之一：突出显示单元格规则 最常用的一类：“条件格式”→“突出显示单元格规则”： | 规则 | 示例 | |------|------| | 大于／小于／介于 | 金额 > 10000 标红 | | 等于 | 状态 =“缺货”标黄 | | 文本包含 | 备注包含“紧急” | | 发生日期 | “最近 7 天”“上个月”——到期提醒常用 | | 重复值 | 一键标出重复的身份证号／手机号 | 每个规则点开后选格式（浅红填充深红文本等），也可以点“自定义格式”自己配。 ### 2.3 L2-1 内置规则之二：项目选取规则 “条件格式”→“项目选取规则”，不设固定阈值、只按排名取前几名或后几名： | 规则 | 示例 | |------|------| | 前 10 项 | 销售额前 10 名标金色，名次变化自动重标 | | 前 10% | 前 10", "section": "tut", "ref": "conditional-formatting"}, {"id": "tut-data-validation", "type": "tutorial", "column": "C05", "title": "数据验证", "text": "数据验证 1. 数据验证是什么 「数据」→「数据验证」。它在**输入的那一刻**拦截不合法的值，而不是事后检查。 三个可配置项： 1. **设置**：允许输入什么（整数/小数/日期/序列/文本长度…）。 2. **输入信息**：选中单元格时弹出的提示（\"请输入 1-100 的整数\"）——主动引导。 3. **出错警告**：输错时的弹窗，样式可选\"停止\"（硬拦截）/\"警告\"（可继续）/\"信息\"（仅提醒）。 2. 下拉列表（最常用） ### 固定选项 选中单元格 → 数据验证 → 允许「序列」→ 来源填 `男,女`（中文逗号不行，必须用**英文逗号**分隔）。单元格右侧出现下拉箭头。 ### 引用区域 来源填 `=$F$2:$F$10`（部门清单）。清单变了下拉自动变。建议把清单放在单独的\"基础数据\"表，隐藏起来。 ### 动态二级联动：选\"省\"后\"市\"跟着变 这是数据验证的经典难题，标准解法是 **INDIRECT + 命名区域**： 1. 准备对照表：A 列是省名（广东、江苏…），B 列开始每列是一个省的城市，第一行是省名。 2. 给每个省的城市区域**定义名称**：选中广东的城市 → 名称框输入 `广东` → 回车。注意名称不能含空格，省名有空格先替换。 3. 输入限制 自定义公式的心法和条件格式一样：**相对左上角写**。选中 B2:B100 后公式写 `=LEN(B2)=11", "section": "tut", "ref": "data-validation"}, {"id": "tut-pivot_adv-0", "type": "tutorial", "column": "C08", "title": "基础操作", "text": "基础操作 选中数据→插入→数据透视表。四个区：行、列、值、筛选。值字段默认求和，右键可改计数/平均/最大值。 ", "section": "tut", "ref": "pivot_adv-0"}, {"id": "tut-pivot_adv-1", "type": "tutorial", "column": "C08", "title": "分组统计", "text": "分组统计 日期右键→组合：按年/季度/月分组。数字右键→组合：按区间分组（如成绩段 60-70/70-80）。 ", "section": "tut", "ref": "pivot_adv-1"}, {"id": "tut-pivot_adv-2", "type": "tutorial", "column": "C08", "title": "多维分析", "text": "多维分析 行放「区域」、列放「季度」、值放「销售额」，一眼看交叉汇总。值显示方式→差异/百分比，做同比环比。 ", "section": "tut", "ref": "pivot_adv-2"}, {"id": "tut-pivot_adv-3", "type": "tutorial", "column": "C08", "title": "切片器", "text": "切片器 插入切片器→选字段，点按钮即筛选，多表联动（报表连接）。比筛选直观 10 倍，汇报必备。 ", "section": "tut", "ref": "pivot_adv-3"}, {"id": "tut-pivot_adv-4", "type": "tutorial", "column": "C08", "title": "时间轴", "text": "时间轴 日期字段专用筛选器，按年/季度/月/日切换，比切片器更适合时间。 ", "section": "tut", "ref": "pivot_adv-4"}, {"id": "tut-pivot_adv-5", "type": "tutorial", "column": "C08", "title": "数据模型", "text": "数据模型 多表关联：把订单表+产品表都添加到数据模型，用字段关联，一张透视表跨表分析。Power Pivot 的地基。 ", "section": "tut", "ref": "pivot_adv-5"}, {"id": "tut-pq_adv-0", "type": "tutorial", "column": "C09", "title": "导入 CSV", "text": "导入 CSV 数据→获取数据→从文本/CSV。乱码？改编码为 65001（UTF-8）或 936（GBK）。 ", "section": "tut", "ref": "pq_adv-0"}, {"id": "tut-pq_adv-1", "type": "tutorial", "column": "C09", "title": "导入网页", "text": "导入网页 数据→自网站→粘贴 URL。网页表格结构变化时需重新检查步骤。 ", "section": "tut", "ref": "pq_adv-1"}, {"id": "tut-pq_adv-2", "type": "tutorial", "column": "C09", "title": "数据清洗", "text": "数据清洗 删空行、替换值、填充、修剪、分列、更改类型。每一步都记录在右侧「应用的步骤」，可回退。 ", "section": "tut", "ref": "pq_adv-2"}, {"id": "tut-pq_adv-3", "type": "tutorial", "column": "C09", "title": "合并表", "text": "合并表 追加查询=上下堆叠（多月数据合并）；合并查询=左右连接（VLOOKUP 的批量版）。 ", "section": "tut", "ref": "pq_adv-3"}, {"id": "tut-pq_adv-4", "type": "tutorial", "column": "C09", "title": "拆分列", "text": "拆分列 按分隔符/字符数拆分。\"2026-10-01\" 按 \"-\" 拆成年/月/日三列。 ", "section": "tut", "ref": "pq_adv-4"}, {"id": "tut-pq_adv-5", "type": "tutorial", "column": "C09", "title": "自动刷新", "text": "自动刷新 关闭并上载后，源文件更新→右键刷新。还可设置打开文件自动刷新：数据→查询属性。 ", "section": "tut", "ref": "pq_adv-5"}, {"id": "tut-ppivot-0", "type": "tutorial", "column": "C10", "title": "数据模型", "text": "数据模型 Power Pivot→添加到数据模型。多表不用 VLOOKUP，用关系关联，百万行不卡。 ", "section": "tut", "ref": "ppivot-0"}, {"id": "tut-ppivot-1", "type": "tutorial", "column": "C10", "title": "多表关联", "text": "多表关联 关系视图拖线连主外键。一对多：产品表（1）→订单表（多）。 ", "section": "tut", "ref": "ppivot-1"}, {"id": "tut-ppivot-2", "type": "tutorial", "column": "C10", "title": "DAX 公式入门", "text": "DAX 公式入门 DAX 长得像 Excel 函数但思维是列式。SUM(表[列])、CALCULATE(表达式, 筛选)、RELATED(取关联表字段)。 ", "section": "tut", "ref": "ppivot-2"}, {"id": "tut-ppivot-3", "type": "tutorial", "column": "C10", "title": "常用 DAX", "text": "常用 DAX 总销售额 =SUM(订单[金额]) 当年累计 =CALCULATE([总销售额], DATESYTD(日期表[日期])) 同比 =DIVIDE([总销售额]-[去年同期], [去年同期]) ", "section": "tut", "ref": "ppivot-3"}, {"id": "tut-ppivot-4", "type": "tutorial", "column": "C10", "title": "KPI 指标", "text": "KPI 指标 在数据模型中建度量值：销售额、利润率、完成率。度量值随切片器自动重算，一处定义处处用。 ", "section": "tut", "ref": "ppivot-4"}, {"id": "tut-cfmt-0", "type": "tutorial", "column": "C06", "title": "颜色标记", "text": "颜色标记 开始→条件格式→突出显示单元格规则：大于/小于/介于/等于，自动上色。 ", "section": "tut", "ref": "cfmt-0"}, {"id": "tut-cfmt-1", "type": "tutorial", "column": "C06", "title": "数据条", "text": "数据条 在单元格内画横向条形图，数值大小一目了然。适合业绩对比。 ", "section": "tut", "ref": "cfmt-1"}, {"id": "tut-cfmt-2", "type": "tutorial", "column": "C06", "title": "图标集", "text": "图标集 红绿灯/箭头/旗帜，按阈值自动打标。管理驾驶舱常用。 ", "section": "tut", "ref": "cfmt-2"}, {"id": "tut-cfmt-3", "type": "tutorial", "column": "C06", "title": "自定义公式", "text": "自定义公式 新建规则→使用公式。注意 $ 锁定：=$B2>100 整行变色（选中整行时列锁定行不锁定）。 ", "section": "tut", "ref": "cfmt-3"}, {"id": "tut-cfmt-4", "type": "tutorial", "column": "C06", "title": "案例：自动标红逾期", "text": "案例：自动标红逾期 =AND($E2<TODAY(),$G2<>\"已完成\") → 逾期未完成的整行变红。 ", "section": "tut", "ref": "cfmt-4"}, {"id": "tut-cfmt-5", "type": "tutorial", "column": "C06", "title": "案例：高亮重复", "text": "案例：高亮重复 选中区域→条件格式→突出显示→重复值。或公式 =COUNTIF($A:$A,$A2)>1 自定义颜色。 ", "section": "tut", "ref": "cfmt-5"}, {"id": "tut-dval-0", "type": "tutorial", "column": "C05", "title": "下拉菜单", "text": "下拉菜单 数据→数据验证→序列，来源输入：男,女（英文逗号）。或引用一列区域。 ", "section": "tut", "ref": "dval-0"}, {"id": "tut-dval-1", "type": "tutorial", "column": "C05", "title": "联动下拉框", "text": "联动下拉框 一级菜单选「省份」→二级自动出该省城市。做法：定义名称+INDIRECT($A2)。先做各省名单，再建一级下拉，二级来源 =INDIRECT(A2)。 ", "section": "tut", "ref": "dval-1"}, {"id": "tut-dval-2", "type": "tutorial", "column": "C05", "title": "日期限制", "text": "日期限制 数据验证→日期→介于 2026-1-1 到 2026-12-31，只能输今年日期。 ", "section": "tut", "ref": "dval-2"}, {"id": "tut-dval-3", "type": "tutorial", "column": "C05", "title": "输入规则", "text": "输入规则 整数/小数/文本长度：手机号设文本长度=11；年龄设整数介于 18-65。出错警告可自定义提示语。 ", "section": "tut", "ref": "dval-3"}, {"id": "tut-dval-4", "type": "tutorial", "column": "C05", "title": "圈释无效数据", "text": "圈释无效数据 数据→数据验证→圈释无效数据，已有违规的一眼现形。 ", "section": "tut", "ref": "dval-4"}, {"id": "tut-choose", "type": "tutorial", "column": "C07", "title": "图表类型选择指南", "text": "图表类型选择指南 比较大小用柱状图/条形图，看趋势用折线图，看占比用饼图/环形图（类别≤6），看关系用散点图/气泡图，看分布用直方图/箱线图。双坐标用组合图。记住：一图只讲一件事。 ", "section": "tut", "ref": "choose"}, {"id": "tut-make", "type": "tutorial", "column": "C07", "title": "图表制作步骤", "text": "图表制作步骤 选中数据→插入→选图表类型→切换行列（数据反了就点它）→添加数据标签→调坐标轴。数据源：右键→选择数据，可增删系列。 ", "section": "tut", "ref": "make"}, {"id": "tut-beauty", "type": "tutorial", "column": "C07", "title": "图表美化技巧", "text": "图表美化技巧 删网格线、删图例（直接标数据）、统一配色（莫兰迪/商务蓝）、加粗标题讲结论、坐标轴从 0 开始（柱状图）。少即是多：每删一个元素，图表清晰一度。 ", "section": "tut", "ref": "beauty"}, {"id": "tut-dynamic", "type": "tutorial", "column": "C07", "title": "动态图表", "text": "动态图表 下拉菜单联动图表：数据验证做下拉→INDEX+MATCH 取数→图表数据源引用。用复选框控制系列显示。用 OFFSET 做动态区域，新增数据自动进图。 ", "section": "tut", "ref": "dynamic"}, {"id": "tut-scenario-0", "type": "tutorial", "column": "C13", "title": "财务报销统计", "text": "财务报销统计 每月上百条报销记录，自动汇总到部门/类别 ", "section": "tut", "ref": "scenario-0"}, {"id": "tut-scenario-1", "type": "tutorial", "column": "C13", "title": "销售业绩分析", "text": "销售业绩分析 销售明细表 → 自动排名、环比、Top10 ", "section": "tut", "ref": "scenario-1"}, {"id": "tut-scenario-2", "type": "tutorial", "column": "C13", "title": "人事考勤统计", "text": "人事考勤统计 打卡记录 → 迟到/早退/缺勤自动统计 ", "section": "tut", "ref": "scenario-2"}, {"id": "tut-scenario-3", "type": "tutorial", "column": "C13", "title": "库存预警管理", "text": "库存预警管理 出入库流水 → 实时库存 + 低库存预警 ", "section": "tut", "ref": "scenario-3"}, {"id": "tut-scenario-4", "type": "tutorial", "column": "C13", "title": "经营仪表盘", "text": "经营仪表盘 一页看懂公司经营：KPI 卡片 + 趋势图 + 明细 ", "section": "tut", "ref": "scenario-4"}, {"id": "tut-basics-01-getting-started", "type": "tutorial", "column": "C01", "title": "认识 Excel：界面、工作簿与工作表", "text": "认识 Excel：界面、工作簿与工作表 **工作簿与工作表**：一个 Excel 文件就是一个工作簿（Workbook），扩展名通常是 `.xlsx`；工作簿里可以放多张工作表（Worksheet），底部的工作表标签就是各张表的入口。日常说的\"打开一张表\"，多数时候是指打开一个工作簿里的一张工作表。 **功能区（Ribbon）**：窗口顶部的带状工具栏，由\"选项卡＋命令组\"构成。\"开始\"选项卡放最常用的字体、对齐、数字格式；\"插入\"放图表、数据透视表；\"公式\"放函数库；\"数据\"放排序、筛选、分列、获取数据。找不到某个命令时，先想它属于哪类操作，再去对应选项卡找，比满屏乱点快得多。 **单元格与名称框**：行列交叉处就是单元格，用列字母＋行号定位，如 `B3` 表示 B 列第 3 行。左上角的名称框显示当前选中单元格的地址，直接输入 `D20` 回车即可跳转到 D20；输入 `B2:B10` 回车可一次选中一个区域。 **文件格式**：`.xlsx` 是不含宏的常规工作簿；`.xlsm` 是启用宏的工作簿，含 VBA 代码时必须存为此格式，否则宏会被丢弃；`.xls` 是 2003 及更早版本的旧格式，功能受限，新文件不要用它；`.csv` 只有纯文本数据，无格式、无公式、无多表，导出给其他系统时常用。 **视图与窗口**：普通视图是日常编辑视图；页面布局视图按打印效果显示，能看到页", "section": "tut", "ref": "basics-01-getting-started"}, {"id": "tut-basics-02-data-entry", "type": "tutorial", "column": "C01", "title": "数据录入与编辑：输入技巧、填充柄与复制粘贴", "text": "数据录入与编辑：输入技巧、填充柄与复制粘贴 **自动识别**：Excel 按输入内容猜类型——纯数字进数值、带 `-` 或 `/` 的进日期、其余进文本。身份证号、银行卡号这类长数字串会被当成数值并用科学计数法显示，必须先把单元格设为文本格式，或先输入英文单引号 `'` 再输数字。 **填充柄**：选中单元格右下角的小方块就是填充柄，拖动它可向下/向右复制或按规律填充。拖动后右下角会出现\"自动填充选项\"小图标，可切换\"复制单元格\"、\"填充序列\"、\"仅填充格式\"等模式。 **复制粘贴专项**：`Ctrl + C` 复制的是内容＋格式＋公式。只想粘其中一部分时用\"选择性粘贴\"（右键→选择性粘贴，或开始→粘贴下拉）：\"数值\"只粘结果不粘公式，\"格式\"只粘样式，\"转置\"把行列互换。 **查找替换**：`Ctrl + H` 打开查找替换，可批量改错别字、统一部门名。点\"选项\"可限定\"单元格匹配\"（整格相等才换，避免\"销售部\"被\"销售\"替换误伤）与\"区分大小写\"。`Ctrl + F` 只查找不替换。 **定位条件**：`F5`→\"定位条件\"可一次选中某类单元格：全部空值（批量填\"待补\"）、全部公式（检查公式区）、全部常量。配合 `Ctrl + Enter` 可对所有选中格一次填入相同内容。 2. 基础概念 **自动识别**：Excel 按输入内容猜类型——纯数字进数值、带 `-` 或 `/` ", "section": "tut", "ref": "basics-02-data-entry"}, {"id": "tut-basics-03-cells-ranges", "type": "tutorial", "column": "C01", "title": "单元格与区域操作：选定、行列、合并与名称框", "text": "单元格与区域操作：选定、行列、合并与名称框 **区域（Range）**：一组连续单元格，用左上角:右下角表示，如 `B2:D10`。多数操作（求和、排序、复制）都是以区域为单位进行的；先选对区域，再执行操作，是 Excel 操作的第一性原理。 **选定技巧**：点列标选整列、点行号选整行；`Ctrl + A` 在数据区按一次选当前连续区域，按两次选全表；`Ctrl + Shift + 方向键` 扩展到数据边缘，是选中整列数据的神器；`Ctrl + 点击` 加选不连续区域；`Ctrl + Shift + *`（数字 8 上档键）选中当前数据区域。 **行列操作**：右键行号/列标可插入、删除、隐藏行列。插入行会把公式引用自动下移（引用跟着数据走），删除行则可能让引用该行的公式变成 `#REF!`——删行前先检查有没有公式引用它。 **合并单元格**：开始→合并后居中。合并后只有左上角单元格保留内容，其余格的内容会被丢弃；合并过的区域不能直接排序、不能用填充柄、透视表也不认它。标题行合并一次尚可，数据区不要合并。 **名称框跳转**：名称框输入地址回车即跳转；输入区域如 `B2:D100` 回车即选中该区域；输入已定义名称（如\"销售数据\"）可跳到命名区域。配合 `Ctrl + End`（已用区域右下角）与 `Ctrl + Home`（回 A1），大表导航不用滚轮。 2. 基础概念 **", "section": "tut", "ref": "basics-03-cells-ranges"}, {"id": "tut-basics-05-versions", "type": "tutorial", "column": "C01", "title": "版本与兼容：从 Excel 2003 到 Microsoft 365", "text": "版本与兼容：从 Excel 2003 到 Microsoft 365 **版本沿革**：Excel 2003 是最后一个 `.xls` 时代版本；2007 引入功能区与 `.xlsx`；2010 加入切片器与 Power Pivot；2013 加入快速填充与时间线；2016 加入 Power Query 内置与 6 个新函数；2019 新增 IFS、SWITCH、CONCAT、TEXTJOIN、MAXIFS、MINIFS；2021 新增 XLOOKUP 与动态数组函数 FILTER、SORT、UNIQUE；Microsoft 365 在此基础上持续新增 TEXTSPLIT、TEXTBEFORE、LAMBDA 等，且只有 365 能用最新函数。 **一个常见误标**：IFS、SWITCH、CONCAT、TEXTJOIN 是 Excel 2019 新增，不是 2016。很多旧教程写\"2016+\"是错的——在 Excel 2016 打开含 IFS 的文件会报 `#NAME?`。本站函数库的版本字段以 `versions.func_ver` 为准：IFS、SWITCH、TEXTJOIN、CONCAT、MAXIFS、MINIFS 均为 2019／365；XLOOKUP、FILTER、SORT、UNIQUE 为 2021／365；TEXTSPLIT、TEXTBEFORE、TEXTAFTER、L", "section": "tut", "ref": "basics-05-versions"}, {"id": "tut-formatting-01-number-format", "type": "tutorial", "column": "C02", "title": "数字格式：常规、货币、日期、百分比与自定义格式代码", "text": "数字格式：常规、货币、日期、百分比与自定义格式代码 **值与格式分离**：单元格里存的是值（如 0.25），显示的是格式（如 25%）。改格式只改变观感，不改变参与计算的值——`0.25` 显示成 25% 后，求和结果不变。这是理解数字格式的第一性原理，也是\"百分比放大 100 倍\"事故的根源：先输入 25 再设百分比格式，Excel 会把 25 理解成 2500%。 **常规格式**：默认格式，数字按原样显示，超过 11 位的大数字自动变科学计数法。身份证号、银行卡号变科学计数法，就是常规格式在作怪——解法是先设文本格式再输入。 **货币与会计专用**：货币格式给数字加 ¥ 符号与千分位（如 ¥1,234.56）；会计专用格式把 ¥ 符号左对齐、小数点对齐，适合财务报表。两者都不改变数值本身。 **日期格式**：Excel 的日期本质是序列值（1900-01-01 是 1，2026-11-09 是 45961），显示格式决定它看起来是\"2026/11/9\"还是\"2026 年 11 月 9 日\"。日期能直接加减（`2026-11-09 减 2026-11-02 = 7`），靠的就是序列值。 **自定义格式代码**：格式代码分四段\"正数;负数;零值;文本\"，如 `#,##0.00;[红色]-#,##0.00;\"-\"` 表示正数带千分位两位小数、负数红色带减号、零显示一个短横。常用占位", "section": "tut", "ref": "formatting-01-number-format"}, {"id": "tut-formatting-02-font-alignment", "type": "tutorial", "column": "C02", "title": "字体与对齐：字号颜色、对齐缩进与自动换行", "text": "字体与对齐：字号颜色、对齐缩进与自动换行 **字体三要素**：字体、字号、颜色。报表惯例：标题 16 号加粗、表头 11 号加粗配填充色、数据 11 号常规。同一张表字体不超过两种，字号不超过三个档次，否则显乱。 **对齐**：水平对齐分左对齐（文本默认）、居中、右对齐（数值默认）；垂直对齐分靠上、居中、靠下。数字右对齐、文本左对齐、标题居中，是表格的默认美学；跨列居中（设置单元格格式→对齐→水平对齐→跨列居中）能让标题居中又不破坏数据区结构，比合并单元格更安全。 **缩进**：增加缩进量可以把层级关系可视化（如\"销售部\"下一级\"华东区\"缩进一格），比用空格对齐可靠——空格缩进在换字体后会错位。 **自动换行**：长文本超出列宽时，自动换行让它在格内折成多行显示，同时行高自动撑高；配合\"缩小字体填充\"可在不换行时把字缩到能放下。两者不要同时开。 **格式刷**：选中带格式的格点格式刷，再点目标格，只刷格式不刷内容；双击格式刷可连续刷多个区域，按 Esc 退出。格式刷是\"复制格式\"最快的方式，比逐项点工具栏快一个数量级。 2. 基础概念 **字体三要素**：字体、字号、颜色。报表惯例：标题 16 号加粗、表头 11 号加粗配填充色、数据 11 号常规。同一张表字体不超过两种，字号不超过三个档次，否则显乱。 **对齐**：水平对齐分左对齐（文本默认）、居中、右对齐（数值默认）；垂直对齐", "section": "tut", "ref": "formatting-02-font-alignment"}, {"id": "tut-formatting-03-border-fill", "type": "tutorial", "column": "C02", "title": "边框与填充：边框样式、填充图案与网格线", "text": "边框与填充：边框样式、填充图案与网格线 **边框三层级**：外边框（粗线，框住整张表）、内边框（细线，分隔行列）、合计行顶边框（双线或粗线，标出合计）。一张报表通常只需要这三层：外粗内细、合计加粗，线多了反而乱。 **填充色**：表头浅灰、合计行浅黄、异常行浅红，是报表的通用语义。填充只改背景，不改值；隔行变色（斑马纹）能显著降低看错行的概率，大表必备。 **网格线 vs 边框**：网格线是屏幕上的浅灰虚线、只辅助编辑，打印时默认不出来；边框是实打实的格式，打印会出来。视图→取消勾选\"网格线\"可让表格在屏幕上也干净，靠边框来分隔。 **套用表格格式**：开始→套用表格格式，选一个样式一键生成带边框、表头色、隔行变色的表格。它与超级表（Ctrl + T）是两回事：前者只刷格式，后者还带筛选与结构化引用。本篇只讲格式，超级表见下一篇。 2. 基础概念 **边框三层级**：外边框（粗线，框住整张表）、内边框（细线，分隔行列）、合计行顶边框（双线或粗线，标出合计）。一张报表通常只需要这三层：外粗内细、合计加粗，线多了反而乱。 **填充色**：表头浅灰、合计行浅黄、异常行浅红，是报表的通用语义。填充只改背景，不改值；隔行变色（斑马纹）能显著降低看错行的概率，大表必备。 **网格线 vs 边框**：网格线是屏幕上的浅灰虚线、只辅助编辑，打印时默认不出来；边框是实打实的格式，打印会出来。视图→取", "section": "tut", "ref": "formatting-03-border-fill"}, {"id": "tut-formatting-04-styles-themes", "type": "tutorial", "column": "C02", "title": "样式与主题：单元格样式、套用表格格式与主题配色", "text": "样式与主题：单元格样式、套用表格格式与主题配色 **单元格样式**：开始→单元格样式，内置\"标题\"、\"强调\"、\"好\"（绿底）、\"差\"（红底）、\"适中\"（黄底）等语义样式。点一下即套用一整套字体、填充与边框，比逐项点工具栏快；语义样式还能让\"好/差\"一眼可辨。 **套用表格格式**：选一个样式，一键生成带表头色、隔行变色、首列加粗的表格。它只刷格式，不带筛选功能；想要筛选与结构化引用，改用 `Ctrl + T` 创建超级表（见下一篇）。 **自定义样式**：开始→单元格样式→新建单元格样式，把\"公司红标题\"存成样式，全工作簿点一下即用。样式存在工作簿里，换电脑、发给别人都跟着走。 **主题**：页面布局→主题，一键换全表的配色方案与字体组合（标题字体＋正文字体）。主题色是联动的：用主题色做的填充与字体，换主题后自动跟着变；用标准色做的则不变。做公司模板时一律用主题色，换 VI 色一次改全套。 2. 基础概念 **单元格样式**：开始→单元格样式，内置\"标题\"、\"强调\"、\"好\"（绿底）、\"差\"（红底）、\"适中\"（黄底）等语义样式。点一下即套用一整套字体、填充与边框，比逐项点工具栏快；语义样式还能让\"好/差\"一眼可辨。 **套用表格格式**：选一个样式，一键生成带表头色、隔行变色、首列加粗的表格。它只刷格式，不带筛选功能；想要筛选与结构化引用，改用 `Ctrl + T` 创建超级表（见下", "section": "tut", "ref": "formatting-04-styles-themes"}, {"id": "tut-formatting-05-tables", "type": "tutorial", "column": "C02", "title": "超级表：创建、结构化引用、表样式与汇总行", "text": "超级表：创建、结构化引用、表样式与汇总行 **超级表（结构化表格）**：`Ctrl + T` 创建的带格式、带筛选、带结构化引用的智能表格。它与普通区域的根本区别是\"表知道自己的边界\"：新增一行，格式、公式、汇总行自动扩展；删除一行，引用自动收缩。 **结构化引用**：超级表里的公式不用 `B2:B6` 这种地址，改用表名加列名，如 `=SUM(表1[金额])`。好处是公式自带语义（\"对表 1 的金额列求和\"），新增行后引用范围自动扩大，不用改公式；跨表引用时也不怕插行错位。 **表样式与汇总行**：表设计选项卡可换样式、开关筛选按钮、开关首行/末行、开汇总行。汇总行在表底加一行，每列可下拉选求和、计数、平均值、最大值等，一键出合计，不用手写公式。 **表名管理**：表名默认是\"表1\"、\"表2\"，应在表设计选项卡改成有意义的名字（如\"销售明细\"），结构化引用才可读。表名不能与单元格地址重名（如不能叫 A1），不能含空格。 **与数据管理的分工**：超级表本身归属本栏目（C02-L2-5）；数据管理栏目（C05-L2-3）只做交叉引用，不重复建内容。排序筛选、数据清洗在超级表上操作与普通区域一致，但体验更好（筛选箭头常驻、新增行自动纳入）。 2. 基础概念 **超级表（结构化表格）**：`Ctrl + T` 创建的带格式、带筛选、带结构化引用的智能表格。它与普通区域的根本区别是\"表知", "section": "tut", "ref": "formatting-05-tables"}, {"id": "tut-formulas-01-formula-basics", "type": "tutorial", "column": "C03", "title": "公式入门：公式结构、运算符与输入编辑", "text": "公式入门：公式结构、运算符与输入编辑 **公式结构**：所有公式都以 `=` 开头，如 `=B2+C2`。等号后面是操作数（数字、单元格引用、函数结果）与运算符的组合。`SUM`、`IF` 这类现成的计算单元叫函数，写法是 `函数名(参数1, 参数2)`，参数之间用英文逗号分隔。 **运算符三类**：算术运算符 `+ - * / % ^`（加减乘除、百分号、乘方）；比较运算符 `= > < >= <= <>`（返回 TRUE 或 FALSE）；文本连接符 `&`（把两段文本拼成一段，如 `=A2&\"部\"`）。优先级：括号最先，接着乘方、乘除、加减，最后是连接与比较；记不住就加括号，括号永远最优先。 **公式与结果**：单元格显示的是计算结果，编辑栏显示的是公式本身。双击单元格或按 `F2` 可进入编辑状态，光标定位到公式末尾；按 `Esc` 放弃修改，按 `Enter` 确认。公式→显示公式（`Ctrl + ``，反引号键）可让全表显示公式而不是结果，检查时用它。 **相对引用入门**：公式里的 `B2` 是相对引用，复制到下一行会自动变成 `B3`，复制到右一列会变成 `C2`。这是公式能\"一写多用\"的关键；想让它不跟着变，见下一篇引用方式（加 `$` 锁定）。 **常见第一错**：公式不以 `=` 开头（直接写 `SUM(B2:B10)` 只会显示文本）；用了中文括号 `（）`", "section": "tut", "ref": "formulas-01-formula-basics"}, {"id": "tut-formulas-02-references", "type": "tutorial", "column": "C03", "title": "引用方式：相对引用、绝对引用、混合引用与跨表引用", "text": "引用方式：相对引用、绝对引用、混合引用与跨表引用 **相对引用**：`B2` 这样不带 `$` 的引用。公式复制到别处时，引用跟着目标位置同步移动：下移一行变 `B3`，右移一列变 `C2`。它是公式\"一写多用\"的基础。 **绝对引用**：`$B$2`，行列都锁定。公式复制到任何地方都指向 B2 不变。适用场景：引用某个固定参数格（如税率、提成比例、单价），全表共用一个格。 **混合引用**：`$B2`（锁列不锁行）或 `B$2`（锁行不锁列）。乘法表是经典场景：行标题在 A 列、列标题在第 1 行，公式 `=$A2*B$1` 往右拖时 A 列锁定、往下拖时第 1 行锁定，一张乘法表一个公式搞定。 **F4 切换**：编辑公式时光标放在引用上，按 `F4` 循环切换 `B2` → `$B$2` → `B$2` → `$B2` → `B2`。记住顺序，锁引用不用手敲 `$`。 **跨表引用**：引用其他工作表的单元格，写法是 `表名!地址`，如 `='11月'!C10`。表名含中文或空格时必须加单引号。跨工作簿引用还要带工作簿名，如 `[报表.xlsx]11月!C10`，源文件改名或移动后链接会断，慎用。 **三维引用**：对多个连续工作表的同一位置求和，如 `=SUM(一月:三月!B2)`，表示一月到三月这三张表 B2 的和。要求各表结构完全一致，适合\"每月一张表、结构相同\"的汇总", "section": "tut", "ref": "formulas-02-references"}, {"id": "tut-formulas-03-names", "type": "tutorial", "column": "C03", "title": "名称与定义：定义名称、名称管理器与动态名称", "text": "名称与定义：定义名称、名称管理器与动态名称 **名称**：给单元格或区域起一个名字，如把 E1 命名为\"提成比例\"，公式写 `=B2*提成比例`，比 `=B2*$E$1` 好读得多。名称是工作簿级的：全工作簿任何一张表都能用同一个名称。 **定义名称**：选中单元格或区域，公式→定义名称，输入名字、确认引用范围。命名规则：不能与单元格地址重名（如 A1、B2），不能含空格（用下划线代替），不能以数字开头。名字里用\"税率\"、\"提成比例\"这类业务词，公式立刻自带文档。 **名称管理器**：公式→名称管理器，列出全部名称：名字、引用位置、范围。改引用、改名字、删名称都在这里；名称引用错了（如指向了被删的表）会在这里显示 `#REF!`，是排查断链的第一站。 **名称框快捷定义**：选中区域后点左上角名称框，直接输入名字回车，即完成定义——比打开对话框更快。输入已定义名称回车，可瞬间跳转到该区域。 **动态名称**：引用范围会自己变长的名称。经典写法是用 OFFSET：`=OFFSET($A$2,0,0,COUNTA($A:$A)-1,1)`，表示\"从 A2 开始、高度等于 A 列非空数减 1\"，A 列新增一行，名称范围自动加一行。更稳妥的写法是用 INDEX：`= $A$2:INDEX($A:$A,COUNTA($A:$A))`，INDEX 是非易失性函数，不会每次重算全表。 **适用边", "section": "tut", "ref": "formulas-03-names"}, {"id": "tut-formulas-05-auditing", "type": "tutorial", "column": "C03", "title": "公式审核与调试：追踪引用、公式求值与错误检查", "text": "公式审核与调试：追踪引用、公式求值与错误检查 **追踪引用单元格**：选中一个公式格，公式→追踪引用单元格，箭头从它引用的格指向它。箭头指错地方，就是引用错了。**追踪从属单元格**反过来：箭头从它指向引用它的公式格，删格、删行前先看它，知道谁会受影响。 **公式求值**：公式→公式求值，打开逐步求值窗口，每点一次\"求值\"就算一步，能看到 `VLOOKUP` 的查找值、`IF` 的条件判断、`SUM` 的求和范围每一步的中间结果。公式结果不对但不知道哪一步错时，用它逐段定位。 **错误检查**：公式→错误检查，逐个扫描全表的错误值（#VALUE!、#N/A、#REF! 等），每个错误给\"帮助\"、\"显示计算步骤\"、\"忽略错误\"等选项。左上角绿色小三角就是错误检查的标记：有三角不一定真有错，可能是\"公式与相邻公式不一致\"这类提醒。 **监视窗口**：公式→监视窗口，把关键结果格（如合计、税率）加进去，窗口常驻显示它们的当前值。改动源数据时不用翻页找合计格，在监视窗口直接看变化。 **显示公式**：公式→显示公式（`Ctrl + ``），全表切换显示公式文本而非结果。检查引用、核对公式结构时用它；检查完再按一次切回。 **定位条件找问题格**：`F5`→定位条件→公式/常量，可一次选中全表所有公式格或所有文本格。\"看起来是数、实际是文本\"的格（左上角绿三角、左对齐显示）最适合这样批量找出", "section": "tut", "ref": "formulas-05-auditing"}, {"id": "tut-formulas-06-advanced-tricks", "type": "tutorial", "column": "C03", "title": "高级公式技巧：LET、LAMBDA、嵌套与条件求和进阶", "text": "高级公式技巧：LET、LAMBDA、嵌套与条件求和进阶 **LET（2021／365）**：`LET(名字1, 值1, 名字2, 值2, 计算式)`，先定义、后计算。长公式里同一个子表达式出现多次时，用 LET 只算一次、起个名字，后面直接用名字。公式变短、变快、变好读。示例：`=LET(单价,B2,数量,C2,单价*数量)`。 **LAMBDA（365 专属）**：`LAMBDA(参数, 计算式)`，定义一个自己的函数。` =LAMBDA(x, x*2)(5)` 返回 10。更实用的用法是先在名称管理器里把 LAMBDA 存成名称（如\"税额\"），以后全表像用内置函数一样调用 `=税额(10000)`。LAMBDA 配合 MAP、BYROW 等函数可对整列逐行计算，是 365 的高阶玩法。 **嵌套的度**：IF 嵌套超过 3 层就难读难维护，优先换 IFS（2019／365）、SWITCH（2019／365）或 VLOOKUP/XLOOKUP 查表。嵌套不是炫技，少一层是一层。 **SUMPRODUCT 多条件求和**：`=SUMPRODUCT((条件1)*(条件2)*求和区域)`，不用辅助列、不用数组三键。原理：条件相乘得 0/1 掩码，只有全满足的行是 1，再与求和区域相乘后加总。它是 SUMIFS 出现之前的通用解法，条件更灵活（可做或条件、可做不等式）。 **文本拼接公式", "section": "tut", "ref": "formulas-06-advanced-tricks"}, {"id": "tut-data-management-01-sort-filter", "type": "tutorial", "column": "C05", "title": "排序与筛选：单条件、多条件、自动筛选与高级筛选", "text": "排序与筛选：单条件、多条件、自动筛选与高级筛选 **排序的铁律**：排序前选中整个数据区，或点数据区内任一格直接排序（Excel 自动扩展选区）。只选中一列就排序，会把行与行之间的对应关系打乱——这是新手最常见的毁表操作，没有之一。排序前备份，或确认能 `Ctrl + Z` 撤销。 **单条件排序**：数据→排序，按一列升序/降序。数值按大小、日期按先后、文本按拼音/字母。金额列降序即\"从大到小\"，看 Top 5 直接取前 5 行。 **多条件排序**：数据→排序→添加条件，先按部门升序、再按金额降序。Excel 按条件顺序逐层排：部门相同的人内部再按金额排。层数没有实用上限，但超过 3 层就要想想是不是该用透视表了。 **自动筛选**：选中表头行，数据→筛选，每列出现下拉箭头。点箭头可选文本筛选（包含/开头是）、数字筛选（大于/前 10 项）、按颜色筛选。筛选只是隐藏行，不删除数据；清除筛选后全部恢复。 **高级筛选**：数据→高级筛选，条件区域单独写在表外。同一行多个条件是\"与\"（同时满足），不同行是\"或\"（满足其一）。还能勾选\"选择不重复的记录\"，一键提取不重复客户名单。高级筛选可把结果复制到其他位置，原表不动。 **按颜色排序**：先用条件格式或手动填充把异常行标色，再按颜色排序，异常行自动聚到一起。适合\"先标后排\"的人工复核流程。 2. 基础概念 **排序的铁律**：排序", "section": "tut", "ref": "data-management-01-sort-filter"}, {"id": "tut-data-management-02-clean-data", "type": "tutorial", "column": "C05", "title": "数据清洗：分列、去重、TRIM/CLEAN 与查找替换清理", "text": "数据清洗：分列、去重、TRIM/CLEAN 与查找替换清理 **脏数据的四种**：多余空格（\"张三 \"）、不可见字符（从系统导出的换行符、制表符）、文本型数字（\"100\" 当文本）、重复行（同一订单导了两次）。清洗就是按固定顺序把这四种逐一处理掉。 **分列**：数据→分列，把一格里的多个值按分隔符（逗号、分号、空格）或固定宽度拆成多列。系统导出的 CSV 常常是\"姓名，部门，金额\"挤在一格，分列是第一步。分列前先在右侧留出空列，否则会覆盖已有数据。 **删除重复项**：数据→删除重复项，勾选作为判断依据的列（如订单号），重复行整行删除，并报告删了几行。它是破坏性操作，清洗前必须先备份原表。 **TRIM 与 CLEAN**：`TRIM` 删首尾空格、把连续多个空格压成一个；`CLEAN` 删不可见字符（如换行符 CHAR(10) 以外的控制字符）。两者常组合用：`=TRIM(CLEAN(A2))`。注意 TRIM 不删不间断空格（CHAR(160)，从网页复制来的常见），那种要用 SUBSTITUTE 换掉：`=SUBSTITUTE(A2,CHAR(160),\"\")`。 **UNIQUE（2021／365）**：`=UNIQUE(A2:A100)` 一公式返回去重后的列表，原表不动。想保留原表、只在新位置看去重结果时用它；想直接在原表上删重复行时用\"删除重复项\"。 **清洗流程*", "section": "tut", "ref": "data-management-02-clean-data"}, {"id": "tut-data-management-03-tables-ref", "type": "tutorial", "column": "C05", "title": "超级表应用（交叉引用索引）", "text": "超级表应用（交叉引用索引） 4. 图文示例 5 行销售明细转成超级表并改名“销售明细”：金额 1200、980、1500、640、540，结构化引用 `=SUM(销售明细[金额])` 得 4860，平均值 972。新增一行金额 700 后，汇总行与结构化引用自动变成 5560，不用改任何公式。 （截图位：待补图）", "section": "tut", "ref": "data-management-03-tables-ref"}, {"id": "tut-data-management-05-import-export", "type": "tutorial", "column": "C05", "title": "数据导入导出：文本/CSV 导入、从数据库与网页获取、导出格式", "text": "数据导入导出：文本/CSV 导入、从数据库与网页获取、导出格式 **CSV 导入三要素**：分隔符（逗号/分号/制表符）、编码（UTF-8/GBK）、列格式（文本/日期/常规）。三者任一错，导入即乱：分隔符错会整行挤进一列，编码错会出乱码，列格式错会丢前导 0 或把长数字变科学计数法。 **两种导入路径**：直接双击打开 CSV（快，但分隔符与编码按系统默认猜，常猜错）；数据→从文本/CSV（走 Power Query 导入向导，可选分隔符、编码、列格式，推荐）。后者还能把导入步骤存成查询，下月同样文件一键刷新。 **从文件夹获取**：数据→获取数据→自文件→从文件夹，选文件夹后 Power Query 合并其中全部同结构文件。每月 12 个分表合并成一张总表，用它 1 分钟搞定；新文件丢进文件夹后刷新即可。 **从数据库与网页获取**：数据→获取数据→自数据库（SQL Server、Access 等）或自网站（输入 URL 抓表格）。网页表格结构一变就要重配查询，适合结构稳定的公开表格（如汇率表）。 **导出格式取舍**：另存为 CSV 只保留当前工作表、无格式无公式，适合导给其他系统；导出 PDF（文件→导出→创建 PDF）保留排版与格式，适合发给领导；发给对方继续编辑的，一律发 .xlsx 原文件。 **刷新**：Power Query 导入的数据，源文件更新后在 Excel", "section": "tut", "ref": "data-management-05-import-export"}, {"id": "tut-charts-01-column-bar", "type": "tutorial", "column": "C07", "title": "柱形图与条形图", "text": "柱形图与条形图 **柱形图与条形图的区别**：柱形图的类别在横轴、数值在纵轴，柱子竖着长；条形图把两者对调，类别在纵轴、数值在横轴，条子横着长。两者表达的信息完全一样，选哪个只看类别名称有多长、类别有多少个。 **簇状与堆积的区别**：簇状是把同一类别的不同系列并排比较大小；堆积是把同一类别的不同系列叠起来，既看合计又看构成；百分比堆积不看绝对值，只看每个系列在合计里的占比。 **一图只讲一件事**：一张图只回答一个问题。既想比大小又想看占比时，拆成两张图，不要把两种结论塞进一张图。 基础概念 **柱形图与条形图的区别**：柱形图的类别在横轴、数值在纵轴，柱子竖着长；条形图把两者对调，类别在纵轴、数值在横轴，条子横着长。两者表达的信息完全一样，选哪个只看类别名称有多长、类别有多少个。 **簇状与堆积的区别**：簇状是把同一类别的不同系列并排比较大小；堆积是把同一类别的不同系列叠起来，既看合计又看构成；百分比堆积不看绝对值，只看每个系列在合计里的占比。 **一图只讲一件事**：一张图只回答一个问题。既想比大小又想看占比时，拆成两张图，不要把两种结论塞进一张图。 簇状柱形图 Clustered Column 比较同一类别下多个系列的数值大小，例如四个季度里华东、华北、华南三个区域的销售额对比。 堆积柱形图 Stacked Column 既看每个季度的销售合计，又看华东、华北、华南三地在", "section": "tut", "ref": "charts-01-column-bar"}, {"id": "chartsec-charts-01-column-bar-0", "type": "tutorial", "column": "C07", "title": "簇状柱形图", "text": "簇状柱形图 Clustered Column 比较同一类别下多个系列的数值大小，例如四个季度里华东、华北、华南三个区域的销售额对比。 选中数据区域 A1:E5（含表头）。 点插入选项卡，在图表组里点柱形图，选簇状柱形图。 右键图表，点添加数据标签，让每根柱子顶上显示数值。 选中网格线按 Delete 删除，保持画面干净。 双击图表标题，改成结论句，例如“四季度三个区域全部创新高”。", "section": "tut", "ref": "charts-01-column-bar"}, {"id": "chartsec-charts-01-column-bar-1", "type": "tutorial", "column": "C07", "title": "堆积柱形图", "text": "堆积柱形图 Stacked Column 既看每个季度的销售合计，又看华东、华北、华南三地在合计里的构成，例如四季度合计 460 万元，其中华东 180 万元、华北 160 万元、华南 120 万元。 选中数据区域 A1:D5（只选三地数值列，不用选合计列，否则合计会被当成第四个系列叠上去）。 点插入选项卡，在图表组里点柱形图，选堆积柱形图。 右键图表，点添加数据标签，核对每段数值与表一致。 图例放图表底部，标题改成结论句，例如“四季度合计最高，三地全部过百万元”。", "section": "tut", "ref": "charts-01-column-bar"}, {"id": "chartsec-charts-01-column-bar-2", "type": "tutorial", "column": "C07", "title": "百分比堆积柱形图", "text": "百分比堆积柱形图 100% Stacked Column 不比较绝对销售额，只比较结构变化，例如华东占比是否逐季下滑、华南占比是否逐季上升。 选中数据区域 A1:D5（同样不要选合计列）。 点插入选项卡，在图表组里点柱形图，选百分比堆积柱形图。 纵轴会显示 0% 到 100%，不用手动调。 右键图表，点添加数据标签，标签显示为百分比。 标题写结构结论，例如“华南占比从 22.2% 升到 26.1%”。", "section": "tut", "ref": "charts-01-column-bar"}, {"id": "chartsec-charts-01-column-bar-3", "type": "tutorial", "column": "C07", "title": "条形图", "text": "条形图 Bar Chart 类别名称长、类别多（超过 8 个）时的数值比较，例如产品线销售额排名，笔记本电脑、智能手机这类较长的名称在横向条形里不会挤在一起。 选中数据区域 A1:B6（含表头）。 点插入选项卡，在图表组里点条形图，选簇状条形图。 右键纵轴，点设置坐标轴格式，勾选逆序类别，让销售额最高的智能手机排在最上面。 右键图表，点添加数据标签。 标题改成结论句，例如“智能手机销售额第一，是无线耳机的 3 倍多”。", "section": "tut", "ref": "charts-01-column-bar"}, {"id": "tut-charts-02-line-area", "type": "tutorial", "column": "C07", "title": "折线图与面积图", "text": "折线图与面积图 **折线图看变化**：折线图的横轴通常是时间，纵轴是数值，线的走向就是趋势。线往上走是增长，往下走是下滑，忽上忽下是波动。时间必须是连续等距的，缺了某个月要补上空值，不能直接跳过。 **面积图看体量**：面积图就是折线图下方填了颜色，填充的面积越大，数值越大。它比折线图更有视觉冲击力，但多系列面积图会互相遮挡，只适合单系列或两三个系列。 **趋势线是拟合不是预测**：趋势线是 Excel 按现有数据算出的一条最贴合的线，R 平方越接近 1，贴合越好。趋势线可以外推预测，但预测越远越不可靠，只能作参考。 基础概念 **折线图看变化**：折线图的横轴通常是时间，纵轴是数值，线的走向就是趋势。线往上走是增长，往下走是下滑，忽上忽下是波动。时间必须是连续等距的，缺了某个月要补上空值，不能直接跳过。 **面积图看体量**：面积图就是折线图下方填了颜色，填充的面积越大，数值越大。它比折线图更有视觉冲击力，但多系列面积图会互相遮挡，只适合单系列或两三个系列。 **趋势线是拟合不是预测**：趋势线是 Excel 按现有数据算出的一条最贴合的线，R 平方越接近 1，贴合越好。趋势线可以外推预测，但预测越远越不可靠，只能作参考。 折线图 Line Chart 展示数值随时间的变化趋势，例如 12 个月营收从 120 万元涨到 240 万元，中间 3 月和 6 月各有一次小幅回落。 面积", "section": "tut", "ref": "charts-02-line-area"}, {"id": "chartsec-charts-02-line-area-0", "type": "tutorial", "column": "C07", "title": "折线图", "text": "折线图 Line Chart 展示数值随时间的变化趋势，例如 12 个月营收从 120 万元涨到 240 万元，中间 3 月和 6 月各有一次小幅回落。 选中数据区域 A1:B13（含表头）。 点插入选项卡，在图表组里点折线图，选带数据标记的折线图。 右键横轴，确认横轴是 1 月到 12 月按顺序排列，没有跳月。 右键图表，点添加数据标签，数值标在点的上方。 标题改成结论句，例如“营收全年翻倍，12 月达到 240 万元”。", "section": "tut", "ref": "charts-02-line-area"}, {"id": "chartsec-charts-02-line-area-1", "type": "tutorial", "column": "C07", "title": "面积图", "text": "面积图 Area Chart 展示单一系列随时间的累计体量感，例如 12 个月新增用户从每月 8 千人涨到 25 千人，面积越大表示当月新增越多。 选中数据区域 A1:B13（含表头）。 点插入选项卡，在图表组里点面积图，选二维面积图。 面积颜色设 50% 透明度，线条颜色与面积同色加深。 纵轴从 0 开始，标题改成结论句，例如“下半年每月新增用户稳定在 17 千人以上”。", "section": "tut", "ref": "charts-02-line-area"}, {"id": "chartsec-charts-02-line-area-2", "type": "tutorial", "column": "C07", "title": "趋势线", "text": "趋势线 Trendline 在折线图或散点图上叠加一条拟合线，判断数据整体是上升还是下降、上升有多快，例如 12 个月营收的线性趋势线斜率为正，说明营收整体向上。 先按折线图的做法做出 12 个月营收折线图。 右键折线上的任一数据点，点添加趋势线。 在设置趋势线格式窗格里选线性。 勾选显示公式与显示 R 平方值，公式和 R 平方值会出现在图表上。 需要预测时，在预测栏里填向后预测的周期数，例如向后 3 个周期。", "section": "tut", "ref": "charts-02-line-area"}, {"id": "tut-charts-03-pie-doughnut", "type": "tutorial", "column": "C07", "title": "饼图与圆环图", "text": "饼图与圆环图 **饼图看占比**：饼图把一个整体切成若干扇形，每块扇形的角度就是它在整体里的占比。饼图只适合展示一个整体的构成，类别一般不超过 6 个，类别太多时小扇形挤在一起，根本读不出来。 **圆环图是空心饼图**：圆环图与饼图表达的信息相同，区别是中间空出一块，可以放总计数字或标题。多系列圆环图可以套多层环，每层环是一个整体，适合对比两个时期的结构。 **复合饼图是主饼加子饼**：主饼里太小的几项会被合并成“其他”，子饼再把“其他”展开。这样既保住了主饼的简洁，又没有丢掉小类别的信息。 基础概念 **饼图看占比**：饼图把一个整体切成若干扇形，每块扇形的角度就是它在整体里的占比。饼图只适合展示一个整体的构成，类别一般不超过 6 个，类别太多时小扇形挤在一起，根本读不出来。 **圆环图是空心饼图**：圆环图与饼图表达的信息相同，区别是中间空出一块，可以放总计数字或标题。多系列圆环图可以套多层环，每层环是一个整体，适合对比两个时期的结构。 **复合饼图是主饼加子饼**：主饼里太小的几项会被合并成“其他”，子饼再把“其他”展开。这样既保住了主饼的简洁，又没有丢掉小类别的信息。 饼图 Pie Chart 展示一个整体的构成占比，例如市场份额：华东 35%、华北 25%、华南 20%、华西 12%、其他 8%，五项合计 100%。 圆环图 Doughnut Chart 展示一个整体的构", "section": "tut", "ref": "charts-03-pie-doughnut"}, {"id": "chartsec-charts-03-pie-doughnut-0", "type": "tutorial", "column": "C07", "title": "饼图", "text": "饼图 Pie Chart 展示一个整体的构成占比，例如市场份额：华东 35%、华北 25%、华南 20%、华西 12%、其他 8%，五项合计 100%。 选中数据区域 A1:B6（含表头）。 点插入选项卡，在图表组里点饼图，选二维饼图。 右键饼图，点添加数据标签，再右键数据标签，勾选百分比，取消勾选值。 把最大的扇形（华东 35%）向外拖出一点，突出重点。 标题改成结论句，例如“华东占三分之一以上，是第一大市场”。", "section": "tut", "ref": "charts-03-pie-doughnut"}, {"id": "chartsec-charts-03-pie-doughnut-1", "type": "tutorial", "column": "C07", "title": "圆环图", "text": "圆环图 Doughnut Chart 展示一个整体的构成占比，同时想在图中心放总计数字，例如费用结构：人力成本 45%、房租 20%、营销推广 15%、设备折旧 12%、其他 8%，五项合计 100%。 选中数据区域 A1:B6（含表头）。 点插入选项卡，在图表组里点饼图下拉，选圆环图。 右键圆环，点添加数据标签，勾选百分比。 在圆环中心插入文本框，写总计或标题，例如“月费用 100%”。 标题改成结论句，例如“人力成本占近一半，是最大的费用项”。", "section": "tut", "ref": "charts-03-pie-doughnut"}, {"id": "chartsec-charts-03-pie-doughnut-2", "type": "tutorial", "column": "C07", "title": "复合饼图", "text": "复合饼图 Pie of Pie 主饼里有几项太小、直接展示读不出来时，把它们合并成“其他”再用子饼展开，例如市场份额主饼只留华东 35%、华北 25%、其他 40%，子饼把其他 40% 展开为华南 20%、华西 12%、其他 8%。 选中完整数据区域 A1:B6（五类原始数据：华东 35、华北 25、华南 20、华西 12、其他 8）。 点插入选项卡，在图表组里点饼图下拉，选复合饼图。 右键主饼，点设置数据系列格式，在第二绘图区包含最后 3 个值（即华南、华西、其他进子饼）。 两个饼都添加百分比数据标签。 标题改成结论句，例如“华东、华北合计占 60%，其余三地合计占 40%”。", "section": "tut", "ref": "charts-03-pie-doughnut"}, {"id": "tut-charts-04-scatter-bubble", "type": "tutorial", "column": "C07", "title": "散点图与气泡图", "text": "散点图与气泡图 **散点图看关系**：散点图的横轴与纵轴都是数值，每个点是一次观测。点越接近一条直线，两个变量的关系越强；点散成一团，说明两者没什么关系。散点图只回答“有没有关系”，不回答“谁导致谁”。 **气泡图是三维散点图**：气泡图在散点图的基础上加了第三个变量，用气泡的大小表示。横轴一个变量、纵轴一个变量、气泡大小一个变量，一张图能同时讲三个维度。 **回归分析是给散点找一条线**：线性回归用最小二乘法给散点找一条最贴合的直线，方程写成 y = a x + b，R 平方表示这条线解释了多少波动。R 平方越接近 1，线越贴合。 基础概念 **散点图看关系**：散点图的横轴与纵轴都是数值，每个点是一次观测。点越接近一条直线，两个变量的关系越强；点散成一团，说明两者没什么关系。散点图只回答“有没有关系”，不回答“谁导致谁”。 **气泡图是三维散点图**：气泡图在散点图的基础上加了第三个变量，用气泡的大小表示。横轴一个变量、纵轴一个变量、气泡大小一个变量，一张图能同时讲三个维度。 **回归分析是给散点找一条线**：线性回归用最小二乘法给散点找一条最贴合的直线，方程写成 y = a x + b，R 平方表示这条线解释了多少波动。R 平方越接近 1，线越贴合。 散点图 Scatter Chart 判断两个数值变量之间有没有关系，例如广告费越高，销售额是不是也越高；8 个观测点的分布是否", "section": "tut", "ref": "charts-04-scatter-bubble"}, {"id": "chartsec-charts-04-scatter-bubble-0", "type": "tutorial", "column": "C07", "title": "散点图", "text": "散点图 Scatter Chart 判断两个数值变量之间有没有关系，例如广告费越高，销售额是不是也越高；8 个观测点的分布是否大致沿一条直线上升。 选中数据区域 A1:B9（含表头）。 点插入选项卡，在图表组里点散点图，选仅带数据标记的散点图。 横轴放广告费（自变量），纵轴放销售额（因变量），不要放反。 右键横轴与纵轴，把刻度调成从 0 开始，避免分布被拉变形。 标题改成结论句，例如“广告费越高，销售额越高，8 个点大致沿直线分布”。", "section": "tut", "ref": "charts-04-scatter-bubble"}, {"id": "chartsec-charts-04-scatter-bubble-1", "type": "tutorial", "column": "C07", "title": "气泡图", "text": "气泡图 Bubble Chart 同时展示三个变量，例如五款产品的销量（横轴）、单价（纵轴）与利润（气泡大小），一眼看出 D 款利润最大、E 款单价最高但销量最低。 选中数据区域 A1:D6（含表头，产品列是标签列）。 点插入选项卡，在图表组里点散点图下拉，选气泡图。 右键图表点选择数据，确认 X 值是销量列、Y 值是单价列、气泡大小是利润列。 给每个气泡加上产品标签（A 款到 E 款），否则读者不知道哪个气泡是谁。 标题改成结论句，例如“D 款利润 9000 元最高，E 款单价最高但销量最低”。", "section": "tut", "ref": "charts-04-scatter-bubble"}, {"id": "chartsec-charts-04-scatter-bubble-2", "type": "tutorial", "column": "C07", "title": "回归分析", "text": "回归分析 Regression Analysis 给散点图配一条回归直线并量化关系强度，例如广告费与销售额的回归方程为销售额 = 4.30 x 广告费 + 23.08，R 平方 = 0.995，说明广告费能解释销售额 99.5% 的波动。 先按散点图的做法做出广告费与销售额的散点图。 右键任一数据点，点添加趋势线。 在设置趋势线格式窗格里选线性。 勾选显示公式与显示 R 平方值，图表上出现方程与 R 平方值。 读出方程：销售额 = 4.30 x 广告费 + 23.08，R 平方 = 0.995。", "section": "tut", "ref": "charts-04-scatter-bubble"}, {"id": "tut-charts-05-combo", "type": "tutorial", "column": "C07", "title": "组合图", "text": "组合图 **组合图是一张图两种图形**：组合图把柱形图与折线图画在同一张图上，柱子看绝对值，折线看比率或趋势。两个系列的量级差太大时，折线会被压成一条直线，这时就要给它单独配一个坐标轴。 **双轴是组合图的标配**：左轴管柱子（销售额，万元），右轴管折线（增长率，%）。双轴让两个量级的序列都能正常显示，但双轴也容易误导：左右轴的刻度一改，两条线的相对位置就全变了。 **帕累托图是柱形图加累计折线**：帕累托图按数量从大到小排柱子，再叠加一条累计占比折线，帮你找到“关键的少数”。帕累托法则说：80% 的问题往往由 20% 的原因造成。 基础概念 **组合图是一张图两种图形**：组合图把柱形图与折线图画在同一张图上，柱子看绝对值，折线看比率或趋势。两个系列的量级差太大时，折线会被压成一条直线，这时就要给它单独配一个坐标轴。 **双轴是组合图的标配**：左轴管柱子（销售额，万元），右轴管折线（增长率，%）。双轴让两个量级的序列都能正常显示，但双轴也容易误导：左右轴的刻度一改，两条线的相对位置就全变了。 **帕累托图是柱形图加累计折线**：帕累托图按数量从大到小排柱子，再叠加一条累计占比折线，帮你找到“关键的少数”。帕累托法则说：80% 的问题往往由 20% 的原因造成。 柱线组合图 Combo Chart 同时展示绝对值与比率，例如 1 月到 6 月的销售额（柱，万元）与增长率（线，%）", "section": "tut", "ref": "charts-05-combo"}, {"id": "chartsec-charts-05-combo-0", "type": "tutorial", "column": "C07", "title": "柱线组合图", "text": "柱线组合图 Combo Chart 同时展示绝对值与比率，例如 1 月到 6 月的销售额（柱，万元）与增长率（线，%），同一组月份，两个视角一次看完。 选中数据区域 A1:C7（含表头）。 点插入选项卡，在图表组里点组合图，选簇状柱形图与折线图的组合。 在弹出的对话框里，把销售额设为簇状柱形图，把增长率设为折线图，并勾选增长率的次坐标轴。 右键折线，点添加数据标签，标签显示百分比。 标题改成结论句，例如“6 月销售额最高，增长率也最高，达到 18%”。", "section": "tut", "ref": "charts-05-combo"}, {"id": "chartsec-charts-05-combo-1", "type": "tutorial", "column": "C07", "title": "双轴图", "text": "双轴图 Dual Axis Chart 两个量级不同的序列画在一张图上，例如销售额 120 到 210 万元与增长率 6% 到 18% 共用 1 月到 6 月的横轴，左轴读销售额，右轴读增长率。 选中数据区域 A1:C7（含表头），先插入一张簇状柱形图。 右键代表增长率的系列，点设置数据系列格式。 在系列选项里选次坐标轴，该系列移到右轴。 右键该系列，点更改系列图表类型，改成折线图。 左右轴标题分别写清楚：左轴“销售额（万元）”，右轴“增长率（%）”。", "section": "tut", "ref": "charts-05-combo"}, {"id": "chartsec-charts-05-combo-2", "type": "tutorial", "column": "C07", "title": "帕累托图", "text": "帕累托图 Pareto Chart 找出造成大多数问题的原因，例如五种不合格原因中，划伤与色差两项就占了 73% 的不合格件数，先解决这两项，效果最大。 选中数据区域 A1:B6（原因与件数两列，不用选累计占比列，Excel 会自动算）。 点插入选项卡，在图表组里点直方图下拉，选帕累托图。 柱子自动按件数从大到小排列，折线是累计占比。 右键折线，点添加数据标签，标签显示百分比。 标题改成结论句，例如“划伤与色差占不合格总数的 73%，优先解决这两项”。", "section": "tut", "ref": "charts-05-combo"}, {"id": "tut-charts-06-new-charts", "type": "tutorial", "column": "C07", "title": "新图表类型", "text": "新图表类型 **新图表的分界线是 2016 与 2019**：微软官方博客（2015 年 7 月 2 日）宣布 Office 2016 预览版新增六种图表：瀑布图、直方图、帕累托图、箱形图、树状图、旭日图。2016 与 2019 之间又新增两种：漏斗图与填充地图图表。打开旧版本文件时，这些图表会显示为静态图片或报错，分享前要确认对方的版本。 **新图表不是万能的**：瀑布图只适合有正负增减的累计过程，直方图只适合看分布，箱形图只适合对比多组分布，旭日图与树状图只适合两到三层结构。选错图表比不做图更糟。 基础概念 **新图表的分界线是 2016 与 2019**：微软官方博客（2015 年 7 月 2 日）宣布 Office 2016 预览版新增六种图表：瀑布图、直方图、帕累托图、箱形图、树状图、旭日图。2016 与 2019 之间又新增两种：漏斗图与填充地图图表。打开旧版本文件时，这些图表会显示为静态图片或报错，分享前要确认对方的版本。 **新图表不是万能的**：瀑布图只适合有正负增减的累计过程，直方图只适合看分布，箱形图只适合对比多组分布，旭日图与树状图只适合两到三层结构。选错图表比不做图更糟。 瀑布图 Waterfall Chart 展示一个数值从期初到期末是怎样一步步变化的，例如现金从期初 500 万元，经过销售收入、采购成本、运营费用、税费，到期末 510 万元。 漏斗图 ", "section": "tut", "ref": "charts-06-new-charts"}, {"id": "chartsec-charts-06-new-charts-0", "type": "tutorial", "column": "C07", "title": "瀑布图", "text": "瀑布图 Waterfall Chart 展示一个数值从期初到期末是怎样一步步变化的，例如现金从期初 500 万元，经过销售收入、采购成本、运营费用、税费，到期末 510 万元。 选中数据区域 A1:B7（含表头）。 点插入选项卡，在图表组里点瀑布图。 右键期初现金与期末现金两个柱子，点设置为汇总，让它们从 0 开始画。 正数柱用绿色，负数柱用橙色，汇总柱用蓝色。 标题改成结论句，例如“现金净增 10 万元，销售收入是最大正向贡献”。", "section": "tut", "ref": "charts-06-new-charts"}, {"id": "chartsec-charts-06-new-charts-1", "type": "tutorial", "column": "C07", "title": "漏斗图", "text": "漏斗图 Funnel Chart 展示逐级减少的转化流程，例如访问 10000 人，到注册 4200 人、试用 1800 人、付费 640 人、续费 380 人，每一步的流失一目了然。 选中数据区域 A1:B6（含表头）。 点插入选项卡，在图表组里点漏斗图。 阶段按人数从大到小排列，顺序不要打乱。 右键图表，点添加数据标签，显示每阶段人数。 标题改成结论句，例如“访问到付费的整体转化率只有 6.4%，注册到试用流失最大”。", "section": "tut", "ref": "charts-06-new-charts"}, {"id": "chartsec-charts-06-new-charts-2", "type": "tutorial", "column": "C07", "title": "直方图", "text": "直方图 Histogram 展示一批数值的分布形态，例如 35 人考试成绩的分段人数：60 分以下 3 人、60 到 69 分 7 人、70 到 79 分 12 人、80 到 89 分 9 人、90 分以上 4 人，峰值在 70 到 79 分段。 准备一列原始成绩（35 个分数），选中这一列。 点插入选项卡，在图表组里点直方图下拉，选直方图。 右键横轴，点设置坐标轴格式，调整箱数与箱宽，例如箱宽 10 分。 柱子之间不要留空隙，直方图的柱子是挨着的。 标题改成结论句，例如“成绩集中在 70 到 89 分段，共 21 人”。", "section": "tut", "ref": "charts-06-new-charts"}, {"id": "chartsec-charts-06-new-charts-3", "type": "tutorial", "column": "C07", "title": "箱形图", "text": "箱形图 Box and Whisker Chart 对比多组数据的分布，包括中位数、四分位数与极值，例如三个部门的考试成绩分布：销售部中位数 78 分，技术部中位数 80 分，市场部中位数 74 分。 准备三列原始成绩（每列一个部门），选中三列。 点插入选项卡，在图表组里点箱形图。 图中箱子上下边是第一与第三四分位数，箱内横线是中位数，两端须线伸到最小值与最大值。 超出须线的点是异常值，单独显示，不要删掉。 标题改成结论句，例如“技术部中位数最高，市场部最低分最低、分布最散”。", "section": "tut", "ref": "charts-06-new-charts"}, {"id": "chartsec-charts-06-new-charts-4", "type": "tutorial", "column": "C07", "title": "旭日图", "text": "旭日图 Sunburst Chart 展示两到三层结构数据的占比，例如销售额按大类与小类分层：电子产品 580 万元（手机 320、电脑 260），家居 330 万元（家具 180、家电 150），服装 200 万元（男装 90、女装 110）。 按大类、小类、数值的顺序准备三列数据，层级从左到右排。 选中数据区域 A1:C7（含表头）。 点插入选项卡，在图表组里点旭日图。 内环是大类，外环是小类，同一大类的两个小类用同色系。 标题改成结论句，例如“电子产品占一半以上，手机是最大单项”。", "section": "tut", "ref": "charts-06-new-charts"}, {"id": "chartsec-charts-06-new-charts-5", "type": "tutorial", "column": "C07", "title": "树状图", "text": "树状图 Treemap 用矩形面积比较层级数据的大小，例如同一组销售额数据：手机 320 万元的矩形最大，男装 90 万元的矩形最小，面积一眼可比。 按大类、小类、数值的顺序准备三列数据。 选中数据区域 A1:C7（含表头）。 点插入选项卡，在图表组里点树状图。 每个矩形里标小类名与数值，字体大小随矩形面积自动调整。 标题改成结论句，例如“手机一块就占全部销售额的 28.8%”。", "section": "tut", "ref": "charts-06-new-charts"}, {"id": "chartsec-charts-06-new-charts-6", "type": "tutorial", "column": "C07", "title": "雷达图", "text": "雷达图 Radar Chart 多维度综合评价，例如两位员工六维能力评分：员工 A 技术 90 分、学习 92 分最高，创新 70 分最低；员工 B 各维比较均衡。 选中数据区域 A1:C7（含表头，维度放第一列）。 点插入选项卡，在图表组里点雷达图，选带数据标记的雷达图。 两个员工用不同颜色，填充透明度调到 25% 左右，两个多边形重叠处仍能看清。 维度数量控制在 5 到 8 个，太少不成网，太多读不出来。 标题改成结论句，例如“A 技术强、B 更均衡，A 的短板是创新”。", "section": "tut", "ref": "charts-06-new-charts"}, {"id": "chartsec-charts-06-new-charts-7", "type": "tutorial", "column": "C07", "title": "甘特图", "text": "甘特图 Gantt Chart 项目进度排期，例如一个项目五个阶段：需求调研 5 天、方案设计 8 天、开发实现 15 天、测试验收 6 天、上线发布 2 天，谁先谁后、谁长谁短一目了然。 准备任务、开始日期、工期三列数据。 选中数据区域，插入堆积条形图，得到两个系列：开始与工期。 选中开始系列，设为无填充、无边框，只剩工期系列可见。 右键纵轴，勾选逆序类别，让第一个任务排在最上面。 横轴设为日期刻度，标题改成结论句，例如“开发实现最长 15 天，是关键路径”。", "section": "tut", "ref": "charts-06-new-charts"}, {"id": "chartsec-charts-06-new-charts-8", "type": "tutorial", "column": "C07", "title": "地图图表", "text": "地图图表 Map Chart 展示地域分布，例如六个省份的销售额：广东 320 万元最高，湖北 120 万元最低，颜色越深表示销售额越高。 准备省份与销售额两列数据，省份名称必须规范填写（例如写广东，不要写粤）。 选中数据区域，点数据选项卡，点地理数据类型，把省份列转换为地理数据类型。 选中数据区域，点插入选项卡，在图表组里点地图，选填充地图。 在设置数据系列格式里选颜色范围，数值越大颜色越深。 标题改成结论句，例如“广东销售额最高，是湖北的 2.7 倍”。", "section": "tut", "ref": "charts-06-new-charts"}, {"id": "tut-charts-07-formatting", "type": "tutorial", "column": "C07", "title": "图表格式化", "text": "图表格式化 **图表元素是零件**：标题、坐标轴、网格线、图例、数据标签、数据表、趋势线、误差线，一共九大元素。每个元素都可以开关。默认全开的图表最臃肿，好图表是做减法做出来的。 **配色是信息不是装饰**：颜色要用来区分系列或突出重点，不是用来好看。同一系列在全站所有图表里用同一个颜色，读者看一眼颜色就知道是哪个系列。 **动态图表是公式驱动的图**：动态图表的数据源不是固定区域，而是指向公式取数的区域。下拉菜单一变，公式取数跟着变，图表跟着变。图表本身不用重做。 基础概念 **图表元素是零件**：标题、坐标轴、网格线、图例、数据标签、数据表、趋势线、误差线，一共九大元素。每个元素都可以开关。默认全开的图表最臃肿，好图表是做减法做出来的。 **配色是信息不是装饰**：颜色要用来区分系列或突出重点，不是用来好看。同一系列在全站所有图表里用同一个颜色，读者看一眼颜色就知道是哪个系列。 **动态图表是公式驱动的图**：动态图表的数据源不是固定区域，而是指向公式取数的区域。下拉菜单一变，公式取数跟着变，图表跟着变。图表本身不用重做。 图表元素 Chart Elements 检查与调整一张图表的全部零件，例如给季度销售额柱形图加上数据标签、删掉网格线、把标题改成结论句。 配色与样式 Color and Style 给同一组数据换一套配色方案并对比效果，例如季度销售额分别用商务蓝、莫兰迪、暖", "section": "tut", "ref": "charts-07-formatting"}, {"id": "chartsec-charts-07-formatting-0", "type": "tutorial", "column": "C07", "title": "图表元素", "text": "图表元素 Chart Elements 检查与调整一张图表的全部零件，例如给季度销售额柱形图加上数据标签、删掉网格线、把标题改成结论句。 用合计列做一张簇状柱形图。 点图表右上角的加号，打开图表元素清单，逐项检查九大元素。 勾选数据标签，让每根柱子顶上显示数值。 取消勾选网格线，图表立刻干净一半。 双击图表标题，改成结论句，例如“四季度合计 460 万元，全年最高”。", "section": "tut", "ref": "charts-07-formatting"}, {"id": "chartsec-charts-07-formatting-1", "type": "tutorial", "column": "C07", "title": "配色与样式", "text": "配色与样式 Color and Style 给同一组数据换一套配色方案并对比效果，例如季度销售额分别用商务蓝、莫兰迪、暖色三套方案，看哪套最适合正式汇报。 用季度销售额合计列做一张簇状柱形图。 点图表工具设计选项卡，点更改颜色，选一套内置配色。 需要自定义时，右键系列，点设置数据系列格式，在填充里输入主色代码，例如商务蓝 #2E75B6。 全站统一：华东永远用商务蓝，华北永远用橙色，华南永远用绿色。 需要突出某一根柱子时，只把那根柱子改成橙色，其余保持商务蓝。", "section": "tut", "ref": "charts-07-formatting"}, {"id": "chartsec-charts-07-formatting-2", "type": "tutorial", "column": "C07", "title": "动态图表", "text": "动态图表 Dynamic Chart 下拉菜单联动图表，例如下拉选 6 月，图表只显示当月与相邻月份的营收；选 12 月，图表就切换到 12 月的数据，不用重做图表。 用数据验证在单元格里做一个月份下拉菜单（1 月到 12 月）。 用 INDEX 与 MATCH 按下拉选择取数：先 MATCH 找到月份所在行，再 INDEX 取出当月与相邻月份的营收。 图表数据源指向取数区域，不要指向原始数据表。 下拉选 6 月，检查图表是否只显示 5 月、6 月、7 月三根柱子。 下拉换成 12 月，检查图表是否跟着切换。", "section": "tut", "ref": "charts-07-formatting"}, {"id": "tut-powerpivot-dax-01-data-model", "type": "tutorial", "column": "C10", "title": "数据模型：把多张表变成一个可分析的整体", "text": "数据模型：把多张表变成一个可分析的整体 ### 2.1 什么是数据模型 数据模型是 Power Pivot 里的一组表加上表之间的关系。普通 Excel 工作表之间是孤立的，跨表取值要写 VLOOKUP；放进数据模型后，表与表通过关系连起来，透视表和 DAX 公式可以直接跨表计算，不用再写一堆查找公式。 本篇配套示例共 4 张表：订单表 12 行、产品表 5 行、客户表 4 行、日期表 455 行（2025-01-01 至 2026-03-31，每日一行）。行数与配套示例文件逐项一致。 ### 2.2 事实表与维度表 - **事实表**：记录业务事件的表，行数多、数字列多。本例中订单表是事实表：每一行是一笔订单，含订单号、日期、客户编号、产品编号、数量。 - **维度表**：描述事实的表，行数少、文本列多。本例中产品表、客户表、日期表都是维度表：产品表描述卖的是什么，客户表描述卖给谁，日期表描述发生在何时。 判断方法：问一句“这张表的一行代表一次业务发生，还是代表一个固定对象？”前者是事实表，后者是维度表。 ### 2.3 主键与外键 - **主键**：维度表里唯一标识一行的列，值不能重复、不能为空。产品表的产品编号（P001 至 P005）、客户表的客户编号（C001 至 C004）、日期表的日期（455 个日期各不相同）都是主键。 - **外键**：事实表里指向维度表主键的列，", "section": "tut", "ref": "powerpivot-dax-01-data-model"}, {"id": "tut-powerpivot-dax-02-dax-basics", "type": "tutorial", "column": "C10", "title": "DAX 基础：语法、计算列与度量值、行上下文与筛选上下文", "text": "DAX 基础：语法、计算列与度量值、行上下文与筛选上下文 ### 2.1 DAX 是什么 DAX（Data Analysis Expressions，数据分析表达式）是 Power Pivot 里写公式的语言。外形像 Excel 函数：SUM、AVERAGE、IF 这些名字都一样；思维是列式的：公式操作的是整列、整张表，而不是单个单元格。写 DAX 之前先忘掉“A1 单元格”这种定位方式，改成想“对哪张表的哪一列、按什么条件算”。 ### 2.2 DAX 语法 - 表名用单引号括起来（表名含中文或空格时必须写）：`'订单'`，或省略单引号写 `订单`。 - 列引用写成 `表[列]`：`订单[金额]`、`产品[单价]`。 - 度量值引用只写方括号：`[总销售额]`，前面不加表名。 - 计算列公式以等号开头：`= 订单[数量] * RELATED(产品[单价])`；度量值公式同样以等号开头：`= SUM(订单[金额])`。 - 注释用双斜线：`// 这是注释`。 ### 2.3 计算列与度量值 | 对比项 | 计算列 | 度量值 | |---|---|---| | 存在位置 | 表里真实的一列，每行都有一个值 | 不占列，只在透视表、图表里现算出一个值 | | 计算时机 | 数据加载或刷新时逐行算好、存起来 | 查询时按当前筛选现算 | | 典型用途 | 每行都要用的派生值，如订单金额", "section": "tut", "ref": "powerpivot-dax-02-dax-basics"}, {"id": "tut-powerpivot-dax-03-measures-calculated-columns", "type": "tutorial", "column": "C10", "title": "度量值与计算列：CALCULATE、SUMX、RELATED、FILTER、ALL 与 KPI", "text": "度量值与计算列：CALCULATE、SUMX、RELATED、FILTER、ALL 与 KPI ### 2.1 度量值写在哪里、怎么复用 度量值统一建在事实表（本例是订单表）上，命名用中文业务名：总销售额、总利润、利润率。不要把同一个总销售额在 5 张表上各写一遍，也不要在透视表里现写一次性公式。一处定义、处处引用：客单价引用总销售额，同比引用总销售额和去年同期，改一处就全改了。 度量值之间可以互相引用，引用时只写方括号：`[总销售额]`。写度量值时先想好依赖链：基础度量值（总销售额、总利润）→ 派生度量值（利润率、客单价、同比）→ 展示度量值（完成率、排名）。 ### 2.2 五个函数的分工 | 函数 | 作用一句话 | 关键点 | |---|---|---| | CALCULATE | 改筛选上下文后再算 | DAX 里唯一能改筛选上下文的函数 | | SUMX | 逐行算表达式、再求和 | 迭代函数，每行都有行上下文 | | RELATED | 取关联表（一端）的字段值 | 只能从多端取一端，写在计算列里 | | FILTER | 按条件筛出一张子表 | 返回表，不能单独做度量值，要配聚合函数 | | ALL | 去掉筛选（全部或指定列） | 常用来算分母（总计）和占比 | ### 2.3 KPI 的思路 KPI 不是一个公式，而是一组互相印证的度量值：规模类（总销售额 75", "section": "tut", "ref": "powerpivot-dax-03-measures-calculated-columns"}, {"id": "tut-powerpivot-dax-04-time-intelligence", "type": "tutorial", "column": "C10", "title": "时间智能：日期表、DATESYTD、TOTALYTD、SAMEPERIODLASTYEAR、DATEADD 与同比环比", "text": "时间智能：日期表、DATESYTD、TOTALYTD、SAMEPERIODLASTYEAR、DATEADD 与同比环比 ### 2.1 为什么必须建日期表 时间智能函数（TOTALYTD、SAMEPERIODLASTYEAR、DATEADD）不是直接算订单表的日期，而是先在日期表上平移日期、再去订单表取值。如果没有日期表，会出现三个问题： 1. 没有订单的月份直接消失：订单表只有 2025-01、02、03、06 和 2026-01、02、03 有记录，2025-04、05 没有订单；按订单日期分组，4 月和 5 月根本不出现，折线图会断掉。 2. 去年同期对不上：SAMEPERIODLASTYEAR 要把 2026-03 平移到 2025-03，没有一张连续的日期表，平移没有落点。 3. 年初至今算不全：TOTALYTD 要从 1 月 1 日累计到当前日期，订单表缺失的日期会让累计口径不稳定。 日期表就是一张“日历”：从开始日期到结束日期，每日一行，有没有订单都有这一行。透视表按日期表的月分组，12 个月永远齐全，没有订单的月份显示空白而不是消失。 ### 2.2 日期表的 6 条要求 按 Microsoft 官方文档，时间智能函数正常工作要求日期表满足： 1. 日期列是日期类型，不能是文本。 2. 日期值唯一，不能重复。 3. 日期列没有空值。 4. 日期连续，不能缺失任何一天", "section": "tut", "ref": "powerpivot-dax-04-time-intelligence"}, {"id": "tut-powerpivot-dax-05-advanced-dax-cases", "type": "tutorial", "column": "C10", "title": "高级 DAX 与商业案例：排名、TOPN、动态度量值、销售仪表盘与库存周转", "text": "高级 DAX 与商业案例：排名、TOPN、动态度量值、销售仪表盘与库存周转 ### 2.1 组合的思路 单个函数解决单个问题，组合解决真实问题。高价值订单利润要先筛（FILTER）再逐行算（SUMX）；排名要先定范围（ALL）再比大小（RANKX）；动态标题要先取当前筛选值（SELECTEDVALUE）再拼字符串。写高级 DAX 时先画三步：筛出哪些行、对每行算什么、最后怎么汇总。 ### 2.2 RANKX 与 TOPN 的区别 - **RANKX**：给每一行一个名次。返回的是数字（1、2、3），适合放在透视表里当一列看。 - **TOPN**：返回前 N 行组成的一张子表。返回的是表，不能直接当度量值，要配 SUMX 或 COUNTROWS 用，适合算“前 N 名合计”。 两者都要注意并列：RANKX 默认并列同名次、下一名次跳号；TOPN 遇到并列边界时可能多返回一行（例如第 2 名和第 3 名同分，TOPN(2) 会返回 3 行），做“前 N 名合计”时要先检查边界有没有并列。 ### 2.3 动态标题与动态度量值 - **动态标题**：一个度量值返回文本，标题引用它。切片器选华东，标题变成“华东地区销售额”；不选，标题是“全部地区销售额”。 - **动态度量值**：一个切片器切换指标。参数表里放三行（销售额、利润、利润率），度量值用 SWITCH 判断当前选了哪一行，再", "section": "tut", "ref": "powerpivot-dax-05-advanced-dax-cases"}, {"id": "tut-vba-05-advanced", "type": "tutorial", "column": "C11", "title": "VBA 进阶：用户窗体、类模块、加载宏与错误处理进阶", "text": "VBA 进阶：用户窗体、类模块、加载宏与错误处理进阶 ### 1.1 用户窗体（UserForm） UserForm 是 VBA 自带的对话框设计器：在 VBE 中「插入 → 用户窗体」，拖入文本框（TextBox）、标签（Label）、下拉框（ComboBox）、按钮（CommandButton）等控件，双击控件写事件代码。窗体本身是一个对象，有 `Show`、`Hide`、`Unload` 三个基本动作： - `Show`：显示窗体。默认模态（vbModal，值为 1）：用户必须先关闭窗体才能操作工作表，`Show` 之后的代码暂停执行，直到窗体关闭或隐藏。 - `Show vbModeless`（值为 0）：非模态：用户可以一边开着窗体一边操作工作表，`Show` 之后的代码立即继续执行。 - `Hide`：隐藏窗体但保留其中的输入值；`Unload Me`：彻底卸载，输入值丢失。 窗体有两个最常用的事件：`UserForm_Initialize`（窗体第一次加载时执行一次，适合填下拉框初始值）和各控件的 `Click` / `Change` 事件。窗体代码写在窗体自己的代码窗口里（双击窗体打开），而「显示窗体」的那行 `frmEntry.Show` 通常写在标准模块里。 ### 1.2 类模块（Class Module） 类模块是自定义对象的蓝图：在 VBE 中「插入 → ", "section": "tut", "ref": "vba-05-advanced"}, {"id": "tut-office-scripts-01-introduction", "type": "tutorial", "column": "C12", "title": "Office Scripts 入门：不用 VBA 也能让 Excel 自己干活", "text": "Office Scripts 入门：不用 VBA 也能让 Excel 自己干活 ### 2.1 Office Scripts 是什么 Office Scripts 是 Excel 里的一套自动化功能：把一串重复操作写成脚本（Script），以后点一下运行，Excel 就按脚本把这些操作自动做完。它用 TypeScript 写代码，脚本存在云端（OneDrive for Business 或 SharePoint），运行也在云端完成。 一句话定位：Office Scripts 是“云端版的 Excel 宏”，面向的是网页版 Excel 和跨平台办公；VBA 是“桌面版的 Excel 宏”，面向的是 Windows 桌面版 Excel。 ### 2.2 它由哪几部分组成 - **操作记录器（Action Recorder）**：不用写代码，把手动操作录下来，Excel 自动生成一段 TypeScript 脚本。适合“动作固定、每周都要做一次”的任务。 - **代码编辑器（Code Editor）**：在浏览器里直接写 TypeScript，可以加判断、循环和参数。适合录制做不到的任务，例如“只处理金额大于 10000 的行”。 - **自动执行（Automate）选项卡**：网页版 Excel 功能区里的入口，所有脚本的新建、查看、运行都从这里开始。 - **Power Automat", "section": "tut", "ref": "office-scripts-01-introduction"}, {"id": "tut-office-scripts-02-typescript-basics", "type": "tutorial", "column": "C12", "title": "TypeScript 基础：写出你的第一段 Office Scripts 代码", "text": "TypeScript 基础：写出你的第一段 Office Scripts 代码 ### 2.1 TypeScript 与 Office Scripts 的关系 Office Scripts 的脚本语言是 TypeScript。TypeScript 是 JavaScript 的超集：会 JavaScript 的人，写 TypeScript 只需要多学一样东西，就是类型注解（写明每个变量是什么类型）。Office Scripts 只支持 TypeScript 的一个子集，不支持引用外部第三方库，只能用内置 JavaScript 对象与 Office Scripts API（Microsoft 官方文档“Using built-in JavaScript objects in Office Scripts”）。 ### 2.2 main 函数：脚本的入口 每个脚本必须有一个 main 函数，它是脚本的起点。它的第一个参数固定是 ExcelScript.Workbook 类型的工作簿对象，脚本通过这个参数拿到整个工作簿，再一层层往下取工作表、区域和表格（Microsoft 官方文档“Fundamentals for Office Scripts in Excel”）： ```typescript function main(workbook: ExcelScript.Workbook) {", "section": "tut", "ref": "office-scripts-02-typescript-basics"}, {"id": "tut-office-scripts-03-automation-cases", "type": "tutorial", "column": "C12", "title": "自动化实战：定时任务、Power Automate 联动与 3 个完整案例", "text": "自动化实战：定时任务、Power Automate 联动与 3 个完整案例 ### 2.1 Office Scripts 没有自己的触发器 Office Scripts 只负责“改工作簿”这一件事：它没有定时器，也没有“收到邮件就运行”这种事件触发。触发器由 Power Automate 提供，分工是：Power Automate 决定“什么时候跑”，Office Scripts 决定“跑的时候对工作簿做什么”。这个分工是理解本篇全部内容的前提。 ### 2.2 Power Automate 联动的三要素 - **触发器（Trigger）**：流程的起因。常用三种：定时触发（Scheduled cloud flow，按固定周期运行）、邮件到达（When a new email arrives，收到新邮件时运行）、手动触发（Manually trigger a flow，点按钮运行）。 - **Run script 动作**：Excel Online (Business) 连接器里的动作。它的作用是“在某个工作簿上运行某段脚本”。脚本存在 OneDrive for Business 的默认位置时用 Run script，脚本存在团队 SharePoint 库里时用 Run script from a SharePoint library（Microsoft 官方教程“Automati", "section": "tut", "ref": "office-scripts-03-automation-cases"}, {"id": "tut-python-excel-01-openpyxl", "type": "tutorial", "column": "C15", "title": "openpyxl：用 Python 读写 Excel 工作簿", "text": "openpyxl：用 Python 读写 Excel 工作簿 ### 2.1 openpyxl 是什么 openpyxl 是一个读写 xlsx 文件的 Python 库。它不启动 Excel、不需要装 Excel，在没有 Excel 的电脑（例如 Linux 服务器）上也能生成与读取 xlsx 文件。它操作的是文件本身：打开文件、改单元格、保存文件，全程 Excel 程序没有参与。 ### 2.2 三个核心对象 - 工作簿（Workbook）：一个 xlsx 文件就是一个工作簿，用 `openpyxl.Workbook()` 新建、用 `load_workbook(路径)` 打开。 - 工作表（Worksheet）：工作簿里的一张表。`wb.active` 取当前活动表，`wb.create_sheet(表名)` 新建一张表，`wb[表名]` 按名字取表。 - 单元格（Cell）：行列交叉处的一个格子。`ws[\"A1\"]` 按坐标取，`ws.cell(row=行, column=列)` 按行列号取，`.value` 是格子里的值。 ### 2.3 openpyxl 能做什么、不能做什么 - 能：读写单元格的值、设置样式（字体、颜色、边框、对齐、数字格式）、写公式文本、合并单元格、冻结窗格、设置筛选、调整行高列宽。 - 不能：计算公式结果。openpyxl 没有 Excel 的计算引", "section": "tut", "ref": "python-excel-01-openpyxl"}, {"id": "tut-python-excel-02-pandas", "type": "tutorial", "column": "C15", "title": "pandas：DataFrame 与 Excel 互转、数据清洗与分组汇总", "text": "pandas：DataFrame 与 Excel 互转、数据清洗与分组汇总 ### 2.1 DataFrame 是什么 DataFrame 是 pandas 里的一张“内存中的表”：有行、有列、有表头，跟 Excel 工作表几乎一一对应。区别在于 DataFrame 活在 Python 内存里，可以整列运算、整表筛选、分组汇总，一行代码顶 Excel 里几十步操作。`read_excel` 把工作表变成 DataFrame，`to_excel` 把 DataFrame 变成工作表，互转就是本篇的起点。 ### 2.2 DataFrame 与 Excel 工作表的对应关系 | DataFrame | Excel 工作表 | |---|---| | 一列（Series） | 一列数据 | | 列名（columns） | 标题行 | | 索引（index） | 行号（但 pandas 索引可以是日期、订单号等任意值） | | 一行 | 一行记录 | | `df.shape`（行数，列数） | 表的规模 | 注意：`to_excel` 默认会把索引也写进文件，多出一列无名列；写文件时通常加 `index=False` 不写索引。 ### 2.3 数据分析流程 本篇的流程固定为五步：读入、清洗、转换、汇总、写出。读入解决“数据进来”，清洗解决“数据能用”，转换解决“算出新列”（金额、利润、月", "section": "tut", "ref": "python-excel-02-pandas"}, {"id": "tut-python-excel-03-xlwings", "type": "tutorial", "column": "C15", "title": "xlwings：调用正在运行的 Excel，批量处理工作簿", "text": "xlwings：调用正在运行的 Excel，批量处理工作簿 ### 2.1 xlwings 是什么 xlwings 是一个让 Python 驱动 Excel 的库：Python 脚本通过 xlwings 向正在运行的 Excel 发命令——打开文件、选中区域、写入数值、调用宏、触发重算，再把结果读回来。Excel 是执行者，Python 是指挥者。 ### 2.2 xlwings 与 openpyxl 的根本区别 | 对比项 | openpyxl（01 篇） | xlwings（本篇） | |---|---|---| | 需不需要装 Excel | 不需要，在 Linux 服务器上也能跑 | 需要，目标机器上必须装有 Excel | | 支持的操作系统 | Windows、macOS、Linux 都行 | 交互模式仅 Windows 与 macOS（Linux 上只能用 xlwings Server 或 Reader） | | 工作方式 | 直接读写 xlsx 文件 | 驱动正在运行的 Excel 程序 | | 公式 | 只写公式文本，不计算 | 可触发 Excel 重算，读到计算结果 | | 宏与加载项 | 不能运行 | 可以调用 VBA 宏 | | 速度 | 快，纯文件操作 | 慢，每步都要经过 Excel | | 适用场景 | 服务器上批量生成报表 | 办公室里批量操作已打开", "section": "tut", "ref": "python-excel-03-xlwings"}, {"id": "tut-python-excel-04-python-in-excel", "type": "tutorial", "column": "C15", "title": "Python in Excel：用 =PY() 在单元格里写 Python", "text": "Python in Excel：用 =PY() 在单元格里写 Python ### 2.1 Python in Excel 是什么 Python in Excel 是微软把 Python 放进 Excel 单元格的功能：在单元格里输入 `=PY(`，写 Python 代码，代码被送到微软云端（由 Anaconda 提供运行环境）执行，结果返回到工作表。不用在本机装 Python，不用装任何库，pandas、Matplotlib 这些数据分析库在云端已经装好。 ### 2.2 =PY() 与 xl() - `=PY()`：进入 Python 模式的公式。在单元格里输入 `=PY(` 后写 Python 代码，确认后单元格开始计算，计算时显示 BUSY，算完后返回结果。 - `xl()`：Python 代码里引用 Excel 对象的专用函数。`xl(\"A1\")` 取一个格子，`xl(\"A1:G13\", headers=True)` 取一个区域并把第一行当表头返回 DataFrame，`xl(\"表名[#All]\", headers=True)` 取一整张表。 - 输出类型：公式栏里的 Python 输出菜单可以切换两种输出。Python 对象：单元格显示 DataFrame 这样的对象卡片，点卡片看详情；Excel 值：把结果转成普通单元格数值，可以继续用公式引用、做图表。两种输出的数字", "section": "tut", "ref": "python-excel-04-python-in-excel"}, {"id": "tip-数据录入技巧-0", "type": "tip", "column": "C01", "title": "自动填充序号", "text": "数据录入技巧 自动填充序号 首格输入 1、第二格输入 2，选中两格拖填充柄；或用 =ROW()-1 下拉，删行不中断", "section": "tips", "ref": ""}, {"id": "tip-数据录入技巧-1", "type": "tip", "column": "C01", "title": "自动生成流水号", "text": "数据录入技巧 自动生成流水号 用 =\"NO.\"&TEXT(ROW()-1,\"0000\") 下拉，序号自动补零对齐", "section": "tips", "ref": ""}, {"id": "tip-数据录入技巧-2", "type": "tip", "column": "C01", "title": "快速录入当前日期", "text": "数据录入技巧 快速录入当前日期 按 Ctrl+; 直接输入今天日期（静态值，不会每天变）", "section": "tips", "ref": ""}, {"id": "tip-数据录入技巧-3", "type": "tip", "column": "C01", "title": "快速录入当前时间", "text": "数据录入技巧 快速录入当前时间 按 Ctrl+Shift+; 输入当前时间；日期时间一起按 Ctrl+; 空格 Ctrl+Shift+;", "section": "tips", "ref": ""}, {"id": "tip-数据录入技巧-4", "type": "tip", "column": "C01", "title": "快速输入重复内容", "text": "数据录入技巧 快速输入重复内容 输入前几个字后按 Alt+↓，从本列已录入的值里直接选", "section": "tips", "ref": ""}, {"id": "tip-数据录入技巧-5", "type": "tip", "column": "C01", "title": "下拉选择录入", "text": "数据录入技巧 下拉选择录入 数据→数据验证→序列，来源输入 男,女，只能点选不能乱填", "section": "tips", "ref": ""}, {"id": "tip-数据录入技巧-6", "type": "tip", "column": "C01", "title": "联动下拉菜单", "text": "数据录入技巧 联动下拉菜单 一级菜单做命名区域，二级数据验证→序列用 =INDIRECT($A2) 引用", "section": "tips", "ref": ""}, {"id": "tip-数据录入技巧-7", "type": "tip", "column": "C01", "title": "防止重复输入", "text": "数据录入技巧 防止重复输入 数据验证→自定义，公式 =COUNTIF(A:A,A1)=1，重复就报错", "section": "tips", "ref": ""}, {"id": "tip-数据录入技巧-8", "type": "tip", "column": "C01", "title": "批量导入数据", "text": "数据录入技巧 批量导入数据 数据→获取数据→从文本/CSV，一次把外部数据整份导进来", "section": "tips", "ref": ""}, {"id": "tip-数据清洗技巧-0", "type": "tip", "column": "C05", "title": "一秒删除空行", "text": "数据清洗技巧 一秒删除空行 选中区域→Ctrl+G 定位→空值→右键删除整行", "section": "tips", "ref": ""}, {"id": "tip-数据清洗技巧-1", "type": "tip", "column": "C05", "title": "删除空列", "text": "数据清洗技巧 删除空列 选中区域→Ctrl+G 空值→右键删除整列（先备份原表）", "section": "tips", "ref": ""}, {"id": "tip-数据清洗技巧-2", "type": "tip", "column": "C05", "title": "删除重复值", "text": "数据清洗技巧 删除重复值 数据→删除重复项，勾选关键列，一键去重", "section": "tips", "ref": ""}, {"id": "tip-数据清洗技巧-3", "type": "tip", "column": "C05", "title": "合并重复记录", "text": "数据清洗技巧 合并重复记录 数据透视表按关键字段分组，对金额求和、对订单计数", "section": "tips", "ref": ""}, {"id": "tip-数据清洗技巧-4", "type": "tip", "column": "C05", "title": "去除隐藏空格", "text": "数据清洗技巧 去除隐藏空格 =TRIM(A1) 去首尾空格；=CLEAN(A1) 去换行等不可见字符", "section": "tips", "ref": ""}, {"id": "tip-数据清洗技巧-5", "type": "tip", "column": "C05", "title": "去除换行符", "text": "数据清洗技巧 去除换行符 查找替换：查找内容处按 Ctrl+J，替换为留空，全部替换", "section": "tips", "ref": ""}, {"id": "tip-数据清洗技巧-6", "type": "tip", "column": "C05", "title": "统一日期格式", "text": "数据清洗技巧 统一日期格式 选中列→数据→分列→下一步→日期 YMD，一次把文本日期转正", "section": "tips", "ref": ""}, {"id": "tip-数据清洗技巧-7", "type": "tip", "column": "C05", "title": "统一手机号格式", "text": "数据清洗技巧 统一手机号格式 先设为文本格式再录入；已变形用 =TEXT(A1,\"0\") 恢复显示", "section": "tips", "ref": ""}, {"id": "tip-数据清洗技巧-8", "type": "tip", "column": "C05", "title": "数字文本互转", "text": "数据清洗技巧 数字文本互转 数字转文本用 =TEXT(A1,\"0\")；文本转数字用 =A1*1 或分列→常规", "section": "tips", "ref": ""}, {"id": "tip-函数应用技巧-0", "type": "tip", "column": "C04", "title": "VLOOKUP精确匹配", "text": "函数应用技巧 VLOOKUP精确匹配 =VLOOKUP(值,区域,列号,0)，第四参数写 0 才是精确查找", "section": "tips", "ref": ""}, {"id": "tip-函数应用技巧-1", "type": "tip", "column": "C04", "title": "VLOOKUP反向查询", "text": "函数应用技巧 VLOOKUP反向查询 右查左改用 =INDEX(B:B,MATCH(值,A:A,0))", "section": "tips", "ref": ""}, {"id": "tip-函数应用技巧-2", "type": "tip", "column": "C04", "title": "XLOOKUP一步到位", "text": "函数应用技巧 XLOOKUP一步到位 =XLOOKUP(值,查找列,返回列,\"未找到\")，不用数第几列", "section": "tips", "ref": ""}, {"id": "tip-函数应用技巧-3", "type": "tip", "column": "C04", "title": "INDEX+MATCH多条件", "text": "函数应用技巧 INDEX+MATCH多条件 =INDEX(返回列,MATCH(1,(条件列1=条件1)*(条件列2=条件2),0))", "section": "tips", "ref": ""}, {"id": "tip-函数应用技巧-4", "type": "tip", "column": "C04", "title": "模糊匹配查询", "text": "函数应用技巧 模糊匹配查询 =VLOOKUP(\"*\"&关键词&\"*\",区域,2,0)，通配符前后包夹", "section": "tips", "ref": ""}, {"id": "tip-函数应用技巧-5", "type": "tip", "column": "C04", "title": "双向查询", "text": "函数应用技巧 双向查询 =INDEX(区域,MATCH(行值,首列,0),MATCH(列值,首行,0)) 行列交叉定位", "section": "tips", "ref": ""}, {"id": "tip-函数应用技巧-6", "type": "tip", "column": "C04", "title": "跨表查询", "text": "函数应用技巧 跨表查询 =VLOOKUP(A2,INDIRECT(\"'\"&B2&\"'!A:B\"),2,0)，按表名动态切换", "section": "tips", "ref": ""}, {"id": "tip-函数应用技巧-7", "type": "tip", "column": "C04", "title": "动态查询面板", "text": "函数应用技巧 动态查询面板 数据验证做下拉选关键词，XLOOKUP 引用该单元格，选谁查谁", "section": "tips", "ref": ""}, {"id": "tip-函数应用技巧-8", "type": "tip", "column": "C04", "title": "多条件统计", "text": "函数应用技巧 多条件统计 =SUMIFS(求和列,条件列1,条件1,条件列2,条件2)，条件可继续加", "section": "tips", "ref": ""}, {"id": "tip-函数应用技巧-9", "type": "tip", "column": "C04", "title": "动态汇总区域", "text": "函数应用技巧 动态汇总区域 =SUM(OFFSET(首格,0,0,COUNTA(列),1))，新增行自动纳入", "section": "tips", "ref": ""}, {"id": "tip-文本处理技巧-0", "type": "tip", "column": "C04", "title": "提取姓名中的姓", "text": "文本处理技巧 提取姓名中的姓 =LEFT(A2,1)，复姓手动处理或用快速填充", "section": "tips", "ref": ""}, {"id": "tip-文本处理技巧-1", "type": "tip", "column": "C04", "title": "提取手机号", "text": "文本处理技巧 提取手机号 固定位置用 =MID(A2,12,11)；不固定用 Ctrl+E 快速填充", "section": "tips", "ref": ""}, {"id": "tip-文本处理技巧-2", "type": "tip", "column": "C04", "title": "提取邮箱", "text": "文本处理技巧 提取邮箱 用 Ctrl+E 按示例提取；或 =MID(A2,FIND(\"@\",A2)-6,20) 再 TRIM", "section": "tips", "ref": ""}, {"id": "tip-文本处理技巧-3", "type": "tip", "column": "C04", "title": "分离姓和名", "text": "文本处理技巧 分离姓和名 姓 =LEFT(A2,1)，名 =RIGHT(A2,LEN(A2)-1)", "section": "tips", "ref": ""}, {"id": "tip-文本处理技巧-4", "type": "tip", "column": "C04", "title": "中英文拆分", "text": "文本处理技巧 中英文拆分 旁边列手写一行英文示例，选中→Ctrl+E，自动按规律拆分", "section": "tips", "ref": ""}, {"id": "tip-文本处理技巧-5", "type": "tip", "column": "C04", "title": "字符串替换", "text": "文本处理技巧 字符串替换 =SUBSTITUTE(A2,\"旧\",\"新\")，嵌套可做多重替换", "section": "tips", "ref": ""}, {"id": "tip-文本处理技巧-6", "type": "tip", "column": "C04", "title": "批量修改内容", "text": "文本处理技巧 批量修改内容 Ctrl+H 查找替换，支持通配符 * ?，可限定范围", "section": "tips", "ref": ""}, {"id": "tip-文本处理技巧-7", "type": "tip", "column": "C04", "title": "批量添加前缀", "text": "文本处理技巧 批量添加前缀 =\"前缀\"&A2；纯显示用自定义格式 \"前缀\"@", "section": "tips", "ref": ""}, {"id": "tip-文本处理技巧-8", "type": "tip", "column": "C04", "title": "批量添加后缀", "text": "文本处理技巧 批量添加后缀 =A2&\"元\"；数字加单位也可用自定义格式 0\"元\"", "section": "tips", "ref": ""}, {"id": "tip-日期时间技巧-0", "type": "tip", "column": "C04", "title": "计算年龄", "text": "日期时间技巧 计算年龄 =DATEDIF(出生日期,TODAY(),\"Y\")，周岁一键得出", "section": "tips", "ref": ""}, {"id": "tip-日期时间技巧-1", "type": "tip", "column": "C04", "title": "计算工龄", "text": "日期时间技巧 计算工龄 =DATEDIF(入职日,TODAY(),\"Y\")&\"年\"&DATEDIF(入职日,TODAY(),\"YM\")&\"月\"", "section": "tips", "ref": ""}, {"id": "tip-日期时间技巧-2", "type": "tip", "column": "C04", "title": "工作日计算", "text": "日期时间技巧 工作日计算 =NETWORKDAYS(开始,结束)，自动排除周六日", "section": "tips", "ref": ""}, {"id": "tip-日期时间技巧-3", "type": "tip", "column": "C04", "title": "节假日排除", "text": "日期时间技巧 节假日排除 =NETWORKDAYS(开始,结束,节假日区域)，第三参数放假日清单", "section": "tips", "ref": ""}, {"id": "tip-日期时间技巧-4", "type": "tip", "column": "C04", "title": "倒计时计算", "text": "日期时间技巧 倒计时计算 =目标日期-TODAY()&\"天\"，过期变负数可标红", "section": "tips", "ref": ""}, {"id": "tip-日期时间技巧-5", "type": "tip", "column": "C04", "title": "取月初日期", "text": "日期时间技巧 取月初日期 =EOMONTH(日期,-1)+1，上月月末加一天即本月初", "section": "tips", "ref": ""}, {"id": "tip-日期时间技巧-6", "type": "tip", "column": "C04", "title": "取月末日期", "text": "日期时间技巧 取月末日期 =EOMONTH(日期,0)，自动处理大小月和闰年", "section": "tips", "ref": ""}, {"id": "tip-日期时间技巧-7", "type": "tip", "column": "C04", "title": "季度统计", "text": "日期时间技巧 季度统计 辅助列 =\"Q\"&INT((MONTH(日期)+2)/3)，再透视表汇总", "section": "tips", "ref": ""}, {"id": "tip-日期时间技巧-8", "type": "tip", "column": "C04", "title": "周数计算", "text": "日期时间技巧 周数计算 =WEEKNUM(日期,2)，第二参数 2 表示周一起始", "section": "tips", "ref": ""}, {"id": "tip-格式美化技巧-0", "type": "tip", "column": "C02", "title": "隔行变色", "text": "格式美化技巧 隔行变色 条件格式→新建规则→公式 =MOD(ROW(),2)=0，设填充色", "section": "tips", "ref": ""}, {"id": "tip-格式美化技巧-1", "type": "tip", "column": "C02", "title": "自动高亮整行", "text": "格式美化技巧 自动高亮整行 选中区域→条件格式公式 =$A1=\"重点\"，整行自动上色", "section": "tips", "ref": ""}, {"id": "tip-格式美化技巧-2", "type": "tip", "column": "C02", "title": "数据条", "text": "格式美化技巧 数据条 开始→条件格式→数据条，数值大小一目了然", "section": "tips", "ref": ""}, {"id": "tip-格式美化技巧-3", "type": "tip", "column": "C02", "title": "图标集", "text": "格式美化技巧 图标集 条件格式→图标集，达标/预警/异常自动打对勾感叹号", "section": "tips", "ref": ""}, {"id": "tip-格式美化技巧-4", "type": "tip", "column": "C02", "title": "自动标红逾期", "text": "格式美化技巧 自动标红逾期 条件格式公式 =A2<TODAY()，过期日期自动变红", "section": "tips", "ref": ""}, {"id": "tip-格式美化技巧-5", "type": "tip", "column": "C02", "title": "自动标绿达标", "text": "格式美化技巧 自动标绿达标 =B2>=目标值 标绿，低于目标再加一条标红", "section": "tips", "ref": ""}, {"id": "tip-格式美化技巧-6", "type": "tip", "column": "C02", "title": "动态颜色变化", "text": "格式美化技巧 动态颜色变化 条件格式+公式绑定数值，数据变颜色自动跟", "section": "tips", "ref": ""}, {"id": "tip-格式美化技巧-7", "type": "tip", "column": "C02", "title": "重复值高亮", "text": "格式美化技巧 重复值高亮 条件格式→突出显示单元格规则→重复值", "section": "tips", "ref": ""}, {"id": "tip-格式美化技巧-8", "type": "tip", "column": "C02", "title": "仪表盘美化", "text": "格式美化技巧 仪表盘美化 大字号 KPI + 条件格式图标 + 迷你图，注意留白对齐", "section": "tips", "ref": ""}, {"id": "tip-图表技巧-0", "type": "tip", "column": "C07", "title": "一键生成图表", "text": "图表技巧 一键生成图表 选中数据按 Alt+F1 生成嵌入图表；F11 生成独立图表工作表", "section": "tips", "ref": ""}, {"id": "tip-图表技巧-1", "type": "tip", "column": "C07", "title": "动态图表", "text": "图表技巧 动态图表 定义名称 =OFFSET(首格,0,0,COUNTA(列),1) 做数据源，新增自动扩展", "section": "tips", "ref": ""}, {"id": "tip-图表技巧-2", "type": "tip", "column": "C07", "title": "手绘甘特图", "text": "图表技巧 手绘甘特图 条形图：开始日期为起点、工期为长度，逆序类别+调透明度", "section": "tips", "ref": ""}, {"id": "tip-图表技巧-3", "type": "tip", "column": "C07", "title": "漏斗图", "text": "图表技巧 漏斗图 插入→漏斗图（2016 及以上），看各环节转化流失", "section": "tips", "ref": ""}, {"id": "tip-图表技巧-4", "type": "tip", "column": "C07", "title": "KPI达成图", "text": "图表技巧 KPI达成图 环形图 + 大数字文本框，目标完成率一目了然", "section": "tips", "ref": ""}, {"id": "tip-图表技巧-5", "type": "tip", "column": "C07", "title": "销售驾驶舱", "text": "图表技巧 销售驾驶舱 切片器 + 数据透视表 + 组合图，点选维度图表联动", "section": "tips", "ref": ""}, {"id": "tip-图表技巧-6", "type": "tip", "column": "C07", "title": "地图图表", "text": "图表技巧 地图图表 插入→地图（365），按省份/国家数值自动着色", "section": "tips", "ref": ""}, {"id": "tip-图表技巧-7", "type": "tip", "column": "C07", "title": "单元格热力图", "text": "图表技巧 单元格热力图 不用图表，条件格式→色阶直接在区域上画热力分布", "section": "tips", "ref": ""}, {"id": "tip-打印技巧-0", "type": "tip", "column": "C01", "title": "一页打印", "text": "打印技巧 一页打印 页面布局→宽度/高度设为 1 页，超宽表格自动缩放", "section": "tips", "ref": ""}, {"id": "tip-打印技巧-1", "type": "tip", "column": "C01", "title": "打印标题行", "text": "打印技巧 打印标题行 页面布局→打印标题→顶端标题行设为 $1:$1，每页重复表头", "section": "tips", "ref": ""}, {"id": "tip-打印技巧-2", "type": "tip", "column": "C01", "title": "自动分页调整", "text": "打印技巧 自动分页调整 视图→分页预览，拖动蓝色分页线控制每页内容", "section": "tips", "ref": ""}, {"id": "tip-打印技巧-3", "type": "tip", "column": "C01", "title": "打印网格线", "text": "打印技巧 打印网格线 页面设置→工作表→勾选网格线，表格线才能印出来", "section": "tips", "ref": ""}, {"id": "tip-打印技巧-4", "type": "tip", "column": "C01", "title": "打印批注", "text": "打印技巧 打印批注 页面设置→工作表→批注选“工作表末尾”，批注集中打印", "section": "tips", "ref": ""}, {"id": "tip-打印技巧-5", "type": "tip", "column": "C01", "title": "横向打印", "text": "打印技巧 横向打印 页面布局→纸张方向→横向，列多的表横过来打", "section": "tips", "ref": ""}, {"id": "tip-打印技巧-6", "type": "tip", "column": "C01", "title": "批量打印多表", "text": "打印技巧 批量打印多表 按住 Ctrl 点多个工作表标签→文件→打印，一次全打", "section": "tips", "ref": ""}, {"id": "tip-打印技巧-7", "type": "tip", "column": "C01", "title": "只打印选中区域", "text": "打印技巧 只打印选中区域 选中区域→页面布局→打印区域→设置打印区域", "section": "tips", "ref": ""}, {"id": "tip-快捷键技巧-0", "type": "tip", "column": "C01", "title": "Ctrl+D 向下填充", "text": "快捷键技巧 Ctrl+D 向下填充 选中区域按 Ctrl+D，把最上一格内容/公式填满下方", "section": "tips", "ref": ""}, {"id": "tip-快捷键技巧-1", "type": "tip", "column": "C01", "title": "Ctrl+R 向右填充", "text": "快捷键技巧 Ctrl+R 向右填充 选中区域按 Ctrl+R，把最左一格内容填满右侧", "section": "tips", "ref": ""}, {"id": "tip-快捷键技巧-2", "type": "tip", "column": "C01", "title": "Ctrl+E 快速填充", "text": "快捷键技巧 Ctrl+E 快速填充 手写一个示例后按 Ctrl+E，自动识别规律拆分合并，提取手机号神器", "section": "tips", "ref": ""}, {"id": "tip-快捷键技巧-3", "type": "tip", "column": "C01", "title": "Alt+= 一键求和", "text": "快捷键技巧 Alt+= 一键求和 自动对上方或左侧连续数字求和，月末汇总最快", "section": "tips", "ref": ""}, {"id": "tip-快捷键技巧-4", "type": "tip", "column": "C01", "title": "F4 重复与锁定", "text": "快捷键技巧 F4 重复与锁定 重复上一步操作；在公式中按 F4 切换 $ 绝对引用", "section": "tips", "ref": ""}, {"id": "tip-快捷键技巧-5", "type": "tip", "column": "C01", "title": "Ctrl+Shift+L 筛选", "text": "快捷键技巧 Ctrl+Shift+L 筛选 一键开关自动筛选，不用再去点菜单", "section": "tips", "ref": ""}, {"id": "tip-快捷键技巧-6", "type": "tip", "column": "C01", "title": "Ctrl+方向键跳转", "text": "快捷键技巧 Ctrl+方向键跳转 瞬间跳到数据区域边缘，万行表格秒穿越", "section": "tips", "ref": ""}, {"id": "tip-快捷键技巧-7", "type": "tip", "column": "C01", "title": "Ctrl+空格选整列", "text": "快捷键技巧 Ctrl+空格选整列 选中当前整列；Shift+空格选中整行", "section": "tips", "ref": ""}, {"id": "tip-快捷键技巧-8", "type": "tip", "column": "C01", "title": "Ctrl+` 公式透视", "text": "快捷键技巧 Ctrl+` 公式透视 切换显示公式与计算结果，查错时一眼看穿", "section": "tips", "ref": ""}, {"id": "tip-数据透视表技巧-0", "type": "tip", "column": "C08", "title": "一键创建数据透视表", "text": "数据透视表技巧 一键创建数据透视表 选中数据区域任意单元格 → 插入 → 数据透视表 → 确定，3 秒生成汇总。记住：源数据第一行必须是标题行，且不能有合并单元格。", "section": "tips", "ref": ""}, {"id": "tip-数据透视表技巧-1", "type": "tip", "column": "C08", "title": "拖字段三步出报表", "text": "数据透视表技巧 拖字段三步出报表 行：销售员；列：月份；值：销售额。拖三个字段，一张交叉统计表就出来了，比写几十个 SUMIFS 快十倍。", "section": "tips", "ref": ""}, {"id": "tip-数据透视表技巧-2", "type": "tip", "column": "C08", "title": "值字段设置", "text": "数据透视表技巧 值字段设置 值区域默认是「求和」，点字段旁小箭头 → 值字段设置，可切换计数/平均值/最大值。同一字段拖两次可同时看求和与占比。", "section": "tips", "ref": ""}, {"id": "tip-数据透视表技巧-3", "type": "tip", "column": "C08", "title": "日期自动分组", "text": "数据透视表技巧 日期自动分组 右键日期字段 → 组合 → 按月/季度/年分组，一键把 365 天的明细变成 12 个月汇总。", "section": "tips", "ref": ""}, {"id": "tip-数据透视表技巧-4", "type": "tip", "column": "C08", "title": "切片器秒筛选", "text": "数据透视表技巧 切片器秒筛选 数据透视表分析 → 插入切片器 → 勾选「部门」。点一下按钮报表即时过滤，开会演示神器。", "section": "tips", "ref": ""}, {"id": "tip-数据透视表技巧-5", "type": "tip", "column": "C08", "title": "值显示方式", "text": "数据透视表技巧 值显示方式 右键值字段 → 值显示方式 → 占总和的百分比，直接算出每个销售员的业绩占比，不用再写公式。", "section": "tips", "ref": ""}, {"id": "tip-数据透视表技巧-6", "type": "tip", "column": "C08", "title": "一键刷新", "text": "数据透视表技巧 一键刷新 源数据增删行后，在透视表上右键 → 刷新即可更新。建议把源数据转为「表格」（Ctrl+T），新增行自动纳入。", "section": "tips", "ref": ""}, {"id": "tip-数据透视表技巧-7", "type": "tip", "column": "C08", "title": "更改数据源", "text": "数据透视表技巧 更改数据源 数据多了要换表？数据透视表分析 → 更改数据源，重新框选区域，之前搭好的版式原样保留。", "section": "tips", "ref": ""}, {"id": "tip-Power Query技巧-0", "type": "tip", "column": "C09", "title": "从表格导入 PQ", "text": "Power Query技巧 从表格导入 PQ 选中数据 → 数据 → 自表格/区域，一键进入 Power Query 编辑器。从此告别重复的手工清洗。", "section": "tips", "ref": ""}, {"id": "tip-Power Query技巧-1", "type": "tip", "column": "C09", "title": "一键删除空行空列", "text": "Power Query技巧 一键删除空行空列 在 PQ 里选中列 → 右键 → 删除空行；开始 → 删除列 → 删除空列。刷新后新数据自动同样处理。", "section": "tips", "ref": ""}, {"id": "tip-Power Query技巧-2", "type": "tip", "column": "C09", "title": "分列拆数据", "text": "Power Query技巧 分列拆数据 选中列 → 拆分列 → 按分隔符（如 - 或空格），身份证拆生日、地址拆省市，一步到位。", "section": "tips", "ref": ""}, {"id": "tip-Power Query技巧-3", "type": "tip", "column": "C09", "title": "合并查询代替 VLOOKUP", "text": "Power Query技巧 合并查询代替 VLOOKUP 开始 → 合并查询，把两表按关键列连接，比 VLOOKUP 快且不会列错位。", "section": "tips", "ref": ""}, {"id": "tip-Power Query技巧-4", "type": "tip", "column": "C09", "title": "逆透视整理报表", "text": "Power Query技巧 逆透视整理报表 选中月份列 → 转换 → 逆透视列，把横表变纵表，透视表最爱这种干净数据。", "section": "tips", "ref": ""}, {"id": "tip-Power Query技巧-5", "type": "tip", "column": "C09", "title": "替换值批量清洗", "text": "Power Query技巧 替换值批量清洗 选中列 → 右键 → 替换值，把「男/女」换成「先生/女士」，或把错别字批量修正。", "section": "tips", "ref": ""}, {"id": "tip-Power Query技巧-6", "type": "tip", "column": "C09", "title": "添加条件列", "text": "Power Query技巧 添加条件列 添加列 → 条件列，按销售额自动打标签：>=10万为A级，公式写一次、刷新终身受用。", "section": "tips", "ref": ""}, {"id": "tip-Power Query技巧-7", "type": "tip", "column": "C09", "title": "关闭并上载+刷新", "text": "Power Query技巧 关闭并上载+刷新 做完点「关闭并上载」，结果回到 Excel。以后源数据更新，数据 → 全部刷新，一键重跑全流程。", "section": "tips", "ref": ""}, {"id": "solve-公式问题-0", "type": "solve", "column": "C16", "title": "公式不计算", "text": "公式问题 公式不计算 先看公式→计算选项是否为“手动”，改回“自动”；再看单元格是否为文本格式，是则改常规后双击回车。", "section": "solve", "ref": ""}, {"id": "solve-公式问题-1", "type": "solve", "column": "C16", "title": "显示公式而非结果", "text": "公式问题 显示公式而非结果 单元格格式为“文本”，或误开了“显示公式”（Ctrl+` 切换）。改为常规格式后双击单元格回车即可。", "section": "solve", "ref": ""}, {"id": "solve-公式问题-2", "type": "solve", "column": "C16", "title": "结果错误但无报错", "text": "公式问题 结果错误但无报错 检查引用区域是否因增删行漂移、括号是否配对、VLOOKUP 是否误用近似匹配（第四参数应为 0）。", "section": "solve", "ref": ""}, {"id": "solve-公式问题-3", "type": "solve", "column": "C16", "title": "自动计算失效", "text": "公式问题 自动计算失效 大文件常被设为手动计算。按 F9 立即重算，或公式→计算选项改回自动。", "section": "solve", "ref": ""}, {"id": "solve-公式问题-4", "type": "solve", "column": "C16", "title": "循环引用", "text": "公式问题 循环引用 公式直接或间接引用了自己。看状态栏提示定位单元格，改写逻辑打破循环。", "section": "solve", "ref": ""}, {"id": "solve-公式问题-5", "type": "solve", "column": "C16", "title": "公式被锁定改不动", "text": "公式问题 公式被锁
