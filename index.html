`F9` 技巧", "desc": "在编辑栏选中公式片段按 F9，查看该片段的计算结果（调试公式神器）", "hot": false}, {"key": "`Alt + Enter`", "desc": "公式太长时在编辑栏内换行（仅显示效果）", "hot": false}, {"key": "`Tab`", "desc": "输入函数名前几个字母后按 Tab，自动补全", "hot": false}]}, {"cat": "数据透视表（8 个）", "keys": [{"key": "`Alt + N, V`", "desc": "新建数据透视表", "hot": false}, {"key": "`Alt + J, T, L`", "desc": "刷新透视表", "hot": false}, {"key": "`Alt + J, T, J`", "desc": "显示字段列表窗格", "hot": false}, {"key": "`Ctrl + -`", "desc": "删除透视表字段（选中字段时）", "hot": false}, {"key": "`Alt + ↓`", "desc": "打开筛选下拉（在字段标题单元格按）", "hot": false}, {"key": "`Tab`", "desc": "在透视表字段窗格内移动", "hot": false}, {"key": "`Shift + F10`", "desc": "右键菜单（值字段设置/组合都在这）", "hot": false}, {"key": "`Alt + A, C`", "desc": "清除透视表筛选", "hot": false}]}, {"cat": "通用与文件（10 个）", "keys": [{"key": "`Ctrl + S`", "desc": "保存（养成习惯，3 分钟一次）", "hot": true}, {"key": "`Ctrl + N / O / P`", "desc": "新建/打开/打印", "hot": false}, {"key": "`Ctrl + W`", "desc": "关闭当前工作簿", "hot": false}, {"key": "`F12`", "desc": "另存为", "hot": false}, {"key": "`Ctrl + F / H`", "desc": "查找/替换", "hot": false}, {"key": "`Ctrl + T`", "desc": "转为智能表格（透视表前置步骤）", "hot": false}, {"key": "`Alt + E, S, V`", "desc": "选择性粘贴为数值（去公式留结果）", "hot": false}, {"key": "`F1`", "desc": "帮助", "hot": false}, {"key": "`Alt`", "desc": "显示功能区快捷键提示（按字母操作菜单，不用鼠标）", "hot": false}, {"key": "`Ctrl + 鼠标滚轮`", "desc": "缩放工作表", "hot": false}]}], "advanced": [{"id": "pivottable", "title": "数据透视表", "sections": [{"title": "1. 为什么用数据透视表", "body": "想象你有一张 5000 行的销售明细：日期、销售员、产品、金额。老板问：\"每个销售员每个月的销售额是多少？\"\n- 不用透视表：写一堆 SUMIFS，还要手动列出所有销售员和月份，容易漏。\n- 用透视表：**拖三下鼠标，3 秒出结果**。源数据增删行后点一下\"刷新\"即可更新。\n核心思想：**把\"分组+聚合\"这个动作交给 Excel**，你只负责告诉它\"按什么分组、对什么求和\"。"}, {"title": "2. 创建步骤", "body": "1. 点击源数据区域任意单元格（确保数据是规范的二维表：第一行是标题行，无合并单元格、无空行空列）。\n2. 「插入」→「数据透视表」。\n3. 选择放置位置：建议选\"新工作表\"，报表和源数据分开更清爽。\n4. 右侧出现「数据透视表字段」窗格，开始拖字段。\n> 数据规范是透视表好用的前提：一列只放一种含义的数据，日期列全是日期，不要出现\"合计\"行混在明细里。"}, {"title": "3. 四个区域详解", "body": "操作要点：\n- 同一字段可以拖到多个区域（如\"日期\"同时拖到行和筛选器）。\n- 拖错了直接把字段拖出窗格即可移除。\n- 字段顺序决定层级：行区域里\"年份\"在上、\"月份\"在下，就是先按年再按月展开。"}, {"title": "4. 值汇总方式", "body": "默认对数字字段\"求和\"，对文本字段\"计数\"。右键值字段 →「值字段设置」可切换：\n**显示方式**（同一对话框的「值显示方式」选项卡，更实用）：\n- **占总和的百分比**：每个销售员占总销售额的比例。\n- **父行汇总的百分比**：某产品占其所属类别的比例。\n- **差异**：本月 vs 上月的差额（需配合日期分组）。\n- **差异百分比**：环比增长率——做月报的神器。"}, {"title": "5. 分组", "body": "### 日期分组\n右键行区域的日期字段 →「组合」：\n- 按月：选\"月\"，自动按年月分组。\n- 按季度+年：同时勾选\"季度\"和\"年\"。\n- 按周：选\"日\"，天数填 7。\n### 数字分组\n右键数字字段 →「组合」：如把年龄按 10 岁一段分组（起始 20，终止 60，步长 10），快速做年龄段分布。"}, {"title": "6. 切片器与时间线", "body": "- **切片器**：「数据透视表分析」→「插入切片器」→ 勾选字段（如\"产品类别\"）。生成一排可点击的按钮，点选即筛选，比下拉框直观，适合做仪表盘。\n- **时间线**：专门用于日期字段，拖动滑块筛选时间段。\n- 一个切片器可以同时控制**多个**透视表：右键切片器 →「报表连接」，勾选其他透视表——做联动仪表盘的核心技巧。"}]}, {"id": "array-formulas", "title": "数组公式", "sections": [{"title": "1. 先理解\"数组\"是什么", "body": "数组就是\"一串值\"。`{1,2,3}` 是横向数组，`{1;2;3}` 是纵向数组（分号换行）。Excel 公式本来就是按数组思维设计的：\n[代码示例]\n这行公式的含义是\"把 A1、A2、A3 每个都乘以 2\"，得到 `{A1*2, A2*2, A3*2}`。普通公式只显示第一个结果，数组公式则能把全部结果\"摊开\"显示。"}, {"title": "2. 传统数组公式（Ctrl+Shift+Enter）", "body": "在旧版本 Excel 里，想让公式返回多个结果：\n1. 先选中**多个**单元格（结果要占几格就选几格）。\n2. 输入公式，如 `=A1:A3*2`。\n3. 按 **Ctrl+Shift+Enter**（不是只按 Enter）。\n公式两端会自动加上花括号 `{=A1:A3*2}`，表示这是数组公式。**花括号是 Excel 自己加的，手工输入无效。**\n经典用途——多条件计数（COUNTIFS 出现之前的写法，现在仍有人用）：\n[代码示例]\n原理：`(A2:A100=\"销售部\")` 得到一串 TRUE/FALSE，`(B2:B100>5000)` 得到另一串，两串相乘（TRUE=1、FALSE=0），只有两个条件都成立的位置是 1，SUM 加总即为同时满足的人数。"}, {"title": "3. 动态数组：新时代的写法", "body": "Microsoft 365 引入动态数组后，**只按 Enter**，结果自动\"溢出\"到相邻单元格。不再需要三键，也不再需要预选区域。\n### FILTER：按条件筛选\n[代码示例]\n返回 B 列等于\"销售部\"的所有行（A:C 三列）。做\"部门人员清单\"一公式搞定，源数据增减行自动更新。\n加\"无结果\"提示：\n[代码示例]\n### SORT：排序\n[代码示例]"}, {"title": "4. #溢出! 错误处理", "body": "当动态数组的结果没地方\"摊开\"时，报 `#溢出!`。常见原因和解法：\n`#` 引用是动态数组时代的重要符号：公式结果变长变短，`A2#` 自动跟着变，SUM 永远求和的是最新结果。"}, {"title": "5. 实战案例", "body": "### 案例 1：多条件求和（替代 SUMIFS 的数组思路）\n统计\"销售部\"且\"金额>5000\"的总额：\n[代码示例]\n普通 Enter 即可（365 会自动按数组算）。\n### 案例 2：动态部门筛选器\n[代码示例]\nF1 做下拉选部门，右侧自动列出该部门所有人——简易查询系统。\n### 案例 3：自动去重+计数"}, {"title": "6. 新旧对照速查", "body": ""}]}, {"id": "powerquery", "title": "Power Query", "sections": [{"title": "1. Power Query 是什么", "body": "它是 Excel 里的一个**数据加工流水线**：你把\"获取→清洗→整理\"的每一步操作点一遍，Power Query 会把步骤记下来。下个月拿到新的源文件，点一下\"刷新\"，所有步骤自动重跑一遍。\n和公式的区别：\n- 公式是\"算出一个结果\"，Power Query 是\"产出一张干净的表\"。\n- 公式适合行内计算；Power Query 适合**结构性整理**：拆分列、转置、合并文件、逆透视——这些用公式写会很痛苦。\n核心观念：**你点的每一步都会变成一行 M 代码**，记录在右侧「应用的步骤」里。可以回头修改、删除、调整顺序。"}, {"title": "2. 获取数据", "body": "「数据」→「获取数据」，来源非常多：\n选中来源后点「转换数据」进入 Power Query 编辑器，开始清洗。"}, {"title": "3. 常用清洗步骤", "body": "### 拆分列\n一列里混着\"省-市-区\"？选中列 →「拆分列」→「按分隔符」→ 输入 `-`。一列变三列。也可以按固定宽度、按大小写转换处拆分。\n### 替换值\n选中列 → 右键 →「替换值」：把\"男/女\"换成\"M/F\"，把\"N/A\"换成空。支持整列批量。\n### 填充\n导出的报表经常只有第一行有\"部门\"名，下面是空的（合并单元格拆开后的样子）。选中列 →「转换」→「填充」→「向下」。空单元格自动填上上方的值，透视表分组的前提。\n### 更改类型\n每列顶上有个类型图标（ABC/123/日历）。点它把文本改成数字、日期。**类型不对会导致求和变计数、日期无法分组**，清洗时务必检查。"}, {"title": "4. 合并查询：比 VLOOKUP 更强的关联", "body": "场景：A 表是订单（有\"客户编号\"），B 表是客户档案（\"客户编号\"→\"客户名称\"），想给订单带上客户名称。\n1. 在编辑器里选中订单查询 →「合并查询」。\n2. 上表选\"客户编号\"，下表选\"客户档案\"的\"客户编号\"（点列表头选中，两边都要点）。\n3. 联接种类选\"左外部\"（保留订单全部行，档案对不上的留空——对应 VLOOKUP 的精确匹配）。\n4. 确定后多出一列，点列头的展开按钮，勾选\"客户名称\"。\n比 VLOOKUP 强的点：\n- **可按多列关联**：Ctrl+点选多个列头，一次按\"省+市\"两列匹配，VLOOKUP 要拼辅助列。\n- **模糊匹配**：联接时勾选\"模糊匹配\"，自动处理\"北京\"vs\"北京市\"这种差异，还能设相似度阈值。"}, {"title": "5. 追加查询：纵向堆叠", "body": "场景：12 个月的销售表结构相同，要拼成一张全年表。\n「追加查询」→ 选\"三个或更多表\" → 把 12 个表都加进来。列名相同的自动对齐，某表多出的列会以空值补齐。\n**从文件夹追加**（更常用）：「获取数据」→「从文件夹」→ 选存放 12 个文件的文件夹 →「合并和转换」。以后每月往文件夹里丢新文件，刷新一次全进来——月报自动化。"}, {"title": "6. 透视列与逆透视列", "body": "### 逆透视（Unpivot）：把交叉表\"拆长\"\n源数据是\"姓名×12个月\"的矩阵（1 月、2 月…各一列），透视表吃不了这种格式。\n选中 12 个月份列 → 右键 →「逆透视列」。变成三列：姓名、月份、销售额。**这是 Power Query 最经典的用途之一。**\n### 透视列（Pivot）：反向操作\n把\"月份、销售额\"两列转回交叉表：选中\"月份\"列 →「透视列」→ 值列选\"销售额\"、聚合选\"求和\"。"}]}, {"id": "conditional-formatting", "title": "条件格式", "sections": [{"title": "1. 核心原理", "body": "条件格式 = **\"规则\" + \"格式\"**。规则判断每个单元格\"达不达标\"，达标就套用你设的格式（红底、加粗等）。\n关键理解：**格式是\"活\"的**。单元格的值变了，格式自动跟着变——和你手工涂色有本质区别。删掉规则（「开始」→「条件格式」→「清除规则」）就恢复原样，不破坏数据。\n操作入口：「开始」→「条件格式」。先**选中要应用的区域**再设规则，这点最重要。"}, {"title": "2. 内置规则：突出显示单元格规则", "body": "最常用的一类：「条件格式」→「突出显示单元格规则」：\n每个规则点开后选格式（浅红填充深红文本等），也可以点「自定义格式」自己配。"}, {"title": "3. 数据条：在单元格里画\"进度条\"", "body": "「条件格式」→「数据条」→ 选一种颜色。数值越大，条越长。\n- 适合：完成率、销售额对比——一眼看出谁高谁低，不用看数字。\n- 技巧：勾选「仅显示数据条」（管理规则→编辑规则），隐藏数字，只留条形，更像仪表盘。\n- 注意：数据条的长度是按**选中区域内的最大/最小值**自动缩放的，区域不同不能直接比长短。"}, {"title": "4. 色阶：热力图", "body": "「条件格式」→「色阶」→ 如\"绿-黄-红\"。数值映射到颜色渐变，**适合看分布**：\n- 12 个月的销售热力图，旺季月份自动变红。\n- 学生成绩表，一眼看出哪科普遍偏低。\n双色刻度和三色刻度：三色多一个中间色，适合\"中间值也想区分\"的场景。"}, {"title": "5. 图标集：红绿灯", "body": "「条件格式」→「图标集」→ 如\"三色旗/红绿灯\"。数值分三档，分别显示 ●●●。\n默认按百分比划分（67%/33%），想按绝对值：管理规则 → 编辑规则 → 类型改成\"数字\"，填阈值。如：完成率 ≥100% 绿灯、≥80% 黄灯、<80% 红灯。"}, {"title": "6. 重点：自定义公式规则", "body": "内置规则不够用时，用公式。入口：「条件格式」→「新建规则」→「使用公式确定要设置格式的单元格」。\n**核心心法**：公式是**相对选中区域左上角**写的。选中 A2:D100 后写公式，公式里的 A2 指\"当前正在判断的行的 A 列\"。Excel 会把公式逐行（逐格）套用一遍。\n### 示例 1：整行标红（金额>10000 的行整行变红）\n选中 A2:D100，公式：\n[代码示例]\n`$C` 锁定列（每行都看 C 列），`2` 不锁定行（随行变化）。这就是整行格式化的标准写法：**列锁定、行不锁定**。\n### 示例 2：标出重复值（内置规则只能标单元格，公式可标整行）\n[代码示例]"}]}, {"id": "data-validation", "title": "数据验证", "sections": [{"title": "1. 数据验证是什么", "body": "「数据」→「数据验证」。它在**输入的那一刻**拦截不合法的值，而不是事后检查。\n三个可配置项：\n1. **设置**：允许输入什么（整数/小数/日期/序列/文本长度…）。\n2. **输入信息**：选中单元格时弹出的提示（\"请输入 1-100 的整数\"）——主动引导。\n3. **出错警告**：输错时的弹窗，样式可选\"停止\"（硬拦截）/\"警告\"（可继续）/\"信息\"（仅提醒）。"}, {"title": "2. 下拉列表（最常用）", "body": "### 固定选项\n选中单元格 → 数据验证 → 允许「序列」→ 来源填 `男,女`（中文逗号不行，必须用**英文逗号**分隔）。单元格右侧出现下拉箭头。\n### 引用区域\n来源填 `=$F$2:$F$10`（部门清单）。清单变了下拉自动变。建议把清单放在单独的\"基础数据\"表，隐藏起来。\n### 动态二级联动：选\"省\"后\"市\"跟着变\n这是数据验证的经典难题，标准解法是 **INDIRECT + 命名区域**：\n1. 准备对照表：A 列是省名（广东、江苏…），B 列开始每列是一个省的城市，第一行是省名。\n2. 给每个省的城市区域**定义名称**：选中广东的城市 → 名称框输入 `广东` → 回车。注意名称不能含空格，省名有空格先替换。"}, {"title": "3. 输入限制", "body": "自定义公式的心法和条件格式一样：**相对左上角写**。选中 B2:B100 后公式写 `=LEN(B2)=11`，表示\"本单元格长度必须 11\"。"}, {"title": "4. 圈释无效数据", "body": "数据验证只拦**新输入**，历史脏数据怎么办？「数据」→「数据验证」→「圈释无效数据」。所有违反规则的旧数据会被红圈圈出来，改完后「清除无效数据标识」去掉圈。\n用途：接手别人的表，先圈一遍，脏数据一目了然。"}, {"title": "5. 工作表保护：锁公式、开放录入区", "body": "场景：模板发给 20 个人填，只允许填黄色区域，公式列不许碰。\n1. **先解锁录入区**：选中允许填写的单元格 → 右键「设置单元格格式」→「保护」→ **取消勾选\"锁定\"**。默认所有单元格都是\"锁定\"状态，但不保护时锁无效。\n2. 「审阅」→「保护工作表」→ 设密码 → 勾选允许的操作（一般保留\"选定未锁定的单元格\"）。\n3. 效果： locked 的公式格点不进去，未锁定的可填。有人想改公式？弹密码框。\n取消：审阅 → 撤销工作表保护 → 输密码。"}, {"title": "6. 允许编辑区域：多人分工", "body": "保护工作表是一刀切，\"允许编辑区域\"可以**按区域设不同密码**：\n「审阅」→「允许编辑区域」→「新建」：\n- 区域 A1:B10，密码 111 → 销售部用密码 111 可改\n- 区域 C1:D10，密码 222 → 财务部用密码 222 可改\n每人只能改自己的区，保护工作表后依然有效。适合部门分工录入同一张表。"}]}], "basics": [{"id": "interface", "title": "认识 Excel 界面", "level": "入门", "body": "标题栏→功能区（选项卡+命令组）→编辑栏（显示/输入公式）→工作表区（行列交叉为单元格，如 B3）→工作表标签（底部切换/新增）→状态栏（快速看求和/平均）。记住：名称框可直接输入 B100 跳转，编辑栏是公式的家。", "steps": ["打开 Excel，观察功能区：文件/开始/插入/页面布局/公式/数据/审阅/视图", "点击名称框输入 D20，回车直接跳转", "在编辑栏输入 =1+2，回车看结果"]}, {"id": "enter", "title": "数据录入技巧", "level": "入门", "body": "Enter 下移、Tab 右移、Shift+Enter 上移。选中区域后按 Enter 在区域内循环。Ctrl+Enter 批量填充选中区域。Alt+↓ 调出下拉历史。Ctrl+; 输入今天日期，Ctrl+Shift+; 输入当前时间。", "steps": ["选中 A1:A10，输入内容后按 Ctrl+Enter 批量填充", "按 Ctrl+; 快速输入今天日期", "用 Alt+↓ 在已有列表中快速选择"]}, {"id": "format", "title": "单元格格式", "level": "入门", "body": "数字格式决定显示方式：常规/数值/货币/百分比/日期。Ctrl+1 打开设置单元格格式对话框。对齐、字体、边框、填充都在「开始」选项卡。格式刷（双击可多次使用）是排版神器。", "steps": ["选中金额列，按 Ctrl+Shift+4 设为货币格式", "选中日期列，Ctrl+1 设为日期格式", "双击格式刷，把标题格式刷到多个地方"]}, {"id": "sortfilter", "title": "排序与筛选", "level": "入门", "body": "筛选（Ctrl+Shift+L）：按条件只显示想要的行，箭头图标点开设条件。排序：按某列升序/降序，多关键字排序用「自定义排序」。注意：排序前先选中整个数据区域，否则会错乱！", "steps": ["选中表头，按 Ctrl+Shift+L 开启筛选", "点箭头，只勾选「销售部」", "按销售额列降序排列"]}, {"id": "print", "title": "打印设置", "level": "入门", "body": "页面布局→打印标题（顶端标题行每页重复）→设置打印区域→分页预览拖蓝线。页眉页脚加页码。打印前一定用「打印预览」检查。", "steps": ["页面布局→打印标题，设置顶端标题行", "选中区域→页面布局→打印区域→设置", "视图→分页预览，拖动蓝线调整"]}], "charts": [{"id": "choose", "title": "图表类型选择指南", "level": "进阶", "body": "比较大小用柱状图/条形图，看趋势用折线图，看占比用饼图/环形图（类别≤6），看关系用散点图/气泡图，看分布用直方图/箱线图。双坐标用组合图。记住：一图只讲一件事。", "types": [{"name": "柱状图", "use": "比较各类别数值大小", "example": "各部门销售额对比"}, {"name": "折线图", "use": "看随时间变化的趋势", "example": "12 个月营收走势"}, {"name": "饼图", "use": "看各部分占比（≤6 类）", "example": "市场份额"}, {"name": "条形图", "use": "类别名称长时的比较", "example": "产品线排名"}, {"name": "散点图", "use": "看两个变量的关系", "example": "广告费 vs 销售额"}, {"name": "面积图", "use": "看累计趋势", "example": "累计用户增长"}, {"name": "雷达图", "use": "多维度综合评价", "example": "员工能力六维图"}, {"name": "组合图", "use": "两个量级不同的序列", "example": "销售额（柱）+增长率（线）"}]}, {"id": "make", "title": "图表制作步骤", "level": "进阶", "body": "选中数据→插入→选图表类型→切换行列（数据反了就点它）→添加数据标签→调坐标轴。数据源：右键→选择数据，可增删系列。", "steps": ["选中数据区域（含表头）", "插入→柱状图→簇状柱形图", "右键图表→添加数据标签", "双击坐标轴调整刻度"]}, {"id": "beauty", "title": "图表美化技巧", "level": "高级", "body": "删网格线、删图例（直接标数据）、统一配色（莫兰迪/商务蓝）、加粗标题讲结论、坐标轴从 0 开始（柱状图）。少即是多：每删一个元素，图表清晰一度。", "steps": ["选中网格线按 Delete 删除", "把图例删掉，直接在柱子上标数值", "标题改成结论句，如「Q3 华东区增长最快」"]}, {"id": "dynamic", "title": "动态图表", "level": "高级", "body": "下拉菜单联动图表：数据验证做下拉→INDEX+MATCH 取数→图表数据源引用。用复选框控制系列显示。用 OFFSET 做动态区域，新增数据自动进图。", "steps": ["用数据验证做月份下拉菜单", "用 INDEX+MATCH 根据选择取数", "图表数据源指向取数区域"]}], "scenarios": [{"id": "finance", "title": "财务报销统计", "level": "进阶", "desc": "每月上百条报销记录，自动汇总到部门/类别", "formulas": ["SUMIFS 多条件汇总", "EOMONTH 判断月份", "IFERROR 容错"], "example": "=SUMIFS(金额列, 部门列, \"销售部\", 日期列, \">=\"&EOMONTH(TODAY(),-2)+1)", "tips": "用数据验证限制部门只能选列表值；条件格式标出超 5000 的报销"}, {"id": "sales", "title": "销售业绩分析", "level": "高级", "desc": "销售明细表 → 自动排名、环比、Top10", "formulas": ["RANK 排名", "VLOOKUP/XLOOKUP 匹配", "SUMPRODUCT 加权"], "example": "=RANK(B2, $B$2:$B$50)  // 业绩排名\n=(本月-上月)/上月  // 环比增长率", "tips": "数据透视表按季度汇总；条件格式数据条直观对比；切片器做交互报表"}, {"id": "hr", "title": "人事考勤统计", "level": "进阶", "desc": "打卡记录 → 迟到/早退/缺勤自动统计", "formulas": ["COUNTIF 统计次数", "IF 判断迟到", "NETWORKDAYS 工作日"], "example": "=IF(上班时间>TIME(9,0,0), \"迟到\", \"正常\")", "tips": "用 TIME 函数设标准时间；数据透视表按人汇总月度考勤"}, {"id": "inventory", "title": "库存预警管理", "level": "高级", "desc": "出入库流水 → 实时库存 + 低库存预警", "formulas": ["SUMIF 分别汇总出入库", "IF 判断预警", "VLOOKUP 匹配单价"], "example": "=SUMIF(类型列,\"入库\",数量列)-SUMIF(类型列,\"出库\",数量列)", "tips": "条件格式标红低于安全库存；用 Power Query 合并多仓数据"}, {"id": "dashboard", "title": "经营仪表盘", "level": "专家", "desc": "一页看懂公司经营：KPI 卡片 + 趋势图 + 明细", "formulas": ["INDEX+MATCH 动态取数", "OFFSET 动态区域", "TEXT 美化显示"], "example": "KPI 卡片 =TEXT(销售额,\"¥#,##0\")&\"  同比 \"&TEXT(增长率,\"0%\")", "tips": "组合：数据透视表+切片器+图表=交互式仪表盘；用照相机功能拼排版"}], "ai_excel": [{"id": "ai_tools", "title": "AI 赋能 Excel 的 6 种方式", "level": "进阶", "body": "1. 公式生成：描述需求让 AI 写公式；2. 数据清洗：让 AI 写 Power Query M 语言；3. VBA 代码：描述需求生成宏；4. 数据分析：粘贴数据让 AI 解读；5. 图表建议：问 AI 哪种图合适；6. 模板生成：让 AI 设计表格结构。", "tips": ["把表头复制给 AI，它才能写对引用", "让 AI 解释公式每一步，顺便学习", "重要公式务必人工验证，AI 会一本正经地写错"]}, {"id": "ai_prompts", "title": "AI 提示词模板", "level": "进阶", "body": "公式生成：'我的表格 A 列是姓名、B 列是销售额，请写一个公式统计销售部（A列）销售额大于 10 万的人数，用中文解释每一步。' VBA 生成：'写一个 VBA 宏，把当前工作表 A1:D100 导出为 CSV，带中文注释。' 数据分析：'以下是销售数据（粘贴），请分析 Top3 产品和环比趋势。'", "tips": ["说清列含义比说清需求更重要", "要求 AI 用中文解释，顺便学公式"]}, {"id": "ai_copilot", "title": "Copilot for Excel", "level": "高级", "body": "微软官方 AI 助手：自然语言提问、自动生成公式、数据洞察、Python in Excel 集成。需要 Microsoft 365 订阅。平替方案：ChatGPT/Claude + 手动复制。", "tips": ["Python in Excel 让数据分析能力质变", "敏感数据不要粘贴给公有 AI"]}], "office": [{"id": "word", "title": "Word 高效技巧", "level": "入门", "body": "样式是 Word 的灵魂：用标题样式+导航窗格管理长文档；多级列表自动编号；交叉引用让图表编号自动更新；邮件合并批量生成工资条/邀请函。", "tips": ["Ctrl+Shift+S 快速应用样式", "F4 重复上一步操作", "邮件合并=Word+Excel 数据源"]}, {"id": "ppt", "title": "PPT 高效技巧", "level": "入门", "body": "母版统一全篇样式；SmartArt 一键转流程图；取色器吸取品牌色；排练计时控制节奏；导出 PDF/视频方便分享。", "tips": ["一页只讲一件事", "6×6 原则：每页≤6行，每行≤6词", "用参考线对齐"]}, {"id": "outlook", "title": "Outlook 效率", "level": "进阶", "body": "规则自动分拣邮件；快速步骤一键归档+回复；延迟发送避免冲动；会议邀请用 Scheduling Assistant 找共同空闲。", "tips": ["Ctrl+Shift+M 新建邮件", "收件箱清零：处理→归档/待办/删除三选一"]}, {"id": "teams", "title": "Teams/协作", "level": "进阶", "body": "Excel 在线协作：存 OneDrive/SharePoint，多人同时编辑看彩色光标；@提到人；版本历史找回误删。", "tips": ["协作前先备份", "用「审阅→共享工作簿」看谁在改"]}, {"id": "combo", "title": "Office 三件套联动", "level": "高级", "body": "Excel 数据→Word 邮件合并批量发工资条；Excel 图表→粘贴链接到 PPT，源数据更新图表自动更新；Power Query 抓取文件夹中所有 Excel 自动合并。", "tips": ["粘贴时选「链接」，不要选「图片」", "邮件合并数据源就是 Excel 表"]}], "versions": {"list": ["Excel 2003", "Excel 2007", "Excel 2010", "Excel 2013", "Excel 2016", "Excel 2019", "Excel 2021", "Excel 365"], "notes": {"Excel 2003": "经典界面（菜单栏），无 Ribbon；不支持 xlsx 大数据量（65536 行上限）", "Excel 2007": "首次 Ribbon 界面；新增 SUMIFS/COUNTIFS/AVERAGEIF/IFERROR；行数扩展到 104 万", "Excel 2010": "新增切片器、迷你图；Power Pivot 首次作为插件出现", "Excel 2013": "新增 Power Query（插件）、时间轴、推荐图表", "Excel 2016": "Power Query 内置", "Excel 2019": "新增 IFS/SWITCH/TEXTJOIN/CONCAT/MAXIFS/MINIFS 六个函数；漏斗图/地图图表（TEXTBEFORE/TEXTAFTER/TEXTSPLIT 为 Microsoft 365 专属，不在 2019 内）", "Excel 2021": "动态数组正式版：FILTER/SORT/UNIQUE/XLOOKUP/XMATCH", "Excel 365": "持续更新：动态数组、LAMBDA、Python in Excel、Copilot"}, "func_ver": {"XLOOKUP": "2021 / 365", "FILTER": "2021 / 365", "SORT": "2021 / 365", "UNIQUE": "2021 / 365", "XMATCH": "2021 / 365", "TEXTSPLIT": "365", "TEXTBEFORE": "365", "TEXTAFTER": "365", "LAMBDA": "365", "IFS": "2019 / 365", "SWITCH": "2019 / 365", "TEXTJOIN": "2019 / 365", "CONCAT": "2019 / 365", "MAXIFS": "2019 / 365", "MINIFS": "2019 / 365", "IFERROR": "2007+", "SUMIFS": "2007+", "COUNTIFS": "2007+", "AVERAGEIF": "2007+", "VLOOKUP": "全版本", "SUMIF": "全版本", "INDEX": "全版本", "MATCH": "全版本"}}, "errors": [{"code": "#N/A", "title": "找不到值", "cause": "查找的值不存在；VLOOKUP/MATCH/XLOOKUP 没找到匹配项；引用了空单元格的查找。", "fix": ["用 IFERROR 包裹：=IFERROR(VLOOKUP(...),\"未找到\")", "检查查找值前后是否有空格（用 TRIM 清理）", "确认查找区域首列确实包含关键字", "数字存成文本会导致匹配失败，统一格式"], "example": "=IFERROR(VLOOKUP(A2,员工表!A:B,2,0),\"查无此人\")"}, {"code": "#VALUE!", "title": "值类型错误", "cause": "文本参与了数学运算；函数参数类型不对；数组公式维度不匹配。", "fix": ["检查参与计算的单元格是否为文本型数字（绿三角）", "用 VALUE() 把文本转数字", "日期参与运算前确认是真日期而非文本"], "example": "=VALUE(A2)+B2  // 把文本型数字转成真数字再算"}, {"code": "#REF!", "title": "引用无效", "cause": "删除了公式引用的行/列/工作表；VLOOKUP 列序号超出范围。", "fix": ["撤销删除（Ctrl+Z）", "VLOOKUP 列序号不能大于区域列数", "跨表引用前确认表名没改"], "example": "VLOOKUP 区域 A:B 却写第 3 列 → #REF!"}, {"code": "#NAME?", "title": "名称错误", "cause": "函数名拼错；中文引号/中文括号；用了新版本函数但版本太旧；自定义名称不存在。", "fix": ["检查函数名拼写", "引号括号必须用英文半角", "TEXTSPLIT 等新函数需要 365", "公式→名称管理器检查自定义名称"], "example": "=VLOKUP(…) 拼错 → #NAME?"}, {"code": "#DIV/0!", "title": "除数为零", "cause": "除数是 0 或空单元格；平均空区域。", "fix": ["=IF(B2=0,\"-\",A2/B2)", "用 IFERROR 包裹：=IFERROR(A2/B2,0)"], "example": "=IFERROR(销售额/目标,0)"}, {"code": "#NUM!", "title": "数字错误", "cause": "数字太大/太小超出范围；迭代计算不收敛；SQRT 负数。", "fix": ["检查输入值范围", "SQRT 前用 MAX(0,…) 兜底", "IRR 等函数可调迭代次数"], "example": "=SQRT(-4) → #NUM!"}, {"code": "#SPILL!", "title": "溢出错误", "cause": "动态数组（FILTER/SORT/UNIQUE）的输出区域被占用；365 专属错误。", "fix": ["清空公式下方的单元格", "不要在表格（Ctrl+T）内用动态数组", "检查是否有合并单元格挡路"], "example": "=FILTER(A:A,A:A<>\"\") 下方有数据 → #SPILL!"}, {"code": "#CALC!", "title": "计算错误", "cause": "动态数组返回空；LAMBDA 递归问题；365 专属。", "fix": ["FILTER 结果为空时加第三参数：=FILTER(区,条件,\"无数据\")", "检查 LAMBDA 逻辑"], "example": "=FILTER(A2:A10,B2:B10=\"X\",\"无匹配\")"}], "tips": [{"t": "一秒删除空行", "how": "选中区域 → Ctrl+G 定位 → 空值 → 右键删除整行", "lv": "入门"}, {"t": "批量合并单元格", "how": "不推荐合并！用「跨列居中」代替：对齐方式→水平对齐→跨列居中", "lv": "入门"}, {"t": "快速提取手机号", "how": "相邻列输入第一个手机号 → Ctrl+E 快速填充，自动识别规律", "lv": "入门"}, {"t": "身份证解析", "how": "生日 =MID(A2,7,8)；性别 =IF(MOD(MID(A2,17,1),2),\"男\",\"女\")；年龄 =DATEDIF(TEXT(MID(A2,7,8),\"0-00-00\"),TODAY(),\"Y\")", "lv": "进阶"}, {"t": "自动计算年龄", "how": "=DATEDIF(出生日期,TODAY(),\"Y\")", "lv": "入门"}, {"t": "一秒求和", "how": "选中数据+下方空行 → Alt+= 自动求和", "lv": "入门"}, {"t": "快速填充序号", "how": "A2 输入 1，A3 输入 2，选中两格下拉；或 A2 输入 1，下拉时按住 Ctrl", "lv": "入门"}, {"t": "跨表求和", "how": "=SUM(1月:12月!B2) 对 1月到12月所有表的 B2 求和", "lv": "进阶"}, {"t": "冻结窗格", "how": "选中 B2 → 视图 → 冻结窗格，首行首列同时冻结", "lv": "入门"}, {"t": "分列整理数据", "how": "数据 → 分列：把一列拆多列；也能把文本型数字转成真数字", "lv": "入门"}, {"t": "去重", "how": "数据 → 删除重复项；或 =UNIQUE(A:A)（365）", "lv": "入门"}, {"t": "照相机功能", "how": "把图表+表格拼成一张动态图片，源数据变图片自动变（需添加到快速访问工具栏）", "lv": "高级"}, {"t": "自定义下拉联动", "how": "定义名称+INDIRECT：二级菜单 =INDIRECT($A2)", "lv": "高级"}, {"t": "批量替换", "how": "Ctrl+H：支持通配符，* 代表任意多个字符，? 代表单个", "lv": "入门"}, {"t": "快速转置", "how": "复制 → 右键 → 选择性粘贴 → 转置", "lv": "入门"}, {"t": "万元显示", "how": "自定义格式 #,##0!.0,\"万\"：12345678 显示为 1234.6万", "lv": "进阶"}, {"t": "防止输入重复", "how": "数据验证 → 自定义 → 公式 =COUNTIF(A:A,A1)=1", "lv": "进阶"}, {"t": "自动标红逾期", "how": "条件格式 → 新建规则 → =AND($E2<TODAY(),$G2<>\"已完成\")", "lv": "进阶"}, {"t": "打印每页标题", "how": "页面布局 → 打印标题 → 顶端标题行", "lv": "入门"}, {"t": "一键美化表格", "how": "选中区域 → Ctrl+T 转为智能表格，自动带筛选+隔行变色", "lv": "入门"}], "chart_lib": [{"name": "柱状图", "use": "比较各类别数值", "steps": ["选中数据（含表头）", "插入→柱状图→簇状", "右键→添加数据标签", "删除网格线"], "tpl": "chart-bar"}, {"name": "条形图", "use": "类别名称长时的比较", "steps": ["选中数据", "插入→条形图", "类别放纵轴，名称再长也不挤"], "tpl": "chart-barh"}, {"name": "饼图", "use": "占比（类别≤6）", "steps": ["选中两列（类别+数值）", "插入→饼图", "右键→添加数据标签→百分比"], "tpl": "chart-pie"}, {"name": "折线图", "use": "随时间趋势", "steps": ["日期放横轴", "插入→折线图→带数据标记", "右键→添加趋势线"], "tpl": "chart-line"}, {"name": "散点图", "use": "两变量关系", "steps": ["X/Y 两列数值", "插入→散点图", "添加趋势线看相关性"], "tpl": "chart-scatter"}, {"name": "雷达图", "use": "多维度评价", "steps": ["维度放第一列", "插入→雷达图", "适合 5-8 个维度"], "tpl": "chart-radar"}, {"name": "甘特图", "use": "项目进度", "steps": ["任务/开始/工期三列", "插入→条形图→堆积", "把「开始」系列设为无填充", "调整纵轴逆序"], "tpl": "chart-gantt"}, {"name": "漏斗图", "use": "转化流程", "steps": ["阶段+人数两列", "插入→漏斗图（2019+）", "老版本用条形图模拟"], "tpl": "chart-funnel"}, {"name": "旭日图", "use": "多层级占比", "steps": ["层级从左到右排", "插入→旭日图（2016+）", "适合 2-3 层"], "tpl": "chart-sunburst"}, {"name": "地图图表", "use": "地域分布", "steps": ["地名要规范（省/国家）", "插入→地图（2019+）", "值用颜色深浅表示"], "tpl": "chart-map"}], "pivot_adv": [{"t": "基础操作", "body": "选中数据→插入→数据透视表。四个区：行、列、值、筛选。值字段默认求和，右键可改计数/平均/最大值。"}, {"t": "分组统计", "body": "日期右键→组合：按年/季度/月分组。数字右键→组合：按区间分组（如成绩段 60-70/70-80）。"}, {"t": "多维分析", "body": "行放「区域」、列放「季度」、值放「销售额」，一眼看交叉汇总。值显示方式→差异/百分比，做同比环比。"}, {"t": "切片器", "body": "插入切片器→选字段，点按钮即筛选，多表联动（报表连接）。比筛选直观 10 倍，汇报必备。"}, {"t": "时间轴", "body": "日期字段专用筛选器，按年/季度/月/日切换，比切片器更适合时间。"}, {"t": "数据模型", "body": "多表关联：把订单表+产品表都添加到数据模型，用字段关联，一张透视表跨表分析。Power Pivot 的地基。"}], "pq_adv": [{"t": "导入 CSV", "body": "数据→获取数据→从文本/CSV。乱码？改编码为 65001（UTF-8）或 936（GBK）。"}, {"t": "导入网页", "body": "数据→自网站→粘贴 URL。网页表格结构变化时需重新检查步骤。"}, {"t": "数据清洗", "body": "删空行、替换值、填充、修剪、分列、更改类型。每一步都记录在右侧「应用的步骤」，可回退。"}, {"t": "合并表", "body": "追加查询=上下堆叠（多月数据合并）；合并查询=左右连接（VLOOKUP 的批量版）。"}, {"t": "拆分列", "body": "按分隔符/字符数拆分。\"2026-10-01\" 按 \"-\" 拆成年/月/日三列。"}, {"t": "自动刷新", "body": "关闭并上载后，源文件更新→右键刷新。还可设置打开文件自动刷新：数据→查询属性。"}], "ppivot": [{"t": "数据模型", "body": "Power Pivot→添加到数据模型。多表不用 VLOOKUP，用关系关联，百万行不卡。"}, {"t": "多表关联", "body": "关系视图拖线连主外键。一对多：产品表（1）→订单表（多）。"}, {"t": "DAX 公式入门", "body": "DAX 长得像 Excel 函数但思维是列式。SUM(表[列])、CALCULATE(表达式, 筛选)、RELATED(取关联表字段)。"}, {"t": "常用 DAX", "body": "总销售额 =SUM(订单[金额])\n当年累计 =CALCULATE([总销售额], DATESYTD(日期表[日期]))\n同比 =DIVIDE([总销售额]-[去年同期], [去年同期])"}, {"t": "KPI 指标", "body": "在数据模型中建度量值：销售额、利润率、完成率。度量值随切片器自动重算，一处定义处处用。"}], "cfmt": [{"t": "颜色标记", "body": "开始→条件格式→突出显示单元格规则：大于/小于/介于/等于，自动上色。"}, {"t": "数据条", "body": "在单元格内画横向条形图，数值大小一目了然。适合业绩对比。"}, {"t": "图标集", "body": "红绿灯/箭头/旗帜，按阈值自动打标。管理驾驶舱常用。"}, {"t": "自定义公式", "body": "新建规则→使用公式。注意 $ 锁定：=$B2>100 整行变色（选中整行时列锁定行不锁定）。"}, {"t": "案例：自动标红逾期", "body": "=AND($E2<TODAY(),$G2<>\"已完成\") → 逾期未完成的整行变红。"}, {"t": "案例：高亮重复", "body": "选中区域→条件格式→突出显示→重复值。或公式 =COUNTIF($A:$A,$A2)>1 自定义颜色。"}], "dval": [{"t": "下拉菜单", "body": "数据→数据验证→序列，来源输入：男,女（英文逗号）。或引用一列区域。"}, {"t": "联动下拉框", "body": "一级菜单选「省份」→二级自动出该省城市。做法：定义名称+INDIRECT($A2)。先做各省名单，再建一级下拉，二级来源 =INDIRECT(A2)。"}, {"t": "日期限制", "body": "数据验证→日期→介于 2026-1-1 到 2026-12-31，只能输今年日期。"}, {"t": "输入规则", "body": "整数/小数/文本长度：手机号设文本长度=11；年龄设整数介于 18-65。出错警告可自定义提示语。"}, {"t": "圈释无效数据", "body": "数据→数据验证→圈释无效数据，已有违规的一眼现形。"}], "case_center": [{"cat": "财务案例", "items": [{"t": "工资表", "d": "应发=基本+绩效+补贴-社保，用 IF 判断个税", "f": "=D2+E2+F2-G2"}, {"t": "预算表", "d": "SUMIFS 按部门+月份汇总，条件格式超预算标红", "f": "=SUMIFS(实际列,部门列,A2,月份列,B2)"}]}, {"cat": "人事案例", "items": [{"t": "考勤管理", "d": "COUNTIF 统计迟到，NETWORKDAYS 算出勤", "f": "=COUNTIF(B2:AF2,\"迟\")"}, {"t": "花名册", "d": "DATEDIF 算工龄，VLOOKUP 关联部门", "f": "=DATEDIF(C2,TODAY(),\"Y\")"}]}, {"cat": "销售案例", "items": [{"t": "销售统计", "d": "RANK 排名，SUMPRODUCT 加权", "f": "=RANK(B2,B:B)"}, {"t": "环比分析", "d": "透视表按月分组，值显示差异百分比", "f": "=(本月-上月)/上月"}]}, {"cat": "仓库案例", "items": [{"t": "库存管理", "d": "SUMIF 分开汇总出入库，IF 预警", "f": "=SUMIF(类型,\"入库\",数量)-SUMIF(类型,\"出库\",数量)"}, {"t": "盘点差异", "d": "实盘-账面，条件格式标差异", "f": "=D2-C2"}]}, {"cat": "采购案例", "items": [{"t": "采购跟踪", "d": "EOMONTH 算账期，逾期标红", "f": "=EOMONTH(下单日期,1)"}, {"t": "比价表", "d": "MIN 取最低价，INDEX+MATCH 反查供应商", "f": "=INDEX(供应商列,MATCH(MIN(价格区),价格区,0))"}]}, {"cat": "物流案例", "items": [{"t": "运费统计", "d": "SUMIFS 按线路+月份汇总", "f": "=SUMIFS(运费列,线路列,A2)"}, {"t": "报关数据分析", "d": "透视表按 HS 编码汇总，TOP10 品名", "f": "数据透视表：行=品名，值=金额求和"}]}], "exam": [{"t": "MOS 认证", "d": "微软官方 Office 认证，分 Associate/Expert/Master 三级，全球通用，外企认可度高。考试为实操题，Excel 侧重函数/图表/透视表。", "tips": ["官网报名，国内有考点", "Expert 含 VBA 和高级数据管理"]}, {"t": "全国计算机等级考试", "d": "教育部考试中心。二级 MS Office 是大学生最热门科目：选择题+Word+Excel+PPT 实操。证书可加综测分、求职有用。", "tips": ["二级考大纲每年微调", "Excel 重点：函数、图表、数据处理"]}, {"t": "企业办公技能考试", "d": "很多大企业校招/内训自设：限时完成数据清洗+报表+PPT。用本站学习路线「中级」水平即可应对。", "tips": ["练速度：快捷键是关键", "透视表+图表是必考"]}], "faq": [{"q": "如何统计重复数据？", "a": "用 COUNTIF：=COUNTIF(A:A,A2)>1 标出重复；或数据→删除重复项直接去重；365 用 =UNIQUE(A:A) 取唯一值。"}, {"q": "如何制作动态下拉框？", "a": "二级联动：先定义各省城市为名称，一级下拉选省份，二级数据验证来源写 =INDIRECT($A2)。"}, {"q": "为什么 VLOOKUP 返回 #N/A？", "a": "四查：①查找值前后有空格没（TRIM）；②首列真有这个值吗；③数字存成文本（格式统一）；④第四参数写 FALSE 了吗。还不行就换 XLOOKUP。"}, {"q": "筛选后求和不对怎么办？", "a": "SUM 会把隐藏行也加进去，改用 =SUBTOTAL(109,区域)，109 表示只对可见单元格求和。"}, {"q": "日期显示成数字怎么办？", "a": "那是日期序列值，选中→Ctrl+1→设为日期格式。反过来文本日期转真日期用 DATEVALUE 或分列。"}, {"q": "如何合并多个工作表？", "a": "结构相同的表：Power Query→追加查询，一键合并几十个表，还能自动刷新。"}, {"q": "公式太长看不懂怎么办？", "a": "用 LET 给中间结果起名：=LET(x,SUM(A:A),y,COUNT(A:A),x/y)。或按 Alt+Enter 在编辑栏换行。"}, {"q": "文件太大打不开？", "a": "先关自动重算（公式→手动）；删多余格式（Ctrl+End 看看用到哪）；另存为 xlsb 二进制格式体积减半。"}, {"q": "如何防止别人改公式？", "a": "全选→取消锁定→只选中公式区→锁定→审阅→保护工作表设密码。只锁公式，数据区可填。"}, {"q": "打印时每页都有标题行？", "a": "页面布局→打印标题→顶端标题行→选 $1:$1。"}, {"q": "下拉数字变成日期？", "a": "如 1-2 被认成 1月2日。先设单元格为文本格式再输，或前面加英文单引号 '1-2。"}, {"q": "VLOOKUP 只能向右找怎么办？", "a": "用 INDEX+MATCH：=INDEX(返回列,MATCH(查找值,查找列,0))，方向随意。或直接 XLOOKUP。"}, {"q": "如何批量提取括号内容？", "a": "Ctrl+E 快速填充最省事；公式法 =MID(A2,FIND(\"(\",A2)+1,FIND(\")\",A2)-FIND(\"(\",A2)-1)。"}, {"q": "条件格式太多卡顿？", "a": "条件格式→管理规则，删掉整列引用的（如 $A:$A），改成实际区域 $A$1:$A$1000。"}, {"q": "共享后公式被改乱？", "a": "保护工作表+只允许填数据区；或存 OneDrive 用版本历史找回。"}, {"q": "如何让序号下拉不中断？", "a": "用 =ROW()-1 公式下拉，删行不断号；或转智能表格，公式自动填充。"}, {"q": "身份证号变成科学计数法怎么办？", "a": "先设文本格式再录入；已变形用 =TEXT(A1,\"0\") 恢复显示。"}, {"q": "VLOOKUP 返回 #N/A 但值明明存在？", "a": "检查多余空格（TRIM 清理）、数字与文本格式不一致，统一后再查。"}, {"q": "如何快速删除重复行？", "a": "数据→删除重复项；365 也可用 =UNIQUE(A:A) 提取唯一值。"}, {"q": "筛选后序号不连续怎么办？", "a": "用 =SUBTOTAL(103,$A$2:A2) 下拉，筛选后序号自动连续。"}, {"q": "公式下拉后结果都一样？", "a": "检查计算选项是否为手动，改回自动；或单元格被设为文本格式。"}, {"q": "如何跨表汇总多个分表？", "a": "用 =SUM(表1:表3!B2) 三维引用；或 Power Query 合并文件夹。"}, {"q": "打印时每页都显示标题行？", "a": "页面布局→打印标题→顶端标题行设为 $1:$1。"}, {"q": "CSV 打开中文乱码？", "a": "用数据→从文本/CSV 导入，编码选 UTF-8 或 936。"}, {"q": "文件太大打开很慢？", "a": "Ctrl+End 看已用区域是否虚大，删多余行列格式后保存。"}, {"q": "如何防止别人改我的公式？", "a": "审阅→保护工作表，锁定含公式单元格后设密码。"}, {"q": "数据透视表日期不能按月分组？", "a": "检查该列是否混入文本，先统一为日期格式再分组。"}, {"q": "图表新增数据不自动更新？", "a": "数据源转智能表格（Ctrl+T），图表会自动扩展。"}, {"q": "如何批量把文本型数字转数值？", "a": "选中列→分列→完成；或空单元格写 1 复制→选择性粘贴→乘。"}, {"q": "Excel 卡死没保存能找回吗？", "a": "文件→信息→管理工作簿→恢复未保存的工作簿；建议开 5 分钟自动恢复。"}], "repair": [{"t": "文件打不开", "body": "①打开 Excel→文件→打开→选中文件→打开按钮下拉→打开并修复；②改后缀 xlsx→zip 解压取 xl/worksheets 下的 xml；③用 WPS 试试，兼容性有时更好。"}, {"t": "文件损坏", "body": "从备份/OneDrive 版本历史恢复；用「打开并修复」→提取数据；新建工作簿用外部引用 =['坏文件.xlsx']Sheet1'!A1 抢救数据。"}, {"t": "文件变成只读", "body": "右键文件→属性→取消只读勾选；文件→另存为换个名字；检查是否被别人打开（共享盘）。"}, {"t": "内容丢失", "body": "文件→信息→管理工作簿→恢复未保存的工作簿；自动恢复位置：文件→选项→保存→看路径。平时开自动恢复 5 分钟。"}, {"t": "公式丢失（变数值）", "body": "可能误做了选择性粘贴为值。用版本历史找回；教训：重要表做公式前先备份一份。"}, {"t": "预防指南", "body": "①开自动保存/自动恢复 ②重要文件每天另存版本号 ③存 OneDrive 有 30 天版本历史 ④大公式表定期另存 xlsb。"}], "roadmap": [{"lv": "新手", "color": "#22c55e", "items": ["认识界面：功能区/编辑栏/工作表", "单元格：输入/选中/填充", "格式：字体/对齐/边框/数字格式", "基础操作：排序/筛选/冻结/打印"]}, {"lv": "初级", "color": "#3b82f6", "items": ["基础函数：SUM/AVERAGE/COUNT/MAX/MIN", "条件函数：IF/SUMIF/COUNTIF", "查找函数：VLOOKUP", "文本日期：LEFT/MID/TODAY/DATEDIF"]}, {"lv": "中级", "color": "#f59e0b", "items": ["图表：选型/制作/美化", "条件格式：标记/数据条/公式", "数据验证：下拉/联动/规则", "数据透视表：汇总/分组/切片器", "高级函数：INDEX+MATCH/SUMPRODUCT"]}, {"lv": "高级", "color": "#ef4444", "items": ["Power Query：清洗/合并/自动刷新", "Power Pivot：数据模型/DAX", "VBA：录制/语法/自动化", "动态数组：FILTER/SORT/XLOOKUP", "综合：仪表盘/多表联动"]}], "resources": [{"cat": "模板", "items": ["21 个模板（本站模板下载区：4 图表模板 + 4 数据文件）", "数据文件：销售数据1000行/人事考勤样本/函数练习题/透视表练习数据（配练习任务）"]}, {"cat": "示例数据集", "items": ["销售数据 1000 行（订单/区域/品类齐全，配 6 个练习任务 → 模板下载区「数据」分类下载）", "人事考勤样本（25 人 9 月考勤，迟到/请假公式+部门汇总 → 模板下载区「数据」分类下载）"]}, {"cat": "VBA 代码库", "items": ["8 个实例代码（本站 VBA 区一键复制）", "33 个关键字手册"]}, {"cat": "练习文件", "items": ["函数练习题（12 道 VLOOKUP/SUMIFS/XLOOKUP 实战，附参考答案 → 模板下载区「数据」分类下载）", "透视表练习数据（500 行明细，配 6 个透视表任务+避坑 → 模板下载区「数据」分类下载）"]}], "tip_cats": [{"cat": "数据录入技巧", "icon": "⌨️", "items": [{"t": "自动填充序号", "how": "首格输入 1、第二格输入 2，选中两格拖填充柄；或用 =ROW()-1 下拉，删行不中断"}, {"t": "自动生成流水号", "how": "用 =\"NO.\"&TEXT(ROW()-1,\"0000\") 下拉，序号自动补零对齐"}, {"t": "快速录入当前日期", "how": "按 Ctrl+; 直接输入今天日期（静态值，不会每天变）"}, {"t": "快速录入当前时间", "how": "按 Ctrl+Shift+; 输入当前时间；日期时间一起按 Ctrl+; 空格 Ctrl+Shift+;"}, {"t": "快速输入重复内容", "how": "输入前几个字后按 Alt+↓，从本列已录入的值里直接选"}, {"t": "下拉选择录入", "how": "数据→数据验证→序列，来源输入 男,女，只能点选不能乱填"}, {"t": "联动下拉菜单", "how": "一级菜单做命名区域，二级数据验证→序列用 =INDIRECT($A2) 引用"}, {"t": "防止重复输入", "how": "数据验证→自定义，公式 =COUNTIF(A:A,A1)=1，重复就报错"}, {"t": "批量导入数据", "how": "数据→获取数据→从文本/CSV，一次把外部数据整份导进来"}]}, {"cat": "数据清洗技巧", "icon": "🧹", "items": [{"t": "一秒删除空行", "how": "选中区域→Ctrl+G 定位→空值→右键删除整行"}, {"t": "删除空列", "how": "选中区域→Ctrl+G 空值→右键删除整列（先备份原表）"}, {"t": "删除重复值", "how": "数据→删除重复项，勾选关键列，一键去重"}, {"t": "合并重复记录", "how": "数据透视表按关键字段分组，对金额求和、对订单计数"}, {"t": "去除隐藏空格", "how": "=TRIM(A1) 去首尾空格；=CLEAN(A1) 去换行等不可见字符"}, {"t": "去除换行符", "how": "查找替换：查找内容处按 Ctrl+J，替换为留空，全部替换"}, {"t": "统一日期格式", "how": "选中列→数据→分列→下一步→日期 YMD，一次把文本日期转正"}, {"t": "统一手机号格式", "how": "先设为文本格式再录入；已变形用 =TEXT(A1,\"0\") 恢复显示"}, {"t": "数字文本互转", "how": "数字转文本用 =TEXT(A1,\"0\")；文本转数字用 =A1*1 或分列→常规"}]}, {"cat": "函数应用技巧", "icon": "∑", "items": [{"t": "VLOOKUP精确匹配", "how": "=VLOOKUP(值,区域,列号,0)，第四参数写 0 才是精确查找"}, {"t": "VLOOKUP反向查询", "how": "右查左改用 =INDEX(B:B,MATCH(值,A:A,0))"}, {"t": "XLOOKUP一步到位", "how": "=XLOOKUP(值,查找列,返回列,\"未找到\")，不用数第几列"}, {"t": "INDEX+MATCH多条件", "how": "=INDEX(返回列,MATCH(1,(条件列1=条件1)*(条件列2=条件2),0))"}, {"t": "模糊匹配查询", "how": "=VLOOKUP(\"*\"&关键词&\"*\",区域,2,0)，通配符前后包夹"}, {"t": "双向查询", "how": "=INDEX(区域,MATCH(行值,首列,0),MATCH(列值,首行,0)) 行列交叉定位"}, {"t": "跨表查询", "how": "=VLOOKUP(A2,INDIRECT(\"'\"&B2&\"'!A:B\"),2,0)，按表名动态切换"}, {"t": "动态查询面板", "how": "数据验证做下拉选关键词，XLOOKUP 引用该单元格，选谁查谁"}, {"t": "多条件统计", "how": "=SUMIFS(求和列,条件列1,条件1,条件列2,条件2)，条件可继续加"}, {"t": "动态汇总区域", "how": "=SUM(OFFSET(首格,0,0,COUNTA(列),1))，新增行自动纳入"}]}, {"cat": "文本处理技巧", "icon": "🔤", "items": [{"t": "提取姓名中的姓", "how": "=LEFT(A2,1)，复姓手动处理或用快速填充"}, {"t": "提取手机号", "how": "固定位置用 =MID(A2,12,11)；不固定用 Ctrl+E 快速填充"}, {"t": "提取邮箱", "how": "用 Ctrl+E 按示例提取；或 =MID(A2,FIND(\"@\",A2)-6,20) 再 TRIM"}, {"t": "分离姓和名", "how": "姓 =LEFT(A2,1)，名 =RIGHT(A2,LEN(A2)-1)"}, {"t": "中英文拆分", "how": "旁边列手写一行英文示例，选中→Ctrl+E，自动按规律拆分"}, {"t": "字符串替换", "how": "=SUBSTITUTE(A2,\"旧\",\"新\")，嵌套可做多重替换"}, {"t": "批量修改内容", "how": "Ctrl+H 查找替换，支持通配符 * ?，可限定范围"}, {"t": "批量添加前缀", "how": "=\"前缀\"&A2；纯显示用自定义格式 \"前缀\"@"}, {"t": "批量添加后缀", "how": "=A2&\"元\"；数字加单位也可用自定义格式 0\"元\""}]}, {"cat": "日期时间技巧", "icon": "📅", "items": [{"t": "计算年龄", "how": "=DATEDIF(出生日期,TODAY(),\"Y\")，周岁一键得出"}, {"t": "计算工龄", "how": "=DATEDIF(入职日,TODAY(),\"Y\")&\"年\"&DATEDIF(入职日,TODAY(),\"YM\")&\"月\""}, {"t": "工作日计算", "how": "=NETWORKDAYS(开始,结束)，自动排除周六日"}, {"t": "节假日排除", "how": "=NETWORKDAYS(开始,结束,节假日区域)，第三参数放假日清单"}, {"t": "倒计时计算", "how": "=目标日期-TODAY()&\"天\"，过期变负数可标红"}, {"t": "取月初日期", "how": "=EOMONTH(日期,-1)+1，上月月末加一天即本月初"}, {"t": "取月末日期", "how": "=EOMONTH(日期,0)，自动处理大小月和闰年"}, {"t": "季度统计", "how": "辅助列 =\"Q\"&INT((MONTH(日期)+2)/3)，再透视表汇总"}, {"t": "周数计算", "how": "=WEEKNUM(日期,2)，第二参数 2 表示周一起始"}]}, {"cat": "格式美化技巧", "icon": "🎨", "items": [{"t": "隔行变色", "how": "条件格式→新建规则→公式 =MOD(ROW(),2)=0，设填充色"}, {"t": "自动高亮整行", "how": "选中区域→条件格式公式 =$A1=\"重点\"，整行自动上色"}, {"t": "数据条", "how": "开始→条件格式→数据条，数值大小一目了然"}, {"t": "图标集", "how": "条件格式→图标集，达标/预警/异常自动打对勾感叹号"}, {"t": "自动标红逾期", "how": "条件格式公式 =A2<TODAY()，过期日期自动变红"}, {"t": "自动标绿达标", "how": "=B2>=目标值 标绿，低于目标再加一条标红"}, {"t": "动态颜色变化", "how": "条件格式+公式绑定数值，数据变颜色自动跟"}, {"t": "重复值高亮", "how": "条件格式→突出显示单元格规则→重复值"}, {"t": "仪表盘美化", "how": "大字号 KPI + 条件格式图标 + 迷你图，注意留白对齐"}]}, {"cat": "图表技巧", "icon": "📈", "items": [{"t": "一键生成图表", "how": "选中数据按 Alt+F1 生成嵌入图表；F11 生成独立图表工作表"}, {"t": "动态图表", "how": "定义名称 =OFFSET(首格,0,0,COUNTA(列),1) 做数据源，新增自动扩展"}, {"t": "手绘甘特图", "how": "条形图：开始日期为起点、工期为长度，逆序类别+调透明度"}, {"t": "漏斗图", "how": "插入→漏斗图（2016 及以上），看各环节转化流失"}, {"t": "KPI达成图", "how": "环形图 + 大数字文本框，目标完成率一目了然"}, {"t": "销售驾驶舱", "how": "切片器 + 数据透视表 + 组合图，点选维度图表联动"}, {"t": "地图图表", "how": "插入→地图（365），按省份/国家数值自动着色"}, {"t": "单元格热力图", "how": "不用图表，条件格式→色阶直接在区域上画热力分布"}]}, {"cat": "打印技巧", "icon": "🖨️", "items": [{"t": "一页打印", "how": "页面布局→宽度/高度设为 1 页，超宽表格自动缩放"}, {"t": "打印标题行", "how": "页面布局→打印标题→顶端标题行设为 $1:$1，每页重复表头"}, {"t": "自动分页调整", "how": "视图→分页预览，拖动蓝色分页线控制每页内容"}, {"t": "打印网格线", "how": "页面设置→工作表→勾选网格线，表格线才能印出来"}, {"t": "打印批注", "how": "页面设置→工作表→批注选“工作表末尾”，批注集中打印"}, {"t": "横向打印", "how": "页面布局→纸张方向→横向，列多的表横过来打"}, {"t": "批量打印多表", "how": "按住 Ctrl 点多个工作表标签→文件→打印，一次全打"}, {"t": "只打印选中区域", "how": "选中区域→页面布局→打印区域→设置打印区域"}]}, {"cat": "快捷键技巧", "icon": "⚡", "items": [{"t": "Ctrl+D 向下填充", "how": "选中区域按 Ctrl+D，把最上一格内容/公式填满下方"}, {"t": "Ctrl+R 向右填充", "how": "选中区域按 Ctrl+R，把最左一格内容填满右侧"}, {"t": "Ctrl+E 快速填充", "how": "手写一个示例后按 Ctrl+E，自动识别规律拆分合并，提取手机号神器"}, {"t": "Alt+= 一键求和", "how": "自动对上方或左侧连续数字求和，月末汇总最快"}, {"t": "F4 重复与锁定", "how": "重复上一步操作；在公式中按 F4 切换 $ 绝对引用"}, {"t": "Ctrl+Shift+L 筛选", "how": "一键开关自动筛选，不用再去点菜单"}, {"t": "Ctrl+方向键跳转", "how": "瞬间跳到数据区域边缘，万行表格秒穿越"}, {"t": "Ctrl+空格选整列", "how": "选中当前整列；Shift+空格选中整行"}, {"t": "Ctrl+` 公式透视", "how": "切换显示公式与计算结果，查错时一眼看穿"}]}, {"cat": "数据透视表技巧", "icon": "🔄", "items": [{"t": "一键创建数据透视表", "how": "选中数据区域任意单元格 → 插入 → 数据透视表 → 确定，3 秒生成汇总。记住：源数据第一行必须是标题行，且不能有合并单元格。"}, {"t": "拖字段三步出报表", "how": "行：销售员；列：月份；值：销售额。拖三个字段，一张交叉统计表就出来了，比写几十个 SUMIFS 快十倍。"}, {"t": "值字段设置", "how": "值区域默认是「求和」，点字段旁小箭头 → 值字段设置，可切换计数/平均值/最大值。同一字段拖两次可同时看求和与占比。"}, {"t": "日期自动分组", "how": "右键日期字段 → 组合 → 按月/季度/年分组，一键把 365 天的明细变成 12 个月汇总。"}, {"t": "切片器秒筛选", "how": "数据透视表分析 → 插入切片器 → 勾选「部门」。点一下按钮报表即时过滤，开会演示神器。"}, {"t": "值显示方式", "how": "右键值字段 → 值显示方式 → 占总和的百分比，直接算出每个销售员的业绩占比，不用再写公式。"}, {"t": "一键刷新", "how": "源数据增删行后，在透视表上右键 → 刷新即可更新。建议把源数据转为「表格」（Ctrl+T），新增行自动纳入。"}, {"t": "更改数据源", "how": "数据多了要换表？数据透视表分析 → 更改数据源，重新框选区域，之前搭好的版式原样保留。"}]}, {"cat": "Power Query技巧", "icon": "🔗", "items": [{"t": "从表格导入 PQ", "how": "选中数据 → 数据 → 自表格/区域，一键进入 Power Query 编辑器。从此告别重复的手工清洗。"}, {"t": "一键删除空行空列", "how": "在 PQ 里选中列 → 右键 → 删除空行；开始 → 删除列 → 删除空列。刷新后新数据自动同样处理。"}, {"t": "分列拆数据", "how": "选中列 → 拆分列 → 按分隔符（如 - 或空格），身份证拆生日、地址拆省市，一步到位。"}, {"t": "合并查询代替 VLOOKUP", "how": "开始 → 合并查询，把两表按关键列连接，比 VLOOKUP 快且不会列错位。"}, {"t": "逆透视整理报表", "how": "选中月份列 → 转换 → 逆透视列，把横表变纵表，透视表最爱这种干净数据。"}, {"t": "替换值批量清洗", "how": "选中列 → 右键 → 替换值，把「男/女」换成「先生/女士」，或把错别字批量修正。"}, {"t": "添加条件列", "how": "添加列 → 条件列，按销售额自动打标签：>=10万为A级，公式写一次、刷新终身受用。"}, {"t": "关闭并上载+刷新", "how": "做完点「关闭并上载」，结果回到 Excel。以后源数据更新，数据 → 全部刷新，一键重跑全流程。"}]}], "solve_cats": [{"cat": "公式问题", "icon": "🧮", "items": [{"t": "公式不计算", "body": "先看公式→计算选项是否为“手动”，改回“自动”；再看单元格是否为文本格式，是则改常规后双击回车。"}, {"t": "显示公式而非结果", "body": "单元格格式为“文本”，或误开了“显示公式”（Ctrl+` 切换）。改为常规格式后双击单元格回车即可。"}, {"t": "结果错误但无报错", "body": "检查引用区域是否因增删行漂移、括号是否配对、VLOOKUP 是否误用近似匹配（第四参数应为 0）。"}, {"t": "自动计算失效", "body": "大文件常被设为手动计算。按 F9 立即重算，或公式→计算选项改回自动。"}, {"t": "循环引用", "body": "公式直接或间接引用了自己。看状态栏提示定位单元格，改写逻辑打破循环。"}, {"t": "公式被锁定改不动", "body": "工作表被保护了。审阅→撤销工作表保护（需要密码），或联系表主。"}, {"t": "下拉填充公式不变", "body": "检查是否为手动计算；或填充的只是值。确认引用方式（相对/绝对）是否符合预期。"}]}, {"cat": "错误代码专区", "icon": "❌", "items": [{"t": "#N/A 查找不到", "body": "VLOOKUP/XLOOKUP 没找到匹配值。检查多余空格（TRIM）、数字与文本格式不一致；用 IFNA 包裹给友好提示。"}, {"t": "#VALUE! 类型错误", "body": "文本参与了数值运算。检查隐藏空格、特殊字符，用 VALUE 转换或清理后再算。"}, {"t": "#REF! 引用失效", "body": "引用的单元格/区域被删除。撤销删除，或把公式中的引用改为有效区域。"}, {"t": "#NAME? 名称错误", "body": "函数名拼错或用了中文括号。检查拼写，括号一律用英文半角。"}, {"t": "#DIV/0! 除数为零", "body": "除数为 0 或空单元格。用 =IF(除数=0,\"-\",分子/除数) 规避。"}, {"t": "#NUM! 数值超范围", "body": "结果太大或迭代不收敛。检查参数数量级，迭代公式调大迭代次数。"}, {"t": "#SPILL! 溢出被挡", "body": "动态数组目标区域有内容挡住。清空溢出区域，或把公式移到空旷处。"}, {"t": "#CALC! 计算异常", "body": "动态数组返回空或逻辑错误。检查筛选条件是否全不满足，调整条件。"}]}, {"cat": "文件问题", "icon": "📁", "items": [{"t": "文件打不开", "body": "打开 Excel→文件→打开→选中文件→点“打开”按钮下拉箭头→“打开并修复”。"}, {"t": "文件损坏", "body": "先用“打开并修复”→“修复”；不行选“提取数据”；还可改后缀为 zip 解压取 xl/worksheets 下 xml 抢救。"}, {"t": "文件恢复", "body": "文件→信息→管理工作簿→恢复未保存的工作簿。建议把自动恢复间隔设为 5 分钟。"}, {"t": "文件变成只读", "body": "右键文件→属性，取消只读勾选；或文件被他人占用，另存一份副本编辑。"}, {"t": "自动关闭/闪退", "body": "运行 excel /safe 进安全模式排查；逐个禁用 COM 加载项，找到肇事者。"}, {"t": "保存失败", "body": "磁盘满、路径过长或云同步冲突。另存到本地短路径，暂停网盘同步再试。"}, {"t": "内容/公式丢失", "body": "可能只保存了值。去自动恢复版本或文件历史版本里找回，别覆盖原文件。"}]}, {"cat": "性能问题", "icon": "🐢", "items": [{"t": "Excel卡顿", "body": "计算选项改手动；删除多余条件格式；避免整列引用 A:A，改精确区域。"}, {"t": "Excel无响应", "body": "大运算时耐心等；真死机用任务管理器结束进程，再用自动恢复版本找回。"}, {"t": "Excel崩溃", "body": "更新 Office 到最新；禁用可疑加载项；控制面板→修复 Office 安装。"}, {"t": "启动慢", "body": "清理 XLSTART 启动文件夹里的多余文件；文件→选项→加载项禁用不用的。"}, {"t": "文件打开慢", "body": "Ctrl+End 看已用区域是否虚大，删除空白行列的格式后保存，体积立减。"}, {"t": "文件保存慢", "body": "图片压缩一下；删掉大量图形对象；老 xls 另存为 xlsx。"}, {"t": "计算速度慢", "body": "少用易失函数 NOW/TODAY/INDIRECT；数组公式改精确区域；能透视表就别堆公式。"}]}, {"cat": "筛选排序问题", "icon": "🔀", "items": [{"t": "筛选不完整", "body": "数据中有空行空列把区域隔断。删除空行后重新开启筛选。"}, {"t": "部分数据无法筛选", "body": "筛选只覆盖了部分区域。选中整表（Ctrl+A）再开筛选。"}, {"t": "排序错乱串行", "body": "只选中单列排序导致错位。务必选“扩展选定区域”再排序。"}, {"t": "日期排序错误", "body": "日期是文本格式。数据→分列→日期 YMD 转正后再排序。"}, {"t": "数字排序错误", "body": "数字存成了文本。选中列→感叹号→转换为数字。"}, {"t": "合并单元格排不了", "body": "先取消合并，用 Ctrl+D 填充内容后再排序。"}]}, {"cat": "打印问题", "icon": "🖨️", "items": [{"t": "打印不全", "body": "页面布局→缩放→调整为 1 页宽；检查打印区域是否框小了。"}, {"t": "打印出空白页", "body": "分页预览里拖蓝线收掉多余分页；删除打印区域外的残留格式。"}, {"t": "打印内容偏移", "body": "页面设置→页边距→勾选水平居中；检查纸张大小是否匹配。"}, {"t": "页码错误", "body": "页眉页脚→自定义页脚插入 &[页码]；检查起始页码设置。"}, {"t": "打印缩放异常", "body": "缩放设为“调整为 1 页”；宽表用横向打印。"}, {"t": "表格线印不出", "body": "页面设置→工作表→勾选“网格线”；或给区域加边框。"}]}, {"cat": "数据导入问题", "icon": "📥", "items": [{"t": "CSV乱码", "body": "别双击打开。用数据→从文本/CSV 导入，文件原始格式选 65001:UTF-8 或 936。"}, {"t": "中文乱码", "body": "导入时选对编码；已乱码的用 Power Query 重新指定编码导入一次。"}, {"t": "日期错乱", "body": "导入向导第三步把该列设为“日期 YMD”；事后也可用分列转换。"}, {"t": "数字变文本", "body": "数据→分列→完成；或 =A1*1 批量转数值。"}, {"t": "列错位", "body": "分隔符选错了。导入时勾选正确的逗号/制表符分隔，预览对齐再加载。"}, {"t": "前导零丢失", "body": "导入前把该列设为文本；或公式 =\"'\"&编号 保留 001 开头。"}]}, {"cat": "图表问题", "icon": "📊", "items": [{"t": "图表不更新", "body": "数据源是固定区域。转成智能表格（Ctrl+T）或用 OFFSET 动态名称，新增自动进图。"}, {"t": "图表数据丢失", "body": "隐藏行列被排除。右键图表→选择数据→勾选“显示隐藏行列中的数据”。"}, {"t": "坐标轴错误", "body": "右键坐标轴→设置坐标轴格式，检查最小值/最大值、单位和对数刻度。"}, {"t": "图表显示异常", "body": "图表被拉伸变形，重置大小；兼容模式文件另存为 xlsx 再试。"}, {"t": "图例错乱", "body": "右键→选择数据，重新指定系列名称和水平分类标签。"}, {"t": "新增数据不进图表", "body": "数据源转智能表格后图表自动扩展；或手动更改数据区域。"}]}, {"cat": "数据透视表问题", "icon": "🔄", "items": [{"t": "无法刷新", "body": "右键→刷新；若源区域变了，去数据透视表分析→更改数据源重框选。"}, {"t": "数据源错误", "body": "源表有空行空列或列名重复。清理后重新指定数据源。"}, {"t": "分组失败", "body": "同一字段混有文本和日期/数字。先统一格式再分组。"}, {"t": "字段消失", "body": "字段列表里重新勾选；检查源表列名是否被改名。"}, {"t": "统计错误", "body": "值字段设置→改求和/计数/平均；文本字段默认计数是正常的。"}, {"t": "日期不自动分组", "body": "365 才支持自动分组；旧版用右键→分组，或加年月辅助列。"}]}, {"cat": "Power Query问题", "icon": "🔗", "items": [{"t": "无法刷新", "body": "查询→刷新全部；源文件路径移动了就重新定位源。"}, {"t": "导入失败", "body": "源文件被占用或格式不支持。关闭占用后重试，或换格式。"}, {"t": "合并失败", "body": "连接键两边类型不一致。先把两边键统一为文本再合并。"}, {"t": "类型错误", "body": "删除“更改的类型”步骤重设；或手动改回正确类型。"}, {"t": "数据丢失", "body": "逐步点击应用步骤回看，检查筛选/删除步骤是否误删。"}, {"t": "刷新很慢", "body": "先筛选缩小数据量再做复杂转换；减少破坏折叠的步骤。"}]}], "templates": [{"cat": "办公", "name": "会议纪要模板", "file": "办公-会议纪要模板.xlsx", "desc": "记录会议决议与跟进"}, {"cat": "办公", "name": "工作计划模板", "file": "办公-工作计划模板.xlsx", "desc": "甘特式任务跟踪"}, {"cat": "办公", "name": "用印申请模板", "file": "办公-用印申请模板.xlsx", "desc": "印章使用审批"}, {"cat": "财务", "name": "费用报销模板", "file": "财务-费用报销模板.xlsx", "desc": "带自动合计的报销单"}, {"cat": "财务", "name": "工资条模板", "file": "财务-工资表模板.xlsx", "desc": "自动计算应发工资"}, {"cat": "财务", "name": "应收账款模板", "file": "财务-应收账款模板.xlsx", "desc": "自动算未收与逾期"}, {"cat": "人事", "name": "员工花名册模板", "file": "人事-员工花名  "2016", "2019", "2021", "365"], "note": ""}, "related": ["PMT", "FV", "PV"], "status": "verified"}, {"id": "NPER", "name_en": "NPER", "name_cn": "期数", "category": "fin", "category_cn": "财务函数", "syntax": "NPER(利率, 每期付款, 现值, [终值], [类型])", "desc_cn": "期数", "params": [{"name": "利率", "optional": false, "desc": ""}, {"name": "每期付款", "optional": false, "desc": ""}, {"name": "现值", "optional": false, "desc": ""}, {"name": "终值", "optional": false, "desc": ""}, {"name": "类型", "optional": false, "desc": ""}], "params_raw": ["利率（必需）", "每期付款（必需）", "现值（必需）", "终值（必需）", "类型（必需）"], "examples": [{"formula": "=NPER(4.5%/12, -5000, 500000)/12", "result": "约 10.5 年", "note": ""}], "returns": "", "applications": [{"title": "通用示例", "desc": "", "formula": "=NPER(4.5%/12, -5000, 500000)/12   → 约 10.5 年"}], "pitfalls": ["每期还款额若小于每期利息（还不起本金），返回 `#NUM!`，这是合理的——永远还不清"], "versions": {"introduced": "全版本", "compatible": ["2003", "2007", "2010", "2013", "2016", "2019", "2021", "365"], "note": ""}, "related": ["PMT", "FV", "PV"], "status": "verified"}, {"id": "SLN", "name_en": "SLN", "name_cn": "直线折旧", "category": "fin", "category_cn": "财务函数", "syntax": "SLN(原值, 残值, 使用年限)", "desc_cn": "直线折旧法", "params": [{"name": "原值", "optional": false, "desc": ""}, {"name": "残值", "optional": false, "desc": ""}, {"name": "使用年限", "optional": false, "desc": ""}], "params_raw": ["原值（必需）", "残值（必需）", "使用年限（必需）"], "examples": [{"formula": "=SLN(100000, 10000, 5)", "result": "18000", "note": ""}], "returns": "", "applications": [{"title": "通用示例", "desc": "", "formula": "=SLN(100000, 10000, 5)   → 18000"}], "pitfalls": ["残值不能大于原值；年限为 0 返回 `#DIV/0!`"], "versions": {"introduced": "全版本", "compatible": ["2003", "2007", "2010", "2013", "2016", "2019", "2021", "365"], "note": ""}, "related": ["PMT", "FV", "PV"], "status": "verified"}, {"id": "DB", "name_en": "DB", "name_cn": "余额递减折旧", "category": "fin", "category_cn": "财务函数", "syntax": "DB(原值, 残值, 使用年限, 第几年, [首年月份数])", "desc_cn": "余额递减折旧法", "params": [{"name": "原值", "optional": false, "desc": ""}, {"name": "残值", "optional": false, "desc": ""}, {"name": "使用年限", "optional": false, "desc": ""}, {"name": "第几年", "optional": false, "desc": ""}, {"name": "首年月份数", "optional": false, "desc": ""}], "params_raw": ["原值（必需）", "残值（必需）", "使用年限（必需）", "第几年（必需）", "首年月份数（必需）"], "examples": [{"formula": "=DB(100000, 10000, 5, 1)", "result": "36900（比直线法的 18000 多）", "note": ""}, {"formula": "=DB(100000, 10000, 5, 3)", "result": "14,691.85", "note": ""}], "returns": "", "applications": [{"title": "通用示例", "desc": "", "formula": "=DB(100000, 10000, 5, 1)   → 36900（比直线法的 18000 多）"}], "pitfalls": ["第几年不能超过使用年限，否则 `#NUM!`", "首年月份数省略默认 12；不满一年购入的设备要填实际月份数", "与 SLN 对比：DB 前期折旧快，适合技术更新快的设备"], "versions": {"introduced": "全版本", "compatible": ["2003", "2007", "2010", "2013", "2016", "2019", "2021", "365"], "note": ""}, "related": ["PMT", "FV", "PV"], "status": "verified"}], "func_unique_count": 100, "tutorials": [{"id": "interface", "group": "basics", "column": "C01", "level2": "C01-L2-1", "title": "认识 Excel 界面", "level": "入门", "body": "标题栏→功能区（选项卡+命令组）→编辑栏（显示/输入公式）→工作表区（行列交叉为单元格，如 B3）→工作表标签（底部切换/新增）→状态栏（快速看求和/平均）。记住：名称框可直接输入 B100 跳转，编辑栏是公式的家。", "steps": ["打开 Excel，观察功能区：文件/开始/插入/页面布局/公式/数据/审阅/视图", "点击名称框输入 D20，回车直接跳转", "在编辑栏输入 =1+2，回车看结果"], "sections": [], "source": "docs/basics（站内数据 basics）", "updated": "2026-11-09"}, {"id": "enter", "group": "basics", "column": "C01", "level2": "C01-L2-1", "title": "数据录入技巧", "level": "入门", "body": "Enter 下移、Tab 右移、Shift+Enter 上移。选中区域后按 Enter 在区域内循环。Ctrl+Enter 批量填充选中区域。Alt+↓ 调出下拉历史。Ctrl+; 输入今天日期，Ctrl+Shift+; 输入当前时间。", "steps": ["选中 A1:A10，输入内容后按 Ctrl+Enter 批量填充", "按 Ctrl+; 快速输入今天日期", "用 Alt+↓ 在已有列表中快速选择"], "sections": [], "source": "docs/basics（站内数据 basics）", "updated": "2026-11-09"}, {"id": "format", "group": "basics", "column": "C01", "level2": "C01-L2-1", "title": "单元格格式", "level": "入门", "body": "数字格式决定显示方式：常规/数值/货币/百分比/日期。Ctrl+1 打开设置单元格格式对话框。对齐、字体、边框、填充都在「开始」选项卡。格式刷（双击可多次使用）是排版神器。", "steps": ["选中金额列，按 Ctrl+Shift+4 设为货币格式", "选中日期列，Ctrl+1 设为日期格式", "双击格式刷，把标题格式刷到多个地方"], "sections": [], "source": "docs/basics（站内数据 basics）", "updated": "2026-11-09"}, {"id": "sortfilter", "group": "basics", "column": "C01", "level2": "C01-L2-1", "title": "排序与筛选", "level": "入门", "body": "筛选（Ctrl+Shift+L）：按条件只显示想要的行，箭头图标点开设条件。排序：按某列升序/降序，多关键字排序用「自定义排序」。注意：排序前先选中整个数据区域，否则会错乱！", "steps": ["选中表头，按 Ctrl+Shift+L 开启筛选", "点箭头，只勾选「销售部」", "按销售额列降序排列"], "sections": [], "source": "docs/basics（站内数据 basics）", "updated": "2026-11-09"}, {"id": "print", "group": "basics", "column": "C01", "level2": "C01-L2-1", "title": "打印设置", "level": "入门", "body": "页面布局→打印标题（顶端标题行每页重复）→设置打印区域→分页预览拖蓝线。页眉页脚加页码。打印前一定用「打印预览」检查。", "steps": ["页面布局→打印标题，设置顶端标题行", "选中区域→页面布局→打印区域→设置", "视图→分页预览，拖动蓝线调整"], "sections": [], "source": "docs/basics（站内数据 basics）", "updated": "2026-11-09"}, {"id": "pivottable", "group": "advanced", "column": "C08", "level2": "C08-L2-1", "title": "数据透视表", "level": "进阶", "body": "", "steps": [], "sections": [{"title": "1. 为什么用数据透视表", "body": "想象你有一张 5000 行的销售明细：日期、销售员、产品、金额。老板问：\"每个销售员每个月的销售额是多少？\"\n- 不用透视表：写一堆 SUMIFS，还要手动列出所有销售员和月份，容易漏。\n- 用透视表：**拖三下鼠标，3 秒出结果**。源数据增删行后点一下\"刷新\"即可更新。\n核心思想：**把\"分组+聚合\"这个动作交给 Excel**，你只负责告诉它\"按什么分组、对什么求和\"。"}, {"title": "2. 创建步骤", "body": "1. 点击源数据区域任意单元格（确保数据是规范的二维表：第一行是标题行，无合并单元格、无空行空列）。\n2. 「插入」→「数据透视表」。\n3. 选择放置位置：建议选\"新工作表\"，报表和源数据分开更清爽。\n4. 右侧出现「数据透视表字段」窗格，开始拖字段。\n> 数据规范是透视表好用的前提：一列只放一种含义的数据，日期列全是日期，不要出现\"合计\"行混在明细里。"}, {"title": "3. 四个区域详解", "body": "操作要点：\n- 同一字段可以拖到多个区域（如\"日期\"同时拖到行和筛选器）。\n- 拖错了直接把字段拖出窗格即可移除。\n- 字段顺序决定层级：行区域里\"年份\"在上、\"月份\"在下，就是先按年再按月展开。"}, {"title": "4. 值汇总方式", "body": "默认对数字字段\"求和\"，对文本字段\"计数\"。右键值字段 →「值字段设置」可切换：\n**显示方式**（同一对话框的「值显示方式」选项卡，更实用）：\n- **占总和的百分比**：每个销售员占总销售额的比例。\n- **父行汇总的百分比**：某产品占其所属类别的比例。\n- **差异**：本月 vs 上月的差额（需配合日期分组）。\n- **差异百分比**：环比增长率——做月报的神器。"}, {"title": "5. 分组", "body": "### 日期分组\n右键行区域的日期字段 →「组合」：\n- 按月：选\"月\"，自动按年月分组。\n- 按季度+年：同时勾选\"季度\"和\"年\"。\n- 按周：选\"日\"，天数填 7。\n### 数字分组\n右键数字字段 →「组合」：如把年龄按 10 岁一段分组（起始 20，终止 60，步长 10），快速做年龄段分布。"}, {"title": "6. 切片器与时间线", "body": "- **切片器**：「数据透视表分析」→「插入切片器」→ 勾选字段（如\"产品类别\"）。生成一排可点击的按钮，点选即筛选，比下拉框直观，适合做仪表盘。\n- **时间线**：专门用于日期字段，拖动滑块筛选时间段。\n- 一个切片器可以同时控制**多个**透视表：右键切片器 →「报表连接」，勾选其他透视表——做联动仪表盘的核心技巧。"}], "source": "docs/advanced/pivottable.md", "updated": "2026-11-09", "file": "数据-透视表练习数据.xlsx"}, {"id": "array-formulas", "group": "advanced", "column": "C03", "level2": "C03-L2-4", "title": "数组公式", "level": "进阶", "body": "", "steps": [], "sections": [{"title": "1. 先理解\"数组\"是什么", "body": "数组就是\"一串值\"。`{1,2,3}` 是横向数组，`{1;2;3}` 是纵向数组（分号换行）。Excel 公式本来就是按数组思维设计的：\n[代码示例]\n这行公式的含义是\"把 A1、A2、A3 每个都乘以 2\"，得到 `{A1*2, A2*2, A3*2}`。普通公式只显示第一个结果，数组公式则能把全部结果\"摊开\"显示。"}, {"title": "2. 传统数组公式（Ctrl+Shift+Enter）", "body": "在旧版本 Excel 里，想让公式返回多个结果：\n1. 先选中**多个**单元格（结果要占几格就选几格）。\n2. 输入公式，如 `=A1:A3*2`。\n3. 按 **Ctrl+Shift+Enter**（不是只按 Enter）。\n公式两端会自动加上花括号 `{=A1:A3*2}`，表示这是数组公式。**花括号是 Excel 自己加的，手工输入无效。**\n经典用途——多条件计数（COUNTIFS 出现之前的写法，现在仍有人用）：\n[代码示例]\n原理：`(A2:A100=\"销售部\")` 得到一串 TRUE/FALSE，`(B2:B100>5000)` 得到另一串，两串相乘（TRUE=1、FALSE=0），只有两个条件都成立的位置是 1，SUM 加总即为同时满足的人数。"}, {"title": "3. 动态数组：新时代的写法", "body": "Microsoft 365 引入动态数组后，**只按 Enter**，结果自动\"溢出\"到相邻单元格。不再需要三键，也不再需要预选区域。\n### FILTER：按条件筛选\n[代码示例]\n返回 B 列等于\"销售部\"的所有行（A:C 三列）。做\"部门人员清单\"一公式搞定，源数据增减行自动更新。\n加\"无结果\"提示：\n[代码示例]\n### SORT：排序\n[代码示例]"}, {"title": "4. #溢出! 错误处理", "body": "当动态数组的结果没地方\"摊开\"时，报 `#溢出!`。常见原因和解法：\n`#` 引用是动态数组时代的重要符号：公式结果变长变短，`A2#` 自动跟着变，SUM 永远求和的是最新结果。"}, {"title": "5. 实战案例", "body": "### 案例 1：多条件求和（替代 SUMIFS 的数组思路）\n统计\"销售部\"且\"金额>5000\"的总额：\n[代码示例]\n普通 Enter 即可（365 会自动按数组算）。\n### 案例 2：动态部门筛选器\n[代码示例]\nF1 做下拉选部门，右侧自动列出该部门所有人——简易查询系统。\n### 案例 3：自动去重+计数"}, {"title": "6. 新旧对照速查", "body": ""}], "source": "docs/advanced/array-formulas.md", "updated": "2026-11-09", "file": "数据-函数练习题.xlsx"}, {"id": "powerquery", "group": "advanced", "column": "C09", "level2": "C09-L2-1", "title": "Power Query", "level": "进阶", "body": "", "steps": [], "sections": [{"title": "1. Power Query 是什么", "body": "它是 Excel 里的一个**数据加工流水线**：你把\"获取→清洗→整理\"的每一步操作点一遍，Power Query 会把步骤记下来。下个月拿到新的源文件，点一下\"刷新\"，所有步骤自动重跑一遍。\n和公式的区别：\n- 公式是\"算出一个结果\"，Power Query 是\"产出一张干净的表\"。\n- 公式适合行内计算；Power Query 适合**结构性整理**：拆分列、转置、合并文件、逆透视——这些用公式写会很痛苦。\n核心观念：**你点的每一步都会变成一行 M 代码**，记录在右侧「应用的步骤」里。可以回头修改、删除、调整顺序。"}, {"title": "2. 获取数据", "body": "「数据」→「获取数据」，来源非常多：\n选中来源后点「转换数据」进入 Power Query 编辑器，开始清洗。"}, {"title": "3. 常用清洗步骤", "body": "### 拆分列\n一列里混着\"省-市-区\"？选中列 →「拆分列」→「按分隔符」→ 输入 `-`。一列变三列。也可以按固定宽度、按大小写转换处拆分。\n### 替换值\n选中列 → 右键 →「替换值」：把\"男/女\"换成\"M/F\"，把\"N/A\"换成空。支持整列批量。\n### 填充\n导出的报表经常只有第一行有\"部门\"名，下面是空的（合并单元格拆开后的样子）。选中列 →「转换」→「填充」→「向下」。空单元格自动填上上方的值，透视表分组的前提。\n### 更改类型\n每列顶上有个类型图标（ABC/123/日历）。点它把文本改成数字、日期。**类型不对会导致求和变计数、日期无法分组**，清洗时务必检查。"}, {"title": "4. 合并查询：比 VLOOKUP 更强的关联", "body": "场景：A 表是订单（有\"客户编号\"），B 表是客户档案（\"客户编号\"→\"客户名称\"），想给订单带上客户名称。\n1. 在编辑器里选中订单查询 →「合并查询」。\n2. 上表选\"客户编号\"，下表选\"客户档案\"的\"客户编号\"（点列表头选中，两边都要点）。\n3. 联接种类选\"左外部\"（保留订单全部行，档案对不上的留空——对应 VLOOKUP 的精确匹配）。\n4. 确定后多出一列，点列头的展开按钮，勾选\"客户名称\"。\n比 VLOOKUP 强的点：\n- **可按多列关联**：Ctrl+点选多个列头，一次按\"省+市\"两列匹配，VLOOKUP 要拼辅助列。\n- **模糊匹配**：联接时勾选\"模糊匹配\"，自动处理\"北京\"vs\"北京市\"这种差异，还能设相似度阈值。"}, {"title": "5. 追加查询：纵向堆叠", "body": "场景：12 个月的销售表结构相同，要拼成一张全年表。\n「追加查询」→ 选\"三个或更多表\" → 把 12 个表都加进来。列名相同的自动对齐，某表多出的列会以空值补齐。\n**从文件夹追加**（更常用）：「获取数据」→「从文件夹」→ 选存放 12 个文件的文件夹 →「合并和转换」。以后每月往文件夹里丢新文件，刷新一次全进来——月报自动化。"}, {"title": "6. 透视列与逆透视列", "body": "### 逆透视（Unpivot）：把交叉表\"拆长\"\n源数据是\"姓名×12个月\"的矩阵（1 月、2 月…各一列），透视表吃不了这种格式。\n选中 12 个月份列 → 右键 →「逆透视列」。变成三列：姓名、月份、销售额。**这是 Power Query 最经典的用途之一。**\n### 透视列（Pivot）：反向操作\n把\"月份、销售额\"两列转回交叉表：选中\"月份\"列 →「透视列」→ 值列选\"销售额\"、聚合选\"求和\"。"}], "source": "docs/advanced/powerquery.md", "updated": "2026-11-09", "file": "数据-销售数据1000行.xlsx"}, {"id": "conditional-formatting", "group": "advanced", "column": "C06", "level2": "C06-L2-1", "title": "条件格式", "level": "进阶", "body": "", "steps": [], "sections": [{"title": "1. 核心原理", "body": "条件格式 = **\"规则\" + \"格式\"**。规则判断每个单元格\"达不达标\"，达标就套用你设的格式（红底、加粗等）。\n关键理解：**格式是\"活\"的**。单元格的值变了，格式自动跟着变——和你手工涂色有本质区别。删掉规则（「开始」→「条件格式」→「清除规则」）就恢复原样，不破坏数据。\n操作入口：「开始」→「条件格式」。先**选中要应用的区域**再设规则，这点最重要。"}, {"title": "2. 内置规则：突出显示单元格规则", "body": "最常用的一类：「条件格式」→「突出显示单元格规则」：\n每个规则点开后选格式（浅红填充深红文本等），也可以点「自定义格式」自己配。"}, {"title": "3. 数据条：在单元格里画\"进度条\"", "body": "「条件格式」→「数据条」→ 选一种颜色。数值越大，条越长。\n- 适合：完成率、销售额对比——一眼看出谁高谁低，不用看数字。\n- 技巧：勾选「仅显示数据条」（管理规则→编辑规则），隐藏数字，只留条形，更像仪表盘。\n- 注意：数据条的长度是按**选中区域内的最大/最小值**自动缩放的，区域不同不能直接比长短。"}, {"title": "4. 色阶：热力图", "body": "「条件格式」→「色阶」→ 如\"绿-黄-红\"。数值映射到颜色渐变，**适合看分布**：\n- 12 个月的销售热力图，旺季月份自动变红。\n- 学生成绩表，一眼看出哪科普遍偏低。\n双色刻度和三色刻度：三色多一个中间色，适合\"中间值也想区分\"的场景。"}, {"title": "5. 图标集：红绿灯", "body": "「条件格式」→「图标集」→ 如\"三色旗/红绿灯\"。数值分三档，分别显示 ●●●。\n默认按百分比划分（67%/33%），想按绝对值：管理规则 → 编辑规则 → 类型改成\"数字\"，填阈值。如：完成率 ≥100% 绿灯、≥80% 黄灯、<80% 红灯。"}, {"title": "6. 重点：自定义公式规则", "body": "内置规则不够用时，用公式。入口：「条件格式」→「新建规则」→「使用公式确定要设置格式的单元格」。\n**核心心法**：公式是**相对选中区域左上角**写的。选中 A2:D100 后写公式，公式里的 A2 指\"当前正在判断的行的 A 列\"。Excel 会把公式逐行（逐格）套用一遍。\n### 示例 1：整行标红（金额>10000 的行整行变红）\n选中 A2:D100，公式：\n[代码示例]\n`$C` 锁定列（每行都看 C 列），`2` 不锁定行（随行变化）。这就是整行格式化的标准写法：**列锁定、行不锁定**。\n### 示例 2：标出重复值（内置规则只能标单元格，公式可标整行）\n[代码示例]"}], "source": "docs/advanced/conditional-formatting.md", "updated": "2026-11-09"}, {"id": "data-validation", "group": "advanced", "column": "C05", "level2": "C05-L2-4", "title": "数据验证", "level": "进阶", "body": "", "steps": [], "sections": [{"title": "1. 数据验证是什么", "body": "「数据」→「数据验证」。它在**输入的那一刻**拦截不合法的值，而不是事后检查。\n三个可配置项：\n1. **设置**：允许输入什么（整数/小数/日期/序列/文本长度…）。\n2. **输入信息**：选中单元格时弹出的提示（\"请输入 1-100 的整数\"）——主动引导。\n3. **出错警告**：输错时的弹窗，样式可选\"停止\"（硬拦截）/\"警告\"（可继续）/\"信息\"（仅提醒）。"}, {"title": "2. 下拉列表（最常用）", "body": "### 固定选项\n选中单元格 → 数据验证 → 允许「序列」→ 来源填 `男,女`（中文逗号不行，必须用**英文逗号**分隔）。单元格右侧出现下拉箭头。\n### 引用区域\n来源填 `=$F$2:$F$10`（部门清单）。清单变了下拉自动变。建议把清单放在单独的\"基础数据\"表，隐藏起来。\n### 动态二级联动：选\"省\"后\"市\"跟着变\n这是数据验证的经典难题，标准解法是 **INDIRECT + 命名区域**：\n1. 准备对照表：A 列是省名（广东、江苏…），B 列开始每列是一个省的城市，第一行是省名。\n2. 给每个省的城市区域**定义名称**：选中广东的城市 → 名称框输入 `广东` → 回车。注意名称不能含空格，省名有空格先替换。"}, {"title": "3. 输入限制", "body": "自定义公式的心法和条件格式一样：**相对左上角写**。选中 B2:B100 后公式写 `=LEN(B2)=11`，表示\"本单元格长度必须 11\"。"}, {"title": "4. 圈释无效数据", "body": "数据验证只拦**新输入**，历史脏数据怎么办？「数据」→「数据验证」→「圈释无效数据」。所有违反规则的旧数据会被红圈圈出来，改完后「清除无效数据标识」去掉圈。\n用途：接手别人的表，先圈一遍，脏数据一目了然。"}, {"title": "5. 工作表保护：锁公式、开放录入区", "body": "场景：模板发给 20 个人填，只允许填黄色区域，公式列不许碰。\n1. **先解锁录入区**：选中允许填写的单元格 → 右键「设置单元格格式」→「保护」→ **取消勾选\"锁定\"**。默认所有单元格都是\"锁定\"状态，但不保护时锁无效。\n2. 「审阅」→「保护工作表」→ 设密码 → 勾选允许的操作（一般保留\"选定未锁定的单元格\"）。\n3. 效果： locked 的公式格点不进去，未锁定的可填。有人想改公式？弹密码框。\n取消：审阅 → 撤销工作表保护 → 输密码。"}, {"title": "6. 允许编辑区域：多人分工", "body": "保护工作表是一刀切，\"允许编辑区域\"可以**按区域设不同密码**：\n「审阅」→「允许编辑区域」→「新建」：\n- 区域 A1:B10，密码 111 → 销售部用密码 111 可改\n- 区域 C1:D10，密码 222 → 财务部用密码 222 可改\n每人只能改自己的区，保护工作表后依然有效。适合部门分工录入同一张表。"}], "source": "docs/advanced/data-validation.md", "updated": "2026-11-09", "file": "数据-人事考勤样本.xlsx"}, {"id": "pivot_adv-0", "group": "pivot_adv", "column": "C08", "level2": "C08-L2-2", "title": "基础操作", "level": "进阶", "body": "选中数据→插入→数据透视表。四个区：行、列、值、筛选。值字段默认求和，右键可改计数/平均/最大值。", "steps": [], "sections": [], "source": "站内数据 pivot_adv", "updated": "2026-11-09"}, {"id": "pivot_adv-1", "group": "pivot_adv", "column": "C08", "level2": "C08-L2-2", "title": "分组统计", "level": "进阶", "body": "日期右键→组合：按年/季度/月分组。数字右键→组合：按区间分组（如成绩段 60-70/70-80）。", "steps": [], "sections": [], "source": "站内数据 pivot_adv", "updated": "2026-11-09"}, {"id": "pivot_adv-2", "group": "pivot_adv", "column": "C08", "level2": "C08-L2-2", "title": "多维分析", "level": "进阶", "body": "行放「区域」、列放「季度」、值放「销售额」，一眼看交叉汇总。值显示方式→差异/百分比，做同比环比。", "steps": [], "sections": [], "source": "站内数据 pivot_adv", "updated": "2026-11-09"}, {"id": "pivot_adv-3", "group": "pivot_adv", "column": "C08", "level2": "C08-L2-2", "title": "切片器", "level": "进阶", "body": "插入切片器→选字段，点按钮即筛选，多表联动（报表连接）。比筛选直观 10 倍，汇报必备。", "steps": [], "sections": [], "source": "站内数据 pivot_adv", "updated": "2026-11-09"}, {"id": "pivot_adv-4", "group": "pivot_adv", "column": "C08", "level2": "C08-L2-2", "title": "时间轴", "level": "进阶", "body": "日期字段专用筛选器，按年/季度/月/日切换，比切片器更适合时间。", "steps": [], "sections": [], "source": "站内数据 pivot_adv", "updated": "2026-11-09"}, {"id": "pivot_adv-5", "group": "pivot_adv", "column": "C08", "level2": "C08-L2-2", "title": "数据模型", "level": "进阶", "body": "多表关联：把订单表+产品表都添加到数据模型，用字段关联，一张透视表跨表分析。Power Pivot 的地基。", "steps": [], "sections": [], "source": "站内数据 pivot_adv", "updated": "2026-11-09"}, {"id": "pq_adv-0", "group": "pq_adv", "column": "C09", "level2": "C09-L2-3", "title": "导入 CSV", "level": "进阶", "body": "数据→获取数据→从文本/CSV。乱码？改编码为 65001（UTF-8）或 936（GBK）。", "steps": [], "sections": [], "source": "站内数据 pq_adv", "updated": "2026-11-09"}, {"id": "pq_adv-1", "group": "pq_adv", "column": "C09", "level2": "C09-L2-3", "title": "导入网页", "level": "进阶", "body": "数据→自网站→粘贴 URL。网页表格结构变化时需重新检查步骤。", "steps": [], "sections": [], "source": "站内数据 pq_adv", "updated": "2026-11-09"}, {"id": "pq_adv-2", "group": "pq_adv", "column": "C09", "level2": "C09-L2-3", "title": "数据清洗", "level": "进阶", "body": "删空行、替换值、填充、修剪、分列、更改类型。每一步都记录在右侧「应用的步骤」，可回退。", "steps": [], "sections": [], "source": "站内数据 pq_adv", "updated": "2026-11-09"}, {"id": "pq_adv-3", "group": "pq_adv", "column": "C09", "level2": "C09-L2-3", "title": "合并表", "level": "进阶", "body": "追加查询=上下堆叠（多月数据合并）；合并查询=左右连接（VLOOKUP 的批量版）。", "steps": [], "sections": [], "source": "站内数据 pq_adv", "updated": "2026-11-09"}, {"id": "pq_adv-4", "group": "pq_adv", "column": "C09", "level2": "C09-L2-3", "title": "拆分列", "level": "进阶", "body": "按分隔符/字符数拆分。\"2026-10-01\" 按 \"-\" 拆成年/月/日三列。", "steps": [], "sections": [], "source": "站内数据 pq_adv", "updated": "2026-11-09"}, {"id": "pq_adv-5", "group": "pq_adv", "column": "C09", "level2": "C09-L2-3", "title": "自动刷新", "level": "进阶", "body": "关闭并上载后，源文件更新→右键刷新。还可设置打开文件自动刷新：数据→查询属性。", "steps": [], "sections": [], "source": "站内数据 pq_adv", "updated": "2026-11-09"}, {"id": "ppivot-0", "group": "ppivot", "column": "C10", "level2": "C10-L2-1", "title": "数据模型", "level": "专家", "body": "Power Pivot→添加到数据模型。多表不用 VLOOKUP，用关系关联，百万行不卡。", "steps": [], "sections": [], "source": "站内数据 ppivot", "updated": "2026-11-09"}, {"id": "ppivot-1", "group": "ppivot", "column": "C10", "level2": "C10-L2-1", "title": "多表关联", "level": "专家", "body": "关系视图拖线连主外键。一对多：产品表（1）→订单表（多）。", "steps": [], "sections": [], "source": "站内数据 ppivot", "updated": "2026-11-09"}, {"id": "ppivot-2", "group": "ppivot", "column": "C10", "level2": "C10-L2-1", "title": "DAX 公式入门", "level": "专家", "body": "DAX 长得像 Excel 函数但思维是列式。SUM(表[列])、CALCULATE(表达式, 筛选)、RELATED(取关联表字段)。", "steps": [], "sections": [], "source": "站内数据 ppivot", "updated": "2026-11-09"}, {"id": "ppivot-3", "group": "ppivot", "column": "C10", "level2": "C10-L2-1", "title": "常用 DAX", "level": "专家", "body": "总销售额 =SUM(订单[金额])\n当年累计 =CALCULATE([总销售额], DATESYTD(日期表[日期]))\n同比 =DIVIDE([总销售额]-[去年同期], [去年同期])", "steps": [], "sections": [], "source": "站内数据 ppivot", "updated": "2026-11-09"}, {"id": "ppivot-4", "group": "ppivot", "column": "C10", "level2": "C10-L2-1", "title": "KPI 指标", "level": "专家", "body": "在数据模型中建度量值：销售额、利润率、完成率。度量值随切片器自动重算，一处定义处处用。", "steps": [], "sections": [], "source": "站内数据 ppivot", "updated": "2026-11-09"}, {"id": "cfmt-0", "group": "cfmt", "column": "C06", "level2": "C06-L2-1", "title": "颜色标记", "level": "进阶", "body": "开始→条件格式→突出显示单元格规则：大于/小于/介于/等于，自动上色。", "steps": [], "sections": [], "source": "站内数据 cfmt", "updated": "2026-11-09"}, {"id": "cfmt-1", "group": "cfmt", "column": "C06", "level2": "C06-L2-1", "title": "数据条", "level": "进阶", "body": "在单元格内画横向条形图，数值大小一目了然。适合业绩对比。", "steps": [], "sections": [], "source": "站内数据 cfmt", "updated": "2026-11-09"}, {"id": "cfmt-2", "group": "cfmt", "column": "C06", "level2": "C06-L2-1", "title": "图标集", "level": "进阶", "body": "红绿灯/箭头/旗帜，按阈值自动打标。管理驾驶舱常用。", "steps": [], "sections": [], "source": "站内数据 cfmt", "updated": "2026-11-09"}, {"id": "cfmt-3", "group": "cfmt", "column": "C06", "level2": "C06-L2-1", "title": "自定义公式", "level": "进阶", "body": "新建规则→使用公式。注意 $ 锁定：=$B2>100 整行变色（选中整行时列锁定行不锁定）。", "steps": [], "sections": [], "source": "站内数据 cfmt", "updated": "2026-11-09"}, {"id": "cfmt-4", "group": "cfmt", "column": "C06", "level2": "C06-L2-1", "title": "案例：自动标红逾期", "level": "进阶", "body": "=AND($E2<TODAY(),$G2<>\"已完成\") → 逾期未完成的整行变红。", "steps": [], "sections": [], "source": "站内数据 cfmt", "updated": "2026-11-09"}, {"id": "cfmt-5", "group": "cfmt", "column": "C06", "level2": "C06-L2-1", "title": "案例：高亮重复", "level": "进阶", "body": "选中区域→条件格式→突出显示→重复值。或公式 =COUNTIF($A:$A,$A2)>1 自定义颜色。", "steps": [], "sections": [], "source": "站内数据 cfmt", "updated": "2026-11-09"}, {"id": "dval-0", "group": "dval", "column": "C05", "level2": "C05-L2-4", "title": "下拉菜单", "level": "入门", "body": "数据→数据验证→序列，来源输入：男,女（英文逗号）。或引用一列区域。", "steps": [], "sections": [], "source": "站内数据 dval", "updated": "2026-11-09"}, {"id": "dval-1", "group": "dval", "column": "C05", "level2": "C05-L2-4", "title": "联动下拉框", "level": "入门", "body": "一级菜单选「省份」→二级自动出该省城市。做法：定义名称+INDIRECT($A2)。先做各省名单，再建一级下拉，二级来源 =INDIRECT(A2)。", "steps": [], "sections": [], "source": "站内数据 dval", "updated": "2026-11-09"}, {"id": "dval-2", "group": "dval", "column": "C05", "level2": "C05-L2-4", "title": "日期限制", "level": "入门", "body": "数据验证→日期→介于 2026-1-1 到 2026-12-31，只能输今年日期。", "steps": [], "sections": [], "source": "站内数据 dval", "updated": "2026-11-09"}, {"id": "dval-3", "group": "dval", "column": "C05", "level2": "C05-L2-4", "title": "输入规则", "level": "入门", "body": "整数/小数/文本长度：手机号设文本长度=11；年龄设整数介于 18-65。出错警告可自定义提示语。", "steps": [], "sections": [], "source": "站内数据 dval", "updated": "2026-11-09"}, {"id": "dval-4", "group": "dval", "column": "C05", "level2": "C05-L2-4", "title": "圈释无效数据", "level": "入门", "body": "数据→数据验证→圈释无效数据，已有违规的一眼现形。", "steps": [], "sections": [], "source": "站内数据 dval", "updated": "2026-11-09"}, {"id": "choose", "group": "charts", "column": "C07", "level2": "C07-L2-1", "title": "图表类型选择指南", "level": "进阶", "body": "比较大小用柱状图/条形图，看趋势用折线图，看占比用饼图/环形图（类别≤6），看关系用散点图/气泡图，看分布用直方图/箱线图。双坐标用组合图。记住：一图只讲一件事。", "steps": [], "sections": [], "source": "站内数据 charts", "updated": "2026-11-09"}, {"id": "make", "group": "charts", "column": "C07", "level2": "C07-L2-1", "title": "图表制作步骤", "level": "进阶", "body": "选中数据→插入→选图表
