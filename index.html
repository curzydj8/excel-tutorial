格右下角的小方块就是填充柄，拖动它可向下/向右复制或按规律填充。拖动后右下角会出现\"自动填充选项\"小图标，可切换\"复制单元格\"、\"填充序列\"、\"仅填充格式\"等模式。\n\n**复制粘贴专项**：`Ctrl + C` 复制的是内容＋格式＋公式。只想粘其中一部分时用\"选择性粘贴\"（右键→选择性粘贴，或开始→粘贴下拉）：\"数值\"只粘结果不粘公式，\"格式\"只粘样式，\"转置\"把行列互换。\n\n**查找替换**：`Ctrl + H` 打开查找替换，可批量改错别字、统一部门名。点\"选项\"可限定\"单元格匹配\"（整格相等才换，避免\"销售部\"被\"销售\"替换误伤）与\"区分大小写\"。`Ctrl + F` 只查找不替换。\n\n**定位条件**：`F5`→\"定位条件\"可一次选中某类单元格：全部空值（批量填\"待补\"）、全部公式（检查公式区）、全部常量。配合 `Ctrl + Enter` 可对所有选中格一次填入相同内容。"}, {"title": "4. 图文示例", "body": "做一张 5 人考勤录入表：A 列姓名（张三、李四、王五、赵六、钱七），B 列日期（2026-11-02 起用填充柄逐日填 5 天），C 列\"出勤\"用数据验证下拉（见数据验证篇）选\"出勤/请假\"。D 列输入工号时先把 D 列设为文本格式再输，避免 18 位工号变科学计数法。最后用 `Ctrl + H` 把误输的\"张三 \"（带尾空格）统一替换。\n\n（截图位：待补图）"}], "source": "docs/basics/02-data-entry.md", "updated": "2026-11-09", "objectives": ["区分文本、数值、日期三种输入，知道 Excel 如何自动识别它们", "用填充柄快速生成序号、日期序列与等差数列", "用选择性粘贴实现只粘数值、只粘格式与转置", "用查找替换批量修正数据，并用定位条件一次选中全部空值或公式"], "formulas": ["=COUNTA(A2:A6) → 5", "=COUNTBLANK(C2:C6) → 0", "=LEN(\"张三 \") → 3", "- `=COUNTA(A2:A6)` → 5：A2:A6 非空单元格数：5 个人名，验算录入是否漏人", "- `=COUNTBLANK(C2:C6)` → 0：C2:C6 空值个数：0 表示出勤列全部填完，可交表", "- `=LEN(\"张三 \")` → 3：带尾空格的\"张三 \"长度是 3 不是 2，空格也会被算进去——这就是查找替换前要先清空格的原因"], "scenarios": [{"title": "人事每月收考勤表", "body": "各部门交来的表里姓名带空格、日期格式不一。先用分列或 TRIM 清空格，再用查找替换统一部门名，最后用定位条件找出空值批量填\"待补\"。一套流程 10 分钟，替代逐格肉眼检查。"}, {"title": "销售每天录入订单", "body": "订单号是 12 位数字：录入前把订单号列设为文本格式，否则后三位会变 0。日期列用填充柄逐日递增，金额列只粘数值（防止带入上游表的公式）。"}], "pitfalls": [{"problem": "身份证号变 1.1E+17", "cause": "单元格是常规格式，Excel 按数值存长数字", "solution": "先设文本格式再输入，或先输英文单引号 '"}, {"problem": "日期变成 45934 这样的数字", "cause": "单元格被设成了常规格式，日期的序列值露出来了", "solution": "选中区域，开始→数字格式选\"短日期\""}, {"problem": "填充柄拖出 1、1、1 而不是 1、2、3", "cause": "只输了一个 1 就拖，Excel 默认复制", "solution": "先输 1、2 两个数再一起拖，或拖完点填充选项改\"填充序列\""}, {"problem": "查找替换改错了别处", "cause": "没勾\"单元格匹配\"，子串也被换了", "solution": "点选项勾选\"单元格匹配\"；替换前先\"查找全部\"看命中范围"}], "exercises": ["A2 输入 1、A3 输入 2，选中两格向下拖填充柄到 A10，A10 的值是多少？只输一个 1 再拖会怎样？", "B2:B6 是 5 个金额 100、200、150、300、250，D2 写公式求和，结果是多少？如果其中一格是文本\"200\"（带前导单引号），求和结果会变吗？", "用定位条件选中一片区域的全部空值后，怎样一次填入相同内容？"], "answers": ["A10 是 9（1、2、3…逐个递增）。只输一个 1 就拖会全部复制成 1，因为 Excel 不知道步长。", "求和 `=SUM(B2:B6)` → 1000。文本型\"200\"会被 SUM 忽略，结果变成 800——文本数字不参与求和，这是最常见的求和少算原因。", "输入内容后按 `Ctrl + Enter`（不是只按 Enter），所有选中格一次填入。"], "versions": "Excel 2016／2019／2021／365"}, {"id": "basics-03-cells-ranges", "group": "basics", "column": "C01", "level2": "C01-L2-3", "title": "单元格与区域操作：选定、行列、合并与名称框", "level": "入门", "body": "**区域（Range）**：一组连续单元格，用左上角:右下角表示，如 `B2:D10`。多数操作（求和、排序、复制）都是以区域为单位进行的；先选对区域，再执行操作，是 Excel 操作的第一性原理。\n\n**选定技巧**：点列标选整列、点行号选整行；`Ctrl + A` 在数据区按一次选当前连续区域，按两次选全表；`Ctrl + Shift + 方向键` 扩展到数据边缘，是选中整列数据的神器；`Ctrl + 点击` 加选不连续区域；`Ctrl + Shift + *`（数字 8 上档键）选中当前数据区域。\n\n**行列操作**：右键行号/列标可插入、删除、隐藏行列。插入行会把公式引用自动下移（引用跟着数据走），删除行则可能让引用该行的公式变成 `#REF!`——删行前先检查有没有公式引用它。\n\n**合并单元格**：开始→合并后居中。合并后只有左上角单元格保留内容，其余格的内容会被丢弃；合并过的区域不能直接排序、不能用填充柄、透视表也不认它。标题行合并一次尚可，数据区不要合并。\n\n**名称框跳转**：名称框输入地址回车即跳转；输入区域如 `B2:D100` 回车即选中该区域；输入已定义名称（如\"销售数据\"）可跳到命名区域。配合 `Ctrl + End`（已用区域右下角）与 `Ctrl + Home`（回 A1），大表导航不用滚轮。", "steps": ["选中整列数据：点任意数据格，按 `Ctrl + Shift + ↓` 选中从该格到数据底端；再按 `Ctrl + Shift + →` 可扩展到多列。", "插入一行：在行号上右键→插入；插入一列：在列标上右键→插入列；一次插多行：先选中多行行号再右键插入。", "调整列宽：双击列标右边界自动按内容适配宽度；拖动边界手动调；选中多列后拖动其中一列边界可等宽批量调。", "合并标题：选中标题行区域（如 A1:F1），开始→合并后居中；取消合并用同一按钮再次点击，或右键→取消合并单元格。", "隐藏与取消隐藏：选中行/列右键→隐藏；取消隐藏时先选中跨越隐藏区的行/列再右键→取消隐藏。", "跳转检查：按 `Ctrl + End` 看数据实际用到哪一行哪一列，发现远超预期的\"幽灵区域\"（如到了 XFD1048576）说明有残留格式，用定位条件选常量清理或删除多余行列。"], "sections": [{"title": "2. 基础概念", "body": "**区域（Range）**：一组连续单元格，用左上角:右下角表示，如 `B2:D10`。多数操作（求和、排序、复制）都是以区域为单位进行的；先选对区域，再执行操作，是 Excel 操作的第一性原理。\n\n**选定技巧**：点列标选整列、点行号选整行；`Ctrl + A` 在数据区按一次选当前连续区域，按两次选全表；`Ctrl + Shift + 方向键` 扩展到数据边缘，是选中整列数据的神器；`Ctrl + 点击` 加选不连续区域；`Ctrl + Shift + *`（数字 8 上档键）选中当前数据区域。\n\n**行列操作**：右键行号/列标可插入、删除、隐藏行列。插入行会把公式引用自动下移（引用跟着数据走），删除行则可能让引用该行的公式变成 `#REF!`——删行前先检查有没有公式引用它。\n\n**合并单元格**：开始→合并后居中。合并后只有左上角单元格保留内容，其余格的内容会被丢弃；合并过的区域不能直接排序、不能用填充柄、透视表也不认它。标题行合并一次尚可，数据区不要合并。\n\n**名称框跳转**：名称框输入地址回车即跳转；输入区域如 `B2:D100` 回车即选中该区域；输入已定义名称（如\"销售数据\"）可跳到命名区域。配合 `Ctrl + End`（已用区域右下角）与 `Ctrl + Home`（回 A1），大表导航不用滚轮。"}, {"title": "4. 图文示例", "body": "一张 1000 行销售明细表：点 A2，按 `Ctrl + Shift + ↓` 再 `Ctrl + Shift + →`，一次选中 A2:F1001 整个数据区；右键列标把 F 列（金额）列宽双击自适应；标题行 A1:F1 合并居中并加粗；把第 1 行冻结，滚动到底部核对最后一行；用名称框输入 `F1001` 跳到最后一格核对金额。\n\n（截图位：待补图）"}], "source": "docs/basics/03-cells-ranges.md", "updated": "2026-11-09", "objectives": ["用鼠标与键盘快速选定连续区域、不连续区域、整行整列与全表", "插入、删除、隐藏、调整行高列宽，并理解删除行对公式引用的影响", "正确使用合并单元格，知道它会带来哪些排序与引用问题", "用名称框与定位功能在几千行的大表里瞬间跳转"], "formulas": ["=SUM(B2:B6) → 550", "=ROWS(B2:B6) → 5", "=COLUMNS(B2:D2) → 3", "- `=SUM(B2:B6)` → 550：B2:B6 是 100、120、90、110、130，求和 100+120+90+110+130=550", "- `=ROWS(B2:B6)` → 5：ROWS 返回区域行数：B2 到 B6 共 5 行，核对选区行数时用", "- `=COLUMNS(B2:D2)` → 3：COLUMNS 返回区域列数：B 到 D 共 3 列"], "scenarios": [{"title": "接手一张 2 万行大表", "body": "先 `Ctrl + End` 看已用区域：若到了第 20000 行之后很远，说明底部有残留格式或空行，先删掉多余行再操作，否则排序筛选会把空行也算进去。冻结首行后用名称框跳转，少用滚轮翻页。"}, {"title": "做一张要打印的报表", "body": "标题行合并居中、列宽按内容自适应、行高统一 18；数据区绝不合并单元格（否则排序与筛选全废）。打印前用分页预览确认每页断在哪里。"}], "pitfalls": [{"problem": "排序后数据错位", "cause": "排序前只选中了一列，行与行对应关系被打乱", "solution": "排序前选中整个数据区，或点数据区内任一格直接点排序按钮（Excel 会自动扩展选区）"}, {"problem": "删除行后公式变 #REF!", "cause": "被删的行正被其他公式引用", "solution": "删行前用公式→追踪从属单元格检查引用；改用整列引用可减少此类问题"}, {"problem": "合并单元格后无法排序", "cause": "合并区域破坏了矩形数据区", "solution": "数据区用\"跨列居中\"（设置单元格格式→对齐→水平对齐→跨列居中）代替合并"}, {"problem": "Ctrl + End 跳到很远的空白格", "cause": "曾经输入过内容又删了，格式残留导致已用区域虚大", "solution": "选中多余行/列右键删除（不是按 Delete 清内容），保存后重开即恢复"}], "exercises": ["B2:B6 是 100、120、90、110、130，写公式求和与求行数，结果各是多少？", "为什么数据区不建议用合并单元格？说出至少两个后果。", "一张表按 Ctrl + End 跳到了 Z5000，但实际数据只有 100 行，最可能的原因与修复方法是什么？"], "answers": ["求和 `=SUM(B2:B6)` → 550；行数 `=ROWS(B2:B6)` → 5。", "排序失效、填充柄失效、透视表不认合并区域、公式引用只认左上角格。标题行可用\"跨列居中\"代替。", "残留格式导致已用区域虚大。选中第 101 行到 5000 行右键删除整行（不是 Delete 清内容），保存后重开，Ctrl + End 即回到正常位置。"], "versions": "Excel 2016／2019／2021／365"}, {"id": "basics-05-versions", "group": "basics", "column": "C01", "level2": "C01-L2-5", "title": "版本与兼容：从 Excel 2003 到 Microsoft 365", "level": "入门", "body": "**版本沿革**：Excel 2003 是最后一个 `.xls` 时代版本；2007 引入功能区与 `.xlsx`；2010 加入切片器与 Power Pivot；2013 加入快速填充与时间线；2016 加入 Power Query 内置与 6 个新函数；2019 新增 IFS、SWITCH、CONCAT、TEXTJOIN、MAXIFS、MINIFS；2021 新增 XLOOKUP 与动态数组函数 FILTER、SORT、UNIQUE；Microsoft 365 在此基础上持续新增 TEXTSPLIT、TEXTBEFORE、LAMBDA 等，且只有 365 能用最新函数。\n\n**一个常见误标**：IFS、SWITCH、CONCAT、TEXTJOIN 是 Excel 2019 新增，不是 2016。很多旧教程写\"2016+\"是错的——在 Excel 2016 打开含 IFS 的文件会报 `#NAME?`。本站函数库的版本字段以 `versions.func_ver` 为准：IFS、SWITCH、TEXTJOIN、CONCAT、MAXIFS、MINIFS 均为 2019／365；XLOOKUP、FILTER、SORT、UNIQUE 为 2021／365；TEXTSPLIT、TEXTBEFORE、TEXTAFTER、LAMBDA 为 365 专属。\n\n**兼容性检查器**：文件→信息→检查问题→检查兼容性，可列出当前文件在旧版本里会丢失的功能（如新函数、某些图表类型），并给出受影响的单元格。文件发给别人之前跑一遍，比对方打电话来说\"公式报错\"强。\n\n**365 与买断版的区别**：Microsoft 365 是订阅制，持续获得新函数与新功能；2019、2021 是买断版，功能冻结在发布时。同样叫\"最新版 Excel\"，365 用户能用的函数可能比 2021 用户多。写教程、做模板时要先问清对方的版本。\n\n**旧版本替代写法**：XLOOKUP（2021／365）→ 旧版用 INDEX+MATCH 或 VLOOKUP；IFS（2019／365）→ 旧版用 IF 嵌套；TEXTJOIN（2019／365）→ 旧版用 `&` 连接；FILTER（2021／365）→ 旧版用高级筛选或数组公式。本站每篇涉及新函数的教程都会注明替代写法。", "steps": ["查看自己的版本：文件→账户→关于 Excel，或文件→信息，顶部显示版本号（如\"Microsoft 365\"或\"Excel 2019\"）。", "查函数兼容性：本站函数库每函数详情页有\"版本兼容性\"表；或在微软官方支持页搜函数名，看\"适用于\"一栏。", "跑兼容性检查：文件→信息→检查问题→检查兼容性，选目标旧版本（如 Excel 2016），看报告里列出的问题单元格。", "处理不兼容项：把新函数换成替代写法，或把结果\"选择性粘贴→数值\"固定下来再发给对方；图表类问题换成旧版支持的图表类型。", "保存时降级：另存为时选旧格式（如\"Excel 97-2003 工作簿 *.xls\"）会触发兼容性检查，按提示逐项处理；无特殊原因不要主动降级保存。"], "sections": [{"title": "2. 基础概念", "body": "**版本沿革**：Excel 2003 是最后一个 `.xls` 时代版本；2007 引入功能区与 `.xlsx`；2010 加入切片器与 Power Pivot；2013 加入快速填充与时间线；2016 加入 Power Query 内置与 6 个新函数；2019 新增 IFS、SWITCH、CONCAT、TEXTJOIN、MAXIFS、MINIFS；2021 新增 XLOOKUP 与动态数组函数 FILTER、SORT、UNIQUE；Microsoft 365 在此基础上持续新增 TEXTSPLIT、TEXTBEFORE、LAMBDA 等，且只有 365 能用最新函数。\n\n**一个常见误标**：IFS、SWITCH、CONCAT、TEXTJOIN 是 Excel 2019 新增，不是 2016。很多旧教程写\"2016+\"是错的——在 Excel 2016 打开含 IFS 的文件会报 `#NAME?`。本站函数库的版本字段以 `versions.func_ver` 为准：IFS、SWITCH、TEXTJOIN、CONCAT、MAXIFS、MINIFS 均为 2019／365；XLOOKUP、FILTER、SORT、UNIQUE 为 2021／365；TEXTSPLIT、TEXTBEFORE、TEXTAFTER、LAMBDA 为 365 专属。\n\n**兼容性检查器**：文件→信息→检查问题→检查兼容性，可列出当前文件在旧版本里会丢失的功能（如新函数、某些图表类型），并给出受影响的单元格。文件发给别人之前跑一遍，比对方打电话来说\"公式报错\"强。\n\n**365 与买断版的区别**：Microsoft 365 是订阅制，持续获得新函数与新功能；2019、2021 是买断版，功能冻结在发布时。同样叫\"最新版 Excel\"，365 用户能用的函数可能比 2021 用户多。写教程、做模板时要先问清对方的版本。\n\n**旧版本替代写法**：XLOOKUP（2021／365）→ 旧版用 INDEX+MATCH 或 VLOOKUP；IFS（2019／365）→ 旧版用 IF 嵌套；TEXTJOIN（2019／365）→ 旧版用 `&` 连接；FILTER（2021／365）→ 旧版用高级筛选或数组公式。本站每篇涉及新函数的教程都会注明替代写法。"}, {"title": "4. 图文示例", "body": "同事用 Excel 2016，你用 365。你做的表里用了 `=XLOOKUP(A2, 客户表!A:A, 客户表!B:B)`，对方打开显示 `#NAME?`。处理办法：把 XLOOKUP 换成 `=INDEX(客户表!B:B, MATCH(A2, 客户表!A:A, 0))`，2016 也能跑；或把结果列选择性粘贴为数值再发。反过来，对方发来的 .xls 旧文件，你打开后先另存为 .xlsx 再改，避免旧格式限制（行数上限 65536 行、函数受限）。\n\n（截图位：待补图）"}], "source": "docs/basics/05-versions.md", "updated": "2026-11-09", "objectives": ["说出 Excel 各主要版本的发布时间线与标志性新增功能", "判断一个函数在自己电脑的版本上能不能用（查兼容矩阵）", "用兼容性检查器发现文件发给旧版本用户时会出的问题", "针对旧版本用户选择替代写法（如用 INDEX+MATCH 代替 XLOOKUP）"], "formulas": ["=INDEX(客户表!B:B, MATCH(A2, 客户表!A:A, 0)) → 与 XLOOKUP 相同结果", "=IF(A2>=90,\"优\",IF(A2>=60,\"及格\",\"不及格\")) → 及格（A2=75 时）", "=A2&\"、\"&B2&\"、\"&C2 → 张三、李四、王五", "- `=INDEX(客户表!B:B, MATCH(A2, 客户表!A:A, 0))` → 与 XLOOKUP 相同结果：XLOOKUP 的全版本替代写法：MATCH 定位行号，INDEX 取值；A2 是\"张三\"时返回其对应的客户经理", "- `=IF(A2>=90,\"优\",IF(A2>=60,\"及格\",\"不及格\"))` → 及格：IFS 的旧版替代写法：IF 嵌套；A2=75 时第一层假、第二层真，返回\"及格\"", "- `=A2&\"、\"&B2&\"、\"&C2` → 张三、李四、王五：TEXTJOIN 的旧版替代写法：& 连接符逐个拼接；TEXTJOIN 本身需 2019／365"], "scenarios": [{"title": "模板要发给全公司用", "body": "公司电脑版本混杂（2016、2019、365 都有）。模板里的函数只用 2016 也有的（SUMIF、VLOOKUP、INDEX+MATCH），新函数一律不用；发之前用兼容性检查器跑一遍，确认零问题再群发。"}, {"title": "面试被问\"你会 XLOOKUP 吗\"", "body": "先答会，再补一句适用版本：XLOOKUP 需 2021／365，旧版用 INDEX+MATCH 实现同样效果。能说清版本边界，比只会背语法更像内行。"}], "pitfalls": [{"problem": "对方打开文件公式报 #NAME?", "cause": "用了对方版本没有的新函数", "solution": "查兼容矩阵确认引入版本；换替代写法或粘贴为数值"}, {"problem": "把 IFS 当成老版本就有的函数", "cause": "IFS 是 2019 新增，旧教程误标了版本", "solution": "IFS、SWITCH、CONCAT、TEXTJOIN、MAXIFS、MINIFS 均为 2019 新增；以本站 func_ver 数据为准"}, {"problem": "365 的新函数在 2021 上也不能用", "cause": "TEXTSPLIT、LAMBDA 是 365 专属，不在 2021 内", "solution": "做跨版本模板时只用 2021 及以下版本共有的函数"}, {"problem": ".xls 旧文件行数不够用", "cause": "旧格式上限 65536 行", "solution": "另存为 .xlsx（上限 1048576 行）再继续做"}], "exercises": ["IFS、XLOOKUP、TEXTSPLIT 三个函数的引入版本各是什么？在 Excel 2016 上哪个能用？", "同事用 2016，你的表里用了 TEXTJOIN，要发给他，至少给出两种处理办法。", "文件→信息→检查问题→检查兼容性是干什么用的？"], "answers": ["IFS 是 2019／365，XLOOKUP 是 2021／365，TEXTSPLIT 是 365 专属。2016 上三个都不能用，都会报 #NAME?。", "（1）换成 & 连接符逐个拼接；（2）把结果列选择性粘贴为数值后发送。", "列出当前文件在指定旧版本里会丢失的功能与受影响单元格，发文件给旧版本用户之前跑一遍。"], "versions": "Excel 2003／2007／2010／2013／2016／2019／2021／365"}, {"id": "formatting-01-number-format", "group": "formatting", "column": "C02", "level2": "C02-L2-1", "title": "数字格式：常规、货币、日期、百分比与自定义格式代码", "level": "入门", "body": "**值与格式分离**：单元格里存的是值（如 0.25），显示的是格式（如 25%）。改格式只改变观感，不改变参与计算的值——`0.25` 显示成 25% 后，求和结果不变。这是理解数字格式的第一性原理，也是\"百分比放大 100 倍\"事故的根源：先输入 25 再设百分比格式，Excel 会把 25 理解成 2500%。\n\n**常规格式**：默认格式，数字按原样显示，超过 11 位的大数字自动变科学计数法。身份证号、银行卡号变科学计数法，就是常规格式在作怪——解法是先设文本格式再输入。\n\n**货币与会计专用**：货币格式给数字加 ¥ 符号与千分位（如 ¥1,234.56）；会计专用格式把 ¥ 符号左对齐、小数点对齐，适合财务报表。两者都不改变数值本身。\n\n**日期格式**：Excel 的日期本质是序列值（1900-01-01 是 1，2026-11-09 是 45961），显示格式决定它看起来是\"2026/11/9\"还是\"2026 年 11 月 9 日\"。日期能直接加减（`2026-11-09 减 2026-11-02 = 7`），靠的就是序列值。\n\n**自定义格式代码**：格式代码分四段\"正数;负数;零值;文本\"，如 `#,##0.00;[红色]-#,##0.00;\"-\"` 表示正数带千分位两位小数、负数红色带减号、零显示一个短横。常用占位符：`0` 强制占位显示 0，`#` 有数才显示，`?` 按空格占位对齐小数点。", "steps": ["设货币：选中金额列，开始→数字格式下拉选\"货币\"，或按 `Ctrl + Shift + 4`（货币快捷键）；会计专用在同一菜单里选\"会计专用\"。", "设百分比：先确认值是小数形式（0.25 不是 25），再按 `Ctrl + Shift + 5` 或点 `%` 按钮；需要两位小数时点\"增加小数位数\"。", "设日期：选中日期列，开始→数字格式下拉选\"短日期\"或\"长日期\"；需要\"2026-11-09\"这种形式时用设置单元格格式→自定义→输入 `yyyy-mm-dd`。", "自定义格式：选中区域按 `Ctrl + 1`→数字→自定义，在类型框输入格式代码，如 `0.00\"元\"`（数字后加\"元\"字后缀显示）。", "批量清格式：选中区域，开始→清除→清除格式，回到常规格式；只清格式不删值。", "检查真值：点任一单元格看编辑栏——编辑栏显示的是真实值，单元格显示的是格式效果；两者不一致时以编辑栏为准。"], "sections": [{"title": "2. 基础概念", "body": "**值与格式分离**：单元格里存的是值（如 0.25），显示的是格式（如 25%）。改格式只改变观感，不改变参与计算的值——`0.25` 显示成 25% 后，求和结果不变。这是理解数字格式的第一性原理，也是\"百分比放大 100 倍\"事故的根源：先输入 25 再设百分比格式，Excel 会把 25 理解成 2500%。\n\n**常规格式**：默认格式，数字按原样显示，超过 11 位的大数字自动变科学计数法。身份证号、银行卡号变科学计数法，就是常规格式在作怪——解法是先设文本格式再输入。\n\n**货币与会计专用**：货币格式给数字加 ¥ 符号与千分位（如 ¥1,234.56）；会计专用格式把 ¥ 符号左对齐、小数点对齐，适合财务报表。两者都不改变数值本身。\n\n**日期格式**：Excel 的日期本质是序列值（1900-01-01 是 1，2026-11-09 是 45961），显示格式决定它看起来是\"2026/11/9\"还是\"2026 年 11 月 9 日\"。日期能直接加减（`2026-11-09 减 2026-11-02 = 7`），靠的就是序列值。\n\n**自定义格式代码**：格式代码分四段\"正数;负数;零值;文本\"，如 `#,##0.00;[红色]-#,##0.00;\"-\"` 表示正数带千分位两位小数、负数红色带减号、零显示一个短横。常用占位符：`0` 强制占位显示 0，`#` 有数才显示，`?` 按空格占位对齐小数点。"}, {"title": "4. 图文示例", "body": "一张报销表：A 列日期（2026-11-02），B 列金额 1234.5，C 列占比 0.25。把 A 列设为 `yyyy-mm-dd` 显示\"2026-11-02\"；B 列设货币格式显示\"¥1,234.50\"；C 列设百分比显示\"25%\"。D 列自定义格式 `0.00\"元\"`，输入 80 显示\"80.00元\"，值仍是 80，可正常求和。核对：选中 C2 看编辑栏仍是 0.25，证明格式没改值。\n\n（截图位：待补图）"}], "source": "docs/formatting/01-number-format.md", "updated": "2026-11-09", "objectives": ["区分\"单元格的值\"与\"单元格的显示格式\"，知道改格式不改值", "正确设置货币、百分比、日期三种最常用数字格式", "写出常用的自定义格式代码（如 0.00、#,##0、yyyy-mm-dd、[红色]负数）", "诊断并修复\"数字变日期\"、\"百分比放大 100 倍\"、\"前导 0 丢失\"三类格式事故"], "formulas": ["=B2*0.13 → 160.49（B2=1234.5 时）", "=A3-A2 → 7（A2=2026-11-02，A3=2026-11-09 时）", "=TEXT(0.25,\"0%\") → 25%", "- `=B2*0.13` → 160.49：1234.5×0.13=160.485，四舍五入到分是 160.49；货币格式显示 ¥160.49，值不变", "- `=A3-A2` → 7：日期相减得天数：11 月 9 日减 11 月 2 日是 7 天（序列值相减）", "- `=TEXT(0.25,\"0%\")` → 25%：TEXT 函数把值按格式代码转成文本\"25%\"，结果是文本，不再参与数值计算"], "scenarios": [{"title": "财务做报销汇总表", "body": "金额列统一货币格式两位小数，合计行加粗；占比列用百分比格式一位小数。发给领导前检查：合计值用 SUM 重算一遍，确认格式没有掩盖真实值（编辑栏核对）。"}, {"title": "人事做工号表", "body": "工号\"00123\"前导 0 会丢失：先把列设为文本格式再录入，或自定义格式 `00000`（5 位不足补 0）。已录丢的 0 无法找回，只能重新录入。"}], "pitfalls": [{"problem": "百分比显示 2500%", "cause": "先输 25 再设百分比格式", "solution": "先设格式再输 0.25，或输入后除以 100；已错的批量用选择性粘贴→除 100 修正"}, {"problem": "身份证号变科学计数法", "cause": "常规格式下长数字被当数值", "solution": "先设文本格式再输入；已变的无法恢复原值，需重新录入"}, {"problem": "日期输入后变 45961", "cause": "单元格是常规格式，序列值露出来了", "solution": "选中区域设为短日期格式"}, {"problem": "前导 0 丢失（00123 变 123）", "cause": "数值格式不保留前导 0", "solution": "先设文本格式，或自定义格式 00000"}, {"problem": "自定义格式代码不生效", "cause": "代码写错段或用了中文标点", "solution": "分号用英文 ;，引号用英文双引号，代码分段不超过四段"}], "exercises": ["单元格值是 0.25，设为百分比格式后显示什么？参与求和的值变了吗？", "A2=2026-11-02，A3=2026-11-09，=A3-A2 的结果是多少？为什么日期能相减？", "写一个自定义格式代码：正数显示千分位两位小数，负数显示红色带减号，零显示一个短横。"], "answers": ["显示 25%，求和用的值仍是 0.25。格式只改显示不改值。", "结果 7（天）。日期本质是序列值，2026-11-09 减 2026-11-02 等于序列值之差 7。", "`#,##0.00;[红色]-#,##0.00;\"-\"`。四段结构：正数;负数;零值；文本段省略。"], "versions": "Excel 2016／2019／2021／365"}, {"id": "formatting-02-font-alignment", "group": "formatting", "column": "C02", "level2": "C02-L2-2", "title": "字体与对齐：字号颜色、对齐缩进与自动换行", "level": "入门", "body": "**字体三要素**：字体、字号、颜色。报表惯例：标题 16 号加粗、表头 11 号加粗配填充色、数据 11 号常规。同一张表字体不超过两种，字号不超过三个档次，否则显乱。\n\n**对齐**：水平对齐分左对齐（文本默认）、居中、右对齐（数值默认）；垂直对齐分靠上、居中、靠下。数字右对齐、文本左对齐、标题居中，是表格的默认美学；跨列居中（设置单元格格式→对齐→水平对齐→跨列居中）能让标题居中又不破坏数据区结构，比合并单元格更安全。\n\n**缩进**：增加缩进量可以把层级关系可视化（如\"销售部\"下一级\"华东区\"缩进一格），比用空格对齐可靠——空格缩进在换字体后会错位。\n\n**自动换行**：长文本超出列宽时，自动换行让它在格内折成多行显示，同时行高自动撑高；配合\"缩小字体填充\"可在不换行时把字缩到能放下。两者不要同时开。\n\n**格式刷**：选中带格式的格点格式刷，再点目标格，只刷格式不刷内容；双击格式刷可连续刷多个区域，按 Esc 退出。格式刷是\"复制格式\"最快的方式，比逐项点工具栏快一个数量级。", "steps": ["设标题：选中标题行，字号 16、加粗、居中；表头行字号 11、加粗、填充浅灰、居中。", "调对齐：选中数据区，开始→对齐方式组，数值列点右对齐、文本列点左对齐；标题行点\"合并后居中\"或改用\"跨列居中\"。", "长文本换行：选中长文本列，开始→自动换行；行高不够时双击行号下边界自适应行高。", "缩进层级：选中下级行，开始→增加缩进量（每点一次缩进一格）。", "复制格式：选中样板格，点格式刷（双击可连续用），再刷目标区域；完成后按 Esc 退出。", "检查：按 `Ctrl + End` 看全表，确认没有字体混用、没有某列突然左对齐/右对齐不一致。"], "sections": [{"title": "2. 基础概念", "body": "**字体三要素**：字体、字号、颜色。报表惯例：标题 16 号加粗、表头 11 号加粗配填充色、数据 11 号常规。同一张表字体不超过两种，字号不超过三个档次，否则显乱。\n\n**对齐**：水平对齐分左对齐（文本默认）、居中、右对齐（数值默认）；垂直对齐分靠上、居中、靠下。数字右对齐、文本左对齐、标题居中，是表格的默认美学；跨列居中（设置单元格格式→对齐→水平对齐→跨列居中）能让标题居中又不破坏数据区结构，比合并单元格更安全。\n\n**缩进**：增加缩进量可以把层级关系可视化（如\"销售部\"下一级\"华东区\"缩进一格），比用空格对齐可靠——空格缩进在换字体后会错位。\n\n**自动换行**：长文本超出列宽时，自动换行让它在格内折成多行显示，同时行高自动撑高；配合\"缩小字体填充\"可在不换行时把字缩到能放下。两者不要同时开。\n\n**格式刷**：选中带格式的格点格式刷，再点目标格，只刷格式不刷内容；双击格式刷可连续刷多个区域，按 Esc 退出。格式刷是\"复制格式\"最快的方式，比逐项点工具栏快一个数量级。"}, {"title": "4. 图文示例", "body": "一张部门费用表：标题\"11 月部门费用表\"16 号加粗居中（跨列居中，不合并）；表头行（部门/项目/金额）11 号加粗、浅灰填充、居中；金额列右对齐货币格式；部门列左对齐，下级\"华东区\"、\"华北区\"各缩进一格；备注列长文本开自动换行。最后用格式刷把表头格式刷到汇总行。\n\n（截图位：待补图）"}], "source": "docs/formatting/02-font-alignment.md", "updated": "2026-11-09", "objectives": ["用字体、字号、颜色与加粗区分标题、表头与数据", "用水平/垂直对齐与缩进让表格对齐整齐", "用自动换行与合并居中处理长文本标题", "用格式刷快速复制格式而不复制内容"], "formulas": ["=SUM(C2:C6) → 4860（C2:C6 是 1200、980、1500、640、540 时）", "=C2/SUM($C$2:$C$6) → 24.69%（C2=1200 时）", "- `=SUM(C2:C6)` → 4860：1200+980+1500+640+540=4860；格式不影响求和，只影响显示", "- `=C2/SUM($C$2:$C$6)` → 24.69%：1200÷4860≈0.2469，显示为百分比两位小数 24.69%"], "scenarios": [{"title": "给领导看的周报", "body": "标题 16 号加粗、表头浅灰加粗、金额右对齐货币格式、关键合计行加粗并加顶边框。领导 10 秒扫完要能抓住总额与最大项——格式就是信息的优先级。"}, {"title": "接手同事的乱表", "body": "字体五花八门时：全选→字体统一为等线 11 号→清除多余加粗与颜色→表头单独加粗加填充。先统一再局部强调，比逐格改快。"}], "pitfalls": [{"problem": "标题用合并单元格后无法排序", "cause": "合并破坏了矩形数据区", "solution": "标题行用\"跨列居中\"代替合并；数据区绝不合并"}, {"problem": "自动换行开了但行高没撑起来", "cause": "行高被手动固定过", "solution": "双击行号下边界自适应行高，或选中行→开始→格式→自动调整行高"}, {"problem": "格式刷刷完内容也被复制了", "cause": "用了复制粘贴而不是格式刷", "solution": "格式刷只刷格式；粘贴时想只粘格式用选择性粘贴→格式"}, {"problem": "数字左对齐、文本右对齐显得乱", "cause": "对齐方式与数据类型不匹配", "solution": "数值右对齐、文本左对齐、标题居中；整列统一改，不要逐格点"}], "exercises": ["C2=1200，C2:C6 合计 4860，=C2/SUM($C$2:$C$6) 显示百分比两位小数是多少？", "标题行想居中但又不想破坏排序，应该用合并后居中还是跨列居中？为什么？", "格式刷双击与单击有什么区别？"], "answers": ["24.69%。1200÷4860≈0.246913…，百分比两位小数是 24.69%。", "跨列居中。它只改变显示效果，不合并单元格，数据区仍是完整矩形，排序筛选不受影响。", "单击只能刷一次，刷完自动退出；双击可连续刷多个区域，按 Esc 退出。"], "versions": "Excel 2016／2019／2021／365"}, {"id": "formatting-03-border-fill", "group": "formatting", "column": "C02", "level2": "C02-L2-3", "title": "边框与填充：边框样式、填充图案与网格线", "level": "入门", "body": "**边框三层级**：外边框（粗线，框住整张表）、内边框（细线，分隔行列）、合计行顶边框（双线或粗线，标出合计）。一张报表通常只需要这三层：外粗内细、合计加粗，线多了反而乱。\n\n**填充色**：表头浅灰、合计行浅黄、异常行浅红，是报表的通用语义。填充只改背景，不改值；隔行变色（斑马纹）能显著降低看错行的概率，大表必备。\n\n**网格线 vs 边框**：网格线是屏幕上的浅灰虚线、只辅助编辑，打印时默认不出来；边框是实打实的格式，打印会出来。视图→取消勾选\"网格线\"可让表格在屏幕上也干净，靠边框来分隔。\n\n**套用表格格式**：开始→套用表格格式，选一个样式一键生成带边框、表头色、隔行变色的表格。它与超级表（Ctrl + T）是两回事：前者只刷格式，后者还带筛选与结构化引用。本篇只讲格式，超级表见下一篇。", "steps": ["加边框：选中数据区，开始→边框下拉→所有框线（内细）；再选中整表范围，边框下拉→粗匣框线（外粗）。", "合计行顶边框：选中合计行，边框下拉→顶端双框线（或上框线粗线）。", "填充表头：选中表头行，开始→填充颜色选浅灰；合计行选浅黄；异常行选浅红。", "隔行变色：选中数据区，开始→条件格式→新建规则→使用公式 `=MOD(ROW(),2)=0` →格式→填充浅灰；或直接用套用表格格式选带隔行色的样式。", "隐藏网格线：视图→取消勾选\"网格线\"，屏幕上只剩你画的边框，检查边框有没有漏画。", "打印检查：文件→打印预览，确认边框都出来了、没有多余的线；页面布局→打印标题可重复标题行。"], "sections": [{"title": "2. 基础概念", "body": "**边框三层级**：外边框（粗线，框住整张表）、内边框（细线，分隔行列）、合计行顶边框（双线或粗线，标出合计）。一张报表通常只需要这三层：外粗内细、合计加粗，线多了反而乱。\n\n**填充色**：表头浅灰、合计行浅黄、异常行浅红，是报表的通用语义。填充只改背景，不改值；隔行变色（斑马纹）能显著降低看错行的概率，大表必备。\n\n**网格线 vs 边框**：网格线是屏幕上的浅灰虚线、只辅助编辑，打印时默认不出来；边框是实打实的格式，打印会出来。视图→取消勾选\"网格线\"可让表格在屏幕上也干净，靠边框来分隔。\n\n**套用表格格式**：开始→套用表格格式，选一个样式一键生成带边框、表头色、隔行变色的表格。它与超级表（Ctrl + T）是两回事：前者只刷格式，后者还带筛选与结构化引用。本篇只讲格式，超级表见下一篇。"}, {"title": "4. 图文示例", "body": "一张 5 行费用表：外边框粗线、内边框细线、合计行顶端双框线；表头浅灰填充、合计行浅黄填充、金额超 1500 的行浅红填充（条件格式公式 `=$C2>1500`）；隐藏网格线后屏幕干净，打印预览确认三层边框齐全。\n\n（截图位：待补图）"}], "source": "docs/formatting/03-border-fill.md", "updated": "2026-11-09", "objectives": ["给表格加外边框、内边框与合计行顶边框，区分三个层级", "用填充色区分表头、合计行与异常行", "理解网格线与边框的区别，知道打印时哪个会出来", "用套用表格格式一键生成带边框与隔行变色的表格"], "formulas": ["=MOD(ROW(),2)=0 → TRUE（偶数行时）", "=SUM(C2:C6) → 4860", "- `=MOD(ROW(),2)=0` → TRUE：隔行变色的条件格式公式：偶数行返回 TRUE，刷浅灰；ROW() 返回当前行号", "- `=SUM(C2:C6)` → 4860：边框与填充不影响计算；1200+980+1500+640+540=4860"], "scenarios": [{"title": "打印出来给财务签字", "body": "外粗内细、合计双线、表头浅灰；打印前隐藏网格线、预览确认分页；金额列货币格式。签字的表要一眼分清表头、数据、合计三层。"}, {"title": "大表看错行", "body": "30 列 500 行的表，隔行变色是刚需：条件格式 `=MOD(ROW(),2)=0` 刷浅灰，或套用表格格式选斑马纹样式。看错行的错误率立刻下降。"}], "pitfalls": [{"problem": "打印出来没有线", "cause": "只依赖网格线，没画边框", "solution": "网格线默认不打印；必须用开始→边框画实线"}, {"problem": "边框线型不统一", "cause": "多次叠加不同线型", "solution": "先清除边框再重画；外粗内细一次成型"}, {"problem": "填充色太深导致字看不清", "cause": "深色填充配黑色字", "solution": "浅色填充（浅灰/浅黄/浅蓝）配黑字；深色填充必须配白字"}, {"problem": "隔行变色与手动填充冲突", "cause": "手动填充盖住了条件格式", "solution": "二选一：要么全手动，要么全条件格式；不要混用"}], "exercises": ["网格线与边框有什么区别？打印时哪个会出来？", "写出隔行变色的条件格式公式，并说明它为什么能隔行刷色。", "一张表外边框、内边框、合计行顶边框分别建议用什么线型？"], "answers": ["网格线是屏幕辅助线，默认不打印；边框是单元格格式，打印会出来。", "`=MOD(ROW(),2)=0`。ROW() 取当前行号，偶数行余数为 0 返回 TRUE，条件格式对该行刷填充色。", "外边框粗线、内边框细线、合计行顶端双框线（或粗线）。外粗内细、合计加重。"], "versions": "Excel 2016／2019／2021／365"}, {"id": "formatting-04-styles-themes", "group": "formatting", "column": "C02", "level2": "C02-L2-4", "title": "样式与主题：单元格样式、套用表格格式与主题配色", "level": "入门", "body": "**单元格样式**：开始→单元格样式，内置\"标题\"、\"强调\"、\"好\"（绿底）、\"差\"（红底）、\"适中\"（黄底）等语义样式。点一下即套用一整套字体、填充与边框，比逐项点工具栏快；语义样式还能让\"好/差\"一眼可辨。\n\n**套用表格格式**：选一个样式，一键生成带表头色、隔行变色、首列加粗的表格。它只刷格式，不带筛选功能；想要筛选与结构化引用，改用 `Ctrl + T` 创建超级表（见下一篇）。\n\n**自定义样式**：开始→单元格样式→新建单元格样式，把\"公司红标题\"存成样式，全工作簿点一下即用。样式存在工作簿里，换电脑、发给别人都跟着走。\n\n**主题**：页面布局→主题，一键换全表的配色方案与字体组合（标题字体＋正文字体）。主题色是联动的：用主题色做的填充与字体，换主题后自动跟着变；用标准色做的则不变。做公司模板时一律用主题色，换 VI 色一次改全套。", "steps": ["套语义样式：选中结果格，开始→单元格样式→点\"好\"/\"差\"/\"适中\"；达标绿、超标红，状态一眼可见。", "套表格样式：选中数据区，开始→套用表格格式，选一个带隔行变色的样式，勾选\"表包含标题\"。", "新建样式：设置好一个单元格的全部格式，开始→单元格样式→新建单元格样式，起名\"公司标题\"，以后点一下即用。", "换主题：页面布局→主题，选一个主题；再点\"颜色\"可只换配色、点\"字体\"可只换字体组合。", "清理样式：开始→单元格样式→右键自定义样式→删除；或选中区域→清除→清除格式，回到常规格式。"], "sections": [{"title": "2. 基础概念", "body": "**单元格样式**：开始→单元格样式，内置\"标题\"、\"强调\"、\"好\"（绿底）、\"差\"（红底）、\"适中\"（黄底）等语义样式。点一下即套用一整套字体、填充与边框，比逐项点工具栏快；语义样式还能让\"好/差\"一眼可辨。\n\n**套用表格格式**：选一个样式，一键生成带表头色、隔行变色、首列加粗的表格。它只刷格式，不带筛选功能；想要筛选与结构化引用，改用 `Ctrl + T` 创建超级表（见下一篇）。\n\n**自定义样式**：开始→单元格样式→新建单元格样式，把\"公司红标题\"存成样式，全工作簿点一下即用。样式存在工作簿里，换电脑、发给别人都跟着走。\n\n**主题**：页面布局→主题，一键换全表的配色方案与字体组合（标题字体＋正文字体）。主题色是联动的：用主题色做的填充与字体，换主题后自动跟着变；用标准色做的则不变。做公司模板时一律用主题色，换 VI 色一次改全套。"}, {"title": "4. 图文示例", "body": "考核表：得分≥90 的格套\"好\"样式（绿底），60 分以下套\"差\"样式（红底），60–90 套\"适中\"（黄底）。整表套用表格格式\"浅色 1\"得隔行变色；标题用新建样式\"公司标题\"（16 号加粗、公司蓝）。换主题\"简约\"后，全表配色一次变灰蓝，语义色（好/差）不受影响。\n\n（截图位：待补图）"}], "source": "docs/formatting/04-styles-themes.md", "updated": "2026-11-09", "objectives": ["用内置单元格样式一键套用标题、强调、好/差等语义格式", "用套用表格格式快速生成带隔行变色的表格", "新建自定义单元格样式并在全工作簿复用", "换主题一键改全表的配色与字体，并理解主题色的联动规则"], "formulas": ["=IF(B2>=90,\"好\",IF(B2>=60,\"适中\",\"差\")) → 好（B2=95 时）", "=COUNTIF(B2:B6,\">=90\") → 2（B2:B6 是 95、88、92、58、76 时）", "- `=IF(B2>=90,\"好\",IF(B2>=60,\"适中\",\"差\"))` → 好：B2=95 时第一层为真返回\"好\"；配合单元格样式，好/差/适中三档自动上色", "- `=COUNTIF(B2:B6,\">=90\")` → 2：95 与 92 两个≥90，计数为 2；与\"好\"样式的格数一致，可互相核对"], "scenarios": [{"title": "公司统一报表模板", "body": "新建样式\"公司标题\"、\"公司表头\"、\"公司合计\"，主题色用公司 VI 蓝。以后每张报表点三下样式即成型，换 VI 时改一次主题色，全公司模板跟着变。"}, {"title": "考核结果公示表", "body": "分数列用 IF 分档＋语义样式（好绿/差红/适中黄），公示时不用逐行解释，颜色即结论。注意色盲友好：同时保留文字档位，不要只靠颜色。"}], "pitfalls": [{"problem": "套用表格格式后筛选箭头没了", "cause": "把\"套用表格格式\"当成了超级表", "solution": "套用表格格式只刷格式；要筛选与结构化引用用 Ctrl + T 创建超级表"}, {"problem": "换主题后部分颜色没变", "cause": "那些颜色用的是标准色而非主题色", "solution": "做模板时一律用主题色；标准色不参与主题联动"}, {"problem": "样式越用越乱", "cause": "自定义样式起名随意、无人维护", "solution": "样式名写清用途（如\"公司标题-16号蓝\"），定期清理无用样式"}, {"problem": "语义样式只靠颜色传达信息", "cause": "色盲用户无法区分红绿", "solution": "颜色之外保留文字（好/差/及格），不要只用颜色做唯一信号"}], "exercises": ["B2:B6 是 95、88、92、58、76，=COUNTIF(B2:B6,\">=90\") 的结果是多少？哪两个数被数进去了？", "套用表格格式与 Ctrl + T 创建超级表有什么区别？", "为什么做公司模板要用主题色而不是标准色？"], "answers": ["结果 2，数进去的是 95 与 92。88、58、76 都小于 90。", "前者只刷格式（边框、隔行色），不带筛选与结构化引用；后者是结构化表格，带筛选箭头、汇总行与结构化引用。", "主题色随主题联动：换一次主题色，全表用主题色的地方自动跟着变；标准色不变，换 VI 时要逐格改。"], "versions": "Excel 2016／2019／2021／365"}, {"id": "formatting-05-tables", "group": "formatting", "column": "C02", "level2": "C02-L2-5", "title": "超级表：创建、结构化引用、表样式与汇总行", "level": "进阶", "body": "**超级表（结构化表格）**：`Ctrl + T` 创建的带格式、带筛选、带结构化引用的智能表格。它与普通区域的根本区别是\"表知道自己的边界\"：新增一行，格式、公式、汇总行自动扩展；删除一行，引用自动收缩。\n\n**结构化引用**：超级表里的公式不用 `B2:B6` 这种地址，改用表名加列名，如 `=SUM(表1[金额])`。好处是公式自带语义（\"对表 1 的金额列求和\"），新增行后引用范围自动扩大，不用改公式；跨表引用时也不怕插行错位。\n\n**表样式与汇总行**：表设计选项卡可换样式、开关筛选按钮、开关首行/末行、开汇总行。汇总行在表底加一行，每列可下拉选求和、计数、平均值、最大值等，一键出合计，不用手写公式。\n\n**表名管理**：表名默认是\"表1\"、\"表2\"，应在表设计选项卡改成有意义的名字（如\"销售明细\"），结构化引用才可读。表名不能与单元格地址重名（如不能叫 A1），不能含空格。\n\n**与数据管理的分工**：超级表本身归属本栏目（C02-L2-5）；数据管理栏目（C05-L2-3）只做交叉引用，不重复建内容。排序筛选、数据清洗在超级表上操作与普通区域一致，但体验更好（筛选箭头常驻、新增行自动纳入）。", "steps": ["创建：点数据区内任一格，按 `Ctrl + T`，确认\"表包含标题\"已勾选，点确定；或插入→表格。", "改名：选中表内任一格，表设计→表名称，改成\"销售明细\"这类有意义的名字。", "写结构化引用：在汇总格输入 `=SUM(销售明细[金额])`，输入表名后按 `[` 会自动提示列名，Tab 选中。", "开汇总行：表设计→勾选\"汇总行\"，表底出现一行，每列点下拉选求和/计数/平均值。", "换样式：表设计→表样式，选一个样式；勾选\"镶边行\"得隔行变色，勾选\"首行\"加粗表头。", "转回普通区域：表设计→转换为区域（结构化引用会变成普通地址引用，汇总行保留为数值行，需确认）。"], "sections": [{"title": "2. 基础概念", "body": "**超级表（结构化表格）**：`Ctrl + T` 创建的带格式、带筛选、带结构化引用的智能表格。它与普通区域的根本区别是\"表知道自己的边界\"：新增一行，格式、公式、汇总行自动扩展；删除一行，引用自动收缩。\n\n**结构化引用**：超级表里的公式不用 `B2:B6` 这种地址，改用表名加列名，如 `=SUM(表1[金额])`。好处是公式自带语义（\"对表 1 的金额列求和\"），新增行后引用范围自动扩大，不用改公式；跨表引用时也不怕插行错位。\n\n**表样式与汇总行**：表设计选项卡可换样式、开关筛选按钮、开关首行/末行、开汇总行。汇总行在表底加一行，每列可下拉选求和、计数、平均值、最大值等，一键出合计，不用手写公式。\n\n**表名管理**：表名默认是\"表1\"、\"表2\"，应在表设计选项卡改成有意义的名字（如\"销售明细\"），结构化引用才可读。表名不能与单元格地址重名（如不能叫 A1），不能含空格。\n\n**与数据管理的分工**：超级表本身归属本栏目（C02-L2-5）；数据管理栏目（C05-L2-3）只做交叉引用，不重复建内容。排序筛选、数据清洗在超级表上操作与普通区域一致，但体验更好（筛选箭头常驻、新增行自动纳入）。"}, {"title": "4. 图文示例", "body": "销售明细表（A 列日期、B 列销售员、C 列金额，共 5 行，金额 1200、980、1500、640、540）：`Ctrl + T` 创建超级表并改名\"销售明细\"；汇总行对金额列选\"求和\"得 4860；旁边写 `=SUM(销售明细[金额])` 同样得 4860，两处互相核对；新增一行（张三、11 月 9 日、700），汇总行与结构化引用自动变成 5560，不用改任何公式。\n\n（截图位：待补图）"}], "source": "docs/formatting/05-tables.md", "updated": "2026-11-09", "objectives": ["用 Ctrl + T 把普通区域转成超级表，并给表起一个有意义的名字", "读懂并写出结构化引用（如 表1[金额]、表1[[#汇总],[金额]]）", "用汇总行一键求和、计数、求平均，并用切片器筛选超级表", "知道超级表新增行时公式与格式自动扩展，替代手工拖公式"], "formulas": ["=SUM(销售明细[金额]) → 4860", "=AVERAGE(销售明细[金额]) → 972", "=COUNTIF(销售明细[销售员],\"张三\") → 2", "- `=SUM(销售明细[金额])` → 4860：结构化引用求和：1200+980+1500+640+540=4860；新增行后自动纳入", "- `=AVERAGE(销售明细[金额])` → 972：4860÷5=972，金额列平均值", "- `=COUNTIF(销售明细[销售员],\"张三\")` → 2：示例中张三出现 2 次；结构化引用同样适用于 COUNTIF 等条件函数"], "scenarios": [{"title": "每天追加的销售流水", "body": "流水每天新增几十行：做成超级表后，汇总行的合计与旁边的结构化引用公式自动包含新行，透视表的数据源设为表名后刷新即含新数据。普通区域每次都要改引用范围，迟早漏一次。"}, {"title": "多人协作的台账", "body": "表名即文档：公式里写 `销售明细[金额]`，接手的人不用猜 B 列是什么。表头重命名后公式里的列名自动跟着改，不会断链。"}], "pitfalls": [{"problem": "结构化引用公式报错 #NAME?", "cause": "表名含空格或与单元格地址重名", "solution": "表名用无空格的名字（如\"销售明细\"不要用\"销售 明细\"），不要叫 A1、R1C1 这类地址"}, {"problem": "新增行后公式没跟上", "cause": "新增的行不在表内（空了一行再写）", "solution": "紧贴表底最后一行新增，或直接在汇总行上方插入行；空行会断开表的扩展"}, {"problem": "汇总行求和结果不对", "cause": "金额列混入了文本型数字", "solution": "文本数字不参与求和：先分列或乘 1 转数值，再看汇总行"}, {"problem": "想取消超级表但公式全断了", "cause": "直接删表或清格式", "solution": "用表设计→转换为区域，结构化引用会转回普通地址，公式不断"}], "exercises": ["金额列 1200、980、1500、640、540，用结构化引用写求和与求平均公式，结果各是多少？新增一行 700 后求和变多少？", "超级表与普通区域的根本区别是什么？说出两点。", "表名为什么不能叫 A1、不能含空格？"], "answers": ["求和 `=SUM(销售明细[金额])` → 4860；平均 `=AVERAGE(销售明细[金额])` → 972。新增 700 后求和自动变 5560（4860+700）。", "表知道自己的边界：新增行格式与公式自动扩展；引用用结构化引用（表名+列名），新增行自动纳入。", "A1 会与单元格地址冲突，Excel 无法区分；空格会让结构化引用解析失败。改名用无空格的有意义名字。"], "versions": "Excel 2016／2019／2021／365"}, {"id": "formulas-01-formula-basics", "group": "formulas", "column": "C03", "level2": "C03-L2-1", "title": "公式入门：公式结构、运算符与输入编辑", "level": "入门", "body": "**公式结构**：所有公式都以 `=` 开头，如 `=B2+C2`。等号后面是操作数（数字、单元格引用、函数结果）与运算符的组合。`SUM`、`IF` 这类现成的计算单元叫函数，写法是 `函数名(参数1, 参数2)`，参数之间用英文逗号分隔。\n\n**运算符三类**：算术运算符 `+ - * / % ^`（加减乘除、百分号、乘方）；比较运算符 `= > < >= <= <>`（返回 TRUE 或 FALSE）；文本连接符 `&`（把两段文本拼成一段，如 `=A2&\"部\"`）。优先级：括号最先，接着乘方、乘除、加减，最后是连接与比较；记不住就加括号，括号永远最优先。\n\n**公式与结果**：单元格显示的是计算结果，编辑栏显示的是公式本身。双击单元格或按 `F2` 可进入编辑状态，光标定位到公式末尾；按 `Esc` 放弃修改，按 `Enter` 确认。公式→显示公式（`Ctrl + ``，反引号键）可让全表显示公式而不是结果，检查时用它。\n\n**相对引用入门**：公式里的 `B2` 是相对引用，复制到下一行会自动变成 `B3`，复制到右一列会变成 `C2`。这是公式能\"一写多用\"的关键；想让它不跟着变，见下一篇引用方式（加 `$` 锁定）。\n\n**常见第一错**：公式不以 `=` 开头（直接写 `SUM(B2:B10)` 只会显示文本）；用了中文括号 `（）` 或中文逗号 `，`（Excel 只认英文半角符号）；单元格是文本格式，公式被当文本显示（改回常规格式后双击回车重新确认）。", "steps": ["输入第一个公式：点 C2 输入 `=B2*2` 回车，C2 显示结果；再点 C2 看编辑栏，确认公式本身是 `=B2*2`。", "复制公式：选中 C2，拖填充柄向下到 C6，各行自动变成 `=B3*2`、`=B4*2`……（相对引用自动递增）。", "用函数求和：在 C7 输入 `=SUM(C2:C6)`，或点 C7 后按 `Alt + =` 自动求和。", "检查公式：公式→显示公式（或按 `Ctrl + ``）切换全表显示公式，核对每行引用是否正确，再按一次切回结果。", "改公式：双击单元格或按 `F2`，改完按 `Enter`；改错了按 `Esc` 放弃、按 `Ctrl + Z` 撤销。", "固定结果：公式算好后如需发给别人，复制区域→右键→选择性粘贴→数值，把公式变成结果值，防止对方改动源数据后结果跟着变。"], "sections": [{"title": "2. 基础概念", "body": "**公式结构**：所有公式都以 `=` 开头，如 `=B2+C2`。等号后面是操作数（数字、单元格引用、函数结果）与运算符的组合。`SUM`、`IF` 这类现成的计算单元叫函数，写法是 `函数名(参数1, 参数2)`，参数之间用英文逗号分隔。\n\n**运算符三类**：算术运算符 `+ - * / % ^`（加减乘除、百分号、乘方）；比较运算符 `= > < >= <= <>`（返回 TRUE 或 FALSE）；文本连接符 `&`（把两段文本拼成一段，如 `=A2&\"部\"`）。优先级：括号最先，接着乘方、乘除、加减，最后是连接与比较；记不住就加括号，括号永远最优先。\n\n**公式与结果**：单元格显示的是计算结果，编辑栏显示的是公式本身。双击单元格或按 `F2` 可进入编辑状态，光标定位到公式末尾；按 `Esc` 放弃修改，按 `Enter` 确认。公式→显示公式（`Ctrl + ``，反引号键）可让全表显示公式而不是结果，检查时用它。\n\n**相对引用入门**：公式里的 `B2` 是相对引用，复制到下一行会自动变成 `B3`，复制到右一列会变成 `C2`。这是公式能\"一写多用\"的关键；想让它不跟着变，见下一篇引用方式（加 `$` 锁定）。\n\n**常见第一错**：公式不以 `=` 开头（直接写 `SUM(B2:B10)` 只会显示文本）；用了中文括号 `（）` 或中文逗号 `，`（Excel 只认英文半角符号）；单元格是文本格式，公式被当文本显示（改回常规格式后双击回车重新确认）。"}, {"title": "4. 图文示例", "body": "工资表示例：A 列姓名，B 列基本工资（5000、6000、5500、7000、6500），C 列绩效系数（1.1、1.0、1.2、1.0、1.1）。D2 输入 `=B2*C2` 得 5500，拖填充柄到 D6 得 6000、6600、7000、7150；D7 用 `=SUM(D2:D6)` 得 32250；D8 用 `=AVERAGE(D2:D6)` 得 6450。核对：5500+6000+6600+7000+7150=32250，32250÷5=6450。\n\n（截图位：待补图）"}], "source": "docs/formulas/01-formula-basics.md", "updated": "2026-11-09", "objectives": ["说出公式的四个组成部分（等号、操作数、运算符、函数），并用 = 开头输入公式", "正确使用算术、比较、文本连接三类运算符，并说出运算优先级", "区分公式与结果：编辑栏看公式、单元格看结果，双击或按 F2 编辑公式", "用公式审核的\"显示公式\"与\"追踪引用单元格\"快速检查公式"], "formulas": ["=B2*C2 → 5500（B2=5000，C2=1.1 时）", "=SUM(D2:D6) → 32250", "=AVERAGE(D2:D6) → 6450", "=B2&\"部\" → 销售部（B2=销售时）", "- `=B2*C2` → 5500：5000×1.1=5500，实发工资=基本工资×绩效系数", "- `=SUM(D2:D6)` → 32250：5500+6000+6600+7000+7150=32250，五人实发合计", "- `=AVERAGE(D2:D6)` → 6450：32250÷5=6450，人均实发", "- `=B2&\"部\"` → 销售部：& 连接文本：\"销售\"+\"部\"拼成\"销售部\""], "scenarios": [{"title": "销售提成表", "body": "销售额在 B 列，提成比例 5% 写在 E1。C2 写 `=B2*$E$1`（E1 要锁定，见引用方式篇），拖填充柄全员一次算完；月底比例改成 6% 时只改 E1，全表跟着变。"}, {"title": "成绩单：总分与平均分", "body": "语文、数学、英语在 B、C、D 列，E 列 `=SUM(B2:D2)` 求总分，F 列 `=AVERAGE(B2:D2)` 求平均分。拖填充柄一次完成全班，公式→显示公式检查一遍引用无错位。"}], "pitfalls": [{"problem": "公式显示为文本不计算", "cause": "没以 = 开头，或单元格是文本格式", "solution": "补 =；或改回常规格式后双击单元格回车重新确认"}, {"problem": "公式里出现中文括号或中文逗号", "cause": "输入法是中文状态", "solution": "切英文输入法重输；公式体检工具可批量查全角符号"}, {"problem": "复制公式后结果全一样", "cause": "引用被 $ 锁死了（绝对引用）", "solution": "去掉不需要的 $；相对引用才随复制递增"}, {"problem": "结果是 #VALUE!", "cause": "文本参与了数值运算", "solution": "检查参与运算的格有没有文本型数字；用分列或乘 1 转数值"}, {"problem": "按 Enter 后光标乱跑", "cause": "不知道 Enter 是下移、Tab 是右移", "solution": "Enter 下移一格、Shift+Enter 上移、Tab 右移、Shift+Tab 左移"}], "exercises": ["B2=5000，C2=1.1，D2 写 =B2*C2，结果是多少？拖到 D6 后 D6 的公式是什么（假设 D6 对应 B6、C6）？", "D2:D6 是 5500、6000、6600、7000、7150，求和与平均值各是多少？写出公式与结果。", "公式 `=SUM(B2:B10)` 直接写成 `SUM(B2:B10)`（没有等号）会怎样？"], "answers": ["结果 5500。D6 的公式是 =B6*C6（相对引用随行递增）。", "求和 `=SUM(D2:D6)` → 32250；平均 `=AVERAGE(D2:D6)` → 6450。", "Excel 会把它当文本显示，不计算。所有公式必须以 = 开头。"], "versions": "Excel 2016／2019／2021／365", "file": "数据-函数练习题.xlsx"}, {"id": "formulas-02-references", "group": "formulas", "column": "C03", "level2": "C03-L2-2", "title": "引用方式：相对引用、绝对引用、混合引用与跨表引用", "level": "入门", "body": "**相对引用**：`B2` 这样不带 `$` 的引用。公式复制到别处时，引用跟着目标位置同步移动：下移一行变 `B3`，右移一列变 `C2`。它是公式\"一写多用\"的基础。\n\n**绝对引用**：`$B$2`，行列都锁定。公式复制到任何地方都指向 B2 不变。适用场景：引用某个固定参数格（如税率、提成比例、单价），全表共用一个格。\n\n**混合引用**：`$B2`（锁列不锁行）或 `B$2`（锁行不锁列）。乘法表是经典场景：行标题在 A 列、列标题在第 1 行，公式 `=$A2*B$1` 往右拖时 A 列锁定、往下拖时第 1 行锁定，一张乘法表一个公式搞定。\n\n**F4 切换**：编辑公式时光标放在引用上，按 `F4` 循环切换 `B2` → `$B$2` → `B$2` → `$B2` → `B2`。记住顺序，锁引用不用手敲 `$`。\n\n**跨表引用**：引用其他工作表的单元格，写法是 `表名!地址`，如 `='11月'!C10`。表名含中文或空格时必须加单引号。跨工作簿引用还要带工作簿名，如 `[报表.xlsx]11月!C10`，源文件改名或移动后链接会断，慎用。\n\n**三维引用**：对多个连续工作表的同一位置求和，如 `=SUM(一月:三月!B2)`，表示一月到三月这三张表 B2 的和。要求各表结构完全一致，适合\"每月一张表、结构相同\"的汇总场景。", "steps": ["写相对引用：D2 输入 `=B2*C2`，拖填充柄向下，各行自动递增；这是默认行为，不用加任何符号。", "写绝对引用：提成比例在 E1，C2 输入 `=B2*$E$1`（光标放在 E1 上按一次 F4 变成 $E$1），再拖填充柄，E1 始终不变。", "写混合引用：做 9×9 乘法表，B2 输入 `=$A2*B$1`，向右、向下拖满，行标题与列标题各锁一维。", "跨表引用：在汇总表输入 `=` 后直接点另一张表的单元格回车，Excel 自动写出 `='11月'!C10` 这样的引用，不用手敲表名。", "三维引用：汇总表输入 `=SUM(一月:三月!B2)`，一月到三月三张表 B2 相加；增删中间月份表时范围自动变化。", "检查引用：公式→追踪引用单元格，看箭头指向的格是不是你想要的；箭头指错就是引用锁错了。"], "sections": [{"title": "2. 基础概念", "body": "**相对引用**：`B2` 这样不带 `$` 的引用。公式复制到别处时，引用跟着目标位置同步移动：下移一行变 `B3`，右移一列变 `C2`。它是公式\"一写多用\"的基础。\n\n**绝对引用**：`$B$2`，行列都锁定。公式复制到任何地方都指向 B2 不变。适用场景：引用某个固定参数格（如税率、提成比例、单价），全表共用一个格。\n\n**混合引用**：`$B2`（锁列不锁行）或 `B$2`（锁行不锁列）。乘法表是经典场景：行标题在 A 列、列标题在第 1 行，公式 `=$A2*B$1` 往右拖时 A 列锁定、往下拖时第 1 行锁定，一张乘法表一个公式搞定。\n\n**F4 切换**：编辑公式时光标放在引用上，按 `F4` 循环切换 `B2` → `$B$2` → `B$2` → `$B2` → `B2`。记住顺序，锁引用不用手敲 `$`。\n\n**跨表引用**：引用其他工作表的单元格，写法是 `表名!地址`，如 `='11月'!C10`。表名含中文或空格时必须加单引号。跨工作簿引用还要带工作簿名，如 `[报表.xlsx]11月!C10`，源文件改名或移动后链接会断，慎用。\n\n**三维引用**：对多个连续工作表的同一位置求和，如 `=SUM(一月:三月!B2)`，表示一月到三月这三张表 B2 的和。要求各表结构完全一致，适合\"每月一张表、结构相同\"的汇总场景。"}, {"title": "4. 图文示例", "body": "提成表示例：B2:B6 是销售额 10000、20000、15000、30000、25000，提成比例 5% 写在 E1。C2 写 `=B2*$E$1` 得 500，拖到 C6 得 1000、750、1500、1250，合计 `=SUM(C2:C6)` 得 5000。验算：销售额合计 100000×5%=5000，与提成合计一致。反例：C2 写 `=B2*E1` 再拖，C3 会变成 `=B3*E2`（E2 是空值当 0），提成全变 0——这就是没锁定的后果。\n\n（截图位：待补图）"}], "source": "docs/formulas/02-references.md", "updated": "2026-11-09", "objectives": ["说出相对引用、绝对引用、混合引用的区别，并用 $ 正确锁定行或列", "用 F4 在四种引用状态间快速切换", "写出跨表引用与跨工作簿引用，并理解三维引用的适用场景", "诊断\"复制公式后结果错位\"，定位是引用没锁对"], "formulas": ["=B2*$E$1 → 500（B2=10000，E1=5% 时）", "=SUM(C2:C6) → 5000", "=$A2*B$1 → 6（A2=2，B1=3 时）", "=SUM(一月:三月!B2) → 三张表 B2 之和", "- `=B2*$E$1` → 500：10000×0.05=500；$E$1 绝对引用，复制到 C6 仍指向 E1", "- `=SUM(C2:C6)` → 5000：500+1000+750+1500+1250=5000；与销售额合计 100000×5% 互相核对", "- `=$A2*B$1` → 6：混合引用：$A2 锁列、 B$1 锁行，乘法表一公式通用", "- `=SUM(一月:三月!B2)` → 三张表 B2 之和：三维引用：对一月、二月、三月三张表同一位置求和"], "scenarios": [{"title": "提成比例月中调整", "body": "比例只写在 E1 一个格，全表公式都引用 `$E$1`。月中比例从 5% 调到 6%，只改 E1，全表提成自动重算——这就是绝对引用的价值：参数单点存放。"}, {"title": "12 个月汇总表", "body": "每月一张表、结构相同，汇总表用三维引用 `=SUM(一月:十二月!B2)` 一次加总 12 张表。某月表插到中间，范围自动包含；表名改了要同步改公式。"}], "pitfalls": [{"problem": "复制公式后结果全变 0", "cause": "参数格没锁定，引用跟着跑到了空格", "solution": "参数格用 $E$1 绝对引用；复制后用追踪引用单元格检查箭头"}, {"problem": "F4 按了没反应", "cause": "光标不在引用上，或在输入中文时按的", "solution": "编辑公式时把光标放在引用字母上再按 F4；每按一次变一种状态"}, {"problem": "跨表引用显示 #REF!", "cause": "被引用的表被删或改名了", "solution": "恢复表名或重建引用；删表前用追踪从属单元格检查谁在引用它"}, {"problem": "混合引用锁反了", "cause": "$A2 与 A$2 搞混", "solution": "$ 在谁前面就锁谁：$A2 锁列 A，A$2 锁行 2；乘法表行标题锁列、列标题锁行"}], "exercises": ["B2:B6 是 10000、20000、15000、30000、25000，E1 是 5%，C2 写 =B2*$E$1，C6 的公式与结果各是什么？提成合计是多少？", "乘法表 B2 写 =$A2*B$1（A2=2，B1=3），结果是多少？向右拖一格后公式变成什么？", "汇总表要引用\"11月\"表的 C10，正确的写法是什么？表名什么时候要加单引号？"], "answers": ["C6 公式是 =B6*$E$1，结果 1250（25000×5%）。提成合计 =SUM(C2:C6) → 5000。", "结果 6。向右拖一格变成 =$A2*C$1（列锁定 A 不变，行锁定的第 1 行不变，未锁定的列 B→C）。", "写法 `='11月'!C10`。表名含中文、空格或特殊字符时要加单引号；纯英文数字表名可不加，但加上也不错。"], "versions": "Excel 2016／2019／2021／365", "file": "数据-函数练习题.xlsx"}, {"id": "formulas-03-names", "group": "formulas", "column": "C03", "level2": "C03-L2-3", "title": "名称与定义：定义名称、名称管理器与动态名称", "level": "进阶", "body": "**名称**：给单元格或区域起一个名字，如把 E1 命名为\"提成比例\"，公式写 `=B2*提成比例`，比 `=B2*$E$1` 好读得多。名称是工作簿级的：全工作簿任何一张表都能用同一个名称。\n\n**定义名称**：选中单元格或区域，公式→定义名称，输入名字、确认引用范围。命名规则：不能与单元格地址重名（如 A1、B2），不能含空格（用下划线代替），不能以数字开头。名字里用\"税率\"、\"提成比例\"这类业务词，公式立刻自带文档。\n\n**名称管理器**：公式→名称管理器，列出全部名称：名字、引用位置、范围。改引用、改名字、删名称都在这里；名称引用错了（如指向了被删的表）会在这里显示 `#REF!`，是排查断链的第一站。\n\n**名称框快捷定义**：选中区域后点左上角名称框，直接输入名字回车，即完成定义——比打开对话框更快。输入已定义名称回车，可瞬间跳转到该区域。\n\n**动态名称**：引用范围会自己变长的名称。经典写法是用 OFFSET：`=OFFSET($A$2,0,0,COUNTA($A:$A)-1,1)`，表示\"从 A2 开始、高度等于 A 列非空数减 1\"，A 列新增一行，名称范围自动加一行。更稳妥的写法是用 INDEX：`= $A$2:INDEX($A:$A,COUNTA($A:$A))`，INDEX 是非易失性函数，不会每次重算全表。\n\n**适用边界**：参数格（税率、比例、单价）、反复引用的关键区域适合定义名称；一次性引用、局部小范围没必要命名。名称太多会增加维护成本，名称管理器里超过 20 个就要定期清理。", "steps": ["定义名称：选中 E1（提成比例 5%），公式→定义名称，名字填\"提成比例\"，点确定；或点名称框输入\"提成比例\"回车。", "在公式里用名称：C2 输入 `=B2*提成比例`，回车得 500；拖填充柄，全表通用。", "查看与管理：公式→名称管理器，看名称列表；点某名称可改引用范围；点删除可删名称（删前确认没有公式在用它）。", "定义动态名称：公式→定义名称，名字填\"销售数据\"，引用位置输入 `=$A$2:INDEX($A:$A,COUNTA($A:$A))`，点确定。", "验证动态范围：在名称框输入\"销售数据\"回车，看选中区域是否随 A 列增减自动变化；新增一行后重进名称框再验证一次。", "公式里用动态名称：`=SUM(销售数据)`，A 列新增数据后求和自动包含新行，不用改公式。"], "sections": [{"title": "2. 基础概念", "body": "**名称**：给单元格或区域起一个名字，如把 E1 命名为\"提成比例\"，公式写 `=B2*提成比例`，比 `=B2*$E$1` 好读得多。名称是工作簿级的：全工作簿任何一张表都能用同一个名称。\n\n**定义名称**：选中单元格或区域，公式→定义名称，输入名字、确认引用范围。命名规则：不能与单元格地址重名（如 A1、B2），不能含空格（用下划线代替），不能以数字开头。名字里用\"税率\"、\"提成比例\"这类业务词，公式立刻自带文档。\n\n**名称管理器**：公式→名称管理器，列出全部名称：名字、引用位置、范围。改引用、改名字、删名称都在这里；名称引用错了（如指向了被删的表）会在这里显示 `#REF!`，是排查断链的第一站。\n\n**名称框快捷定义**：选中区域后点左上角名称框，直接输入名字回车，即完成定义——比打开对话框更快。输入已定义名称回车，可瞬间跳转到该区域。\n\n**动态名称**：引用范围会自己变长的名称。经典写法是用 OFFSET：`=OFFSET($A$2,0,0,COUNTA($A:$A)-1,1)`，表示\"从 A2 开始、高度等于 A 列非空数减 1\"，A 列新增一行，名称范围自动加一行。更稳妥的写法是用 INDEX：`= $A$2:INDEX($A:$A,COUNTA($A:$A))`，INDEX 是非易失性函数，不会每次重算全表。\n\n**适用边界**：参数格（税率、比例、单价）、反复引用的关键区域适合定义名称；一次性引用、局部小范围没必要命名。名称太多会增加维护成本，名称管理器里超过 20 个就要定期清理。"}, {"title": "4. 图文示例", "body": "提成表示例：E1 是 5%，定义名称\"提成比例\"；B2:B6 是销售额 10000、20000、15000、30000、25000。C2 写 `=B2*提成比例` 得 500，拖到 C6 得 1000、750、1500、1250，合计 5000。A 列销售数据定义动态名称\"销售数据\"后，`=COUNTA(销售数据)` 随新增行自动从 5 变 6。\n\n（截图位：待补图）"}], "source": "docs/formulas/03-names.md", "updated": "2026-11-09", "objectives": ["给单元格与区域定义名称，并在公式里用名称代替地址", "用名称管理器查看、编辑与删除已定义名称", "用 OFFSET 或 INDEX 定义动态名称，让引用范围随数据增减自动扩展", "判断名称与直接引用的适用边界：什么时候用名称、什么时候不用"], "formulas": ["=B2*提成比例 → 500（B2=10000，提成比例=5% 时）", "=SUM(销售数据) → 随 A 列增减自动变化", "=COUNTA(销售数据) → 5（A 列 5 条数据时）", "- `=B2*提成比例` → 500：名称代替地址：10000×0.05=500，公式自带业务语义", "- `=SUM(销售数据)` → 随 A 列增减自动变化：动态名称求和：A 列新增一行，求和范围自动扩大", "- `=COUNTA(销售数据)` → 5：动态名称计数：A2:A6 共 5 条，新增一行后变 6"], "scenarios": [{"title": "给领导看的测算模型", "body": "税率、折扣、汇率三个参数格各定义名称，公式里全用名称。领导问\"税率改成 13% 会怎样\"，只改参数格，全模型联动；公式本身不用解释，名称就是注释。"}, {"title": "每天追加的流水表", "body": "流水列定义动态名称，透视表与图表的数据源引用该名称。每天追加行后刷新即含新数据，不用每月改一次数据源范围。"}], "pitfalls": [{"problem": "名称在公式里报 #NAME?", "cause": "名称含空格、与地址重名，或定义在别的工作簿", "solution": "名称不用空格、不用 A1 这类地址名；跨工作簿名称要带工作簿名引用"}, {"problem": "动态名称范围没变", "cause": "COUNTA 数错了：A 列有标题行或空行", "solution": "公式里减去标题行（COUNTA-1）；A 列中间不要留空行"}, {"problem": "删了名称公式全报错", "cause": "公式还在引用已删的名称", "solution": "先在名称管理器看引用，再删；或用查找替换把名称批量换回地址"}, {"problem": "OFFSET 动态名称让表变卡", "cause": "OFFSET 是易失性函数，任何改动都触发重算", "solution": "改用 INDEX 写法定义动态名称，非易失性，不拖慢全表"}], "exercises": ["E1 是 5% 已定义名称\"提成比例\"，B2=10000，写公式算提成并给出结果；如果把名称删了，公式会怎样？", "A 列有标题行 A1 与 5 条数据 A2:A6，用 INDEX 写动态名称\"销售数据\"的引用位置，并说明 COUNTA 要不要减 1。", "名称不能怎么起？说出两条命名规则。"], "answers": ["公式 `=B2*提成比例` → 500。删名称后公式报 #NAME?，因为引用不到定义。", "引用位置 `=$A$2:INDEX($A:$A,COUNTA($A:$A))`。A 列非空数是 6（含标题），INDEX 行号取 6 即 A6；从 A2 开始共 5 行，不用减 1——因为起始行已是 A2。", "不能与单元格地址重名（如 A1）；不能含空格；不能以数字开头。"], "versions": "Excel 2016／2019／2021／365", "file": "数据-函数练习题.xlsx"}, {"id": "formulas-05-auditing", "group": "formulas", "column": "C03", "level2": "C03-L2-5", "title": "公式审核与调试：追踪引用、公式求值与错误检查", "level": "进阶", "body": "**追踪引用单元格**：选中一个公式格，公式→追踪引用单元格，箭头从它引用的格指向它。箭头指错地方，就是引用错了。**追踪从属单元格**反过来：箭头从它指向引用它的公式格，删格、删行前先看它，知道谁会受影响。\n\n**公式求值**：公式→公式求值，打开逐步求值窗口，每点一次\"求值\"就算一步，能看到 `VLOOKUP` 的查找值、`IF` 的条件判断、`SUM` 的求和范围每一步的中间结果。公式结果不对但不知道哪一步错时，用它逐段定位。\n\n**错误检查**：公式→错误检查，逐个扫描全表的错误值（#VALUE!、#N/A、#REF! 等），每个错误给\"帮助\"、\"显示计算步骤\"、\"忽略错误\"等选项。左上角绿色小三角就是错误检查的标记：有三角不一定真有错，可能是\"公式与相邻公式不一致\"这类提醒。\n\n**监视窗口**：公式→监视窗口，把关键结果格（如合计、税率）加进去，窗口常驻显示它们的当前值。改动源数据时不用翻页找合计格，在监视窗口直接看变化。\n\n**显示公式**：公式→显示公式（`Ctrl + ``），全表切换显示公式文本而非结果。检查引用、核对公式结构时用它；检查完再按一次切回。\n\n**定位条件找问题格**：`F5`→定位条件→公式/常量，可一次选中全表所有公式格或所有文本格。\"看起来是数、实际是文本\"的格（左上角绿三角、左对齐显示）最适合这样批量找出来。", "steps": ["追踪引用：点结果异常的公式格，公式→追踪引用单元格，看箭头指向的源格对不对；点\"移去箭头\"清除。", "追踪从属：点要删除的源数据格，公式→追踪从属单元格，看哪些公式在用它；确认无误再删。", "公式求值：点算错的公式格，公式→公式求值，反复点\"求值\"，看到哪一步的中间结果与预期不符，问题就在那一步。", "错误检查：公式→错误检查→错误检查，逐个过全表错误；每个错误看提示再决定修还是忽略。", "监视关键格：公式→监视窗口→添加监视，选中合计格与参数格；改动数据时在窗口里实时看合计变化。", "显示公式核对：按 `Ctrl + `` 显示全表公式，逐列核对引用范围有没有错位（如 SUM 范围少了一行），核对完再按一次切回。"], "sections": [{"title": "2. 基础概念", "body": "**追踪引用单元格**：选中一个公式格，公式→追踪引用单元格，箭头从它引用的格指向它。箭头指错地方，就是引用错了。**追踪从属单元格**反过来：箭头从它指向引用它的公式格，删格、删行前先看它，知道谁会受影响。\n\n**公式求值**：公式→公式求值，打开逐步求值窗口，每点一次\"求值\"就算一步，能看到 `VLOOKUP` 的查找值、`IF` 的条件判断、`SUM` 的求和范围每一步的中间结果。公式结果不对但不知道哪一步错时，用它逐段定位。\n\n**错误检查**：公式→错误检查，逐个扫描全表的错误值（#VALUE!、#N/A、#REF! 等），每个错误给\"帮助\"、\"显示计算步骤\"、\"忽略错误\"等选项。左上角绿色小三角就是错误检查的标记：有三角不一定真有错，可能是\"公式与相邻公式不一致\"这类提醒。\n\n**监视窗口**：公式→监视窗口，把关键结果格（如合计、税率）加进去，窗口常驻显示它们的当前值。改动源数据时不用翻页找合计格，在监视窗口直接看变化。\n\n**显示公式**：公式→显示公式（`Ctrl + ``），全表切换显示公式文本而非结果。检查引用、核对公式结构时用它；检查完再按一次切回。\n\n**定位条件找问题格**：`F5`→定位条件→公式/常量，可一次选中全表所有公式格或所有文本格。\"看起来是数、实际是文本\"的格（左上角绿三角、左对齐显示）最适合这样批量找出来。"}, {"title": "4. 图文示例", "body": "求和结果少算了：D7 的 `=SUM(D2:D6)` 结果是 4000，但手算应是 5000。追踪引用单元格看箭头：D2:D6 的范围没问题；公式求值逐步看：D4 的值是 0——点 D4 看编辑栏，里面是文本\"1000\"（带前导单引号，左对齐）。文本不参与求和，所以少了 1000。修复：D4 分列或乘 1 转数值，求和恢复 5000。教训：求和少算先查文本型数字。\n\n（截图位：待补图）"}], "source": "docs/formulas/05-auditing.md", "updated": "2026-11-09", "objectives": ["用追踪引用单元格与追踪从属单元格画出公式的来龙去脉", "用公式求值一步步看公式的中间结果，定位算错的那一步", "用错误检查与监视窗口批量排查全表的公式错误", "用显示公式与定位条件快速找到\"看起来是数、实际是文本\"的单元格"], "formulas": ["=SUM(D2:D6) → 5000（修复文本数字后）", "=IFERROR(VLOOKUP(A2,表1!A:B,2,0),\"未找到\") → 未找到（A2 不在表1时）", "- `=SUM(D2:D6)` → 5000：D4 文本\"1000\"转数值后，500+1000+750+1500+1250=5000，恢复正确", "- `=IFERROR(VLOOKUP(A2,表1!A:B,2,0),\"未找到\")` → 未找到：IFERROR 兜底：VLOOKUP 报错时显示\"未找到\"而不是 #N/A，便于排查是数据缺失还是公式写错"], "scenarios": [{"title": "接手一张公式全乱的旧表", "body": "先按 `Ctrl + `` 显示全表公式，逐列看引用范围；再用错误检查扫一遍全表错误；关键合计格加进监视窗口。修之前先备份一份，修完逐项核对合计值。"}, {"title": "VLOOKUP 查不到值", "body": "公式求值看查找值：A2 是\"张三 \"（带尾空格），表里是\"张三\"，空格导致匹配失败。用 TRIM 清空格或在公式里包一层 TRIM 再查。"}], "pitfalls": [{"problem": "公式结果错但不报错", "cause": "引用范围错位或文本型数字混入", "solution": "公式求值逐步定位；定位条件找文本格；追踪引用单元格看箭头"}, {"problem": "追踪箭头满屏都是", "cause": "多次追踪没清除", "solution": "公式→移去箭头→移去所有箭头，一次清干净"}, {"problem": "绿色小三角到处都是", "cause": "错误检查的提醒（如\"与相邻公式不一致\"）", "solution": "点格子看提示：真错就修，只是提醒可\"忽略错误\"；不要全表忽略"}, {"problem": "公式求值点不动", "cause": "选中的不是公式格", "solution": "先点含公式的单元格，再打开公式求值；文本格没有求值过程"}], "exercises": ["D2:D6 是 500、1000、750、1500、1250，但 =SUM(D2:D6) 只有 4000，最可能的原因是什么？用什么工具定位？", "要删除一格数据，删除前应该先看什么？用什么功能？", "公式结果不对但不报错，应该按什么顺序排查？"], "answers": ["某格是文本型数字（如 D4 的\"1000\"带前导单引号），SUM 会忽略文本。定位：公式求值逐步看中间值，或定位条件选中文本格检查。", "先用公式→追踪从属单元格，看哪些公式在引用它；确认影响后再删，避免删出 #REF!。", "（1）追踪引用单元格看箭头对不对；（2）公式求值逐步看哪一步中间结果错；（3）定位条件检查文本型数字。"], "versions": "Excel 2016／2019／2021／365"}, {"id": "formulas-06-advanced-tricks", "group": "formulas", "column": "C03", "level2": "C03-L2-6", "title": "高级公式技巧：LET、LAMBDA、嵌套与条件求和进阶", "level": "高级", "body": "**LET（2021／365）**：`LET(名字1, 值1, 名字2, 值2, 计算式)`，先定义、后计算。长公式里同一个子表达式出现多次时，用 LET 只算一次、起个名字，后面直接用名字。公式变短、变快、变好读。示例：`=LET(单价,B2,数量,C2,单价*数量)`。\n\n**LAMBDA（365 专属）**：`LAMBDA(参数, 计算式)`，定义一个自己的函数。` =LAMBDA(x, x*2)(5)` 返回 10。更实用的用法是先在名称管理器里把 LAMBDA 存成名称（如\"税额\"），以后全表像用内置函数一样调用 `=税额(10000)`。LAMBDA 配合 MAP、BYROW 等函数可对整列逐行计算，是 365 的高阶玩法。\n\n**嵌套的度**：IF 嵌套超过 3 层就难读难维护，优先换 IFS（2019／365）、SWITCH（2019／365）或 VLOOKUP/XLOOKUP 查表。嵌套不是炫技，少一层是一层。\n\n**SUMPRODUCT 多条件求和**：`=SUMPRODUCT((条件1)*(条件2)*求和区域)`，不用辅助列、不用数组三键。原理：条件相乘得 0/1 掩码，只有全满足的行是 1，再与求和区域相乘后加总。它是 SUMIFS 出现之前的通用解法，条件更灵活（可做或条件、可做不等式）。\n\n**文本拼接公式**：`&` 与 TEXT 函数配合可批量生成句子，如 `=A2&\"本月销售额\"&TEXT(B2,\"#,##0\")&\"元\"` 生成\"张三本月销售额12,000元\"。TEXT 的第二个参数是格式代码，与数字格式篇的自定义格式代码同一套写法。\n\n**版本红线**：LET 是 2021／365，LAMBDA 是 365 专属——写进模板前确认对方版本；旧版用户用辅助列＋普通公式实现同样结果，不要硬上新函数。", "steps": ["LET 入门：在 D2 输入 `=LET(单价,B2,数量,C2,单价*数量)`，回车得结果；再把公式里重复出现的子表达式抽成 LET 变量。", "LAMBDA 入门：在任意格输入 `=LAMBDA(x, x*1.13)(10000)` 验证返回 11300；再到名称管理器新建名称\"含税价\"，引用位置填 `=LAMBDA(x, x*1.13)`，以后用 `=含税价(10000)` 调用。", "SUMPRODUCT 多条件求和：`=SUMPRODUCT((A2:A100=\"销售部\")*(B2:B100>5000)*C2:C100)`，求销售部且金额大于 5000 的合计。", "文本拼接：`=A2&\"本月销售额\"&TEXT(B2,\"#,##0\")&\"元\"`，拖填充柄批量生成句子；TEXT 的格式代码控制千分位。", "嵌套改查表：把三层 IF 嵌套换成 IFS 或 VLOOKUP 查表，公式短一半；改完用公式求值逐项核对边界值。", "版本检查：公式用到 LET/LAMBDA 前，先确认文件使用者的版本；模板发给旧版用户时换成辅助列写法。"], "sections": [{"title": "2. 基础概念", "body": "**LET（2021／365）**：`LET(名字1, 值1, 名字2, 值2, 计算式)`，先定义、后计算。长公式里同一个子表达式出现多次时，用 LET 只算一次、起个名字，后面直接用名字。公式变短、变快、变好读。示例：`=LET(单价,B2,数量,C2,单价*数量)`。\n\n**LAMBDA（365 专属）**：`LAMBDA(参数, 计算式)`，定义一个自己的函数。` =LAMBDA(x, x*2)(5)` 返回 10。更实用的用法是先在名称管理器里把 LAMBDA 存成名称（如\"税额\"），以后全表像用内置函数一样调用 `=税额(10000)`。LAMBDA 配合 MAP、BYROW 等函数可对整列逐行计算，是 365 的高阶玩法。\n\n**嵌套的度**：IF 嵌套超过 3 层就难读难维护，优先换 IFS（2019／365）、SWITCH（2019／365）或 VLOOKUP/XLOOKUP 查表。嵌套不是炫技，少一层是一层。\n\n**SUMPRODUCT 多条件求和**：`=SUMPRODUCT((条件1)*(条件2)*求和区域)`，不用辅助列、不用数组三键。原理：条件相乘得 0/1 掩码，只有全满足的行是 1，再与求和区域相乘后加总。它是 SUMIFS 出现之前的通用解法，条件更灵活（可做或条件、可做不等式）。\n\n**文本拼接公式**：`&` 与 TEXT 函数配合可批量生成句子，如 `=A2&\"本月销售额\"&TEXT(B2,\"#,##0\")&\"元\"` 生成\"张三本月销售额12,000元\"。TEXT 的第二个参数是格式代码，与数字格式篇的自定义格式代码同一套写法。\n\n**版本红线**：LET 是 2021／365，LAMBDA 是 365 专属——写进模板前确认对方版本；旧版用户用辅助列＋普通公式实现同样结果，不要硬上新函数。"}, {"title": "4. 图文示例", "body": "销售表示例：A 列部门（销售部、市场部、销售部、销售部、市场部），B 列金额（8000、3000、6000、4500、7000），C 列数量（2、1、3、1、2）。多条件求和 `=SUMPRODUCT((A2:A6=\"销售部\")*(B2:B6>5000)*B2:B6)`：销售部且金额>5000 的是 8000 与 6000，和为 14000。LET 写法：`=LET(单价,120,数量,3,单价*数量)` → 360。LAMBDA：`=LAMBDA(x,x*1.13)(10000)` → 11300（含税价，10000×1.13）。\n\n（截图位：待补图）"}], "source": "docs/formulas/06-advanced-tricks.md", "updated": "2026-11-09", "objectives": ["用 LET 给中间结果起名字，让长公式可读、可维护", "用 LAMBDA 定义自己的函数，并在公式里调用它", "用 SUMPRODUCT 实现多条件求和与计数，替代辅助列", "用文本拼接公式批量生成带变量的句子与编号"], "formulas": ["=SUMPRODUCT((A2:A6=\"销售部\")*(B2:B6>5000)*B2:B6) → 14000", "=LET(单价,120,数量,3,单价*数量) → 360", "=LAMBDA(x,x*1.13)(10000) → 11300", "=A2&\"本月销售额\"&TEXT(B2,\"#,##0\")&\"元\" → 张三本月销售额12,000元（A2=张三，B2=12000 时）", "- `=SUMPRODUCT((A2:A6=\"销售部\")*(B2:B6>5000)*B2:B6)` → 14000：销售部且金额>5000 的是 8000 与 6000，和为 14000；4500 不满足>5000 被排除", "- `=LET(单价,120,数量,3,单价*数量)` → 360：LET 定义两个变量后计算：120×3=360；2021／365 可用", "- `=LAMBDA(x,x*1.13)(10000)` → 11300：LAMBDA 含税价：10000×1.13=11300；365 专属", "- `=A2&\"本月销售额\"&TEXT(B2,\"#,##0\")&\"元\"` → 张三本月销售额12,000元：文本拼接：TEXT 的 #,##0 格式代码给 12000 加千分位"], "scenarios": [{"title": "提成规则三档变五档", "body": "原来 IF 嵌套三层算提成，规则变五档后嵌套到五层没法看。改成 VLOOKUP 查提成率表（区间+比率），规则再变只改表不改公式；或用 IFS（2019／365）扁平化。"}, {"title": "每月自动生成催款函抬头", "body": "客户名、欠款金额在 A、B 列，C 列用拼接公式批量生成\"尊敬的张三：您尚有欠款 12,000 元，请于本月 30 日前结清。\"TEXT 控格式、& 拼句子，一列公式生成全月函件。"}], "pitfalls": [{"problem": "LET/LAMBDA 在旧版报 #NAME?", "cause": "对方是 2019 或更早版本", "solution": "LET 需 2021／365，LAMBDA 需 365 专属；旧版用辅助列＋普通公式替代"}, {"problem": "SUMPRODUCT 结果偏大", "cause": "条件区域与求和区域行数不一致", "solution": "三个区域必须同高同起止行（如都是 A2:A6）；行数错一位结果全错"}, {"problem": "LAMBDA 存成名称后调用失败", "cause": "名称管理器里引用位置没加等号或参数不匹配", "solution": "引用位置填 =LAMBDA(x, x*1.13)，调用时参数个数与定义一致"}, {"problem": "IF 嵌套到五层还继续加", "cause": "嵌套层数失控", "solution": "三层以上换 IFS、SWITCH 或 VLOOKUP 查表；嵌套不是炫技"}], "exercises": ["A2:A6 部门是销售部、市场部、销售部、销售部、市场部，B2:B6 金额是 8000、3000、6000、4500、7000。用 SUMPRODUCT 求销售部且金额>5000 的合计，结果是多少？哪两行被算进去了？", "=LET(单价,120,数量,3,单价*数量) 的结果是多少？LET 有什么好处？", "=LAMBDA(x,x*1.13)(10000) 的结果是多少？这个函数能在 Excel 2019 上用吗？"], "answers": ["结果 14000，算进去的是 8000 与 6000 两行（都是销售部且>5000）；4500 是销售部但不大于 5000，被排除。", "结果 360。好处：子表达式只写一次、起名字后可读，公式变短且不易错。", "结果 11300。不能，LAMBDA 是 365 专属，2019 会报 #NAME?。"], "versions": "LET：Excel 2021／365；LAMBDA：Microsoft 365 专属；其余技巧全版本", "file": "数据-函数练习题.xlsx"}, {"id": "data-management-01-sort-filter", "group": "data-management", "column": "C05", "level2": "C05-L2-1", "title": "排序与筛选：单条件、多条件、自动筛选与高级筛选", "level": "入门", "body": "**排序的铁律**：排序前选中整个数据区，或点数据区内任一格直接排序（Excel 自动扩展选区）。只选中一列就排序，会把行与行之间的对应关系打乱——这是新手最常见的毁表操作，没有之一。排序前备份，或确认能 `Ctrl + Z` 撤销。\n\n**单条件排序**：数据→排序，按一列升序/降序。数值按大小、日期按先后、文本按拼音/字母。金额列降序即\"从大到小\"，看 Top 5 直接取前 5 行。\n\n**多条件排序**：数据→排序→添加条件，先按部门升序、再按金额降序。Excel 按条件顺序逐层排：部门相同的人内部再按金额排。层数没有实用上限，但超过 3 层就要想想是不是该用透视表了。\n\n**自动筛选**：选中表头行，数据→筛选，每列出现下拉箭头。点箭头可选文本筛选（包含/开头是）、数字筛选（大于/前 10 项）、按颜色筛选。筛选只是隐藏行，不删除数据；清除筛选后全部恢复。\n\n**高级筛选**：数据→高级筛选，条件区域单独写在表外。同一行多个条件是\"与\"（同时满足），不同行是\"或\"（满足其一）。还能勾选\"选择不重复的记录\"，一键提取不重复客户名单。高级筛选可把结果复制到其他位置，原表不动。\n\n**按颜色排序**：先用条件格式或手动填充把异常行标色，再按颜色排序，异常行自动聚到一起。适合\"先标后排\"的人工复核流程。", "steps": ["单条件排序：点金额列内任一格，数据→降序（Z→A），确认弹出\"扩展选定区域\"时选扩展，再确定。", "多条件排序：数据→排序，主要关键字选\"部门\"、次序升序；点\"添加条件\"，次要关键字选\"金额\"、次序降序；确定。", "自动筛选：点表头行任一格，数据→筛选；点\"部门\"列箭头，只勾\"销售部\"，确定；再点\"金额\"箭头→数字筛选→大于→输入 5000。", "清除筛选：数据→清除（只清条件保留箭头），或再点一次数据→筛选（连箭头一起去掉）。", "高级筛选：表外写条件区（如 G1:H2：G1\"部门\"、H1\"金额\"，G2\"销售部\"、H2\">5000\"），数据→高级筛选→将筛选结果复制到其他位置，列表区域选数据区、条件区域选 G1:H2、复制到选目标格，确定。", "提取不重复：高级筛选中勾选\"选择不重复的记录\"，客户列一次去重，比逐行肉眼快得多。"], "sections": [{"title": "2. 基础概念", "body": "**排序的铁律**：排序前选中整个数据区，或点数据区内任一格直接排序（Excel 自动扩展选区）。只选中一列就排序，会把行与行之间的对应关系打乱——这是新手最常见的毁表操作，没有之一。排序前备份，或确认能 `Ctrl + Z` 撤销。\n\n**单条件排序**：数据→排序，按一列升序/降序。数值按大小、日期按先后、文本按拼音/字母。金额列降序即\"从大到小\"，看 Top 5 直接取前 5 行。\n\n**多条件排序**：数据→排序→添加条件，先按部门升序、再按金额降序。Excel 按条件顺序逐层排：部门相同的人内部再按金额排。层数没有实用上限，但超过 3 层就要想想是不是该用透视表了。\n\n**自动筛选**：选中表头行，数据→筛选，每列出现下拉箭头。点箭头可选文本筛选（包含/开头是）、数字筛选（大于/前 10 项）、按颜色筛选。筛选只是隐藏行，不删除数据；清除筛选后全部恢复。\n\n**高级筛选**：数据→高级筛选，条件区域单独写在表外。同一行多个条件是\"与\"（同时满足），不同行是\"或\"（满足其一）。还能勾选\"选择不重复的记录\"，一键提取不重复客户名单。高级筛选可把结果复制到其他位置，原表不动。\n\n**按颜色排序**：先用条件格式或手动填充把异常行标色，再按颜色排序，异常行自动聚到一起。适合\"先标后排\"的人工复核流程。"}, {"title": "4. 图文示例", "body": "销售明细 5 行：张三/销售部/8000、李四/市场部/3000、王五/销售部/6000、赵六/销售部/4500、钱七/市场部/7000。按金额降序排：8000、7000、6000、4500、3000。自动筛选\"部门=销售部\"得 3 行（张三、王五、赵六）；再加\"金额>5000\"得 2 行（张三、王五）。高级筛选条件区\"部门=销售部\"且\"金额>5000\"复制到别处，同样得 2 行。核对：8000+6000=14000，与条件求和结果一致。\n\n（截图位：待补图）"}], "source": "docs/data-management/01-sort-filter.md", "updated": "2026-11-09", "objectives": ["按数值、日期、文本与颜色排序，并理解排序前必须选中整个数据区", "用多条件排序实现\"先按部门、再按金额降序\"这类两层排序", "用自动筛选与文本/数字筛选快速找出目标行", "用高级筛选实现多条件组合（与/或）与不重复记录提取"], "formulas": ["=SUMIF(A2:A6,\"销售部\",C2:C6) → 18500", "=COUNTIF(A2:A6,\"销售部\") → 3", "=LARGE(C2:C6,1) → 8000", "- `=SUMIF(A2:A6,\"销售部\",C2:C6)` → 18500：销售部金额合计：8000+6000+4500=18500；与筛选后求和互相核对", "- `=COUNTIF(A2:A6,\"销售部\")` → 3：销售部共 3 行：张三、王五、赵六", "- `=LARGE(C2:C6,1)` → 8000：LARGE 取第 1 大值 8000，即金额最大值；等于 MAX 的结果"], "scenarios": [{"title": "月度销售 Top 10", "body": "全月明细按金额降序排，前 10 行即 Top 10；再按部门多条件排一次，看各部门内部的排名。汇报时贴排序后的表，比只报数字有说服力。"}, {"title": "从 1000 行里找异常订单", "body": "金额列按颜色筛选（先条件格式标红金额>10000 的行），或数字筛选\"大于 10000\"，异常行一次聚齐；再高级筛选把结果复制到新表做复核，原表不动。"}], "pitfalls": [{"problem": "排序后数据错位", "cause": "只选中一列就排序", "solution": "点数据区内任一格直接排序，让 Excel 自动扩展选区；或排序前选中整个数据区"}, {"problem": "筛选后求和结果不对", "cause": "SUM 把隐藏行也算进去了", "solution": "筛选后求和改用 SUBTOTAL(109, 区域)，109 表示\"忽略隐藏行求和\""}, {"problem": "高级筛选条件不起作用", "cause": "条件区标题与数据区表头不一致", "solution": "条件区第一行必须与数据区表头逐字相同（含空格）；\"与\"写同一行，\"或\"写不同行"}, {"problem": "筛选箭头不见了", "cause": "误点了数据→筛选两次", "solution": "再点一次数据→筛选恢复箭头；清除筛选（数据→清除）只清条件不去箭头"}], "exercises": ["5 行数据：张三/销售部/8000、李四/市场部/3000、王五/销售部/6000、赵六/销售部/4500、钱七/市场部/7000。按金额降序排，第一行是谁？销售部金额合计是多少？", "筛选后想对可见行求和，应该用 SUM 还是 SUBTOTAL？参数怎么写？", "高级筛选条件区：同一行的两个条件是什么关系？不同行呢？"], "answers": ["第一行是张三（8000）。销售部合计 =SUMIF → 18500（8000+6000+4500）。", "用 SUBTOTAL(109, 区域)。109 表示忽略隐藏行求和；SUM 会把筛选隐藏的行也算进去。", "同一行是\"与\"（同时满足），不同行是\"或\"（满足其一）。"], "versions": "Excel 2016／2019／2021／365", "file": "数据-销售数据1000行.xlsx"}, {"id": "data-management-02-clean-data", "group": "data-management", "column": "C05", "level2": "C05-L2-2", "title": "数据清洗：分列、去重、TRIM/CLEAN 与查找替换清理", "level": "入门", "body": "**脏数据的四种**：多余空格（\"张三 \"）、不可见字符（从系统导出的换行符、制表符）、文本型数字（\"100\" 当文本）、重复行（同一订单导了两次）。清洗就是按固定顺序把这四种逐一处理掉。\n\n**分列**：数据→分列，把一格里的多个值按分隔符（逗号、分号、空格）或固定宽度拆成多列。系统导出的 CSV 常常是\"姓名，部门，金额\"挤在一格，分列是第一步。分列前先在右侧留出空列，否则会覆盖已有数据。\n\n**删除重复项**：数据→删除重复项，勾选作为判断依据的列（如订单号），重复行整行删除，并报告删了几行。它是破坏性操作，清洗前必须先备份原表。\n\n**TRIM 与 CLEAN**：`TRIM` 删首尾空格、把连续多个空格压成一个；`CLEAN` 删不可见字符（如换行符 CHAR(10) 以外的控制字符）。两者常组合用：`=TRIM(CLEAN(A2))`。注意 TRIM 不删不间断空格（CHAR(160)，从网页复制来的常见），那种要用 SUBSTITUTE 换掉：`=SUBSTITUTE(A2,CHAR(160),\"\")`。\n\n**UNIQUE（2021／365）**：`=UNIQUE(A2:A100)` 一公式返回去重后的列表，原表不动。想保留原表、只在新位置看去重结果时用它；想直接在原表上删重复行时用\"删除重复项\"。\n\n**清洗流程**：备份原表→分列→清空格与不可见字符→文本数字转数值→去重→核对（行数、合计值前后对比）。合计值清洗前后必须一致，否则就是洗掉了不该洗的东西。", "steps": ["备份：右键工作表标签→移动或复制→勾选\"建立副本\"，副本改名\"原始备份\"，再在原表上清洗。", "分列：选中要拆的列，数据→分列→分隔符号→勾逗号→下一步→完成；先确认右侧有足够空列。", "清空格：在辅助列输入 `=TRIM(CLEAN(A2))` 拖满全列，复制辅助列→选择性粘贴→数值覆盖回原列，再删辅助列。", "清不间断空格：网页复制来的数据先用 `=SUBSTITUTE(A2,CHAR(160),\"\")` 去 CHAR(160)，再套 TRIM。", "文本转数值：选中文本数字列，数据→分列→直接点完成（不改任何设置），分列会顺手把文本数字转成数值；或在空白格输入 1、复制、选中目标列→选择性粘贴→乘。", "去重：选中数据区，数据→删除重复项，勾选订单号列，确认报告\"删除了 N 个重复值\"；核对行数：原行数减删除数等于现行数。", "核对：清洗前后分别用 SUM 算金额合计，两数一致才算洗完；不一致就逐项回查哪一步动了数值。"], "sections": [{"title": "2. 基础概念", "body": "**脏数据的四种**：多余空格（\"张三 \"）、不可见字符（从系统导出的换行符、制表符）、文本型数字（\"100\" 当文本）、重复行（同一订单导了两次）。清洗就是按固定顺序把这四种逐一处理掉。\n\n**分列**：数据→分列，把一格里的多个值按分隔符（逗号、分号、空格）或固定宽度拆成多列。系统导出的 CSV 常常是\"姓名，部门，金额\"挤在一格，分列是第一步。分列前先在右侧留出空列，否则会覆盖已有数据。\n\n**删除重复项**：数据→删除重复项，勾选作为判断依据的列（如订单号），重复行整行删除，并报告删了几行。它是破坏性操作，清洗前必须先备份原表。\n\n**TRIM 与 CLEAN**：`TRIM` 删首尾空格、把连续多个空格压成一个；`CLEAN` 删不可见字符（如换行符 CHAR(10) 以外的控制字符）。两者常组合用：`=TRIM(CLEAN(A2))`。注意 TRIM 不删不间断空格（CHAR(160)，从网页复制来的常见），那种要用 SUBSTITUTE 换掉：`=SUBSTITUTE(A2,CHAR(160),\"\")`。\n\n**UNIQUE（2021／365）**：`=UNIQUE(A2:A100)` 一公式返回去重后的列表，原表不动。想保留原表、只在新位置看去重结果时用它；想直接在原表上删重复行时用\"删除重复项\"。\n\n**清洗流程**：备份原表→分列→清空格与不可见字符→文本数字转数值→去重→核对（行数、合计值前后对比）。合计值清洗前后必须一致，否则就是洗掉了不该洗的东西。"}, {"title": "4. 图文示例", "body": "导出的订单表 6 行：其中两行订单号重复，一行姓名带尾空格\"张三 \"，一行金额是文本型\"6000\"。清洗：备份→分列（无）→TRIM 清空格→文本转数值→删除重复项（按订单号，报告删除 1 行）→核对：清洗前金额合计（含文本 6000 时 SUM 忽略它）与清洗后合计相差 6000，恰好是那行文本数字——确认无误删后交表。清洗后 5 行金额 8000、3000、6000、4500、7000，合计 28500。\n\n（截图位：待补图）"}], "source": "docs/data-management/02-clean-data.md", "updated": "2026-11-09", "objectives": ["用分列把\"张三,销售部,100\"这类一格多值拆成多列", "用删除重复项与 UNIQUE 去重，并说出两者的区别", "用 TRIM 与 CLEAN 清掉空格与不可见字符", "建立\"先备份、再清洗、逐项核对\"的清洗流程，清洗前后行数对得上"], "formulas": ["=TRIM(CLEAN(A2)) → 张三（A2=张三带尾空格时）", "=SUBSTITUTE(A2,CHAR(160),\"\") → 去不间断空格", "=SUM(C2:C6) → 28500（清洗后 C2:C6 是 8000、3000、6000、4500、7000 时）", "=UNIQUE(A2:A6) → 去重后的名单（2021／365）", "- `=TRIM(CLEAN(A2))` → 张三：TRIM 删首尾空格，CLEAN 删不可见字符；组合是清洗标配", "- `=SUBSTITUTE(A2,CHAR(160),\"\")` → 去不间断空格：网页复制来的空格常是 CHAR(160)，TRIM 删不掉，必须用 SUBSTITUTE 替换", "- `=SUM(C2:C6)` → 28500：8000+3000+6000+4500+7000=28500；清洗前后合计核对就用它", "- `=UNIQUE(A2:A6)` → 去重后的名单：UNIQUE 一公式返回去重列表，原表不动；2021／365 可用"], "scenarios": [{"title": "每月接系统导出的报表", "body": "系统导出的表每月都带同样的脏：空格、文本数字、重复行。把清洗步骤记成固定流程（备份→分列→TRIM/CLEAN→转数值→去重→核对），每月 10 分钟走完；熟练后录成 Power Query（见 Power Query 篇）实现一键清洗。"}, {"title": "合并三个部门交来的表", "body": "三张表格式不一：先统一列顺序与表头，再逐张清洗（空格、文本数字），最后追加合并。用删除重复项按\"姓名+日期\"两列去重，防止同一人同一天被算两次。"}], "pitfalls": [{"problem": "分列覆盖了右侧数据", "cause": "分列前右侧没有留空列", "solution": "分列前先插入足够空列；或先分列到新表再粘回来"}, {"problem": "去重删错了行", "cause": "勾选的列不对（如只勾了姓名，同名不同人被误删）", "solution": "去重依据列要能唯一标识一行（如订单号，或姓名+日期两列组合）"}, {"problem": "TRIM 清不掉空格", "cause": "那是网页来的不间断空格 CHAR(160)", "solution": "先 SUBSTITUTE(CHAR(160),\"\") 再 TRIM"}, {"problem": "清洗后合计对不上", "cause": "某步误删或改了数值", "solution": "每步前后都用 SUM 核对合计；备份表在手，随时可回滚重洗"}, {"problem": "文本数字转完还是文本", "cause": "只改了格式没重新确认", "solution": "改格式不够：用分列直接完成，或选择性粘贴→乘 1，强制重算"}], "exercises": ["清洗后 5 行金额 8000、3000、6000、4500、7000，求和是多少？清洗前 SUM 少算了 6000，最可能的原因是什么？", "\"张三 \"（带尾空格）用 TRIM 处理后 LEN 是多少？如果空格是网页复制来的 CHAR(160)，TRIM 还管用吗？", "删除重复项与 UNIQUE 有什么区别？什么时候用哪个？"], "answers": ["合计 28500。清洗前少算 6000 是因为那格是文本型数字，SUM 会忽略文本；分列或乘 1 转数值后恢复。", "TRIM 后\"张三\"长度是 2。CHAR(160) 的不间断空格 TRIM 删不掉，要先 SUBSTITUTE(A2,CHAR(160),\"\") 再 TRIM。", "删除重复项直接在原表删行（破坏性，要备份）；UNIQUE 是公式，在新位置返回去重列表，原表不动。想保留原表时用 UNIQUE。"], "versions": "Excel 2016／2019／2021／365", "file": "数据-销售数据1000行.xlsx"}, {"id": "data-management-03-tables-ref", "group": "data-management", "column": "C05", "level2": "C05-L2-3", "title": "超级表应用（交叉引用索引）", "level": "", "body": "", "steps": ["打开超级表专篇（[../formatting/05-tables.md](../formatting/05-tables.md)），按其步骤把数据区转成超级表：点数据区内任一格，按 Ctrl + T，确认“表包含标题”，确定。", "给表改名：点表内任一格，“表设计”→左上角“表名称”输入有意义的名字（如“销售明细”），回车。", "在本栏目三处用法中验证：排序筛选时新增行自动纳入筛选范围；清洗后新增行格式与公式自动扩展；数据验证规则新增行自动继承。"], "sections": [{"title": "4. 图文示例", "body": "5 行销售明细转成超级表并改名“销售明细”：金额 1200、980、1500、640、540，结构化引用 `=SUM(销售明细[金额])` 得 4860，平均值 972。新增一行金额 700 后，汇总行与结构化引用自动变成 5560，不用改任何公式。\n\n（截图位：待补图）"}], "source": "docs/data-management/03-tables-ref.md", "updated": "2026-11-09", "objectives": ["用 Ctrl + T 把普通区域转成超级表，并给表起一个有意义的名字", "读懂并写出结构化引用（如 `表1[金额]`）", "用汇总行一键求和、计数、求平均"], "formulas": ["=SUM(销售明细[金额]) → 4860", "=AVERAGE(销售明细[金额]) → 972", "- `=SUM(销售明细[金额])` → 4860：结构化引用求和，1200+980+1500+640+540=4860；新增行后自动纳入", "- `=AVERAGE(销售明细[金额])` → 972：4860÷5=972，金额列平均值"], "scenarios": [{"title": "每天追加的销售流水", "body": "流水每天新增几十行：做成超级表后，汇总行的合计与旁边的结构化引用公式自动包含新行，透视表的数据源设为表名后刷新即含新数据。普通区域每次都要改引用范围，迟早漏一次。"}], "pitfalls": [{"problem": "结构化引用公式报错 #NAME?", "cause": "表名含空格或与单元格地址重名", "solution": "表名用无空格的名字（如\"销售明细\"），不要叫 A1 这类地址"}, {"problem": "新增行后公式没跟上", "cause": "新增的行不在表内（空了一行再写）", "solution": "紧贴表底最后一行新增，或直接在汇总行上方插入行"}], "exercises": ["把一张 5 行销售明细转成超级表并改名\"销售明细\"，用结构化引用求金额合计（金额 1200、980、1500、640、540）。", "新增一行金额 700，汇总行与结构化引用会自动变成多少？"], "answers": ["求和 `=SUM(销售明细[金额])` → 4860（1200+980+1500+640+540）。", "自动变成 5560（4860+700），不用改任何公式。"], "versions": "Excel 2016／2019／2021／365"}, {"id": "data-management-05-import-export", "group": "data-management", "column": "C05", "level2": "C05-L2-5", "title": "数据导入导出：文本/CSV 导入、从数据库与网页获取、导出格式", "level": "进阶", "body": "**CSV 导入三要素**：分隔符（逗号/分号/制表符）、编码（UTF-8/GBK）、列格式（文本/日期/常规）。三者任一错，导入即乱：分隔符错会整行挤进一列，编码错会出乱码，列格式错会丢前导 0 或把长数字变科学计数法。\n\n**两种导入路径**：直接双击打开 CSV（快，但分隔符与编码按系统默认猜，常猜错）；数据→从文本/CSV（走 Power Query 导入向导，可选分隔符、编码、列格式，推荐）。后者还能把导入步骤存成查询，下月同样文件一键刷新。\n\n**从文件夹获取**：数据→获取数据→自文件→从文件夹，选文件夹后 Power Query 合并其中全部同结构文件。每月 12 个分表合并成一张总表，用它 1 分钟搞定；新文件丢进文件夹后刷新即可。\n\n**从数据库与网页获取**：数据→获取数据→自数据库（SQL Server、Access 等）或自网站（输入 URL 抓表格）。网页表格结构一变就要重配查询，适合结构稳定的公开表格（如汇率表）。\n\n**导出格式取舍**：另存为 CSV 只保留当前工作表、无格式无公式，适合导给其他系统；导出 PDF（文件→导出→创建 PDF）保留排版与格式，适合发给领导；发给对方继续编辑的，一律发 .xlsx 原文件。\n\n**刷新**：Power Query 导入的数据，源文件更新后在 Excel 里点数据→全部刷新即可同步。查询步骤存在工作簿里，发给别人时对方刷新需要能访问源文件路径，路径变了会报错。", "steps": ["导入 CSV：数据→从文本/CSV，选文件；在预览里确认分隔符（逗号）、编码（UTF-8，如乱码改 GBK 936）、列格式（工号列设文本）；点加载。", "处理乱码：预览里中文是乱码时，把编码从 UTF-8 换成 GBK（936）再预览，中文正常后再加载。", "从文件夹合并：数据→获取数据→自文件→从文件夹，选文件夹→合并→选示例文件确认列→确定，全部同结构文件合并成一张表。", "从网页获取：数据→获取数据→自其他源→自网站，输入 URL，选要抓的表格→加载；结构变化时在 Power Query 编辑器里重配。", "导出 CSV：选中要导出的工作表，文件→另存为→CSV UTF-8（逗号分隔）；注意只保存当前工作表，多表要逐张另存。", "导出 PDF：文件→导出→创建 PDF/XPS 文档，选\"整个工作簿\"或\"当前工作表\"；打印设置（页面布局→纸张方向/缩放）先调好再导出。"], "sections": [{"title": "2. 基础概念", "body": "**CSV 导入三要素**：分隔符（逗号/分号/制表符）、编码（UTF-8/GBK）、列格式（文本/日期/常规）。三者任一错，导入即乱：分隔符错会整行挤进一列，编码错会出乱码，列格式错会丢前导 0 或把长数字变科学计数法。\n\n**两种导入路径**：直接双击打开 CSV（快，但分隔符与编码按系统默认猜，常猜错）；数据→从文本/CSV（走 Power Query 导入向导，可选分隔符、编码、列格式，推荐）。后者还能把导入步骤存成查询，下月同样文件一键刷新。\n\n**从文件夹获取**：数据→获取数据→自文件→从文件夹，选文件夹后 Power Query 合并其中全部同结构文件。每月 12 个分表合并成一张总表，用它 1 分钟搞定；新文件丢进文件夹后刷新即可。\n\n**从数据库与网页获取**：数据→获取数据→自数据库（SQL Server、Access 等）或自网站（输入 URL 抓表格）。网页表格结构一变就要重配查询，适合结构稳定的公开表格（如汇率表）。\n\n**导出格式取舍**：另存为 CSV 只保留当前工作表、无格式无公式，适合导给其他系统；导出 PDF（文件→导出→创建 PDF）保留排版与格式，适合发给领导；发给对方继续编辑的，一律发 .xlsx 原文件。\n\n**刷新**：Power Query 导入的数据，源文件更新后在 Excel 里点数据→全部刷新即可同步。查询步骤存在工作簿里，发给别人时对方刷新需要能访问源文件路径，路径变了会报错。"}, {"title": "4. 图文示例", "body": "导入一份 UTF-8 编码的订单 CSV（逗号分隔，含 18 位订单号）：数据→从文本/CSV→编码选 UTF-8→分隔符逗号→订单号列格式设为文本→加载。核对：行数与源文件一致，订单号完整无科学计数法，金额列 SUM 得 28500，与源系统报表一致。再导出一份 PDF 发给领导：文件→导出→创建 PDF，确认分页无断行。\n\n（截图位：待补图）"}], "source": "docs/data-management/05-import-export.md", "updated": "2026-11-09", "objectives": ["用文本导入向导正确导入 CSV，选对分隔符、编码与列格式", "用 Power Query 从文件夹、数据库与网页获取数据并刷新", "导出 CSV 与 PDF，知道每种格式会丢什么（格式、公式、多表）", "处理导入时的乱码、长数字变科学计数法与日期错乱"], "formulas": ["=SUM(C2:C6) → 28500（导入核对用）", "=COUNTA(A2:A6) → 5", "- `=SUM(C2:C6)` → 28500：导入后金额合计 8000+3000+6000+4500+7000=28500，与源系统报表一致才算导对", "- `=COUNTA(A2:A6)` → 5：导入后非空行数 5，与源文件行数核对；行数不对先查分隔符与编码"], "scenarios": [{"title": "每月 12 个分表合成总表", "body": "12 个分公司每月各交一个 CSV：建一个文件夹全丢进去，Power Query 从文件夹获取并合并。下月新文件直接丢进文件夹，打开总表点全部刷新即完成合并。"}, {"title": "给外部系统导数据", "body": "对方系统只认 GBK 编码的 CSV：另存为时选\"CSV（逗号分隔）\"并确认编码；长数字列先设文本格式再导，否则对方收到的是科学计数法。"}], "pitfalls": [{"problem": "导入后中文全是乱码", "cause": "编码选错（UTF-8 文件按 GBK 解）", "solution": "导入向导里把编码换成 UTF-8 或 GBK（936）再预览，中文正常后再加载"}, {"problem": "整行数据挤在一列", "cause": "分隔符选错（文件是分号分隔却按逗号切）", "solution": "导入向导里改分隔符；或导入后用数据→分列补救"}, {"problem": "订单号变科学计数法", "cause": "导入时列格式是常规", "solution": "导入向导里把该列格式设为文本；已变的无法恢复，需重新导入"}, {"problem": "刷新后报错找不到源文件", "cause": "源文件被移动或改名", "solution": "把源文件放回原路径，或在 Power Query 编辑器里改源路径；发给别人前先说明刷新依赖"}, {"problem": "导出 CSV 后多表没了", "cause": "CSV 只能存一张表", "solution": "CSV 只保存当前工作表；多表要逐张另存，或直接发 .xlsx"}], "exercises": ["导入 CSV 后金额合计是 28500，与源系统报表一致，行数也是 5 行，能不能直接断定导对了？还要核对什么？", "从网页导入的表格，下个月结构变了会怎样？", "CSV 导出会丢什么？发给别人继续编辑应该发什么格式？"], "answers": ["基本可断定，但还要抽查：订单号是否完整（有无科学计数法）、日期列格式是否正确、中文有无乱码。合计与行数一致是必要非充分条件。", "查询会报错或抓错列。需要在 Power Query 编辑器里重新配置抓取步骤；结构不稳定的网页不适合做固定刷新源。", "CSV 只保留当前工作表的数据，无格式、无公式、无多表。继续编辑发 .xlsx；只给对方看发 PDF；导给系统用 CSV。"], "versions": "Excel 2016／2019／2021／365", "file": "数据-销售数据1000行.xlsx"}, {"id": "charts-01-column-bar", "group": "charts", "column": "C07", "level2": "C07-L2-1", "title": "柱形图与条形图", "level": "入门", "body": "**柱形图与条形图的区别**：柱形图的类别在横轴、数值在纵轴，柱子竖着长；条形图把两者对调，类别在纵轴、数值在横轴，条子横着长。两者表达的信息完全一样，选哪个只看类别名称有多长、类别有多少个。\n\n**簇状与堆积的区别**：簇状是把同一类别的不同系列并排比较大小；堆积是把同一类别的不同系列叠起来，既看合计又看构成；百分比堆积不看绝对值，只看每个系列在合计里的占比。\n\n**一图只讲一件事**：一张图只回答一个问题。既想比大小又想看占比时，拆成两张图，不要把两种结论塞进一张图。", "steps": [], "sections": [{"title": "基础概念", "body": "**柱形图与条形图的区别**：柱形图的类别在横轴、数值在纵轴，柱子竖着长；条形图把两者对调，类别在纵轴、数值在横轴，条子横着长。两者表达的信息完全一样，选哪个只看类别名称有多长、类别有多少个。\n\n**簇状与堆积的区别**：簇状是把同一类别的不同系列并排比较大小；堆积是把同一类别的不同系列叠起来，既看合计又看构成；百分比堆积不看绝对值，只看每个系列在合计里的占比。\n\n**一图只讲一件事**：一张图只回答一个问题。既想比大小又想看占比时，拆成两张图，不要把两种结论塞进一张图。"}], "source": "docs/charts/01-column-bar.md", "updated": "2026-11-10", "objectives": ["区分簇状柱形图、堆积柱形图、百分比堆积柱形图与条形图的适用场景", "用同一张分区域季度销售表做出三种柱形图，并读出各自的结论", "根据类别名称长短，在柱形图与条形图之间做出正确选择", "给柱形图加上数据标签，删掉多余的网格线与图例"], "formulas": [], "scenarios": [], "pitfalls": [], "exercises": ["用示例工作簿里的季度分区域销售表，先做一张簇状柱形图，再做一张堆积柱形图。两张图分别回答了什么问题？各写一句话结论。", "把条形图的示例数据按销售额从大到小排好，再做一张簇状条形图。为什么不直接用柱形图？写出你的理由。", "用同一张季度表做百分比堆积柱形图，算出四季度华东、华北、华南的占比（保留一位小数），并判断华南占比从一季度到四季度是上升还是下降。"], "answers": ["簇状柱形图回答“每个季度各区域分别卖了多少”，结论示例：四季度华东 180 万元最高，三个区域全部过百万元。堆积柱形图回答“每个季度一共卖了多少、由哪几部分构成”，结论示例：四季度合计 460 万元为全年最高，华东贡献最大。", "排序后自上而下为智能手机 320、笔记本电脑 260、平板电脑 180、智能手表 150、无线耳机 90。理由：产品线名称较长，柱形图的横轴放不下，条形图的纵轴有足够空间显示完整名称。", "四季度占比：华东 180 / 460 = 39.1%，华北 160 / 460 = 34.8%，华南 120 / 460 = 26.1%。华南占比从一季度的 22.2% 上升到四季度的 26.1%，呈上升趋势。"], "versions": "Excel 2007 / 2010 / 2013 / 2016 / 2019 / 2021 / 365", "chart_items": [{"name": "簇状柱形图", "name_en": "Clustered Column", "preview": "docs/charts/images/clustered-column.png", "use": "比较同一类别下多个系列的数值大小，例如四个季度里华东、华北、华南三个区域的销售额对比。", "data_header": ["季度", "华东", "华北", "华南", "合计"], "data_rows": [["一季度", "120", "90", "60", "270"], ["二季度", "150", "110", "80", "340"], ["三季度", "130", "140", "95", "365"], ["四季度", "180", "160", "120", "460"]], "steps": ["选中数据区域 A1:E5（含表头）。", "点插入选项卡，在图表组里点柱形图，选簇状柱形图。", "右键图表，点添加数据标签，让每根柱子顶上显示数值。", "选中网格线按 Delete 删除，保持画面干净。", "双击图表标题，改成结论句，例如“四季度三个区域全部创新高”。"], "fmt": "系列重叠与分类间距在设置数据系列格式里调，柱子太细就把分类间距从 150% 降到 80% 左右；三个系列用同一套配色，全站统一用商务蓝、橙、绿；纵轴从 0 开始，不要截断，否则柱子长短会误导读数。", "faq": [{"q": "柱子太多挤在一起怎么办？", "a": "类别超过 10 个时改用条形图，或只留重点类别，其余合并为其他。"}, {"q": "系列顺序与表格不一致怎么办？", "a": "右键图表点选择数据，在图例项里用上下箭头调整系列顺序。"}, {"q": "数值标签显示不全怎么办？", "a": "把纵轴最大值调大，或把标签位置从居中改成数据标签外。"}], "versions": "全部版本均支持，兼容 Excel 2007 / 2010 / 2013 / 2016 / 2019 / 2021 / 365。", "workbook": "图表-示例-柱形图与条形图.xlsx"}, {"name": "堆积柱形图", "name_en": "Stacked Column", "preview": "docs/charts/images/stacked-column.png", "use": "既看每个季度的销售合计，又看华东、华北、华南三地在合计里的构成，例如四季度合计 460 万元，其中华东 180 万元、华北 160 万元、华南 120 万元。", "data_header": ["季度", "华东", "华北", "华南", "合计"], "data_rows": [["一季度", "120", "90", "60", "270"], ["二季度", "150", "110", "80", "340"], ["三季度", "130", "140", "95", "365"], ["四季度", "180", "160", "120", "460"]], "steps": ["选中数据区域 A1:D5（只选三地数值列，不用选合计列，否则合计会被当成第四个系列叠上去）。", "点插入选项卡，在图表组里点柱形图，选堆积柱形图。", "右键图表，点添加数据标签，核对每段数值与表一致。", "图例放图表底部，标题改成结论句，例如“四季度合计最高，三地全部过百万元”。"], "fmt": "每段用不同颜色，同一系列全图同色；合计列不要进图，合计值如需展示，单独在柱顶加文本框；系列超过 4 个时堆积图很难读，改用簇状图或拆图。", "faq": [{"q": "合计列也被叠进去了怎么办？", "a": "重新选数据，只选三地数值列；或右键图表点选择数据，把合计系列删掉。"}, {"q": "中间段的大小看不出来怎么办？", "a": "这是堆积图的固有短板，只适合看合计与首尾段；要比中间段，改用簇状图。"}, {"q": "负数能进堆积图吗？", "a": "能，但正负会向两个方向叠，读数容易乱；有负数时改用簇状图。"}], "versions": "全部版本均支持，兼容 Excel 2007 / 2010 / 2013 / 2016 / 2019 / 2021 / 365。", "workbook": "图表-示例-柱形图与条形图.xlsx"}, {"name": "百分比堆积柱形图", "name_en": "100% Stacked Column", "preview": "docs/charts/images/100-stacked-column.png", "use": "不比较绝对销售额，只比较结构变化，例如华东占比是否逐季下滑、华南占比是否逐季上升。", "data_header": ["季度", "华东", "华北", "华南", "合计"], "data_rows": [["一季度", "120", "90", "60", "270"], ["二季度", "150", "110", "80", "340"], ["三季度", "130", "140", "95", "365"], ["四季度", "180", "160", "120", "460"]], "steps": ["选中数据区域 A1:D5（同样不要选合计列）。", "点插入选项卡，在图表组里点柱形图，选百分比堆积柱形图。", "纵轴会显示 0% 到 100%，不用手动调。", "右键图表，点添加数据标签，标签显示为百分比。", "标题写结构结论，例如“华南占比从 22.2% 升到 26.1%”。"], "fmt": "纵轴固定 0% 到 100%，不要改成其他范围；占比标签保留一位小数；三地颜色与簇状图、堆积图保持一致，同一系列全站同色。", "faq": [{"q": "为什么看不到绝对销售额？", "a": "百分比堆积图本来就只表达结构；要看绝对值，用堆积柱形图。"}, {"q": "占比标签加起来不是 100% 怎么办？", "a": "四舍五入会让显示值合计为 99.9% 或 100.1%，属于正常现象，改显示 0 位小数可缓解。"}, {"q": "某季度占比变化很大但销售额没变，是错了吗？", "a": "不是错。占比是相对数，其他区域变了，这个区域的占比也会跟着变。"}], "versions": "全部版本均支持，兼容 Excel 2007 / 2010 / 2013 / 2016 / 2019 / 2021 / 365。", "workbook": "图表-示例-柱形图与条形图.xlsx"}, {"name": "条形图", "name_en": "Bar Chart", "preview": "docs/charts/images/bar.png", "use": "类别名称长、类别多（超过 8 个）时的数值比较，例如产品线销售额排名，笔记本电脑、智能手机这类较长的名称在横向条形里不会挤在一起。", "data_header": ["产品线", "销售额"], "data_rows": [["智能手机", "320"], ["笔记本电脑", "260"], ["平板电脑", "180"], ["智能手表", "150"], ["无线耳机", "90"]], "steps": ["选中数据区域 A1:B6（含表头）。", "点插入选项卡，在图表组里点条形图，选簇状条形图。", "右键纵轴，点设置坐标轴格式，勾选逆序类别，让销售额最高的智能手机排在最上面。", "右键图表，点添加数据标签。", "标题改成结论句，例如“智能手机销售额第一，是无线耳机的 3 倍多”。"], "fmt": "类别名长时条形图比柱形图省空间；条形太细就调分类间距；排名类图表按数值从大到小排，不要按拼音或录入顺序排。", "faq": [{"q": "柱形图和条形图怎么选？", "a": "类别名短、类别少用柱形图；类别名长、类别多用条形图。"}, {"q": "为什么第一名排在最下面？", "a": "条形图的纵轴默认是正序；右键纵轴勾选逆序类别即可。"}, {"q": "条形图能做堆积吗？", "a": "能，插入条形图时选堆积条形图，用法与堆积柱形图相同。"}], "versions": "全部版本均支持，兼容 Excel 2007 / 2010 / 2013 / 2016 / 2019 / 2021 / 365。", "workbook": "图表-示例-柱形图与条形图.xlsx"}], "file": "图表-示例-柱形图与条形图.xlsx"}, {"id": "charts-02-line-area", "group": "charts", "column": "C07", "level2": "C07-L2-2", "title": "折线图与面积图", "level": "入门", "body": "**折线图看变化**：折线图的横轴通常是时间，纵轴是数值，线的走向就是趋势。线往上走是增长，往下走是下滑，忽上忽下是波动。时间必须是连续等距的，缺了某个月要补上空值，不能直接跳过。\n\n**面积图看体量**：面积图就是折线图下方填了颜色，填充的面积越大，数值越大。它比折线图更有视觉冲击力，但多系列面积图会互相遮挡，只适合单系列或两三个系列。\n\n**趋势线是拟合不是预测**：趋势线是 Excel 按现有数据算出的一条最贴合的线，R 平方越接近 1，贴合越好。趋势线可以外推预测，但预测越远越不可靠，只能作参考。", "steps": [], "sections": [{"title": "基础概念", "body": "**折线图看变化**：折线图的横轴通常是时间，纵轴是数值，线的走向就是趋势。线往上走是增长，往下走是下滑，忽上忽下是波动。时间必须是连续等距的，缺了某个月要补上空值，不能直接跳过。\n\n**面积图看体量**：面积图就是折线图下方填了颜色，填充的面积越大，数值越大。它比折线图更有视觉冲击力，但多系列面积图会互相遮挡，只适合单系列或两三个系列。\n\n**趋势线是拟合不是预测**：趋势线是 Excel 按现有数据算出的一条最贴合的线，R 平方越接近 1，贴合越好。趋势线可以外推预测，但预测越远越不可靠，只能作参考。"}], "source": "docs/charts/02-line-area.md", "updated": "2026-11-10", "objectives": ["用折线图展示 12 个月营收随时间的变化趋势", "用面积图表达累计感，并知道面积图在什么情况下会误导读者", "给折线图添加线性趋势线，读出趋势方程与 R 平方值", "判断一个数据该用折线图、面积图还是柱形图"], "formulas": [], "scenarios": [], "pitfalls": [], "exercises": ["用示例工作簿里的 12 个月营收表做一张带数据标记的折线图，找出营收回落的两个月份，并写一句话结论。", "给同一张折线图添加线性趋势线，写出趋势线方程与 R 平方值，并说明斜率 10.51 的业务含义。", "用月新增用户表做一张面积图，再把它改成折线图，对比两张图，哪张更容易读出 3 月新增用户比 2 月少？为什么？"], "answers": ["回落的月份是 3 月（135 万元降到 128 万元）与 6 月（165 万元降到 158 万元），其余月份全部环比上涨。结论示例：营收全年整体向上，仅 3 月与 6 月小幅回落。", "趋势线方程为营收 = 10.51 x 月份 + 106.18，R 平方 = 0.964。斜率 10.51 表示平均每个月营收增加约 10.51 万元；R 平方 0.964 表示线性趋势对这 12 个月数据的拟合程度很高。", "折线图更容易读出。因为面积图的填充色会弱化单点数值的差异，折线图的数据点与数值标签直接可读，3 月的点低于 2 月的点一目了然。"], "versions": "Excel 2007 / 2010 / 2013 / 2016 / 2019 / 2021 / 365", "chart_items": [{"name": "折线图", "name_en": "Line Chart", "preview": "docs/charts/images/line.png", "use": "展示数值随时间的变化趋势，例如 12 个月营收从 120 万元涨到 240 万元，中间 3 月和 6 月各有一次小幅回落。", "data_header": ["月份", "营收"], "data_rows": [["1月", "120"], ["2月", "135"], ["3月", "128"], ["4月", "150"], ["5月", "165"], ["6月", "158"], ["7月", "180"], ["8月", "195"], ["9月", "188"], ["10月", "210"], ["11月", "225"], ["12月", "240"]], "steps": ["选中数据区域 A1:B13（含表头）。", "点插入选项卡，在图表组里点折线图，选带数据标记的折线图。", "右键横轴，确认横轴是 1 月到 12 月按顺序排列，没有跳月。", "右键图表，点添加数据标签，数值标在点的上方。", "标题改成结论句，例如“营收全年翻倍，12 月达到 240 万元”。"], "fmt": "线条加粗到 2.25 磅，数据标记用圆点；网格线只留横向的，纵向网格线删掉；多系列时每条线用不同颜色加不同标记区分，不要只靠颜色区分。", "faq": [{"q": "折线图和柱形图怎么选？", "a": "看趋势用折线图，比单月大小用柱形图；月份多（12 个以上）优先用折线图。"}, {"q": "横轴月份顺序乱了怎么办？", "a": "选中横轴，检查坐标轴类型是否为文本坐标轴；数据源的月份列按时间顺序排好。"}, {"q": "线条断开了怎么办？", "a": "数据里有空单元格；右键图表点选择数据，点隐藏和空单元格，选用直线连接数据点。"}], "versions": "全部版本均支持，兼容 Excel 2007 / 2010 / 2013 / 2016 / 2019 / 2021 / 365。", "workbook": "图表-示例-折线图与面积图.xlsx"}, {"name": "面积图", "name_en": "Area Chart", "preview": "docs/charts/images/area.png", "use": "展示单一系列随时间的累计体量感，例如 12 个月新增用户从每月 8 千人涨到 25 千人，面积越大表示当月新增越多。", "data_header": ["月份", "新增用户"], "data_rows": [["1月", "8"], ["2月", "10"], ["3月", "9"], ["4月", "12"], ["5月", "14"], ["6月", "13"], ["7月", "16"], ["8月", "18"], ["9月", "17"], ["10月", "20"], ["11月", "22"], ["12月", "25"]], "steps": ["选中数据区域 A1:B13（含表头）。", "点插入选项卡，在图表组里点面积图，选二维面积图。", "面积颜色设 50% 透明度，线条颜色与面积同色加深。", "纵轴从 0 开始，标题改成结论句，例如“下半年每月新增用户稳定在 17 千人以上”。"], "fmt": "单系列面积图效果最好；两个以上系列时用堆积面积图，并把透明度调到 50% 左右，避免后一个系列被前一个完全盖住；面积图不要加数据标签，标在面积里读数困难。", "faq": [{"q": "面积图和折线图有什么区别？", "a": "数据相同，面积图多了填充色，视觉冲击强但读数不如折线图精确。"}, {"q": "多系列面积图互相遮挡怎么办？", "a": "改用堆积面积图，或拆成折线图；系列超过 3 个不要用面积图。"}, {"q": "面积图能看累计值吗？", "a": "堆积面积图的顶部边界就是累计值；普通面积图不能直接读累计。"}], "versions": "全部版本均支持，兼容 Excel 2007 / 2010 / 2013 / 2016 / 2019 / 2021 / 365。", "workbook": "图表-示例-折线图与面积图.xlsx"}, {"name": "趋势线", "name_en": "Trendline", "preview": "docs/charts/images/trendline.png", "use": "在折线图或散点图上叠加一条拟合线，判断数据整体是上升还是下降、上升有多快，例如 12 个月营收的线性趋势线斜率为正，说明营收整体向上。", "data_header": ["月份", "营收"], "data_rows": [["1月", "120"], ["2月", "135"], ["3月", "128"], ["4月", "150"], ["5月", "165"], ["6月", "158"], ["7月", "180"], ["8月", "195"], ["9月", "188"], ["10月", "210"], ["11月", "225"], ["12月", "240"]], "steps": ["先按折线图的做法做出 12 个月营收折线图。", "右键折线上的任一数据点，点添加趋势线。", "在设置趋势线格式窗格里选线性。", "勾选显示公式与显示 R 平方值，公式和 R 平方值会出现在图表上。", "需要预测时，在预测栏里填向后预测的周期数，例如向后 3 个周期。"], "fmt": "趋势线用虚线、与数据线不同的颜色，线宽 2.25 磅；公式与 R 平方值移到图表空白处，不要压住数据点；线性、指数、多项式等类型要根据数据形态选，不要默认只用线性。", "faq": [{"q": "R 平方是什么意思？", "a": "R 平方越接近 1，趋势线与数据的贴合程度越高；0.964 表示拟合很好，0.5 以下表示拟合很差。"}, {"q": "趋势线能预测未来吗？", "a": "可以外推，但只能作参考；数据形态一变，预测就失效，预测周期越长越不可靠。"}, {"q": "哪种趋势线类型最合适？", "a": "数据匀速增长用线性，加速增长用指数，有波峰波谷用多项式；先看散点形态再选类型。"}], "versions": "全部版本均支持，兼容 Excel 2007 / 2010 / 2013 / 2016 / 2019 / 2021 / 365。", "workbook": "图表-示例-折线图与面积图.xlsx"}], "file": "图表-示例-折线图与面积图.xlsx"}, {"id": "charts-03-pie-doughnut", "group": "charts", "column": "C07", "level2": "C07-L2-3", "title": "饼图与圆环图", "level": "入门", "body": "**饼图看占比**：饼图把一个整体切成若干扇形，每块扇形的角度就是它在整体里的占比。饼图只适合展示一个整体的构成，类别一般不超过 6 个，类别太多时小扇形挤在一起，根本读不出来。\n\n**圆环图是空心饼图**：圆环图与饼图表达的信息相同，区别是中间空出一块，可以放总计数字或标题。多系列圆环图可以套多层环，每层环是一个整体，适合对比两个时期的结构。\n\n**复合饼图是主饼加子饼**：主饼里太小的几项会被合并成“其他”，子饼再把“其他”展开。这样既保住了主饼的简洁，又没有丢掉小类别的信息。", "steps": [], "sections": [{"title": "基础概念", "body": "**饼图看占比**：饼图把一个整体切成若干扇形，每块扇形的角度就是它在整体里的占比。饼图只适合展示一个整体的构成，类别一般不超过 6 个，类别太多时小扇形挤在一起，根本读不出来。\n\n**圆环图是空心饼图**：圆环图与饼图表达的信息相同，区别是中间空出一块，可以放总计数字或标题。多系列圆环图可以套多层环，每层环是一个整体，适合对比两个时期的结构。\n\n**复合饼图是主饼加子饼**：主饼里太小的几项会被合并成“其他”，子饼再把“其他”展开。这样既保住了主饼的简洁，又没有丢掉小类别的信息。"}], "source": "docs/charts/03-pie-doughnut.md", "updated": "2026-11-10", "objectives": ["用饼图展示市场份额，核对各部分占比之和为 100", "用圆环图展示费用结构，并在圆环中心放关键数字", "用复合饼图把主饼里过小的“其他”项展开成子饼", "判断类别超过 6 个时为什么不能用饼图"], "formulas": [], "scenarios": [], "pitfalls": [], "exercises": ["用市场份额表做一张饼图，核对五项份额之和为 100，并把华东扇形向外拖出，写一句话结论。", "用费用结构表做一张圆环图，在圆环中心放“人力占 45%”六个字，说明圆环图比饼图多提供了什么信息。", "用五类市场份额数据做一张复合饼图，设置第二绘图区包含最后 3 个值，写出主饼三项与子饼三项的数值，并验证子饼之和等于主饼的“其他”项。"], "answers": ["五项之和：35 + 25 + 20 + 12 + 8 = 100。结论示例：华东 35% 为第一大市场，超过华北与华南之和的一半。", "圆环图中心可以放总计数字或一句话标题，饼图没有这个位置；本例中心放“人力占 45%”后，读者不用看标签就能抓住费用结构的最大头。", "主饼：华东 35、华北 25、其他 40；子饼：华南 20、华西 12、其他 8。验证：20 + 12 + 8 = 40，与主饼“其他 40”相等。"], "versions": "Excel 2007 / 2010 / 2013 / 2016 / 2019 / 2021 / 365", "chart_items": [{"name": "饼图", "name_en": "Pie Chart", "preview": "docs/charts/images/pie.png", "use": "展示一个整体的构成占比，例如市场份额：华东 35%、华北 25%、华南 20%、华西 12%、其他 8%，五项合计 100%。", "data_header": ["区域", "份额"], "data_rows": [["华东", "35"], ["华北", "25"], ["华南", "20"], ["华西", "12"], ["其他", "8"]], "steps": ["选中数据区域 A1:B6（含表头）。", "点插入选项卡，在图表组里点饼图，选二维饼图。", "右键饼图，点添加数据标签，再右键数据标签，勾选百分比，取消勾选值。", "把最大的扇形（华东 35%）向外拖出一点，突出重点。", "标题改成结论句，例如“华东占三分之一以上，是第一大市场”。"], "fmt": "扇形按占比从大到小顺时针排列；每块扇形用不同颜色，相邻颜色对比要明显；不要用三维饼图，三维透视会让后面的扇形看起来比实际小。", "faq": [{"q": "饼图类别超过 6 个怎么办？", "a": "把最小的几项合并为其他，或改用条形图；饼图不适合展示太多类别。"}, {"q": "百分比标签加起来不是 100% 怎么办？", "a": "四舍五入所致，属正常现象；核对原始数据之和是否为 100 即可。"}, {"q": "两组占比想对比怎么办？", "a": "饼图不适合对比两组数据；用两张并排的条形图，或用圆环图套两层环。"}], "versions": "全部版本均支持，兼容 Excel 2007 / 2010 / 2013 / 2016 / 2019 / 2021 / 365。", "workbook": "图表-示例-饼图与圆环图.xlsx"}, {"name": "圆环图", "name_en": "Doughnut Chart", "preview": "docs/charts/images/doughnut.png", "use": "展示一个整体的构成占比，同时想在图中心放总计数字，例如费用结构：人力成本 45%、房租 20%、营销推广 15%、设备折旧 12%、其他 8%，五项合计 100%。", "data_header": ["费用项目", "占比"], "data_rows": [["人力成本", "45"], ["房租", "20"], ["营销推广", "15"], ["设备折旧", "12"], ["其他", "8"]], "steps": ["选中数据区域 A1:B6（含表头）。", "点插入选项卡，在图表组里点饼图下拉，选圆环图。", "右键圆环，点添加数据标签，勾选百分比。", "在圆环中心插入文本框，写总计或标题，例如“月费用 100%”。", "标题改成结论句，例如“人力成本占近一半，是最大的费用项”。"], "fmt": "圆环粗细在设置数据系列格式里调，环太细读数困难，太粗与饼图无异；中心文字只放一个关键数字，不要塞一整段话；多系列圆环图每层环用同一套配色，方便按颜色对照。", "faq": [{"q": "圆环图和饼图怎么选？", "a": "只看占比用饼图；想在图中心放总计数字，或要对比两个时期的结构，用圆环图。"}, {"q": "圆环中心怎么放字？", "a": "插入文本框拖到圆环中心，输入文字后去掉文本框边框与填充。"}, {"q": "多层圆环图怎么读？", "a": "每层环是一个整体，内环与外环按颜色对照同一类别；层数超过 2 层就很难读。"}], "versions": "全部版本均支持，兼容 Excel 2007 / 2010 / 2013 / 2016 / 2019 / 2021 / 365。", "workbook": "图表-示例-饼图与圆环图.xlsx"}, {"name": "复合饼图", "name_en": "Pie of Pie", "preview": "docs/charts/images/pie-of-pie.png", "use": "主饼里有几项太小、直接展示读不出来时，把它们合并成“其他”再用子饼展开，例如市场份额主饼只留华东 35%、华北 25%、其他 40%，子饼把其他 40% 展开为华南 20%、华西 12%、其他 8%。", "data_header": ["区域", "份额"], "data_rows": [["华东", "35"], ["华北", "25"], ["其他", "40"]], "steps": ["选中完整数据区域 A1:B6（五类原始数据：华东 35、华北 25、华南 20、华西 12、其他 8）。", "点插入选项卡，在图表组里点饼图下拉，选复合饼图。", "右键主饼，点设置数据系列格式，在第二绘图区包含最后 3 个值（即华南、华西、其他进子饼）。", "两个饼都添加百分比数据标签。", "标题改成结论句，例如“华东、华北合计占 60%，其余三地合计占 40%”。"], "fmt": "子饼与主饼之间用连线对应“其他”扇形；子饼里的“其他 8%”是原始数据里最小的类别，不要与主饼的“其他 40%”混淆；复合饼图只适合主饼 3 到 4 项的情况。", "faq": [{"q": "子饼里出现了几个值，怎么定？", "a": "在设置数据系列格式里改第二绘图区包含最后几个值，默认是最后 3 个。"}, {"q": "主饼的“其他”和子饼的“其他”是一回事吗？", "a": "不是。主饼的“其他 40%”是三类之和，子饼的“其他 8%”是原始数据里最小的一类。"}, {"q": "复合饼图和复合条饼图怎么选？", "a": "子饼想用饼图展示选复合饼图，子饼想用条形图展示选复合条饼图。"}], "versions": "全部版本均支持，兼容 Excel 2007 / 2010 / 2013 / 2016 / 2019 / 2021 / 365。", "workbook": "图表-示例-饼图与圆环图.xlsx"}], "file": "图表-示例-饼图与圆环图.xlsx"}, {"id": "charts-04-scatter-bubble", "group": "charts", "column": "C07", "level2": "C07-L2-4", "title": "散点图与气泡图", "level": "进阶", "body": "**散点图看关系**：散点图的横轴与纵轴都是数值，每个点是一次观测。点越接近一条直线，两个变量的关系越强；点散成一团，说明两者没什么关系。散点图只回答“有没有关系”，不回答“谁导致谁”。\n\n**气泡图是三维散点图**：气泡图在散点图的基础上加了第三个变量，用气泡的大小表示。横轴一个变量、纵轴一个变量、气泡大小一个变量，一张图能同时讲三个维度。\n\n**回归分析是给散点找一条线**：线性回归用最小二乘法给散点找一条最贴合的直线，方程写成 y = a x + b，R 平方表示这条线解释了多少波动。R 平方越接近 1，线越贴合。", "steps": [], "sections": [{"title": "基础概念", "body": "**散点图看关系**：散点图的横轴与纵轴都是数值，每个点是一次观测。点越接近一条直线，两个变量的关系越强；点散成一团，说明两者没什么关系。散点图只回答“有没有关系”，不回答“谁导致谁”。\n\n**气泡图是三维散点图**：气泡图在散点图的基础上加了第三个变量，用气泡的大小表示。横轴一个变量、纵轴一个变量、气泡大小一个变量，一张图能同时讲三个维度。\n\n**回归分析是给散点找一条线**：线性回归用最小二乘法给散点找一条最贴合的直线，方程写成 y = a x + b，R 平方表示这条线解释了多少波动。R 平方越接近 1，线越贴合。"}], "source": "docs/charts/04-scatter-bubble.md", "updated": "2026-11-10", "objectives": ["用散点图判断广告费与销售额之间有没有关系、关系有多强", "用气泡图同时展示销量、单价与利润三个变量", "对散点图做线性回归，读出回归方程与 R 平方值，并说出预测的适用边界", "区分相关关系与因果关系，不把“一起涨”说成“因为所以”"], "formulas": [], "scenarios": [], "pitfalls": [], "exercises": ["用示例工作簿里的广告费与销售额表做一张散点图，描述 8 个点的分布形态，并判断两者是正相关还是负相关。", "给散点图添加线性趋势线，写出回归方程与 R 平方值，并用方程预测广告费为 15 万元时的销售额，再与表中实际值 88 万元对比，算出残差。", "用气泡图表做一张五款产品的气泡图，哪个产品的利润最大？哪个产品的单价最高？E 款单价最高但利润为什么不是最高？"], "answers": ["8 个点大致沿一条上升直线分布，广告费越大，销售额越大，两者为正相关。", "回归方程为销售额 = 4.30 x 广告费 + 23.08，R 平方 = 0.995。广告费 15 万元时预测销售额为 4.30 x 15 + 23.08 = 87.58 万元，实际值为 88 万元，残差为 88 - 87.58 = 0.42 万元，拟合非常好。", "D 款利润最大，为 9000 元；E 款单价最高，为 120 元。E 款利润不是最高，因为利润等于销量乘以单价，E 款销量只有 60 件，60 x 120 = 7200 元，小于 D 款的 150 x 60 = 9000 元。"], "versions": "Excel 2007 / 2010 / 2013 / 2016 / 2019 / 2021 / 365", "chart_items": [{"name": "散点图", "name_en": "Scatter Chart", "preview": "docs/charts/images/scatter.png", "use": "判断两个数值变量之间有没有关系，例如广告费越高，销售额是不是也越高；8 个观测点的分布是否大致沿一条直线上升。", "data_header": ["广告费", "销售额"], "data_rows": [["5", "42"], ["8", "58"], ["10", "65"], ["12", "78"], ["15", "88"], ["18", "102"], ["20", "110"], ["25", "128"]], "steps": ["选中数据区域 A1:B9（含表头）。", "点插入选项卡，在图表组里点散点图，选仅带数据标记的散点图。", "横轴放广告费（自变量），纵轴放销售额（因变量），不要放反。", "右键横轴与纵轴，把刻度调成从 0 开始，避免分布被拉变形。", "标题改成结论句，例如“广告费越高，销售额越高，8 个点大致沿直线分布”。"], "fmt": "数据点用实心圆点，大小适中；不要把散点连成折线，连上线就暗示了点与点之间有顺序，散点图没有顺序；点太多重叠时把透明度调到 60% 左右。", "faq": [{"q": "散点图和折线图怎么选？", "a": "两个变量都是数值、想看关系用散点图；横轴是时间、想看趋势用折线图。"}, {"q": "横轴与纵轴放反了怎么办？", "a": "右键图表点选择数据，点编辑，把 X 值与 Y 值对调。"}, {"q": "点散成一团说明什么？", "a": "说明两个变量之间没有明显的线性关系，不要硬找规律。"}], "versions": "全部版本均支持，兼容 Excel 2007 / 2010 / 2013 / 2016 / 2019 / 2021 / 365。", "workbook": "图表-示例-散点图与气泡图.xlsx"}, {"name": "气泡图", "name_en": "Bubble Chart", "preview": "docs/charts/images/bubble.png", "use": "同时展示三个变量，例如五款产品的销量（横轴）、单价（纵轴）与利润（气泡大小），一眼看出 D 款利润最大、E 款单价最高但销量最低。", "data_header": ["产品", "销量", "单价", "利润"], "data_rows": [["A款", "120", "45", "5400"], ["B款", "200", "28", "5600"], ["C款", "80", "90", "7200"], ["D款", "150", "60", "9000"], ["E款", "60", "120", "7200"]], "steps": ["选中数据区域 A1:D6（含表头，产品列是标签列）。", "点插入选项卡，在图表组里点散点图下拉，选气泡图。", "右键图表点选择数据，确认 X 值是销量列、Y 值是单价列、气泡大小是利润列。", "给每个气泡加上产品标签（A 款到 E 款），否则读者不知道哪个气泡是谁。", "标题改成结论句，例如“D 款利润 9000 元最高，E 款单价最高但销量最低”。"], "fmt": "气泡大小按利润等比缩放，Excel 会自动算；气泡太多重叠时调透明度；气泡数量超过 10 个就很难读，改用表格或拆图。", "faq": [{"q": "气泡大小代表什么？", "a": "代表第三个变量，本例是利润；气泡面积与数值成正比，不是直径。"}, {"q": "气泡标签怎么加？", "a": "右键气泡点添加数据标签，再把标签内容改成产品列。"}, {"q": "气泡图能放负数吗？", "a": "气泡大小不能为负数；销量或单价出现负数时，气泡图不适用。"}], "versions": "全部版本均支持，兼容 Excel 2007 / 2010 / 2013 / 2016 / 2019 / 2021 / 365。", "workbook": "图表-示例-散点图与气泡图.xlsx"}, {"name": "回归分析", "name_en": "Regression Analysis", "preview": "docs/charts/images/regression.png", "use": "给散点图配一条回归直线并量化关系强度，例如广告费与销售额的回归方程为销售额 = 4.30 x 广告费 + 23.08，R 平方 = 0.995，说明广告费能解释销售额 99.5% 的波动。", "data_header": ["广告费", "销售额"], "data_rows": [["5", "42"], ["8", "58"], ["10", "65"], ["12", "78"], ["15", "88"], ["18", "102"], ["20", "110"], ["25", "128"]], "steps": ["先按散点图的做法做出广告费与销售额的散点图。", "右键任一数据点，点添加趋势线。", "在设置趋势线格式窗格里选线性。", "勾选显示公式与显示 R 平方值，图表上出现方程与 R 平方值。", "读出方程：销售额 = 4.30 x 广告费 + 23.08，R 平方 = 0.995。"], "fmt": "回归线用虚线、与数据点不同的颜色；公式与 R 平方值放在图表空白处；残差大的点要单独检查，可能是录入错误或特殊情况，不要直接删掉。", "faq": [{"q": "R 平方 0.995 说明什么？", "a": "说明回归线对 8 个点的拟合程度极高，广告费能解释销售额 99.5% 的波动。"}, {"q": "能用方程预测广告费 30 万元时的销售额吗？", "a": "可以算：4.30 x 30 + 23.08 = 152.08 万元，但 30 万元超出了观测范围（5 到 25 万元），外推预测仅供参考。"}, {"q": "相关关系等于因果关系吗？", "a": "不等于。广告费与销售额一起涨，不代表涨销售额全是广告费的功劳，可能还有季节、促销等因素。"}], "versions": "全部版本均支持，兼容 Excel 2007 / 2010 / 2013 / 2016 / 2019 / 2021 / 365。", "workbook": "图表-示例-散点图与气泡图.xlsx"}], "file": "图表-示例-散点图与气泡图.xlsx"}, {"id": "charts-05-combo", "group": "charts", "column": "C07", "level2": "C07-L2-5", "title": "组合图", "level": "进阶", "body": "**组合图是一张图两种图形**：组合图把柱形图与折线图画在同一张图上，柱子看绝对值，折线看比率或趋势。两个系列的量级差太大时，折线会被压成一条直线，这时就要给它单独配一个坐标轴。\n\n**双轴是组合图的标配**：左轴管柱子（销售额，万元），右轴管折线（增长率，%）。双轴让两个量级的序列都能正常显示，但双轴也容易误导：左右轴的刻度一改，两条线的相对位置就全变了。\n\n**帕累托图是柱形图加累计折线**：帕累托图按数量从大到小排柱子，再叠加一条累计占比折线，帮你找到“关键的少数”。帕累托法则说：80% 的问题往往由 20% 的原因造成。", "steps": [], "sections": [{"title": "基础概念", "body": "**组合图是一张图两种图形**：组合图把柱形图与折线图画在同一张图上，柱子看绝对值，折线看比率或趋势。两个系列的量级差太大时，折线会被压成一条直线，这时就要给它单独配一个坐标轴。\n\n**双轴是组合图的标配**：左轴管柱子（销售额，万元），右轴管折线（增长率，%）。双轴让两个量级的序列都能正常显示，但双轴也容易误导：左右轴的刻度一改，两条线的相对位置就全变了。\n\n**帕累托图是柱形图加累计折线**：帕累托图按数量从大到小排柱子，再叠加一条累计占比折线，帮你找到“关键的少数”。帕累托法则说：80% 的问题往往由 20% 的原因造成。"}], "source": "docs/charts/05-combo.md", "updated": "2026-11-10", "objectives": ["用柱线组合图同时展示销售额与增长率", "给增长率单独配一个右轴，解决两个量级差太大的问题", "用帕累托图找出造成 80% 问题的原因，并算出累计占比", "判断什么情况下不该用双轴，避免双轴误导读者"], "formulas": [], "scenarios": [], "pitfalls": [], "exercises": ["用示例工作簿里的 1 月到 6 月数据做一张柱线组合图：销售额用柱（左轴），增长率用线（右轴）。哪个月销售额最高？哪个月增长率最高？是同一个月吗？", "把增长率系列改到次坐标轴之前与之后各截一张图对比，说明为什么量级差太大时必须用双轴。", "用不合格原因表做一张帕累托图，算出前两项（划伤与色差）的累计占比，并写一句话说明应该优先解决哪两项、为什么。"], "answers": ["销售额最高是 6 月，210 万元；增长率最高也是 6 月，18%。是同一个月。次高是 4 月：销售额 180 万元、增长率 15%。", "改到次坐标轴之前，增长率只有 6% 到 18%，在 0 到 210 万元的左轴刻度下几乎贴着横轴，是一条看不出起伏的直线；改到次坐标轴之后，折线用 0% 到 20% 的右轴刻度，3 月回落到 6%、6 月冲到 18% 的变化一目了然。", "前两项累计占比为 45% + 28% = 73%。应优先解决划伤与色差，因为两项就占了不合格总数的 73%，解决这两项的效果最大，符合帕累托法则中“关键的少数”的思路。"], "versions": "Excel 2013 / 2016 / 2019 / 2021 / 365（组合图需 Excel 2013 及以上版本；帕累托图需 Excel 2016 及以上版本）", "chart_items": [{"name": "柱线组合图", "name_en": "Combo Chart", "preview": "docs/charts/images/combo.png", "use": "同时展示绝对值与比率，例如 1 月到 6 月的销售额（柱，万元）与增长率（线，%），同一组月份，两个视角一次看完。", "data_header": ["月份", "销售额", "增长率"], "data_rows": [["1月", "120", "8"], ["2月", "150", "12"], ["3月", "130", "6"], ["4月", "180", "15"], ["5月", "170", "10"], ["6月", "210", "18"]], "steps": ["选中数据区域 A1:C7（含表头）。", "点插入选项卡，在图表组里点组合图，选簇状柱形图与折线图的组合。", "在弹出的对话框里，把销售额设为簇状柱形图，把增长率设为折线图，并勾选增长率的次坐标轴。", "右键折线，点添加数据标签，标签显示百分比。", "标题改成结论句，例如“6 月销售额最高，增长率也最高，达到 18%”。"], "fmt": "柱子用商务蓝，折线用橙色加圆点标记；左右轴标题要写清楚单位（左轴万元、右轴百分比）；图例放底部，柱子与折线各标清楚。", "faq": [{"q": "折线被压成一条直线怎么办？", "a": "两个系列量级差太大；勾选增长率的次坐标轴，让折线用右轴刻度。"}, {"q": "组合图里能放三组数据吗？", "a": "能，但超过两组就很难读；三组以上建议拆成两张图。"}, {"q": "柱子与折线哪个放前面？", "a": "折线在上层，柱子在下层；右键折线选置于顶层，避免被柱子挡住。"}], "versions": "组合图需 Excel 2013 及以上版本，兼容 Excel 2013 / 2016 / 2019 / 2021 / 365；Excel 2010 及更早版本没有组合图功能，可用双轴做法手工模拟。", "workbook": "图表-示例-组合图.xlsx"}, {"name": "双轴图", "name_en": "Dual Axis Chart", "preview": "docs/charts/images/dual-axis.png", "use": "两个量级不同的序列画在一张图上，例如销售额 120 到 210 万元与增长率 6% 到 18% 共用 1 月到 6 月的横轴，左轴读销售额，右轴读增长率。", "data_header": ["月份", "销售额", "增长率"], "data_rows": [["1月", "120", "8"], ["2月", "150", "12"], ["3月", "130", "6"], ["4月", "180", "15"], ["5月", "170", "10"], ["6月", "210", "18"]], "steps": ["选中数据区域 A1:C7（含表头），先插入一张簇状柱形图。", "右键代表增长率的系列，点设置数据系列格式。", "在系列选项里选次坐标轴，该系列移到右轴。", "右键该系列，点更改系列图表类型，改成折线图。", "左右轴标题分别写清楚：左轴“销售额（万元）”，右轴“增长率（%）”。"], "fmt": "左右轴的刻度要诚实，不要为了制造“
