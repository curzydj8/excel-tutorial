定改不动 工作表被保护了。审阅→撤销工作表保护（需要密码），或联系表主。", "section": "solve", "ref": ""}, {"id": "solve-公式问题-6", "type": "solve", "column": "C16", "title": "下拉填充公式不变", "text": "公式问题 下拉填充公式不变 检查是否为手动计算；或填充的只是值。确认引用方式（相对/绝对）是否符合预期。", "section": "solve", "ref": ""}, {"id": "solve-错误代码专区-0", "type": "solve", "column": "C16", "title": "#N/A 查找不到", "text": "错误代码专区 #N/A 查找不到 VLOOKUP/XLOOKUP 没找到匹配值。检查多余空格（TRIM）、数字与文本格式不一致；用 IFNA 包裹给友好提示。", "section": "solve", "ref": ""}, {"id": "solve-错误代码专区-1", "type": "solve", "column": "C16", "title": "#VALUE! 类型错误", "text": "错误代码专区 #VALUE! 类型错误 文本参与了数值运算。检查隐藏空格、特殊字符，用 VALUE 转换或清理后再算。", "section": "solve", "ref": ""}, {"id": "solve-错误代码专区-2", "type": "solve", "column": "C16", "title": "#REF! 引用失效", "text": "错误代码专区 #REF! 引用失效 引用的单元格/区域被删除。撤销删除，或把公式中的引用改为有效区域。", "section": "solve", "ref": ""}, {"id": "solve-错误代码专区-3", "type": "solve", "column": "C16", "title": "#NAME? 名称错误", "text": "错误代码专区 #NAME? 名称错误 函数名拼错或用了中文括号。检查拼写，括号一律用英文半角。", "section": "solve", "ref": ""}, {"id": "solve-错误代码专区-4", "type": "solve", "column": "C16", "title": "#DIV/0! 除数为零", "text": "错误代码专区 #DIV/0! 除数为零 除数为 0 或空单元格。用 =IF(除数=0,\"-\",分子/除数) 规避。", "section": "solve", "ref": ""}, {"id": "solve-错误代码专区-5", "type": "solve", "column": "C16", "title": "#NUM! 数值超范围", "text": "错误代码专区 #NUM! 数值超范围 结果太大或迭代不收敛。检查参数数量级，迭代公式调大迭代次数。", "section": "solve", "ref": ""}, {"id": "solve-错误代码专区-6", "type": "solve", "column": "C16", "title": "#SPILL! 溢出被挡", "text": "错误代码专区 #SPILL! 溢出被挡 动态数组目标区域有内容挡住。清空溢出区域，或把公式移到空旷处。", "section": "solve", "ref": ""}, {"id": "solve-错误代码专区-7", "type": "solve", "column": "C16", "title": "#CALC! 计算异常", "text": "错误代码专区 #CALC! 计算异常 动态数组返回空或逻辑错误。检查筛选条件是否全不满足，调整条件。", "section": "solve", "ref": ""}, {"id": "solve-文件问题-0", "type": "solve", "column": "C16", "title": "文件打不开", "text": "文件问题 文件打不开 打开 Excel→文件→打开→选中文件→点“打开”按钮下拉箭头→“打开并修复”。", "section": "solve", "ref": ""}, {"id": "solve-文件问题-1", "type": "solve", "column": "C16", "title": "文件损坏", "text": "文件问题 文件损坏 先用“打开并修复”→“修复”；不行选“提取数据”；还可改后缀为 zip 解压取 xl/worksheets 下 xml 抢救。", "section": "solve", "ref": ""}, {"id": "solve-文件问题-2", "type": "solve", "column": "C16", "title": "文件恢复", "text": "文件问题 文件恢复 文件→信息→管理工作簿→恢复未保存的工作簿。建议把自动恢复间隔设为 5 分钟。", "section": "solve", "ref": ""}, {"id": "solve-文件问题-3", "type": "solve", "column": "C16", "title": "文件变成只读", "text": "文件问题 文件变成只读 右键文件→属性，取消只读勾选；或文件被他人占用，另存一份副本编辑。", "section": "solve", "ref": ""}, {"id": "solve-文件问题-4", "type": "solve", "column": "C16", "title": "自动关闭/闪退", "text": "文件问题 自动关闭/闪退 运行 excel /safe 进安全模式排查；逐个禁用 COM 加载项，找到肇事者。", "section": "solve", "ref": ""}, {"id": "solve-文件问题-5", "type": "solve", "column": "C16", "title": "保存失败", "text": "文件问题 保存失败 磁盘满、路径过长或云同步冲突。另存到本地短路径，暂停网盘同步再试。", "section": "solve", "ref": ""}, {"id": "solve-文件问题-6", "type": "solve", "column": "C16", "title": "内容/公式丢失", "text": "文件问题 内容/公式丢失 可能只保存了值。去自动恢复版本或文件历史版本里找回，别覆盖原文件。", "section": "solve", "ref": ""}, {"id": "solve-性能问题-0", "type": "solve", "column": "C16", "title": "Excel卡顿", "text": "性能问题 Excel卡顿 计算选项改手动；删除多余条件格式；避免整列引用 A:A，改精确区域。", "section": "solve", "ref": ""}, {"id": "solve-性能问题-1", "type": "solve", "column": "C16", "title": "Excel无响应", "text": "性能问题 Excel无响应 大运算时耐心等；真死机用任务管理器结束进程，再用自动恢复版本找回。", "section": "solve", "ref": ""}, {"id": "solve-性能问题-2", "type": "solve", "column": "C16", "title": "Excel崩溃", "text": "性能问题 Excel崩溃 更新 Office 到最新；禁用可疑加载项；控制面板→修复 Office 安装。", "section": "solve", "ref": ""}, {"id": "solve-性能问题-3", "type": "solve", "column": "C16", "title": "启动慢", "text": "性能问题 启动慢 清理 XLSTART 启动文件夹里的多余文件；文件→选项→加载项禁用不用的。", "section": "solve", "ref": ""}, {"id": "solve-性能问题-4", "type": "solve", "column": "C16", "title": "文件打开慢", "text": "性能问题 文件打开慢 Ctrl+End 看已用区域是否虚大，删除空白行列的格式后保存，体积立减。", "section": "solve", "ref": ""}, {"id": "solve-性能问题-5", "type": "solve", "column": "C16", "title": "文件保存慢", "text": "性能问题 文件保存慢 图片压缩一下；删掉大量图形对象；老 xls 另存为 xlsx。", "section": "solve", "ref": ""}, {"id": "solve-性能问题-6", "type": "solve", "column": "C16", "title": "计算速度慢", "text": "性能问题 计算速度慢 少用易失函数 NOW/TODAY/INDIRECT；数组公式改精确区域；能透视表就别堆公式。", "section": "solve", "ref": ""}, {"id": "solve-筛选排序问题-0", "type": "solve", "column": "C16", "title": "筛选不完整", "text": "筛选排序问题 筛选不完整 数据中有空行空列把区域隔断。删除空行后重新开启筛选。", "section": "solve", "ref": ""}, {"id": "solve-筛选排序问题-1", "type": "solve", "column": "C16", "title": "部分数据无法筛选", "text": "筛选排序问题 部分数据无法筛选 筛选只覆盖了部分区域。选中整表（Ctrl+A）再开筛选。", "section": "solve", "ref": ""}, {"id": "solve-筛选排序问题-2", "type": "solve", "column": "C16", "title": "排序错乱串行", "text": "筛选排序问题 排序错乱串行 只选中单列排序导致错位。务必选“扩展选定区域”再排序。", "section": "solve", "ref": ""}, {"id": "solve-筛选排序问题-3", "type": "solve", "column": "C16", "title": "日期排序错误", "text": "筛选排序问题 日期排序错误 日期是文本格式。数据→分列→日期 YMD 转正后再排序。", "section": "solve", "ref": ""}, {"id": "solve-筛选排序问题-4", "type": "solve", "column": "C16", "title": "数字排序错误", "text": "筛选排序问题 数字排序错误 数字存成了文本。选中列→感叹号→转换为数字。", "section": "solve", "ref": ""}, {"id": "solve-筛选排序问题-5", "type": "solve", "column": "C16", "title": "合并单元格排不了", "text": "筛选排序问题 合并单元格排不了 先取消合并，用 Ctrl+D 填充内容后再排序。", "section": "solve", "ref": ""}, {"id": "solve-打印问题-0", "type": "solve", "column": "C16", "title": "打印不全", "text": "打印问题 打印不全 页面布局→缩放→调整为 1 页宽；检查打印区域是否框小了。", "section": "solve", "ref": ""}, {"id": "solve-打印问题-1", "type": "solve", "column": "C16", "title": "打印出空白页", "text": "打印问题 打印出空白页 分页预览里拖蓝线收掉多余分页；删除打印区域外的残留格式。", "section": "solve", "ref": ""}, {"id": "solve-打印问题-2", "type": "solve", "column": "C16", "title": "打印内容偏移", "text": "打印问题 打印内容偏移 页面设置→页边距→勾选水平居中；检查纸张大小是否匹配。", "section": "solve", "ref": ""}, {"id": "solve-打印问题-3", "type": "solve", "column": "C16", "title": "页码错误", "text": "打印问题 页码错误 页眉页脚→自定义页脚插入 &[页码]；检查起始页码设置。", "section": "solve", "ref": ""}, {"id": "solve-打印问题-4", "type": "solve", "column": "C16", "title": "打印缩放异常", "text": "打印问题 打印缩放异常 缩放设为“调整为 1 页”；宽表用横向打印。", "section": "solve", "ref": ""}, {"id": "solve-打印问题-5", "type": "solve", "column": "C16", "title": "表格线印不出", "text": "打印问题 表格线印不出 页面设置→工作表→勾选“网格线”；或给区域加边框。", "section": "solve", "ref": ""}, {"id": "solve-数据导入问题-0", "type": "solve", "column": "C16", "title": "CSV乱码", "text": "数据导入问题 CSV乱码 别双击打开。用数据→从文本/CSV 导入，文件原始格式选 65001:UTF-8 或 936。", "section": "solve", "ref": ""}, {"id": "solve-数据导入问题-1", "type": "solve", "column": "C16", "title": "中文乱码", "text": "数据导入问题 中文乱码 导入时选对编码；已乱码的用 Power Query 重新指定编码导入一次。", "section": "solve", "ref": ""}, {"id": "solve-数据导入问题-2", "type": "solve", "column": "C16", "title": "日期错乱", "text": "数据导入问题 日期错乱 导入向导第三步把该列设为“日期 YMD”；事后也可用分列转换。", "section": "solve", "ref": ""}, {"id": "solve-数据导入问题-3", "type": "solve", "column": "C16", "title": "数字变文本", "text": "数据导入问题 数字变文本 数据→分列→完成；或 =A1*1 批量转数值。", "section": "solve", "ref": ""}, {"id": "solve-数据导入问题-4", "type": "solve", "column": "C16", "title": "列错位", "text": "数据导入问题 列错位 分隔符选错了。导入时勾选正确的逗号/制表符分隔，预览对齐再加载。", "section": "solve", "ref": ""}, {"id": "solve-数据导入问题-5", "type": "solve", "column": "C16", "title": "前导零丢失", "text": "数据导入问题 前导零丢失 导入前把该列设为文本；或公式 =\"'\"&编号 保留 001 开头。", "section": "solve", "ref": ""}, {"id": "solve-图表问题-0", "type": "solve", "column": "C16", "title": "图表不更新", "text": "图表问题 图表不更新 数据源是固定区域。转成智能表格（Ctrl+T）或用 OFFSET 动态名称，新增自动进图。", "section": "solve", "ref": ""}, {"id": "solve-图表问题-1", "type": "solve", "column": "C16", "title": "图表数据丢失", "text": "图表问题 图表数据丢失 隐藏行列被排除。右键图表→选择数据→勾选“显示隐藏行列中的数据”。", "section": "solve", "ref": ""}, {"id": "solve-图表问题-2", "type": "solve", "column": "C16", "title": "坐标轴错误", "text": "图表问题 坐标轴错误 右键坐标轴→设置坐标轴格式，检查最小值/最大值、单位和对数刻度。", "section": "solve", "ref": ""}, {"id": "solve-图表问题-3", "type": "solve", "column": "C16", "title": "图表显示异常", "text": "图表问题 图表显示异常 图表被拉伸变形，重置大小；兼容模式文件另存为 xlsx 再试。", "section": "solve", "ref": ""}, {"id": "solve-图表问题-4", "type": "solve", "column": "C16", "title": "图例错乱", "text": "图表问题 图例错乱 右键→选择数据，重新指定系列名称和水平分类标签。", "section": "solve", "ref": ""}, {"id": "solve-图表问题-5", "type": "solve", "column": "C16", "title": "新增数据不进图表", "text": "图表问题 新增数据不进图表 数据源转智能表格后图表自动扩展；或手动更改数据区域。", "section": "solve", "ref": ""}, {"id": "solve-数据透视表问题-0", "type": "solve", "column": "C16", "title": "无法刷新", "text": "数据透视表问题 无法刷新 右键→刷新；若源区域变了，去数据透视表分析→更改数据源重框选。", "section": "solve", "ref": ""}, {"id": "solve-数据透视表问题-1", "type": "solve", "column": "C16", "title": "数据源错误", "text": "数据透视表问题 数据源错误 源表有空行空列或列名重复。清理后重新指定数据源。", "section": "solve", "ref": ""}, {"id": "solve-数据透视表问题-2", "type": "solve", "column": "C16", "title": "分组失败", "text": "数据透视表问题 分组失败 同一字段混有文本和日期/数字。先统一格式再分组。", "section": "solve", "ref": ""}, {"id": "solve-数据透视表问题-3", "type": "solve", "column": "C16", "title": "字段消失", "text": "数据透视表问题 字段消失 字段列表里重新勾选；检查源表列名是否被改名。", "section": "solve", "ref": ""}, {"id": "solve-数据透视表问题-4", "type": "solve", "column": "C16", "title": "统计错误", "text": "数据透视表问题 统计错误 值字段设置→改求和/计数/平均；文本字段默认计数是正常的。", "section": "solve", "ref": ""}, {"id": "solve-数据透视表问题-5", "type": "solve", "column": "C16", "title": "日期不自动分组", "text": "数据透视表问题 日期不自动分组 365 才支持自动分组；旧版用右键→分组，或加年月辅助列。", "section": "solve", "ref": ""}, {"id": "solve-Power Query问题-0", "type": "solve", "column": "C16", "title": "无法刷新", "text": "Power Query问题 无法刷新 查询→刷新全部；源文件路径移动了就重新定位源。", "section": "solve", "ref": ""}, {"id": "solve-Power Query问题-1", "type": "solve", "column": "C16", "title": "导入失败", "text": "Power Query问题 导入失败 源文件被占用或格式不支持。关闭占用后重试，或换格式。", "section": "solve", "ref": ""}, {"id": "solve-Power Query问题-2", "type": "solve", "column": "C16", "title": "合并失败", "text": "Power Query问题 合并失败 连接键两边类型不一致。先把两边键统一为文本再合并。", "section": "solve", "ref": ""}, {"id": "solve-Power Query问题-3", "type": "solve", "column": "C16", "title": "类型错误", "text": "Power Query问题 类型错误 删除“更改的类型”步骤重设；或手动改回正确类型。", "section": "solve", "ref": ""}, {"id": "solve-Power Query问题-4", "type": "solve", "column": "C16", "title": "数据丢失", "text": "Power Query问题 数据丢失 逐步点击应用步骤回看，检查筛选/删除步骤是否误删。", "section": "solve", "ref": ""}, {"id": "solve-Power Query问题-5", "type": "solve", "column": "C16", "title": "刷新很慢", "text": "Power Query问题 刷新很慢 先筛选缩小数据量再做复杂转换；减少破坏折叠的步骤。", "section": "solve", "ref": ""}, {"id": "faq-0", "type": "faq", "column": "", "title": "如何统计重复数据？", "text": "如何统计重复数据？ 用 COUNTIF：=COUNTIF(A:A,A2)>1 标出重复；或数据→删除重复项直接去重；365 用 =UNIQUE(A:A) 取唯一值。", "section": "faq", "ref": ""}, {"id": "faq-1", "type": "faq", "column": "", "title": "如何制作动态下拉框？", "text": "如何制作动态下拉框？ 二级联动：先定义各省城市为名称，一级下拉选省份，二级数据验证来源写 =INDIRECT($A2)。", "section": "faq", "ref": ""}, {"id": "faq-2", "type": "faq", "column": "", "title": "为什么 VLOOKUP 返回 #N/A？", "text": "为什么 VLOOKUP 返回 #N/A？ 四查：①查找值前后有空格没（TRIM）；②首列真有这个值吗；③数字存成文本（格式统一）；④第四参数写 FALSE 了吗。还不行就换 XLOOKUP。", "section": "faq", "ref": ""}, {"id": "faq-3", "type": "faq", "column": "", "title": "筛选后求和不对怎么办？", "text": "筛选后求和不对怎么办？ SUM 会把隐藏行也加进去，改用 =SUBTOTAL(109,区域)，109 表示只对可见单元格求和。", "section": "faq", "ref": ""}, {"id": "faq-4", "type": "faq", "column": "", "title": "日期显示成数字怎么办？", "text": "日期显示成数字怎么办？ 那是日期序列值，选中→Ctrl+1→设为日期格式。反过来文本日期转真日期用 DATEVALUE 或分列。", "section": "faq", "ref": ""}, {"id": "faq-5", "type": "faq", "column": "", "title": "如何合并多个工作表？", "text": "如何合并多个工作表？ 结构相同的表：Power Query→追加查询，一键合并几十个表，还能自动刷新。", "section": "faq", "ref": ""}, {"id": "faq-6", "type": "faq", "column": "", "title": "公式太长看不懂怎么办？", "text": "公式太长看不懂怎么办？ 用 LET 给中间结果起名：=LET(x,SUM(A:A),y,COUNT(A:A),x/y)。或按 Alt+Enter 在编辑栏换行。", "section": "faq", "ref": ""}, {"id": "faq-7", "type": "faq", "column": "", "title": "文件太大打不开？", "text": "文件太大打不开？ 先关自动重算（公式→手动）；删多余格式（Ctrl+End 看看用到哪）；另存为 xlsb 二进制格式体积减半。", "section": "faq", "ref": ""}, {"id": "faq-8", "type": "faq", "column": "", "title": "如何防止别人改公式？", "text": "如何防止别人改公式？ 全选→取消锁定→只选中公式区→锁定→审阅→保护工作表设密码。只锁公式，数据区可填。", "section": "faq", "ref": ""}, {"id": "faq-9", "type": "faq", "column": "", "title": "打印时每页都有标题行？", "text": "打印时每页都有标题行？ 页面布局→打印标题→顶端标题行→选 $1:$1。", "section": "faq", "ref": ""}, {"id": "faq-10", "type": "faq", "column": "", "title": "下拉数字变成日期？", "text": "下拉数字变成日期？ 如 1-2 被认成 1月2日。先设单元格为文本格式再输，或前面加英文单引号 '1-2。", "section": "faq", "ref": ""}, {"id": "faq-11", "type": "faq", "column": "", "title": "VLOOKUP 只能向右找怎么办？", "text": "VLOOKUP 只能向右找怎么办？ 用 INDEX+MATCH：=INDEX(返回列,MATCH(查找值,查找列,0))，方向随意。或直接 XLOOKUP。", "section": "faq", "ref": ""}, {"id": "faq-12", "type": "faq", "column": "", "title": "如何批量提取括号内容？", "text": "如何批量提取括号内容？ Ctrl+E 快速填充最省事；公式法 =MID(A2,FIND(\"(\",A2)+1,FIND(\")\",A2)-FIND(\"(\",A2)-1)。", "section": "faq", "ref": ""}, {"id": "faq-13", "type": "faq", "column": "", "title": "条件格式太多卡顿？", "text": "条件格式太多卡顿？ 条件格式→管理规则，删掉整列引用的（如 $A:$A），改成实际区域 $A$1:$A$1000。", "section": "faq", "ref": ""}, {"id": "faq-14", "type": "faq", "column": "", "title": "共享后公式被改乱？", "text": "共享后公式被改乱？ 保护工作表+只允许填数据区；或存 OneDrive 用版本历史找回。", "section": "faq", "ref": ""}, {"id": "faq-15", "type": "faq", "column": "", "title": "如何让序号下拉不中断？", "text": "如何让序号下拉不中断？ 用 =ROW()-1 公式下拉，删行不断号；或转智能表格，公式自动填充。", "section": "faq", "ref": ""}, {"id": "faq-16", "type": "faq", "column": "", "title": "身份证号变成科学计数法怎么办？", "text": "身份证号变成科学计数法怎么办？ 先设文本格式再录入；已变形用 =TEXT(A1,\"0\") 恢复显示。", "section": "faq", "ref": ""}, {"id": "faq-17", "type": "faq", "column": "", "title": "VLOOKUP 返回 #N/A 但值明明存在？", "text": "VLOOKUP 返回 #N/A 但值明明存在？ 检查多余空格（TRIM 清理）、数字与文本格式不一致，统一后再查。", "section": "faq", "ref": ""}, {"id": "faq-18", "type": "faq", "column": "", "title": "如何快速删除重复行？", "text": "如何快速删除重复行？ 数据→删除重复项；365 也可用 =UNIQUE(A:A) 提取唯一值。", "section": "faq", "ref": ""}, {"id": "faq-19", "type": "faq", "column": "", "title": "筛选后序号不连续怎么办？", "text": "筛选后序号不连续怎么办？ 用 =SUBTOTAL(103,$A$2:A2) 下拉，筛选后序号自动连续。", "section": "faq", "ref": ""}, {"id": "faq-20", "type": "faq", "column": "", "title": "公式下拉后结果都一样？", "text": "公式下拉后结果都一样？ 检查计算选项是否为手动，改回自动；或单元格被设为文本格式。", "section": "faq", "ref": ""}, {"id": "faq-21", "type": "faq", "column": "", "title": "如何跨表汇总多个分表？", "text": "如何跨表汇总多个分表？ 用 =SUM(表1:表3!B2) 三维引用；或 Power Query 合并文件夹。", "section": "faq", "ref": ""}, {"id": "faq-22", "type": "faq", "column": "", "title": "打印时每页都显示标题行？", "text": "打印时每页都显示标题行？ 页面布局→打印标题→顶端标题行设为 $1:$1。", "section": "faq", "ref": ""}, {"id": "faq-23", "type": "faq", "column": "", "title": "CSV 打开中文乱码？", "text": "CSV 打开中文乱码？ 用数据→从文本/CSV 导入，编码选 UTF-8 或 936。", "section": "faq", "ref": ""}, {"id": "faq-24", "type": "faq", "column": "", "title": "文件太大打开很慢？", "text": "文件太大打开很慢？ Ctrl+End 看已用区域是否虚大，删多余行列格式后保存。", "section": "faq", "ref": ""}, {"id": "faq-25", "type": "faq", "column": "", "title": "如何防止别人改我的公式？", "text": "如何防止别人改我的公式？ 审阅→保护工作表，锁定含公式单元格后设密码。", "section": "faq", "ref": ""}, {"id": "faq-26", "type": "faq", "column": "", "title": "数据透视表日期不能按月分组？", "text": "数据透视表日期不能按月分组？ 检查该列是否混入文本，先统一为日期格式再分组。", "section": "faq", "ref": ""}, {"id": "faq-27", "type": "faq", "column": "", "title": "图表新增数据不自动更新？", "text": "图表新增数据不自动更新？ 数据源转智能表格（Ctrl+T），图表会自动扩展。", "section": "faq", "ref": ""}, {"id": "faq-28", "type": "faq", "column": "", "title": "如何批量把文本型数字转数值？", "text": "如何批量把文本型数字转数值？ 选中列→分列→完成；或空单元格写 1 复制→选择性粘贴→乘。", "section": "faq", "ref": ""}, {"id": "faq-29", "type": "faq", "column": "", "title": "Excel 卡死没保存能找回吗？", "text": "Excel 卡死没保存能找回吗？ 文件→信息→管理工作簿→恢复未保存的工作簿；建议开 5 分钟自动恢复。", "section": "faq", "ref": ""}, {"id": "chart-0", "type": "chart", "column": "C07", "title": "柱状图", "text": "柱状图 比较各类别数值 选中数据（含表头） 插入→柱状图→簇状 右键→添加数据标签 删除网格线", "section": "chartlib", "ref": ""}, {"id": "chart-1", "type": "chart", "column": "C07", "title": "条形图", "text": "条形图 类别名称长时的比较 选中数据 插入→条形图 类别放纵轴，名称再长也不挤", "section": "chartlib", "ref": ""}, {"id": "chart-2", "type": "chart", "column": "C07", "title": "饼图", "text": "饼图 占比（类别≤6） 选中两列（类别+数值） 插入→饼图 右键→添加数据标签→百分比", "section": "chartlib", "ref": ""}, {"id": "chart-3", "type": "chart", "column": "C07", "title": "折线图", "text": "折线图 随时间趋势 日期放横轴 插入→折线图→带数据标记 右键→添加趋势线", "section": "chartlib", "ref": ""}, {"id": "chart-4", "type": "chart", "column": "C07", "title": "散点图", "text": "散点图 两变量关系 X/Y 两列数值 插入→散点图 添加趋势线看相关性", "section": "chartlib", "ref": ""}, {"id": "chart-5", "type": "chart", "column": "C07", "title": "雷达图", "text": "雷达图 多维度评价 维度放第一列 插入→雷达图 适合 5-8 个维度", "section": "chartlib", "ref": ""}, {"id": "chart-6", "type": "chart", "column": "C07", "title": "甘特图", "text" function readFile(file){
  return new Promise((res, rej)=>{
    const r = new FileReader();
    r.onload = e=>{
      try{
        if(/\.csv$/i.test(file.name)){
          const txt = e.target.result;
          const rows = txt.split(/\r?\n/).filter(x=>x.trim()).map(x=>x.split(",").map(c=>c.trim().replace(/^"|"$/g,"")));
          res(rows);
        } else {
          const wb = XLSX.read(e.target.result, {type:"array"});
          res(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1}));
        }
      }catch(err){ rej(err); }
    };
    if(/\.csv$/i.test(file.name)) r.readAsText(file, "UTF-8"); else r.readAsArrayBuffer(file);
  });
}

  const f = document.getElementById("f_json").files[0]; if(!f) return;

async function toSQL(){
  const f = document.getElementById("f_sql").files[0]; if(!f) return;
  const t = document.getElementById("sql_table").value || "my_table";
  const out = document.getElementById("o_sql"); out.classList.remove("hidden"); out.textContent = "生成中...";
  try{
    const rows = await readFile(f);
    const hdr = rows[0].map(h=>"`"+h.replace(/[^\w\u4e00-\u9fa5]/g,"_")+"`");
    let sql = `CREATE TABLE \`${t}\` (\n  ${hdr.map(h=>h+" VARCHAR(255)").join(",\n  ")}\n);\n\n`;
    rows.slice(1, 501).forEach(r=>{
      sql += `INSERT INTO \`${t}\` VALUES (${r.map(v=>"'"+String(v??"").replace(/'/g,"\\'")+"'").join(", ")});\n`;
    });
    out.innerHTML = `<pre><code>${esc(sql)}</code><button class="copybtn" onclick="copyCode(this)">复制</button></pre><p style="font-size:12px;color:var(--muted)">共 ${rows.length-1} 条${rows.length>501?"（仅生成前500条）":""}</p>`;

async function doDiff(){
  const f1 = document.getElementById("f_d1").files[0], f2 = document.getElementById("f_d2").files[0];
  const out = document.getElementById("o_diff"); out.classList.remove("hidden");
  if(!f1||!f2){ out.textContent = "请先选择两个文件"; return; }
  out.textContent = "比对中...";
  try{
    const a = await readFile(f1), b = await readFile(f2);
    const sa = new Set(a.map(r=>r.join("\u0001"))), sb = new Set(b.map(r=>r.join("\u0001")));
    const onlyA = a.filter(r=>!sb.has(r.join("\u0001"))), onlyB = b.filter(r=>!sa.has(r.join("\u0001")));
    let h = `<p><b>比对结果：</b> A 独有 ${onlyA.length} 行，B 独有 ${onlyB.length} 行</p>`;
    if(onlyA.length){ h += `<h4>仅 A 有</h4><table>`; onlyA.slice(0,20).forEach(r=>{ h += `<tr class="diff-del">${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`; }); h += `</table>`; }
    if(onlyB.length){ h += `<h4>仅 B 有</h4><table>`; onlyB.slice(0,20).forEach(r=>{ h += `<tr class="diff-add">${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`; }); h += `</table>`; }
    if(!onlyA.length&&!onlyB.length) h += `<div class="tip">两个文件内容完全一致 ✅</div>`;
    out.innerHTML = h;
  }catch(e){ out.textContent = "比对失败：" + e.message; }
}

function formulaCheck(){
  const t = document.getElementById("t_fx").value;
  const o = document.getElementById("o_fx"); o.classList.remove("hidden");
  const issues = [];
  const pairs = {"(":")", "[":"]", "{":"}"};
  const stack = [];
  for(const ch of t){ if(pairs[ch]) stack.push(ch); else if(Object.values(pairs).includes(ch)){ const last = stack.pop(); if(!last || pairs[last]!==ch){ issues.push("括号不配对：多余的 " + ch); break; } } }
  if(stack.length) issues.push("括号不配对：少了右括号 " + stack.map(c=>pairs[c]).join(""));
  const fullw = t.match(/[（）【】，；：！？＝]/g);
  if(fullw) issues.push("发现全角符号 " + [...new Set(fullw)].join(" ") + "：公式里只能用半角符号");
  if(/!\s*[A-Z]+\d+/.test(t) && /！/.test(t)) issues.push("工作表感叹号用了全角 ！");
  if(!t.trim().startsWith("=")) issues.push("公式一般以 = 开头");
  o.innerHTML = issues.length
    ? "<b>发现 " + issues.length + " 个问题：</b>" + issues.map(x=>`<div class="tip">⚠️ ${esc(x)}</div>`).join("")

function calcTax(){
  const sal = parseFloat(document.getElementById("tx1").value)||0;
  const ins = parseFloat(document.getElementById("tx2").value)||0;
  const ded = parseFloat(document.getElementById("tx3").value)||0;
  const o = document.getElementById("o_tx"); o.classList.remove("hidden");
  const base = sal - 5000 - ins - ded;
  if(base <= 0){ o.innerHTML = "应纳税所得额 ≤ 0，<b>免税</b>"; return; }
  const brackets = [[3000,0.03,0],[12000,0.10,210],[25000,0.20,1410],[35000,0.25,2660],[55000,0.30,4410],[80000,0.35,7160],[Infinity,0.45,15160]];
  const b = brackets.find(x=>base<=x[0]);
  const tax = base*b[1]-b[2];
  o.innerHTML = `应纳税所得额 ¥${base.toFixed(2)}，预估个税 <b>¥${tax.toFixed(2)}</b><br><span style="color:var(--muted);font-size:12px">按月度税率表估算，实际以汇算清缴为准</span>`;
}

function idCheck(){
  const t = document.getElementById("t_id").value.trim().toUpperCase();
  const o = document.getElementById("o_id"); o.classList.remove("hidden");
  if(!/^\d{17}[\dX]$/.test(t)){ o.textContent = "格式不对：需要 18 位，前 17 位数字、最后一位数字或 X"; return; }
  const w = [7,9,10,5,8,4,2,1,6,3,7,9,10,5,8,4,2], cc = "10X98765432";
  let s = 0; for(let i=0;i<17;i++) s += (+t[i])*w[i];
  const okc = cc[s%11] === t[17];
  const bd = t.slice(6,10)+"-"+t.slice(10,12)+"-"+t.slice(12,14);
  const sex = (+t[16]%2===1) ? "男" : "女";
  o.innerHTML = (okc ? "✅ 校验通过" : "❌ 校验码错误（号码可能有误）") +
    `<br>出生日期：${bd}　性别：${sex}<br><span style="color:var(--muted);font-size:12px">Excel提取生日：=TEXT(MID(A2,7,8),"0-00-00")；判断性别：=IF(MOD(MID(A2,17,1),2),"男","女")</span>`;
}
function colLetter(){
  const t = document.getElementById("t_col").value.trim().toUpperCase();
  const o = document.getElementById("o_col"); o.classList.remove("hidden");
  if(/^\d+$/.test(t)){
    let n = +t, s = "";
    while(n>0){ const m=(n-1)%26; s = String.fromCharCode(65+m)+s; n = Math.floor((n-1)/26); }
    o.innerHTML = `第 ${t} 列 → <b>${s}</b><br><span style="color:var(--muted);font-size:12px">Excel公式：=SUBSTITUTE(ADDRESS(1,${t},4),"1","")</span>`;
  } else if(/^[A-Z]+$/.test(t)){
    let n = 0; for(const ch of t) n = n*26 + (ch.charCodeAt(0)-64);
    o.innerHTML = `${t} 列 → 第 <b>${n}</b> 列<br><span style="color:var(--muted);font-size:12px">Excel公式：=COLUMN(${t}1)</span>`;
  } else o.textContent = "请输入列号数字或列字母，如 28 或 AB";
}
function md2excel(){
  const o = document.getElementById("o_md"); o.classList.remove("hidden");
  const lines = document.getElementById("t_md").value.split(/\r?\n/).filter(x=>x.trim().startsWith("|"));
  if(lines.length<2){ o.textContent = "请粘贴 Markdown 表格（含表头行和分隔行）"; return; }
  const rows = lines.filter((_,i)=>i!==1).map(l=>l.replace(/^\||\|$/g,"").split("|").map(c=>c.trim()));
  try{
    const ws = XLSX.utils.aoa_to_sheet(rows);
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Sheet1");
    const out = XLSX.write(wb, {bookType:"xlsx", type:"array"});
    downloadFile("md-table.xlsx", new Blob([out], {type:"application/octet-stream"}));
    o.textContent = "已下载 md-table.xlsx（" + rows.length + " 行）";
  }catch(e){ o.textContent = "转换失败：" + e.message; }
}

  else if(!t.chart_items){ h += `<div class="card"><h4>⚠️ 常见错误与解决方案</h4><div class="note-pending">本篇常见错误表待后续阶段回填；通用报错先查<a href="javascript:go('errors')" style="color:var(--green)">错误代码大全</a>与<a href="javascript:go('solve')" style="color:var(--green)">问题解决中心</a>。</div></div>`; }
  const _hay = ((t.title||"")+" "+(t.body||"")+" "+(t.sections||[]).map(s=>s.title+" "+s.body).join(" ")).toUpperCase();
  const _used = (DATA.functions_v2||[]).filter(v=>new RegExp("\\b"+v.id+"\\b").test(_hay)).slice(0,8);
  if(_used.length){ h += `<div class="card"><h4>∑ 本篇用到的函数</h4><p style="font-size:14px">${_used.map(v=>`<a href="javascript:showFunc('${v.id}')" style="color:var(--green);margin-right:12px">${v.id}（${esc(v.name_cn)}）</a>`).join("")}</p></div>`; }
  h += `<div class="card"><h4>🔗 相关教程</h4><p style="font-size:14px">` +
    (prev?`<a href="javascript:showTutorial('${prev.id}')" style="color:var(--green)">← 上一篇：${esc(prev.title)}</a><br>`:"") +
    (next?`<a href="javascript:showTutorial('${next.id}')" style="color:var(--green)">下一篇：${esc(next.title)} →</a><br>`:"") +
    `<a href="javascript:go('col-${t.column}')" style="color:var(--green)">回 ${col?esc(col.name):t.column} 栏目页 →</a></p></div>`;
  if(t.exercises && t.exercises.length){ h += `<div class="card"><h4>📝 练习题</h4><ol style="font-size:14px">` + t.exercises.map(q=>`<li>${esc(q)}</li>`).join("") + `</ol></div>`; }
  else { h += `<div class="card"><h4>📝 练习题</h4><div class="note-pending">本题练习题待练习题库建设（阶段 8）。</div></div>`; }
  if(t.answers && t.answers.length){ h += `<div class="card"><h4>✅ 参考答案</h4><details><summary>点击查看答案</summary><ol style="font-size:14px">` + t.answers.map(a=>`<li>${esc(a)}</li>`).join("") + `</ol></details></div>`; }
  else { h += `<div class="card"><h4>✅ 参考答案</h4><details><summary>点击查看答案</summary><div class="note-pending">参考答案与练习题成对建设（阶段 8）。</div></details></div>`; }
  if(t.file){
    const exists = (DATA.templates||[]).some(x=>x.file===t.file);
    if(exists) h += `<div class="card"><h4>📥 可下载示例文件</h4><p><a class="dlbtn" href="templates/${encodeURIComponent(t.file)}" download>下载 ${esc(t.file)}</a></p></div>`;
  }
  M.innerHTML = h;
  window.scrollTo({top:0,behavior:"smooth"});
}
/* ---------- 搜索（§6.5：search_index.json，9 类来源） ---------- */
const SEARCH_TYPE_CN = {function:"函数", tutorial:"教程", tip:"技巧", solve:"问题", faq:"问答", chart:"图表", case:"案例", template:"模板", vba:"VBA"};
function searchMatch(q, hay){
  const isAscii = /^[a-z0-9]+$/.test(q);
  if(!isAscii) return hay.indexOf(q)!==-1;
  const tokens = hay.split(/[^a-z0-9一-龥]+/);
  return tokens.some(tk=>tk===q || tk.indexOf(q)===0);
}
function doSearch(q){
  const raw = q;
  q = (q||"").trim().toLowerCase();
  const M = document.getElementById("main");
  if(!q){ render(cur); return; }
  let h = `<div class="card"><h3>🔍 搜索「${esc(raw.trim())}」</h3><p style="color:var(--muted);font-size:13px">覆盖函数 / 教程 / 技巧 / 问题 / 问答 / 图表 / 案例 / 模板 / VBA 共 9 类来源</p></div>`;
  const idx = DATA.search_index||[];
  const hits = idx.filter(it=>searchMatch(q, (it.title+" "+it.text).toLowerCase()));
  if(!hits.length){
    h += `<div class="card"><p>没有找到，换个关键词试试。</p><p style="margin-top:8px;font-size:14px">热门词：<a href="javascript:doSearch('VLOOKUP')" style="color:var(--green);margin-right:10px">VLOOKUP</a><a href="javascript:doSearch('透视表')" style="color:var(--green);margin-right:10px">透视表</a><a href="javascript:doSearch('求和')" style="color:var(--green)">求和</a></p></div>`;
    M.innerHTML = h; return;
  }
  const groups = {};
  hits.slice(0,40).forEach(it=>{ (groups[it.type]=groups[it.type]||[]).push(it); });
  Object.keys(groups).forEach(tp=>{
    const list = groups[tp].slice(0,8);
    h += `<div class="search-group">${SEARCH_TYPE_CN[tp]||tp}（${groups[tp].length}）</div>`;
    list.forEach(it=>{
      let act = "go('"+it.section+"')";
      if(it.type==="function") act = "showFunc('"+it.ref.replace(/'/g,"")+"')";
      else if(it.type==="tutorial") act = "showTutorial('"+it.ref.replace(/'/g,"")+"')";
      h += `<div class="search-item" onclick="${act}"><b>${esc(it.title)}</b><div class="st">${SEARCH_TYPE_CN[it.type]||it.type}${it.column?" · "+it.column:""} · ${esc((it.text||"").slice(0,60))}</div></div>`;
    });
  });
  h += `<p style="font-size:12px;color:var(--muted)">共 ${hits.length} 条${hits.length>40?"（仅显示前 40 条）":""}</p>`;
  M.innerHTML = h;
}
function compareFuncs(){
  const a = document.getElementById("cmp1").value, b = document.getElementById("cmp2").value, c = document.getElementById("cmp3").value;
  const o = document.getElementById("o_cmp"); o.classList.remove("hidden");
  const sel = [a,b,c].filter(x=>x);
  if(sel.length<2){ o.innerHTML = "请至少选 2 个函数"; return; }
  if(new Set(sel).size!==sel.length){ o.innerHTML = "请不要重复选择同一个函数"; return; }
  const vs = sel.map(n=>(DATA.functions_v2||[]).find(x=>x.id===n)).filter(Boolean);
  if(vs.length<2){ o.innerHTML = "未找到函数数据"; return; }
  const rows = [
    ["中文名称", v=>esc(v.name_cn)],
    ["分类", v=>esc(v.category_cn)],
    ["语法", v=>"<code>"+esc(v.syntax)+"</code>"],
    ["参数", v=>v.params.length + " 个：" + v.params.map(p=>esc(p.name)+(p.optional?"（可选）":"（必需）")).join("、")],
    ["返回结果", v=>esc(v.returns)],
    ["适用场景", v=>esc(v.desc_cn)],
    ["引入版本", v=>esc(v.versions.introduced)+"；兼容 "+v.versions.compatible.map(x=>"Excel "+x).join("、")],
    ["相关函数", v=>v.related.map(r=>`<a href="javascript:showFunc('${r}')" style="color:var(--green)">${r}</a>`).join("、")],
  ];
  let t = `<table><tr><th>对比项</th>${vs.map(v=>`<th>${v.id}</th>`).join("")}</tr>`;
  rows.forEach(r=>{ t += `<tr><td><b>${r[0]}</b></td>${vs.map(v=>`<td style="font-size:13px">${r[1](v)}</td>`).join("")}</tr>`; });
  t += `</table><p style="font-size:12px;color:var(--muted)">对比数据取自函数 v2 schema（data.json functions_v2），未手写对比文案。</p>`;
  o.innerHTML = t;
}
function calcDate(){
  const a = new Date(document.getElementById("dc1").value), b = new Date(document.getElementById("dc2").value);
  const o = document.getElementById("o_dc"); o.classList.remove("hidden");
  if(isNaN(a)||isNaN(b)){ o.textContent = "请选择两个日期"; return; }
  const d = Math.round((b-a)/86400000);
  o.innerHTML = `相差 <b>${d}</b> 天（${(d/365).toFixed(1)} 年 / ${(d/30.44).toFixed(1)} 个月）<br><span style="color:var(--muted);font-size:12px">Excel公式：=DATEDIF(开始,结束,"D") / =B2-A2</span>`;
}
function calcWork(){
  const a = new Date(document.getElementById("wc1").value), b = new Date(document.getElementById("wc2").value);
  const o = document.getElementById("o_wc"); o.classList.remove("hidden");
  if(isNaN(a)||isNaN(b)){ o.textContent = "请选择两个日期"; return; }
  let n = 0; const d = new Date(a);
  while(d <= b){ const w = d.getDay(); if(w!==0&&w!==6) n++; d.setDate(d.getDate()+1); }
  o.innerHTML = `工作日 <b>${n}</b> 天（不含周末）<br><span style="color:var(--muted);font-size:12px">Excel公式：=NETWORKDAYS(开始,结束)</span>`;
}
function calcPct(){
  const a = parseFloat(document.getElementById("pc1").value), b = parseFloat(document.getElementById("pc2").value);
  const o = document.getElementById("o_pc"); o.classList.remove("hidden");
  if(!b){ o.textContent = "请输入有效数字"; return; }
  o.innerHTML = `<b>${(a/b*100).toFixed(2)}%</b><br><span style="color:var(--muted);font-size:12px">Excel公式：=A2/B2，设为百分比格式</span>`;
}
function calcLoan(){
  const P = parseFloat(document.getElementById("lc1").value)||1000000, yr = parseFloat(document.getElementById("lc2").value)||3.8, ys = parseFloat(document.getElementById("lc3").value)||30;
  const r = yr/100/12, n = ys*12, m = P*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1);
  const o = document.getElementById("o_lc"); o.classList.remove("hidden");
  o.innerHTML = `月供 <b>¥${m.toFixed(2)}</b>，总利息 ¥${(m*n-P).toFixed(2)}<br><span style="color:var(--muted);font-size:12px">Excel公式：=PMT(年利率/12, 年限*12, 贷款额)</span>`;
}
function calcAge(){
  const a = new Date(document.getElementById("ac1").value), now = new Date();
  const o = document.getElementById("o_ac"); o.classList.remove("hidden");
  if(isNaN(a)){ o.textContent = "请选择出生日期"; return; }
  let y = now.getFullYear()-a.getFullYear(), m = now.getMonth()-a.getMonth(), d = now.getDate()-a.getDate();
  if(d<0){ m--; } if(m<0){ y--; m+=12; }
  o.innerHTML = `<b>${y}</b> 岁 ${m} 个月<br><span style="color:var(--muted);font-size:12px">Excel公式：=DATEDIF(出生日期,TODAY(),"Y")</span>`;
}
function copyCode(btn){
  const code = btn.parentNode.querySelector("code").innerText;
  navigator.clipboard.writeText(code).then(()=>{ btn.textContent="已复制"; setTimeout(()=>btn.textContent="复制",1500); });
}
