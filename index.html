两条线交叉”的效果而调刻度；右轴最大值不要与左轴凑巧对齐成误导性交叉；双轴图必须在图上标明哪条线走哪个轴。", "faq": [{"q": "双轴图会不会误导读者？", "a": "会。左右轴刻度一改，两条线的相对位置就变了；只在量级确实差太大时用双轴，且必须标清轴标题。"}, {"q": "什么时候不该用双轴？", "a": "两个系列量级接近时不要用双轴，直接放同一坐标轴更诚实。"}, {"q": "次坐标轴选项是灰的怎么办？", "a": "先确认图表是组合图；单一图表类型没有次坐标轴，要先把其中一个系列改成另一种图表类型。"}], "versions": "双轴做法全部版本均可手工实现，组合图对话框需 Excel 2013 及以上版本，兼容 Excel 2013 / 2016 / 2019 / 2021 / 365。", "workbook": "图表-示例-组合图.xlsx"}, {"name": "帕累托图", "name_en": "Pareto Chart", "preview": "docs/charts/images/pareto.png", "use": "找出造成大多数问题的原因，例如五种不合格原因中，划伤与色差两项就占了 73% 的不合格件数，先解决这两项，效果最大。", "data_header": ["不合格原因", "件数", "累计占比"], "data_rows": [["划伤", "45", "45"], ["色差", "28", "73"], ["尺寸偏差", "15", "88"], ["包装破损", "8", "96"], ["其他", "4", "100"]], "steps": ["选中数据区域 A1:B6（原因与件数两列，不用选累计占比列，Excel 会自动算）。", "点插入选项卡，在图表组里点直方图下拉，选帕累托图。", "柱子自动按件数从大到小排列，折线是累计占比。", "右键折线，点添加数据标签，标签显示百分比。", "标题改成结论句，例如“划伤与色差占不合格总数的 73%，优先解决这两项”。"], "fmt": "柱子按数量降序排列是帕累托图的硬性要求，不要手动打乱顺序；累计占比折线用橙色，与蓝色柱子区分；累计占比到 80% 的位置可以加一条参考线，标出“关键的少数”。", "faq": [{"q": "帕累托图是 Excel 哪个版本新增的？", "a": "Excel 2016 新增，微软 2015 年 7 月 2 日的官方博客把帕累托图列为 Office 2016 预览版新增的六种图表之一；2013 及更早版本没有内置帕累托图，需手工做柱线组合图模拟。"}, {"q": "累计占比列要自己算吗？", "a": "不用。只给原因与件数两列，Excel 会自动算累计占比；自己算好填进去也可以，但不要两处数字打架。"}, {"q": "原因太多怎么办？", "a": "只留前 5 到 7 项，其余合并为其他；原因超过 10 项时帕累托图失去重点。"}], "versions": "Excel 2016 新增，兼容 Excel 2016 / 2019 / 2021 / 365；Excel 2013 及更早版本无内置帕累托图，可用柱线组合图手工模拟。", "workbook": "图表-示例-组合图.xlsx"}], "file": "图表-示例-组合图.xlsx"}, {"id": "charts-06-new-charts", "group": "charts", "column": "C07", "level2": "C07-L2-6", "title": "新图表类型", "level": "进阶", "body": "**新图表的分界线是 2016 与 2019**：微软官方博客（2015 年 7 月 2 日）宣布 Office 2016 预览版新增六种图表：瀑布图、直方图、帕累托图、箱形图、树状图、旭日图。2016 与 2019 之间又新增两种：漏斗图与填充地图图表。打开旧版本文件时，这些图表会显示为静态图片或报错，分享前要确认对方的版本。\n\n**新图表不是万能的**：瀑布图只适合有正负增减的累计过程，直方图只适合看分布，箱形图只适合对比多组分布，旭日图与树状图只适合两到三层结构。选错图表比不做图更糟。", "steps": [], "sections": [{"title": "基础概念", "body": "**新图表的分界线是 2016 与 2019**：微软官方博客（2015 年 7 月 2 日）宣布 Office 2016 预览版新增六种图表：瀑布图、直方图、帕累托图、箱形图、树状图、旭日图。2016 与 2019 之间又新增两种：漏斗图与填充地图图表。打开旧版本文件时，这些图表会显示为静态图片或报错，分享前要确认对方的版本。\n\n**新图表不是万能的**：瀑布图只适合有正负增减的累计过程，直方图只适合看分布，箱形图只适合对比多组分布，旭日图与树状图只适合两到三层结构。选错图表比不做图更糟。"}], "source": "docs/charts/06-new-charts.md", "updated": "2026-11-10", "objectives": ["说出 Excel 2016 新增的六种图表与 2019 新增的两种图表分别是哪些", "用瀑布图展示现金从期初到期末的变化过程", "用漏斗图、直方图、箱形图分别展示转化、分布与五数概括", "用旭日图与树状图展示两层结构数据，用雷达图对比多维评分", "用堆积条形图的做法做出甘特图，用地理数据类型做出地图图表"], "formulas": [], "scenarios": [], "pitfalls": [], "exercises": ["用示例工作簿里的现金表做一张瀑布图，核对期末现金 510 万元的算式，并把期初与期末两个柱子设为汇总。", "用 35 人成绩分段表做一张直方图，再用三个部门五数概括表做一张箱形图。两张图分别回答了什么问题？", "用销售额分层表分别做一张旭日图与一张树状图，对比两张图：哪张更容易看出“手机是最大单项”？哪张更容易看出层级关系？地图图表的预览图为什么注明是示意简图？"], "answers": ["算式为 500 + 320 - 180 - 90 - 40 = 510，与表中期末现金一致。设为汇总后，期初柱从 0 画到 500，期末柱从 0 画到 510，不再浮在半空。", "直方图回答“成绩分布形态如何”，结论示例：峰值在 70 到 79 分段，共 12 人。箱形图回答“三个部门的分布有什么差别”，结论示例：技术部中位数 80 分最高，市场部最低分 48 分最低、分布最散。", "树状图更容易看出“手机是最大单项”，因为矩形面积直接可比，手机矩形最大。旭日图更容易看出层级关系，因为内环是大类、外环是小类。地图图表预览图注明示意简图，是因为 matplotlib 没有现成地图库，画不出真实地图；真实地图图表需在 Excel 中用地理数据类型生成。"], "versions": "Excel 2016 / 2019 / 2021 / 365（本篇图表多为 2016 或 2019 新增，雷达图与甘特图除外，各节版本兼容性逐项注明）", "chart_items": [{"name": "瀑布图", "name_en": "Waterfall Chart", "preview": "docs/charts/images/waterfall.png", "use": "展示一个数值从期初到期末是怎样一步步变化的，例如现金从期初 500 万元，经过销售收入、采购成本、运营费用、税费，到期末 510 万元。", "data_header": ["项目", "金额"], "data_rows": [["期初现金", "500"], ["销售收入", "320"], ["采购成本", "-180"], ["运营费用", "-90"], ["税费", "-40"], ["期末现金", "510"]], "steps": ["选中数据区域 A1:B7（含表头）。", "点插入选项卡，在图表组里点瀑布图。", "右键期初现金与期末现金两个柱子，点设置为汇总，让它们从 0 开始画。", "正数柱用绿色，负数柱用橙色，汇总柱用蓝色。", "标题改成结论句，例如“现金净增 10 万元，销售收入是最大正向贡献”。"], "fmt": "增加项与减少项必须用不同颜色；汇总柱（期初与期末）单独设色；连接线可以打开，方便读者顺着柱子看累计过程。", "faq": [{"q": "期初与期末柱子浮在半空怎么办？", "a": "没有设为汇总；右键这两个柱子，点设置为汇总，它们就会从 0 开始画。"}, {"q": "瀑布图是哪个版本新增的？", "a": "Excel 2016 新增，微软 2015 年 7 月 2 日的官方博客列为六种新图表之一。"}, {"q": "只有正数能做瀑布图吗？", "a": "不是。瀑布图正是为正负增减混合的数据设计的，全是正数时用堆积柱形图更合适。"}], "versions": "Excel 2016 新增，兼容 Excel 2016 / 2019 / 2021 / 365；Excel 2013 及更早版本无内置瀑布图。", "workbook": "图表-示例-新图表类型.xlsx"}, {"name": "漏斗图", "name_en": "Funnel Chart", "preview": "docs/charts/images/funnel.png", "use": "展示逐级减少的转化流程，例如访问 10000 人，到注册 4200 人、试用 1800 人、付费 640 人、续费 380 人，每一步的流失一目了然。", "data_header": ["阶段", "人数"], "data_rows": [["访问", "10000"], ["注册", "4200"], ["试用", "1800"], ["付费", "640"], ["续费", "380"]], "steps": ["选中数据区域 A1:B6（含表头）。", "点插入选项卡，在图表组里点漏斗图。", "阶段按人数从大到小排列，顺序不要打乱。", "右键图表，点添加数据标签，显示每阶段人数。", "标题改成结论句，例如“访问到付费的整体转化率只有 6.4%，注册到试用流失最大”。"], "fmt": "漏斗图只有一组数据，不要塞两组；每段用同一色系由深到浅；转化率可以写在标签旁边，方便读者直接读数。", "faq": [{"q": "漏斗图是哪个版本新增的？", "a": "Excel 2019 新增；2016 及更早版本没有内置漏斗图，老版本用居中条形图模拟。"}, {"q": "数据不是递减的能做漏斗图吗？", "a": "不能。漏斗图要求数据逐级减少；某一步比上一步大时，先检查数据是不是录错了。"}, {"q": "漏斗图与条形图有什么区别？", "a": "漏斗图居中对称、没有坐标轴，专为转化流程设计；条形图适合一般比较。"}], "versions": "Excel 2019 新增，兼容 Excel 2019 / 2021 / 365；Excel 2016 及更早版本无内置漏斗图，可用居中条形图模拟。", "workbook": "图表-示例-新图表类型.xlsx"}, {"name": "直方图", "name_en": "Histogram", "preview": "docs/charts/images/histogram.png", "use": "展示一批数值的分布形态，例如 35 人考试成绩的分段人数：60 分以下 3 人、60 到 69 分 7 人、70 到 79 分 12 人、80 到 89 分 9 人、90 分以上 4 人，峰值在 70 到 79 分段。", "data_header": ["分数段", "人数"], "data_rows": [["60分以下", "3"], ["60-69分", "7"], ["70-79分", "12"], ["80-89分", "9"], ["90分以上", "4"]], "steps": ["准备一列原始成绩（35 个分数），选中这一列。", "点插入选项卡，在图表组里点直方图下拉，选直方图。", "右键横轴，点设置坐标轴格式，调整箱数与箱宽，例如箱宽 10 分。", "柱子之间不要留空隙，直方图的柱子是挨着的。", "标题改成结论句，例如“成绩集中在 70 到 89 分段，共 21 人”。"], "fmt": "箱宽决定图的精细程度，箱太宽看不出分布，箱太窄全是碎柱；横轴标签是分数段，不是单个分数；不要把直方图与柱形图混用，直方图的横轴是连续数值区间。", "faq": [{"q": "直方图和柱形图有什么区别？", "a": "直方图的横轴是连续数值区间、柱子挨着；柱形图的横轴是离散类别、柱子分开。"}, {"q": "直方图是哪个版本新增的？", "a": "Excel 2016 新增，微软 2015 年 7 月 2 日的官方博客列为六种新图表之一。"}, {"q": "箱数怎么定？", "a": "数据量 35 个时箱数 5 个左右合适；数据量大时可适当增加，一般不超过 10 个。"}], "versions": "Excel 2016 新增，兼容 Excel 2016 / 2019 / 2021 / 365；Excel 2013 及更早版本可用数据分析工具库的直方图功能代替。", "workbook": "图表-示例-新图表类型.xlsx"}, {"name": "箱形图", "name_en": "Box and Whisker Chart", "preview": "docs/charts/images/boxplot.png", "use": "对比多组数据的分布，包括中位数、四分位数与极值，例如三个部门的考试成绩分布：销售部中位数 78 分，技术部中位数 80 分，市场部中位数 74 分。", "data_header": ["部门", "最小值", "第一四分位数", "中位数", "第三四分位数", "最大值"], "data_rows": [["销售部", "55", "68", "78", "86", "95"], ["市场部", "48", "62", "74", "83", "92"], ["技术部", "60", "72", "80", "88", "98"]], "steps": ["准备三列原始成绩（每列一个部门），选中三列。", "点插入选项卡，在图表组里点箱形图。", "图中箱子上下边是第一与第三四分位数，箱内横线是中位数，两端须线伸到最小值与最大值。", "超出须线的点是异常值，单独显示，不要删掉。", "标题改成结论句，例如“技术部中位数最高，市场部最低分最低、分布最散”。"], "fmt": "箱形图不要加数据标签，数字写在图下方的表格里；多组对比时箱子按中位数排序；异常值要单独核查，可能是录入错误。", "faq": [{"q": "箱形图里的线分别代表什么？", "a": "箱内横线是中位数，箱子上下边是第一与第三四分位数，须线两端是最小值与最大值。"}, {"q": "箱形图是哪个版本新增的？", "a": "Excel 2016 新增，微软 2015 年 7 月 2 日的官方博客列为六种新图表之一。"}, {"q": "只有一组数据能做箱形图吗？", "a": "能，但箱形图的价值在多组对比；只有一组时用直方图更直观。"}], "versions": "Excel 2016 新增，兼容 Excel 2016 / 2019 / 2021 / 365；Excel 2013 及更早版本无内置箱形图。", "workbook": "图表-示例-新图表类型.xlsx"}, {"name": "旭日图", "name_en": "Sunburst Chart", "preview": "docs/charts/images/sunburst.png", "use": "展示两到三层结构数据的占比，例如销售额按大类与小类分层：电子产品 580 万元（手机 320、电脑 260），家居 330 万元（家具 180、家电 150），服装 200 万元（男装 90、女装 110）。", "data_header": ["大类", "小类", "销售额"], "data_rows": [["电子产品", "手机", "320"], ["电子产品", "电脑", "260"], ["家居", "家具", "180"], ["家居", "家电", "150"], ["服装", "男装", "90"], ["服装", "女装", "110"]], "steps": ["按大类、小类、数值的顺序准备三列数据，层级从左到右排。", "选中数据区域 A1:C7（含表头）。", "点插入选项卡，在图表组里点旭日图。", "内环是大类，外环是小类，同一大类的两个小类用同色系。", "标题改成结论句，例如“电子产品占一半以上，手机是最大单项”。"], "fmt": "层级不要超过 3 层，层数越多外环越碎；小类太多时合并为其他；标签只标大类与主要小类，全部标上会糊成一片。", "faq": [{"q": "旭日图是哪个版本新增的？", "a": "Excel 2016 新增，微软 2015 年 7 月 2 日的官方博客列为六种新图表之一。"}, {"q": "旭日图和树状图怎么选？", "a": "想看层级关系用旭日图，想比较各块大小用树状图；数据相同，视角不同。"}, {"q": "数据层级顺序错了怎么办？", "a": "旭日图按列的左右顺序定层级；大类放第一列，小类放第二列，不要放反。"}], "versions": "Excel 2016 新增，兼容 Excel 2016 / 2019 / 2021 / 365；Excel 2013 及更早版本无内置旭日图。", "workbook": "图表-示例-新图表类型.xlsx"}, {"name": "树状图", "name_en": "Treemap", "preview": "docs/charts/images/treemap.png", "use": "用矩形面积比较层级数据的大小，例如同一组销售额数据：手机 320 万元的矩形最大，男装 90 万元的矩形最小，面积一眼可比。", "data_header": ["大类", "小类", "销售额"], "data_rows": [["电子产品", "手机", "320"], ["电子产品", "电脑", "260"], ["家居", "家具", "180"], ["家居", "家电", "150"], ["服装", "男装", "90"], ["服装", "女装", "110"]], "steps": ["按大类、小类、数值的顺序准备三列数据。", "选中数据区域 A1:C7（含表头）。", "点插入选项卡，在图表组里点树状图。", "每个矩形里标小类名与数值，字体大小随矩形面积自动调整。", "标题改成结论句，例如“手机一块就占全部销售额的 28.8%”。"], "fmt": "矩形面积与数值成正比；相邻矩形用对比明显的颜色；矩形太小时标签会被省略，这种小项适合合并为其他。", "faq": [{"q": "树状图是哪个版本新增的？", "a": "Excel 2016 新增，微软 2015 年 7 月 2 日的官方博客列为六种新图表之一。"}, {"q": "树状图里看不出层级怎么办？", "a": "树状图的层级靠颜色分组表达，不如旭日图直观；层级是重点时用旭日图。"}, {"q": "负数能进树状图吗？", "a": "不能。矩形面积不能为负；有负数时改用条形图。"}], "versions": "Excel 2016 新增，兼容 Excel 2016 / 2019 / 2021 / 365；Excel 2013 及更早版本无内置树状图。", "workbook": "图表-示例-新图表类型.xlsx"}, {"name": "雷达图", "name_en": "Radar Chart", "preview": "docs/charts/images/radar.png", "use": "多维度综合评价，例如两位员工六维能力评分：员工 A 技术 90 分、学习 92 分最高，创新 70 分最低；员工 B 各维比较均衡。", "data_header": ["能力维度", "员工A", "员工B"], "data_rows": [["沟通", "85", "75"], ["技术", "90", "80"], ["协作", "78", "85"], ["创新", "70", "82"], ["执行", "88", "76"], ["学习", "92", "84"]], "steps": ["选中数据区域 A1:C7（含表头，维度放第一列）。", "点插入选项卡，在图表组里点雷达图，选带数据标记的雷达图。", "两个员工用不同颜色，填充透明度调到 25% 左右，两个多边形重叠处仍能看清。", "维度数量控制在 5 到 8 个，太少不成网，太多读不出来。", "标题改成结论句，例如“A 技术强、B 更均衡，A 的短板是创新”。"], "fmt": "坐标轴刻度各维统一，最大值一致，否则多边形形状会失真；填充色浅一点，边线加粗；不要用三维雷达图，透视会扭曲各维的相对大小。", "faq": [{"q": "雷达图适合多少个维度？", "a": "5 到 8 个最合适；超过 10 个维度时图形太碎，改用表格。"}, {"q": "雷达图是新图表吗？", "a": "不是。雷达图是老图表类型，全部版本均支持，不属于 2016 新增的六种。"}, {"q": "两个员工的图形完全重叠怎么办？", "a": "把其中一个的填充透明度调低，或改用簇状柱形图对比。"}], "versions": "全部版本均支持，兼容 Excel 2007 / 2010 / 2013 / 2016 / 2019 / 2021 / 365。", "workbook": "图表-示例-新图表类型.xlsx"}, {"name": "甘特图", "name_en": "Gantt Chart", "preview": "docs/charts/images/gantt.png", "use": "项目进度排期，例如一个项目五个阶段：需求调研 5 天、方案设计 8 天、开发实现 15 天、测试验收 6 天、上线发布 2 天，谁先谁后、谁长谁短一目了然。", "data_header": ["任务", "开始日期", "工期"], "data_rows": [["需求调研", "2026-11-02", "5"], ["方案设计", "2026-11-09", "8"], ["开发实现", "2026-11-19", "15"], ["测试验收", "2026-12-04", "6"], ["上线发布", "2026-12-10", "2"]], "steps": ["准备任务、开始日期、工期三列数据。", "选中数据区域，插入堆积条形图，得到两个系列：开始与工期。", "选中开始系列，设为无填充、无边框，只剩工期系列可见。", "右键纵轴，勾选逆序类别，让第一个任务排在最上面。", "横轴设为日期刻度，标题改成结论句，例如“开发实现最长 15 天，是关键路径”。"], "fmt": "开始系列必须设为无填充，否则甘特图会变成实心长条；今天的日期可以加一条竖线作进度参考线；任务超过 20 个时拆成两个阶段分别画。", "faq": [{"q": "Excel 有内置甘特图吗？", "a": "没有独立的甘特图类型；甘特图是用堆积条形图的做法模拟出来的，data.json 的 chart_lib 也是这个做法。"}, {"q": "开始系列藏不掉怎么办？", "a": "选中开始系列，在设置数据系列格式里把填充选无填充、边框选无线条。"}, {"q": "任务顺序反了怎么办？", "a": "右键纵轴勾选逆序类别；堆积条形图的默认顺序是反的，必须手动调。"}], "versions": "堆积条形图全部版本均支持，甘特图做法兼容 Excel 2007 / 2010 / 2013 / 2016 / 2019 / 2021 / 365。", "workbook": "图表-示例-新图表类型.xlsx"}, {"name": "地图图表", "name_en": "Map Chart", "preview": "docs/charts/images/map.png", "use": "展示地域分布，例如六个省份的销售额：广东 320 万元最高，湖北 120 万元最低，颜色越深表示销售额越高。", "data_header": ["省份", "销售额"], "data_rows": [["广东", "320"], ["江苏", "260"], ["浙江", "210"], ["山东", "180"], ["四川", "150"], ["湖北", "120"]], "steps": ["准备省份与销售额两列数据，省份名称必须规范填写（例如写广东，不要写粤）。", "选中数据区域，点数据选项卡，点地理数据类型，把省份列转换为地理数据类型。", "选中数据区域，点插入选项卡，在图表组里点地图，选填充地图。", "在设置数据系列格式里选颜色范围，数值越大颜色越深。", "标题改成结论句，例如“广东销售额最高，是湖北的 2.7 倍”。"], "fmt": "地图区域可以选只显示有数据的区域；标签只标主要省份，全部标上会挤在一起；色阶用单色由浅到深，不要用红绿对比色。", "faq": [{"q": "预览为示意简图，真实地图图表需在 Excel 中用地理数据类型生成。", "a": "本篇预览图是省份数值示意简图，不是 Excel 生成的真实地图；真实地图图表按上面创建步骤在 Excel 里生成。"}, {"q": "有资料说地图图表是 2016 新增，哪个对？", "a": "2019 新增才对。2016 新增的六种是瀑布图、直方图、帕累托图、箱形图、树状图、旭日图；地图图表与漏斗图是 2016 与 2019 之间新增的两种。本篇按 2019 写，data.json 的 chart_lib 也是“2019+”。"}, {"q": "地名识别不出来怎么办？", "a": "先检查地名是否规范（省、国家、邮编），再确认联网状态；地图图表需要联网调用 Bing 地图服务，离线只能查看、不能新建。"}], "versions": "Excel 2019 新增（填充地图图表），兼容 Excel 2019 / 2021 / 365；Excel 2016 及更早版本无内置地图图表。", "workbook": "图表-示例-新图表类型.xlsx"}], "file": "图表-示例-新图表类型.xlsx"}, {"id": "charts-07-formatting", "group": "charts", "column": "C07", "level2": "C07-L2-7", "title": "图表格式化", "level": "进阶", "body": "**图表元素是零件**：标题、坐标轴、网格线、图例、数据标签、数据表、趋势线、误差线，一共九大元素。每个元素都可以开关。默认全开的图表最臃肿，好图表是做减法做出来的。\n\n**配色是信息不是装饰**：颜色要用来区分系列或突出重点，不是用来好看。同一系列在全站所有图表里用同一个颜色，读者看一眼颜色就知道是哪个系列。\n\n**动态图表是公式驱动的图**：动态图表的数据源不是固定区域，而是指向公式取数的区域。下拉菜单一变，公式取数跟着变，图表跟着变。图表本身不用重做。", "steps": [], "sections": [{"title": "基础概念", "body": "**图表元素是零件**：标题、坐标轴、网格线、图例、数据标签、数据表、趋势线、误差线，一共九大元素。每个元素都可以开关。默认全开的图表最臃肿，好图表是做减法做出来的。\n\n**配色是信息不是装饰**：颜色要用来区分系列或突出重点，不是用来好看。同一系列在全站所有图表里用同一个颜色，读者看一眼颜色就知道是哪个系列。\n\n**动态图表是公式驱动的图**：动态图表的数据源不是固定区域，而是指向公式取数的区域。下拉菜单一变，公式取数跟着变，图表跟着变。图表本身不用重做。"}], "source": "docs/charts/07-formatting.md", "updated": "2026-11-10", "objectives": ["说出图表的九大元素，并按需要开关每一个元素", "给图表选一套统一配色，全站同一系列保持同色", "用数据验证加 INDEX 与 MATCH 做出下拉联动的动态图表", "判断一张图里哪些元素是多余的，删掉它们而不丢信息"], "formulas": [], "scenarios": [], "pitfalls": [], "exercises": ["用示例工作簿里的季度销售额表做一张柱形图，依次完成：加数据标签、删网格线、删图例、把标题改成结论句。做完后数一下图上还剩几个元素。", "把同一张图分别换成商务蓝、莫兰迪、暖色三套配色，哪套最适合正式汇报？为什么？把华东系列固定为商务蓝 #2E75B6，说明全站统一配色的好处。", "用 12 个月营收表做一个动态图表：数据验证做月份下拉，INDEX 与 MATCH 取当月与相邻月份，图表数据源指向取数区域。下拉选 6 月时图表应显示哪三个月、哪三个数值？"], "answers": ["做完后图上剩标题、横轴、纵轴、数据标签四个元素。删掉的是网格线与图例：网格线删掉后读数靠数据标签，图例删掉后系列名由标题与标签说明，信息没有丢失。", "商务蓝最适合正式汇报：颜色稳重、对比清晰、打印后仍可读。莫兰迪偏柔和，适合长时间阅读的报告；暖色适合需要突出重点的演示。全站统一配色的好处是读者看一眼颜色就知道是哪个系列，不用每次重新对照图例。", "下拉选 6 月时图表显示 5 月 165 万元、6 月 158 万元、7 月 180 万元。取数方法是 MATCH 找到 6 月所在行，INDEX 取出该行与上下相邻行的营收。"], "versions": "Excel 2007 / 2010 / 2013 / 2016 / 2019 / 2021 / 365", "chart_items": [{"name": "图表元素", "name_en": "Chart Elements", "preview": "docs/charts/images/chart-elements.png", "use": "检查与调整一张图表的全部零件，例如给季度销售额柱形图加上数据标签、删掉网格线、把标题改成结论句。", "data_header": ["季度", "华东", "华北", "华南", "合计"], "data_rows": [["一季度", "120", "90", "60", "270"], ["二季度", "150", "110", "80", "340"], ["三季度", "130", "140", "95", "365"], ["四季度", "180", "160", "120", "460"]], "steps": ["用合计列做一张簇状柱形图。", "点图表右上角的加号，打开图表元素清单，逐项检查九大元素。", "勾选数据标签，让每根柱子顶上显示数值。", "取消勾选网格线，图表立刻干净一半。", "双击图表标题，改成结论句，例如“四季度合计 460 万元，全年最高”。"], "fmt": "坐标轴标题只在单位不明时加，单位明确就不加；图例能删就删，系列名直接标在柱子或线条旁边；数据标签与网格线不要同时开，两个都开会糊成一片。", "faq": [{"q": "图表元素清单在哪里？", "a": "点图表右上角的加号；或点图表工具设计选项卡里的添加图表元素。"}, {"q": "标题应该写什么？", "a": "写结论句，不要写“销售额图表”这种描述句；好标题是“四季度合计最高”，不是“季度销售额”。"}, {"q": "数据标签与图例哪个优先保留？", "a": "数据标签优先；标了数值就不用图例再解释一次，图例可以删掉。"}], "versions": "全部版本均支持，兼容 Excel 2007 / 2010 / 2013 / 2016 / 2019 / 2021 / 365；图表元素加号按钮需 Excel 2013 及以上版本，更早版本在功能区里找添加图表元素。", "workbook": "图表-示例-图表格式化.xlsx"}, {"name": "配色与样式", "name_en": "Color and Style", "preview": "docs/charts/images/color-style.png", "use": "给同一组数据换一套配色方案并对比效果，例如季度销售额分别用商务蓝、莫兰迪、暖色三套方案，看哪套最适合正式汇报。", "data_header": ["季度", "华东", "华北", "华南", "合计"], "data_rows": [["一季度", "120", "90", "60", "270"], ["二季度", "150", "110", "80", "340"], ["三季度", "130", "140", "95", "365"], ["四季度", "180", "160", "120", "460"]], "steps": ["用季度销售额合计列做一张簇状柱形图。", "点图表工具设计选项卡，点更改颜色，选一套内置配色。", "需要自定义时，右键系列，点设置数据系列格式，在填充里输入主色代码，例如商务蓝 #2E75B6。", "全站统一：华东永远用商务蓝，华北永远用橙色，华南永远用绿色。", "需要突出某一根柱子时，只把那根柱子改成橙色，其余保持商务蓝。"], "fmt": "图表样式在设计选项卡里一键换，包括配色、字体与效果；颜色数量不要超过 5 种，超过 5 种读者就记不住了；柱形图纵轴从 0 开始，截断纵轴会夸大差异。", "faq": [{"q": "配色有推荐方案吗？", "a": "正式汇报用商务蓝，长时间阅读用莫兰迪，需要突出重点用暖色；三套方案见上表。"}, {"q": "颜色太多怎么办？", "a": "只留主色与强调色，其余系列用同色系深浅区分；不要给每个系列都配一个高饱和颜色。"}, {"q": "图表样式改完还能还原吗？", "a": "能。设计选项卡里点图表样式，选回原来的样式；或按 Ctrl + Z 撤销。"}], "versions": "全部版本均支持，兼容 Excel 2007 / 2010 / 2013 / 2016 / 2019 / 2021 / 365；一键换样式的图表样式库需 Excel 2013 及以上版本。", "workbook": "图表-示例-图表格式化.xlsx"}, {"name": "动态图表", "name_en": "Dynamic Chart", "preview": "docs/charts/images/dynamic-chart.png", "use": "下拉菜单联动图表，例如下拉选 6 月，图表只显示当月与相邻月份的营收；选 12 月，图表就切换到 12 月的数据，不用重做图表。", "data_header": ["月份", "营收"], "data_rows": [["1月", "120"], ["2月", "135"], ["3月", "128"], ["4月", "150"], ["5月", "165"], ["6月", "158"], ["7月", "180"], ["8月", "195"], ["9月", "188"], ["10月", "210"], ["11月", "225"], ["12月", "240"]], "steps": ["用数据验证在单元格里做一个月份下拉菜单（1 月到 12 月）。", "用 INDEX 与 MATCH 按下拉选择取数：先 MATCH 找到月份所在行，再 INDEX 取出当月与相邻月份的营收。", "图表数据源指向取数区域，不要指向原始数据表。", "下拉选 6 月，检查图表是否只显示 5 月、6 月、7 月三根柱子。", "下拉换成 12 月，检查图表是否跟着切换。"], "fmt": "取数区域单独放一张表或放在图表旁边，不要与原始数据混在一起；下拉菜单旁边写清楚“选月份”；动态图表的标题也可以用公式拼，例如 =\"营收（\" & 下拉单元格 & \"）\"，标题跟着下拉变。", "faq": [{"q": "下拉变了，图表没变怎么办？", "a": "检查图表数据源是不是指向取数区域；指向原始数据表的图表永远不会动。"}, {"q": "INDEX 与 MATCH 不熟怎么办？", "a": "先用 VLOOKUP 代替 INDEX 与 MATCH，熟练后再换；取数逻辑一样。"}, {"q": "新增月份后图表不更新怎么办？", "a": "用 OFFSET 做动态区域，或把原始数据转成超级表，新增数据自动进图。"}], "versions": "数据验证、INDEX、MATCH 全部版本均支持，兼容 Excel 2007 / 2010 / 2013 / 2016 / 2019 / 2021 / 365。", "workbook": "图表-示例-图表格式化.xlsx"}], "file": "图表-示例-图表格式化.xlsx"}, {"id": "powerpivot-dax-01-data-model", "group": "powerpivot-dax", "column": "C10", "level2": "C10-L2-1", "title": "数据模型：把多张表变成一个可分析的整体", "level": "进阶", "body": "### 2.1 什么是数据模型\n\n数据模型是 Power Pivot 里的一组表加上表之间的关系。普通 Excel 工作表之间是孤立的，跨表取值要写 VLOOKUP；放进数据模型后，表与表通过关系连起来，透视表和 DAX 公式可以直接跨表计算，不用再写一堆查找公式。\n\n本篇配套示例共 4 张表：订单表 12 行、产品表 5 行、客户表 4 行、日期表 455 行（2025-01-01 至 2026-03-31，每日一行）。行数与配套示例文件逐项一致。\n\n### 2.2 事实表与维度表\n\n- **事实表**：记录业务事件的表，行数多、数字列多。本例中订单表是事实表：每一行是一笔订单，含订单号、日期、客户编号、产品编号、数量。\n- **维度表**：描述事实的表，行数少、文本列多。本例中产品表、客户表、日期表都是维度表：产品表描述卖的是什么，客户表描述卖给谁，日期表描述发生在何时。\n\n判断方法：问一句“这张表的一行代表一次业务发生，还是代表一个固定对象？”前者是事实表，后者是维度表。\n\n### 2.3 主键与外键\n\n- **主键**：维度表里唯一标识一行的列，值不能重复、不能为空。产品表的产品编号（P001 至 P005）、客户表的客户编号（C001 至 C004）、日期表的日期（455 个日期各不相同）都是主键。\n- **外键**：事实表里指向维度表主键的列，值可以重复。订单表的产品编号、客户编号、日期都是外键：O001 和 O007 的产品编号都是 P001，说明两笔订单卖的是同一种产品。\n\n主键与外键的值必须能对上号：订单表里出现的每一个产品编号，产品表里必须有一行；否则关系建不起来，透视表里会出现空白行。\n\n### 2.4 一对多关系与关系方向\n\n本例的三段关系都是一对多：\n\n| 关系 | 一端（维度表） | 多端（事实表） | 连接键 |\n|---|---|---|---|\n| 产品与订单 | 产品表（1） | 订单表（多） | 产品编号 |\n| 客户与订单 | 客户表（1） | 订单表（多） | 客户编号 |\n| 日期与订单 | 日期表（1） | 订单表（多） | 日期 |\n\n- **关系方向**：默认是单向筛选，从一端筛向多端。点选产品表里的“电脑”，订单表自动只剩电脑的 4 笔订单；反过来，在订单表里筛一个订单号，产品表不会跟着动。\n- **交叉筛选方向**：双向筛选会让筛选在两张表之间互相传导。初学者先用单向，够用且不容易出歧义；只有“两个维度表要互相筛选对方”时才考虑双向，例如既按产品筛客户、又按客户筛产品。\n\n### 2.5 星型模型\n\n以事实表为中心、维度表围在四周，就是星型模型：订单表在中间，产品表、客户表、日期表像星星的角一样连在它上面。星型模型是 Power Pivot 的标准形态，优点是关系简单、计算快、DAX 公式好写。本例的 4 张表正好构成一个星型：1 张事实表加 3 张维度表。\n\n不要把维度表再连维度表（例如产品表连客户表），那会变成雪花型，关系一多就容易出现筛选歧义，初学者先不碰。", "steps": ["启用 Power Pivot 加载项：文件 → 选项 → 加载项 → 管理选 COM 加载项 → 转到 → 勾选 Microsoft Power Pivot for Excel → 确定。功能区出现“Power Pivot”选项卡即成功（待补图）。", "把产品表转成超级表：选中产品表任意单元格 → 插入 → 表格 → 确认“表包含标题” → 确定。订单表、客户表、日期表同样处理（待补图）。", "打开 Power Pivot 窗口：Power Pivot → 管理。窗口里先是空的，还没有表。", "添加表到数据模型：在 Power Pivot 窗口点“添加到数据模型”→ 在工作表里选中订单表区域 → 确定；产品表、客户表、日期表重复同样操作。4 张表出现在模型里后，点“关系视图”（待补图）。", "建立产品与订单的关系：在关系视图中，把产品表的“产品编号”拖到订单表的“产品编号”上，松开鼠标，弹出“创建关系”对话框，确认“产品表（1）→ 订单表（多）”后点“创建”（待补图）。", "建立客户与订单、日期与订单的关系：同样拖线两次，分别连客户编号、日期。三条关系线出现后，关系视图里订单表居中、三张维度表围在四周，就是星型（待补图）。", "验证关系：回 Excel 插入一张数据透视表，勾选“将此数据添加到数据模型”；把产品表的“产品名称”拖到行、订单表的“数量”拖到值。若电脑一行显示 8（2+1+3+2），关系就是通的。", "保存文件：按 Ctrl+S 保存为 xlsx。数据模型随文件一起保存，下次打开不用重建。"], "sections": [{"title": "2. 基础概念", "body": "### 2.1 什么是数据模型\n\n数据模型是 Power Pivot 里的一组表加上表之间的关系。普通 Excel 工作表之间是孤立的，跨表取值要写 VLOOKUP；放进数据模型后，表与表通过关系连起来，透视表和 DAX 公式可以直接跨表计算，不用再写一堆查找公式。\n\n本篇配套示例共 4 张表：订单表 12 行、产品表 5 行、客户表 4 行、日期表 455 行（2025-01-01 至 2026-03-31，每日一行）。行数与配套示例文件逐项一致。\n\n### 2.2 事实表与维度表\n\n- **事实表**：记录业务事件的表，行数多、数字列多。本例中订单表是事实表：每一行是一笔订单，含订单号、日期、客户编号、产品编号、数量。\n- **维度表**：描述事实的表，行数少、文本列多。本例中产品表、客户表、日期表都是维度表：产品表描述卖的是什么，客户表描述卖给谁，日期表描述发生在何时。\n\n判断方法：问一句“这张表的一行代表一次业务发生，还是代表一个固定对象？”前者是事实表，后者是维度表。\n\n### 2.3 主键与外键\n\n- **主键**：维度表里唯一标识一行的列，值不能重复、不能为空。产品表的产品编号（P001 至 P005）、客户表的客户编号（C001 至 C004）、日期表的日期（455 个日期各不相同）都是主键。\n- **外键**：事实表里指向维度表主键的列，值可以重复。订单表的产品编号、客户编号、日期都是外键：O001 和 O007 的产品编号都是 P001，说明两笔订单卖的是同一种产品。\n\n主键与外键的值必须能对上号：订单表里出现的每一个产品编号，产品表里必须有一行；否则关系建不起来，透视表里会出现空白行。\n\n### 2.4 一对多关系与关系方向\n\n本例的三段关系都是一对多：\n\n| 关系 | 一端（维度表） | 多端（事实表） | 连接键 |\n|---|---|---|---|\n| 产品与订单 | 产品表（1） | 订单表（多） | 产品编号 |\n| 客户与订单 | 客户表（1） | 订单表（多） | 客户编号 |\n| 日期与订单 | 日期表（1） | 订单表（多） | 日期 |\n\n- **关系方向**：默认是单向筛选，从一端筛向多端。点选产品表里的“电脑”，订单表自动只剩电脑的 4 笔订单；反过来，在订单表里筛一个订单号，产品表不会跟着动。\n- **交叉筛选方向**：双向筛选会让筛选在两张表之间互相传导。初学者先用单向，够用且不容易出歧义；只有“两个维度表要互相筛选对方”时才考虑双向，例如既按产品筛客户、又按客户筛产品。\n\n### 2.5 星型模型\n\n以事实表为中心、维度表围在四周，就是星型模型：订单表在中间，产品表、客户表、日期表像星星的角一样连在它上面。星型模型是 Power Pivot 的标准形态，优点是关系简单、计算快、DAX 公式好写。本例的 4 张表正好构成一个星型：1 张事实表加 3 张维度表。\n\n不要把维度表再连维度表（例如产品表连客户表），那会变成雪花型，关系一多就容易出现筛选歧义，初学者先不碰。"}, {"title": "4. 图文示例", "body": "示例：关系视图里的星型模型（文字版）。\n\n- 中心是订单表（12 行事实表），周围三张表分别是产品表（5 行）、客户表（4 行）、日期表（455 行）。\n- 三条关系线：产品表.产品编号 → 订单表.产品编号；客户表.客户编号 → 订单表.客户编号；日期表.日期 → 订单表.日期。\n- 箭头方向从一端指向多端，表示筛选从维度表流向订单表。\n\n验证用透视表（行是产品名称，值是订单数量之和）：\n\n| 产品名称 | 订单数量合计 |\n|---|---|\n| 电脑 | 8 |\n| 手机 | 5 |\n| 耳机 | 30 |\n| 键盘 | 13 |\n| 显示器 | 6 |\n| 总计 | 62 |\n\n数量合计 62 = 2+3+10+5+2+1+3+2+20+8+4+2，与订单表明细逐行相加一致，说明关系没有丢行、没有重复计数（待补图）。"}], "source": "docs/powerpivot-dax/01-data-model.md", "updated": "2026-11-10", "objectives": ["把订单表、产品表、客户表、日期表添加到数据模型，并说出每张表是事实表还是维度表", "在关系视图中建立一对多关系，并指出每段关系的主键与外键", "说出关系方向与交叉筛选方向的区别，并判断单向筛选够不够用", "对照星型模型检查自己的模型，指出事实表与维度表的位置", "说出 Power Pivot 列式压缩的基本原理，并列出百万行数据建模的 5 条性能要点"], "formulas": ["本篇只用一个度量值做验证。度量值写在 Power Pivot 窗口的度量值区域，或在透视表字段列表里右键事实表新建。DAX 语法经 Microsoft 官方文档核对；输入表与预期结果经 Python 独立验算；未在 Excel 内执行验证。", "总销售额 = SUM(订单[金额])", "运行结果：总销售额 = 75600（订单表金额列 = 数量 × 单价，12 行合计：10000+9000+3000+1000+3000+5000+15000+6000+6000+1600+6000+10000 = 75600）。", "订单笔数 = COUNTROWS(订单)", "运行结果：订单笔数 = 12（订单表共 12 行）。", "客单价 = DIVIDE([总销售额], [订单笔数])", "运行结果：客单价 = 6300（75600 / 12）。", "按产品分组的预期结果（透视表行是产品名称，值是总销售额）：", "| 产品名称 | 总销售额 |", "|---|---|", "| 电脑 | 40000 |", "| 手机 | 15000 |", "| 耳机 | 9000 |", "| 显示器 | 9000 |", "| 键盘 | 2600 |", "| 总计 | 75600 |", "按地区分组的预期结果（透视表行是客户表的地区，值是总销售额）：", "| 地区 | 总销售额 |", "|---|---|", "| 华东 | 29600 |", "| 华南 | 28000 |", "| 华西 | 11000 |", "| 华北 | 7000 |", "| 总计 | 75600 |", "两张分组表的总计都是 75600，互相印证：如果某张分组表总计对不上，说明关系丢了行或键值对不上，先查外键有没有写错。"], "scenarios": [{"title": "场景：月度销售汇总不用 VLOOKUP。", "body": "- 背景：销售部每月给一张订单明细（订单号、日期、客户编号、产品编号、数量），产品信息在另一张产品表（产品编号、产品名称、类别、单价、成本），客户信息在第三张客户表（客户编号、客户名称、地区）。\n- 旧做法：在订单表旁加 VLOOKUP 列取单价、再加一列取地区，公式拖 12 行；下月新来 500 行订单，公式要重拖，VLOOKUP 一旦把查找范围写少一行就会返回错误值。\n- 新做法：4 张表进数据模型、连好 3 段关系；透视表行拖产品名称、值拖一个总销售额度量值，立刻得到电脑 40000、手机 15000 的分产品汇总；行换成地区，立刻得到华东 29600、华南 28000 的分地区汇总。下月追加订单行后点“刷新”，数字自动更新，公式一个不用改。\n- 结果：同一份模型既能按产品看、又能按地区看、还能按月看，不用为每个角度各建一张 VLOOKUP 辅助表。"}], "pitfalls": [{"problem": "功能区没有 Power Pivot 选项卡", "cause": "加载项未启用，或当前版本无此功能", "solution": "文件 → 选项 → 加载项 → COM 加载项 → 勾选后重启 Excel；家庭版无 Power Pivot 需换版本"}, {"problem": "拖线后提示“关系需要唯一值”", "cause": "维度表主键列有重复值或空值", "solution": "检查主键列去重、补空值；产品编号 P001 不能出现两次"}, {"problem": "透视表出现“(空白)”行", "cause": "订单表外键值在维度表里找不到", "solution": "检查外键拼写，例如产品编号多了空格；用删除重复项加条件格式定位孤儿值"}, {"problem": "分组总计与明细合计对不上", "cause": "关系方向错，或存在重复关系", "solution": "只保留一段关系；确认箭头从一端指向多端；删除多余的关系线"}, {"problem": "刷新后数字不变", "cause": "追加的新行在超级表范围之外", "solution": "把源数据先转成超级表再进模型；或在 Power Pivot 里点“刷新”而非只刷新透视表"}, {"problem": "模型文件体积突然变大", "cause": "导进了高基数列（如订单备注、时间戳）", "solution": "删除无用列；日期时间列拆成纯日期列；文本键改整型键"}, {"problem": "筛选产品后客户表没有反应", "cause": "关系是单向筛选，筛不动反方向", "solution": "这是正常行为；确实需要双向时再把交叉筛选方向改为“双向”，改前确认没有歧义环路"}], "exercises": ["订单表是事实表还是维度表？产品表呢？各用一句话说出判断依据。", "产品表的主键是哪一列？订单表里对应的外键是哪一列？如果订单表出现产品编号 P009，建关系时会发生什么？", "在关系视图中，产品表与订单表的关系是一对多还是一对一？为什么不能是一对一？", "只用本篇的 4 张表，画出星型模型（写出中心表与三张维度表，以及三段关系的连接键）。", "透视表行拖地区、值拖总销售额度量值，华东一行的预期结果是多少？写出 29600 的加法算式。", "订单表追加 500 行新订单后，透视表数字没有变化。列出两种可能原因与对应的处理方法。"], "answers": ["订单表是事实表（一行是一笔订单，是业务事件）；产品表是维度表（一行是一种产品，是固定对象）。依据：问“这行代表一次发生还是一个对象”。", "主键是产品表的产品编号；外键是订单表的产品编号。P009 在产品表里没有对应行，关系建不起来（或透视表出现空白行），需先在产品表补 P009 一行。", "一对多。一个产品可以出现在多笔订单里（电脑出现 4 次），一笔订单只对应一个产品；一对一要求两边都不重复，不符合业务。", "中心是订单表；维度表是产品表、客户表、日期表；连接键分别是产品编号、客户编号、日期。", "29600。算式：10000（O001）+3000（O003）+15000（O007）+1600（O010）= 29600。", "原因一：新行不在超级表范围里，模型没导进来，处理是把源数据转成超级表后在 Power Pivot 里刷新。原因二：只刷新了透视表没刷新模型，处理是在 Power Pivot 窗口点刷新。"], "versions": "Excel 2016／2019／2021／365（需启用 Power Pivot 加载项；部分家庭版无此功能）", "file": "示例-Power-Pivot-数据模型与DAX.xlsx"}, {"id": "powerpivot-dax-02-dax-basics", "group": "powerpivot-dax", "column": "C10", "level2": "C10-L2-2", "title": "DAX 基础：语法、计算列与度量值、行上下文与筛选上下文", "level": "进阶", "body": "### 2.1 DAX 是什么\n\nDAX（Data Analysis Expressions，数据分析表达式）是 Power Pivot 里写公式的语言。外形像 Excel 函数：SUM、AVERAGE、IF 这些名字都一样；思维是列式的：公式操作的是整列、整张表，而不是单个单元格。写 DAX 之前先忘掉“A1 单元格”这种定位方式，改成想“对哪张表的哪一列、按什么条件算”。\n\n### 2.2 DAX 语法\n\n- 表名用单引号括起来（表名含中文或空格时必须写）：`'订单'`，或省略单引号写 `订单`。\n- 列引用写成 `表[列]`：`订单[金额]`、`产品[单价]`。\n- 度量值引用只写方括号：`[总销售额]`，前面不加表名。\n- 计算列公式以等号开头：`= 订单[数量] * RELATED(产品[单价])`；度量值公式同样以等号开头：`= SUM(订单[金额])`。\n- 注释用双斜线：`// 这是注释`。\n\n### 2.3 计算列与度量值\n\n| 对比项 | 计算列 | 度量值 |\n|---|---|---|\n| 存在位置 | 表里真实的一列，每行都有一个值 | 不占列，只在透视表、图表里现算出一个值 |\n| 计算时机 | 数据加载或刷新时逐行算好、存起来 | 查询时按当前筛选现算 |\n| 典型用途 | 每行都要用的派生值，如订单金额 = 数量 × 单价 | 汇总指标，如总销售额、利润率、同比 |\n| 内存占用 | 占内存（算好存起来） | 几乎不占（算完即走） |\n| 随筛选变化 | 值固定不变，筛不掉 | 随切片器、行列筛选自动重算 |\n\n判断口诀：**要的是“每行一个值”写计算列；要的是“一个汇总数”写度量值**。订单金额每行不同，用计算列；总销售额只有一个汇总数，用度量值。\n\n### 2.4 行上下文与筛选上下文（DAX 最难的概念）\n\nDAX 公式求值时同时受两种上下文影响，90% 的 DAX 报错和“数字不对”都出在这里。\n\n- **行上下文**：公式正在算“当前这一行”。计算列天生有行上下文：算 O001 这一行的金额时，`订单[数量]` 就是 O001 的 2，`订单[单价]` 就是 O001 所在行的单价值。迭代函数（SUMX、FILTER、ADDCOLUMNS）也会逐行产生行上下文。\n- **筛选上下文**：公式正在算“经过筛选后剩下的那些行”。透视表的行标签、列标签、切片器都是筛选上下文：透视表里“电脑”那一行，就是先把订单表筛到产品是电脑的 4 笔订单，再对这 4 行求和。度量值天生只有筛选上下文，没有行上下文。\n\n两句话记住：**行上下文决定“当前是哪一行”，筛选上下文决定“还剩哪些行”**。计算列靠行上下文逐行算；度量值靠筛选上下文汇总算。\n\n### 2.5 两个上下文如何互相影响\n\n- 度量值里用 CALCULATE 可以改筛选上下文（下一章细讲）。\n- 迭代函数里用 CALCULATE 会发生上下文转换：行上下文变成筛选上下文，即“当前行”的值变成筛选条件。这是 DAX 进阶的第一个坎，本篇先记住结论，03 篇有实例。", "steps": ["确认数据模型已建好：订单表、产品表、客户表、日期表 4 张表已在模型里，三段关系已连好（做法见 01 篇）。没有模型，DAX 无处可写（待补图）。", "新建计算列“金额”：在 Power Pivot 窗口选中订单表，点最右一列的“添加列”，输入公式 `= 订单[数量] * RELATED(产品[单价])`，回车后双击列标题改名为“金额”（待补图）。", "检查计算列结果：O001 一行金额应为 10000（2 × 5000），O003 一行应为 3000（10 × 300）。对不上先查 RELATED 有没有连对关系。", "新建度量值“总销售额”：在 Power Pivot 窗口选中订单表，右键 → 新建度量值 → 度量值名称填“总销售额”，公式填 `= SUM(订单[金额])`，格式选货币（待补图）。", "新建度量值“订单笔数”与“客单价”：订单笔数公式 `= COUNTROWS(订单)`；客单价公式 `= DIVIDE([总销售额], [订单笔数])`。DIVIDE 会在除数为零时返回空值，比直接用斜线更安全。", "验证：在 Excel 插入数据透视表（勾选“将此数据添加到数据模型”），把产品表的产品名称拖到行、把总销售额拖到值。电脑一行应显示 40000，总计 75600（待补图）。"], "sections": [{"title": "2. 基础概念", "body": "### 2.1 DAX 是什么\n\nDAX（Data Analysis Expressions，数据分析表达式）是 Power Pivot 里写公式的语言。外形像 Excel 函数：SUM、AVERAGE、IF 这些名字都一样；思维是列式的：公式操作的是整列、整张表，而不是单个单元格。写 DAX 之前先忘掉“A1 单元格”这种定位方式，改成想“对哪张表的哪一列、按什么条件算”。\n\n### 2.2 DAX 语法\n\n- 表名用单引号括起来（表名含中文或空格时必须写）：`'订单'`，或省略单引号写 `订单`。\n- 列引用写成 `表[列]`：`订单[金额]`、`产品[单价]`。\n- 度量值引用只写方括号：`[总销售额]`，前面不加表名。\n- 计算列公式以等号开头：`= 订单[数量] * RELATED(产品[单价])`；度量值公式同样以等号开头：`= SUM(订单[金额])`。\n- 注释用双斜线：`// 这是注释`。\n\n### 2.3 计算列与度量值\n\n| 对比项 | 计算列 | 度量值 |\n|---|---|---|\n| 存在位置 | 表里真实的一列，每行都有一个值 | 不占列，只在透视表、图表里现算出一个值 |\n| 计算时机 | 数据加载或刷新时逐行算好、存起来 | 查询时按当前筛选现算 |\n| 典型用途 | 每行都要用的派生值，如订单金额 = 数量 × 单价 | 汇总指标，如总销售额、利润率、同比 |\n| 内存占用 | 占内存（算好存起来） | 几乎不占（算完即走） |\n| 随筛选变化 | 值固定不变，筛不掉 | 随切片器、行列筛选自动重算 |\n\n判断口诀：**要的是“每行一个值”写计算列；要的是“一个汇总数”写度量值**。订单金额每行不同，用计算列；总销售额只有一个汇总数，用度量值。\n\n### 2.4 行上下文与筛选上下文（DAX 最难的概念）\n\nDAX 公式求值时同时受两种上下文影响，90% 的 DAX 报错和“数字不对”都出在这里。\n\n- **行上下文**：公式正在算“当前这一行”。计算列天生有行上下文：算 O001 这一行的金额时，`订单[数量]` 就是 O001 的 2，`订单[单价]` 就是 O001 所在行的单价值。迭代函数（SUMX、FILTER、ADDCOLUMNS）也会逐行产生行上下文。\n- **筛选上下文**：公式正在算“经过筛选后剩下的那些行”。透视表的行标签、列标签、切片器都是筛选上下文：透视表里“电脑”那一行，就是先把订单表筛到产品是电脑的 4 笔订单，再对这 4 行求和。度量值天生只有筛选上下文，没有行上下文。\n\n两句话记住：**行上下文决定“当前是哪一行”，筛选上下文决定“还剩哪些行”**。计算列靠行上下文逐行算；度量值靠筛选上下文汇总算。\n\n### 2.5 两个上下文如何互相影响\n\n- 度量值里用 CALCULATE 可以改筛选上下文（下一章细讲）。\n- 迭代函数里用 CALCULATE 会发生上下文转换：行上下文变成筛选上下文，即“当前行”的值变成筛选条件。这是 DAX 进阶的第一个坎，本篇先记住结论，03 篇有实例。"}, {"title": "4. 图文示例", "body": "示例 1：计算列金额的前 3 行（文字版，订单表）。\n\n| 订单号 | 数量 | 单价（RELATED 取产品表） | 金额（计算列） |\n|---|---|---|---|\n| O001 | 2 | 5000 | 10000 |\n| O002 | 3 | 3000 | 9000 |\n| O003 | 10 | 300 | 3000 |\n\n每一行的金额只跟本行有关：O001 的 10000 = 2 × 5000，与其他行无关。这就是行上下文。\n\n示例 2：度量值随筛选变化（文字版）。\n\n- 不筛任何条件时，总销售额 = 75600（12 笔全算）。\n- 透视表行标签选“电脑”时，总销售额 = 40000（只剩 O001、O006、O007、O012 共 4 笔）。\n- 再叠加切片器选地区“华东”，总销售额 = 25000（只剩 O001、O007 两笔：10000+15000）。\n\n同一个度量值、三种结果，变的是筛选上下文，不是公式本身（待补图）。"}], "source": "docs/powerpivot-dax/02-dax-basics.md", "updated": "2026-11-10", "objectives": ["写出正确的 DAX 语法：函数名、表名、列引用、度量值引用的写法", "说出计算列与度量值的 4 处区别，并判断一个需求该用哪一个", "用“逐行”和“先筛后算”两句话解释行上下文与筛选上下文", "指出 3 个行上下文与筛选上下文的典型反例错在哪里", "用 SUM、COUNTROWS、AVERAGE 写出总销售额、订单笔数、平均单价，并报出每个度量值的预期结果"], "formulas": ["DAX 语法经 Microsoft 官方文档核对；输入表与预期结果经 Python 独立验算；未在 Excel 内执行验证。以下度量值均以本篇配套表的 12 行订单为准。", "示例 1：总销售额（入门第一式）。", "总销售额 = SUM(订单[金额])", "运行结果：总销售额 = 75600（12 行金额合计：10000+9000+3000+1000+3000+5000+15000+6000+6000+1600+6000+10000）。", "示例 2：订单笔数。", "订单笔数 = COUNTROWS(订单)", "运行结果：订单笔数 = 12（订单表共 12 行）。", "示例 3：平均单价（对产品表的单价列取平均）。", "平均单价 = AVERAGE(产品[单价])", "运行结果：平均单价 = 2000（(5000+3000+300+200+1500) / 5 = 10000 / 5）。", "示例 4：客单价（度量值引用度量值）。", "客单价 = DIVIDE([总销售额], [订单笔数])", "运行结果：客单价 = 6300（75600 / 12）。", "示例 5：计算列金额（逐行算）。", "金额 = 订单[数量] * RELATED(产品[单价])", "运行结果：O001 行 10000、O002 行 9000、O003 行 3000、O004 行 1000、O005 行 3000、O006 行 5000、O007 行 15000、O008 行 6000、O009 行 6000、O010 行 1600、O011 行 6000、O012 行 10000；12 行合计 75600，与示例 1 的度量值互相印证。", "反例 1：在度量值里直接写列引用（最常见的初学错误）。", "// 错误写法：度量值没有行上下文，订单[数量]不知道指哪一行", "错误客单价 = 订单[数量] * 订单[单价]", "运行结果：报错。度量值里没有“当前行”，`订单[数量]` 是一整列，不能直接参与单值运算。正确做法是先用 SUMX 逐行算再汇总（见 03 篇），或写成计算列。", "反例 2：在产品表计算列里用 RELATED 取订单表字段（方向反了）。", "// 错误写法：RELATED 只能从多端取一端，不能从一端取多端", "错误金额 = RELATED(订单[金额])", "运行结果：报错。一个产品对应多笔订单，RELATED 不知道取哪一笔。正确做法是在订单表（多端）用 RELATED 取产品表（一端）的字段；反方向取多行要用 RELATEDTABLE（返回一张表，再配 SUMX 汇总）。", "反例 3：把度量值当计算列用，以为每行都会变。", "// 度量值本身没错，但放在订单明细表里当“每行金额”用就是错的", "总销售额 = SUM(订单[金额])", "运行结果：明细表每一行都显示 75600（整表汇总值），而不是本行的金额。原因：度量值只有筛选上下文、没有行上下文，在明细行里筛不到“当前行”。每行金额必须用计算列。"], "scenarios": [{"title": "场景：销售日报的三个数，老板每天要看。", "body": "- 背景：每天下班前，老板问三个数：今天总共卖了多少、多少笔、平均每笔多少。订单明细每天追加，产品单价在产品表里。\n- 做法：数据模型里建好关系后，写 3 个度量值：总销售额 `= SUM(订单[金额])`、订单笔数 `= COUNTROWS(订单)`、客单价 `= DIVIDE([总销售额], [订单笔数])`；透视表行拖日期表里的日期，值拖这 3 个度量值。\n- 结果：以本篇数据为例，全表三个数是 75600、12 笔、6300；按月展开后，2026-01 是 21000、2 笔、10500，2026-02 是 7600、2 笔、3800，2026-03 是 16000、2 笔、8000。每天追加订单后刷新即可，不用每天重写公式。\n- 要点：这三个数全是度量值，原因是要的是汇总数、且要随日期筛选自动变化；如果写成计算列，透视表里每行都会显示同一个全表汇总值。"}], "pitfalls": [{"problem": "度量值里写列名直接报错", "cause": "度量值没有行上下文，列引用不知道指哪一行", "solution": "用 SUM、COUNTROWS、SUMX 等聚合函数包起来；或改写成计算列"}, {"problem": "计算列每一行都是同一个数", "cause": "在计算列里用了 SUM(整列) 这类聚合", "solution": "计算列要逐行算，用行内列运算（如数量 × 单价），不要用聚合函数"}, {"problem": "RELATED 报错“找不到相关行”", "cause": "方向反了，从一端取多端", "solution": "RELATED 只能多端取一端；反方向用 RELATEDTABLE 加 SUMX"}, {"problem": "度量值在明细行里全是总计值", "cause": "把度量值当计算列用", "solution": "明细行要每行不同的值，改用计算列；度量值只放汇总位置"}, {"problem": "SUM 求和结果比手工加的大", "cause": "金额列里混进了文本型数字或重复行", "solution": "检查金额列类型是否为数值；检查模型里有没有重复导入同一张表"}, {"problem": "AVERAGE 平均数明显不对", "cause": "对事实表数量列取了平均，而不是按订单平均", "solution": "明确平均对象：产品单价平均用 AVERAGE(产品[单价]) = 2000；客单价要用 DIVIDE([总销售额], [订单笔数]) = 6300"}, {"problem": "度量值名含空格后引用报错", "cause": "引用度量值时漏了方括号", "solution": "度量值一律用方括号引用，如 [总销售额]；表名含空格时加单引号"}, {"problem": "写了公式但透视表里找不到度量值", "cause": "度量值建在了另一张表上", "solution": "在 Power Pivot 窗口确认度量值所属表；建议把度量值统一建在事实表（订单表）上"}], "exercises": ["写出度量值“总销售额”的 DAX 公式，并说出它的预期结果是多少。", "计算列“金额”的公式是 `= 订单[数量] * RELATED(产品[单价])`，O007 一行的金额是多少？写出算式。", "判断：客单价应该写成计算列还是度量值？为什么？", "下面的度量值为什么报错？`错误公式 = 订单[数量] * 5000`。写出正确的改法（两种改法任选一种）。", "透视表行标签是产品名称时，总销售额度量值在“电脑”一行显示多少？在“键盘”一行显示多少？两数相加是多少？", "AVERAGE(产品[单价]) 的结果是 2000。如果改成 AVERAGE(订单[金额])，结果是多少？这个数有什么业务含义？"], "answers": ["`总销售额 = SUM(订单[金额])`，预期结果 75600。", "O007 金额 = 3 × 5000 = 15000。", "度量值。因为客单价是一个汇总数（总销售额除以订单笔数），且要随日期、产品等筛选自动变化；计算列的值固定不变，不适合。", "报错原因：度量值没有行上下文，`订单[数量]` 是一整列，不能直接乘。改法一：改成计算列 `金额2 = 订单[数量] * 5000`。改法二：改成度量值 `= SUMX(订单, 订单[数量] * 5000)`。", "电脑一行 40000，键盘一行 2600，两数相加 42600。", "AVERAGE(订单[金额]) = 75600 / 12 = 6300。这个数等于客单价（每笔订单的平均金额），因为订单表一行就是一笔订单；但它和产品平均单价 2000 不是一回事，不要混用。"], "versions": "Excel 2016／2019／2021／365（需启用 Power Pivot 加载项；部分家庭版无此功能）", "file": "示例-Power-Pivot-数据模型与DAX.xlsx"}, {"id": "powerpivot-dax-03-measures-calculated-columns", "group": "powerpivot-dax", "column": "C10", "level2": "C10-L2-3", "title": "度量值与计算列：CALCULATE、SUMX、RELATED、FILTER、ALL 与 KPI", "level": "进阶", "body": "### 2.1 度量值写在哪里、怎么复用\n\n度量值统一建在事实表（本例是订单表）上，命名用中文业务名：总销售额、总利润、利润率。不要把同一个总销售额在 5 张表上各写一遍，也不要在透视表里现写一次性公式。一处定义、处处引用：客单价引用总销售额，同比引用总销售额和去年同期，改一处就全改了。\n\n度量值之间可以互相引用，引用时只写方括号：`[总销售额]`。写度量值时先想好依赖链：基础度量值（总销售额、总利润）→ 派生度量值（利润率、客单价、同比）→ 展示度量值（完成率、排名）。\n\n### 2.2 五个函数的分工\n\n| 函数 | 作用一句话 | 关键点 |\n|---|---|---|\n| CALCULATE | 改筛选上下文后再算 | DAX 里唯一能改筛选上下文的函数 |\n| SUMX | 逐行算表达式、再求和 | 迭代函数，每行都有行上下文 |\n| RELATED | 取关联表（一端）的字段值 | 只能从多端取一端，写在计算列里 |\n| FILTER | 按条件筛出一张子表 | 返回表，不能单独做度量值，要配聚合函数 |\n| ALL | 去掉筛选（全部或指定列） | 常用来算分母（总计）和占比 |\n\n### 2.3 KPI 的思路\n\nKPI 不是一个公式，而是一组互相印证的度量值：规模类（总销售额 75600）、盈利类（总利润 22770、利润率 30.12%）、目标类（目标完成率 94.50%）、效率类（客单价 6300）。四个数放在一张仪表盘上，任何一个数异常都能顺着依赖链追到原因：利润率掉了，先看总利润，再看总销售额和总成本。", "steps": ["打开 Power Pivot 窗口，确认订单表已有计算列“金额”（02 篇做法），否则先补上（待补图）。", "在订单表新建度量值“总利润”：公式 `= SUMX(订单, 订单[数量] * (RELATED(产品[单价]) - RELATED(产品[成本])))`，格式选货币。", "在订单表新建度量值“利润率”：公式 `= DIVIDE([总利润], [总销售额])`，格式选百分比。", "在订单表新建度量值“华东销售额”：公式 `= CALCULATE([总销售额], 客户[地区] = \"华东\")`。", "在订单表新建度量值“电脑销售额占比”：公式 `= DIVIDE([电脑销售额], CALCULATE([总销售额], ALL(产品)))`，其中电脑销售额先建为 `= CALCULATE([总销售额], 产品[产品名称] = \"电脑\")`。", "在 Excel 插入数据透视表验证：行拖产品名称、值拖总销售额和电脑销售额占比；电脑一行占比应显示 52.91%，总计行占比 100%（待补图）。", "把 6 个度量值记到一张 KPI 清单上（名称、公式、预期结果），下次做仪表盘直接引用，不重写。"], "sections": [{"title": "2. 基础概念", "body": "### 2.1 度量值写在哪里、怎么复用\n\n度量值统一建在事实表（本例是订单表）上，命名用中文业务名：总销售额、总利润、利润率。不要把同一个总销售额在 5 张表上各写一遍，也不要在透视表里现写一次性公式。一处定义、处处引用：客单价引用总销售额，同比引用总销售额和去年同期，改一处就全改了。\n\n度量值之间可以互相引用，引用时只写方括号：`[总销售额]`。写度量值时先想好依赖链：基础度量值（总销售额、总利润）→ 派生度量值（利润率、客单价、同比）→ 展示度量值（完成率、排名）。\n\n### 2.2 五个函数的分工\n\n| 函数 | 作用一句话 | 关键点 |\n|---|---|---|\n| CALCULATE | 改筛选上下文后再算 | DAX 里唯一能改筛选上下文的函数 |\n| SUMX | 逐行算表达式、再求和 | 迭代函数，每行都有行上下文 |\n| RELATED | 取关联表（一端）的字段值 | 只能从多端取一端，写在计算列里 |\n| FILTER | 按条件筛出一张子表 | 返回表，不能单独做度量值，要配聚合函数 |\n| ALL | 去掉筛选（全部或指定列） | 常用来算分母（总计）和占比 |\n\n### 2.3 KPI 的思路\n\nKPI 不是一个公式，而是一组互相印证的度量值：规模类（总销售额 75600）、盈利类（总利润 22770、利润率 30.12%）、目标类（目标完成率 94.50%）、效率类（客单价 6300）。四个数放在一张仪表盘上，任何一个数异常都能顺着依赖链追到原因：利润率掉了，先看总利润，再看总销售额和总成本。"}, {"title": "4. 图文示例", "body": "示例：五个函数各解决一个问题（文字版）。\n\n| 需求 | 用的函数 | 度量值 | 预期结果 |\n|---|---|---|---|\n| 华东地区卖了多少 | CALCULATE | 华东销售额 | 29600 |\n| 总共赚了多少 | SUMX | 总利润 | 22770 |\n| 每笔订单的金额 | RELATED（计算列） | 金额 | O001 行 10000 |\n| 金额大于 8000 的订单有几笔、共多少 | FILTER | 高价值订单笔数／金额 | 4 笔／44000 |\n| 电脑占总销售额的几成 | ALL | 电脑销售额占比 | 52.91% |\n\n输入表统一用配套示例的订单表 12 行、产品表 5 行、客户表 4 行；预期结果全部经 Python 独立验算（待补图）。"}], "source": "docs/powerpivot-dax/03-measures-calculated-columns.md", "updated": "2026-11-10", "objectives": ["用 CALCULATE 改写筛选上下文，算出华东销售额 29600 与电脑销售额 40000", "用 SUMX 做逐行乘法再汇总，算出总利润 22770 与加权平均单价 1219.35", "用 RELATED 在计算列里取关联表字段，并说出它只能从多端取一端的限制", "用 FILTER 筛出高价值订单（金额大于 8000，4 笔，合计 44000）", "用 ALL 去掉筛选算出占比，算出电脑销售额占比 52.91%", "建一套可复用的 KPI 度量值（总销售额、总利润、利润率、目标完成率），并说出度量值应该建在哪里"], "formulas": ["DAX 语法经 Microsoft 官方文档核对；输入表与预期结果经 Python 独立验算；未在 Excel 内执行验证。以下示例的输入表均为配套示例文件里的表。", "### 5.1 CALCULATE：改筛选上下文后再算", "语法：`CALCULATE(表达式, 筛选条件1, 筛选条件2, ...)`。先按筛选条件改上下文，再算表达式。", "华东销售额 = CALCULATE([总销售额], 客户[地区] = \"华东\")", "运行结果：华东销售额 = 29600。输入是客户表地区为华东的两家客户（C001 华东公司）的订单：O001 10000 + O003 3000 + O007 15000 + O010 1600 = 29600。", "电脑销售额 = CALCULATE([总销售额], 产品[产品名称] = \"电脑\")", "运行结果：电脑销售额 = 40000。输入是产品为电脑的 4 笔订单：O001 10000 + O006 5000 + O007 15000 + O012 10000 = 40000。", "数码类销售额 = CALCULATE([总销售额], 产品[类别] = \"数码\")", "运行结果：数码类销售额 = 64000。输入是类别为数码的产品（电脑 40000 + 手机 15000 + 显示器 9000）；配件类 11600（耳机 9000 + 键盘 2600）；两者相加 75600，与总销售额一致。", "注意：CALCULATE 的筛选条件会覆盖透视表里同一列的筛选。如果透视表行已经是“手机”，再用 CALCULATE 指定产品是“电脑”，结果会按电脑算，而不是手机。", "### 5.2 SUMX：逐行算、再求和", "语法：`SUMX(表, 表达式)`。对表里每一行算一次表达式，再把结果加起来。利润不能直接 SUM，因为利润 = 数量 ×（单价 − 成本），单价和成本在不同行不一样，必须逐行算。", "总利润 = SUMX(订单, 订单[数量] * (RELATED(产品[单价]) - RELATED(产品[成本])))", "运行结果：总利润 = 22770。逐行利润：O001 2400、O002 2700、O003 1500、O004 450、O005 1000、O006 1200、O007 3600、O008 1800、O009 3000、O010 720、O011 2000、O012 2400；12 行相加 22770。其中 2025 年利润 9250，2026 年 1 至 3 月利润 13520。", "加权平均单价 = DIVIDE(SUMX(订单, 订单[数量] * RELATED(产品[单价])), SUM(订单[数量]))", "运行结果：加权平均单价 = 1219.35。分子是总销售额 75600，分母是总数量 62（2+3+10+5+2+1+3+2+20+8+4+2）；75600 / 62 = 1219.35。不要和产品表的简单平均单价 2000 混用：2000 是 5 种产品单价的平均，1219.35 是按实际销量加权的平均。", "### 5.3 RELATED：从多端取一端的字段", "RELATED 只用在计算列（或迭代函数）里，从当前行所在的多端取一端表的字段。订单表是多端，产品表是一端，所以在订单表里可以 RELATED 产品表的单价和成本。", "金额 = 订单[数量] * RELATED(产品[单价])", "运行结果（计算列，每行一个值）：O001 行 10000（2 × 5000）、O002 行 9000（3 × 3000）、O003 行 3000（10 × 300）、O004 行 1000（5 × 200）、O005 行 3000（2 × 1500）、O006 行 5000（1 × 5000）、O007 行 15000（3 × 5000）、O008 行 6000（2 × 3000）、O009 行 6000（20 × 300）、O010 行 1600（8 × 200）、O011 行 6000（4 × 1500）、O012 行 10000（2 × 5000）。", "反例：想在产品表里用 RELATED 取订单表的金额会报错，因为一个产品对应多笔订单，RELATED 不知道取哪一行。反方向要先用 RELATEDTABLE 取回多行，再用 SUMX 汇总（见 05 篇）。", "### 5.4 FILTER：按条件筛出一张子表", "语法：`FILTER(表, 条件)`。返回一张筛过的表，不能单独做度量值，必须配 SUM、COUNTROWS、SUMX 使用。", "高价值订单笔数 = COUNTROWS(FILTER(订单, 订单[金额] > 8000))", "运行结果：高价值订单笔数 = 4。输入是金额大于 8000 的订单：O001 10000、O002 9000、O007 15000、O012 10000，共 4 笔。", "高价值订单金额 = SUMX(FILTER(订单, 订单[金额] > 8000), 订单[金额])", "运行结果：高价值订单金额 = 44000（10000+9000+15000+10000）。这 4 笔占总销售额的 58.20%（44000 / 75600）。", "注意：CALCULATE 里能用简单条件时优先用 CALCULATE（如 `客户[地区] = \"华东\"`），只有条件跨多列、或需要 OR、或需要 RELATED 跨表判断时才用 FILTER。FILTER 是逐行筛，大表上比 CALCULATE 慢。", "### 5.5 ALL：去掉筛选，算分母和占比", "语法：`ALL(表)` 去掉整张表的筛选，`ALL(表[列])` 只去掉某一列的筛选。算占比时分母要用 ALL 把筛选去掉，否则分子分母同时被筛，占比永远是 100%。", "电脑销售额占比 = DIVIDE([电脑销售额], CALCULATE([总销售额], ALL(产品)))", "运行结果：电脑销售额占比 = 52.91%（40000 / 75600）。如果分母不用 ALL，在产品名称为电脑的行里，分母会被筛成 40000，占比就变成 100%，是错的。", "各产品占比（透视表行是产品名称，值是占比度量值）：", "| 产品名称 | 销售额 | 占比 |", "|---|---|---|", "| 电脑 | 40000 | 52.91% |", "| 手机 | 15000 | 19.84% |", "| 耳机 | 9000 | 11.90% |", "| 显示器 | 9000 | 11.90% |", "| 键盘 | 2600 | 3.44% |", "| 总计 | 75600 | 100.00% |", "占比合计：52.91 + 19.84 + 11.90 + 11.90 + 3.44 = 99.99（四舍五入尾差，实际合计 100%）。", "### 5.6 KPI 度量值：一套互相印证的指标", "利润率 = DIVIDE([总利润], [总销售额])", "运行结果：利润率 = 30.12%（22770 / 75600）。分年看：2025 年利润率 29.84%（9250 / 31000），2026 年 1 至 3 月利润率 30.31%（13520 / 44600）。", "目标完成率 = DIVIDE([总销售额], 80000)", "运行结果：目标完成率 = 94.50%（75600 / 80000）。全年销售目标 80000，当前完成 75600，还差 4400。2026 年 1 至 3 月单独看：目标 50000，完成 44600，完成率 89.20%。", "客单价 = DIVIDE([总销售额], [订单笔数])", "运行结果：客单价 = 6300（75600 / 12）。", "KPI 清单（6 个度量值，全部建在订单表上）：", "| 度量值 | 公式要点 | 预期结果 |", "|---|---|---|", "| 总销售额 | SUM(订单[金额]) | 75600 |", "| 订单笔数 | COUNTROWS(订单) | 12 |", "| 总利润 | SUMX 逐行算利润再汇总 | 22770 |", "| 利润率 | DIVIDE([总利润], [总销售额]) | 30.12% |", "| 客单价 | DIVIDE([总销售额], [订单笔数]) | 6300 |", "| 目标完成率 | DIVIDE([总销售额], 80000) | 94.50% |"], "scenarios": [{"title": "场景：销售例会的一页 KPI。", "body": "- 背景：每周一例会，老板要看上周的销售 KPI：卖了多少、赚了多少、利润率、离目标还差多少。以前每次开会前都要现算，数字还经常对不上。\n- 做法：在数据模型里建好 6 个度量值（见 5.6 节清单），透视表行拖日期表的月份，值拖总销售额、总利润、利润率、目标完成率。切片器放地区和产品类别。\n- 结果：以本篇数据为例，不筛条件时一行数是 75600、22770、30.12%、94.50%；点切片器选华东，四个数自动变成 29600、8220、27.77%、37.00%（29600 / 80000）。华东利润 8220 的算法：O001 2400 + O003 1500 + O007 3600 + O010 720 = 8220，利润率 8220 / 29600 = 27.77%。手工现算很容易抄错一行，度量值随切片器自动重算不会错，这就是 KPI 度量值要现算、不要手写的原因。\n- 要点：KPI 度量值一处定义、处处复用；例会前只刷新数据，不重算数字。"}], "pitfalls": [{"problem": "CALCULATE 的条件不起作用", "cause": "条件列写错了表，如把客户表的地区写成订单表的地区", "solution": "条件里的列必须写所属表：客户[地区]，不是订单[地区]"}, {"problem": "SUMX 结果比 SUM 大很多", "cause": "表达式里用了聚合函数导致重复汇总", "solution": "SUMX 的第二个参数是逐行表达式，不能再套 SUM；要汇总用 SUMX(表, 列1 * 列2)"}, {"problem": "RELATED 报错", "cause": "在一端表里取多端字段，或关系没建", "solution": "RELATED 只能多端取一端；先检查关系视图里线连没连对"}, {"problem": "FILTER 度量值报错“返回表”", "cause": "FILTER 返回表，不能直接当度量值", "solution": "配聚合函数：COUNTROWS(FILTER(...)) 或 SUMX(FILTER(...), ...)"}, {"problem": "占比全是 100%", "cause": "分母没用 ALL 去掉筛选", "solution": "分母写成 CALCULATE([总销售额], ALL(产品))，把产品筛选去掉"}, {"problem": "利润率在总计行不对", "cause": "总计行是汇总后再算比率，不是把各行比率加总", "solution": "这是正确的：总计利润率 = 总利润 / 总销售额 = 30.12%，不要手工加各行比率"}, {"problem": "度量值到处重复定义", "cause": "同一个总销售额在多张表上各写一遍", "solution": "统一建在事实表上，其他地方只引用 [总销售额]"}, {"problem": "目标完成率超过 100% 还显示正常", "cause": "目标值写死在公式里，目标变了没人改", "solution": "目标值单独建一张参数表或度量值，公式里引用，不要写死数字"}], "exercises": ["写出度量值“华东销售额”的 DAX 公式，并说出预期结果。华南销售额又是多少？", "总利润为什么不能用 SUM(订单[利润]) 直接算（假设没有利润列）？必须用什么函数？写出公式并报出预期结果。", "高价值订单定义为金额大于 8000。写出 COUNTROWS + FILTER 的度量值公式，并报出笔数与合计金额。", "电脑销售额占比的公式里，分母为什么必须加 ALL(产品)？如果不加会发生什么？", "目标完成率 94.50% 是怎么算出来的？全年目标 80000，还差多少能完成目标？", "加权平均单价 1219.35 与产品平均单价 2000 哪个大？为什么两者不一样？各用一句话说出它们的含义。"], "answers": ["`华东销售额 = CALCULATE([总销售额], 客户[地区] = \"华东\")`，预期结果 29600。华南销售额 28000（O002 9000 + O005 3000 + O008 6000 + O012 10000）。", "因为利润 = 数量 ×（单价 − 成本），每行单价成本不同，必须逐行算再汇总。必须用 SUMX：`总利润 = SUMX(订单, 订单[数量] * (RELATED(产品[单价]) - RELATED(产品[成本])))`，预期结果 22770。", "`高价值订单笔数 = COUNTROWS(FILTER(订单, 订单[金额] > 8000))`，4 笔；合计金额 `= SUMX(FILTER(订单, 订单[金额] > 8000), 订单[金额])`，44000。", "因为分母要去掉产品筛选，算全表总计。不加 ALL 时，在电脑行里分母也被筛成 40000，占比变成 40000 / 40000 = 100%，是错的。", "75600 / 80000 = 94.50%。还差 80000 − 75600 = 4400。", "产品平均单价 2000 大。2000 是 5 种产品单价的简单平均（(5000+3000+300+200+1500)/5）；1219.35 是按实际销量加权的平均单价（75600 / 62），耳机、键盘这类低价产品卖得多，把加权平均拉低了。"], "versions": "Excel 2016／2019／2021／365（需启用 Power Pivot 加载项；部分家庭版无此功能）", "file": "示例-Power-Pivot-数据模型与DAX.xlsx"}, {"id": "powerpivot-dax-04-time-intelligence", "group": "powerpivot-dax", "column": "C10", "level2": "C10-L2-4", "title": "时间智能：日期表、DATESYTD、TOTALYTD、SAMEPERIODLASTYEAR、DATEADD 与同比环比", "level": "高级", "body": "### 2.1 为什么必须建日期表\n\n时间智能函数（TOTALYTD、SAMEPERIODLASTYEAR、DATEADD）不是直接算订单表的日期，而是先在日期表上平移日期、再去订单表取值。如果没有日期表，会出现三个问题：\n\n1. 没有订单的月份直接消失：订单表只有 2025-01、02、03、06 和 2026-01、02、03 有记录，2025-04、05 没有订单；按订单日期分组，4 月和 5 月根本不出现，折线图会断掉。\n2. 去年同期对不上：SAMEPERIODLASTYEAR 要把 2026-03 平移到 2025-03，没有一张连续的日期表，平移没有落点。\n3. 年初至今算不全：TOTALYTD 要从 1 月 1 日累计到当前日期，订单表缺失的日期会让累计口径不稳定。\n\n日期表就是一张“日历”：从开始日期到结束日期，每日一行，有没有订单都有这一行。透视表按日期表的月分组，12 个月永远齐全，没有订单的月份显示空白而不是消失。\n\n### 2.2 日期表的 6 条要求\n\n按 Microsoft 官方文档，时间智能函数正常工作要求日期表满足：\n\n1. 日期列是日期类型，不能是文本。\n2. 日期值唯一，不能重复。\n3. 日期列没有空值。\n4. 日期连续，不能缺失任何一天（包括没有订单的日子）。\n5. 覆盖完整年份：开始日期与结束日期要落在完整年份的边界上（本例 2025-01-01 至 2026-03-31 覆盖 2025 全年与 2026 年一季度，2026 年只到 3 月 31 日，做全年对比时要注意口径，见 6 节）。\n6. 在 Power Pivot 里标记为日期表（选中日期表 → 设计 → 标记为日期表 → 选择日期列）。\n\n### 2.3 四个函数的分工\n\n| 函数 | 返回什么 | 典型用途 |\n|---|---|---|\n| DATESYTD | 年初至今的日期表 | 配 CALCULATE 自定义累计 |\n| TOTALYTD | 年初至今的表达式值 | 直接算累计销售额 |\n| SAMEPERIODLASTYEAR | 去年同期的日期表 | 配 CALCULATE 算去年同期 |\n| DATEADD | 平移指定间隔后的日期表 | 上月、去年同期、上一季度都能算 |\n\n记住一个等式：TOTALYTD 是 CALCULATE + DATESYTD 的简写，两者结果完全一样。DATEADD 是通用平移，SAMEPERIODLASTYEAR 是 DATEADD(日期, -1, YEAR) 的简写。", "steps": ["在 Power Pivot 窗口新建计算表“日期表”：点“新建表”或用 DAX 建表，公式见 5.1 节；生成后确认行数是 455 行（2025-01-01 至 2026-03-31）（待补图）。", "给日期表加三列计算列：年 `= YEAR(日期表[日期])`、季度 `= \"Q\" & FORMAT(日期表[日期], \"Q\")`、月 `= FORMAT(日期表[日期], \"yyyy-mm\")`（待补图）。", "建立关系：把日期表的日期拖到订单表的日期上，一对多（日期表 1 对订单表多）。", "标记为日期表：选中日期表 → 设计 → 标记为日期表 → 日期列选“日期” → 确定。没标记时时间智能函数可能返回空白（待补图）。", "在订单表新建度量值“年初至今销售额”：公式 `= TOTALYTD([总销售额], 日期表[日期])`。", "在订单表新建度量值“去年同期销售额”：公式 `= CALCULATE([总销售额], SAMEPERIODLASTYEAR(日期表[日期]))`。", "在订单表新建度量值“同比增长率”：公式 `= DIVIDE([总销售额] - [去年同期销售额], [去年同期销售额])`，格式选百分比。", "验证：透视表行拖日期表的月、值拖总销售额和去年同期销售额；2026-03 一行应显示 16000 与 4000，同比 300.00%（待补图）。"], "sections": [{"title": "2. 基础概念", "body": "### 2.1 为什么必须建日期表\n\n时间智能函数（TOTALYTD、SAMEPERIODLASTYEAR、DATEADD）不是直接算订单表的日期，而是先在日期表上平移日期、再去订单表取值。如果没有日期表，会出现三个问题：\n\n1. 没有订单的月份直接消失：订单表只有 2025-01、02、03、06 和 2026-01、02、03 有记录，2025-04、05 没有订单；按订单日期分组，4 月和 5 月根本不出现，折线图会断掉。\n2. 去年同期对不上：SAMEPERIODLASTYEAR 要把 2026-03 平移到 2025-03，没有一张连续的日期表，平移没有落点。\n3. 年初至今算不全：TOTALYTD 要从 1 月 1 日累计到当前日期，订单表缺失的日期会让累计口径不稳定。\n\n日期表就是一张“日历”：从开始日期到结束日期，每日一行，有没有订单都有这一行。透视表按日期表的月分组，12 个月永远齐全，没有订单的月份显示空白而不是消失。\n\n### 2.2 日期表的 6 条要求\n\n按 Microsoft 官方文档，时间智能函数正常工作要求日期表满足：\n\n1. 日期列是日期类型，不能是文本。\n2. 日期值唯一，不能重复。\n3. 日期列没有空值。\n4. 日期连续，不能缺失任何一天（包括没有订单的日子）。\n5. 覆盖完整年份：开始日期与结束日期要落在完整年份的边界上（本例 2025-01-01 至 2026-03-31 覆盖 2025 全年与 2026 年一季度，2026 年只到 3 月 31 日，做全年对比时要注意口径，见 6 节）。\n6. 在 Power Pivot 里标记为日期表（选中日期表 → 设计 → 标记为日期表 → 选择日期列）。\n\n### 2.3 四个函数的分工\n\n| 函数 | 返回什么 | 典型用途 |\n|---|---|---|\n| DATESYTD | 年初至今的日期表 | 配 CALCULATE 自定义累计 |\n| TOTALYTD | 年初至今的表达式值 | 直接算累计销售额 |\n| SAMEPERIODLASTYEAR | 去年同期的日期表 | 配 CALCULATE 算去年同期 |\n| DATEADD | 平移指定间隔后的日期表 | 上月、去年同期、上一季度都能算 |\n\n记住一个等式：TOTALYTD 是 CALCULATE + DATESYTD 的简写，两者结果完全一样。DATEADD 是通用平移，SAMEPERIODLASTYEAR 是 DATEADD(日期, -1, YEAR) 的简写。"}, {"title": "4. 图文示例", "body": "示例：月度销售额与去年同期对照表（文字版，透视表行是日期表的月）。\n\n| 月份 | 总销售额 | 去年同期销售额 | 同比增长率 |\n|---|---|---|---|\n| 2025-01 | 19000 | （无，空白） | （无，空白） |\n| 2025-02 | 3000 | （无，空白） | （无，空白） |\n| 2025-03 | 4000 | （无，空白） | （无，空白） |\n| 2025-06 | 5000 | （无，空白） | （无，空白） |\n| 2026-01 | 21000 | 19000 | 10.53% |\n| 2026-02 | 7600 | 3000 | 153.33% |\n| 2026-03 | 16000 | 4000 | 300.00% |\n\n2025 年的去年同期是空白，因为日期表从 2025-01-01 开始，2024 年没有日期，SAMEPERIODLASTYEAR 平移不到落点就返回空白——这是正常现象，不是公式错了（待补图）。"}], "source": "docs/powerpivot-dax/04-time-intelligence.md", "updated": "2026-11-10", "objectives": ["说出为什么必须建日期表，并列出日期表的 6 条要求", "用 CALENDAR 函数建一张从 2025-01-01 到 2026-03-31 的日期表（455 行），并加上年、季度、月三列", "用 TOTALYTD 和 DATESYTD 写出年初至今累计，并说出两者等价", "用 SAMEPERIODLASTYEAR 和 DATEADD 写出去年同期，并算出 2026 年一季度同比 71.54%", "写出同比度量值与环比度量值，并解释为什么 2026 年全年同比 43.87% 这个数会误导人"], "formulas": ["DAX 语法经 Microsoft 官方文档核对；输入表与预期结果经 Python 独立验算；未在 Excel 内执行验证。以下示例的输入表均为配套示例文件里的表。", "### 5.1 建日期表", "日期表 = CALENDAR(DATE(2025, 1, 1), DATE(2026, 3, 31))", "运行结果：生成一张只有一列（日期）的表，共 455 行，从 2025-01-01 到 2026-03-31，每日一行，无缺失。455 = 2025 年 365 天 + 2026 年 1 至 3 月 90 天（31+28+31）。", "给日期表加年、季度、月三列（计算列）：", "年 = YEAR(日期表[日期])", "季度 = \"Q\" & FORMAT(日期表[日期], \"Q\")", "月 = FORMAT(日期表[日期], \"yyyy-mm\")", "运行结果：2026-03-22 一行的年是 2026、季度是 Q1、月是 2026-03；2025-06-10 一行的年是 2025、季度是 Q2、月是 2025-06。", "### 5.2 TOTALYTD 与 DATESYTD：年初至今", "年初至今销售额 = TOTALYTD([总销售额], 日期表[日期])", "运行结果：筛选到 2026-03 时，年初至今销售额 = 44600（2026-01 的 21000 + 2026-02 的 7600 + 2026-03 的 16000）。筛选到 2026-02 时是 28600（21000+7600）；筛选到 2026-01 时是 21000。", "等价写法（两者结果完全一样，TOTALYTD 是简写）：", "年初至今销售额2 = CALCULATE([总销售额], DATESYTD(日期表[日期]))", "运行结果：筛选到 2026-03 时同样是 44600。需要再加其他筛选条件时用 DATESYTD 写法，例如只算华东的年初至今：`CALCULATE([总销售额], DATESYTD(日期表[日期]), 客户[地区] = \"华东\")`，筛选到 2026-03 时是 16600（O007 15000 + O010 1600）。", "### 5.3 SAMEPERIODLASTYEAR 与 DATEADD：去年同期", "去年同期销售额 = CALCULATE([总销售额], SAMEPERIODLASTYEAR(日期表[日期]))", "运行结果：筛选到 2026 年一季度（2026-01 至 2026-03）时，去年同期销售额 = 26000（2025-01 的 19000 + 2025-02 的 3000 + 2025-03 的 4000）。分月看：2026-01 对应 19000，2026-02 对应 3000，2026-03 对应 4000。", "等价写法（SAMEPERIODLASTYEAR 是 DATEADD 的简写）：", "去年同期销售额2 = CALCULATE([总销售额], DATEADD(日期表[日期], -1, YEAR))", "运行结果：与上一度量值完全相同，2026 年一季度同样是 26000。", "### 5.4 同比度量值", "同比增长率 = DIVIDE([总销售额] - [去年同期销售额], [去年同期销售额])", "运行结果（按月）：2026-01 同比 10.53%（(21000-19000)/19000）；2026-02 同比 153.33%（(7600-3000)/3000）；2026-03 同比 300.00%（(16000-4000)/4000）。2026 年一季度整体同比 71.54%（(44600-26000)/26000）。", "注意：同比的分母是去年同期，不能拿今年累计除以去年全年。2026 年一季度 44600 除以 2025 全年 31000 得 43.87%，这个数不是同比，是“今年一季度完成了去年全年的 43.87%”，两个口径不要混用。", "### 5.5 DATEADD 算环比：上月销售额", "上月销售额 = CALCULATE([总销售额], DATEADD(日期表[日期], -1, MONTH))", "运行结果：筛选到 2026-03 时，上月销售额 = 7600（2026-02 的销售额）；筛选到 2026-02 时，上月销售额 = 21000（2026-01 的销售额）。", "环比增长率 = DIVIDE([总销售额] - [上月销售额], [上月销售额])", "运行结果：2026-02 环比 -63.81%（(7600-21000)/21000）；2026-03 环比 110.53%（(16000-7600)/7600）。2026-01 的上月是 2025-12，2025-12 没有订单，上月销售额为空白，环比也是空白，这是正常的。"], "scenarios": [{"title": "场景：一季度经营分析会的同比表。", "body": "- 背景：2026 年 4 月初开一季度经营分析会，老板问：今年一季度比去年一季度增长多少？哪个月增长最快？3 月环比怎么样？\n- 做法：透视表行拖日期表的月，值拖总销售额、去年同期销售额、同比增长率、环比增长率四个度量值。\n- 结果：三个数直接报：一季度总销售额 44600，去年同期 26000，同比增长 71.54%；增长最快是 3 月，同比 300.00%（16000 对 4000）；3 月环比 110.53%（16000 对 2 月的 7600），2 月环比是 -63.81%（7600 对 1 月的 21000），说明 2 月是淡季、3 月强势反弹。\n- 容易踩的坑：不要拿 2026 年一季度的 44600 去比 2025 全年的 31000，得出的 43.87% 不是同比。同比必须是同期比同期：2026 年 1 至 3 月比 2025 年 1 至 3 月，才是 71.54%。日期表只到 2026-03-31，2026 年全年数据还没齐，全年同比现在算不了。"}], "pitfalls": [{"problem": "时间智能度量值返回空白", "cause": "日期表没有标记为日期表", "solution": "设计 → 标记为日期表 → 选择日期列"}, {"problem": "去年同期返回空白", "cause": "日期表开始太晚，去年同期没有日期落点", "solution": "日期表至少往前多覆盖一年；2025 年的去年同期空白是正常的"}, {"problem": "没有订单的月份直接消失", "cause": "按订单表的日期分组，而不是日期表的月分组", "solution": "透视表行拖日期表的月，不要拖订单表的日期"}, {"problem": "TOTALYTD 全年都是同一个数", "cause": "透视表没有放日期字段，筛选上下文是全年", "solution": "TOTALYTD 按当前筛选累计；要看逐月累计，把日期表的月拖到行"}, {"problem": "同比算出来是 43.87% 之类的怪数", "cause": "分母用了去年全年而不是去年同期", "solution": "分母用 SAMEPERIODLASTYEAR 或 DATEADD(-1, YEAR) 的去年同期销售额"}, {"problem": "DATEADD 报错“日期不连续”", "cause": "日期表缺了某些天", "solution": "检查日期表是否用 CALENDAR 生成、起止日期是否连续 455 行"}, {"problem": "季度列显示 Q1、Q2 但排序乱了", "cause": "季度是文本，按字母排序", "solution": "加一列季度序号（1 至 4）做排序依据，或用年月列排序"}, {"problem": "日期列是文本型，时间智能全错", "cause": "从 CSV 导入时日期被认成文本", "solution": "在 Power Query 或模型里把日期列类型改为日期，再重建关系"}], "exercises": ["日期表为什么必须建？说出没有日期表会出现的 3 个问题。", "用 CALENDAR 建日期表，起止日期是 2025-01-01 至 2026-03-31，这张表有多少行？写出算式。", "筛选到 2026-02 时，TOTALYTD 的年初至今销售额是多少？写出加法算式。", "写出度量值“去年同期销售额”的两种等价公式（SAMEPERIODLASTYEAR 版与 DATEADD 版），并报出 2026 年一季度的预期结果。", "2026-03 同比增长率是多少？环比增长率是多少？各写出算式。", "有人算出 2026 年同比是 43.87%，这个数错在哪里？正确的 2026 年一季度同比是多少？"], "answers": ["没有订单的月份会消失；去年同期对不上落点；年初至今累计口径不稳定。日期表保证每日一行、有没有订单都有这一行。", "455 行。算式：2025 年 365 天 + 2026 年 1 至 3 月 90 天（31+28+31）= 455。", "28600。算式：2026-01 的 21000 + 2026-02 的 7600 = 28600。", "`去年同期销售额 = CALCULATE([总销售额], SAMEPERIODLASTYEAR(日期表[日期]))`；等价写法 `= CALCULATE([总销售额], DATEADD(日期表[日期], -1, YEAR))`。2026 年一季度预期结果 26000。", "同比 300.00%，算式 (16000-4000)/4000；环比 110.53%，算式 (16000-7600)/7600。", "43.87% 是用 2026 年一季度 44600 除以 2025 全年 31000 得出的，不是同比。正确的 2026 年一季度同比是 71.54%，算式 (44600-26000)/26000，去年同期是 2025 年 1 至 3 月的 26000。"], "versions": "Excel 2016／2019／2021／365（需启用 Power Pivot 加载项；部分家庭版无此功能）", "file": "示例-Power-Pivot-数据模型与DAX.xlsx"}, {"id": "powerpivot-dax-05-advanced-dax-cases", "group": "powerpivot-dax", "column": "C10", "level2": "C10-L2-5", "title": "高级 DAX 与商业案例：排名、TOPN、动态度量值、销售仪表盘与库存周转", "level": "高级", "body": "### 2.1 组合的思路\n\n单个函数解决单个问题，组合解决真实问题。高价值订单利润要先筛（FILTER）再逐行算（SUMX）；排名要先定范围（ALL）再比大小（RANKX）；动态标题要先取当前筛选值（SELECTEDVALUE）再拼字符串。写高级 DAX 时先画三步：筛出哪些行、对每行算什么、最后怎么汇总。\n\n### 2.2 RANKX 与 TOPN 的区别\n\n- **RANKX**：给每一行一个名次。返回的是数字（1、2、3），适合放在透视表里当一列看。\n- **TOPN**：返回前 N 行组成的一张子表。返回的是表，不能直接当度量值，要配 SUMX 或 COUNTROWS 用，适合算“前 N 名合计”。\n\n两者都要注意并列：RANKX 默认并列同名次、下一名次跳号；TOPN 遇到并列边界时可能多返回一行（例如第 2 名和第 3 名同分，TOPN(2) 会返回 3 行），做“前 N 名合计”时要先检查边界有没有并列。\n\n### 2.3 动态标题与动态度量值\n\n- **动态标题**：一个度量值返回文本，标题引用它。切片器选华东，标题变成“华东地区销售额”；不选，标题是“全部地区销售额”。\n- **动态度量值**：一个切片器切换指标。参数表里放三行（销售额、利润、利润率），度量值用 SWITCH 判断当前选了哪一行，再返回对应的基础度量值。透视表的值只拖这一个动态度量值，切换切片器就换指标。", "steps": ["确认 01 至 04 篇的模型与度量值都在：总销售额、总利润、利润率、去年同期销售额、同比增长率（待补图）。", "在产品表新建度量值“产品销售额排名”：公式见 5.2 节；再在客户表新建“地区销售额排名”。", "在订单表新建度量值“前 2 产品销售额”：用 TOPN + SUMX，公式见 5.3 节。", "在订单表新建度量值“动态标题”：公式见 5.4 节；透视表标题栏引用这个度量值。", "新建参数表“指标选择”（三行：销售额、利润、利润率），不与任何表建关系；再建动态度量值“动态指标”，公式见 5.5 节。", "按 6 节做销售分析仪表盘：KPI 卡片 6 个、产品排名表、地区排名表、月度同比表各一张透视表，拼在一张工作表上。", "按 7 节做库存周转分析：库存表进模型、与产品表建关系，建周转率与周转天数两个度量值，输出周转表并标出滞销品。"], "sections": [{"title": "2. 基础概念", "body": "### 2.1 组合的思路\n\n单个函数解决单个问题，组合解决真实问题。高价值订单利润要先筛（FILTER）再逐行算（SUMX）；排名要先定范围（ALL）再比大小（RANKX）；动态标题要先取当前筛选值（SELECTEDVALUE）再拼字符串。写高级 DAX 时先画三步：筛出哪些行、对每行算什么、最后怎么汇总。\n\n### 2.2 RANKX 与 TOPN 的区别\n\n- **RANKX**：给每一行一个名次。返回的是数字（1、2、3），适合放在透视表里当一列看。\n- **TOPN**：返回前 N 行组成的一张子表。返回的是表，不能直接当度量值，要配 SUMX 或 COUNTROWS 用，适合算“前 N 名合计”。\n\n两者都要注意并列：RANKX 默认并列同名次、下一名次跳号；TOPN 遇到并列边界时可能多返回一行（例如第 2 名和第 3 名同分，TOPN(2) 会返回 3 行），做“前 N 名合计”时要先检查边界有没有并列。\n\n### 2.3 动态标题与动态度量值\n\n- **动态标题**：一个度量值返回文本，标题引用它。切片器选华东，标题变成“华东地区销售额”；不选，标题是“全部地区销售额”。\n- **动态度量值**：一个切片器切换指标。参数表里放三行（销售额、利润、利润率），度量值用 SWITCH 判断当前选了哪一行，再返回对应的基础度量值。透视表的值只拖这一个动态度量值，切换切片器就换指标。"}, {"title": "4. 图文示例", "body": "示例：销售仪表盘的布局（文字版）。\n\n- 顶部一排 KPI 卡片：总销售额 75600、总利润 22770、利润率 30.12%、订单笔数 12、客单价 6300、2026 年一季度同比 71.54%。\n- 左下产品排名表：电脑第 1 名 40000、手机第 2 名 15000、耳机与显示器并列第 3 名 9000、键盘第 5 名 2600。\n- 右下地区排名表：华东第 1 名 29600、华南第 2 名 28000、华西第 3 名 11000、华北第 4 名 7000。\n- 底部月度同比表：2026-01 同比 10.53%、2026-02 同比 153.33%、2026-03 同比 300.00%（待补图）。"}], "source": "docs/powerpivot-dax/05-advanced-dax-cases.md", "updated": "2026-11-10", "objectives": ["用 SUMX + FILTER 组合算出高价值订单利润 11100，并说出为什么不能只用 SUM", "用 RANKX 给产品和地区排名，并解释耳机与显示器并列第 3、键盘直接是第 5 的原因", "用 TOPN 取出销售额前 2 的产品（电脑 40000、手机 15000）与前 3 的地区", "写出动态标题度量值，让标题随切片器选择的地区自动变化", "用 SWITCH + 参数表实现动态度量值（一个切片器切换销售额、利润、利润率）", "独立完成两个商业案例：销售分析仪表盘（KPI 卡片 + 排名 + 同比）与库存周转分析（周转率 + 周转天数 + 滞销判断）"], "formulas": ["DAX 语法经 Microsoft 官方文档核对；输入表与预期结果经 Python 独立验算；未在 Excel 内执行验证。以下示例的输入表均为配套示例文件里的表。", "### 5.1 SUMX + FILTER 组合：高价值订单利润", "先筛出金额大于 8000 的订单，再逐行算利润、汇总。", "高价值订单利润 = SUMX(FILTER(订单, 订单[金额] > 8000), 订单[数量] * (RELATED(产品[单价]) - RELATED(产品[成本])))", "运行结果：高价值订单利润 = 11100。输入是 4 笔高价值订单：O001 利润 2400、O002 利润 2700、O007 利润 3600、O012 利润 2400；2400+2700+3600+2400 = 11100，占总利润 22770 的 48.75%（11100 / 22770）。", "为什么不能只用 SUM：利润没有现成的列，SUM 只能对已有列求和；利润 = 数量 ×（单价 − 成本）是逐行算出来的，必须用 SUMX。FILTER 先筛、SUMX 再算，顺序不能反。", "### 5.2 RANKX 排名：产品与地区", "产品销售额排名 = RANKX(ALL(产品[产品名称]), [总销售额], , DESC)", "运行结果（透视表行是产品名称）：", "| 产品名称 | 总销售额 | 排名 |", "|---|---|---|", "| 电脑 | 40000 | 1 |", "| 手机 | 15000 | 2 |", "| 耳机 | 9000 | 3 |", "| 显示器 | 9000 | 3 |", "| 键盘 | 2600 | 5 |", "耳机与显示器都是 9000，并列第 3；下一名次直接跳到第 5，没有第 4 名。这是 RANKX 默认的并列规则（ties 参数默认跳号）。如果要并列后不跳号，把 ties 参数写成 DENSE：第 5 名会变成第 4 名。", "地区销售额排名 = RANKX(ALL(客户[地区]), [总销售额], , DESC)", "运行结果（透视表行是地区）：华东 29600 第 1 名、华南 28000 第 2 名、华西 11000 第 3 名、华北 7000 第 4 名。没有并列，名次连续。", "注意：RANKX 的第一个参数必须用 ALL 去掉筛选，否则透视表每行只剩自己，排名永远是 1。", "### 5.3 TOPN：前 N 名合计", "前2产品销售额 = SUMX(TOPN(2, ALL(产品[产品名称]), [总销售额], DESC), [总销售额])", "运行结果：前 2 产品销售额 = 55000（电脑 40000 + 手机 15000）。前 2 名占总销售额的 72.75%（55000 / 75600）。", "前3地区销售额 = SUMX(TOPN(3, ALL(客户[地区]), [总销售额], DESC), [总销售额])", "运行结果：前 3 地区销售额 = 68600（华东 29600 + 华南 28000 + 华西 11000）。前 3 名占总销售额的 90.74%（68600 / 75600）。", "注意：TOPN 不响应切片器筛选（第一个参数用了 ALL），要做“所选年份的前 N 名”时，把 ALL 换成 ALLSELECTED。", "### 5.4 动态标题", "动态标题 = \"销售额 - \" & IF(HASONEVALUE(客户[地区]), VALUES(客户[地区]), \"全部地区\")", "运行结果：切片器选华东时，动态标题 = \"销售额 - 华东\"；不选任何地区时，动态标题 = \"销售额 - 全部地区\"。HASONEVALUE 判断当前筛选是不是唯一值，VALUES 取出这个唯一值。", "进阶版：标题里带上数字。", "动态标题含数字 = \"销售额 - \" & IF(HASONEVALUE(客户[地区]), VALUES(客户[地区]), \"全部地区\") & \"：\" & FORMAT([总销售额], \"#,##0\")", "运行结果：选华东时显示“销售额 - 华东：29,600”；不选时显示“销售额 - 全部地区：75,600”。", "### 5.5 动态度量值：SWITCH + 参数表", "先建一张不建关系的普通表“指标选择”，一列“指标”，三行：销售额、利润、利润率。再写一个度量值：", "动态指标 = SWITCH(SELECTEDVALUE(指标选择[指标], \"销售额\"),", "\"销售额\", [总销售额],", "\"利润\", [总利润],", "\"利润率\", [利润率],", "[总销售额])", "运行结果：切片器选“利润”时，动态指标 = 22770；选“利润率”时，动态指标 = 30.12%；选“销售额”或不选时，动态指标 = 75600。透视表的值只拖这一个度量值，切换切片器就换指标，不用做三张透视表。"], "scenarios": [{"title": "背景：销售总监每月要一页仪表盘：KPI 卡片、产品排名、地区排名、月度同比，四块内容一张表讲清。", "body": "输入表：订单表 12 行、产品表 5 行、客户表 4 行、日期表 455 行（配套示例文件）。\n\n步骤：\n\n1. KPI 卡片区：6 个度量值各占一个单元格（用透视表或直接用 CUBEVALUE 引用度量值）。\n2. 产品排名表：透视表行拖产品名称，值拖总销售额与产品销售额排名。\n3. 地区排名表：透视表行拖地区，值拖总销售额与地区销售额排名。\n4. 月度同比表：透视表行拖日期表的月，值拖总销售额、去年同期销售额、同比增长率。\n\n预期结果：\n\nKPI 卡片：\n\n| 指标 | 结果 |\n|---|---|\n| 总销售额 | 75600 |\n| 总利润 | 22770 |\n| 利润率 | 30.12% |\n| 订单笔数 | 12 |\n| 客单价 | 6300 |\n| 2026 年一季度同比 | 71.54% |\n\n产品排名：电脑 40000 第 1 名、手机 15000 第 2 名、耳机 9000 并列第 3 名、显示器 9000 并列第 3 名、键盘 2600 第 5 名。\n\n地区排名：华东 29600 第 1 名、华南 28000 第 2 名、华西 11000 第 3 名、华北 7000 第 4 名。\n\n月度同比：2026-01 同比 10.53%、2026-02 同比 153.33%、2026-03 同比 300.00%。\n\n结论：电脑一个产品占 52.91%，华东一个地区占 39.15%，前 2 产品合计 55000 占 72.75%；增长主要靠 3 月（同比 300.00%），2 月是淡季（环比 -63.81%）。"}], "pitfalls": [{"problem": "RANKX 每行排名都是 1", "cause": "第一个参数没用 ALL 去掉筛选", "solution": "RANKX(ALL(产品[产品名称]), [总销售额], , DESC)，先去掉筛选再排名"}, {"problem": "并列后名次跳号觉得是错", "cause": "RANKX 默认跳号规则", "solution": "这是默认行为；要连续名次用 DENSE 参数"}, {"problem": "TOPN 返回的行比 N 多", "cause": "边界值并列，TOPN 把并列行都返回", "solution": "检查边界值；做合计时接受多行，或改用 RANKX 小于等于 N 的 FILTER"}, {"problem": "TOPN 不随切片器变化", "cause": "第一个参数用了 ALL", "solution": "要响应切片器时把 ALL 换成 ALLSELECTED"}, {"problem": "动态标题一直显示“全部地区”", "cause": "切片器选的是多值，或字段拖错", "solution": "HASONEVALUE 要求唯一值；多选时显示默认值，可改用 CONCATENATEX 拼接多个值"}, {"problem": "动态度量值切换后数字不变", "cause": "参数表与模型建了关系，或 SELECTEDVALUE 取不到值", "solution": "参数表不要建关系；检查切片器字段是不是参数表的指标列"}, {"problem": "SUMX + FILTER 算得很慢", "cause": "FILTER 在百万行上逐行筛", "solution": "能用 CALCULATE 简单条件先筛就用 CALCULATE；FILTER 只留给复杂条件"}, {"problem": "仪表盘刷新后数字全变空白", "cause": "关系被误删，或日期表标记丢了", "solution": "检查关系视图三条线是否还在；重新标记日期表"}], "exercises": ["高价值订单利润 11100 是怎么算出来的？写出 SUMX + FILTER 的公式，并列出 4 笔订单的利润。", "产品排名里耳机与显示器都是第 3 名，键盘是第几名？为什么没有第 4 名？要让名次连续（键盘变第 4 名）该改哪个参数？", "前 2 产品销售额是多少？占总销售额的百分比是多少？写出算式。", "切片器选华南时，动态标题度量值显示什么？不选任何地区时显示什么？", "库存周转分析里，哪个产品周转最慢？周转率与周转天数各是多少？金额口径的整体周转天数是多少？", "动态度量值里参数表“指标选择”为什么不能与订单表建关系？如果建了关系会发生什么？"], "answers": ["公式：`高价值订单利润 = SUMX(FILTER(订单, 订单[金额] > 8000), 订单[数量] * (RELATED(产品[单价]) - RELATED(产品[成本])))`。4 笔利润：O001 2400、O002 2700、O007 3600、O012 2400，合计 11100。", "键盘是第 5 名。因为耳机与显示器并列第 3，RANKX 默认跳号，下一名次直接是第 5，没有第 4。改 ties 参数为 DENSE，键盘变第 4 名。", "前 2 产品销售额 55000（电脑 40000 + 手机 15000），占比 72.75%（55000 / 75600）。", "选华南时显示“销售额 - 华南”；不选时显示“销售额 - 全部地区”。", "手机周转最慢，周转率 0.40 次，周转天数 912.5 天。金额口径整体周转天数 703.9 天。", "因为参数表只是用来存用户选择的，不参与筛选事实表。建了关系会把选择当成筛选条件传给订单表，导致度量值被错误筛选、数字不对或返回空白。"], "versions": "Excel 2016／2019／2021／365（需启用 Power Pivot 加载项；部分家庭版无此功能）", "file": "示例-Power-Pivot-数据模型与DAX.xlsx"}, {"id": "vba-05-advanced", "group": "vba", "column": "C11", "level2": "C11-L2-5", "title": "VBA 进阶：用户窗体、类模块、加载宏与错误处理进阶", "level": "高级", "body": "### 1.1 用户窗体（UserForm）\n\nUserForm 是 VBA 自带的对话框设计器：在 VBE 中「插入 → 用户窗体」，拖入文本框（TextBox）、标签（Label）、下拉框（ComboBox）、按钮（CommandButton）等控件，双击控件写事件代码。窗体本身是一个对象，有 `Show`、`Hide`、`Unload` 三个基本动作：\n\n- `Show`：显示窗体。默认模态（vbModal，值为 1）：用户必须先关闭窗体才能操作工作表，`Show` 之后的代码暂停执行，直到窗体关闭或隐藏。\n- `Show vbModeless`（值为 0）：非模态：用户可以一边开着窗体一边操作工作表，`Show` 之后的代码立即继续执行。\n- `Hide`：隐藏窗体但保留其中的输入值；`Unload Me`：彻底卸载，输入值丢失。\n\n窗体有两个最常用的事件：`UserForm_Initialize`（窗体第一次加载时执行一次，适合填下拉框初始值）和各控件的 `Click` / `Change` 事件。窗体代码写在窗体自己的代码窗口里（双击窗体打开），而「显示窗体」的那行 `frmEntry.Show` 通常写在标准模块里。\n\n### 1.2 类模块（Class Module）\n\n类模块是自定义对象的蓝图：在 VBE 中「插入 → 类模块」，把一类事物的数据（属性）与行为（方法）写在一起。标准模块里的变量是散的，类模块把它们收拢：\n\n- 属性用 `Property Get`（读）与 `Property Let`（写）定义，写在属性过程里可以顺带做校验（例如工资不能为负）。\n- 方法就是写在类里的 `Sub` / `Function`。\n- 使用时先 `Dim emp As New clsEmployee`（或 `Set emp = New clsEmployee`），再 `emp.Name = \"张三\"`。\n\n类模块的文件扩展名是 .cls，标准模块是 .bas；两者导入方式相同（VBE「文件 → 导入文件」），不要把类代码粘贴进标准模块，否则 `Property Get` 等写法会编译报错。\n\n### 1.3 加载宏（.xlam）\n\n加载宏是「保存为 .xlam 格式、启动时自动加载的工作簿」：代码随 Excel 启动而可用，工作表界面被隐藏，函数与宏可以在任何打开的工作簿里调用。制作步骤是先在普通工作簿里写好并调通代码，再「文件 → 另存为 → 保存类型选 Excel 加载宏 (*.xlam)」，Excel 会默认保存到加载宏目录；然后「文件 → 选项 → 加载项 → 管理选 Excel 加载项 → 转到」，勾选你的加载宏完成安装。安装后加载宏每次启动 Excel 自动加载，不用再打开源文件。\n\n与 .xlsm 的区别：.xlsm 是「带宏的工作簿」，代码只在该文件打开时可用；.xlam 是「随 Excel 启动的工具库」，代码对所有工作簿可用，但它的工作表不可见，不适合存放业务数据。调试期保留一份 .xlsm 源文件，改好后再另存为 .xlam（直接改 .xlam 里的代码容易因保存路径问题丢改动）。\n\n### 1.4 错误处理进阶：Err 对象与集中处理\n\nVBA 运行出错时，内建的 `Err` 对象会被填入当次错误的信息（Microsoft Learn 的 Err 对象文档）：\n\n| 成员 | 说明 |\n|------|------|\n| `Err.Number` | 错误号，如 13（类型不匹配）、9（下标越界）、424（需要对象）、91（对象变量未设置）、1004（Excel 内部错误） |\n| `Err.Description` | 错误描述文字，如\"类型不匹配\" |\n| `Err.Source` | 出错的源（过程名或对象名，可自行写入） |\n| `Err.Clear` | 清空错误状态（Number 归 0） |\n| `Err.Raise` | 主动抛出一个错误；系统错误号保留 0–512，自定义错误号用 512 以上 |\n\n进阶做法是「集中处理」：每个业务过程只写一行 `On Error GoTo ErrHandler`，出错后统一跳到文末的错误处理段；处理段按 `Err.Number` 分情况（可恢复的记日志继续、不可恢复的提示后退出），并把「时间、过程名、错误号、错误描述」写进日志工作表或文本文件。日志是交付工具后唯一的排障依据：用户只说\"报错了\"没法定位，有日志才能看到是哪一行、哪个错误号。\n\n`On Error Resume Next` 只适合「可预期的单个操作」（如判断某工作表是否存在、关闭一个可能没打开的文件），用完必须立即检查 `Err.Number` 并用 `On Error GoTo 0` 恢复；把它盖在整段业务代码上会吞掉所有错误，是最常见的坏习惯。", "steps": ["在 VBE 中点击「插入 → 用户窗体」，在属性窗口（F4）把窗体名称改为 `frmEntry`、标题（Caption）改为\"报销录入\"。", "从工具箱拖入控件：2 个标签（姓名、金额）、1 个文本框（txtName）、1 个文本框（txtAmount）、1 个下拉框（cmbType）、2 个按钮（cmdOK 标题\"确定\"、cmdCancel 标题\"取消\"）。", "双击窗体空白处写 `UserForm_Initialize`：往 cmbType 里加\"差旅\"、\"办公\"、\"招待\"三项，默认选中第一项。", "双击 cmdOK 写 `cmdOK_Click`：校验姓名非空、金额是数字且大于 0；校验通过后把一行数据写到\"报销\"表末尾，再 `Unload Me`。", "双击 cmdCancel 写 `cmdCancel_Click`：只执行 `Unload Me`，不写数据。", "在标准模块写 `ShowEntryForm`：`frmEntry.Show`（模态，录入完成前不让用户碰工作表）。", "按 F5 运行 `ShowEntryForm`，在窗体里输一行数据，检查\"报销\"表是否多了一行。", "在 VBE 中点击「插入 → 类模块」，在属性窗口把名称改为 `clsEmployee`。", "在类模块顶部声明私有字段：`Private pName As String`、`Private pSalary As Double`。", "为每个字段写一对 `Property Get` / `Property Let`；在 `Salary` 的 `Let` 里加校验：小于 0 时用 `Err.Raise 513, , \"工资不能为负数\"` 拒绝写入。", "写一个方法 `AnnualPay`：返回 `pSalary * 12`（年薪，不含奖金）。", "在标准模块写测试过程：建 3 个 `clsEmployee` 对象放进 `Collection`，循环累加 `Salary` 求合计与平均。", "按 F5 运行测试过程，用立即窗口（Ctrl+G）核对合计与平均值。", "新建一个工作簿，把要共享的过程（如本篇第 4 节的错误处理模块、第 6 节的工具过程）放进标准模块，先在 .xlsm 里调通。", "在 VBE「调试 → 编译」确认无编译错误；把 `ThisWorkbook` 的 `IsAddin` 属性记在心里（另存为 .xlam 后它自动变为 True，工作表随之隐藏）。", "回到 Excel，「文件 → 另存为 → 保存类型选 Excel 加载宏 (*.xlam)」，起个名字（如 MyTools.xlam），保存在默认加载宏目录。", "「文件 → 选项 → 加载项 → 管理选 Excel 加载项 → 转到」，勾选 MyTools，点确定。", "关闭并重新打开 Excel，确认加载宏已自动加载（VBE 工程窗口里能看到它）。", "新建一个空白工作簿，运行加载宏里的任一公开过程，确认跨工作簿可用。", "新建标准模块 `modErrorHandler`，写 `LogError`（把时间、过程名、错误号、错误描述追加写到同目录 `ErrorLog.txt`）与 `HandleError`（按错误号分支：9/13/1004 提示用户检查数据，其余提示联系管理员）。", "在每个业务过程顶部加 `On Error GoTo ErrHandler`，正常出口前加 `Exit Sub`，文末加 `ErrHandler:` 标签段，段内调 `HandleError \"过程名\"`。", "在 `ErrHandler` 段内恢复现场：`Application.ScreenUpdating = True`、`Application.EnableEvents = True`（业务过程里关掉的开关必须在这里开回来，否则出错一次后 Excel 就\"假死\"了）。", "故意制造一次错误（如让代码打开不存在的工作表），运行后打开 `ErrorLog.txt`，确认日志里有一行带正确错误号的记录。"], "sections": [{"title": "1. 基础概念", "body": "### 1.1 用户窗体（UserForm）\n\nUserForm 是 VBA 自带的对话框设计器：在 VBE 中「插入 → 用户窗体」，拖入文本框（TextBox）、标签（Label）、下拉框（ComboBox）、按钮（CommandButton）等控件，双击控件写事件代码。窗体本身是一个对象，有 `Show`、`Hide`、`Unload` 三个基本动作：\n\n- `Show`：显示窗体。默认模态（vbModal，值为 1）：用户必须先关闭窗体才能操作工作表，`Show` 之后的代码暂停执行，直到窗体关闭或隐藏。\n- `Show vbModeless`（值为 0）：非模态：用户可以一边开着窗体一边操作工作表，`Show` 之后的代码立即继续执行。\n- `Hide`：隐藏窗体但保留其中的输入值；`Unload Me`：彻底卸载，输入值丢失。\n\n窗体有两个最常用的事件：`UserForm_Initialize`（窗体第一次加载时执行一次，适合填下拉框初始值）和各控件的 `Click` / `Change` 事件。窗体代码写在窗体自己的代码窗口里（双击窗体打开），而「显示窗体」的那行 `frmEntry.Show` 通常写在标准模块里。\n\n### 1.2 类模块（Class Module）\n\n类模块是自定义对象的蓝图：在 VBE 中「插入 → 类模块」，把一类事物的数据（属性）与行为（方法）写在一起。标准模块里的变量是散的，类模块把它们收拢：\n\n- 属性用 `Property Get`（读）与 `Property Let`（写）定义，写在属性过程里可以顺带做校验（例如工资不能为负）。\n- 方法就是写在类里的 `Sub` / `Function`。\n- 使用时先 `Dim emp As New clsEmployee`（或 `Set emp = New clsEmployee`），再 `emp.Name = \"张三\"`。\n\n类模块的文件扩展名是 .cls，标准模块是 .bas；两者导入方式相同（VBE「文件 → 导入文件」），不要把类代码粘贴进标准模块，否则 `Property Get` 等写法会编译报错。\n\n### 1.3 加载宏（.xlam）\n\n加载宏是「保存为 .xlam 格式、启动时自动加载的工作簿」：代码随 Excel 启动而可用，工作表界面被隐藏，函数与宏可以在任何打开的工作簿里调用。制作步骤是先在普通工作簿里写好并调通代码，再「文件 → 另存为 → 保存类型选 Excel 加载宏 (*.xlam)」，Excel 会默认保存到加载宏目录；然后「文件 → 选项 → 加载项 → 管理选 Excel 加载项 → 转到」，勾选你的加载宏完成安装。安装后加载宏每次启动 Excel 自动加载，不用再打开源文件。\n\n与 .xlsm 的区别：.xlsm 是「带宏的工作簿」，代码只在该文件打开时可用；.xlam 是「随 Excel 启动的工具库」，代码对所有工作簿可用，但它的工作表不可见，不适合存放业务数据。调试期保留一份 .xlsm 源文件，改好后再另存为 .xlam（直接改 .xlam 里的代码容易因保存路径问题丢改动）。\n\n### 1.4 错误处理进阶：Err 对象与集中处理\n\nVBA 运行出错时，内建的 `Err` 对象会被填入当次错误的信息（Microsoft Learn 的 Err 对象文档）：\n\n| 成员 | 说明 |\n|------|------|\n| `Err.Number` | 错误号，如 13（类型不匹配）、9（下标越界）、424（需要对象）、91（对象变量未设置）、1004（Excel 内部错误） |\n| `Err.Description` | 错误描述文字，如\"类型不匹配\" |\n| `Err.Source` | 出错的源（过程名或对象名，可自行写入） |\n| `Err.Clear` | 清空错误状态（Number 归 0） |\n| `Err.Raise` | 主动抛出一个错误；系统错误号保留 0–512，自定义错误号用 512 以上 |\n\n进阶做法是「集中处理」：每个业务过程只写一行 `On Error GoTo ErrHandler`，出错后统一跳到文末的错误处理段；处理段按 `Err.Number` 分情况（可恢复的记日志继续、不可恢复的提示后退出），并把「时间、过程名、错误号、错误描述」写进日志工作表或文本文件。日志是交付工具后唯一的排障依据：用户只说\"报错了\"没法定位，有日志才能看到是哪一行、哪个错误号。\n\n`On Error Resume Next` 只适合「可预期的单个操作」（如判断某工作表是否存在、关闭一个可能没打开的文件），用完必须立即检查 `Err.Number` 并用 `On Error GoTo 0` 恢复；把它盖在整段业务代码上会吞掉所有错误，是最常见的坏习惯。"}, {"title": "3. 图文示例", "body": "### 示例 1：报销录入窗体（控件一览）\n\n窗体 `frmEntry`（待补图）：标题\"报销录入\"；第一行标签\"姓名\"加文本框 txtName；第二行标签\"金额\"加文本框 txtAmount；第三行标签\"类型\"加下拉框 cmbType（三项：差旅、办公、招待）；底部两个按钮 cmdOK（确定）、cmdCancel（取消）。\n\n文字示例：用户打开窗体 → 姓名输\"张三\"、金额输\"1200\"、类型选\"差旅\" → 点确定 → \"报销\"表末尾新增一行（张三、1200、差旅），窗体关闭；金额输\"abc\"点确定 → 弹出\"金额必须是大于 0 的数字\"，窗体不关闭、不写数据。\n\n### 示例 2：员工类与集合（3 名员工）\n\n| 姓名 | 月薪 | 年薪（月薪 × 12） |\n|------|------|-------------------|\n| 张三 | 8000 | 96000 |\n| 李四 | 9500 | 114000 |\n| 王五 | 12000 | 144000 |\n| 合计 | 29500 | 354000 |\n| 平均月薪 | 9833.33 | — |\n\n运行结果：合计月薪 → 29500；平均月薪 → 9833.33（29500 ÷ 3，四舍五入到 2 位小数）；王五的年薪 → 144000。\n\n### 示例 3：集中错误处理跑一次\n\n故意让代码打开不存在的工作簿 `Workbooks.Open(\"D:\\不存在.xlsx\")`，错误号 → 1004；`HandleError` 提示\"文件不存在或路径错误，请检查路径后重试\"，并在 `ErrorLog.txt` 里记一行：`2026-11-10 09:00:00 | OpenReport | 1004 | 文件不存在或路径错误`（时间以实际运行为准）。"}], "source": "docs/vba/05-advanced.md", "updated": "2026-11-10", "objectives": ["用 UserForm 搭建带文本框、下拉框与按钮的录入窗体，并区分模态与非模态", "用类模块封装数据与行为（如员工对象），并用集合管理多个对象", "把工具打包成 .xlam 加载宏并安装到 Excel，随任何工作簿启动", "用 Err 对象写集中错误处理：分错误号处理、记日志、恢复现场"], "formulas": ["### 4.1 UserForm：录入窗体代码", "' ---- 以下代码粘贴到窗体 frmEntry 的代码窗口（双击窗体打开）----", "Option Explicit", "Private Sub UserForm_Initialize()", "' 窗体第一次加载时执行一次：填下拉框初始值", "With Me.cmbType", ".AddItem \"差旅\"", ".AddItem \"办公\"", ".AddItem \"招待\"", ".ListIndex = 0   ' 默认选中第一项", "End With", "' 注意：不要在这里写 txtName.SetFocus（窗体还没显示，设焦点会报错）；", "' 想让姓名框默认获得焦点，把 txtName 的 TabIndex 属性设为 0 即可", "End Sub", "Private Sub cmdOK_Click()", "Dim ws As Worksheet", "Dim nextRow As Long", "Dim amount As Double", "' --- 校验 ---", "If Trim(Me.txtName.Text) = \"\" Then", "MsgBox \"姓名不能为空\", vbExclamation", "Me.txtName.SetFocus", "Exit Sub", "End If", "If Not IsNumeric(Me.txtAmount.Text) Then", "MsgBox \"金额必须是数字\", vbExclamation", "Me.txtAmount.SetFocus", "Exit Sub", "End If", "amount = CDbl(Me.txtAmount.Text)", "If amount <= 0 Then", "MsgBox \"金额必须大于 0\", vbExclamation", "Me.txtAmount.SetFocus", "Exit Sub", "End If", "' --- 写入 ---", "Set ws = ThisWorkbook.Worksheets(\"报销\")", "nextRow = ws.Cells(ws.Rows.Count, 1).End(xlUp).Row + 1", "ws.Cells(nextRow, 1).Value = Trim(Me.txtName.Text)", "ws.Cells(nextRow, 2).Value = amount", "ws.Cells(nextRow, 3).Value = Me.cmbType.Value", "ws.Cells(nextRow, 4).Value = Date", "Unload Me   ' 彻底卸载，输入值清空", "End Sub", "Private Sub cmdCancel_Click()", "Unload Me   ' 不写数据，直接关闭", "End Sub", "运行结果：姓名\"张三\"、金额 1200、类型\"差旅\" → \"报销\"表末尾新增一行（张三、1200、差旅、当天日期）；金额输\"abc\" → 弹出\"金额必须是数字\"，不写数据。", "' ---- 以下代码放在标准模块（如 modMain），用来显示窗体 ----", "Option Explicit", "Sub ShowEntryForm()", "frmEntry.Show   ' 默认模态（vbModal）：关闭窗体前不能操作工作表", "' frmEntry.Show vbModeless   ' 改成这一行则为非模态：可一边开窗体一边操作表格", "End Sub", "运行结果：`frmEntry.Show` → 弹出模态窗体，`Show` 之后的代码暂停，直到窗体关闭；改成 `vbModeless` 后代码立即继续执行。", "### 4.2 类模块：员工类", "' ---- 以下代码放在类模块 clsEmployee（插入 → 类模块，名称改为 clsEmployee）----", "' ---- 注意：类模块代码不能粘贴进标准模块，否则编译报错 ----", "Option Explicit", "Private pName As String", "Private pSalary As Double", "Public Property Get Name() As String", "Name = pName", "End Property", "Public Property Let Name(ByVal v As String)", "pName = Trim(v)", "End Property", "Public Property Get Salary() As Double", "Salary = pSalary", "End Property", "Public Property Let Salary(ByVal v As Double)", "If v < 0 Then", "Err.Raise 513, \"clsEmployee\", \"工资不能为负数\"   ' 自定义错误号用 512 以上", "End If", "pSalary = v", "End Property", "Public Function AnnualPay() As Double", "AnnualPay = pSalary * 12", "End Function", "' ---- 以下代码放在标准模块，测试类模块 ----", "Option Explicit", "Sub TestEmployeeClass()", "Dim staff As Collection", "Dim emp As clsEmployee", "Dim total As Double", "Dim i As Long", "Set staff = New Collection", "Set emp = New clsEmployee", "emp.Name = \"张三\": emp.Salary = 8000", "staff.Add emp", "Set emp = New clsEmployee", "emp.Name = \"李四\": emp.Salary = 9500", "staff.Add emp", "Set emp = New clsEmployee", "emp.Name = \"王五\": emp.Salary = 12000", "staff.Add emp", "total = 0", "For i = 1 To staff.Count", "total = total + staff(i).Salary", "Debug.Print staff(i).Name & \" 年薪 \" & staff(i).AnnualPay()", "Next i", "Debug.Print \"合计月薪 \" & total              ' 29500", "Debug.Print \"平均月薪 \" & Round(total / staff.Count, 2)  ' 9833.33", "End Sub", "运行结果：立即窗口逐行输出\"张三 年薪 96000\"、\"李四 年薪 114000\"、\"王五 年薪 144000\"，最后两行 → 合计月薪 29500、平均月薪 9833.33。", "### 4.3 加载宏：随启动可用的工具库", "' ---- 以下代码放在标准模块 modAddIn，调通后随工作簿另存为 .xlam ----", "Option Explicit", "' 加载宏每次随 Excel 启动加载时自动执行一次（.xlam 里用 Auto_Open）", "Sub Auto_Open()", "MsgBox \"MyTools 加载宏已加载：工具在「加载宏」菜单中可用\", vbInformation", "End Sub", "' 示例工具过程：给当前选中区域加外边框（任何工作簿里都能调）", "Sub AddOuterBorder()", "If TypeName(Selection) <> \"Range\" Then", "MsgBox \"请先选中一个单元格区域\", vbExclamation", "Exit Sub", "End If", "Selection.BorderAround LineStyle:=xlContinuous, Weight:=xlMedium", "End Sub", "运行结果：安装加载宏后重启 Excel → 弹出\"MyTools 加载宏已加载\"；在任意工作簿选中区域运行 `AddOuterBorder` → 区域加上中等粗细外边框。", "### 4.4 错误处理进阶：集中处理与日志", "' ---- 以下代码放在标准模块 modErrorHandler ----", "Option Explicit", "' 写日志：追加到工作簿同目录的 ErrorLog.txt（每行一条）", "Public Sub LogError(ByVal procName As String)", "Dim f As Long", "Dim logPath As String", "logPath = ThisWorkbook.Path & \"\\ErrorLog.txt\"", "f = FreeFile", "Open logPath For Append As #f", "Print #f, Format(Now, \"yyyy-mm-dd hh:nn:ss\") & \" | \" & procName _", "& \" | \" & Err.Number & \" | \" & Err.Description", "Close #f", "End Sub", "' 集中处理：按错误号分支提示，再记日志", "Public Sub HandleError(ByVal procName As String)", "Select Case Err.Number", "Case 9", "MsgBox \"下标越界：要找的工作表或数组元素不存在，请检查名称与范围。\", vbExclamation", "Case 13", "MsgBox \"类型不匹配：请检查输入的数据类型（如把文字填进了数字格）。\", vbExclamation", "Case 1004", "MsgBox \"文件不存在或路径错误，请检查路径后重试。\", vbExclamation", "Case Else", "MsgBox \"出错了（\" & Err.Number & \"）：\" & Err.Description & \"，已记入错误日志。\", vbCritical", "End Select", "LogError procName", "Err.Clear", "End Sub", "' ---- 业务过程的固定写法：顶部一行，文末一段 ----", "Option Explicit", "Sub OpenReport()", "On Error GoTo ErrHandler", "Application.ScreenUpdating = False", "Workbooks.Open \"D:\\不存在.xlsx\"   ' 演示用：该文件不存在，触发 1004", "Application.ScreenUpdating = True", "Exit Sub", "ErrHandler:", "Application.ScreenUpdating = True   ' 恢复现场：出错也要把开关开回来", "HandleError \"OpenReport\"", "End Sub", "运行结果：文件不存在时 → 错误号 1004，弹出\"文件不存在或路径错误\"，`ErrorLog.txt` 增加一行（含时间、OpenReport、1004 与错误描述）。"], "scenarios": [{"title": "场景 1：报销录入窗体（财务 / 行政）", "body": "每月几十张报销单，手工在表里逐行填容易串行、漏项。做法：按 2.1 节做 `frmEntry` 窗体，姓名、金额必填校验，类型只能从下拉框三选一，点确定才写一行，取消不写数据。结果：录入员不用记列顺序，金额输错当场拦截；`Unload Me` 保证下次打开是空窗体，不会把上个人的数据带进去。进阶：把窗体改成非模态（`Show vbModeless`），录入员可以一边对照原始单据表一边填，不用先关窗体。"}, {"title": "场景 2：部门工具加载宏（全员共享）", "body": "部门有 5 个常用小工具（加边框、去空行、批量改名等），以前每人复制一份 .xlsm，各自版本越用越乱。做法：把 5 个过程收进一个工作簿，调通后另存为 MyTools.xlam，发给大家按 2.3 节安装；后续升级只发新版 .xlam 覆盖安装即可。结果：所有人打开任意工作簿都能用同一套工具；工具代码与业务数据彻底分离，业务表再也不会因为\"顺手改了宏\"而损坏。"}], "pitfalls": [{"problem": "窗体弹出来是空白的，控件全不见了", "cause": "控件画在了窗体外面，或窗体被意外改小", "solution": "在 VBE 里点窗体，按 Ctrl+A 全选控件看有没有在边界外；把控件拖回窗体内"}, {"problem": "`frmEntry.Show` 报\"找不到工程或库\"", "cause": "窗体被改名或删除，标准模块里的名字对不上", "solution": "检查工程窗口里的窗体名与代码中的名字是否一致，改名后要同步改调用处"}, {"problem": "非模态窗体一闪而过 / 最小化 Excel 后窗体消失", "cause": "非模态窗体没有用变量持有引用，或 Excel 最小化时窗体跟随隐藏", "solution": "用 `Dim frm As New frmEntry: frm.Show vbModeless` 持有引用；或改回模态"}, {"problem": "类模块代码粘贴进标准模块后编译报错", "cause": "`Property Get/Let` 只能写在类模块里", "solution": "插入真正的类模块（插入 → 类模块），把代码移过去"}, {"problem": "`Salary = -100` 没有报错，写进去了", "cause": "校验写在了 `Property Get` 里而不是 `Property Let` 里，或根本没写校验", "solution": "校验必须写在 `Property Let` 里；用 `Err.Raise 513` 拒绝非法值"}, {"problem": "加载宏安装后找不到工具", "cause": "只保存了 .xlam，没在「加载项 → 转到」里勾选", "solution": "文件 → 选项 → 加载项 → 管理选 Excel 加载项 → 转到 → 勾选后确定"}, {"problem": "加载宏里改了代码，重启后改动丢了", "cause": "直接在 .xlam 里改，保存时写回了加载宏目录以外的路径或根本没保存", "solution": "保留 .xlsm 源文件，改源文件再重新另存为 .xlam 覆盖"}, {"problem": "出错一次后 Excel 按钮全变灰、事件不触发", "cause": "错误处理段里没恢复 `ScreenUpdating` / `EnableEvents`", "solution": "在 `ErrHandler` 段开头先恢复两个开关，再提示与记日志"}, {"problem": "`On Error Resume Next` 盖住整段代码，出错也不知道", "cause": "Resume Next 会吞掉所有错误，且事后没检查 `Err.Number`", "solution": "只在单个可预期操作上用，用完立即检查 `Err.Number` 并 `On Error GoTo 0` 恢复"}, {"problem": "日志文件写不进去 / 找不到 ErrorLog.txt", "cause": "`ThisWorkbook.Path` 为空（新工作簿未保存）或目录无写权限", "solution": "先保存工作簿再运行；或把日志路径改到固定目录（如 `Environ(\"TEMP\")`）"}, {"problem": "自定义错误号与系统错误冲突", "cause": "自定义用了 512 以下的号，与系统错误号重叠", "solution": "自定义错误号一律用 513 起（系统保留 0–512）"}], "exercises": ["`frmEntry.Show` 与 `frmEntry.Show vbModeless` 在行为上有什么区别？各适合什么场景？", "类模块 `clsEmployee` 里，`Salary` 写入 -100 时会发生什么？为什么校验要写在 `Property Let` 里而不是 `Property Get` 里？", "把工具打包成加载宏（.xlam）需要哪几步？为什么要保留一份 .xlsm 源文件？", "业务过程里 `On Error GoTo ErrHandler` 文末的 `ErrHandler:` 段为什么要先恢复 `Application.ScreenUpdating = True` 再提示错误？", "用本篇示例 2 的 3 名员工（月薪 8000、9500、12000）算：合计月薪、平均月薪（保留 2 位小数）、3 人年薪合计各是多少？", "某工具要处理 10 个文件，其中 2 个因路径错误触发 1004 被 `HandleError` 记入日志，其余 8 个成功。日志里应有几行记录？成功处理的文件数与日志行数之和是多少？"], "answers": ["`Show` 默认模态（vbModal=1）：用户必须关闭窗体才能操作工作表，之后的代码暂停执行，适合录入、确认类对话框；`Show vbModeless` 非模态：可一边开窗体一边操作表格，之后的代码立即继续执行，适合对照着表填写、常驻辅助面板。记忆点：模态\"先关窗再干活\"，非模态\"窗表两不误\"。", "触发 `Err.Raise 513`，错误描述\"工资不能为负数\"，写入被拒绝，`pSalary` 保持原值。校验必须写在 `Property Let`（写入入口）里：`Property Get` 只在读取时执行，写操作根本不经过它，校验写在那里等于没写。", "步骤：代码在普通工作簿里调通 → 调试 → 编译无错 → 文件 → 另存为 → 保存类型选 Excel 加载宏 (*.xlam) → 文件 → 选项 → 加载项 → 管理选 Excel 加载项 → 转到 → 勾选安装 → 重启 Excel 验证。保留 .xlsm 源文件的原因：.xlam 的工作表被隐藏、保存路径默认在加载宏目录，直接改 .xlam 容易丢改动；改源文件再重新另存覆盖才是可靠流程。", "因为业务过程开头关掉了 `ScreenUpdating`（批量操作提速），如果出错时直接退出而不恢复，Excel 会一直不刷新屏幕，看起来像\"假死\"，后续所有操作都受影响。固定写法：`ErrHandler` 段第一件事就是把关掉的开关（`ScreenUpdating`、`EnableEvents`、`DisplayAlerts`）全部恢复，再提示与记日志。", "合计月薪 29500（8000+9500+12000）；平均月薪 9833.33（29500÷3=9833.333…，四舍五入到 2 位小数）；3 人年薪合计 354000（96000+114000+144000，或 29500×12）。验算：8000×12=96000，9500×12=114000，12000×12=144000，三数相加 354000。", "日志里应有 2 行记录（每个出错文件记一行，成功的不记日志）。成功处理文件数 8 与日志行数 2 之和是 10，正好等于待处理文件总数，可用这个等式自查\"有没有文件被悄悄漏掉\"。"], "versions": "Excel 2010 / 2013 / 2016 / 2019 / 2021 / 365（Windows 桌面版；Mac 版 VBA 不支持 UserForm 与部分加载宏功能）", "file": "VBA-UserForm-Demo.bas"}, {"id": "office-scripts-01-introduction", "group": "office-scripts", "column": "C12", "level2": "C12-L2-1", "title": "Office Scripts 入门：不用 VBA 也能让 Excel 自己干活", "level": "入门", "body": "### 2.1 Office Scripts 是什么\n\nOffice Scripts 是 Excel 里的一套自动化功能：把一串重复操作写成脚本（Script），以后点一下运行，Excel 就按脚本把这些操作自动做完。它用 TypeScript 写代码，脚本存在云端（OneDrive for Business 或 SharePoint），运行也在云端完成。\n\n一句话定位：Office Scripts 是“云端版的 Excel 宏”，面向的是网页版 Excel 和跨平台办公；VBA 是“桌面版的 Excel 宏”，面向的是 Windows 桌面版 Excel。\n\n### 2.2 它由哪几部分组成\n\n- **操作记录器（Action Recorder）**：不用写代码，把手动操作录下来，Excel 自动生成一段 TypeScript 脚本。适合“动作固定、每周都要做一次”的任务。\n- **代码编辑器（Code Editor）**：在浏览器里直接写 TypeScript，可以加判断、循环和参数。适合录制做不到的任务，例如“只处理金额大于 10000 的行”。\n- **自动执行（Automate）选项卡**：网页版 Excel 功能区里的入口，所有脚本的新建、查看、运行都从这里开始。\n- **Power Automate 联动**：脚本本身没有定时器和邮件触发器，这些由 Power Automate 提供。流程触发后调用脚本，脚本负责改工作簿（详见 03 篇）。\n\n### 2.3 与 VBA 的区别\n\n| 对比维度 | Office Scripts | VBA |\n|---|---|---|\n| 语言 | TypeScript（JavaScript 的超集，带类型注解） | Visual Basic for Applications |\n| 运行位置 | 云端（Excel 网页版、Windows、Mac 上运行脚本，计算在云端完成） | 本机（只在装了桌面版 Excel 的 Windows 或 Mac 上运行） |\n| 保存形式 | 脚本文件（.osts），存在 OneDrive for Business 或 SharePoint，与工作簿分开保存 | 宏保存在工作簿里（.xlsm），随文件走 |\n| 入口位置 | 网页版 Excel 的“自动执行”选项卡 | 桌面版 Excel 的“开发工具”选项卡 |\n| 触发方式 | 手动运行、Power Automate 流程触发（定时、收到邮件、新文件到达等） | 手动运行、按钮、打开文件、工作表事件（如内容改变时触发） |\n| 跨平台 | 网页版、Windows、Mac 都能跑同一段脚本 | 主要在 Windows 桌面版；Mac 支持有限；网页版完全不能跑 |\n| 适用场景 | 网页版 Excel 日常自动化、跨平台团队共用、与 Power Automate 联动的无人值守任务 | 桌面端深度自动化、操作本机文件与系统、与 Outlook 等桌面应用联动 |\n| 学习门槛 | 会录制就能起步；写代码要学 TypeScript 基础 | 要学 VBA 语法与对象模型；本教程 C11 有完整内容 |\n\n怎么选，一句话：人在网页版 Excel 里、要跨电脑跨平台、要定时自动跑，选 Office Scripts；人在桌面版 Excel 里、要操作本机文件或做工作表事件触发，选 VBA。两者不是谁取代谁，而是各管一摊。\n\n### 2.4 可用性前提（对照 Microsoft 官方文档核对）\n\n以下四条缺一不可，来源为 Microsoft Learn 的 Office Scripts 平台要求文档（Platform limits, requirements, and error messages for Office Scripts）与 Microsoft Support 的 Office Scripts 简介：\n\n1. **订阅**：Microsoft 365 商业版或教育版许可，例如 Office 365 Business、Business Premium、ProPlus、A3、A5、Enterprise E1、E3、E5、F3。Microsoft 365 个人版与家庭版不包含 Office Scripts。\n2. **Excel 位置**：Excel 网页版、Excel for Windows（2210 或更高版本）或 Excel for Mac。\n3. **存储**：OneDrive for Business（脚本默认存在 OneDrive 的 Office Scripts 文件夹里）；用 SharePoint 库里的脚本时走 Power Automate 的另一条动作。\n4. **网络与管理员设置**：需要联网并开启联网体验；管理员可以在 Microsoft 365 管理中心关掉 Office Scripts；网页版使用时浏览器须允许第三方 Cookie，否则“自动执行”选项卡不出现。\n\n补充两条 Power Automate 相关的许可说明（同上官方文档）：要在 Power Automate 里调用脚本，必须持有 Microsoft 365 商业许可；E1 与 F3 许可可以用脚本配合 Power Automate，但在 Excel 里没有直接的 Power Automate 集成入口。\n\n如果你的账号是个人版或家庭版，Office Scripts 不可用，替代办法是继续用 VBA（桌面版 Excel 自带，见 C11），或改用 Power Query 做数据整理（见 C09）。", "steps": ["用商业版或教育版账号登录网页版 Excel（office.com），打开任意一个工作簿，确认功能区出现了“自动执行”选项卡；如果没有，先按第 2.4 节检查订阅、管理员设置与第三方 Cookie（待补图）。", "点“自动执行”→“新建脚本”→“从录制创建”，右侧出现“录制操作”任务窗格（待补图）。", "在工作表中做一遍你要自动化的操作，例如选中 A1:D1，把字加粗并填充浅灰色；任务窗格里会逐条列出你做的动作（待补图）。", "做完后点任务窗格里的“停止”，Excel 生成一段脚本并在代码编辑器里打开（待补图）。", "给脚本改一个有意义的名字，例如“标题行加粗变灰”，不要用默认的“脚本 1”（待补图）。", "换一张结构相同的工作表，点“自动执行”→“查看脚本”，选中刚录的脚本点“运行”，检查标题行是不是同样变粗变灰（待补图）。", "想改脚本逻辑时，在代码编辑器里直接改 TypeScript 代码，改完点“运行”再验一次（待补图）。"], "sections": [{"title": "2. 基础概念", "body": "### 2.1 Office Scripts 是什么\n\nOffice Scripts 是 Excel 里的一套自动化功能：把一串重复操作写成脚本（Script），以后点一下运行，Excel 就按脚本把这些操作自动做完。它用 TypeScript 写代码，脚本存在云端（OneDrive for Business 或 SharePoint），运行也在云端完成。\n\n一句话定位：Office Scripts 是“云端版的 Excel 宏”，面向的是网页版 Excel 和跨平台办公；VBA 是“桌面版的 Excel 宏”，面向的是 Windows 桌面版 Excel。\n\n### 2.2 它由哪几部分组成\n\n- **操作记录器（Action Recorder）**：不用写代码，把手动操作录下来，Excel 自动生成一段 TypeScript 脚本。适合“动作固定、每周都要做一次”的任务。\n- **代码编辑器（Code Editor）**：在浏览器里直接写 TypeScript，可以加判断、循环和参数。适合录制做不到的任务，例如“只处理金额大于 10000 的行”。\n- **自动执行（Automate）选项卡**：网页版 Excel 功能区里的入口，所有脚本的新建、查看、运行都从这里开始。\n- **Power Automate 联动**：脚本本身没有定时器和邮件触发器，这些由 Power Automate 提供。流程触发后调用脚本，脚本负责改工作簿（详见 03 篇）。\n\n### 2.3 与 VBA 的区别\n\n| 对比维度 | Office Scripts | VBA |\n|---|---|---|\n| 语言 | TypeScript（JavaScript 的超集，带类型注解） | Visual Basic for Applications |\n| 运行位置 | 云端（Excel 网页版、Windows、Mac 上运行脚本，计算在云端完成） | 本机（只在装了桌面版 Excel 的 Windows 或 Mac 上运行） |\n| 保存形式 | 脚本文件（.osts），存在 OneDrive for Business 或 SharePoint，与工作簿分开保存 | 宏保存在工作簿里（.xlsm），随文件走 |\n| 入口位置 | 网页版 Excel 的“自动执行”选项卡 | 桌面版 Excel 的“开发工具”选项卡 |\n| 触发方式 | 手动运行、Power Automate 流程触发（定时、收到邮件、新文件到达等） | 手动运行、按钮、打开文件、工作表事件（如内容改变时触发） |\n| 跨平台 | 网页版、Windows、Mac 都能跑同一段脚本 | 主要在 Windows 桌面版；Mac 支持有限；网页版完全不能跑 |\n| 适用场景 | 网页版 Excel 日常自动化、跨平台团队共用、与 Power Automate 联动的无人值守任务 | 桌面端深度自动化、操作本机文件与系统、与 Outlook 等桌面应用联动 |\n| 学习门槛 | 会录制就能起步；写代码要学 TypeScript 基础 | 要学 VBA 语法与对象模型；本教程 C11 有完整内容 |\n\n怎么选，一句话：人在网页版 Excel 里、要跨电脑跨平台、要定时自动跑，选 Office Scripts；人在桌面版 Excel 里、要操作本机文件或做工作表事件触发，选 VBA。两者不是谁取代谁，而是各管一摊。\n\n### 2.4 可用性前提（对照 Microsoft 官方文档核对）\n\n以下四条缺一不可，来源为 Microsoft Learn 的 Office Scripts 平台要求文档（Platform limits, requirements, and error messages for Office Scripts）与 Microsoft Support 的 Office Scripts 简介：\n\n1. **订阅**：Microsoft 365 商业版或教育版许可，例如 Office 365 Business、Business Premium、ProPlus、A3、A5、Enterprise E1、E3、E5、F3。Microsoft 365 个人版与家庭版不包含 Office Scripts。\n2. **Excel 位置**：Excel 网页版、Excel for Windows（2210 或更高版本）或 Excel for Mac。\n3. **存储**：OneDrive for Business（脚本默认存在 OneDrive 的 Office Scripts 文件夹里）；用 SharePoint 库里的脚本时走 Power Automate 的另一条动作。\n4. **网络与管理员设置**：需要联网并开启联网体验；管理员可以在 Microsoft 365 管理中心关掉 Office Scripts；网页版使用时浏览器须允许第三方 Cookie，否则“自动执行”选项卡不出现。\n\n补充两条 Power Automate 相关的许可说明（同上官方文档）：要在 Power Automate 里调用脚本，必须持有 Microsoft 365 商业许可；E1 与 F3 许可可以用脚本配合 Power Automate，但在 Excel 里没有直接的 Power Automate 集成入口。\n\n如果你的账号是个人版或家庭版，Office Scripts 不可用，替代办法是继续用 VBA（桌面版 Excel 自带，见 C11），或改用 Power Query 做数据整理（见 C09）。"}, {"title": "4. 图文示例", "body": "示例：第一次录制——给报表标题行加粗并填充颜色（文字版）。\n\n- 录制前：工作表 A1:D1 是“日期、销售员、产品、金额”四个标题，普通样式，无加粗、无填充。\n- 录制中做的动作：选中 A1:D1 → 点“加粗”→ 填充色选浅灰色 → 点“停止”。\n- 录制后生成的脚本大意（由录制器自动生成，实际代码行数可能略有不同）：取活动工作表 → 取 A1:D1 区域 → 把字体设为加粗 → 把填充色设为浅灰色。\n- 运行后：换一张同样有 A1:D1 标题的工作表运行该脚本，A1:D1 同样变粗变灰，不用再手动点三下（待补图）。\n\n这个例子说明两件事：录制器适合“动作固定”的任务；录制出来的代码是可以再编辑的起点，不是只能原样用的成品。"}], "source": "docs/office-scripts/01-introduction.md", "updated": "2026-11-10", "objectives": ["用一句话说出 Office Scripts 是什么，以及它与 VBA 的根本区别", "对照一张表，说出在什么情况下该用 Office Scripts、什么情况下该用 VBA", "判断自己的账号与 Excel 版本能不能用 Office Scripts，并说出看不到“自动执行”选项卡时的三类原因", "说出 Office Scripts 的三类适用场景（网页版 Excel、跨平台、与 Power Automate 联动），并各举一个例子", "在网页版 Excel 里找到“自动执行”选项卡，录制并运行自己的第一段脚本"], "formulas": ["本篇代码均为入门示例，每段配预期效果说明；均未在 Excel 网页版内执行验证。", "第一段脚本：写一句话到 A1，理解 main 函数的形状。", "function main(workbook: ExcelScript.Workbook) {", "// 取当前活动工作表。", "let sheet = workbook.getActiveWorksheet();", "// 在 A1 写一句话。", "sheet.getRange(\"A1\").setValue(\"你好，Office Scripts\");", "}", "预期效果：运行后，活动工作表的 A1 单元格出现文字“你好，Office Scripts”。这是 Office Scripts 的最小完整脚本：每个脚本必须有一个 main 函数，它的第一个参数固定是 ExcelScript.Workbook 类型的工作簿对象。", "第二段脚本：录制器生成的典型代码（标题行加粗变灰）。", "function main(workbook: ExcelScript.Workbook) {", "let sheet = workbook.getActiveWorksheet();", "// 取标题行 A1:D1。", "let headerRange = sheet.getRange(\"A1:D1\");", "// 加粗。", "headerRange.getFormat().getFont().setBold(true);", "// 填充浅灰色。", "headerRange.getFormat().getFill().setColor(\"#D9D9D9\");", "}", "预期效果：运行后，活动工作表的 A1:D1 四个标题单元格变粗，背景变成浅灰色（#D9D9D9）。其中 getFormat().getFont().setBold(true) 与 getFormat().getFill().setColor(...) 是录制器最常生成的两行，分别改字体与填充。", "第三段脚本：批量写一行表头并加粗，理解“区域一次写多个值”。", "function main(workbook: ExcelScript.Workbook) {", "let sheet = workbook.getActiveWorksheet();", "// 一次写 4 个标题（二维数组：一行四列）。", "sheet.getRange(\"A1:D1\").setValues([[\"日期\", \"销售员\", \"产品\", \"金额\"]]);", "// 标题行加粗。", "sheet.getRange(\"A1:D1\").getFormat().getFont().setBold(true);", "}", "预期效果：运行后，A1:D1 依次出现“日期、销售员、产品、金额”，且全部加粗。注意 setValues 接收的是二维数组：外层数组是行，内层数组是列，一行四列就写成 [[\"日期\", \"销售员\", \"产品\", \"金额\"]]。"], "scenarios": [{"title": "场景一：每周一的报表标题美化。", "body": "- 背景：行政每周一从系统导出一张新表，表头在 A1:D1，每次都要手动加粗标题行、调列宽，再发给主管。\n- 做法：录制一次“加粗标题行、调列宽”的操作，保存为脚本；每周一打开新表，点一下运行。\n- 预期效果：原来每次 2 分钟的手动操作，变成点一次运行；多人轮流做这件事时，结果样式完全一致。\n\n场景二：跨平台团队共用同一份自动化。\n\n- 背景：团队里有人用 Windows、有人用 Mac、有人只用网页版 Excel，每周都要把同一份原始数据整理成固定格式。\n- 做法：把整理脚本存在 OneDrive for Business 里共享，团队成员各自在自己的 Excel 里运行同一段脚本。\n- 预期效果：同一段脚本在网页版、Windows、Mac 上跑出同样的结果；如果用 VBA 写，网页版的同事根本跑不起来。"}], "pitfalls": [{"problem": "功能区没有“自动执行”选项卡", "cause": "订阅是个人版或家庭版，或管理员已关闭该功能，或网页版浏览器禁用了第三方 Cookie", "solution": "先确认订阅为商业版或教育版；再请管理员在 Microsoft 365 管理中心检查 Office Scripts 设置；网页版启用第三方 Cookie 后刷新"}, {"problem": "录制后脚本为空，任务窗格提示某操作不受支持", "cause": "该操作不在录制器支持范围内，录制器会跳过它并给出提示", "solution": "把不支持的那一步改成代码编辑器里手写，或换一种界面操作实现同样效果"}, {"problem": "脚本在第一张表能跑，换一张表就报错", "cause": "录制器写死了工作表名或区域地址，新表的名字或结构不同", "solution": "在代码编辑器里把写死的名字改成 getActiveWorksheet()，把固定地址改成按实际数据范围取（例如 getUsedRange()）"}, {"problem": "运行后单元格内容没变，也没有报错", "cause": "脚本操作的是另一张工
