<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Excel 综合站 - 从入门到精通</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.0.4/tesseract.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#217346;--green-d:#1a5c38;--green-l:#e8f5ec;--bg:#f4f7f5;--card:#fff;--text:#1f2937;--muted:#6b7280;--border:#e5e7eb;--blue:#2563eb;--purple:#7c3aed;--orange:#ea580c;--red:#ef4444;--amber:#f59e0b;--radius:12px;--shadow:0 1px 3px rgba(0,0,0,.08)}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.7}
header{background:linear-gradient(135deg,var(--green),var(--green-d));color:#fff;padding:26px 20px 18px;text-align:center}
.header-row{display:flex;align-items:center;justify-content:center;gap:12px}
.drawer-btn{display:none;background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:8px;font-size:18px;padding:6px 12px;cursor:pointer}
.topnav{display:flex;gap:2px;overflow-x:auto;background:var(--green-d);padding:0 10px;position:sticky;top:0;z-index:50;scrollbar-width:thin}
.topnav a{color:#d1fae5;padding:10px 12px;font-size:13.5px;white-space:nowrap;cursor:pointer;text-decoration:none}
.topnav a:hover{background:rgba(255,255,255,.12);color:#fff}
.topnav a.active{background:rgba(255,255,255,.18);color:#fff;font-weight:700}
.drawer-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:59}
body.drawer-open .drawer-overlay{display:block}
header h1{font-size:25px;margin-bottom:6px}
header p{opacity:.85;font-size:13px}
.searchbar{max-width:560px;margin:14px auto 0;display:flex;gap:8px}
.searchbar input{flex:1;padding:11px 16px;border:none;border-radius:10px;font-size:15px;outline:none}
.searchbar button{padding:11px 22px;border:none;border-radius:10px;background:#fff;color:var(--green);font-weight:700;cursor:pointer;font-size:15px}
.layout{display:flex;max-width:1300px;margin:0 auto;min-height:calc(100vh - 160px)}
aside{width:250px;flex-shrink:0;background:#fff;border-right:1px solid var(--border);padding:14px 0;position:sticky;top:42px;max-height:calc(100vh - 42px);overflow-y:auto}
.nav-group{padding:10px 18px 4px;font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.05em}
.nav-sub{padding:7px 18px 7px 34px;font-size:13.5px;color:var(--text);cursor:pointer}
.nav-sub:hover{background:#f0f9f3}
.nav-sub.active{background:var(--green-l);color:var(--green);font-weight:700}
.nav-sec{padding:9px 18px;font-weight:700;font-size:13.5px;color:var(--text);cursor:pointer;display:flex;align-items:center;gap:8px;border-left:3px solid transparent}
.nav-sec:hover{background:#f0f9f3}
.nav-sec.active{background:#e8f5ec;border-left-color:var(--green);color:var(--green)}
.nav-sec .n{font-size:15px}
.nav-hot{font-size:10px;background:#ef4444;color:#fff;border-radius:8px;padding:1px 6px;margin-left:5px;vertical-align:2px;white-space:nowrap}
main{flex:1;padding:22px;min-width:0}
.badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;color:#fff;font-weight:600;margin-right:6px}
.card{background:var(--card);border-radius:12px;padding:20px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card h3{font-size:17px;margin-bottom:8px;color:var(--green-d)}
.card h4{font-size:15px;margin:14px 0 6px;color:var(--text)}
pre{background:#1e293b;color:#e2e8f0;padding:14px;border-radius:8px;overflow-x:auto;font-size:13px;margin:8px 0;position:relative}
pre code{font-family:Consolas,monospace;white-space:pre-wrap}
.copybtn{position:absolute;top:8px;right:8px;background:#334155;color:#fff;border:none;padding:4px 12px;border-radius:6px;font-size:12px;cursor:pointer}
.pitfall{background:#fef3c7;border-left:4px solid #f59e0b;padding:10px 14px;border-radius:0 8px 8px 0;margin:8px 0;font-size:13px}
.tip{background:#ecfdf5;border-left:4px solid var(--green);padding:10px 14px;border-radius:0 8px 8px 0;margin:8px 0;font-size:13px}
.casebox{background:#eff6ff;border-left:4px solid var(--blue);padding:10px 14px;border-radius:0 8px 8px 0;margin:8px 0;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.tcard{background:var(--card);border-radius:10px;padding:14px;cursor:pointer;border:1px solid var(--border);transition:.15s}
.tcard:hover{border-color:var(--green);box-shadow:0 2px 8px rgba(33,115,70,.15)}
.tcard .t{font-weight:700;font-size:15px;color:var(--green-d)}
.tcard .ds{font-size:13px;color:var(--muted);margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0}
th,td{border:1px solid var(--border);padding:8px 10px;text-align:left}
th{background:#f0f9f3;color:var(--green-d)}
.btn{display:inline-block;padding:10px 24px;background:var(--green);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;margin:6px 4px}
.btn:hover{background:var(--green-d)}
.btn.blue{background:var(--blue)} .btn.purple{background:var(--purple)} .btn.orange{background:var(--orange)}
textarea,input[type=text],select{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;font-size:14px;margin:6px 0;font-family:inherit}
textarea{min-height:120px;resize:vertical}
.tool-out{background:#f8fafc;border:1px solid var(--border);border-radius:8px;padding:14px;margin-top:10px;font-size:13px;max-height:400px;overflow:auto}
.tpl-cat{margin-bottom:18px}
.tpl-cat h4{font-size:15px;margin-bottom:8px;color:var(--green-d)}
.tpl-item{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin-bottom:8px}
.tpl-item .nm{font-weight:600}
.tpl-item .dc{font-size:12px;color:var(--muted)}
.dlbtn{padding:6px 18px;background:var(--green);color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:13px;text-decoration:none}
.hidden{display:none!important}
footer{text-align:center;padding:24px;color:var(--muted);font-size:13px}
footer a{color:var(--green);text-decoration:none}
footer a:hover{text-decoration:underline}
.crumb{font-size:13px;color:var(--muted);margin-bottom:10px}
.crumb a{color:var(--green);text-decoration:none}
.hero{background:linear-gradient(135deg,#e8f5ec,#fff);border-left:4px solid var(--green)}
.hero-stats{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.hero-stats b{font-size:20px;color:var(--green-d)}
.hero-stats span{font-size:12px;color:var(--muted);display:block}
.col-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.col-card{background:var(--card);border-radius:var(--radius);padding:16px;cursor:pointer;border:1px solid var(--border);transition:.15s}
.col-card:hover{border-color:var(--green);box-shadow:0 2px 8px rgba(33,115,70,.15)}
.col-card .t{font-weight:700;font-size:15px;color:var(--green-d)}
.col-card .ds{font-size:13px;color:var(--muted);margin-top:4px}
.status-badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:700;color:#fff;background:var(--green)}
.status-badge.part{background:var(--amber)}
.status-badge.todo{background:#9ca3af}
.ver-badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;color:#fff;font-weight:600;margin-right:6px;background:var(--green)}
.quick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.quick-item{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px;cursor:pointer;font-size:14px}
.quick-item:hover{border-color:var(--green)}
.detail-meta{font-size:13px;color:var(--muted);margin-top:6px}
.detail-meta b{color:var(--text)}
.note-pending{background:#fef9c3;border-left:4px solid var(--amber);padding:10px 14px;border-radius:0 8px 8px 0;margin:8px 0;font-size:13px}
.search-group{margin:14px 4px 4px;font-size:14px;font-weight:700;color:var(--green-d)}
.search-item{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin-bottom:8px;cursor:pointer}
.search-item:hover{border-color:var(--green)}
.search-item .st{font-size:12px;color:var(--muted)}

.diff-add{background:#dcfce7} .diff-del{background:#fee2e2} .diff-chg{background:#fef9c3}
@media(max-width:768px){.layout{flex-direction:column}aside{width:280px;max-width:85vw;position:fixed;left:0;top:0;bottom:0;z-index:60;transform:translateX(-102%);transition:transform .2s;box-shadow:0 0 20px rgba(0,0,0,.2);border-right:1px solid var(--border);border-bottom:none}.drawer-btn{display:inline-block}body.drawer-open aside{transform:translateX(0)}}
@media(max-width:500px){header{padding:16px 12px 12px}header h1{font-size:20px}.searchbar{flex-direction:column}.searchbar button{width:100%}main{padding:14px 12px}.grid{grid-template-columns:1fr}.col-grid{grid-template-columns:1fr}.quick-grid{grid-template-columns:1fr 1fr}.tpl-item{flex-wrap:wrap;gap:8px}.tpl-item .dlbtn{width:100%;text-align:center}table{display:block;overflow-x:auto}.hero-stats{gap:10px}.topnav a{padding:9px 10px;font-size:13px}footer{padding:18px 12px}.card{padding:16px 14px}}
</style>
</head>
<body>
<header>
<div class="header-row"><button class="drawer-btn" onclick="toggleDrawer()" aria-label="打开菜单">☰</button><h1>📊 Excel 综合站</h1></div>
<p>20 栏目 · 100 个去重函数（102 条目）· 21 个模板 · 26 个在线工具</p>
<div class="searchbar">
<input id="search" placeholder="全站搜索：函数、教程、技巧、问题、图表、模板，如 透视表..." oninput="doSearch(this.value)">
<button onclick="doSearch(document.getElementById('search').value)">搜索</button>
</div>
</header>
<nav class="topnav" id="topnav"></nav>
<div class="drawer-overlay" onclick="toggleDrawer(false)"></div>
<div class="layout">
<aside id="nav"></aside>
<main id="main"></main>
</div>
<footer>Excel 综合站 · 从入门到精通<br><span style="font-size:12px">内容：20 栏目 · 100 个去重函数 · 21 个模板 · 26 个在线工具 · 96 条技巧 · 65 条问题 · 30 条问答<br>开源项目：<a href="https://github.com/curzydj8/excel-tutorial" target="_blank" rel="noopener">github.com/curzydj8/excel-tutorial</a> · 更新日志见仓库提交记录 · 本站为纯静态站，工具均在浏览器本地运行，文件不上传服务器</span></footer>

: "班级平均分", "desc": "求B2:B40的平均分", "formula": "=AVERAGE(B2:B40)"}}, {"name": "AVERAGEIF", "cat": "math", "cat_name": "数学函数", "syntax": "AVERAGEIF(条件区域, 条件, [平均区域])", "desc": "条件平均：只对满足条件的求平均", "params": ["条件区域", "条件", "[平均区域]"], "examples": ["=AVERAGEIF(B2:B40, \">=60\")", "=AVERAGEIF(A2:A100, \"技术部\", C2:C100)"], "pitfalls": ["没有满足条件的单元格时返回 `#DIV/0!`，建议外层套 IFERROR", "条件写法规则与 SUMIF 完全一致"], "case": {"title": "销售部平均业绩", "desc": "只算销售部的平均", "formula": "=AVERAGEIF(A:A,\"销售部\",B:B)"}}, {"name": "COUNT", "cat": "math", "cat_name": "数学函数", "syntax": "COUNT(数值1, [数值2], ...)", "desc": "计数：数一数有多少个数字", "params": ["数值1…"], "examples": ["=COUNT(B2:B40)", "=COUNT(C2:C32)"], "pitfalls": ["想统计非空单元格个数要用 COUNTA（见统计函数章），COUNT 会漏掉文本", "日期会被计入（日期本质是数字），这是合理的"], "case": {"title": "数数字个数", "desc": "B列有几个数字", "formula": "=COUNT(B:B)"}}, {"name": "ROUND", "cat": "math", "cat_name": "数学函数", "syntax": "ROUND(数值, 小数位数)", "desc": "四舍五入到指定位数", "params": ["数值（必需）：要四舍五入的数字", "小数位数（必需）：保留几位小数；0 表示取整；负数向十位/百位取整"], "examples": ["=ROUND(123.4567, 2) → 123.46", "=ROUND(12345, -2) → 12300"], "pitfalls": ["误以为 ROUND(-2.5, 0) 的行为：Excel 中是 -3（远离零取整），不是 -2", "只是改单元格格式显示小数位数，实际值并未改变；需要真正取整必须用 ROUND"], "case": {"title": "保留2位小数", "desc": "金额四舍五入", "formula": "=ROUND(A2,2)"}}, {"name": "ROUNDUP", "cat": "math", "cat_name": "数学函数", "syntax": "ROUNDUP(数值, 小数位数)", "desc": "向上舍入（只入不舍）", "params": ["数值（必需）：要舍入的数字", "小数位数（必需）：保留几位小数；0 表示取整"], "examples": ["=ROUNDUP(3.2/0.5, 0)*0.5 → 3.5", "=ROUNDUP(47/8, 0) → 6"], "pitfalls": ["与 ROUND 混淆：ROUNDUP(2.1, 0)=3，而 ROUND(2.1, 0)=2", "负数时远离零：ROUNDUP(-2.1, 0)=-3"], "case": {"title": "通用示例", "desc": "3.2 米布按 0.5 米一段裁，需要几段（向上取整）", "formula": "=ROUNDUP(3.2/0.5, 0)*0.5   → 3.5"}}, {"name": "ROUNDDOWN", "cat": "math", "cat_name": "数学函数", "syntax": "ROUNDDOWN(数值, 小数位数)", "desc": "向下舍入（只舍不入）", "params": ["数值（必需）：要舍入的数字", "小数位数（必需）：保留几位小数；0 表示取整"], "examples": ["=ROUNDDOWN(4.9, 0) → 4", "=ROUNDDOWN(99.999, 2) → 99.99"], "pitfalls": ["与 INT 区别：ROUNDDOWN(-2.9, 0)=-2（向零），INT(-2.9)=-3（向下  "case": {"title": "通用示例", "desc": "按部门代码翻译成部门名称", "formula": "=SWITCH(A2, \"XS\", \"销售部\", \"JS\", \"技术部\", \"CW\", \"财务部\", \"未知部门\")"}}, {"name": "VLOOKUP", "cat": "lookup", "cat_name": "查找引用", "syntax": "VLOOKUP(查找值, 表格区域, 返回第几列, [精确/模糊匹配])", "desc": "纵向查找：按关键字在表格中找对应值", "params": ["查找值（必需）：要找的值", "表格区域（必需）：查找值必须在区域第一列", "返回第几列（必需）：返回区域内第几列的值（相对列数）", "精确/模糊匹配（可选）：0 或 FALSE=精确匹配（常用）；1 或 TRUE=模糊匹配（要求首列升序），省略默认为模糊"], "examples": ["=VLOOKUP(A2, 员工表!A:D, 2, 0) → 李四", "=VLOOKUP(B2, 税率表!A:B, 2, 1) → 10%"], "pitfalls": ["查不到返回 `#N/A`，套 IFERROR/IFNA 美化", "第 3 参数列号是相对区域的列数，不是工作表绝对列号", "插入列会导致列号错位，这是 VLOOKUP 最大硬伤，重要表格改用 INDEX+MATCH 或 XLOOKUP"], "case": {"title": "工号查姓名", "desc": "A列工号、B列姓名，查工号1001的姓名", "formula": "=VLOOKUP(1001,A:B,2,FALSE)"}}, {"name": "HLOOKUP", "cat": "lookup", "cat_name": "查找引用", "syntax": "HLOOKUP(查找值, 表格区域, 返回第几行, [精确/模糊匹配])", "desc": "横向查找（VLOOKUP 的横版）", "params": ["查找值（必需）：要找的值", "表格区域（必需）：查找值必须在区域第一行", "返回第几行（必需）：返回区域内第几行的值（相对行数）", "精确/模糊匹配（可选）：0 或 FALSE=精确匹配；1 或 TRUE=模糊匹配（要求首行升序），省略默认为模糊"], "examples": ["=HLOOKUP(A2, 数据!A1:M3, 3, 0) → 10月销售额 9000"], "pitfalls": ["查找值必须在区域的第一行；行方向不对会查不到", "与 VLOOKUP 同病：插入行会导致返回行号错位，重要表格改用 INDEX+MATCH 或 XLOOKUP"], "case": {"title": "通用示例", "desc": "按月份横向查销售额", "formula": "=HLOOKUP(A2, 数据!A1:M3, 3, 0)"}}, {"name": "XLOOKUP", "cat": "lookup", "cat_name": "查找引用", "syntax": "XLOOKUP(查找值, 查找区域, 返回区域, [未找到时], [匹配模式], [搜索模式])", "desc": "新一代查找：VLOOKUP 的完美替代品", "params": ["查找值（必需）：要找的值", "查找区域（必需）：在一列／一行里找", "返回区域（必需）：找到后返回对应位置的值（与查找区域行数一致）", "未找到时（可选）：查不到时返回的值，省略则返回 #N/A", "匹配模式（可选）：0＝精确（默认），-1＝精确或下一个较小值，1＝精确或下一个较大值，2＝通配符", "搜索模式（可选）：1＝从上往下（默认），-1＝从下往上，2＝升序二分查找，-2＝降序二分查找（二分查找要求区域已排序）"], "examples": ["=XLOOKUP(A2, 员工表!A:A, 员工表!B:B, \"查无此人\") → 李四", "=XLOOKUP(A2, 打卡!A:A, 打卡!C:C, , , -1) → 18:05"], "pitfalls": ["查找区域与返回区域行数必须一致，否则 `#VALUE!`", "旧版 Excel 不支持，注意文件分发兼容性", "搜索模式 2＝升序二分查找、-2＝降序二分查找：要求查找区域已按对应方向排好序，未排序会返回无效结果（不是报错）"], "case": {"title": "工号查姓名（新）", "desc": "不用数第几列，直接返回", "formula": "=XLOOKUP(1001,A:A,B:B,\"查无此人\")"}}, {"name": "INDEX", "cat": "lookup", "cat_name": "查找引用", "syntax": "INDEX(区域, 行号, [列号])", "desc": "按行列号取区域中的值", "params": ["区域（必需）：要取值的区域", "行号（必需）：第几行", "列号（可选）：第几列，省略默认为 1"], "examples": ["=INDEX(B2:D10, 3, 2) → 85", "=INDEX(A2:D10, 3, 0) → 第 3 行整行（溢出显示）"], "pitfalls": ["行列号超出区域返回 `#REF!`", "单独用意义不大，威力在于与 MATCH 组合"], "case": {"title": "取第3行第2列", "desc": "从A1:D10取数", "formula": "=INDEX(A1:D10,3,2)"}}, {"name": "MATCH", "cat": "lookup", "cat_name": "查找引用", "syntax": "MATCH(查找值, 查找区域, [匹配类型])", "desc": "找某个值在区域中的位置", "params": ["查找值（必需）：要找的值", "查找区域（必需）：在一列／一行里找", "匹配类型（可选）：0=精确匹配（常用）；1=找≤查找值的最大值（区域需升序）；-1=找≥查找值的最小值（区域需降序）；省略默认为 1"], "examples": ["=MATCH(\"李四\", A2:A100, 0) → 2", "=INDEX(员工表!B:B, MATCH(A2, 员工表!A:A, 0)) → 李四"], "pitfalls": ["找不到返回 `#N/A`", "匹配类型省略默认为 1（模糊），新手常忘记写 0 导致结果莫名其妙"], "case": {"title": "找产品位置", "desc": "A列产品名，找\"鼠标\"在第几行", "formula": "=MATCH(\"鼠标\",A:A,0)"}}, {"name": "OFFSET", "cat": "lookup", "cat_name": "查找引用", "syntax": "OFFSET(基准单元格, 下移行数, 右移列数, [高度], [宽度])", "desc": "以某个单元格为基准偏移取区域", "params": ["基准单元格（必需）：偏移的起点", "下移行数（必需）：向下移几行（负数向上）", "右移列数（必需）：向右移几列（负数向左）", "高度（可选）：返回区域的高度（行数），省略与基准同高", "宽度（可选）：返回区域的宽度（列数），省略与基准同宽"], "examples": ["=OFFSET(A1, 2, 3) → D3 单元格的值", "=SUM(OFFSET(B2, 0, 0, COUNTA(A:A)-1, 1)) → 450"], "pitfalls": ["易失性函数，每次重算都触发，大量使用严重拖慢表格", "偏移超出工作表边界返回 `#REF!`", "动态区域需求优先考虑用表格结构化引用或 365 动态数组替代"], "case": {"title": "动态求和", "desc": "始终对最近12个月求和", "formula": "=SUM(OFFSET(A1,COUNTA(A:A)-12,0,12,1))"}}, {"name": "INDIRECT", "cat": "lookup", "cat_name": "查找引用", "syntax": "INDIRECT(文本地址, [A1样式])", "desc": "把文本转成引用，实现动态引用", "params": ["文本地址（必需）：如 \"1月!B2\"、A2&\"!B2\"", "A1样式（可选）：TRUE=A1 样式（默认），FALSE=R1C1 样式"], "examples": ["=INDIRECT(A2&\"!B2\") → 1月表 B2 的值", "=SUM(INDIRECT(A2&\"!C2:C100\")) → 1月表 C 列求和"], "pitfalls": ["易失性函数，性能杀手，能不用就不用", "引用的工作簿关闭后返回 `#REF!`（跨文件时）", "文本地址写错（如缺 `!`）返回 `#REF!`，调试困难"], "case": {"title": "动态表名", "desc": "A2是\"1月\"，引用1月表B2", "formula": "=INDIRECT(A2&\"!B2\")"}}, {"name": "CHOOSE", "cat": "lookup", "cat_name": "查找引用", "syntax": "CHOOSE(序号, 值1, 值2, ...)", "desc": "按序号从列表中取值", "params": ["序号（必需）：取第几个值（1~254）", "值1（必需）：第 1 个候选值", "值2, ...（可选）：更多候选值，最多 254 个"], "examples": ["=CHOOSE(WEEKDAY(A2,2), \"一\",\"二\",\"三\",\"四\",\"五\",\"六\",\"日\") → 一", "=CHOOSE(A2, \"一季度\", \"二季度\", \"三季度\", \"四季度\") → 二季度"], "pitfalls": ["序号超出范围返回 `#VALUE!`", "参数最多 254 个，超长列表用 VLOOKUP 建对照表更好"], "case": {"title": "通用示例", "desc": "按季度序号取季度名", "formula": "=CHOOSE(WEEKDAY(A2,2), \"一\",\"二\",\"三\",\"四\",\"五\",\"六\",\"日\")"}}, {"name": "ROW", "cat": "lookup", "cat_name": "查找引用", "syntax": "ROW([单元格])", "desc": "返回行号", "params": ["单元格（可选）：要返回行号的单元格，省略返回公式所在行的行号"], "examples": ["=ROW()-1 → 1", "=MOD(ROW(), 2)=0 → TRUE"], "pitfalls": ["ROW() 省略参数返回公式所在行的行号；复制公式到别行时结果跟着变", "ROW(区域) 返回区域首行的行号，不是多行数组（365 溢出时除外）"], "case": {"title": "通用示例", "desc": "自动生成序号（第 2 行返回 1）", "formula": "=ROW()-1   → 在第 2 行返回 1，第 3 行返回 2……"}}, {"name": "COLUMN", "cat": "lookup", "cat_name": "查找引用", "syntax": "COLUMN([单元格])", "desc": "返回列号", "params": ["单元格（可选）：要返回列号的单元格，省略返回公式所在列的列号"], "examples": ["=COLUMN() → 2", "=VLOOKUP(A2, 表!A:D, COLUMN(B1), 0) → 李四"], "pitfalls": ["★ COLUMN() 省略参数返回公式所在列的列号；复制公式到别列时结果跟着变", "COLUMN(区域) 返回区域首列的列号；想拿区域内第 n 列的位置用 COLUMN()-COLUMN($A$1)+1 的写法", "与 VLOOKUP 组合时列号是相对区域的列数，不是工作表绝对列号"], "case": {"title": "通用示例", "desc": "VLOOKUP 的列号自动跟着列走，插列不翻车", "formula": "=VLOOKUP(A2, 表!A:D, COLUMN(B1), 0)"}}, {"name": "TRANSPOSE", "cat": "lookup", "cat_name": "查找引用", "syntax": "TRANSPOSE(数组)", "desc": "行列转置", "params": ["数组（必需）：要行列互换的区域"], "examples": ["=TRANSPOSE(A2:A4) → 张三　李四　王五（横向溢出到 3 列）"], "pitfalls": ["365 中结果自动溢出，需保证目标区域为空，否则 `#SPILL!`", "旧版需先选中目标区域，按 Ctrl+Shift+Enter"], "case": {"title": "行列互换", "desc": "横表转竖表", "formula": "=TRANSPOSE(A1:D5)"}}, {"name": "SORT", "cat": "lookup", "cat_name": "查找引用", "syntax": "SORT(数组, [排序列], [升/降序], [按行/列])", "desc": "动态数组：自动排序（新函数）", "params": ["数组（必需）：要排序的区域", "排序列（可选）：按第几列排序，省略为第 1 列", "升/降序（可选）：1=升序（默认），-1=降序", "按行/列（可选）：TRUE=按行排，FALSE=按列排（默认）"], "examples": ["=SORT(A2:B6, 2, -1) → 按销售额降序重排（第 1 行：赵六 20000）", "=TAKE(SORT(A2:B6, 2, -1), 5) → 取降序后的前 5 行"], "pitfalls": ["结果为动态数组，源数据变更自动重排，无需手动再排序", "多列排序需求用 SORTBY"], "case": {"title": "自动排序", "desc": "按销售额降序", "formula": "=SORT(A2:B100,2,-1)"}}, {"name": "FILTER", "cat": "lookup", "cat_name": "查找引用", "syntax": "FILTER(数组, 筛选条件, [无结果时显示])", "desc": "动态数组：按条件筛选（新函数）", "params": ["数组（必需）：要筛选的区域", "筛选条件（必需）：返回 TRUE/FALSE 的条件数组", "无结果时显示（可选）：无匹配时返回的值，省略则返回 #CALC!"], "examples": ["=FILTER(A2:C6, A2:A6=\"销售部\") → 销售部 3 行（张三、王五、钱七）", "=FILTER(A2:C6, (A2:A6=\"销售部\")*(C2:C6>10000), \"无\") → 销售部且金额>10000 的 2 行（张三、王五）"], "pitfalls": ["无匹配且未设第 3 参数时返回 `#CALC!`", "条件区域行数必须与数组一致", "这是 365 最实用的函数之一，可替代 90% 的高级筛选场景"], "case": {"title": "筛选销售部", "desc": "自动列出销售部所有行", "formula": "=FILTER(A2:D100,A2:A100=\"销售部\")"}}, {"name": "UNIQUE", "cat": "lookup", "cat_name": "查找引用", "syntax": "UNIQUE(数组, [按列], [只取唯一值])", "desc": "动态数组：去重取唯一值（新函数）", "params": ["数组（必需）：要去重的区域", "按列（可选）：FALSE=按行去重（默认），TRUE=按列去重", "只取唯一值（可选）：FALSE=去重（默认），TRUE=只保留出现一次的值"], "examples": ["=UNIQUE(A2:A6) → 销售部　技术部（去重后 2 个）", "=SORT(UNIQUE(A2:A6)) → 技术部　销售部（去重后按拼音排序）"], "pitfalls": ["空单元格会被当作一个 0 值参与去重，注意源数据先清理", "旧版替代方案：「数据-删除重复项」"], "case": {"title": "去重名单", "desc": "A列客户去重", "formula": "=UNIQUE(A2:A100)"}}, {"name": "COUNT", "cat": "stat", "cat_name": "统计函数", "syntax": "COUNT(数值1, [数值2], ...)", "desc": "计数：数一数有多少个数字", "params": ["数值1（必需）：数据", "数值2, ...（可选）：更多数据"], "examples": ["=COUNT(B2:B11) → 10"], "pitfalls": ["COUNT 只数数字：文本、逻辑值、空单元格都不计入；想数非空用 COUNTA", "日期会被计入（日期本质是数字），这是合理的；文本型数字不计入，先转数值"], "case": {"title": "数数字个数", "desc": "B列有几个数字", "formula": "=COUNT(B:B)"}}, {"name": "COUNTA", "cat": "stat", "cat_name": "统计函数", "syntax": "COUNTA(数值1, [数值2], ...)", "desc": "计数：数一数有多少个非空单元格", "params": ["值1（必需）：数据", "值2, ...（可选）：更多数据"], "examples": ["=COUNTA(A2:A11) → 9", "=ROWS(A2:A11)-COUNTA(B2:B11) → 1"], "pitfalls": ["公式返回的 `\"\"` 空文本也会被计入（它不是真正的空）", "含空格的\"假空\"单元格也会被计入，先 TRIM 清理"], "case": {"title": "数非空", "desc": "A列填了几个", "formula": "=COUNTA(A:A)"}}, {"name": "COUNTBLANK", "cat": "stat", "cat_name": "统计函数", "syntax": "COUNTBLANK(区域)", "desc": "数一数有多少个空单元格", "params": ["区域（必需）：要统计的单个区域"], "examples": ["=COUNTBLANK(C2:C11) → 2"], "pitfalls": ["同样会把 `\"\"` 空文本计为空，这是符合预期的", "COUNTBLANK 只能接单个区域，不能多区域"], "case": {"title": "通用示例", "desc": "统计 C 列还有几个空没填", "formula": "=COUNTBLANK(C2:C100)"}}, {"name": "COUNTIF", "cat": "stat", "cat_name": "统计函数", "syntax": "COUNTIF(条件区域, 条件)", "desc": "条件计数：满足条件的有几个", "params": ["条件区域（必需）：要判断的区域", "条件（必需）：如 \">=60\"、\"张三\"、\"张*\""], "examples": ["=COUNTIF(B2:B11, \">=60\") → 10", "=COUNTIF(A:A, \"张三\") → 3"], "pitfalls": ["条件文本加引号：`\">=60\"`、`\"张三\"`；引用单元格则 `\"=\"&D1`", "通配符：`\"张*\"` 统计所有姓张的"], "case": {"title": "统计及格人数", "desc": "B列分数，数≥60的有几个", "formula": "=COUNTIF(B:B,\">=60\")"}}, {"name": "COUNTIFS", "cat": "stat", "cat_name": "统计函数", "syntax": "COUNTIFS(条件区域1, 条件1, [条件区域2, 条件2], ...)", "desc": "多条件计数", "params": ["条件区域1（必需）：第一组筛选条件区域", "条件1（必需）：第一组筛选条件", "条件区域2, 条件2, ...（可选）：更多条件组"], "examples": ["=COUNTIFS(A2:A6, \"销售部\", B2:B6, \">=60\") → 3", "=COUNTIFS(B2:B11, \">=80\", B2:B11, \"<90\") → 4"], "pitfalls": ["各条件区域必须大小一致，否则 `#VALUE!`", "条件之间是\"且\"关系；要\"或\"关系用多个 COUNTIF 相加"], "case": {"title": "通用示例", "desc": "统计销售部且分数≥60 的人数", "formula": "=COUNTIFS(A2:A100, \"销售部\", B2:B100, \">=60\")"}}, {"name": "AVERAGEIF", "cat": "stat", "cat_name": "统计函数", "syntax": "AVERAGEIF(条件区域, 条件, [平均区域])", "desc": "条件平均：只对满足条件的求平均", "params": ["条件区域（必需）：用于判断条件的区域", "条件（必需）：筛选条件", "平均区域（可选）：实际求平均的区域；省略时对条件区域本身求平均"], "examples": ["=AVERAGEIF(B2:B11, \">=60\") → 83.3"], "pitfalls": ["没有满足条件的单元格时返回 #DIV/0!，建议外层套 IFERROR", "条件写法规则与 SUMIF 完全一致；平均区域省略时对条件区域本身求平均"], "case": {"title": "销售部平均业绩", "desc": "只算销售部的平均", "formula": "=AVERAGEIF(A:A,\"销售部\",B:B)"}}, {"name": "AVERAGEIFS", "cat": "stat", "cat_name": "统计函数", "syntax": "AVERAGEIFS(平均区域, 条件区域1, 条件1, ...)", "desc": "多条件平均", "params": ["平均区域（必需）：注意与 AVERAGEIF 不同，平均区域是第一个参数", "条件区域1（必需）：第一组筛选条件区域", "条件1（必需）：第一组筛选条件", "条件区域2, 条件2, ...（可选）：更多条件组"], "examples": ["=AVERAGEIFS(C2:C6, A2:A6, \"销售部\", B2:B6, \"男\") → 10500.0"], "pitfalls": ["与 AVERAGEIF 参数顺序不同（AVERAGEIFS 平均区域在前），照抄 AVERAGEIF 会错", "同样注意各区域大小一致"], "case": {"title": "通用示例", "desc": "销售部男员工的平均业绩", "formula": "=AVERAGEIFS(C2:C100, A2:A100, \"销售部\", B2:B100, \"男\")"}}, {"name": "MAX", "cat": "stat", "cat_name": "统计函数", "syntax": "MAX(数值1, [数值2], ...)", "desc": "取最大值", "params": ["数值1（必需）：数据", "数值2, ...（可选）：更多数据"], "examples": ["=MAX(B2:B11) → 95", "=MAX(IF(A2:A6=\"销售部\", C2:C6)) → 15000"], "pitfalls": ["MAX 忽略区域中的文本与逻辑值；如果区域全是文本，MAX 返回 0 而不是报错", "MAX(区域) 遇到错误值会直接返回错误值，先用 AGGREGATE(4,6,区域) 忽略错误"], "case": {"title": "最高分", "desc": "B列最高", "formula": "=MAX(B:B)"}}, {"name": "MIN", "cat": "stat", "cat_name": "统计函数", "syntax": "MIN(数值1, [数值2], ...)", "desc": "取最小值", "params": ["数值1（必需）：数据", "数值2, ...（可选）：更多数据"], "examples": ["=MIN(B2:D2) → 30"], "pitfalls": ["MIN 忽略区域中的文本与逻辑值；区域全是文本时 MIN 返回 0", "想排除 0 取最小正值用 =MINIFS(区域,区域,\">0\") 或 =SMALL(区域,COUNTIF(区域,0)+1)"], "case": {"title": "最低分", "desc": "B列最低", "formula": "=MIN(B:B)"}}, {"name": "LARGE", "cat": "stat", "cat_name": "统计函数", "syntax": "LARGE(数组, k)", "desc": "取第 N 大的值", "params": ["数组（必需）：数据区域", "k（必需）：第 k 大（1 为最大）"], "examples": ["=LARGE(B2:B11, 2) → 92", "=AVERAGE(LARGE(B2:B11, {1,2,3})) → 92.33"], "pitfalls": ["k 大于数据个数返回 `#NUM!`", "有并列时：如两个 100 分，LARGE(…,1) 和 LARGE(…,2) 都是 100"], "case": {"title": "Top3业绩", "desc": "取第1/2/3大", "formula": "=LARGE(B:B,1)"}}, {"name": "SMALL", "cat": "stat", "cat_name": "统计函数", "syntax": "SMALL(数组, k)", "desc": "取第 N 小的值", "params": ["数组（必需）：数据区域", "k（必需）：第 k 小（1 为最小）"], "examples": ["=(SUM(B2:B11)-SMALL(B2:B11,1))/(COUNT(B2:B11)-1) → 85.11"], "pitfalls": ["★ k 大于数据个数时返回 #NUM!，k 必须在 1~数据个数之间", "有并列时 SMALL(…,1) 与 SMALL(…,2) 可能相等（如两个最小值相同），这是正常行为", "去掉最小值求平均的经典写法：=(SUM(区域)-SMALL(区域,1))/(COUNT(区域)-1)，分母别忘了减 1"], "case": {"title": "通用示例", "desc": "去掉最低分再算平均分", "formula": "=(SUM(B2:B40)-SMALL(B2:B40,1))/(COUNT(B2:B40)-1)"}}, {"name": "RANK", "cat": "stat", "cat_name": "统计函数", "syntax": "RANK(数值, 引用区域, [排序方式])", "desc": "排名", "params": ["数值（必需）：要排名的值", "引用区域（必需）：排名范围（下拉复制时用 $ 绝对引用）", "排序方式（可选）：0 或省略=降序（最大为第 1）；非 0=升序（最小为第 1）"], "examples": ["=RANK(B2, B$2:B$11, 0) → 4", "=SUMPRODUCT((B$2:B$11>B2)/COUNTIF(B$2:B$11, B$2:B$11&\"\"))+1 → 4"], "pitfalls": ["忘记绝对引用是排名错误的第一原因", "并列时 RANK 会跳号（如两个第 1，则无第 2），这是标准行为不是 bug"], "case": {"title": "销售排名", "desc": "B列销售额排名", "formula": "=RANK(B2,B:B)"}}, {"name": "MEDIAN", "cat": "stat", "cat_name": "统计函数", "syntax": "MEDIAN(数值1, [数值2], ...)", "desc": "取中位数", "params": ["数值1（必需）：数据", "数值2, ...（可选）：更多数据"], "examples": ["=MEDIAN(C2:C8) → 45"], "pitfalls": ["MEDIAN 忽略文本与逻辑值；区域全是文本时返回 #NUM!", "数据个数为偶数时中位数是中间两数的平均值，不是其中某一个"], "case": {"title": "通用示例", "desc": "取工资中位数（不受极端值影响）", "formula": "=MEDIAN(C2:C100)"}}, {"name": "MODE", "cat": "stat", "cat_name": "统计函数", "syntax": "MODE(数值1, [数值2], ...)", "desc": "取众数", "params": ["数值1（必需）：数据", "数值2, ...（可选）：更多数据"], "examples": ["=MODE(B2:B11) → 85"], "pitfalls": ["无重复值时返回 `#N/A`", "多个并列众数只返回第一个；要全部用 MODE.MULT（365）"], "case": {"title": "通用示例", "desc": "取出现次数最多的分数", "formula": "=MODE(B2:B40)"}}, {"name": "STDEV", "cat": "stat", "cat_name": "统计函数", "syntax": "STDEV(数值1, [数值2], ...)", "desc": "标准差（样本）", "params": ["数值1（必需）：样本数据", "数值2, ...（可选）：更多样本数据"], "examples": ["=STDEV(B2:B11) → 8.74"], "pitfalls": ["样本 vs 总体：抽样数据用 STDEV.S（n-1），全体数据用 STDEVP/STDEV.P（n），用错结论偏差", "数据少于 2 个返回 `#DIV/0!`"], "case": {"title": "通用示例", "desc": "看分数波动大不大", "formula": "=STDEV(B2:B40)   → 值越大分数越参差不齐"}}, {"name": "VAR", "cat": "stat", "cat_name": "统计函数", "syntax": "VAR(数值1, [数值2], ...)", "desc": "方差（样本）", "params": ["数值1（必需）：样本数据", "数值2, ...（可选）：更多样本数据"], "examples": ["=VAR(C2:C11) → 76.46"], "pitfalls": ["VAR 是样本方差（分母 n-1）；全体数据用 VARP/VAR.P（分母 n），用错结论偏差", "数据少于 2 个时返回 #DIV/0!；文本与逻辑值会被忽略"], "case": {"title": "通用示例", "desc": "看销售额的离散程度", "formula": "=VAR(C2:C100)"}}, {"name": "PMT", "cat": "fin", "cat_name": "财务函数", "syntax": "PMT(利率, 期数, 现值, [终值], [类型])", "desc": "计算每期还款额（房贷月供）", "params =DB(100000, 10000, 5, 1) → 36,904.27", "=DB(100000, 10000, 5, 3) → 14,691.85"], "pitfalls": ["第几年不能超过使用年限，否则 `#NUM!`", "首年月份数省略默认 12；不满一年购入的设备要填实际月份数", "与 SLN 对比：DB 前期折旧快，适合技术更新快的设备"], "case": {"title": "通用示例", "desc": "10 万设备余额递减法第 1 年折旧多少", "formula": "=DB(100000, 10000, 5, 1)   → 36900（比直线法的 18000 多）"}}], "vba_keywords": [{"kw": "Dim", "cn": "声明变量", "code": "Dim name As String          ' 声明单个变量\nDim x As Long, y As Long    ' 一行声明多个\nDim arr(1 To 10) As Long    ' 声明数组\nDim ws As Worksheet         ' 声明对象变量", "note": "作用域：过程内部，只能在当前过程中使用。"}, {"kw": "Private", "cn": "模块级私有声明", "code": "Private counter As Long     ' 模块顶部，整个模块可用，外部模块不可见\n\nPrivate Sub Helper()\n    ' 私有过程，只能被本模块调用\nEnd Sub", "note": ""}, {"kw": "Public", "cn": "公开声明", "code": "Public appName As String    ' 整个工程可用\n\nPublic Sub Main()\n    ' 公开过程，可被其他模块调用，也可出现在 Alt+F8 宏列表\nEnd Sub", "note": ""}, {"kw": "Static", "cn": "静态变量（保持值）", "code": "Sub CountCalls()\n    Static times As Long   ' 只初始化一次\n    times = times + 1\n    MsgBox \"这是第 \" & times & \" 次调用\"\nEnd Sub", "note": "普通局部变量在过程结束後就销毁；`Static` 声明的变量在多次调用之间**保留上次的值**： 也可以让整个过程的变量都静态：`Static Sub CountCalls()`。"}, {"kw": "Const", "cn": "常量", "code": "Const TAX_RATE As Double = 0.13\nConst APP_NAME As String = \"报表系统\"\n' Const MAX_ROWS As Long = 1048576", "note": "常量在编译时确定，不能在运行中修改。魔法数字（税率、上限等）都应该用常量。"}, {"kw": "ReDim", "cn": "重定义动态数组", "code": "Dim arr() As Long\nReDim arr(1 To 10)              ' 分配空间\nReDim Preserve arr(1 To 20)     ' 扩大并保留原有数据", "note": "规则： - 只能用于动态数组（声明时不写上下界）。"}, {"kw": "Option Explicit", "cn": "强制变量声明", "code": "Option Explicit   ' 必须写在模块最顶部，所有代码之前", "note": "开启后，未经 `Dim` 的变量直接报错。防止拼写错误产生难以察觉的 bug。**所有模块都应该加。** ---"}, {"kw": "Select / Case", "cn": "多分支选择", "code": "Select Case score\n    Case Is >= 90\n        grade = \"A\"\n    Case 80 To 89\n        grade = \"B\"\n    Case 70, 71, 72\n        grade = \"C\"\n    Case Else\n        grade = \"D\"\nEnd Select", "note": "`Case` 的四种形式：`Is` 比较、`To` 范围、逗号多值、`Else` 兜底。"}, {"kw": "For / Next", "cn": "计数循环", "code": "For i = 1 To 10 Step 2    ' Step 可省略（默认1），可为负数\n    Debug.Print i\nNext i", "note": ""}, {"kw": "For Each", "cn": "集合遍历", "code": "Dim ws As Worksheet\nFor Each ws In Worksheets\n    Debug.Print ws.Name\nNext ws", "note": "注意：`For Each` 的循环变量**必须是 Variant 或对象类型**，不能是 `Long`。"}, {"kw": "Do / Loop", "cn": "条件循环", "code": "Do While 条件      ' 先判断，后执行（可能一次都不执行）\n    ' ...\nLoop\n\nDo Until 条件      ' 条件成立时退出\n    ' ...\nLoop\n\nDo                 ' 先执行，后判断（至少执行一次）\n    ' ...\nLoop While 条件\n\nDo\n    ' ...\nLoop Until 条件", "note": "四种形式："}, {"kw": "While / Wend", "cn": "旧式循环", "code": "While i < 10\n    i = i + 1\nWend", "note": "功能与 `Do While...Loop` 相同，是老式写法。新代码推荐用 `Do...Loop`。"}, {"kw": "GoTo", "cn": "跳转", "code": "Sub Demo()\n    On Error GoTo ErrHandler\n    ' ... 正常代码 ...\n    Exit Sub\n\nErrHandler:                  ' 标签以冒号结尾\n    MsgBox \"出错了：\" & Err.Description\nEnd Sub", "note": "现代 VBA 中 `GoTo` 主要用于错误处理。随意跳转会让代码难以维护，**不要**用它代替正常的条件分支。"}, {"kw": "Exit", "cn": "提前退出", "code": "Exit Sub        ' 退出 Sub 过程\nExit Function   ' 退出 Function 函数\nExit For        ' 跳出 For 循环\nExit Do         ' 跳出 Do 循环", "note": "常用于\"卫语句\"：先处理异常情况并退出，主逻辑保持平直："}, {"kw": "End", "cn": "终止程序", "code": "End   ' 立即终止所有代码执行，释放所有变量", "note": "> **警告**：`End` 会粗暴终止一切，不触发任何清理代码。正常结束过程用 `Exit Sub`，几乎用不到 `End`。 ---"}, {"kw": "Sub", "cn": "过程（做事）", "code": "Sub SayHello()\n    MsgBox \"你好\"\nEnd Sub\n\nSub Greet(name As String, Optional title As String = \"先生\")\n    MsgBox title & name & \"，你好\"\nEnd Sub", "note": ""}, {"kw": "Function", "cn": "函数（算值并返回）", "code": "Function CircleArea(r As Double) As Double\n    CircleArea = 3.14159 * r * r   ' 函数名 = 返回值\nEnd Function\n\n' 提前返回\nFunction SafeDiv(a As Double, b As Double) As Variant\n    If b = 0 Then\n        SafeDiv = \"除数不能为零\"\n        Exit Function\n    End If\n    SafeDiv = a / b\nEnd Function", "note": ""}, {"kw": "Call", "cn": "调用过程", "code": "Call Greet(\"张三\")   ' 显式调用，加括号\nGreet \"张三\"         ' 省略 Call，不加括号（效果相同）", "note": "> 省略 `Call` 是更常见的写法。注意：省略 Call 时参数不能加括号，否则会被当作求值。"}, {"kw": "ByVal / ByRef", "cn": "传值 vs 传址", "code": "Sub ByValDemo(ByVal x As Long)   ' 传值：复制一份，内部修改不影响外部\n    x = x + 10\nEnd Sub\n\nSub ByRefDemo(ByRef x As Long)   ' 传址：操作原变量，内部修改影响外部\n    x = x + 10\nEnd Sub\n\nSub Test()\n    Dim n As Long\n    n = 5\n    ByValDemo n\n    Debug.Print n   ' 还是 5\n    ByRefDemo n\n    Debug.Print n   ' 变成 15\nEnd Sub", "note": "**VBA 默认是 `ByRef`**（与大多数语言相反）。如果不希望过程修改传入的变量，显式写 `ByVal`。"}, {"kw": "Optional", "cn": "可选参数", "code": "Sub Print2D(rng As Range, Optional copies As Long = 1)\n    Dim i As Long\n    For i = 1 To copies\n        rng.PrintOut\n    Next i\nEnd Sub\n\nPrint2D Range(\"A1\")          ' copies 用默认值 1\nPrint2D Range(\"A1\"), 3       ' 打印 3 份", "note": "规则：`Optional` 参数必须有默认值，且必须放在参数列表最后。"}, {"kw": "ParamArray", "cn": "可变数量参数", "code": "Function SumAll(ParamArray nums() As Variant) As Double\n    Dim n As Variant, total As Double\n    For Each n In nums\n        total = total + n\n    Next n\n    SumAll = total\nEnd Function\n\nDebug.Print SumAll(1, 2, 3)          ' 6\nDebug.Print SumAll(10, 20, 30, 40)   ' 100", "note": "`ParamArray` 只能有一个，必须是最后一个参数，类型必须是 `Variant` 数组。 ---"}, {"kw": "Set", "cn": "对象赋值", "code": "Dim ws As Worksheet\nSet ws = ThisWorkbook.Worksheets(\"数据\")   ' 对象必须用 Set\n\nDim n As Long\nn = 100                                    ' 普通变量直接 =", "note": "忘记 `Set` 会报运行时错误 424\"需要对象\"。"}, {"kw": "New", "cn": "创建对象实例", "code": "Dim dict As Object\nSet dict = New Scripting.Dictionary   ' 需要引用 Microsoft Scripting Runtime\n\n' 或者声明时直接 New（不推荐：每次使用都检查是否已创建，有开销）\nDim dict2 As New Scripting.Dictionary", "note": ""}, {"kw": "Nothing", "cn": "空对象 / 释放对象", "code": "Dim ws As Worksheet\nSet ws = Nothing   ' 释放对象引用\n\n' 判断对象是否为空\nIf ws Is Nothing Then\n    MsgBox \"对象未初始化\"\nEnd If", "note": "对象比较必须用 `Is` / `Is Not`，不能用 `=`。"}, {"kw": "With", "cn": "对象简化书写", "code": "With Range(\"A1\")\n    .Value = \"标题\"\n    .Font.Bold = True\n    .Font.Size = 16\n    .Interior.Color = RGB(255, 255, 0)\nEnd With", "note": ""}, {"kw": "Me", "cn": "当前对象自身", "code": "' 在 Sheet1 的代码模块中\nPrivate Sub Worksheet_Change(ByVal Target As Range)\n    Me.Range(\"B1\").Value = Now   ' Me = Sheet1 本身\nEnd Sub\n\n' 在用户窗体中\nPrivate Sub UserForm_Click()\n    Me.Caption = \"被点了\"        ' Me = 这个窗体\nEnd Sub", "note": "在**工作表/工作簿模块**或**用户窗体**代码中，`Me` 指代当前对象： ---"}, {"kw": "On Error", "cn": "错误处理开关", "code": "' 1. 出错时跳转到标签\nSub Demo1()\n    On Error GoTo ErrHandler\n    ' ... 可能出错的代码 ...\n    Exit Sub\nErrHandler:\n    MsgBox \"出错：\" & Err.Description\nEnd Sub\n\n' 2. 出错时继续执行下一行（用于可预期的、要逐个处理的情况）\nSub Demo2()\n    On Error Resume Next\n    Workbooks(\"不存在.xlsx\").Close   ' 如果文件没打开也不报错\n    On Error GoTo 0                  ' 恢复默认（报错即中断）\nEnd Sub\n\n' 3. 出错时跳转到下一行（Resume Next 的标签版）\nSub Demo3()\n    On Error GoTo SkipIt\n    ' ...\nSkipIt:\n    Resume Next\nEnd Sub", "note": "三种模式： > `On Error Resume Next` 是双刃剑：它会**吞掉所有错误**。使用后必须立即检查 `Err.Number`，并尽快用 `On Error GoTo 0` 恢复。"}, {"kw": "Resume", "cn": "恢复执行", "code": "Sub Demo()\n    On Error GoTo Handler\n    x = 1 / 0\n    Exit Sub\nHandler:\n    MsgBox \"除数不能为零\"\n    Resume Next        ' 从出错的下一行继续\n    ' Resume           ' 从出错的那一行重试\n    ' Resume ExitHere   ' 跳转到指定标签\nExitHere:\nEnd Sub", "note": ""}, {"kw": "Err", "cn": "错误对象", "code": "Sub ErrDemo()\n    On Error Resume Next\n    Dim n As Long\n    n = \"abc\"                  ' 类型不匹配错误\n\n    If Err.Number <> 0 Then\n        Debug.Print \"错误号：\" & Err.Number         ' 13\n        Debug.Print \"错误描述：\" & Err.Description  ' 类型不匹配\n        Debug.Print \"出错过程：\" & Err.Source\n        Err.Clear                  ' 清除错误状态\n    End If\n    On Error GoTo 0\nEnd Sub", "note": "常见错误号：13（类型不匹配）、9（下标越界）、424（需要对象）、91（对象变量未设置）、1004（Excel 内部错误）。 ---"}, {"kw": "And / Or / Not", "cn": "逻辑运算", "code": "If age >= 18 And age <= 60 Then MsgBox \"劳动年龄\"\nIf city = \"北京\" Or city = \"上海\" Then MsgBox \"一线城市\"\nIf Not done Then MsgBox \"还没完成\"", "note": "注意 VBA 没有短路求值：`If A And B` 中 A、B 都会被计算。"}, {"kw": "True / False", "cn": "布尔字面量", "code": "Dim done As Boolean\ndone = True\nIf done = False Then   ' 也可以写 If Not done Then", "note": ""}, {"kw": "Type", "cn": "自定义数据类型", "code": "' 模块顶部定义\nType Employee\n    Name As String\n    Age As Long\n    Salary As Double\nEnd Type\n\nSub UseType()\n    Dim emp As Employee\n    emp.Name = \"张三\"\n    emp.Age = 30\n    emp.Salary = 8000\n    MsgBox emp.Name & \"的工资是\" & emp.Salary\nEnd Sub", "note": ""}, {"kw": "Enum", "cn": "枚举", "code": "' 模块顶部定义\nEnum WeekDay\n    星期一 = 1\n    星期二 = 2\n    星期三 = 3\nEnd Enum\n\nSub UseEnum()\n    Dim d As WeekDay\n    d = 星期三\n    MsgBox d   ' 显示 3\nEnd Sub", "note": "给一组相关的常量起名字，提高可读性："}], "vba_examples": [{"title": "实例 1：批量重命名工作表", "code": "Option Explicit\n\nSub BatchRenameSheets()\n    Dim ws As Worksheet\n    Dim i As Long\n    Dim newName As String\n\n    Application.DisplayAlerts = False   ' 重命名冲突时不弹窗，由代码处理\n    i = 1\n    For Each ws In ThisWorkbook.Worksheets\n        newName = \"部门_\" & Format(i, \"00\")   ' 部门_01、部门_02...\n        On Error Resume Next                  ' 重名时跳过\n        ws.Name = newName\n        If Err.Number <> 0 Then\n            Debug.Print \"跳过重名：\" & ws.Name\n            Err.Clear\n        End If\n        On Error GoTo 0\n        i = i + 1\n    Next ws\n    Application.DisplayAlerts = True\n\n    MsgBox \"重命名完成，共处理 \" & (i - 1) & \" 个工作表\"\nEnd Sub", "explain": "把工作簿中所有工作表按\"部门_序号\"规则重命名。 **要点**：`Format(i, \"00\")` 把数字格式化为两位数；重名会报错，用错误处理跳过。 ---"}, {"title": "实例 2：合并多个工作簿", "code": "Sub MergeWorkbooks()\n    Dim folder As String\n    Dim fileName As String\n    Dim wb As Workbook\n    Dim targetRow As Long\n    Dim srcRows As Long\n\n    ' 让用户选择文件夹\n    With Application.FileDialog(msoFileDialogFolderPicker)\n        .Title = \"选择要合并的文件夹\"\n        If .Show <> -1 Then Exit Sub\n        folder = .SelectedItems(1) & \"\\\"\n    End With\n\n    Application.ScreenUpdating = False\n    Application.DisplayAlerts = False\n\n    targetRow = 2   ' 目标表第1行是表头，从第2行开始写\n    fileName = Dir(folder & \"*.xlsx\")\n\n    Do While fileName <> \"\"\n        ' 跳过当前工作簿自己\n        If folder & fileName <> ThisWorkbook.FullName Then\n            Set wb = Workbooks.Open(folder & fileName, ReadOnly:=True)\n            ' 找到源表最后一行\n            srcRows = wb.Worksheets(1).Cells(Rows.Count, 1).End(xlUp).Row\n            If srcRows >= 2 Then\n                wb.Worksheets(1).Range(\"A2:Z\" & srcRows).Copy _\n                    Destination:=ThisWorkbook.Worksheets(1).Cells(targetRow, 1)\n                targetRow = targetRow + (srcRows - 1)\n            End If\n            wb.Close SaveChanges:=False\n        End If\n        fileName = Dir()   ' 下一个文件\n    Loop\n\n    Application.ScreenUpdating = True\n    Application.DisplayAlerts = True\n    MsgBox \"合并完成，共写入 \" & (targetRow - 2) & \" 行数据\"\nEnd Sub", "explain": "把指定文件夹下所有 Excel 文件的第一个工作表数据合并到当前工作簿（假设表头都在第 1 行，数据从第 2 行开始）。 **要点**：`Dir()` 函数遍历文件夹；`FileDialog` 让用户选文件夹；记得 `ReadOnly:=True` 打开和用完关闭。 ---"}, {"title": "实例 3：自动生成报表（带格式）", "code": "Sub GenerateReport()\n    Dim src As Worksheet, rpt As Worksheet\n    Dim lastRow As Long, i As Long\n    Dim total As Double\n\n    Set src = ThisWorkbook.Worksheets(\"数据源\")\n\n    ' 删除旧报表（如果存在）\n    On Error Resume Next\n    Application.DisplayAlerts = False\n    ThisWorkbook.Worksheets(\"报表\").Delete\n    Application.DisplayAlerts = True\n    On Error GoTo 0\n\n    Set rpt = ThisWorkbook.Worksheets.Add(After:=src)\n    rpt.Name = \"报表\"\n\n    ' --- 标题区 ---\n    With rpt.Range(\"A1:D1\")\n        .Merge\n        .Value = \"2026年销售报表（\" & Format(Date, \"yyyy-mm-dd\") & \" 生成）\"\n        .Font.Size = 16\n        .Font.Bold = True\n        .HorizontalAlignment = xlCenter\n        .Interior.Color = RGB(0, 112, 192)\n        .Font.Color = RGB(255, 255, 255)\n    End With\n    rpt.Range(\"A1\").RowHeight = 30\n\n    ' --- 表头 ---\n    Dim headers As Variant\n    headers = Array(\"产品\", \"数量\", \"单价\", \"金额\")\n    For i = 0 To 3\n        With rpt.Cells(3, i + 1)\n            .Value = headers(i)\n            .Font.Bold = True\n            .Interior.Color = RGB(217, 217, 217)\n            .HorizontalAlignment = xlCenter\n        End With\n    Next i\n\n    ' --- 数据区 ---\n    lastRow = src.Cells(Rows.Count, 1).End(xlUp).Row\n    total = 0\n    For i = 2 To lastRow\n        rpt.Cells(i + 2, 1).Value = src.Cells(i, 1).Value   ' 产品\n        rpt.Cells(i + 2, 2).Value = src.Cells(i, 2).Value   ' 数量\n        rpt.Cells(i + 2, 3).Value = src.Cells(i, 3).Value   ' 单价\n        rpt.Cells(i + 2, 4).Formula = \"=B\" & (i + 2) & \"*C\" & (i + 2)  ' 金额公式\n        total = total + src.Cells(i, 2).Value * src.Cells(i, 3).Value\n    Next i\n\n    ' --- 汇总行 ---\n    Dim sumRow As Long\n    sumRow = lastRow + 3\n    With rpt.Range(\"A\" & sumRow & \":C\" & sumRow)\n        .Merge\n        .Value = \"合计\"\n        .Font.Bold = True\n        .HorizontalAlignment = xlRight\n    End With\n    rpt.Cells(sumRow, 4).Value = total\n    rpt.Cells(sumRow, 4).Font.Bold = True\n    rpt.Cells(sumRow, 4).NumberFormat = \"#,##0.00\"\n\n    ' --- 收尾 ---\n    rpt.Range(\"A3:D\" & sumRow).BorderAround LineStyle:=xlContinuous, Weight:=xlMedium\n    rpt.Range(\"A3:D\" & sumRow).Borders.LineStyle = xlContinuous\n    rpt.Columns(\"A:D\").AutoFit\n\n    MsgBox \"报表已生成，共 \" & (lastRow - 1) & \" 条数据，合计 \" & Format(total, \"#,##0.00\")\nEnd Sub", "explain": "从\"数据源\"表读取销售数据，生成带标题、格式、汇总行的\"报表\"表。 **要点**：先删旧表再建新表；金额列用公式而不是写死值，源数据变了报表自动更新。 ---"}, {"title": "实例 4：查找替换增强版", "code": "Sub BatchReplace()\n    Dim mapWs As Worksheet, dataWs As Worksheet\n    Dim lastMap As Long, i As Long\n    Dim findStr As String, replStr As String\n    Dim count As Long, totalCount As Long\n\n    ' 对照表：A列=查找内容，B列=替换为\n    Set mapWs = ThisWorkbook.Worksheets(\"对照表\")\n    Set dataWs = ThisWorkbook.Worksheets(\"数据\")\n\n    lastMap = mapWs.Cells(Rows.Count, 1).End(xlUp).Row\n    totalCount = 0\n\n    Application.ScreenUpdating = False\n    For i = 2 To lastMap\n        findStr = CStr(mapWs.Cells(i, 1).Value)\n        replStr = CStr(mapWs.Cells(i, 2).Value)\n        If findStr <> \"\" Then\n            ' 先数有多少个，再替换\n            count = Application.WorksheetFunction.CountIf(dataWs.UsedRange, \"*\" & findStr & \"*\")\n            dataWs.UsedRange.Replace What:=findStr, Replacement:=replStr, _\n                LookAt:=xlPart, MatchCase:=False\n            totalCount = totalCount + count\n            Debug.Print findStr & \" -> \" & replStr & \"（约\" & count & \"处）\"\n        End If\n    Next i\n    Application.ScreenUpdating = True\n\n    MsgBox \"批量替换完成，共处理 \" & (lastMap - 1) & \" 组规则\"\nEnd Sub", "explain": "普通查找替换一次只能处理一个词。这个版本批量处理\"对照表\"中的多组替换，并报告替换次数。 **要点**：`Replace` 的 `LookAt:=xlPart` 表示部分匹配；`CountIf` 配通配符 `*` 先统计。 ---"}, {"title": "实例 5：数据去重", "code": "Sub RemoveDuplicates()\n    Dim ws As Worksheet\n    Dim lastRow As Long\n    Dim beforeCount As Long\n\n    Set ws = ActiveSheet\n    lastRow = ws.Cells(Rows.Count, 1).End(xlUp).Row\n    beforeCount = lastRow\n\n    If lastRow < 2 Then\n        MsgBox \"没有数据可处理\"\n        Exit Sub\n    End If\n\n    ' 按A列去重（多列去重传数组，如 Array(1, 2) 表示按A、B列组合去重）\n    ws.Range(\"A1:Z\" & lastRow).RemoveDuplicates Columns:=1, Header:=xlYes\n\n    lastRow = ws.Cells(Rows.Count, 1).End(xlUp).Row\n    MsgBox \"去重完成，删除了 \" & (beforeCount - lastRow) & \" 行重复数据\"\nEnd Sub", "explain": "删除指定列的重复行，保留第一次出现的，并报告删除了多少行。 **要点**：`RemoveDuplicates` 是 Excel 2007+ 的内置方法，比自己写循环快得多；`Header:=xlYes` 表示第一行是表头不参与去重。 ---"}, {"title": "实例 6：批量插入图片", "code": "Sub BatchInsertPictures()\n    Dim folder As String\n    Dim fileName As String\n    Dim pic As Picture\n    Dim row As Long\n    Dim ext As String\n\n    With Application.FileDialog(msoFileDialogFolderPicker)\n        .Title = \"选择图片文件夹\"\n        If .Show <> -1 Then Exit Sub\n        folder = .SelectedItems(1) & \"\\\"\n    End With\n\n    Application.ScreenUpdating = False\n    row = 2\n    ' A1写表头\n    Range(\"A1\").Value = \"图片\"\n    Range(\"B1\").Value = \"文件名\"\n\n    fileName = Dir(folder & \"*.*\")\n    Do While fileName <> \"\"\n        ext = LCase(Right(fileName, 4))\n        If ext = \".jpg\" Or ext = \"jpeg\" Or ext = \".png\" Or ext = \".bmp\" Or ext = \".gif\" Then\n            ' 插入图片\n            Set pic = ActiveSheet.Pictures.Insert(folder & fileName)\n            With pic\n                .Top = Cells(row, 1).Top + 2\n                .Left = Cells(row, 1).Left + 2\n                .Height = 80\n                ' 按比例缩放宽度\n                .Width = .Width * (80 / .Height)\n                .Placement = xlMoveAndSize   ' 图片随单元格移动和缩放\n            End With\n            Cells(row, 1).RowHeight = 84\n            Cells(row, 2).Value = fileName\n            row = row + 1\n        End If\n        fileName = Dir()\n    Loop\n\n    Columns(\"A\").ColumnWidth = 20\n    Application.ScreenUpdating = True\n    MsgBox \"共插入 \" & (row - 2) & \" 张图片\"\nEnd Sub", "explain": "把文件夹中的图片按文件名顺序插入到工作表，每行一张，自动调整行高列宽。 **要点**：`Pictures.Insert` 插入图片；设置 `.Placement = xlMoveAndSize` 让图片跟随单元格；先定高度再按比例算宽度避免变形。 ---"}, {"title": "实例 7：发送邮件（Outlook）", "code": "Sub SendMailViaOutlook()\n    Dim olApp As Object\n    Dim olMail As Object\n    Dim ws As Worksheet\n    Dim lastRow As Long, i As Long\n    Dim toAddr As String, subject As String, body As String\n    Dim attachPath As String\n    Dim sentCount As Long\n\n    ' 收件人清单：A列=邮箱，B列=姓名\n    Set ws = ThisWorkbook.Worksheets(\"收件人\")\n    lastRow = ws.Cells(Rows.Count, 1).End(xlUp).Row\n    attachPath = ThisWorkbook.Path & \"\\报表.pdf\"   ' 附件路径（需提前存在）\n\n    ' 后期绑定：不需要引用 Outlook 库，换电脑也能跑\n    On Error Resume Next\n    Set olApp = GetObject(, \"Outlook.Application\")\n    If olApp Is Nothing Then\n        Set olApp = CreateObject(\"Outlook.Application\")\n    End If\n    On Error GoTo 0\n\n    If olApp Is Nothing Then\n        MsgBox \"未检测到 Outlook，请先安装并配置\"\n        Exit Sub\n    End If\n\n    sentCount = 0\n    For i = 2 To lastRow\n        toAddr = Trim(CStr(ws.Cells(i, 1).Value))\n        If toAddr Like \"*@*\" Then   ' 简单校验邮箱格式\n            Set olMail = olApp.CreateItem(0)   ' 0 = 邮件\n            With olMail\n                .To = toAddr\n                .Subject = \"2026年销售报表\"\n                .Body = ws.Cells(i, 2).Value & \"，你好：\" & vbCrLf & vbCrLf _\n                      & \"附件是本月销售报表，请查收。\" & vbCrLf & vbCrLf _\n                      & \"报表系统（自动发送）\"\n                If Dir(attachPath) <> \"\" Then\n                    .Attachments.Add attachPath\n                End If\n                .Send   ' 改成 .Display 可先预览不直接发\n            End With\n            sentCount = sentCount + 1\n        End If\n    Next i\n\n    Set olMail = Nothing\n    Set olApp = Nothing\n    MsgBox \"发送完成，共发送 \" & sentCount & \" 封\"\nEnd Sub", "explain": "把报表作为附件，用 Outlook 自动发送给收件人列表。 **要点**： - 用 `CreateObject(\"Outlook.Application\")` 后期绑定，不用手动加引用。 - 测试时先用 `.Display` 预览，确认无误再改 `.Send`。"}, {"title": "实例 8：自定义函数（UDF）", "code": "Option Explicit\n\n' 1. 提取身份证中的出生日期\n' 用法：=GetBirth(A1)\nFunction GetBirth(idCard As String) As String\n    Dim s As String\n    s = Trim(idCard)\n    If Len(s) = 18 Then\n        GetBirth = Mid(s, 7, 4) & \"-\" & Mid(s, 11, 2) & \"-\" & Mid(s, 13, 2)\n    ElseIf Len(s) = 15 Then\n        GetBirth = \"19\" & Mid(s, 7, 2) & \"-\" & Mid(s, 9, 2) & \"-\" & Mid(s, 11, 2)\n    Else\n        GetBirth = \"身份证号无效\"\n    End If\nEnd Function\n\n' 2. 判断是否为周末\n' 用法：=IsWeekend(A1)\nFunction IsWeekend(d As Date) As Boolean\n    Dim w As Long\n    w = Weekday(d, vbMonday)   ' 以周一为一周开始\n    IsWeekend = (w >= 6)\nEnd Function\n\n' 3. 人民币大写转换\n' 用法：=RMBUpper(A1)\nFunction RMBUpper(amount As Double) As String\n    Dim digits As Variant, units As Variant\n    Dim s As String, i As Long, result As String\n    Dim n As Long, digit As Long\n\n    digits = Array(\"\", \"壹\", \"贰\", \"叁\", \"肆\", \"伍\", \"陆\", \"柒\", \"捌\", \"玖\")\n    units = Array(\"\", \"拾\", \"佰\", \"仟\")\n\n    If amount < 0 Or amount >= 100000 Then\n        RMBUpper = \"超出范围\"\n        Exit Function\n    End If\n\n    n = Int(amount)\n    s = CStr(n)\n    result = \"\"\n    For i = 1 To Len(s)\n        digit = Val(Mid(s, i, 1))\n        If digit <> 0 Then\n            result = result & digits(digit) & units(Len(s) - i)\n        Else\n            ' 避免连续多个零\n            If Right(result, 1) <> \"零\" And i < Len(s) Then\n                result = result & \"零\"\n            End If\n        End If\n    Next i\n\n    ' 处理小数部分\n    Dim cents As Long\n    cents = Round((amount - n) * 100)\n    If cents = 0 Then\n        result = result & \"元整\"\n    Else\n        Dim jiao As Long, fen As Long\n        jiao = cents \\ 10\n        fen = cents Mod 10\n        result = result & \"元\"\n        If jiao > 0 Then result = result & digits(jiao) & \"角\"\n        If fen > 0 Then result = result & digits(fen) & \"分\"\n    End If\n\n    ' 清理多余的零\n    Do While InStr(result, \"零零\") > 0\n        result = Replace(result, \"零零\", \"零\")\n    Loop\n    result = Replace(result, \"零元\", \"元\")\n    If Left(result, 1) = \"零\" Then result = Mid(result, 2)\n\n    RMBUpper = result\nEnd Function", "explain": "写在标准模块中的 `Function` 可直接在单元格公式中使用。下面是三个实用的自定义函数。 **UDF 注意事项**： 1. 必须写在**标准模块**（不是工作表模块/Sheet 代码区）。 2. 不能修改其他单元格的值/格式，只能返回一个值（可以返回数组形成动态数组）。"}], "shortcuts": [{"cat": "导航（14 个）", "keys": [{"key": "`Ctrl + 方向键`", "desc": "跳到当前数据区域边缘（连续按穿越整张表）", "hot": true}, {"key": "`Ctrl + Home`", "desc": "回到 A1", "hot": true}, {"key": "`Ctrl + End`", "desc": "跳到已用区域右下角", "hot": true}, {"key": "`PageUp / PageDown`", "desc": "上/下翻一屏", "hot": false}, {"key": "`Alt + PageUp / PageDown`", "desc": "左/右翻一屏", "hot": false}, {"key": "`Ctrl + PageUp / PageDown`", "desc": "上一个/下一个工作表", "hot": false}, {"key": "`F5` 或 `Ctrl + G`", "desc": "定位（跳到指定单元格/区域）", "hot": false}, {"key": "`Ctrl + Backspace`", "desc": "滚动回当前活动单元格（看丢了时用）", "hot": false}, {"key": "`Tab / Shift+Tab`", "desc": "右/左移一格", "hot": false}, {"key": "`Enter / Shift+Enter`", "desc": "下/上移一格", "hot": false}, {"key": "`Home`", "desc": "回到本行 A 列", "hot": false}, {"key": ue}, {"key": "`Ctrl + 1`", "desc": "打开设置单元格格式对话框", "hot": true}, {"key": "`Alt + H, H`", "desc": "打开颜色选择（填充色）", "hot": false}, {"key": "`Ctrl + Shift + ~`", "desc": "常规数字格式", "hot": false}, {"key": "`Ctrl + Shift + $`", "desc": "货币格式（两位小数）", "hot": false}, {"key": "`Ctrl + Shift + %`", "desc": "百分比格式", "hot": false}, {"key": "`Ctrl + Shift + #`", "desc": "日期格式（日-月-年）", "hot": false}, {"key": "`Ctrl + Shift + @`", "desc": "时间格式", "hot": false}, {"key": "`Ctrl + Shift + !`", "desc": "千分位数值格式（两位小数）", "hot": false}, {"key": "`Ctrl + 9 / 0`", "desc": "隐藏行/隐藏列", "hot": false}, {"key": "`Ctrl + Shift + 9 / 0`", "desc": "取消隐藏行/列", "hot": false}]}, {"cat": "公式（14 个）", "keys": [{"key": "`=`", "desc": "开始输入公式", "hot": true}, {"key": "`F4`", "desc": "切换引用方式（A1 → $A$1 → A$1 → $A1 循环）", "hot": true}, {"key": "`Ctrl + Shift + Enter`", "desc": "输入数组公式（旧版本）", "hot": true}, {"key": "`Alt + =`", "desc": "自动求和（SUM）", "hot": true}, {"key": "`Shift + F3`", "desc": "插入函数对话框", "hot": false}, {"key": "`Ctrl + Shift + A`", "desc": "输入函数名后，插入参数名和括号", "hot": false}, {"key": "`F9`", "desc": "计算所有工作表", "hot": false}, {"key": "`Shift + F9`", "desc": "只计算当前工作表", "hot": false}, {"key": "`Ctrl + `` ` ``", "desc": "显示公式/显示结果 切换（` 是 Tab 上方那个键）", "hot": false}, {"key": "`Ctrl + [`", "desc": "追踪引用单元格（跳到公式引用的格）", "hot": false}, {"key": "`Ctrl + ]`", "desc": "追踪从属单元格（谁引用了我）", "hot": false}, {"key": "`Esc` 后 `F9` 技巧", "desc": "在编辑栏选中公式片段按 F9，查看该片段的计算结果（调试公式神器）", "hot": false}, {"key": "`Alt + Enter`", "desc": "公式太长时在编辑栏内换行（仅显示效果）", "hot": false}, {"key": "`Tab`", "desc": "输入函数名前几个字母后按 Tab，自动补全", "hot": false}]}, {"cat": "数据透视表（8 个）", "keys": [{"key": "`Alt + N, V`", "desc": "新建数据透视表", "hot": false}, {"key": "`Alt + J, T, L`", "desc": "刷新透视表", "hot": false}, {"key": "`Alt + J, T, J`", "desc": "显示字段列表窗格", "hot": false}, {"key": "`Ctrl + -`", "desc": "删除透视表字段（选中字段时）", "hot": false}, {"key": "`Alt + ↓`", "desc": "打开筛选下拉（在字段标题单元格按）", "hot": false}, {"key": "`Tab`", "desc": "在透视表字段窗格内移动", "hot": false}, {"key": "`Shift + F10`", "desc": "右键菜单（值字段设置/组合都在这）", "hot": false}, {"key": "`Alt + A, C`", "desc": "清除透视表筛选", "hot": false}]}, {"cat": "通用与文件（10 个）", "keys": [{"key": "`Ctrl + S`", "desc": "保存（养成习惯，3 分钟一次）", "hot": true}, {"key": "`Ctrl + N / O / P`", "desc": "新建/打开/打印", "hot": false}, {"key": "`Ctrl + W`", "desc": "关闭当前工作簿", "hot": false}, {"key": "`F12`", "desc": "另存为", "hot": false}, {"key": "`Ctrl + F / H`", "desc": "查找/替换", "hot": false}, {"key": "`Ctrl + T`", "desc": "转为智能表格（透视表前置步骤）", "hot": false}, {"key": "`Alt + E, S, V`", "desc": "选择性粘贴为数值（去公式留结果）", "hot": false}, {"key": "`F1`", "desc": "帮助", "hot": false}, {"key": "`Alt`", "desc": "显示功能区快捷键提示（按字母操作菜单，不用鼠标）", "hot": false}, {"key": "`Ctrl + 鼠标滚轮`", "desc": "缩放工作表", "hot": false}]}], "advanced": [{"id": "pivottable", "title": "数据透视表", "sections": [{"title": "1. 为什么用数据透视表", "body": "想象你有一张 5000 行的销售明细：日期、销售员、产品、金额。老板问：\"每个销售员每个月的销售额是多少？\"\n- 不用透视表：写一堆 SUMIFS，还要手动列出所有销售员和月份，容易漏。\n- 用透视表：**拖三下鼠标，3 秒出结果**。源数据增删行后点一下\"刷新\"即可更新。\n核心思想：**把\"分组+聚合\"这个动作交给 Excel**，你只负责告诉它\"按什么分组、对什么求和\"。"}, {"title": "2. 创建步骤", "body": "1. 点击源数据区域任意单元格（确保数据是规范的二维表：第一行是标题行，无合并单元格、无空行空列）。\n2. 「插入」→「数据透视表」。\n3. 选择放置位置：建议选\"新工作表\"，报表和源数据分开更清爽。\n4. 右侧出现「数据透视表字段」窗格，开始拖字段。\n> 数据规范是透视表好用的前提：一列只放一种含义的数据，日期列全是日期，不要出现\"合计\"行混在明细里。"}, {"title": "3. 四个区域详解", "body": "操作要点：\n- 同一字段可以拖到多个区域（如\"日期\"同时拖到行和筛选器）。\n- 拖错了直接把字段拖出窗格即可移除。\n- 字段顺序决定层级：行区域里\"年份\"在上、\"月份\"在下，就是先按年再按月展开。"}, {"title": "4. 值汇总方式", "body": "默认对数字字段\"求和\"，对文本字段\"计数\"。右键值字段 →「值字段设置」可切换：\n**显示方式**（同一对话框的「值显示方式」选项卡，更实用）：\n- **占总和的百分比**：每个销售员占总销售额的比例。\n- **父行汇总的百分比**：某产品占其所属类别的比例。\n- **差异**：本月 vs 上月的差额（需配合日期分组）。\n- **差异百分比**：环比增长率——做月报的神器。"}, {"title": "5. 分组", "body": "### 日期分组\n右键行区域的日期字段 →「组合」：\n- 按月：选\"月\"，自动按年月分组。\n- 按季度+年：同时勾选\"季度\"和\"年\"。\n- 按周：选\"日\"，天数填 7。\n### 数字分组\n右键数字字段 →「组合」：如把年龄按 10 岁一段分组（起始 20，终止 60，步长 10），快速做年龄段分布。"}, {"title": "6. 切片器与时间线", "body": "- **切片器**：「数据透视表分析」→「插入切片器」→ 勾选字段（如\"产品类别\"）。生成一排可点击的按钮，点选即筛选，比下拉框直观，适合做仪表盘。\n- **时间线**：专门用于日期字段，拖动滑块筛选时间段。\n- 一个切片器可以同时控制**多个**透视表：右键切片器 →「报表连接」，勾选其他透视表——做联动仪表盘的核心技巧。"}]}, {"id": "array-formulas", "title": "数组公式", "sections": [{"title": "1. 先理解\"数组\"是什么", "body": "数组就是\"一串值\"。`{1,2,3}` 是横向数组，`{1;2;3}` 是纵向数组（分号换行）。Excel 公式本来就是按数组思维设计的：\n[代码示例]\n这行公式的含义是\"把 A1、A2、A3 每个都乘以 2\"，得到 `{A1*2, A2*2, A3*2}`。普通公式只显示第一个结果，数组公式则能把全部结果\"摊开\"显示。"}, {"title": "2. 传统数组公式（Ctrl+Shift+Enter）", "body": "在旧版本 Excel 里，想让公式返回多个结果：\n1. 先选中**多个**单元格（结果要占几格就选几格）。\n2. 输入公式，如 `=A1:A3*2`。\n3. 按 **Ctrl+Shift+Enter**（不是只按 Enter）。\n公式两端会自动加上花括号 `{=A1:A3*2}`，表示这是数组公式。**花括号是 Excel 自己加的，手工输入无效。**\n经典用途——多条件计数（COUNTIFS 出现之前的写法，现在仍有人用）：\n[代码示例]\n原理：`(A2:A100=\"销售部\")` 得到一串 TRUE/FALSE，`(B2:B100>5000)` 得到另一串，两串相乘（TRUE=1、FALSE=0），只有两个条件都成立的位置是 1，SUM 加总即为同时满足的人数。"}, {"title": "3. 动态数组：新时代的写法", "body": "Microsoft 365 引入动态数组后，**只按 Enter**，结果自动\"溢出\"到相邻单元格。不再需要三键，也不再需要预选区域。\n### FILTER：按条件筛选\n[代码示例]\n返回 B 列等于\"销售部\"的所有行（A:C 三列）。做\"部门人员清单\"一公式搞定，源数据增减行自动更新。\n加\"无结果\"提示：\n[代码示例]\n### SORT：排序\n[代码示例]"}, {"title": "4. #溢出! 错误处理", "body": "当动态数组的结果没地方\"摊开\"时，报 `#溢出!`。常见原因和解法：\n`#` 引用是动态数组时代的重要符号：公式结果变长变短，`A2#` 自动跟着变，SUM 永远求和的是最新结果。"}, {"title": "5. 实战案例", "body": "### 案例 1：多条件求和（替代 SUMIFS 的数组思路）\n统计\"销售部\"且\"金额>5000\"的总额：\n[代码示例]\n普通 Enter 即可（365 会自动按数组算）。\n### 案例 2：动态部门筛选器\n[代码示例]\nF1 做下拉选部门，右侧自动列出该部门所有人——简易查询系统。\n### 案例 3：自动去重+计数"}, {"title": "6. 新旧对照速查", "body": ""}]}, {"id": "powerquery", "title": "Power Query", "sections": [{"title": "1. Power Query 是什么", "body": "它是 Excel 里的一个**数据加工流水线**：你把\"获取→清洗→整理\"的每一步操作点一遍，Power Query 会把步骤记下来。下个月拿到新的源文件，点一下\"刷新\"，所有步骤自动重跑一遍。\n和公式的区别：\n- 公式是\"算出一个结果\"，Power Query 是\"产出一张干净的表\"。\n- 公式适合行内计算；Power Query 适合**结构性整理**：拆分列、转置、合并文件、逆透视——这些用公式写会很痛苦。\n核心观念：**你点的每一步都会变成一行 M 代码**，记录在右侧「应用的步骤」里。可以回头修改、删除、调整顺序。"}, {"title": "2. 获取数据", "body": "「数据」→「获取数据」，来源非常多：\n选中来源后点「转换数据」进入 Power Query 编辑器，开始清洗。"}, {"title": "3. 常用清洗步骤", "body": "### 拆分列\n一列里混着\"省-市-区\"？选中列 →「拆分列」→「按分隔符」→ 输入 `-`。一列变三列。也可以按固定宽度、按大小写转换处拆分。\n### 替换值\n选中列 → 右键 →「替换值」：把\"男/女\"换成\"M/F\"，把\"N/A\"换成空。支持整列批量。\n### 填充\n导出的报表经常只有第一行有\"部门\"名，下面是空的（合并单元格拆开后的样子）。选中列 →「转换」→「填充」→「向下」。空单元格自动填上上方的值，透视表分组的前提。\n### 更改类型\n每列顶上有个类型图标（ABC/123/日历）。点它把文本改成数字、日期。**类型不对会导致求和变计数、日期无法分组**，清洗时务必检查。"}, {"title": "4. 合并查询：比 VLOOKUP 更强的关联", "body": "场景：A 表是订单（有\"客户编号\"），B 表是客户档案（\"客户编号\"→\"客户名称\"），想给订单带上客户名称。\n1. 在编辑器里选中订单查询 →「合并查询」。\n2. 上表选\"客户编号\"，下表选\"客户档案\"的\"客户编号\"（点列表头选中，两边都要点）。\n3. 联接种类选\"左外部\"（保留订单全部行，档案对不上的留空——对应 VLOOKUP 的精确匹配）。\n4. 确定后多出一列，点列头的展开按钮，勾选\"客户名称\"。\n比 VLOOKUP 强的点：\n- **可按多列关联**：Ctrl+点选多个列头，一次按\"省+市\"两列匹配，VLOOKUP 要拼辅助列。\n- **模糊匹配**：联接时勾选\"模糊匹配\"，自动处理\"北京\"vs\"北京市\"这种差异，还能设相似度阈值。"}, {"title": "5. 追加查询：纵向堆叠", "body": "场景：12 个月的销售表结构相同，要拼成一张全年表。\n「追加查询」→ 选\"三个或更多表\" → 把 12 个表都加进来。列名相同的自动对齐，某表多出的列会以空值补齐。\n**从文件夹追加**（更常用）：「获取数据」→「从文件夹」→ 选存放 12 个文件的文件夹 →「合并和转换」。以后每月往文件夹里丢新文件，刷新一次全进来——月报自动化。"}, {"title": "6. 透视列与逆透视列", "body": "### 逆透视（Unpivot）：把交叉表\"拆长\"\n源数据是\"姓名×12个月\"的矩阵（1 月、2 月…各一列），透视表吃不了这种格式。\n选中 12 个月份列 → 右键 →「逆透视列」。变成三列：姓名、月份、销售额。**这是 Power Query 最经典的用途之一。**\n### 透视列（Pivot）：反向操作\n把\"月份、销售额\"两列转回交叉表：选中\"月份\"列 →「透视列」→ 值列选\"销售额\"、聚合选\"求和\"。"}]}, {"id": "conditional-formatting", "title": "条件格式", "sections": [{"title": "1. 核心原理", "body": "条件格式 = **\"规则\" + \"格式\"**。规则判断每个单元格\"达不达标\"，达标就套用你设的格式（红底、加粗等）。\n关键理解：**格式是\"活\"的**。单元格的值变了，格式自动跟着变——和你手工涂色有本质区别。删掉规则（「开始」→「条件格式」→「清除规则」）就恢复原样，不破坏数据。\n操作入口：「开始」→「条件格式」。先**选中要应用的区域**再设规则，这点最重要。"}, {"title": "2. 内置规则：突出显示单元格规则", "body": "最常用的一类：「条件格式」→「突出显示单元格规则」：\n每个规则点开后选格式（浅红填充深红文本等），也可以点「自定义格式」自己配。"}, {"title": "3. 数据条：在单元格里画\"进度条\"", "body": "「条件格式」→「数据条」→ 选一种颜色。数值越大，条越长。\n- 适合：完成率、销售额对比——一眼看出谁高谁低，不用看数字。\n- 技巧：勾选「仅显示数据条」（管理规则→编辑规则），隐藏数字，只留条形，更像仪表盘。\n- 注意：数据条的长度是按**选中区域内的最大/最小值**自动缩放的，区域不同不能直接比长短。"}, {"title": "4. 色阶：热力图", "body": "「条件格式」→「色阶」→ 如\"绿-黄-红\"。数值映射到颜色渐变，**适合看分布**：\n- 12 个月的销售热力图，旺季月份自动变红。\n- 学生成绩表，一眼看出哪科普遍偏低。\n双色刻度和三色刻度：三色多一个中间色，适合\"中间值也想区分\"的场景。"}, {"title": "5. 图标集：红绿灯", "body": "「条件格式」→「图标集」→ 如\"三色旗/红绿灯\"。数值分三档，分别显示 ●●●。\n默认按百分比划分（67%/33%），想按绝对值：管理规则 → 编辑规则 → 类型改成\"数字\"，填阈值。如：完成率 ≥100% 绿灯、≥80% 黄灯、<80% 红灯。"}, {"title": "6. 重点：自定义公式规则", "body": "内置规则不够用时，用公式。入口：「条件格式」→「新建规则」→「使用公式确定要设置格式的单元格」。\n**核心心法**：公式是**相对选中区域左上角**写的。选中 A2:D100 后写公式，公式里的 A2 指\"当前正在判断的行的 A 列\"。Excel 会把公式逐行（逐格）套用一遍。\n### 示例 1：整行标红（金额>10000 的行整行变红）\n选中 A2:D100，公式：\n[代码示例]\n`$C` 锁定列（每行都看 C 列），`2` 不锁定行（随行变化）。这就是整行格式化的标准写法：**列锁定、行不锁定**。\n### 示例 2：标出重复值（内置规则只能标单元格，公式可标整行）\n[代码示例]"}]}, {"id": "data-validation", "title": "数据验证", "sections": [{"title": "1. 数据验证是什么", "body": "「数据」→「数据验证」。它在**输入的那一刻**拦截不合法的值，而不是事后检查。\n三个可配置项：\n1. **设置**：允许输入什么（整数/小数/日期/序列/文本长度…）。\n2. **输入信息**：选中单元格时弹出的提示（\"请输入 1-100 的整数\"）——主动引导。\n3. **出错警告**：输错时的弹窗，样式可选\"停止\"（硬拦截）/\"警告\"（可继续）/\"信息\"（仅提醒）。"}, {"title": "2. 下拉列表（最常用）", "body": "### 固定选项\n选中单元格 → 数据验证 → 允许「序列」→ 来源填 `男,女`（中文逗号不行，必须用**英文逗号**分隔）。单元格右侧出现下拉箭头。\n### 引用区域\n来源填 `=$F$2:$F$10`（部门清单）。清单变了下拉自动变。建议把清单放在单独的\"基础数据\"表，隐藏起来。\n### 动态二级联动：选\"省\"后\"市\"跟着变\n这是数据验证的经典难题，标准解法是 **INDIRECT + 命名区域**：\n1. 准备对照表：A 列是省名（广东、江苏…），B 列开始每列是一个省的城市，第一行是省名。\n2. 给每个省的城市区域**定义名称**：选中广东的城市 → 名称框输入 `广东` → 回车。注意名称不能含空格，省名有空格先替换。"}, {"title": "3. 输入限制", "body": "自定义公式的心法和条件格式一样：**相对左上角写**。选中 B2:B100 后公式写 `=LEN(B2)=11`，表示\"本单元格长度必须 11\"。"}, {"title": "4. 圈释无效数据", "body": "数据验证只拦**新输入**，历史脏数据怎么办？「数据」→「数据验证」→「圈释无效数据」。所有违反规则的旧数据会被红圈圈出来，改完后「清除无效数据标识」去掉圈。\n用途：接手别人的表，先圈一遍，脏数据一目了然。"}, {"title": "5. 工作表保护：锁公式、开放录入区", "body": "场景：模板发给 20 个人填，只允许填黄色区域，公式列不许碰。\n1. **先解锁录入区**：选中允许填写的单元格 → 右键「设置单元格格式」→「保护」→ **取消勾选\"锁定\"**。默认所有单元格都是\"锁定\"状态，但不保护时锁无效。\n2. 「审阅」→「保护工作表」→ 设密码 → 勾选允许的操作（一般保留\"选定未锁定的单元格\"）。\n3. 效果： locked 的公式格点不进去，未锁定的可填。有人想改公式？弹密码框。\n取消：审阅 → 撤销工作表保护 → 输密码。"}, {"title": "6. 允许编辑区域：多人分工", "body": "保护工作表是一刀切，\"允许编辑区域\"可以**按区域设不同密码**：\n「审阅」→「允许编辑区域」→「新建」：\n- 区域 A1:B10，密码 111 → 销售部用密码 111 可改\n- 区域 C1:D10，密码 222 → 财务部用密码 222 可改\n每人只能改自己的区，保护工作表后依然有效。适合部门分工录入同一张表。"}]}], "basics": [{"id": "interface", "title": "认识 Excel 界面", "level": "入门", "body": "标题栏→功能区（选项卡+命令组）→编辑栏（显示/输入公式）→工作表区（行列交叉为单元格，如 B3）→工作表标签（底部切换/新增）→状态栏（快速看求和/平均）。记住：名称框可直接输入 B100 跳转，编辑栏是公式的家。", "steps": ["打开 Excel，观察功能区：文件/开始/插入/页面布局/公式/数据/审阅/视图", "点击名称框输入 D20，回车直接跳转", "在编辑栏输入 =1+2，回车看结果"]}, {"id": "enter", "title": "数据录入技巧", "level": "入门", "body": "Enter 下移、Tab 右移、Shift+Enter 上移。选中区域后按 Enter 在区域内循环。Ctrl+Enter 批量填充选中区域。Alt+↓ 调出下拉历史。Ctrl+; 输入今天日期，Ctrl+Shift+; 输入当前时间。", "steps": ["选中 A1:A10，输入内容后按 Ctrl+Enter 批量填充", "按 Ctrl+; 快速输入今天日期", "用 Alt+↓ 在已有列表中快速选择"]}, {"id": "format", "title": "单元格格式", "level": "入门", "body": "数字格式决定显示方式：常规/数值/货币/百分比/日期。Ctrl+1 打开设置单元格格式对话框。对齐、字体、边框、填充都在「开始」选项卡。格式刷（双击可多次使用）是排版神器。", "steps": ["选中金额列，按 Ctrl+Shift+4 设为货币格式", "选中日期列，Ctrl+1 设为日期格式", "双击格式刷，把标题格式刷到多个地方"]}, {"id": "sortfilter", "title": "排序与筛选", "level": "入门", "body": "筛选（Ctrl+Shift+L）：按条件只显示想要的行，箭头图标点开设条件。排序：按某列升序/降序，多关键字排序用「自定义排序」。注意：排序前先选中整个数据区域，否则会错乱！", "steps": ["选中表头，按 Ctrl+Shift+L 开启筛选", "点箭头，只勾选「销售部」", "按销售额列降序排列"]}, {"id": "print", "title": "打印设置", "level": "入门", "body": "页面布局→打印标题（顶端标题行每页重复）→设置打印区域→分页预览拖蓝线。页眉页脚加页码。打印前一定用「打印预览」检查。", "steps": ["页面布局→打印标题，设置顶端标题行", "选中区域→页面布局→打印区域→设置", "视图→分页预览，拖动蓝线调整"]}], "charts": [{"id": "choose", "title": "图表类型选择指南", "level": "进阶", "body": "比较大小用柱状图/条形图，看趋势用折线图，看占比用饼图/环形图（类别≤6），看关系用散点图/气泡图，看分布用直方图/箱线图。双坐标用组合图。记住：一图只讲一件事。", "types": [{"name": "柱状图", "use": "比较各类别数值大小", "example": "各部门销售额对比"}, {"name": "折线图", "use": "看随时间变化的趋势", "example": "12 个月营收走势"}, {"name": "饼图", "use": "看各部分占比（≤6 类）", "example": "市场份额"}, {"name": "条形图", "use": "类别名称长时的比较", "example": "产品线排名"}, {"name": "散点图", "use": "看两个变量的关系", "example": "广告费 vs 销售额"}, {"name": "面积图", "use": "看累计趋势", "example": "累计用户增长"}, {"name": "雷达图", "use": "多维度综合评价", "example": "员工能力六维图"}, {"name": "组合图", "use": "两个量级不同的序列", "example": "销售额（柱）+增长率（线）"}]}, {"id": "make", "title": "图表制作步骤", "level": "进阶", "body": "选中数据→插入→选图表类型→切换行列（数据反了就点它）→添加数据标签→调坐标轴。数据源：右键→选择数据，可增删系列。", "steps": ["选中数据区域（含表头）", "插入→柱状图→簇状柱形图", "右键图表→添加数据标签", "双击坐标轴调整刻度"]}, {"id": "beauty", "title": "图表美化技巧", "level": "高级", "body": "删网格线、删图例（直接标数据）、统一配色（莫兰迪/商务蓝）、加粗标题讲结论、坐标轴从 0 开始（柱状图）。少即是多：每删一个元素，图表清晰一度。", "steps": ["选中网格线按 Delete 删除", "把图例删掉，直接在柱子上标数值", "标题改成结论句，如「Q3 华东区增长最快」"]}, {"id": "dynamic", "title": "动态图表", "level": "高级", "body": "下拉菜单联动图表：数据验证做下拉→INDEX+MATCH 取数→图表数据源引用。用复选框控制系列显示。用 OFFSET 做动态区域，新增数据自动进图。", "steps": ["用数据验证做月份下拉菜单", "用 INDEX+MATCH 根据选择取数", "图表数据源指向取数区域"]}], "scenarios": [{"id": "finance", "title": "财务报销统计", "level": "进阶", "desc": "每月上百条报销记录，自动汇总到部门/类别", "formulas": ["SUMIFS 多条件汇总", "EOMONTH 判断月份", "IFERROR 容错"], "example": "=SUMIFS(金额列, 部门列, \"销售部\", 日期列, \">=\"&EOMONTH(TODAY(),-2)+1)", "tips": "用数据验证限制部门只能选列表值；条件格式标出超 5000 的报销"}, {"id": "sales", "title": "销售业绩分析", "level": "高级", "desc": "销售明细表 → 自动排名、环比、Top10", "formulas": ["RANK 排名", "VLOOKUP/XLOOKUP 匹配", "SUMPRODUCT 加权"], "example": "=RANK(B2, $B$2:$B$50)  // 业绩排名\n=(本月-上月)/上月  // 环比增长率", "tips": "数据透视表按季度汇总；条件格式数据条直观对比；切片器做交互报表"}, {"id": "hr", "title": "人事考勤统计", "level": "进阶", "desc": "打卡记录 → 迟到/早退/缺勤自动统计", "formulas": ["COUNTIF 统计次数", "IF 判断迟到", "NETWORKDAYS 工作日"], "example": "=IF(上班时间>TIME(9,0,0), \"迟到\", \"正常\")", "tips": "用 TIME 函数设标准时间；数据透视表按人汇总月度考勤"}, {"id": "inventory", "title": "库存预警管理", "level": "高级", "desc": "出入库流水 → 实时库存 + 低库存预警", "formulas": ["SUMIF 分别汇总出入库", "IF 判断预警", "VLOOKUP 匹配单价"], "example": "=SUMIF(类型列,\"入库\",数量列)-SUMIF(类型列,\"出库\",数量列)", "tips": "条件格式标红低于安全库存；用 Power Query 合并多仓数据"}, {"id": "dashboard", "title": "经营仪表盘", "level": "专家", "desc": "一页看懂公司经营：KPI 卡片 + 趋势图 + 明细", "formulas": ["INDEX+MATCH 动态取数", "OFFSET 动态区域", "TEXT 美化显示"], "example": "KPI 卡片 =TEXT(销售额,\"¥#,##0\")&\"  同比 \"&TEXT(增长率,\"0%\")", "tips": "组合：数据透视表+切片器+图表=交互式仪表盘；用照相机功能拼排版"}], "ai_excel": [{"id": "ai_tools", "title": "AI 赋能 Excel 的 6 种方式", "level": "进阶", "body": "1. 公式生成：描述需求让 AI 写公式；2. 数据清洗：让 AI 写 Power Query M 语言；3. VBA 代码：描述需求生成宏；4. 数据分析：粘贴数据让 AI 解读；5. 图表建议：问 AI 哪种图合适；6. 模板生成：让 AI 设计表格结构。", "tips": ["把表头复制给 AI，它才能写对引用", "让 AI 解释公式每一步，顺便学习", "重要公式务必人工验证，AI 会一本正经地写错"]}, {"id": "ai_prompts", "title": "AI 提示词模板", "level": "进阶", "body": "公式生成：'我的表格 A 列是姓名、B 列是销售额，请写一个公式统计销售部（A列）销售额大于 10 万的人数，用中文解释每一步。' VBA 生成：'写一个 VBA 宏，把当前工作表 A1:D100 导出为 CSV，带中文注释。' 数据分析：'以下是销售数据（粘贴），请分析 Top3 产品和环比趋势。'", "tips": ["说清列含义比说清需求更重要", "要求 AI 用中文解释，顺便学公式"]}, {"id": "ai_copilot", "title": "Copilot for Excel", "level": "高级", "body": "微软官方 AI 助手：自然语言提问、自动生成公式、数据洞察、Python in Excel 集成。需要 Microsoft 365 订阅。平替方案：ChatGPT/Claude + 手动复制。", "tips": ["Python in Excel 让数据分析能力质变", "敏感数据不要粘贴给公有 AI"]}], "office": [{"id": "word", "title": "Word 高效技巧", "level": "入门", "body": "样式是 Word 的灵魂：用标题样式+导航窗格管理长文档；多级列表自动编号；交叉引用让图表编号自动更新；邮件合并批量生成工资条/邀请函。", "tips": ["Ctrl+Shift+S 快速应用样式", "F4 重复上一步操作", "邮件合并=Word+Excel 数据源"]}, {"id": "ppt", "title": "PPT 高效技巧", "level": "入门", "body": "母版统一全篇样式；SmartArt 一键转流程图；取色器吸取品牌色；排练计时控制节奏；导出 PDF/视频方便分享。", "tips": ["一页只讲一件事", "6×6 原则：每页≤6行，每行≤6词", "用参考线对齐"]}, {"id": "outlook", "title": "Outlook 效率", "level": "进阶", "body": "规则自动分拣邮件；快速步骤一键归档+回复；延迟发送避免冲动；会议邀请用 Scheduling Assistant 找共同空闲。", "tips": ["Ctrl+Shift+M 新建邮件", "收件箱清零：处理→归档/待办/删除三选一"]}, {"id": "teams", "title": "Teams/协作", "level": "进阶", "body": "Excel 在线协作：存 OneDrive/SharePoint，多人同时编辑看彩色光标；@提到人；版本历史找回误删。", "tips": ["协作前先备份", "用「审阅→共享工作簿」看谁在改"]}, {"id": "combo", "title": "Office 三件套联动", "level": "高级", "body": "Excel 数据→Word 邮件合并批量发工资条；Excel 图表→粘贴链接到 PPT，源数据更新图表自动更新；Power Query 抓取文件夹中所有 Excel 自动合并。", "tips": ["粘贴时选「链接」，不要选「图片」", "邮件合并数据源就是 Excel 表"]}], "versions": {"list": ["Excel 2003", "Excel 2007", "Excel 2010", "Excel 2013", "Excel 2016", "Excel 2019", "Excel 2021", "Excel 365"], "notes": {"Excel 2003": "经典界面（菜单栏），无 Ribbon；不支持 xlsx 大数据量（65536 行上限）", "Excel 2007": "首次 Ribbon 界面；新增 SUMIFS/COUNTIFS/AVERAGEIF/IFERROR；行数扩展到 104 万", "Excel 2010": "新增切片器、迷你图；Power Pivot 首次作为插件出现", "Excel 2013": "新增 Power Query（插件）、时间轴、推荐图表", "Excel 2016": "Power Query 内置", "Excel 2019": "新增 IFS/SWITCH/TEXTJOIN/CONCAT/MAXIFS/MINIFS 六个函数；漏斗图/地图图表（TEXTBEFORE/TEXTAFTER/TEXTSPLIT 为 Microsoft 365 专属，不在 2019 内）", "Excel 2021": "动态数组正式版：FILTER/SORT/UNIQUE/XLOOKUP/XMATCH", "Excel 365": "持续更新：动态数组、LAMBDA、Python in Excel、Copilot"}, "func_ver": {"XLOOKUP": "2021 / 365", "FILTER": "2021 / 365", "SORT": "2021 / 365", "UNIQUE": "2021 / 365", "XMATCH": "2021 / 365", "TEXTSPLIT": "365", "TEXTBEFORE": "365", "TEXTAFTER": "365", "LAMBDA": "365", "IFS": "2019 / 365", "SWITCH": "2019 / 365", "TEXTJOIN": "2019 / 365", "CONCAT": "2019 / 365", "MAXIFS": "2019 / 365", "MINIFS": "2019 / 365", "IFERROR": "2007+", "SUMIFS": "2007+", "COUNTIFS": "2007+", "AVERAGEIF": "2007+", "VLOOKUP": "全版本", "SUMIF": "全版本", "INDEX": "全版本", "MATCH": "全版本"}}, "errors": [{"code": "#N/A", "title": "找不到值", "cause": "查找的值不存在；VLOOKUP/MATCH/XLOOKUP 没找到匹配项；引用了空单元格的查找。", "fix": ["用 IFERROR 包裹：=IFERROR(VLOOKUP(...),\"未找到\")", "检查查找值前后是否有空格（用 TRIM 清理）", "确认查找区域首列确实包含关键字", "数字存成文本会导致匹配失败，统一格式"], "example": "=IFERROR(VLOOKUP(A2,员工表!A:B,2,0),\"查无此人\")"}, {"code": "#VALUE!", "title": "值类型错误", "cause": "文本参与了数学运算；函数参数类型不对；数组公式维度不匹配。", "fix": ["检查参与计算的单元格是否为文本型数字（绿三角）", "用 VALUE() 把文本转数字", "日期参与运算前确认是真日期而非文本"], "example": "=VALUE(A2)+B2  // 把文本型数字转成真数字再算"}, {"code": "#REF!", "title": "引用无效", "cause": "删除了公式引用的行/列/工作表；VLOOKUP 列序号超出范围。", "fix": ["撤销删除（Ctrl+Z）", "VLOOKUP 列序号不能大于区域列数", "跨表引用前确认表名没改"], "example": "VLOOKUP 区域 A:B 却写第 3 列 → #REF!"}, {"code": "#NAME?", "title": "名称错误", "cause": "函数名拼错；中文引号/中文括号；用了新版本函数但版本太旧；自定义名称不存在。", "fix": ["检查函数名拼写", "引号括号必须用英文半角", "TEXTSPLIT 等新函数需要 365", "公式→名称管理器检查自定义名称"], "example": "=VLOKUP(…) 拼错 → #NAME?"}, {"code": "#DIV/0!", "title": "除数为零", "cause": "除数是 0 或空单元格；平均空区域。", "fix": ["=IF(B2=0,\"-\",A2/B2)", "用 IFERROR 包裹：=IFERROR(A2/B2,0)"], "example": "=IFERROR(销售额/目标,0)"}, {"code": "#NUM!", "title": "数字错误", "cause": "数字太大/太小超出范围；迭代计算不收敛；SQRT 负数。", "fix": ["检查输入值范围", "SQRT 前用 MAX(0,…) 兜底", "IRR 等函数可调迭代次数"], "example": "=SQRT(-4) → #NUM!"}, {"code": "#SPILL!", "title": "溢出错误", "cause": "动态数组（FILTER/SORT/UNIQUE）的输出区域被占用；365 专属错误。", "fix": ["清空公式下方的单元格", "不要在表格（Ctrl+T）内用动态数组", "检查是否有合并单元格挡路"], "example": "=FILTER(A:A,A:A<>\"\") 下方有数据 → #SPILL!"}, {"code": "#CALC!", "title": "计算错误", "cause": "动态数组返回空；LAMBDA 递归问题；365 专属。", "fix": ["FILTER 结果为空时加第三参数：=FILTER(区,条件,\"无数据\")", "检查 LAMBDA 逻辑"], "example": "=FILTER(A2:A10,B2:B10=\"X\",\"无匹配\")"}], "tips": [{"t"
