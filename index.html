A($A:$A)-1,1)`，表示\"从 A2 开始、高度等于 A 列非空数减 1\"，A 列新增一行，名称范围自动加一行。更稳妥的写法是用 INDEX：`= $A$2:INDEX($A:$A,COUNTA($A:$A))`，INDEX 是非易失性函数，不会每次重算全表。\n\n**适用边界**：参数格（税率、比例、单价）、反复引用的关键区域适合定义名称；一次性引用、局部小范围没必要命名。名称太多会增加维护成本，名称管理器里超过 20 个就要定期清理。", "steps": ["定义名称：选中 E1（提成比例 5%），公式→定义名称，名字填\"提成比例\"，点确定；或点名称框输入\"提成比例\"回车。", "在公式里用名称：C2 输入 `=B2*提成比例`，回车得 500；拖填充柄，全表通用。", "查看与管理：公式→名称管理器，看名称列表；点某名称可改引用范围；点删除可删名称（删前确认没有公式在用它）。", "定义动态名称：公式→定义名称，名字填\"销售数据\"，引用位置输入 `=$A$2:INDEX($A:$A,COUNTA($A:$A))`，点确定。", "验证动态范围：在名称框输入\"销售数据\"回车，看选中区域是否随 A 列增减自动变化；新增一行后重进名称框再验证一次。", "公式里用动态名称：`=SUM(销售数据)`，A 列新增数据后求和自动包含新行，不用改公式。"], "sections": [{"title": "2. 基础概念", "body": "**名称**：给单元格或区域起一个名字，如把 E1 命名为\"提成比例\"，公式写 `=B2*提成比例`，比 `=B2*$E$1` 好读得多。名称是工作簿级的：全工作簿任何一张表都能用同一个名称。\n\n**定义名称**：选中单元格或区域，公式→定义名称，输入名字、确认引用范围。命名规则：不能与单元格地址重名（如 A1、B2），不能含空格（用下划线代替），不能以数字开头。名字里用\"税率\"、\"提成比例\"这类业务词，公式立刻自带文档。\n\n**名称管理器**：公式→名称管理器，列出全部名称：名字、引用位置、范围。改引用、改名字、删名称都在这里；名称引用错了（如指向了被删的表）会在这里显示 `#REF!`，是排查断链的第一站。\n\n**名称框快捷定义**：选中区域后点左上角名称框，直接输入名字回车，即完成定义——比打开对话框更快。输入已定义名称回车，可瞬间跳转到该区域。\n\n**动态名称**：引用范围会自己变长的名称。经典写法是用 OFFSET：`=OFFSET($A$2,0,0,COUNTA($A:$A)-1,1)`，表示\"从 A2 开始、高度等于 A 列非空数减 1\"，A 列新增一行，名称范围自动加一行。更稳妥的写法是用 INDEX：`= $A$2:INDEX($A:$A,COUNTA($A:$A))`，INDEX 是非易失性函数，不会每次重算全表。\n\n**适用边界**：参数格（税率、比例、单价）、反复引用的关键区域适合定义名称；一次性引用、局部小范围没必要命名。名称太多会增加维护成本，名称管理器里超过 20 个就要定期清理。"}, {"title": "4. 图文示例", "body": "提成表示例：E1 是 5%，定义名称\"提成比例\"；B2:B6 是销售额 10000、20000、15000、30000、25000。C2 写 `=B2*提成比例` 得 500，拖到 C6 得 1000、750、1500、1250，合计 5000。A 列销售数据定义动态名称\"销售数据\"后，`=COUNTA(销售数据)` 随新增行自动从 5 变 6。\n\n（截图位：待补图）"}], "source": "docs/formulas/03-names.md", "updated": "2026-11-09", "objectives": ["给单元格与区域定义名称，并在公式里用名称代替地址", "用名称管理器查看、编辑与删除已定义名称", "用 OFFSET 或 INDEX 定义动态名称，让引用范围随数据增减自动扩展", "判断名称与直接引用的适用边界：什么时候用名称、什么时候不用"], "formulas": ["=B2*提成比例 → 500（B2=10000，提成比例=5% 时）", "=SUM(销售数据) → 随 A 列增减自动变化", "=COUNTA(销售数据) → 5（A 列 5 条数据时）", "- `=B2*提成比例` → 500：名称代替地址：10000×0.05=500，公式自带业务语义", "- `=SUM(销售数据)` → 随 A 列增减自动变化：动态名称求和：A 列新增一行，求和范围自动扩大", "- `=COUNTA(销售数据)` → 5：动态名称计数：A2:A6 共 5 条，新增一行后变 6"], "scenarios": [{"title": "给领导看的测算模型", "body": "税率、折扣、汇率三个参数格各定义名称，公式里全用名称。领导问\"税率改成 13% 会怎样\"，只改参数格，全模型联动；公式本身不用解释，名称就是注释。"}, {"title": "每天追加的流水表", "body": "流水列定义动态名称，透视表与图表的数据源引用该名称。每天追加行后刷新即含新数据，不用每月改一次数据源范围。"}], "pitfalls": [{"problem": "名称在公式里报 #NAME?", "cause": "名称含空格、与地址重名，或定义在别的工作簿", "solution": "名称不用空格、不用 A1 这类地址名；跨工作簿名称要带工作簿名引用"}, {"problem": "动态名称范围没变", "cause": "COUNTA 数错了：A 列有标题行或空行", "solution": "公式里减去标题行（COUNTA-1）；A 列中间不要留空行"}, {"problem": "删了名称公式全报错", "cause": "公式还在引用已删的名称", "solution": "先在名称管理器看引用，再删；或用查找替换把名称批量换回地址"}, {"problem": "OFFSET 动态名称让表变卡", "cause": "OFFSET 是易失性函数，任何改动都触发重算", "solution": "改用 INDEX 写法定义动态名称，非易失性，不拖慢全表"}], "exercises": ["E1 是 5% 已定义名称\"提成比例\"，B2=10000，写公式算提成并给出结果；如果把名称删了，公式会怎样？", "A 列有标题行 A1 与 5 条数据 A2:A6，用 INDEX 写动态名称\"销售数据\"的引用位置，并说明 COUNTA 要不要减 1。", "名称不能怎么起？说出两条命名规则。"], "answers": ["公式 `=B2*提成比例` → 500。删名称后公式报 #NAME?，因为引用不到定义。", "引用位置 `=$A$2:INDEX($A:$A,COUNTA($A:$A))`。A 列非空数是 6（含标题），INDEX 行号取 6 即 A6；从 A2 开始共 5 行，不用减 1——因为起始行已是 A2。", "不能与单元格地址重名（如 A1）；不能含空格；不能以数字开头。"], "versions": "Excel 2016／2019／2021／365"}, {"id": "formulas-05-auditing", "group": "formulas", "column": "C03", "level2": "C03-L2-5", "title": "公式审核与调试：追踪引用、公式求值与错误检查", "level": "进阶", "body": "**追踪引用单元格**：选中一个公式格，公式→追踪引用单元格，箭头从它引用的格指向它。箭头指错地方，就是引用错了。**追踪从属单元格**反过来：箭头从它指向引用它的公式格，删格、删行前先看它，知道谁会受影响。\n\n**公式求值**：公式→公式求值，打开逐步求值窗口，每点一次\"求值\"就算一步，能看到 `VLOOKUP` 的查找值、`IF` 的条件判断、`SUM` 的求和范围每一步的中间结果。公式结果不对但不知道哪一步错时，用它逐段定位。\n\n**错误检查**：公式→错误检查，逐个扫描全表的错误值（#VALUE!、#N/A、#REF! 等），每个错误给\"帮助\"、\"显示计算步骤\"、\"忽略错误\"等选项。左上角绿色小三角就是错误检查的标记：有三角不一定真有错，可能是\"公式与相邻公式不一致\"这类提醒。\n\n**监视窗口**：公式→监视窗口，把关键结果格（如合计、税率）加进去，窗口常驻显示它们的当前值。改动源数据时不用翻页找合计格，在监视窗口直接看变化。\n\n**显示公式**：公式→显示公式（`Ctrl + ``），全表切换显示公式文本而非结果。检查引用、核对公式结构时用它；检查完再按一次切回。\n\n**定位条件找问题格**：`F5`→定位条件→公式/常量，可一次选中全表所有公式格或所有文本格。\"看起来是数、实际是文本\"的格（左上角绿三角、左对齐显示）最适合这样批量找出来。", "steps": ["追踪引用：点结果异常的公式格，公式→追踪引用单元格，看箭头指向的源格对不对；点\"移去箭头\"清除。", "追踪从属：点要删除的源数据格，公式→追踪从属单元格，看哪些公式在用它；确认无误再删。", "公式求值：点算错的公式格，公式→公式求值，反复点\"求值\"，看到哪一步的中间结果与预期不符，问题就在那一步。", "错误检查：公式→错误检查→错误检查，逐个过全表错误；每个错误看提示再决定修还是忽略。", "监视关键格：公式→监视窗口→添加监视，选中合计格与参数格；改动数据时在窗口里实时看合计变化。", "显示公式核对：按 `Ctrl + `` 显示全表公式，逐列核对引用范围有没有错位（如 SUM 范围少了一行），核对完再按一次切回。"], "sections": [{"title": "2. 基础概念", "body": "**追踪引用单元格**：选中一个公式格，公式→追踪引用单元格，箭头从它引用的格指向它。箭头指错地方，就是引用错了。**追踪从属单元格**反过来：箭头从它指向引用它的公式格，删格、删行前先看它，知道谁会受影响。\n\n**公式求值**：公式→公式求值，打开逐步求值窗口，每点一次\"求值\"就算一步，能看到 `VLOOKUP` 的查找值、`IF` 的条件判断、`SUM` 的求和范围每一步的中间结果。公式结果不对但不知道哪一步错时，用它逐段定位。\n\n**错误检查**：公式→错误检查，逐个扫描全表的错误值（#VALUE!、#N/A、#REF! 等），每个错误给\"帮助\"、\"显示计算步骤\"、\"忽略错误\"等选项。左上角绿色小三角就是错误检查的标记：有三角不一定真有错，可能是\"公式与相邻公式不一致\"这类提醒。\n\n**监视窗口**：公式→监视窗口，把关键结果格（如合计、税率）加进去，窗口常驻显示它们的当前值。改动源数据时不用翻页找合计格，在监视窗口直接看变化。\n\n**显示公式**：公式→显示公式（`Ctrl + ``），全表切换显示公式文本而非结果。检查引用、核对公式结构时用它；检查完再按一次切回。\n\n**定位条件找问题格**：`F5`→定位条件→公式/常量，可一次选中全表所有公式格或所有文本格。\"看起来是数、实际是文本\"的格（左上角绿三角、左对齐显示）最适合这样批量找出来。"}, {"title": "4. 图文示例", "body": "求和结果少算了：D7 的 `=SUM(D2:D6)` 结果是 4000，但手算应是 5000。追踪引用单元格看箭头：D2:D6 的范围没问题；公式求值逐步看：D4 的值是 0——点 D4 看编辑栏，里面是文本\"1000\"（带前导单引号，左对齐）。文本不参与求和，所以少了 1000。修复：D4 分列或乘 1 转数值，求和恢复 5000。教训：求和少算先查文本型数字。\n\n（截图位：待补图）"}], "source": "docs/formulas/05-auditing.md", "updated": "2026-11-09", "objectives": ["用追踪引用单元格与追踪从属单元格画出公式的来龙去脉", "用公式求值一步步看公式的中间结果，定位算错的那一步", "用错误检查与监视窗口批量排查全表的公式错误", "用显示公式与定位条件快速找到\"看起来是数、实际是文本\"的单元格"], "formulas": ["=SUM(D2:D6) → 5000（修复文本数字后）", "=IFERROR(VLOOKUP(A2,表1!A:B,2,0),\"未找到\") → 未找到（A2 不在表1时）", "- `=SUM(D2:D6)` → 5000：D4 文本\"1000\"转数值后，500+1000+750+1500+1250=5000，恢复正确", "- `=IFERROR(VLOOKUP(A2,表1!A:B,2,0),\"未找到\")` → 未找到：IFERROR 兜底：VLOOKUP 报错时显示\"未找到\"而不是 #N/A，便于排查是数据缺失还是公式写错"], "scenarios": [{"title": "接手一张公式全乱的旧表", "body": "先按 `Ctrl + `` 显示全表公式，逐列看引用范围；再用错误检查扫一遍全表错误；关键合计格加进监视窗口。修之前先备份一份，修完逐项核对合计值。"}, {"title": "VLOOKUP 查不到值", "body": "公式求值看查找值：A2 是\"张三 \"（带尾空格），表里是\"张三\"，空格导致匹配失败。用 TRIM 清空格或在公式里包一层 TRIM 再查。"}], "pitfalls": [{"problem": "公式结果错但不报错", "cause": "引用范围错位或文本型数字混入", "solution": "公式求值逐步定位；定位条件找文本格；追踪引用单元格看箭头"}, {"problem": "追踪箭头满屏都是", "cause": "多次追踪没清除", "solution": "公式→移去箭头→移去所有箭头，一次清干净"}, {"problem": "绿色小三角到处都是", "cause": "错误检查的提醒（如\"与相邻公式不一致\"）", "solution": "点格子看提示：真错就修，只是提醒可\"忽略错误\"；不要全表忽略"}, {"problem": "公式求值点不动", "cause": "选中的不是公式格", "solution": "先点含公式的单元格，再打开公式求值；文本格没有求值过程"}], "exercises": ["D2:D6 是 500、1000、750、1500、1250，但 =SUM(D2:D6) 只有 4000，最可能的原因是什么？用什么工具定位？", "要删除一格数据，删除前应该先看什么？用什么功能？", "公式结果不对但不报错，应该按什么顺序排查？"], "answers": ["某格是文本型数字（如 D4 的\"1000\"带前导单引号），SUM 会忽略文本。定位：公式求值逐步看中间值，或定位条件选中文本格检查。", "先用公式→追踪从属单元格，看哪些公式在引用它；确认影响后再删，避免删出 #REF!。", "（1）追踪引用单元格看箭头对不对；（2）公式求值逐步看哪一步中间结果错；（3）定位条件检查文本型数字。"], "versions": "Excel 2016／2019／2021／365"}, {"id": "formulas-06-advanced-tricks", "group": "formulas", "column": "C03", "level2": "C03-L2-6", "title": "高级公式技巧：LET、LAMBDA、嵌套与条件求和进阶", "level": "高级", "body": "**LET（2021／365）**：`LET(名字1, 值1, 名字2, 值2, 计算式)`，先定义、后计算。长公式里同一个子表达式出现多次时，用 LET 只算一次、起个名字，后面直接用名字。公式变短、变快、变好读。示例：`=LET(单价,B2,数量,C2,单价*数量)`。\n\n**LAMBDA（365 专属）**：`LAMBDA(参数, 计算式)`，定义一个自己的函数。` =LAMBDA(x, x*2)(5)` 返回 10。更实用的用法是先在名称管理器里把 LAMBDA 存成名称（如\"税额\"），以后全表像用内置函数一样调用 `=税额(10000)`。LAMBDA 配合 MAP、BYROW 等函数可对整列逐行计算，是 365 的高阶玩法。\n\n**嵌套的度**：IF 嵌套超过 3 层就难读难维护，优先换 IFS（2019／365）、SWITCH（2019／365）或 VLOOKUP/XLOOKUP 查表。嵌套不是炫技，少一层是一层。\n\n**SUMPRODUCT 多条件求和**：`=SUMPRODUCT((条件1)*(条件2)*求和区域)`，不用辅助列、不用数组三键。原理：条件相乘得 0/1 掩码，只有全满足的行是 1，再与求和区域相乘后加总。它是 SUMIFS 出现之前的通用解法，条件更灵活（可做或条件、可做不等式）。\n\n**文本拼接公式**：`&` 与 TEXT 函数配合可批量生成句子，如 `=A2&\"本月销售额\"&TEXT(B2,\"#,##0\")&\"元\"` 生成\"张三本月销售额12,000元\"。TEXT 的第二个参数是格式代码，与数字格式篇的自定义格式代码同一套写法。\n\n**版本红线**：LET 是 2021／365，LAMBDA 是 365 专属——写进模板前确认对方版本；旧版用户用辅助列＋普通公式实现同样结果，不要硬上新函数。", "steps": ["LET 入门：在 D2 输入 `=LET(单价,B2,数量,C2,单价*数量)`，回车得结果；再把公式里重复出现的子表达式抽成 LET 变量。", "LAMBDA 入门：在任意格输入 `=LAMBDA(x, x*1.13)(10000)` 验证返回 11300；再到名称管理器新建名称\"含税价\"，引用位置填 `=LAMBDA(x, x*1.13)`，以后用 `=含税价(10000)` 调用。", "SUMPRODUCT 多条件求和：`=SUMPRODUCT((A2:A100=\"销售部\")*(B2:B100>5000)*C2:C100)`，求销售部且金额大于 5000 的合计。", "文本拼接：`=A2&\"本月销售额\"&TEXT(B2,\"#,##0\")&\"元\"`，拖填充柄批量生成句子；TEXT 的格式代码控制千分位。", "嵌套改查表：把三层 IF 嵌套换成 IFS 或 VLOOKUP 查表，公式短一半；改完用公式求值逐项核对边界值。", "版本检查：公式用到 LET/LAMBDA 前，先确认文件使用者的版本；模板发给旧版用户时换成辅助列写法。"], "sections": [{"title": "2. 基础概念", "body": "**LET（2021／365）**：`LET(名字1, 值1, 名字2, 值2, 计算式)`，先定义、后计算。长公式里同一个子表达式出现多次时，用 LET 只算一次、起个名字，后面直接用名字。公式变短、变快、变好读。示例：`=LET(单价,B2,数量,C2,单价*数量)`。\n\n**LAMBDA（365 专属）**：`LAMBDA(参数, 计算式)`，定义一个自己的函数。` =LAMBDA(x, x*2)(5)` 返回 10。更实用的用法是先在名称管理器里把 LAMBDA 存成名称（如\"税额\"），以后全表像用内置函数一样调用 `=税额(10000)`。LAMBDA 配合 MAP、BYROW 等函数可对整列逐行计算，是 365 的高阶玩法。\n\n**嵌套的度**：IF 嵌套超过 3 层就难读难维护，优先换 IFS（2019／365）、SWITCH（2019／365）或 VLOOKUP/XLOOKUP 查表。嵌套不是炫技，少一层是一层。\n\n**SUMPRODUCT 多条件求和**：`=SUMPRODUCT((条件1)*(条件2)*求和区域)`，不用辅助列、不用数组三键。原理：条件相乘得 0/1 掩码，只有全满足的行是 1，再与求和区域相乘后加总。它是 SUMIFS 出现之前的通用解法，条件更灵活（可做或条件、可做不等式）。\n\n**文本拼接公式**：`&` 与 TEXT 函数配合可批量生成句子，如 `=A2&\"本月销售额\"&TEXT(B2,\"#,##0\")&\"元\"` 生成\"张三本月销售额12,000元\"。TEXT 的第二个参数是格式代码，与数字格式篇的自定义格式代码同一套写法。\n\n**版本红线**：LET 是 2021／365，LAMBDA 是 365 专属——写进模板前确认对方版本；旧版用户用辅助列＋普通公式实现同样结果，不要硬上新函数。"}, {"title": "4. 图文示例", "body": "销售表示例：A 列部门（销售部、市场部、销售部、销售部、市场部），B 列金额（8000、3000、6000、4500、7000），C 列数量（2、1、3、1、2）。多条件求和 `=SUMPRODUCT((A2:A6=\"销售部\")*(B2:B6>5000)*B2:B6)`：销售部且金额>5000 的是 8000 与 6000，和为 14000。LET 写法：`=LET(单价,120,数量,3,单价*数量)` → 360。LAMBDA：`=LAMBDA(x,x*1.13)(10000)` → 11300（含税价，10000×1.13）。\n\n（截图位：待补图）"}], "source": "docs/formulas/06-advanced-tricks.md", "updated": "2026-11-09", "objectives": ["用 LET 给中间结果起名字，让长公式可读、可维护", "用 LAMBDA 定义自己的函数，并在公式里调用它", "用 SUMPRODUCT 实现多条件求和与计数，替代辅助列", "用文本拼接公式批量生成带变量的句子与编号"], "formulas": ["=SUMPRODUCT((A2:A6=\"销售部\")*(B2:B6>5000)*B2:B6) → 14000", "=LET(单价,120,数量,3,单价*数量) → 360", "=LAMBDA(x,x*1.13)(10000) → 11300", "=A2&\"本月销售额\"&TEXT(B2,\"#,##0\")&\"元\" → 张三本月销售额12,000元（A2=张三，B2=12000 时）", "- `=SUMPRODUCT((A2:A6=\"销售部\")*(B2:B6>5000)*B2:B6)` → 14000：销售部且金额>5000 的是 8000 与 6000，和为 14000；4500 不满足>5000 被排除", "- `=LET(单价,120,数量,3,单价*数量)` → 360：LET 定义两个变量后计算：120×3=360；2021／365 可用", "- `=LAMBDA(x,x*1.13)(10000)` → 11300：LAMBDA 含税价：10000×1.13=11300；365 专属", "- `=A2&\"本月销售额\"&TEXT(B2,\"#,##0\")&\"元\"` → 张三本月销售额12,000元：文本拼接：TEXT 的 #,##0 格式代码给 12000 加千分位"], "scenarios": [{"title": "提成规则三档变五档", "body": "原来 IF 嵌套三层算提成，规则变五档后嵌套到五层没法看。改成 VLOOKUP 查提成率表（区间+比率），规则再变只改表不改公式；或用 IFS（2019／365）扁平化。"}, {"title": "每月自动生成催款函抬头", "body": "客户名、欠款金额在 A、B 列，C 列用拼接公式批量生成\"尊敬的张三：您尚有欠款 12,000 元，请于本月 30 日前结清。\"TEXT 控格式、& 拼句子，一列公式生成全月函件。"}], "pitfalls": [{"problem": "LET/LAMBDA 在旧版报 #NAME?", "cause": "对方是 2019 或更早版本", "solution": "LET 需 2021／365，LAMBDA 需 365 专属；旧版用辅助列＋普通公式替代"}, {"problem": "SUMPRODUCT 结果偏大", "cause": "条件区域与求和区域行数不一致", "solution": "三个区域必须同高同起止行（如都是 A2:A6）；行数错一位结果全错"}, {"problem": "LAMBDA 存成名称后调用失败", "cause": "名称管理器里引用位置没加等号或参数不匹配", "solution": "引用位置填 =LAMBDA(x, x*1.13)，调用时参数个数与定义一致"}, {"problem": "IF 嵌套到五层还继续加", "cause": "嵌套层数失控", "solution": "三层以上换 IFS、SWITCH 或 VLOOKUP 查表；嵌套不是炫技"}], "exercises": ["A2:A6 部门是销售部、市场部、销售部、销售部、市场部，B2:B6 金额是 8000、3000、6000、4500、7000。用 SUMPRODUCT 求销售部且金额>5000 的合计，结果是多少？哪两行被算进去了？", "=LET(单价,120,数量,3,单价*数量) 的结果是多少？LET 有什么好处？", "=LAMBDA(x,x*1.13)(10000) 的结果是多少？这个函数能在 Excel 2019 上用吗？"], "answers": ["结果 14000，算进去的是 8000 与 6000 两行（都是销售部且>5000）；4500 是销售部但不大于 5000，被排除。", "结果 360。好处：子表达式只写一次、起名字后可读，公式变短且不易错。", "结果 11300。不能，LAMBDA 是 365 专属，2019 会报 #NAME?。"], "versions": "LET：Excel 2021／365；LAMBDA：Microsoft 365 专属；其余技巧全版本"}, {"id": "data-management-01-sort-filter", "group": "data-management", "column": "C05", "level2": "C05-L2-1", "title": "排序与筛选：单条件、多条件、自动筛选与高级筛选", "level": "入门", "body": "**排序的铁律**：排序前选中整个数据区，或点数据区内任一格直接排序（Excel 自动扩展选区）。只选中一列就排序，会把行与行之间的对应关系打乱——这是新手最常见的毁表操作，没有之一。排序前备份，或确认能 `Ctrl + Z` 撤销。\n\n**单条件排序**：数据→排序，按一列升序/降序。数值按大小、日期按先后、文本按拼音/字母。金额列降序即\"从大到小\"，看 Top 5 直接取前 5 行。\n\n**多条件排序**：数据→排序→添加条件，先按部门升序、再按金额降序。Excel 按条件顺序逐层排：部门相同的人内部再按金额排。层数没有实用上限，但超过 3 层就要想想是不是该用透视表了。\n\n**自动筛选**：选中表头行，数据→筛选，每列出现下拉箭头。点箭头可选文本筛选（包含/开头是）、数字筛选（大于/前 10 项）、按颜色筛选。筛选只是隐藏行，不删除数据；清除筛选后全部恢复。\n\n**高级筛选**：数据→高级筛选，条件区域单独写在表外。同一行多个条件是\"与\"（同时满足），不同行是\"或\"（满足其一）。还能勾选\"选择不重复的记录\"，一键提取不重复客户名单。高级筛选可把结果复制到其他位置，原表不动。\n\n**按颜色排序**：先用条件格式或手动填充把异常行标色，再按颜色排序，异常行自动聚到一起。适合\"先标后排\"的人工复核流程。", "steps": ["单条件排序：点金额列内任一格，数据→降序（Z→A），确认弹出\"扩展选定区域\"时选扩展，再确定。", "多条件排序：数据→排序，主要关键字选\"部门\"、次序升序；点\"添加条件\"，次要关键字选\"金额\"、次序降序；确定。", "自动筛选：点表头行任一格，数据→筛选；点\"部门\"列箭头，只勾\"销售部\"，确定；再点\"金额\"箭头→数字筛选→大于→输入 5000。", "清除筛选：数据→清除（只清条件保留箭头），或再点一次数据→筛选（连箭头一起去掉）。", "高级筛选：表外写条件区（如 G1:H2：G1\"部门\"、H1\"金额\"，G2\"销售部\"、H2\">5000\"），数据→高级筛选→将筛选结果复制到其他位置，列表区域选数据区、条件区域选 G1:H2、复制到选目标格，确定。", "提取不重复：高级筛选中勾选\"选择不重复的记录\"，客户列一次去重，比逐行肉眼快得多。"], "sections": [{"title": "2. 基础概念", "body": "**排序的铁律**：排序前选中整个数据区，或点数据区内任一格直接排序（Excel 自动扩展选区）。只选中一列就排序，会把行与行之间的对应关系打乱——这是新手最常见的毁表操作，没有之一。排序前备份，或确认能 `Ctrl + Z` 撤销。\n\n**单条件排序**：数据→排序，按一列升序/降序。数值按大小、日期按先后、文本按拼音/字母。金额列降序即\"从大到小\"，看 Top 5 直接取前 5 行。\n\n**多条件排序**：数据→排序→添加条件，先按部门升序、再按金额降序。Excel 按条件顺序逐层排：部门相同的人内部再按金额排。层数没有实用上限，但超过 3 层就要想想是不是该用透视表了。\n\n**自动筛选**：选中表头行，数据→筛选，每列出现下拉箭头。点箭头可选文本筛选（包含/开头是）、数字筛选（大于/前 10 项）、按颜色筛选。筛选只是隐藏行，不删除数据；清除筛选后全部恢复。\n\n**高级筛选**：数据→高级筛选，条件区域单独写在表外。同一行多个条件是\"与\"（同时满足），不同行是\"或\"（满足其一）。还能勾选\"选择不重复的记录\"，一键提取不重复客户名单。高级筛选可把结果复制到其他位置，原表不动。\n\n**按颜色排序**：先用条件格式或手动填充把异常行标色，再按颜色排序，异常行自动聚到一起。适合\"先标后排\"的人工复核流程。"}, {"title": "4. 图文示例", "body": "销售明细 5 行：张三/销售部/8000、李四/市场部/3000、王五/销售部/6000、赵六/销售部/4500、钱七/市场部/7000。按金额降序排：8000、7000、6000、4500、3000。自动筛选\"部门=销售部\"得 3 行（张三、王五、赵六）；再加\"金额>5000\"得 2 行（张三、王五）。高级筛选条件区\"部门=销售部\"且\"金额>5000\"复制到别处，同样得 2 行。核对：8000+6000=14000，与条件求和结果一致。\n\n（截图位：待补图）"}], "source": "docs/data-management/01-sort-filter.md", "updated": "2026-11-09", "objectives": ["按数值、日期、文本与颜色排序，并理解排序前必须选中整个数据区", "用多条件排序实现\"先按部门、再按金额降序\"这类两层排序", "用自动筛选与文本/数字筛选快速找出目标行", "用高级筛选实现多条件组合（与/或）与不重复记录提取"], "formulas": ["=SUMIF(A2:A6,\"销售部\",C2:C6) → 18500", "=COUNTIF(A2:A6,\"销售部\") → 3", "=LARGE(C2:C6,1) → 8000", "- `=SUMIF(A2:A6,\"销售部\",C2:C6)` → 18500：销售部金额合计：8000+6000+4500=18500；与筛选后求和互相核对", "- `=COUNTIF(A2:A6,\"销售部\")` → 3：销售部共 3 行：张三、王五、赵六", "- `=LARGE(C2:C6,1)` → 8000：LARGE 取第 1 大值 8000，即金额最大值；等于 MAX 的结果"], "scenarios": [{"title": "月度销售 Top 10", "body": "全月明细按金额降序排，前 10 行即 Top 10；再按部门多条件排一次，看各部门内部的排名。汇报时贴排序后的表，比只报数字有说服力。"}, {"title": "从 1000 行里找异常订单", "body": "金额列按颜色筛选（先条件格式标红金额>10000 的行），或数字筛选\"大于 10000\"，异常行一次聚齐；再高级筛选把结果复制到新表做复核，原表不动。"}], "pitfalls": [{"problem": "排序后数据错位", "cause": "只选中一列就排序", "solution": "点数据区内任一格直接排序，让 Excel 自动扩展选区；或排序前选中整个数据区"}, {"problem": "筛选后求和结果不对", "cause": "SUM 把隐藏行也算进去了", "solution": "筛选后求和改用 SUBTOTAL(109, 区域)，109 表示\"忽略隐藏行求和\""}, {"problem": "高级筛选条件不起作用", "cause": "条件区标题与数据区表头不一致", "solution": "条件区第一行必须与数据区表头逐字相同（含空格）；\"与\"写同一行，\"或\"写不同行"}, {"problem": "筛选箭头不见了", "cause": "误点了数据→筛选两次", "solution": "再点一次数据→筛选恢复箭头；清除筛选（数据→清除）只清条件不去箭头"}], "exercises": ["5 行数据：张三/销售部/8000、李四/市场部/3000、王五/销售部/6000、赵六/销售部/4500、钱七/市场部/7000。按金额降序排，第一行是谁？销售部金额合计是多少？", "筛选后想对可见行求和，应该用 SUM 还是 SUBTOTAL？参数怎么写？", "高级筛选条件区：同一行的两个条件是什么关系？不同行呢？"], "answers": ["第一行是张三（8000）。销售部合计 =SUMIF → 18500（8000+6000+4500）。", "用 SUBTOTAL(109, 区域)。109 表示忽略隐藏行求和；SUM 会把筛选隐藏的行也算进去。", "同一行是\"与\"（同时满足），不同行是\"或\"（满足其一）。"], "versions": "Excel 2016／2019／2021／365"}, {"id": "data-management-02-clean-data", "group": "data-management", "column": "C05", "level2": "C05-L2-2", "title": "数据清洗：分列、去重、TRIM/CLEAN 与查找替换清理", "level": "入门", "body": "**脏数据的四种**：多余空格（\"张三 \"）、不可见字符（从系统导出的换行符、制表符）、文本型数字（\"100\" 当文本）、重复行（同一订单导了两次）。清洗就是按固定顺序把这四种逐一处理掉。\n\n**分列**：数据→分列，把一格里的多个值按分隔符（逗号、分号、空格）或固定宽度拆成多列。系统导出的 CSV 常常是\"姓名，部门，金额\"挤在一格，分列是第一步。分列前先在右侧留出空列，否则会覆盖已有数据。\n\n**删除重复项**：数据→删除重复项，勾选作为判断依据的列（如订单号），重复行整行删除，并报告删了几行。它是破坏性操作，清洗前必须先备份原表。\n\n**TRIM 与 CLEAN**：`TRIM` 删首尾空格、把连续多个空格压成一个；`CLEAN` 删不可见字符（如换行符 CHAR(10) 以外的控制字符）。两者常组合用：`=TRIM(CLEAN(A2))`。注意 TRIM 不删不间断空格（CHAR(160)，从网页复制来的常见），那种要用 SUBSTITUTE 换掉：`=SUBSTITUTE(A2,CHAR(160),\"\")`。\n\n**UNIQUE（2021／365）**：`=UNIQUE(A2:A100)` 一公式返回去重后的列表，原表不动。想保留原表、只在新位置看去重结果时用它；想直接在原表上删重复行时用\"删除重复项\"。\n\n**清洗流程**：备份原表→分列→清空格与不可见字符→文本数字转数值→去重→核对（行数、合计值前后对比）。合计值清洗前后必须一致，否则就是洗掉了不该洗的东西。", "steps": ["备份：右键工作表标签→移动或复制→勾选\"建立副本\"，副本改名\"原始备份\"，再在原表上清洗。", "分列：选中要拆的列，数据→分列→分隔符号→勾逗号→下一步→完成；先确认右侧有足够空列。", "清空格：在辅助列输入 `=TRIM(CLEAN(A2))` 拖满全列，复制辅助列→选择性粘贴→数值覆盖回原列，再删辅助列。", "清不间断空格：网页复制来的数据先用 `=SUBSTITUTE(A2,CHAR(160),\"\")` 去 CHAR(160)，再套 TRIM。", "文本转数值：选中文本数字列，数据→分列→直接点完成（不改任何设置），分列会顺手把文本数字转成数值；或在空白格输入 1、复制、选中目标列→选择性粘贴→乘。", "去重：选中数据区，数据→删除重复项，勾选订单号列，确认报告\"删除了 N 个重复值\"；核对行数：原行数减删除数等于现行数。", "核对：清洗前后分别用 SUM 算金额合计，两数一致才算洗完；不一致就逐项回查哪一步动了数值。"], "sections": [{"title": "2. 基础概念", "body": "**脏数据的四种**：多余空格（\"张三 \"）、不可见字符（从系统导出的换行符、制表符）、文本型数字（\"100\" 当文本）、重复行（同一订单导了两次）。清洗就是按固定顺序把这四种逐一处理掉。\n\n**分列**：数据→分列，把一格里的多个值按分隔符（逗号、分号、空格）或固定宽度拆成多列。系统导出的 CSV 常常是\"姓名，部门，金额\"挤在一格，分列是第一步。分列前先在右侧留出空列，否则会覆盖已有数据。\n\n**删除重复项**：数据→删除重复项，勾选作为判断依据的列（如订单号），重复行整行删除，并报告删了几行。它是破坏性操作，清洗前必须先备份原表。\n\n**TRIM 与 CLEAN**：`TRIM` 删首尾空格、把连续多个空格压成一个；`CLEAN` 删不可见字符（如换行符 CHAR(10) 以外的控制字符）。两者常组合用：`=TRIM(CLEAN(A2))`。注意 TRIM 不删不间断空格（CHAR(160)，从网页复制来的常见），那种要用 SUBSTITUTE 换掉：`=SUBSTITUTE(A2,CHAR(160),\"\")`。\n\n**UNIQUE（2021／365）**：`=UNIQUE(A2:A100)` 一公式返回去重后的列表，原表不动。想保留原表、只在新位置看去重结果时用它；想直接在原表上删重复行时用\"删除重复项\"。\n\n**清洗流程**：备份原表→分列→清空格与不可见字符→文本数字转数值→去重→核对（行数、合计值前后对比）。合计值清洗前后必须一致，否则就是洗掉了不该洗的东西。"}, {"title": "4. 图文示例", "body": "导出的订单表 6 行：其中两行订单号重复，一行姓名带尾空格\"张三 \"，一行金额是文本型\"6000\"。清洗：备份→分列（无）→TRIM 清空格→文本转数值→删除重复项（按订单号，报告删除 1 行）→核对：清洗前金额合计（含文本 6000 时 SUM 忽略它）与清洗后合计相差 6000，恰好是那行文本数字——确认无误删后交表。清洗后 5 行金额 8000、3000、6000、4500、7000，合计 28500。\n\n（截图位：待补图）"}], "source": "docs/data-management/02-clean-data.md", "updated": "2026-11-09", "objectives": ["用分列把\"张三,销售部,100\"这类一格多值拆成多列", "用删除重复项与 UNIQUE 去重，并说出两者的区别", "用 TRIM 与 CLEAN 清掉空格与不可见字符", "建立\"先备份、再清洗、逐项核对\"的清洗流程，清洗前后行数对得上"], "formulas": ["=TRIM(CLEAN(A2)) → 张三（A2=张三带尾空格时）", "=SUBSTITUTE(A2,CHAR(160),\"\") → 去不间断空格", "=SUM(C2:C6) → 28500（清洗后 C2:C6 是 8000、3000、6000、4500、7000 时）", "=UNIQUE(A2:A6) → 去重后的名单（2021／365）", "- `=TRIM(CLEAN(A2))` → 张三：TRIM 删首尾空格，CLEAN 删不可见字符；组合是清洗标配", "- `=SUBSTITUTE(A2,CHAR(160),\"\")` → 去不间断空格：网页复制来的空格常是 CHAR(160)，TRIM 删不掉，必须用 SUBSTITUTE 替换", "- `=SUM(C2:C6)` → 28500：8000+3000+6000+4500+7000=28500；清洗前后合计核对就用它", "- `=UNIQUE(A2:A6)` → 去重后的名单：UNIQUE 一公式返回去重列表，原表不动；2021／365 可用"], "scenarios": [{"title": "每月接系统导出的报表", "body": "系统导出的表每月都带同样的脏：空格、文本数字、重复行。把清洗步骤记成固定流程（备份→分列→TRIM/CLEAN→转数值→去重→核对），每月 10 分钟走完；熟练后录成 Power Query（见 Power Query 篇）实现一键清洗。"}, {"title": "合并三个部门交来的表", "body": "三张表格式不一：先统一列顺序与表头，再逐张清洗（空格、文本数字），最后追加合并。用删除重复项按\"姓名+日期\"两列去重，防止同一人同一天被算两次。"}], "pitfalls": [{"problem": "分列覆盖了右侧数据", "cause": "分列前右侧没有留空列", "solution": "分列前先插入足够空列；或先分列到新表再粘回来"}, {"problem": "去重删错了行", "cause": "勾选的列不对（如只勾了姓名，同名不同人被误删）", "solution": "去重依据列要能唯一标识一行（如订单号，或姓名+日期两列组合）"}, {"problem": "TRIM 清不掉空格", "cause": "那是网页来的不间断空格 CHAR(160)", "solution": "先 SUBSTITUTE(CHAR(160),\"\") 再 TRIM"}, {"problem": "清洗后合计对不上", "cause": "某步误删或改了数值", "solution": "每步前后都用 SUM 核对合计；备份表在手，随时可回滚重洗"}, {"problem": "文本数字转完还是文本", "cause": "只改了格式没重新确认", "solution": "改格式不够：用分列直接完成，或选择性粘贴→乘 1，强制重算"}], "exercises": ["清洗后 5 行金额 8000、3000、6000、4500、7000，求和是多少？清洗前 SUM 少算了 6000，最可能的原因是什么？", "\"张三 \"（带尾空格）用 TRIM 处理后 LEN 是多少？如果空格是网页复制来的 CHAR(160)，TRIM 还管用吗？", "删除重复项与 UNIQUE 有什么区别？什么时候用哪个？"], "answers": ["合计 28500。清洗前少算 6000 是因为那格是文本型数字，SUM 会忽略文本；分列或乘 1 转数值后恢复。", "TRIM 后\"张三\"长度是 2。CHAR(160) 的不间断空格 TRIM 删不掉，要先 SUBSTITUTE(A2,CHAR(160),\"\") 再 TRIM。", "删除重复项直接在原表删行（破坏性，要备份）；UNIQUE 是公式，在新位置返回去重列表，原表不动。想保留原表时用 UNIQUE。"], "versions": "Excel 2016／2019／2021／365"}, {"id": "data-management-03-tables-ref", "group": "data-management", "column": "C05", "level2": "C05-L2-3", "title": "超级表应用（交叉引用索引）", "level": "", "body": "", "steps": [], "sections": [], "source": "docs/data-management/03-tables-ref.md", "updated": "2026-11-09", "objectives": ["用 Ctrl + T 把普通区域转成超级表，并给表起一个有意义的名字", "读懂并写出结构化引用（如 `表1[金额]`）", "用汇总行一键求和、计数、求平均"], "formulas": ["=SUM(销售明细[金额]) → 4860", "=AVERAGE(销售明细[金额]) → 972", "- `=SUM(销售明细[金额])` → 4860：结构化引用求和，1200+980+1500+640+540=4860；新增行后自动纳入", "- `=AVERAGE(销售明细[金额])` → 972：4860÷5=972，金额列平均值"], "scenarios": [{"title": "每天追加的销售流水", "body": "流水每天新增几十行：做成超级表后，汇总行的合计与旁边的结构化引用公式自动包含新行，透视表的数据源设为表名后刷新即含新数据。普通区域每次都要改引用范围，迟早漏一次。"}], "pitfalls": [{"problem": "结构化引用公式报错 #NAME?", "cause": "表名含空格或与单元格地址重名", "solution": "表名用无空格的名字（如\"销售明细\"），不要叫 A1 这类地址"}, {"problem": "新增行后公式没跟上", "cause": "新增的行不在表内（空了一行再写）", "solution": "紧贴表底最后一行新增，或直接在汇总行上方插入行"}], "exercises": ["把一张 5 行销售明细转成超级表并改名\"销售明细\"，用结构化引用求金额合计（金额 1200、980、1500、640、540）。", "新增一行金额 700，汇总行与结构化引用会自动变成多少？"], "answers": ["求和 `=SUM(销售明细[金额])` → 4860（1200+980+1500+640+540）。", "自动变成 5560（4860+700），不用改任何公式。"], "versions": "Excel 2016／2019／2021／365"}, {"id": "data-management-05-import-export", "group": "data-management", "column": "C05", "level2": "C05-L2-5", "title": "数据导入导出：文本/CSV 导入、从数据库与网页获取、导出格式", "level": "进阶", "body": "**CSV 导入三要素**：分隔符（逗号/分号/制表符）、编码（UTF-8/GBK）、列格式（文本/日期/常规）。三者任一错，导入即乱：分隔符错会整行挤进一列，编码错会出乱码，列格式错会丢前导 0 或把长数字变科学计数法。\n\n**两种导入路径**：直接双击打开 CSV（快，但分隔符与编码按系统默认猜，常猜错）；数据→从文本/CSV（走 Power Query 导入向导，可选分隔符、编码、列格式，推荐）。后者还能把导入步骤存成查询，下月同样文件一键刷新。\n\n**从文件夹获取**：数据→获取数据→自文件→从文件夹，选文件夹后 Power Query 合并其中全部同结构文件。每月 12 个分表合并成一张总表，用它 1 分钟搞定；新文件丢进文件夹后刷新即可。\n\n**从数据库与网页获取**：数据→获取数据→自数据库（SQL Server、Access 等）或自网站（输入 URL 抓表格）。网页表格结构一变就要重配查询，适合结构稳定的公开表格（如汇率表）。\n\n**导出格式取舍**：另存为 CSV 只保留当前工作表、无格式无公式，适合导给其他系统；导出 PDF（文件→导出→创建 PDF）保留排版与格式，适合发给领导；发给对方继续编辑的，一律发 .xlsx 原文件。\n\n**刷新**：Power Query 导入的数据，源文件更新后在 Excel 里点数据→全部刷新即可同步。查询步骤存在工作簿里，发给别人时对方刷新需要能访问源文件路径，路径变了会报错。", "steps": ["导入 CSV：数据→从文本/CSV，选文件；在预览里确认分隔符（逗号）、编码（UTF-8，如乱码改 GBK 936）、列格式（工号列设文本）；点加载。", "处理乱码：预览里中文是乱码时，把编码从 UTF-8 换成 GBK（936）再预览，中文正常后再加载。", "从文件夹合并：数据→获取数据→自文件→从文件夹，选文件夹→合并→选示例文件确认列→确定，全部同结构文件合并成一张表。", "从网页获取：数据→获取数据→自其他源→自网站，输入 URL，选要抓的表格→加载；结构变化时在 Power Query 编辑器里重配。", "导出 CSV：选中要导出的工作表，文件→另存为→CSV UTF-8（逗号分隔）；注意只保存当前工作表，多表要逐张另存。", "导出 PDF：文件→导出→创建 PDF/XPS 文档，选\"整个工作簿\"或\"当前工作表\"；打印设置（页面布局→纸张方向/缩放）先调好再导出。"], "sections": [{"title": "2. 基础概念", "body": "**CSV 导入三要素**：分隔符（逗号/分号/制表符）、编码（UTF-8/GBK）、列格式（文本/日期/常规）。三者任一错，导入即乱：分隔符错会整行挤进一列，编码错会出乱码，列格式错会丢前导 0 或把长数字变科学计数法。\n\n**两种导入路径**：直接双击打开 CSV（快，但分隔符与编码按系统默认猜，常猜错）；数据→从文本/CSV（走 Power Query 导入向导，可选分隔符、编码、列格式，推荐）。后者还能把导入步骤存成查询，下月同样文件一键刷新。\n\n**从文件夹获取**：数据→获取数据→自文件→从文件夹，选文件夹后 Power Query 合并其中全部同结构文件。每月 12 个分表合并成一张总表，用它 1 分钟搞定；新文件丢进文件夹后刷新即可。\n\n**从数据库与网页获取**：数据→获取数据→自数据库（SQL Server、Access 等）或自网站（输入 URL 抓表格）。网页表格结构一变就要重配查询，适合结构稳定的公开表格（如汇率表）。\n\n**导出格式取舍**：另存为 CSV 只保留当前工作表、无格式无公式，适合导给其他系统；导出 PDF（文件→导出→创建 PDF）保留排版与格式，适合发给领导；发给对方继续编辑的，一律发 .xlsx 原文件。\n\n**刷新**：Power Query 导入的数据，源文件更新后在 Excel 里点数据→全部刷新即可同步。查询步骤存在工作簿里，发给别人时对方刷新需要能访问源文件路径，路径变了会报错。"}, {"title": "4. 图文示例", "body": "导入一份 UTF-8 编码的订单 CSV（逗号分隔，含 18 位订单号）：数据→从文本/CSV→编码选 UTF-8→分隔符逗号→订单号列格式设为文本→加载。核对：行数与源文件一致，订单号完整无科学计数法，金额列 SUM 得 28500，与源系统报表一致。再导出一份 PDF 发给领导：文件→导出→创建 PDF，确认分页无断行。\n\n（截图位：待补图）"}], "source": "docs/data-management/05-import-export.md", "updated": "2026-11-09", "objectives": ["用文本导入向导正确导入 CSV，选对分隔符、编码与列格式", "用 Power Query 从文件夹、数据库与网页获取数据并刷新", "导出 CSV 与 PDF，知道每种格式会丢什么（格式、公式、多表）", "处理导入时的乱码、长数字变科学计数法与日期错乱"], "formulas": ["=SUM(C2:C6) → 28500（导入核对用）", "=COUNTA(A2:A6) → 5", "- `=SUM(C2:C6)` → 28500：导入后金额合计 8000+3000+6000+4500+7000=28500，与源系统报表一致才算导对", "- `=COUNTA(A2:A6)` → 5：导入后非空行数 5，与源文件行数核对；行数不对先查分隔符与编码"], "scenarios": [{"title": "每月 12 个分表合成总表", "body": "12 个分公司每月各交一个 CSV：建一个文件夹全丢进去，Power Query 从文件夹获取并合并。下月新文件直接丢进文件夹，打开总表点全部刷新即完成合并。"}, {"title": "给外部系统导数据", "body": "对方系统只认 GBK 编码的 CSV：另存为时选\"CSV（逗号分隔）\"并确认编码；长数字列先设文本格式再导，否则对方收到的是科学计数法。"}], "pitfalls": [{"problem": "导入后中文全是乱码", "cause": "编码选错（UTF-8 文件按 GBK 解）", "solution": "导入向导里把编码换成 UTF-8 或 GBK（936）再预览，中文正常后再加载"}, {"problem": "整行数据挤在一列", "cause": "分隔符选错（文件是分号分隔却按逗号切）", "solution": "导入向导里改分隔符；或导入后用数据→分列补救"}, {"problem": "订单号变科学计数法", "cause": "导入时列格式是常规", "solution": "导入向导里把该列格式设为文本；已变的无法恢复，需重新导入"}, {"problem": "刷新后报错找不到源文件", "cause": "源文件被移动或改名", "solution": "把源文件放回原路径，或在 Power Query 编辑器里改源路径；发给别人前先说明刷新依赖"}, {"problem": "导出 CSV 后多表没了", "cause": "CSV 只能存一张表", "solution": "CSV 只保存当前工作表；多表要逐张另存，或直接发 .xlsx"}], "exercises": ["导入 CSV 后金额合计是 28500，与源系统报表一致，行数也是 5 行，能不能直接断定导对了？还要核对什么？", "从网页导入的表格，下个月结构变了会怎样？", "CSV 导出会丢什么？发给别人继续编辑应该发什么格式？"], "answers": ["基本可断定，但还要抽查：订单号是否完整（有无科学计数法）、日期列格式是否正确、中文有无乱码。合计与行数一致是必要非充分条件。", "查询会报错或抓错列。需要在 Power Query 编辑器里重新配置抓取步骤；结构不稳定的网页不适合做固定刷新源。", "CSV 只保留当前工作表的数据，无格式、无公式、无多表。继续编辑发 .xlsx；只给对方看发 PDF；导给系统用 CSV。"], "versions": "Excel 2016／2019／2021／365"}], "func_tutorials": {"AND": ["案例：自动标红逾期"], "AVERAGE": ["公式入门：公式结构、运算符与输入编辑"], "CONCAT": ["
