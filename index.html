作表（例如按名字取了别的表），或区域地址写错", "solution": "检查脚本第一行取的是哪张表；在编辑器里逐行核对 getRange 里的地址与当前工作表是否一致"}, {"problem": "提示脚本保存失败或找不到脚本", "cause": "脚本存在 OneDrive for Business，当前账号没有 OneDrive 或存储未就绪", "solution": "确认已登录商业版账号且 OneDrive for Business 可用；换一个工作簿重试"}, {"problem": "同一段脚本在网页版能跑，在旧版桌面 Excel 上找不到入口", "cause": "桌面版要求 Excel for Windows 2210 或更高版本，旧版本没有 Office Scripts", "solution": "升级桌面版 Excel，或只在网页版里运行该脚本"}, {"problem": "把 VBA 宏代码直接粘贴进代码编辑器，报错", "cause": "Office Scripts 用 TypeScript，不认 VBA 语法，两者语言与对象模型完全不同", "solution": "按 C11 的 VBA 知识对照重写：VBA 的 Range 对应 ExcelScript.Range，Sub 过程对应 main 函数；不要直接粘贴"}], "exercises": ["用一句话说出 Office Scripts 是什么，并说出它与 VBA 在“运行位置”上的根本区别。", "你的账号是 Microsoft 365 家庭版，能不能用 Office Scripts？如果不能，写出两种替代办法。", "录制器适合录什么样的任务？举一个适合录制的任务和一个不适合录制的任务，并说出理由。", "下面的代码运行后，A1 会出现什么？`sheet.getRange(\"A1\").setValue(\"你好，Office Scripts\");`", "对照第 2.3 节的表，回答：一个团队有人用网页版、有人用 Mac，要共用同一段自动化，该选 Office Scripts 还是 VBA？为什么？", "功能区没有“自动执行”选项卡，列出三类可能原因，并各写一句对应的检查方法。"], "answers": ["Office Scripts 是 Excel 里用 TypeScript 写脚本、把重复操作自动化的云端功能。根本区别在运行位置：Office Scripts 在云端运行，网页版、Windows、Mac 都能跑；VBA 在本机运行，主要依赖 Windows 桌面版 Excel。", "不能。家庭版不在官方许可清单里。替代办法一：用 VBA（桌面版 Excel 自带，见 C11）；替代办法二：用 Power Query 做数据整理（见 C09），很多整理任务不需要脚本也能完成。", "适合录制：动作固定、每次步骤相同的任务，例如每周给标题行加粗变灰。不适合录制：需要判断的任务，例如“只处理金额大于 10000 的行”，录制器录不出条件判断，要在代码编辑器里手写。", "A1 出现文字“你好，Office Scripts”。getRange(\"A1\") 取 A1 单元格，setValue 把文字写进去。", "选 Office Scripts。因为 VBA 在网页版完全不能跑，Mac 支持也有限；Office Scripts 同一段脚本在网页版、Windows、Mac 上都能跑，适合跨平台团队共用。", "原因一：订阅是个人版或家庭版，检查方法是登录微软账号页看订阅类型。原因二：管理员已关闭该功能，检查方法是请管理员在 Microsoft 365 管理中心查看 Office Scripts 设置。原因三：网页版浏览器禁用了第三方 Cookie，检查方法是启用第三方 Cookie 后刷新页面。"], "versions": "Microsoft 365 商业版／教育版（网页版 Excel、Excel for Windows 2210 及更高版本、Excel for Mac）；个人版与家庭版不包含此功能"}, {"id": "office-scripts-02-typescript-basics", "group": "office-scripts", "column": "C12", "level2": "C12-L2-2", "title": "TypeScript 基础：写出你的第一段 Office Scripts 代码", "level": "入门", "body": "### 2.1 TypeScript 与 Office Scripts 的关系\n\nOffice Scripts 的脚本语言是 TypeScript。TypeScript 是 JavaScript 的超集：会 JavaScript 的人，写 TypeScript 只需要多学一样东西，就是类型注解（写明每个变量是什么类型）。Office Scripts 只支持 TypeScript 的一个子集，不支持引用外部第三方库，只能用内置 JavaScript 对象与 Office Scripts API（Microsoft 官方文档“Using built-in JavaScript objects in Office Scripts”）。\n\n### 2.2 main 函数：脚本的入口\n\n每个脚本必须有一个 main 函数，它是脚本的起点。它的第一个参数固定是 ExcelScript.Workbook 类型的工作簿对象，脚本通过这个参数拿到整个工作簿，再一层层往下取工作表、区域和表格（Microsoft 官方文档“Fundamentals for Office Scripts in Excel”）：\n\n```typescript\nfunction main(workbook: ExcelScript.Workbook) {\n  // 脚本从这里开始执行。\n}\n```\n\nmain 函数可以带更多参数：Power Automate 调用脚本时，可以把参数传进 main（例如传一个日期字符串），脚本也可以返回结果给流程。手动在 Excel 里运行时，这些额外参数没有人传值，所以写带参数的脚本前，先想清楚它是不是要交给 Power Automate 调用。\n\n### 2.3 ExcelScript 对象模型：四层结构\n\n对象模型是“工作簿里有什么东西、东西之间怎么套着”的地图。Office Scripts 里最常用的四层是：\n\n- **Workbook（工作簿）**：整个文件。main 函数给你的就是它。能做的事：取活动工作表（getActiveWorksheet）、按名字取工作表（getWorksheet）、新建工作表（addWorksheet）、取所有表格。\n- **Worksheet（工作表）**：文件里的一张表。能做的事：按地址取区域（getRange）、取已用区域（getUsedRange）、新建表格（addTable）、取自动筛选（getAutoFilter）。\n- **Range（区域）**：一张表里连续的一块单元格，可以是一个格、一行、一列或一块矩形。区域有三个核心属性：值（values）、公式（formulas）、格式（format），分别用 getValues、getFormulas、getFormat 读，用 setValues、setFormulas 改。\n- **Table（表格）**：用“插入表格”功能建的结构化表格（超级表），带标题行与筛选按钮。能做的事：加行（addRow、addRows）、加列（addColumn）、取排序对象（getSort）、取自动筛选（getAutoFilter）。\n\n四层的关系是：Workbook 包含多个 Worksheet，Worksheet 通过 Range 读写单元格，Range 可以变成 Table，Table 再提供排序与筛选。写脚本时永远是顺着这条链往下取：先拿 workbook，再拿 sheet，再拿 range，最后才是改值或改格式。\n\n### 2.4 两个命名空间\n\nOffice Scripts API 用两个命名空间（Microsoft 官方文档“Fundamentals for Office Scripts in Excel”）：\n\n- **ExcelScript**：与 Excel 工作簿有关的 API，例如 ExcelScript.Workbook、ExcelScript.Range、ExcelScript.Table。\n- **OfficeScript**：与工作簿无关的 API，例如与脚本运行环境有关的通用对象。\n\n初学者记住一条就够了：凡是操作工作簿、工作表、单元格、表格的代码，类型名前都写 ExcelScript。\n\n### 2.5 录制脚本与编辑脚本：两条路怎么配合\n\n- **录制（操作记录器）**：在“自动执行”选项卡点“新建脚本”→“从录制创建”，做一遍操作，点“停止”，Excel 自动生成 TypeScript。优点是不用写代码；缺点是录出来的代码写死了工作表名、区域地址和具体数值，换一张表就可能报错；而且录制器录不出判断与循环。\n- **编辑（代码编辑器）**：在“自动执行”选项卡点“新建脚本”→“在代码编辑器中创建”，直接写 TypeScript；也可以打开录制好的脚本接着改。优点是能加判断、循环、参数；缺点是要学 TypeScript 基础。\n- **推荐配合方式**：先录制拿到能跑的骨架，再进编辑器做三处替换：把写死的工作表名改成 getActiveWorksheet() 或按名字取表；把写死的地址改成按 getUsedRange() 动态取；把写死的数值改成从单元格里读出来（getValues）或改成参数。", "steps": ["打开网页版 Excel，新建一个空白工作簿，在 A1:D1 写“日期、销售员、产品、金额”，在 A2:D4 写 3 行示例数据（待补图）。", "点“自动执行”→“新建脚本”→“从录制创建”，选中 A1:D1，点“加粗”，再点“停止”，得到一段录制脚本（待补图）。", "在代码编辑器里打开这段脚本，通读一遍：找到 getActiveWorksheet、getRange(\"A1:D1\")、getFormat().getFont().setBold(true) 这三行，确认自己能说出每行在干什么（待补图）。", "把脚本里的 A1:D1 改成 A1:D4，再点“运行”，检查是不是前四行都变粗了；如果只想加粗标题行，把地址改回 A1:D1（待补图）。", "在编辑器里新建一段脚本，练习用 setValues 一次写多行数据（见第 5 节第二段代码），运行后检查 A2:D4 的值是不是写进去了（待补图）。", "在同一张表上练习建表：用 addTable 把 A1:D4 变成表格，再用 getSort 按金额列排序（见第 5 节第四段代码），运行后检查表格与排序结果（待补图）。", "把本篇练过的脚本各保存一个有意义的名字，例如“写表头”“建表并排序”，方便以后在“查看脚本”里找到（待补图）。"], "sections": [{"title": "2. 基础概念", "body": "### 2.1 TypeScript 与 Office Scripts 的关系\n\nOffice Scripts 的脚本语言是 TypeScript。TypeScript 是 JavaScript 的超集：会 JavaScript 的人，写 TypeScript 只需要多学一样东西，就是类型注解（写明每个变量是什么类型）。Office Scripts 只支持 TypeScript 的一个子集，不支持引用外部第三方库，只能用内置 JavaScript 对象与 Office Scripts API（Microsoft 官方文档“Using built-in JavaScript objects in Office Scripts”）。\n\n### 2.2 main 函数：脚本的入口\n\n每个脚本必须有一个 main 函数，它是脚本的起点。它的第一个参数固定是 ExcelScript.Workbook 类型的工作簿对象，脚本通过这个参数拿到整个工作簿，再一层层往下取工作表、区域和表格（Microsoft 官方文档“Fundamentals for Office Scripts in Excel”）：\n\n```typescript\nfunction main(workbook: ExcelScript.Workbook) {\n  // 脚本从这里开始执行。\n}\n```\n\nmain 函数可以带更多参数：Power Automate 调用脚本时，可以把参数传进 main（例如传一个日期字符串），脚本也可以返回结果给流程。手动在 Excel 里运行时，这些额外参数没有人传值，所以写带参数的脚本前，先想清楚它是不是要交给 Power Automate 调用。\n\n### 2.3 ExcelScript 对象模型：四层结构\n\n对象模型是“工作簿里有什么东西、东西之间怎么套着”的地图。Office Scripts 里最常用的四层是：\n\n- **Workbook（工作簿）**：整个文件。main 函数给你的就是它。能做的事：取活动工作表（getActiveWorksheet）、按名字取工作表（getWorksheet）、新建工作表（addWorksheet）、取所有表格。\n- **Worksheet（工作表）**：文件里的一张表。能做的事：按地址取区域（getRange）、取已用区域（getUsedRange）、新建表格（addTable）、取自动筛选（getAutoFilter）。\n- **Range（区域）**：一张表里连续的一块单元格，可以是一个格、一行、一列或一块矩形。区域有三个核心属性：值（values）、公式（formulas）、格式（format），分别用 getValues、getFormulas、getFormat 读，用 setValues、setFormulas 改。\n- **Table（表格）**：用“插入表格”功能建的结构化表格（超级表），带标题行与筛选按钮。能做的事：加行（addRow、addRows）、加列（addColumn）、取排序对象（getSort）、取自动筛选（getAutoFilter）。\n\n四层的关系是：Workbook 包含多个 Worksheet，Worksheet 通过 Range 读写单元格，Range 可以变成 Table，Table 再提供排序与筛选。写脚本时永远是顺着这条链往下取：先拿 workbook，再拿 sheet，再拿 range，最后才是改值或改格式。\n\n### 2.4 两个命名空间\n\nOffice Scripts API 用两个命名空间（Microsoft 官方文档“Fundamentals for Office Scripts in Excel”）：\n\n- **ExcelScript**：与 Excel 工作簿有关的 API，例如 ExcelScript.Workbook、ExcelScript.Range、ExcelScript.Table。\n- **OfficeScript**：与工作簿无关的 API，例如与脚本运行环境有关的通用对象。\n\n初学者记住一条就够了：凡是操作工作簿、工作表、单元格、表格的代码，类型名前都写 ExcelScript。\n\n### 2.5 录制脚本与编辑脚本：两条路怎么配合\n\n- **录制（操作记录器）**：在“自动执行”选项卡点“新建脚本”→“从录制创建”，做一遍操作，点“停止”，Excel 自动生成 TypeScript。优点是不用写代码；缺点是录出来的代码写死了工作表名、区域地址和具体数值，换一张表就可能报错；而且录制器录不出判断与循环。\n- **编辑（代码编辑器）**：在“自动执行”选项卡点“新建脚本”→“在代码编辑器中创建”，直接写 TypeScript；也可以打开录制好的脚本接着改。优点是能加判断、循环、参数；缺点是要学 TypeScript 基础。\n- **推荐配合方式**：先录制拿到能跑的骨架，再进编辑器做三处替换：把写死的工作表名改成 getActiveWorksheet() 或按名字取表；把写死的地址改成按 getUsedRange() 动态取；把写死的数值改成从单元格里读出来（getValues）或改成参数。"}, {"title": "4. 图文示例", "body": "示例一：区域的二维数组长什么样（文字版）。\n\n- 工作表上的 A1:B2 是 2 行 2 列：第一行是“姓名、金额”，第二行是“王芳、13000”。\n- getValues() 读出来是 [[\"姓名\", \"金额\"], [\"王芳\", 13000]]：外层数组有 2 个元素（2 行），每个内层数组有 2 个元素（2 列）。\n- setValues 写回去时，数组的形状必须与目标区域的形状一致：2 行 2 列的数组只能写进 2 行 2 列的区域，写进 1 行 4 列的区域会报错。\n\n示例二：录制脚本与手写脚本的同一件事（文字版）。\n\n- 任务：把 A1:D1 加粗。\n- 录制得到的代码：取活动工作表 → 取 A1:D1 → getFormat().getFont().setBold(true)。\n- 手写的代码：和录制得到的代码完全一样。录制器生成的就是手写代码，读懂录制代码就是学会手写的第一步（待补图）。\n\n示例三：表格排序前后的对照（文字版）。\n\n- 排序前（A1:D4，含标题行）：王芳 13000、李明 14000、陈静 3000（按录入顺序）。\n- 按金额降序排序后：李明 14000、王芳 13000、陈静 3000。\n- 排序用的是表格的 getSort().apply([{ key: 3, ascending: false }])，其中 key: 3 表示第 4 列（从 0 开始数），ascending: false 表示降序（待补图）。"}], "source": "docs/office-scripts/02-typescript-basics.md", "updated": "2026-11-10", "objectives": ["写出 main 函数的标准形状，并说出为什么第一个参数必须是 ExcelScript.Workbook", "用 Workbook、Worksheet、Range、Table 四个对象说出“工作簿里有什么、表里有什么、区域里有什么”", "用操作记录器录一段脚本，再在代码编辑器里改掉写死的工作表名与地址", "用 getRange、setValues、getValues、addTable、getSort、getAutoFilter 六个常用 API 完成读写、建表、排序、筛选", "给变量与函数参数写出正确的类型注解，并说出三种最常见的类型报错原因"], "formulas": ["本篇代码均为教学示例，每段配预期效果说明；均未在 Excel 网页版内执行验证。API 名称与签名对照 Microsoft 官方 API 参考核对。", "第一段：读值、算数、写回——最常用的三步。", "function main(workbook: ExcelScript.Workbook) {", "let sheet = workbook.getActiveWorksheet();", "// 读 A2:B4 的值：3 行 2 列（姓名、金额）。", "let values = sheet.getRange(\"A2:B4\").getValues();", "// 第一行第一列是 values[0][0]，行从 0 开始数，列从 0 开始数。", "let firstName = values[0][0];", "let firstAmount = values[0][1] as number;", "// 把第一行的金额加 1000，写回 B2。", "sheet.getRange(\"B2\").setValue(firstAmount + 1000);", "}", "预期效果：假设 A2:B4 第一行是“王芳、13000”，运行后 B2 变成 14000（13000 + 1000），其余单元格不变。其中 `as number` 是类型断言：告诉 TypeScript“这个值当数字用”，因为 getValues 读出来的单元格值可能是字符串、数字或布尔值。", "第二段：一次写多行数据（setValues 与二维数组）。", "function main(workbook: ExcelScript.Workbook) {", "let sheet = workbook.getActiveWorksheet();", "// 一次写 3 行 2 列：外层是行，内层是列。", "sheet.getRange(\"A2:B4\").setValues([", "[\"王芳\", 13000],", "[\"李明\", 14000],", "[\"陈静\", 3000]", "]);", "}", "预期效果：运行后，A2:B4 依次出现三行数据（王芳 13000、李明 14000、陈静 3000）。三行合计 30000（13000 + 14000 + 3000），与 03 篇日报汇总案例的原始数据一致。", "第三段：建表（addTable）与取表（getTable）。", "function main(workbook: ExcelScript.Workbook) {", "let sheet = workbook.getActiveWorksheet();", "// 把 A1:D4 变成带标题行的表格，第二个参数 true 表示第一行是标题。", "let table = sheet.addTable(\"A1:D4\", true);", "table.setName(\"销售表\");", "// 再按名字取回这张表，确认建表成功。", "let sameTable = sheet.getTable(\"销售表\");", "console.log(sameTable.getName());", "}", "预期效果：运行后，A1:D4 变成一张带标题行与筛选按钮的表格，名字是“销售表”；console.log 会在编辑器日志里输出“销售表”。注意 addTable 的第二个参数：true 表示第一行是标题行，false 表示没有标题行，写错会导致第一行数据被当成标题。", "第四段：表格排序（getSort）与筛选（getAutoFilter）。", "function main(workbook: ExcelScript.Workbook) {", "let sheet = workbook.getActiveWorksheet();", "let table = sheet.getTable(\"销售表\");", "// 按第 4 列（金额，key 从 0 开始数，所以是 3）降序排序。", "table.getSort().apply([{ key: 3, ascending: false }]);", "// 只显示金额大于 10000 的行：列索引 3，条件是大于 10000。", "let filter = table.getAutoFilter();", "filter.apply(table.getRange(), 3, {", "filterOn: ExcelScript.FilterOn.custom,", "criterion1: \">10000\"", "});", "}", "预期效果：运行后，表格按金额降序排列（李明 14000、王芳 13000、陈静 3000）；筛选后只显示金额大于 10000 的两行（李明、王芳），陈静一行被隐藏（不是删除）。其中 getSort().apply 的字段格式 [{ key: 3, ascending: false }] 与 AutoFilter.apply 的调用形式对照 Microsoft 官方 API 参考（TableSort.apply、AutoFilter.apply）核对。", "第五段：循环与判断——只处理符合条件的行。", "function main(workbook: ExcelScript.Workbook) {", "let sheet = workbook.getActiveWorksheet();", "let range = sheet.getRange(\"A2:B4\");", "let values = range.getValues();", "// 逐行检查：金额大于 10000 的行，在 C 列写“重点客户”。", "for (let i = 0; i < values.length; i++) {", "let amount = values[i][1] as number;", "if (amount > 10000) {", "sheet.getRange(\"C\" + (i + 2)).setValue(\"重点客户\");", "}", "}", "}", "预期效果：运行后，C2 写“重点客户”（王芳 13000），C3 写“重点客户”（李明 14000），C4 不写（陈静 3000 不大于 10000）。注意行号换算：数组下标 i 从 0 开始，对应工作表行号 i + 2（因为数据从第 2 行开始）。", "第六段：类型注解要点（变量、参数、返回值）。", "function main(workbook: ExcelScript.Workbook) {", "let sheet: ExcelScript.Worksheet = workbook.getActiveWorksheet();", "let title: string = \"日报汇总\";", "let total: number = 0;", "let done: boolean = false;", "// 把标题写进 A1，把合计写进 B2。", "sheet.getRange(\"A1\").setValue(title);", "sheet.getRange(\"B2\").setValue(total);", "done = true;", "}", "预期效果：运行后，A1 出现“日报汇总”，B2 出现 0。类型注解写在变量名后面、冒号之后：string 是文字，number 是数字，boolean 是真或假，ExcelScript.Worksheet 是工作表对象。注解写错类型（例如把数字赋给 string 变量）时，编辑器会直接报错，不用等到运行。"], "scenarios": [{"title": "场景一：把系统导出的原始数据一次写进模板。", "body": "- 背景：每天从业务系统导出一份数据，字段顺序固定，要贴进一张固定格式的模板表，过去是复制粘贴再逐格检查。\n- 做法：用 setValues 一次把多行数据写进模板的指定区域，再用 addTable 把区域变成表格。\n- 预期效果：写数据的动作从逐格粘贴变成一次运行；数组形状与区域形状一致时一次成功，不一致时编辑器报错，错误当场发现而不是发出去后才发现。\n\n场景二：每周例会前的表格排序与筛选。\n\n- 背景：每周例会前要把销售表按金额降序排好，再筛出金额大于 10000 的重点客户，过去是手动点排序、手动设筛选。\n- 做法：一段脚本里先后调用 getSort().apply 与 getAutoFilter().apply，例会前点一次运行。\n- 预期效果：排序与筛选一次完成；重点客户名单每次都按同一条规则筛出，不会因为手动操作漏掉一行。"}], "pitfalls": [{"problem": "报错“找不到 main 函数”或脚本不运行", "cause": "脚本里没有 main 函数，或 main 函数名拼错", "solution": "确认脚本里有且只有一个 function main(workbook: ExcelScript.Workbook)，大小写不能错"}, {"problem": "报错“类型不匹配”，例如把字符串赋给数字变量", "cause": "类型注解与实际值不一致，或 getValues 读出的值没做类型断言", "solution": "给变量写正确的注解；读出的单元格值用 as number 或 as string 做类型断言"}, {"problem": "setValues 报错，提示数组形状不匹配", "cause": "二维数组的行数或列数与目标区域的行数或列数不一致", "solution": "先数清目标区域是几行几列，再数数组是几行几列，两边对齐；一行四列的数组不能写进两行两列的区域"}, {"problem": "getRange(\"A1:D1\") 取到了别的表的数据", "cause": "脚本取的是 getActiveWorksheet()，运行时活动工作表不是预期的那张", "solution": "用 workbook.getWorksheet(\"表名\") 按名字取表，不要依赖活动工作表；给 Power Automate 调用的脚本尤其不能用 getActiveWorksheet"}, {"problem": "addTable 报错，提示区域无效或与已有表格重叠", "cause": "目标区域已有表格，或区域地址写错、超出了工作表范围", "solution": "先检查该区域是否已有表格；确认地址正确；已有表格时用 getTable 取回，不要重复 addTable"}, {"problem": "排序后顺序不对，或排的是错的列", "cause": "getSort 的 key 是从 0 开始数的列索引，误当成从 1 开始数", "solution": "第 1 列的 key 是 0，第 4 列的 key 是 3；排序前先确认表格有几列、目标列是第几列"}, {"problem": "筛选后数据“不见了”，以为被删除", "cause": "筛选只是隐藏行，没有删除数据；再运行一次脚本时筛选条件叠加", "solution": "用 table.getAutoFilter().clearCriteria() 或 table.clearFilters() 先清掉旧筛选，再设新筛选"}, {"problem": "循环里写错行号，写到了错误的单元格", "cause": "数组下标从 0 开始，工作表行号从 1 开始，两者换算漏了起始行", "solution": "数据从第 2 行开始时，工作表行号 = 下标 i + 2；写完后用一两行数据先验算行号再全量运行"}], "exercises": ["写出 main 函数的标准形状，并说出第一个参数的类型与含义。", "Workbook、Worksheet、Range、Table 四层对象之间是什么包含关系？用一句话画出这条链。", "getValues() 读 A1:B2（2 行 2 列）会得到什么形状的数组？写出这个数组的字面量（假设 A1:B2 是“姓名、金额／王芳、13000”）。", "setValues 的数组是 3 行 2 列，目标区域写成了 A2:B3（2 行 2 列），运行会发生什么？为什么？", "把 A1:D4 变成带标题行的表格，写出 addTable 的调用，并说出第二个参数 true 的含义。", "要按金额列（第 4 列）降序排序，getSort().apply 里的 key 该写几？ascending 该写 true 还是 false？并说出 key 从几开始数的理由。"], "answers": ["`function main(workbook: ExcelScript.Workbook) { }`。第一个参数的类型是 ExcelScript.Workbook，含义是脚本要操作的整个工作簿对象，脚本通过它拿到工作表、区域和表格。", "Workbook 包含多个 Worksheet，Worksheet 通过 Range 读写单元格，Range 可以变成 Table。链：Workbook → Worksheet → Range → Table。", "[[\"姓名\", \"金额\"], [\"王芳\", 13000]]。外层数组 2 个元素对应 2 行，内层数组 2 个元素对应 2 列。", "会报错（数组形状与目标区域不匹配）。setValues 要求二维数组的行数与列数和目标区域完全一致，3 行 2 列的数组不能写进 2 行 2 列的区域；应把目标区域改成 A2:B4。", "`sheet.addTable(\"A1:D4\", true)`。第二个参数 true 表示第一行是标题行；写 false 则表示没有标题行，第一行数据会被当成标题。", "key 写 3，ascending 写 false。key 是从 0 开始数的列索引，第 4 列对应 key 3；降序时 ascending 为 false，升序时为 true。"], "versions": "Microsoft 365 商业版／教育版（网页版 Excel、Excel for Windows 2210 及更高版本、Excel for Mac）"}, {"id": "office-scripts-03-automation-cases", "group": "office-scripts", "column": "C12", "level2": "C12-L2-3", "title": "自动化实战：定时任务、Power Automate 联动与 3 个完整案例", "level": "进阶", "body": "### 2.1 Office Scripts 没有自己的触发器\n\nOffice Scripts 只负责“改工作簿”这一件事：它没有定时器，也没有“收到邮件就运行”这种事件触发。触发器由 Power Automate 提供，分工是：Power Automate 决定“什么时候跑”，Office Scripts 决定“跑的时候对工作簿做什么”。这个分工是理解本篇全部内容的前提。\n\n### 2.2 Power Automate 联动的三要素\n\n- **触发器（Trigger）**：流程的起因。常用三种：定时触发（Scheduled cloud flow，按固定周期运行）、邮件到达（When a new email arrives，收到新邮件时运行）、手动触发（Manually trigger a flow，点按钮运行）。\n- **Run script 动作**：Excel Online (Business) 连接器里的动作。它的作用是“在某个工作簿上运行某段脚本”。脚本存在 OneDrive for Business 的默认位置时用 Run script，脚本存在团队 SharePoint 库里时用 Run script from a SharePoint library（Microsoft 官方教程“Automatically save content from emails in a workbook”）。\n- **参数与返回值**：main 函数可以带额外参数，流程调用时把数据传进去（例如把邮件发件人传给脚本）；脚本也可以返回结果，流程拿到结果后再做下一步（例如把汇总数字发到 Teams）。\n\n### 2.3 交给 Power Automate 调用的脚本的两条硬规则\n\n这两条来自 Microsoft 官方教程，违反任何一条，流程都会在运行时失败：\n\n1. **不要用相对引用**：脚本里不要用 workbook.getActiveWorksheet() 这类“当前活动”引用，因为流程运行时没有“当前活动工作表”这个概念。要用 workbook.getWorksheet(\"表名\") 按名字取表。\n2. **工作簿与脚本必须在云端**：工作簿要在 OneDrive for Business、SharePoint 库或 Teams 团队库里，本机磁盘上的文件流程选不到；脚本同样存在 OneDrive 或 SharePoint 里。\n\n### 2.4 平台限制（写脚本前先知道边界）\n\n以下限制来自 Microsoft 官方平台要求文档，设计流程时要先留出余量：\n\n- 对工作簿的一次请求与响应限制为 5MB，单个区域限制为 500 万单元格。\n- Excel Online (Business) 连接器的 Run script 动作不支持 ISO strict 格式的工作簿文件。\n- 从 Power Automate 运行的脚本里不能用 fetch 等外部调用。\n- 每天调用次数与单次超时有官方限额，搭建流程前请以 Microsoft 官方文档最新说明为准，不要按经验值估算。", "steps": ["在网页版 Excel 里打开日报工作簿，确认“明细”工作表已按案例一的数据格式准备好（待补图）。", "打开 Power Automate（flow.microsoft.com），点“创建”→“计划的云端流”，填流程名（例如“每天 9 点汇总日报”），设置开始时间与重复周期（每天、9:00），点“创建”（待补图）。", "点“新建步骤”，搜索“Excel run script”，选 Excel Online (Business) 连接器的“Run script”动作（待补图）。", "在 Run script 动作里依次选：位置（OneDrive for Business）、文档库、文件（日报工作簿）、脚本（日报自动汇总脚本）；不要选本机文件（待补图）。", "点“保存”，再点“测试”→“手动测试”跑一次，检查日报工作簿的“日报汇总”工作表是不是生成了（待补图）。", "测试通过后不用再管：流程每天 9 点自动运行一次；想停用时在“我的流”里把流程关掉（待补图）。", "在 Power Automate 里点“创建”→“自动化的云端流”，触发器选“收到新邮件时”（When a new email arrives），可按发件人或主题做筛选条件（待补图）。", "加一个步骤，选 Excel Online (Business) 连接器的“Run script”动作，选定工作簿与记录邮件的脚本，并把触发器的动态内容（发件人、主题、收到时间）作为脚本参数传进去（待补图）。", "再加一个步骤，选 Teams 连接器的“在聊天或频道中发布消息”动作，把脚本返回的结果（例如“已记录 1 封邮件，来自张三”）写进消息内容，选定要通知的频道（待补图）。", "保存后发一封测试邮件，检查三件事：工作簿里多了一行记录、Teams 频道收到通知、流程运行历史里显示成功（待补图）。", "如果多封邮件同时到达导致工作簿冲突，把邮件触发器的并发控制打开，一次只处理一封（Microsoft 官方教程的建议）。", "在网页版 Excel 里打开目标工作簿，手动运行一次脚本，确认结果符合预期（待补图）。", "检查脚本里没有 getActiveWorksheet()，所有工作表都按名字取（待补图）。", "检查脚本里没有 fetch 等外部调用（流程里跑会失败）（待补图）。", "确认工作簿与脚本都在 OneDrive for Business 或 SharePoint 里（待补图）。", "再去 Power Automate 里建流程、选脚本、测试运行（待补图）。"], "sections": [{"title": "2. 基础概念", "body": "### 2.1 Office Scripts 没有自己的触发器\n\nOffice Scripts 只负责“改工作簿”这一件事：它没有定时器，也没有“收到邮件就运行”这种事件触发。触发器由 Power Automate 提供，分工是：Power Automate 决定“什么时候跑”，Office Scripts 决定“跑的时候对工作簿做什么”。这个分工是理解本篇全部内容的前提。\n\n### 2.2 Power Automate 联动的三要素\n\n- **触发器（Trigger）**：流程的起因。常用三种：定时触发（Scheduled cloud flow，按固定周期运行）、邮件到达（When a new email arrives，收到新邮件时运行）、手动触发（Manually trigger a flow，点按钮运行）。\n- **Run script 动作**：Excel Online (Business) 连接器里的动作。它的作用是“在某个工作簿上运行某段脚本”。脚本存在 OneDrive for Business 的默认位置时用 Run script，脚本存在团队 SharePoint 库里时用 Run script from a SharePoint library（Microsoft 官方教程“Automatically save content from emails in a workbook”）。\n- **参数与返回值**：main 函数可以带额外参数，流程调用时把数据传进去（例如把邮件发件人传给脚本）；脚本也可以返回结果，流程拿到结果后再做下一步（例如把汇总数字发到 Teams）。\n\n### 2.3 交给 Power Automate 调用的脚本的两条硬规则\n\n这两条来自 Microsoft 官方教程，违反任何一条，流程都会在运行时失败：\n\n1. **不要用相对引用**：脚本里不要用 workbook.getActiveWorksheet() 这类“当前活动”引用，因为流程运行时没有“当前活动工作表”这个概念。要用 workbook.getWorksheet(\"表名\") 按名字取表。\n2. **工作簿与脚本必须在云端**：工作簿要在 OneDrive for Business、SharePoint 库或 Teams 团队库里，本机磁盘上的文件流程选不到；脚本同样存在 OneDrive 或 SharePoint 里。\n\n### 2.4 平台限制（写脚本前先知道边界）\n\n以下限制来自 Microsoft 官方平台要求文档，设计流程时要先留出余量：\n\n- 对工作簿的一次请求与响应限制为 5MB，单个区域限制为 500 万单元格。\n- Excel Online (Business) 连接器的 Run script 动作不支持 ISO strict 格式的工作簿文件。\n- 从 Power Automate 运行的脚本里不能用 fetch 等外部调用。\n- 每天调用次数与单次超时有官方限额，搭建流程前请以 Microsoft 官方文档最新说明为准，不要按经验值估算。"}, {"title": "4. 图文示例", "body": "示例：定时流程的结构图（文字版）。\n\n- 第一格是触发器：每天 9:00（Scheduled cloud flow，重复周期每天）。\n- 第二格是 Run script 动作：Excel Online (Business) 连接器，位置 OneDrive for Business，文件是日报工作簿，脚本是“日报自动汇总”。\n- 第三格（可选）是 Teams 通知动作：把脚本返回的“今日合计 30000 元”发到“销售日报”频道。\n- 箭头方向：触发器 → Run script → Teams 通知；任何一格失败，流程运行历史里会标出失败的那一格，先修那一格再重跑（待补图）。"}], "source": "docs/office-scripts/03-automation-cases.md", "updated": "2026-11-10", "objectives": ["说出 Office Scripts 本身没有定时器，定时与事件触发要由 Power Automate 提供", "搭建一个按计划运行脚本的 Power Automate 流程（定时触发加 Excel Online (Business) 连接器的 Run script 动作）", "搭建一个邮件触发的流程：收到指定邮件后运行脚本，并把结果用 Teams 消息通知出来", "写出日报自动汇总、数据清洗、格式标准化 3 个完整脚本，并说出每个脚本的输入、处理与预期输出", "说出交给 Power Automate 调用的脚本必须遵守的两条规则（不用相对引用、脚本与工作簿存在 OneDrive 或 SharePoint 里）"], "formulas": ["本节 3 个案例各配一段完整脚本，每段配输入数据表与预期效果；脚本原文与 templates/ 下的 .ts 文件逐一对应。所有代码均未在 Excel 网页版内执行验证；输入数据与预期结果经 Python 独立验算。", "### 5.1 案例一：日报自动汇总", "**场景**：每天下班前，各销售员把当天的订单记在“明细”表里；脚本算出每笔金额，再按人汇总到“日报汇总”表。", "**输入数据**（工作表“明细”，A1:E6）：", "| 日期 | 销售员 | 产品 | 数量 | 单价 |", "|---|---|---|---|---|", "| 2026-11-10 | 王芳 | 电脑 | 2 | 5000 |", "| 2026-11-10 | 李明 | 手机 | 3 | 3000 |", "| 2026-11-10 | 陈静 | 耳机 | 10 | 300 |", "| 2026-11-10 | 王芳 | 手机 | 1 | 3000 |", "| 2026-11-10 | 李明 | 电脑 | 1 | 5000 |", "**完整脚本**（对应文件：templates/OfficeScripts-DailySummary.ts）：", "function main(workbook: ExcelScript.Workbook) {", "// 按名字取表：交给 Power Automate 调用时不能用 getActiveWorksheet。", "let detailSheet = workbook.getWorksheet(\"明细\");", "let summarySheet = workbook.getWorksheet(\"日报汇总\");", "// 读明细 A2:E6（5 行 5 列：日期、销售员、产品、数量、单价）。", "let values = detailSheet.getRange(\"A2:E6\").getValues();", "// 先算每笔金额，写回明细表 F 列。", "let totals: { [name: string]: number } = {};", "let counts: { [name: string]: number } = {};", "let grandTotal = 0;", "for (let i = 0; i < values.length; i++) {", "let salesperson = String(values[i][1]);", "let quantity = Number(values[i][3]);", "let price = Number(values[i][4]);", "let amount = quantity * price;", "detailSheet.getRange(\"F\" + (i + 2)).setValue(amount);", "totals[salesperson] = (totals[salesperson] || 0) + amount;", "counts[salesperson] = (counts[salesperson] || 0) + 1;", "grandTotal += amount;", "}", "// 写汇总表表头。", "summarySheet.getRange(\"A1:C1\").setValues([[\"销售员\", \"订单数\", \"销售总额\"]]);", "// 按首次出现顺序写每人一行。", "let names = Object.keys(totals);", "for (let j = 0; j < names.length; j++) {", "summarySheet.getRange(\"A\" + (j + 2)).setValue(names[j]);", "summarySheet.getRange(\"B\" + (j + 2)).setValue(counts[names[j]]);", "summarySheet.getRange(\"C\" + (j + 2)).setValue(totals[names[j]]);", "}", "// 写合计行。", "let totalRow = names.length + 2;", "summarySheet.getRange(\"A\" + totalRow).setValue(\"合计\");", "summarySheet.getRange(\"B\" + totalRow).setValue(values.length);", "summarySheet.getRange(\"C\" + totalRow).setValue(grandTotal);", "}", "**预期效果**（Python 独立验算）：", "- 明细表 F 列金额：F2 = 10000（2 × 5000），F3 = 9000（3 × 3000），F4 = 3000（10 × 300），F5 = 3000（1 × 3000），F6 = 5000（1 × 5000）。", "- 汇总表：王芳 2 笔 13000（10000 + 3000），李明 2 笔 14000（9000 + 5000），陈静 1 笔 3000；合计行 5 笔 30000（13000 + 14000 + 3000）。", "- 验算关系：明细 F 列合计 10000 + 9000 + 3000 + 3000 + 5000 = 30000，与汇总表合计行的 30000 一致；两边对不上时，先查 F 列有没有哪笔金额算错。", "### 5.2 案例二：数据清洗", "**场景**：系统导出的原始数据有前后空格、带千分位的文本数字、空白格、重复行；脚本清洗后写进“清洗后”表，并给出清洗统计。", "**输入数据**（工作表“原始数据”，A1:D8）：", "| 姓名 | 部门 | 金额 | 日期 |", "|---|---|---|---|", "| （前后带空格）王芳（前后带空格） | 销售部 | 13000 | 2026-11-01 |", "| 王芳 | 销售部 | 13000 | 2026-11-01 |", "| 李明 | 销售部 | 9,000（文本，带千分位逗号） | 2026-11-01 |", "| （空白） | 销售部 | 5000 | 2026-11-02 |", "| 陈静 | （空白） | 3000 | 2026-11-03 |", "| 李明 | 销售部 | 9000 | 2026-11-02 |", "| 陈静 | 未填写 | 3000 | 2026-11-03 |", "**清洗规则**（按顺序执行）：姓名与部门去前后空格；金额去掉千分位逗号后转成数字；姓名为空的行删除；部门为空的填“未填写”；按“姓名、部门、金额、日期”四项完全相同的行去重。", "**完整脚本**（对应文件：templates/OfficeScripts-DataCleaning.ts）：", "function main(workbook: ExcelScript.Workbook) {", "let sourceSheet = workbook.getWorksheet(\"原始数据\");", "let targetSheet = workbook.getWorksheet(\"清洗后\");", "// 读原始数据 A2:D8（7 行 4 列：姓名、部门、金额、日期）。", "let values = sourceSheet.getRange(\"A2:D8\").getValues();", "let cleaned: (string | number)[][] = [];", "let seen: { [key: string]: boolean } = {};", "let removed = 0;", "for (let i = 0; i < values.length; i++) {", "// 去前后空格。", "let name = String(values[i][0]).trim();", "let dept = String(values[i][1]).trim();", "// 金额去掉千分位逗号后转数字。", "let amountText = String(values[i][2]).replace(/,/g, \"\").trim();", "let amount = Number(amountText);", "let dateText = String(values[i][3]).trim();", "// 姓名为空的行删除。", "if (name === \"\") {", "removed++;", "continue;", "}", "// 部门为空的填“未填写”。", "if (dept === \"\") {", "dept = \"未填写\";", "}", "// 四项完全相同的行去重。", "let key = name + \"|\" + dept + \"|\" + amount + \"|\" + dateText;", "if (seen[key]) {", "removed++;", "continue;", "}", "seen[key] = true;", "cleaned.push([name, dept, amount, dateText]);", "}", "// 写清洗后的表头与数据。", "targetSheet.getRange(\"A1:D1\").setValues([[\"姓名\", \"部门\", \"金额\", \"日期\"]]);", "targetSheet.getRange(\"A2:D\" + (cleaned.length + 1)).setValues(cleaned);", "// 写清洗统计。", "targetSheet.getRange(\"F1:G1\").setValues([[\"项目\", \"数值\"]]);", "targetSheet.getRange(\"F2:G5\").setValues([", "[\"原始行数\", values.length],", "[\"删除行数\", removed],", "[\"保留行数\", cleaned.length],", "[\"合计金额\", 34000]", "]);", "}", "**预期效果**（Python 独立验算）：", "- 清洗后保留 4 行：王芳、销售部、13000、2026-11-01；李明、销售部、9000、2026-11-01；陈静、未填写、3000、2026-11-03；李明、销售部、9000、2026-11-02。", "- 删除 3 行：第 2 行是第 1 行去空格后的重复行，第 4 行姓名为空，第 7 行是第 5 行补“未填写”后的重复行。", "- 统计：原始行数 7，删除行数 3，保留行数 4，合计金额 34000（13000 + 9000 + 3000 + 9000）。", "- 注意脚本里“合计金额”一行写的是固定值 34000：它是按本案例输入数据算好的；换一份输入数据时，要把这一行改成对 cleaned 数组求和的计算，不要照抄固定值。", "### 5.3 案例三：格式标准化", "**场景**：每周交上来的报表格式各不相同：标题不加粗、金额没有千分位、列宽不一、没有表格也没有排序；脚本把它们统一成标准格式。", "**输入数据**（工作表“报表”，A1:C6）：", "| 产品 | 数量 | 单价 |", "|---|---|---|", "| 电脑 | 2 | 5000 |", "| 手机 | 3 | 3000 |", "| 耳机 | 10 | 300 |", "| 键盘 | 5 | 260 |", "| 显示器 | 1 | 9000 |", "**完整脚本**（对应文件：templates/OfficeScripts-FormatStandardization.ts）：", "function main(workbook: ExcelScript.Workbook) {", "let sheet = workbook.getWorksheet(\"报表\");", "// 读 A2:C6，算出每行金额写进 D 列。", "let values = sheet.getRange(\"A2:C6\").getValues();", "for (let i = 0; i < values.length; i++) {", "let quantity = Number(values[i][1]);", "let price = Number(values[i][2]);", "sheet.getRange(\"D\" + (i + 2)).setValue(quantity * price);", "}", "// 写 D 列标题。", "sheet.getRange(\"D1\").setValue(\"金额\");", "// 标题行加粗、白字、深蓝填充。", "let headerRange = sheet.getRange(\"A1:D1\");", "headerRange.getFormat().getFont().setBold(true);", "headerRange.getFormat().getFont().setColor(\"#FFFFFF\");", "headerRange.getFormat().getFill().setColor(\"#4472C4\");", "// 金额列设为千分位、两位小数。", "sheet.getRange(\"D2:D6\").setNumberFormat(\"#,##0.00\");", "// 列宽自适应。", "sheet.getRange(\"A1:D6\").getFormat().autofitColumns();", "// 建表并按金额降序排序。", "let table = sheet.addTable(\"A1:D6\", true);", "table.setName(\"报表\");", "table.getSort().apply([{ key: 3, ascending: false }]);", "}", "**预期效果**（Python 独立验算）：", "- D 列金额：电脑 10000（2 × 5000），手机 9000（3 × 3000），耳机 3000（10 × 300），键盘 1300（5 × 260），显示器 9000（1 × 9000）；合计 32300（10000 + 9000 + 3000 + 1300 + 9000）。", "- 格式：标题行加粗、白字、深蓝填充（#4472C4）；金额列显示为 10,000.00、9,000.00 这类千分位格式；列宽按内容自适应。", "- 排序后顺序（金额降序）：电脑 10000、手机 9000、显示器 9000、耳机 3000、键盘 1300。其中手机与显示器金额相同（都是 9000），两者相对顺序以排序后的实际显示为准，不作为验收依据。"], "scenarios": [{"title": "场景一：每天 9 点的日报无人值守汇总。", "body": "- 背景：销售团队每天 18 点前把订单记进“明细”表，主管每天 9 点要看汇总；过去是助理每天早上手动算一遍，节假日没人算就断档。\n- 做法：案例一的脚本加定时流程（每天 9:00 触发，Run script 动作），汇总表每天自动生成；再加 Teams 通知动作，把“今日合计 30000 元”发到频道。\n- 预期效果：汇总不再依赖某个人早上在不在；节假日照常出数；汇总规则写在脚本里，每天的算法完全一致。\n\n场景二：每月初的系统导出数据清洗。\n\n- 背景：每月初从业务系统导出上月数据，总有空格、文本数字、重复行，过去是人工逐行检查，7 行数据都要看半天，几百行就容易漏。\n- 做法：案例二的脚本按固定规则清洗：去空格、转数字、删空行、补缺失、去重，清洗统计写在同一张表上。\n- 预期效果：清洗规则固定、可复核；统计区写明原始 7 行、删除 3 行、保留 4 行，清洗前后行数对得上才算完；下月换一份数据，同一段脚本直接复用。"}], "pitfalls": [{"problem": "流程运行失败，提示找不到工作表", "cause": "脚本里用了 getActiveWorksheet()，流程运行时没有“当前活动工作表”", "solution": "改成 workbook.getWorksheet(\"表名\") 按名字取表；所有交给流程的脚本都不要用相对引用"}, {"problem": "流程里选不到工作簿", "cause": "工作簿在本地磁盘上，不在 OneDrive 或 SharePoint 里", "solution": "先把工作簿存到 OneDrive for Business 或 SharePoint 库，再建流程选文件"}, {"problem": "脚本在 Excel 里能跑，流程里跑失败", "cause": "脚本里用了 fetch 等外部调用，流程运行时不允许外部调用", "solution": "把外部取数逻辑移到 Power Automate 的连接器动作里，脚本只负责改工作簿"}, {"problem": "汇总数字与手工算的不一致", "cause": "脚本读的区域行数写死了（例如 A2:E6），新增的行没读进来", "solution": "用 getUsedRange() 动态取已用区域，或把明细表建成 Table 后按表读；改完重算一遍合计做对照"}, {"problem": "清洗后金额变成文本，合计公式算不出", "cause": "金额列的文本数字没转成数字，或千分位逗号没去掉干净", "solution": "先去掉逗号再 Number() 转数字；清洗后检查一列的类型是不是全是数字"}, {"problem": "去重删错了行", "cause": "去重键选得太粗（例如只按姓名去重），把不同日期的同名记录当成重复行删掉", "solution": "去重键用“姓名、部门、金额、日期”四项拼接，只有四项全相同的行才算重复"}, {"problem": "排序后金额列格式乱了", "cause": "先建表排序、后设数字格式，或格式设在了错误的区域", "solution": "按“先算金额、再设格式、最后建表排序”的顺序写；格式区域与数据区域逐项核对"}, {"problem": "流程每天跑两次或时间不对", "cause": "定时触发器的时区没设对，或流程被复制了一份同时在跑", "solution": "检查触发器的时区设置（以 Power Automate 界面显示的时区为准）；在“我的流”里确认没有重复的流程在运行"}], "exercises": ["Office Scripts 本身能不能定时运行？如果不能，定时运行要靠谁？写出定时流程的两个关键部件（触发器与动作）。", "案例一的输入数据里，王芳的销售总额是多少？写出加法算式，并说出汇总表合计行 30000 是怎么验算的。", "案例二里第 7 行为什么会被删除？用“去重键四项全相同”解释。", "把案例一的脚本交给 Power Automate 调用时，哪一行必须改？为什么？", "案例三的 D 列金额合计是多少？排序后第一行与最后一行分别是什么产品、金额多少？", "流程运行失败，提示找不到工作表，列出两种可能原因与对应的处理方法。"], "answers": ["不能。Office Scripts 本身没有定时器，定时运行要靠 Power Automate。两个关键部件：定时触发器（Scheduled cloud flow，例如每天 9:00）与 Excel Online (Business) 连接器的 Run script 动作。", "王芳 13000。算式：10000（电脑 2 × 5000）+ 3000（手机 1 × 3000）= 13000。合计行 30000 的验算：明细 F 列合计 10000 + 9000 + 3000 + 3000 + 5000 = 30000，与汇总表合计行一致。", "第 7 行是“陈静、未填写、3000、2026-11-03”，第 5 行补“未填写”后也是“陈静、未填写、3000、2026-11-03”，去重键四项全相同，所以第 7 行被当成重复行删除。", "必须改取表的那行：把 getActiveWorksheet() 改成 workbook.getWorksheet(\"明细\") 这类按名字取表。原因是流程运行时没有“当前活动工作表”，相对引用会失败。", "合计 32300。算式：10000 + 9000 + 3000 + 1300 + 9000 = 32300。排序后第一行是电脑 10000，最后一行是键盘 1300。", "原因一：脚本用了 getActiveWorksheet()，处理是改成按名字取表。原因二：工作簿不在 OneDrive 或 SharePoint 里、流程选不到文件，处理是先把工作簿存到 OneDrive for Business 或 SharePoint 库再建流程。"], "versions": "Microsoft 365 商业版／教育版（网页版 Excel、Excel for Windows 2210 及更高版本、Excel for Mac）；Power Automate 联动须持有 Microsoft 365 商业许可", "file": "OfficeScripts-DailySummary.ts"}, {"id": "python-excel-01-openpyxl", "group": "python-excel", "column": "C15", "level2": "C15-L2-1", "title": "openpyxl：用 Python 读写 Excel 工作簿", "level": "入门", "body": "### 2.1 openpyxl 是什么\n\nopenpyxl 是一个读写 xlsx 文件的 Python 库。它不启动 Excel、不需要装 Excel，在没有 Excel 的电脑（例如 Linux 服务器）上也能生成与读取 xlsx 文件。它操作的是文件本身：打开文件、改单元格、保存文件，全程 Excel 程序没有参与。\n\n### 2.2 三个核心对象\n\n- 工作簿（Workbook）：一个 xlsx 文件就是一个工作簿，用 `openpyxl.Workbook()` 新建、用 `load_workbook(路径)` 打开。\n- 工作表（Worksheet）：工作簿里的一张表。`wb.active` 取当前活动表，`wb.create_sheet(表名)` 新建一张表，`wb[表名]` 按名字取表。\n- 单元格（Cell）：行列交叉处的一个格子。`ws[\"A1\"]` 按坐标取，`ws.cell(row=行, column=列)` 按行列号取，`.value` 是格子里的值。\n\n### 2.3 openpyxl 能做什么、不能做什么\n\n- 能：读写单元格的值、设置样式（字体、颜色、边框、对齐、数字格式）、写公式文本、合并单元格、冻结窗格、设置筛选、调整行高列宽。\n- 不能：计算公式结果。openpyxl 没有 Excel 的计算引擎，写入 `=SUM(A1:A5)` 后保存，文件里存的是公式文本，缓存的结果值是空的；用 Excel 打开后才会计算出结果。这是本篇最重要的边界，下面示例 4 会实测给你看。\n- 不能：运行宏、操作正在打开的 Excel 窗口、调用 Excel 的图表与数据透视表界面功能。需要驱动正在运行的 Excel 时用 xlwings（见 03 篇）。\n\n### 2.4 安装\n\n```bash\npip install openpyxl\n```\n\n装好后检查版本（本篇实测版本 3.1.2）：\n\n```python\nimport openpyxl\nprint(openpyxl.__version__)\n```\n\n运行结果：\n\n```\n3.1.2\n```", "steps": ["准备数据：把 12 行订单整理成 Python 列表，每行是（订单号、日期、客户编号、产品编号、数量、单价），产品编号用字典映射为产品名（待补图）。", "新建工作簿：`wb = Workbook()`，活动表改名为“明细”，先写标题行，再逐行写入订单（示例 1）。", "读取核对：`load_workbook` 重新打开刚生成的文件，用 `iter_rows(values_only=True)` 逐行读出，核对行数与合计（示例 2）。", "加样式：给标题行加深蓝填充与白色加粗字体，单价列设千分位格式 `#,##0`，全表加细边框，冻结标题行（示例 3）。", "写公式：金额列写 `=E3*F3` 这类公式，末尾加合计行写 `=SUM(...)`，保存后重新打开核对公式文本（示例 4）。", "批量生成：读明细表，按产品分组汇总，新建“按产品汇总”工作表，输出最终报表文件（示例 5）。"], "sections": [{"title": "2. 基础概念", "body": "### 2.1 openpyxl 是什么\n\nopenpyxl 是一个读写 xlsx 文件的 Python 库。它不启动 Excel、不需要装 Excel，在没有 Excel 的电脑（例如 Linux 服务器）上也能生成与读取 xlsx 文件。它操作的是文件本身：打开文件、改单元格、保存文件，全程 Excel 程序没有参与。\n\n### 2.2 三个核心对象\n\n- 工作簿（Workbook）：一个 xlsx 文件就是一个工作簿，用 `openpyxl.Workbook()` 新建、用 `load_workbook(路径)` 打开。\n- 工作表（Worksheet）：工作簿里的一张表。`wb.active` 取当前活动表，`wb.create_sheet(表名)` 新建一张表，`wb[表名]` 按名字取表。\n- 单元格（Cell）：行列交叉处的一个格子。`ws[\"A1\"]` 按坐标取，`ws.cell(row=行, column=列)` 按行列号取，`.value` 是格子里的值。\n\n### 2.3 openpyxl 能做什么、不能做什么\n\n- 能：读写单元格的值、设置样式（字体、颜色、边框、对齐、数字格式）、写公式文本、合并单元格、冻结窗格、设置筛选、调整行高列宽。\n- 不能：计算公式结果。openpyxl 没有 Excel 的计算引擎，写入 `=SUM(A1:A5)` 后保存，文件里存的是公式文本，缓存的结果值是空的；用 Excel 打开后才会计算出结果。这是本篇最重要的边界，下面示例 4 会实测给你看。\n- 不能：运行宏、操作正在打开的 Excel 窗口、调用 Excel 的图表与数据透视表界面功能。需要驱动正在运行的 Excel 时用 xlwings（见 03 篇）。\n\n### 2.4 安装\n\n```bash\npip install openpyxl\n```\n\n装好后检查版本（本篇实测版本 3.1.2）：\n\n```python\nimport openpyxl\nprint(openpyxl.__version__)\n```\n\n运行结果：\n\n```\n3.1.2\n```"}, {"title": "4. 图文示例", "body": "示例：最终报表文件的两张表（文字版）。\n\n明细表（前 4 行，金额列是公式，Excel 打开后显示计算结果）：\n\n| 订单号 | 日期 | 客户编号 | 产品 | 数量 | 单价 | 金额 |\n|---|---|---|---|---|---|---|\n| O001 | 2025-01-05 | C001 | 电脑 | 2 | 5000 | =E3*F3（显示 10000） |\n| O002 | 2025-01-12 | C002 | 手机 | 3 | 3000 | =E4*F4（显示 9000） |\n| O003 | 2025-02-08 | C001 | 耳机 | 10 | 300 | =E5*F5（显示 3000） |\n| O004 | 2025-03-15 | C003 | 键盘 | 5 | 200 | =E6*F6（显示 1000） |\n\n按产品汇总表：\n\n| 产品 | 订单数 | 数量 | 销售额 |\n|---|---|---|---|\n| 电脑 | 4 | 8 | 40000 |\n| 手机 | 2 | 5 | 15000 |\n| 耳机 | 2 | 30 | 9000 |\n| 键盘 | 2 | 13 | 2600 |\n| 显示器 | 2 | 6 | 9000 |\n| 合计 | 12 | 62 | 75600 |\n\n汇总数与明细逐行相加一致：数量 8+5+30+13+6 = 62，销售额 40000+15000+9000+2600+9000 = 75600（待补图）。"}], "source": "docs/python-excel/01-openpyxl.md", "updated": "2026-11-10", "objectives": ["安装 openpyxl 并用它新建、打开、保存 xlsx 工作簿", "用 openpyxl 读写单元格、整行、整列与指定区域", "给单元格设置字体、填充、边框、对齐与数字格式", "向工作表写入 Excel 公式，并说清 openpyxl 为什么算不出公式结果", "写一个批量生成报表的脚本：读一份订单明细，输出带样式与汇总表的报表文件"], "formulas": ["示例 1：新建工作簿，写入 12 行订单明细。", "from openpyxl import Workbook", "ORDERS = [", "(\"O001\", \"2025-01-05\", \"C001\", \"P001\", 2, 5000),", "(\"O002\", \"2025-01-12\", \"C002\", \"P002\", 3, 3000),", "(\"O003\", \"2025-02-08\", \"C001\", \"P003\", 10, 300),", "(\"O004\", \"2025-03-15\", \"C003\", \"P004\", 5, 200),", "(\"O005\", \"2025-03-20\", \"C002\", \"P005\", 2, 1500),", "(\"O006\", \"2025-06-10\", \"C004\", \"P001\", 1, 5000),", "(\"O007\", \"2026-01-06\", \"C001\", \"P001\", 3, 5000),", "(\"O008\", \"2026-01-15\", \"C002\", \"P002\", 2, 3000),", "(\"O009\", \"2026-02-10\", \"C003\", \"P003\", 20, 300),", "(\"O010\", \"2026-02-18\", \"C001\", \"P004\", 8, 200),", "(\"O011\", \"2026-03-05\", \"C004\", \"P005\", 4, 1500),", "(\"O012\", \"2026-03-22\", \"C002\", \"P001\", 2, 5000),", "]", "PRODUCTS = {\"P001\": \"电脑\", \"P002\": \"手机\", \"P003\": \"耳机\", \"P004\": \"键盘\", \"P005\": \"显示器\"}", "wb = Workbook()", "ws = wb.active", "ws.title = \"明细\"", "ws.append([\"订单号\", \"日期\", \"客户编号\", \"产品\", \"数量\", \"单价\"])", "for oid, date, cust, pid, qty, price in ORDERS:", "ws.append([oid, date, cust, PRODUCTS[pid], qty, price])", "wb.save(\"订单明细.xlsx\")", "print(\"已写入行数：\", ws.max_row)", "print(\"已写入列数：\", ws.max_column)", "运行结果（本机真实运行输出）：", "已写入行数： 13", "已写入列数： 6", "13 行 = 1 行标题 + 12 行订单。`ws.append` 一次追加一整行，是写多行数据最省事的写法。", "示例 2：读取工作簿，核对内容。", "from openpyxl import load_workbook", "wb = load_workbook(\"订单明细.xlsx\")", "ws = wb[\"明细\"]", "print(\"工作表：\", wb.sheetnames)", "print(\"行数：\", ws.max_row, \"列数：\", ws.max_column)", "for row in ws.iter_rows(min_row=1, max_row=4, values_only=True):", "print(row)", "total_qty = sum(r[4] for r in ws.iter_rows(min_row=2, values_only=True))", "total_amount = sum(r[4] * r[5] for r in ws.iter_rows(min_row=2, values_only=True))", "print(\"数量合计：\", total_qty)", "print(\"销售额合计：\", total_amount)", "运行结果（本机真实运行输出）：", "工作表： ['明细']", "行数： 13 列数： 6", "('订单号', '日期', '客户编号', '产品', '数量', '单价')", "('O001', '2025-01-05', 'C001', '电脑', 2, 5000)", "('O002', '2025-01-12', 'C002', '手机', 3, 3000)", "('O003', '2025-02-08', 'C001', '耳机', 10, 300)", "数量合计： 62", "销售额合计： 75600", "要点：`values_only=True` 只返回值不返回单元格对象，适合纯读数；`iter_rows` 可以限定行列范围，大文件不要一次全读进内存。", "示例 3：设置单元格样式并保存为报表文件。", "from openpyxl import load_workbook", "from openpyxl.styles import Alignment, Border, Font, PatternFill, Side", "wb = load_workbook(\"订单明细.xlsx\")", "ws = wb[\"明细\"]", "header_fill = PatternFill(\"solid\", fgColor=\"1F4E78\")", "header_font = Font(name=\"微软雅黑\", size=11, bold=True, color=\"FFFFFF\")", "thin = Side(style=\"thin\", color=\"B0B0B0\")", "border = Border(left=thin, right=thin, top=thin, bottom=thin)", "for col in range(1, 7):", "cell = ws.cell(row=1, column=col)", "cell.fill = header_fill", "cell.font = header_font", "cell.alignment = Alignment(horizontal=\"center\", vertical=\"center\")", "for row in ws.iter_rows(min_row=1, max_row=13, max_col=6):", "for cell in row:", "cell.border = border", "for row in range(2, 14):", "ws.cell(row=row, column=6).number_format = '#,##0'", "ws.column_dimensions[\"A\"].width = 10", "ws.column_dimensions[\"B\"].width = 13", "ws.column_dimensions[\"F\"].width = 10", "ws.freeze_panes = \"A2\"", "ws.auto_filter.ref = \"A1:F13\"", "wb.save(\"销售报表.xlsx\")", "print(\"标题字体加粗：\", ws[\"A1\"].font.bold)", "print(\"标题填充色：\", ws[\"A1\"].fill.fgColor.rgb)", "print(\"冻结窗格：\", ws.freeze_panes)", "运行结果（本机真实运行输出）：", "标题字体加粗： True", "标题填充色： 001F4E78", "冻结窗格： A2", "说明：填充色读出来是 `001F4E78`，前面多了两位透明度 `00`，是 openpyxl 的正常表示，不是写错了。`freeze_panes = \"A2\"` 表示冻结第 1 行；`auto_filter` 给标题行加上筛选箭头。", "示例 4：写入公式，并验证 openpyxl 不计算公式。", "from openpyxl import load_workbook", "wb = load_workbook(\"销售报表.xlsx\")", "ws = wb[\"明细\"]", "for row in range(2, 14):", "ws.cell(row=row, column=7, value=f\"=E{row}*F{row}\").number_format = '#,##0'", "ws.cell(row=14, column=1, value=\"合计\")", "ws.cell(row=14, column=5, value=\"=SUM(E2:E13)\")", "ws.cell(row=14, column=7, value=\"=SUM(G2:G13)\").number_format = '#,##0'", "wb.save(\"销售报表.xlsx\")", "# 重新打开核对：默认读到的是公式文本", "wb2 = load_workbook(\"销售报表.xlsx\")", "print(\"G3 公式：\", wb2[\"明细\"][\"G3\"].value)", "print(\"G14 公式：\", wb2[\"明细\"][\"G14\"].value)", "# 用 data_only=True 读缓存的结果值：openpyxl 没算过公式，缓存为空，读到 None", "wb3 = load_workbook(\"销售报表.xlsx\", data_only=True)", "print(\"G3 缓存值：\", wb3[\"明细\"][\"G3\"].value)", "print(\"G14 缓存值：\", wb3[\"明细\"][\"G14\"].value)", "# 预期值用 Python 独立算出：数量 62，销售额 75600", "print(\"Python 独立验算销售额：\", sum(r[4] * r[5] for r in wb2[\"明细\"].iter_rows(min_row=2, max_row=13, values_only=True)))", "运行结果（本机真实运行输出）：", "G3 公式： =E3*F3", "G14 公式： =SUM(G2:G13)", "G3 缓存值： None", "G14 缓存值： None", "Python 独立验算销售额： 75600", "这就是 openpyxl 的边界：它只负责把公式文本写进文件，计算要交给 Excel。用 Excel 打开这个文件，G 列会显示 10000、9000……，G14 显示 75600；但在 Python 里用 `data_only=True` 去读，公式格读到的是 `None`。所以凡是“写公式 + 在 Python 里读结果”的流程，必须改成 Python 自己算一遍（如最后一行），不要等 Excel 的缓存。", "示例 5：批量生成报表——按产品汇总，新增一张汇总表。", "from openpyxl import load_workbook", "from openpyxl.styles import Font, PatternFill", "wb = load_workbook(\"销售报表.xlsx\")", "ws = wb[\"明细\"]", "totals = {}", "for row in ws.iter_rows(min_row=2, max_row=13, values_only=True):", "_oid, _date, _cust, product, qty, price = row[:6]  # 取前 6 列；G 列是示例 4 写入的金额公式，不参与汇总", "t = totals.setdefault(product, [0, 0, 0])", "t[0] += 1", "t[1] += qty", "t[2] += qty * price", "ws2 = wb.create_sheet(\"按产品汇总\")", "ws2.append([\"产品\", \"订单数\", \"数量\", \"销售额\"])", "for col in range(1, 5):", "cell = ws2.cell(row=1, column=col)", "cell.fill = PatternFill(\"solid\", fgColor=\"1F4E78\")", "cell.font = Font(name=\"微软雅黑\", size=11, bold=True, color=\"FFFFFF\")", "for name in [\"电脑\", \"手机\", \"耳机\", \"键盘\", \"显示器\"]:", "n, qty, amount = totals[name]", "ws2.append([name, n, qty, amount])", "ws2.append([\"合计\", \"=SUM(B2:B6)\", \"=SUM(C2:C6)\", \"=SUM(D2:D6)\"])", "wb.save(\"销售报表.xlsx\")", "print(\"汇总表行数：\", ws2.max_row)", "for row in ws2.iter_rows(min_row=2, values_only=True):", "print(row)", "运行结果（本机真实运行输出）：", "汇总表行数： 7", "('电脑', 4, 8, 40000)", "('手机', 2, 5, 15000)", "('耳机', 2, 30, 9000)", "('键盘', 2, 13, 2600)", "('显示器', 2, 6, 9000)", "('合计', '=SUM(B2:B6)', '=SUM(C2:C6)', '=SUM(D2:D6)')", "汇总表 7 行 = 1 行标题 + 5 行产品 + 1 行合计；合计行同样写公式，Excel 打开后显示 12、62、75600。"], "scenarios": [{"title": "场景 1：每月 1 号自动生成上月销售报表。", "body": "- 背景：财务每月要一份销售报表，做法一直是手工复制订单、手工拉公式、手工调格式，半小时起步，还容易漏行。\n- 做法：把订单导出成 xlsx，用示例 1 的写法读入、示例 3 的样式模板套用、示例 4 的公式写入、示例 5 的汇总逻辑生成“明细 + 按产品汇总”两张表，脚本保存为 `Python-openpyxl-report.py`，每月改一次文件名就跑。\n- 结果：以本篇 12 行订单为例，脚本 1 秒内生成报表，数量合计 62、销售额合计 75600，与手工加总一致；下个月订单变多行时，公式里的行号由脚本按实际行数生成，不用手工改。\n\n场景 2：把 30 个分表合并成一份总表。\n\n- 背景：30 个门店每月各交一张 xlsx，表头相同、行数不同，要合成一张总表再汇总。\n- 做法：循环 `load_workbook` 打开每个分表，`iter_rows(values_only=True)` 跳过标题行逐行读出，`append` 到总表；最后按示例 5 的办法加一张汇总表。\n- 结果：30 个文件一次跑完；关键点是每个分表读完立刻关掉工作簿对象、不要同时打开 30 个工作簿，内存才不会爆。"}], "pitfalls": [{"problem": "`ModuleNotFoundError: No module named 'openpyxl'`", "cause": "没装 openpyxl，或装到了另一个 Python 环境", "solution": "在同一个环境执行 `pip install openpyxl`，再用 `python3 -c \"import openpyxl; print(openpyxl.__version__)\"` 核对"}, {"problem": "保存后用 Excel 打开提示“文件已损坏”", "cause": "保存时文件还在 Excel 里打开着，或保存路径写到了不存在的文件夹", "solution": "先关掉 Excel 里的同名文件；保存前确认文件夹存在，或用 `os.makedirs` 先建文件夹"}, {"problem": "`load_workbook` 打不开 xls 文件", "cause": "openpyxl 只支持 xlsx，不支持老格式 xls", "solution": "xls 先用 Excel 另存为 xlsx，或用 xlrd（仅读）处理；新文件一律存 xlsx"}, {"problem": "公式写进去了，Python 读出来是 None", "cause": "openpyxl 不计算公式，缓存结果值为空", "solution": "见示例 4：这是正常现象；要在 Python 里用结果就自己算一遍，不要读 `data_only=True` 的公式格"}, {"problem": "公式在 Excel 里显示为文本不计算", "cause": "公式字符串前面多了空格或单引号，如 `\" =SUM(...)\"` 或 `\"'=SUM(...)\"`", "solution": "公式字符串必须以 `=` 开头、前面没有任何字符；检查写入的值是不是以 `=` 开头"}, {"problem": "日期写进去变成 45658 这样的数字", "cause": "把 Python 的 datetime 写进单元格后没设日期格式，Excel 按数值显示", "solution": "设置 `cell.number_format = 'yyyy-mm-dd'`；或直接写 `\"2025-01-05\"` 这样的文本（会失去日期计算能力）"}, {"problem": "中文标题在 Excel 里显示乱码", "cause": "不是乱码问题：openpyxl 写的是 UTF-8，Excel 能正常显示；真正的原因常是字体缺失", "solution": "换一个系统自带的中文字体，如微软雅黑、宋体；不要把问题当成编码问题去转码"}, {"problem": "样式设置了但打开文件看不到", "cause": "把样式赋给了 `ws.cell()` 临时取出的单元格后又重新取了一次，或保存前又覆盖了工作簿", "solution": "样式直接赋给取出的 cell 对象并保存同一个 wb；大段样式用循环集中处理，不要反复打开保存"}, {"problem": "`ws.append` 追加到了错误的位置", "cause": "工作表里已有带格式的空行，`max_row` 把格式行也算进去了", "solution": "追加前先打印 `ws.max_row` 确认；或用 `ws.cell(row=指定行)` 精确定位写入"}, {"problem": "循环写几万行很慢", "cause": "每次 `ws.cell()` 都做一次查找与样式初始化", "solution": "用 `ws.append` 批量写；样式只在标题行与合计行设置，不要给每一格逐个建样式对象"}], "exercises": ["用 openpyxl 新建一个工作簿，写入本篇 12 行订单（订单号、日期、客户编号、产品、数量、单价），保存后重新打开，打印工作表名与总行数。", "读取示例 1 生成的订单明细，用 Python 算出“耳机”的订单数与销售额各是多少。", "给订单明细的标题行设置填充色 4472C4、白色加粗字体，并把单价列的数字格式设为 `#,##0`，保存后重新打开核对标题格的字体是否加粗。", "在金额列写入公式 `=E行*F行`，在末尾加合计行写入 `=SUM(G2:G13)`，保存后用默认方式重新打开，打印 G3 与 G14 的值；再用 `data_only=True` 打开，打印同样的两个格子，解释两次结果为什么不同。", "把 12 行订单按“客户编号”分组，算出每个客户的订单数与销售额（提示：C001、C002、C003、C004 各是多少），把结果写进一张新表“按客户汇总”。", "写一个脚本：批量读取当前文件夹下所有文件名以“订单”开头的 xlsx，把它们的明细行合并到一张总表里，并给总表加上标题样式与合计行公式。说出脚本里至少两处需要注意的点（例如跳过标题行、文件被 Excel 占用）。"], "answers": ["按示例 1 的写法跑一遍即可。重新打开后工作表名是 `['明细']`，总行数 13（1 行标题 + 12 行订单）。如果行数是 12，说明漏写了标题行；如果工作表名是 Sheet，说明忘了改 `ws.title`。", "耳机是 O003（10 件 × 300）和 O009（20 件 × 300）两笔，订单数 2，销售额 3000 + 6000 = 9000。写法：遍历明细行，产品等于“耳机”时累加数量×单价。", "做法与示例 3 相同，只是填充色改成 4472C4。核对：`load_workbook` 后 `ws[\"A1\"].font.bold` 应为 True，`ws[\"A1\"].fill.fgColor.rgb` 应为 `004472C4`（前面两位是透明度）。", "默认方式打开：G3 是 `=E3*F3`，G14 是 `=SUM(G2:G13)`，读到的是公式文本；`data_only=True` 打开：两个格子都是 None。原因：openpyxl 不计算公式，文件里没有缓存的结果值；公式结果要等 Excel 打开文件后才计算。不要把 None 当成公式算错了。", "按客户汇总：C001 是 O001、O003、O007、O010 共 4 笔，销售额 10000+3000+15000+1600 = 29600；C002 是 O002、O005、O008、O012 共 4 笔，销售额 9000+3000+6000+10000 = 28000；C003 是 O004、O009 共 2 笔，销售额 1000+6000 = 7000；C004 是 O006、O011 共 2 笔，销售额 5000+6000 = 11000。四数相加 29600+28000+7000+11000 = 75600，与总销售额一致。", "参考做法：`glob.glob(\"订单*.xlsx\")` 列文件；每个文件 `load_workbook` 后 `iter_rows(min_row=2, values_only=True)` 跳过标题行读明细；`append` 到总表。注意点至少两条：每张分表都要跳过标题行，否则总表里会混进多行标题；分表若正在 Excel 里打开，脚本不要去覆盖保存它，应另存新文件；行数大时不要同时打开全部工作簿，读完一个再读下一个。"], "versions": "Python 3.10 及以上，openpyxl 3.1.2；生成的 xlsx 文件可用 Excel 2016／2019／2021／365 打开", "file": "Python-openpyxl-report.py"}, {"id": "python-excel-02-pandas", "group": "python-excel", "column": "C15", "level2": "C15-L2-2", "title": "pandas：DataFrame 与 Excel 互转、数据清洗与分组汇总", "level": "进阶", "body": "### 2.1 DataFrame 是什么\n\nDataFrame 是 pandas 里的一张“内存中的表”：有行、有列、有表头，跟 Excel 工作表几乎一一对应。区别在于 DataFrame 活在 Python 内存里，可以整列运算、整表筛选、分组汇总，一行代码顶 Excel 里几十步操作。`read_excel` 把工作表变成 DataFrame，`to_excel` 把 DataFrame 变成工作表，互转就是本篇的起点。\n\n### 2.2 DataFrame 与 Excel 工作表的对应关系\n\n| DataFrame | Excel 工作表 |\n|---|---|\n| 一列（Series） | 一列数据 |\n| 列名（columns） | 标题行 |\n| 索引（index） | 行号（但 pandas 索引可以是日期、订单号等任意值） |\n| 一行 | 一行记录 |\n| `df.shape`（行数，列数） | 表的规模 |\n\n注意：`to_excel` 默认会把索引也写进文件，多出一列无名列；写文件时通常加 `index=False` 不写索引。\n\n### 2.3 数据分析流程\n\n本篇的流程固定为五步：读入、清洗、转换、汇总、写出。读入解决“数据进来”，清洗解决“数据能用”，转换解决“算出新列”（金额、利润、月份），汇总解决“看出结论”，写出解决“结果给人看”。后面任何分析任务都可以往这个流程里套。\n\n### 2.4 安装\n\n```bash\npip install pandas openpyxl\n```\n\npandas 读写 xlsx 要靠 openpyxl 做引擎，两个都要装。装好后检查版本（本篇实测版本 pandas 2.1.4、openpyxl 3.1.2）：\n\n```python\nimport pandas as pd\nprint(pd.__version__)\n```\n\n运行结果：\n\n```\n2.1.4\n```", "steps": ["准备数据：12 行干净订单加 3 行脏数据（重复行、缺失单价、无法识别的单价文本），写成原始文件（示例 1）。", "读入：`pd.read_excel` 读回原始文件，检查行列数与数据类型；演示文本型数字的转换（示例 2）。", "清洗：文本单价转数值、去重、删缺失、解析日期、算出金额列，清洗后核对行数与合计（示例 3）。", "分组汇总：`groupby` 按产品、按地区、按月汇总，与手工计算逐项核对（示例 4）。", "完整分析：关联产品表算利润、关联客户表取地区，汇总后用 `ExcelWriter` 一次写出 5 张表，重新读回核对（示例 5）。"], "sections": [{"title": "2. 基础概念", "body": "### 2.1 DataFrame 是什么\n\nDataFrame 是 pandas 里的一张“内存中的表”：有行、有列、有表头，跟 Excel 工作表几乎一一对应。区别在于 DataFrame 活在 Python 内存里，可以整列运算、整表筛选、分组汇总，一行代码顶 Excel 里几十步操作。`read_excel` 把工作表变成 DataFrame，`to_excel` 把 DataFrame 变成工作表，互转就是本篇的起点。\n\n### 2.2 DataFrame 与 Excel 工作表的对应关系\n\n| DataFrame | Excel 工作表 |\n|---|---|\n| 一列（Series） | 一列数据 |\n| 列名（columns） | 标题行 |\n| 索引（index） | 行号（但 pandas 索引可以是日期、订单号等任意值） |\n| 一行 | 一行记录 |\n| `df.shape`（行数，列数） | 表的规模 |\n\n注意：`to_excel` 默认会把索引也写进文件，多出一列无名列；写文件时通常加 `index=False` 不写索引。\n\n### 2.3 数据分析流程\n\n本篇的流程固定为五步：读入、清洗、转换、汇总、写出。读入解决“数据进来”，清洗解决“数据能用”，转换解决“算出新列”（金额、利润、月份），汇总解决“看出结论”，写出解决“结果给人看”。后面任何分析任务都可以往这个流程里套。\n\n### 2.4 安装\n\n```bash\npip install pandas openpyxl\n```\n\npandas 读写 xlsx 要靠 openpyxl 做引擎，两个都要装。装好后检查版本（本篇实测版本 pandas 2.1.4、openpyxl 3.1.2）：\n\n```python\nimport pandas as pd\nprint(pd.__version__)\n```\n\n运行结果：\n\n```\n2.1.4\n```"}, {"title": "4. 图文示例", "body": "示例：清洗前后对照（文字版）。\n\n清洗前 15 行：12 行干净订单 + 3 行脏数据。\n\n| 订单号 | 日期 | 客户编号 | 产品编号 | 数量 | 单价 | 问题 |\n|---|---|---|---|---|---|---|\n| O003 | 2025-02-08 | C001 | P003 | 10 | 300 | 与 O003 完全重复 |\n| O013 | 2026-03-25 | C002 | P001 | 1 | （空） | 单价缺失 |\n| O014 | 2026-03-28 | C003 | P005 | 1 | 待确认 | 单价是无法转数值的文本 |\n\n清洗后 12 行：重复行去掉 1 行，缺失与无法识别的行各去掉 1 行，剩下 12 行干净订单，销售额合计 75600。\n\n按产品汇总（清洗后）：\n\n| 产品 | 订单数 | 数量 | 销售额 | 利润 |\n|---|---|---|---|---|\n| 电脑 | 4 | 8 | 40000 | 9600 |\n| 手机 | 2 | 5 | 15000 | 4500 |\n| 耳机 | 2 | 30 | 9000 | 4500 |\n| 键盘 | 2 | 13 | 2600 | 1170 |\n| 显示器 | 2 | 6 | 9000 | 3000 |\n\n利润算法：数量 ×（单价 - 成本），成本来自产品表（电脑 3800、手机 2100、耳机 150、键盘 110、显示器 1000）；总利润 9600+4500+4500+1170+3000 = 22770，利润率 22770 / 75600 = 30.12%（待补图）。"}], "source": "docs/python-excel/02-pandas.md", "updated": "2026-11-10", "objectives": ["用 `read_excel` 读入 xlsx，用 `to_excel` 把 DataFrame 写回 xlsx（一张表或多张表）", "说出 DataFrame 与 Excel 工作表之间的对应关系（行、列、索引、表头）", "对一份脏数据做清洗：去重、处理缺失值、转换文本型数字、解析日期", "用 `groupby` 做按产品、按地区、按月的分组汇总，并用手工计算核对结果", "跑通一个完整的数据分析流程：读入、清洗、关联维度表、算利润、汇总、写出报告"], "formulas": ["示例 1：准备原始数据，写入 xlsx。", "import pandas as pd", "ORDERS = [", "(\"O001\", \"2025-01-05\", \"C001\", \"P001\", 2, 5000),", "(\"O002\", \"2025-01-12\", \"C002\", \"P002\", 3, 3000),", "(\"O003\", \"2025-02-08\", \"C001\", \"P003\", 10, 300),", "(\"O004\", \"2025-03-15\", \"C003\", \"P004\", 5, 200),", "(\"O005\", \"2025-03-20\", \"C002\", \"P005\", 2, 1500),", "(\"O006\", \"2025-06-10\", \"C004\", \"P001\", 1, 5000),", "(\"O007\", \"2026-01-06\", \"C001\", \"P001\", 3, 5000),", "(\"O008\", \"2026-01-15\", \"C002\", \"P002\", 2, 3000),", "(\"O009\", \"2026-02-10\", \"C003\", \"P003\", 20, 300),", "(\"O010\", \"2026-02-18\", \"C001\", \"P004\", 8, 200),", "(\"O011\", \"2026-03-05\", \"C004\", \"P005\", 4, 1500),", "(\"O012\", \"2026-03-22\", \"C002\", \"P001\", 2, 5000),", "]", "DIRTY_EXTRA = [", "(\"O003\", \"2025-02-08\", \"C001\", \"P003\", 10, 300),", "(\"O013\", \"2026-03-25\", \"C002\", \"P001\", 1, None),", "(\"O014\", \"2026-03-28\", \"C003\", \"P005\", 1, \"待确认\"),", "]", "raw = pd.DataFrame(", "ORDERS + DIRTY_EXTRA,", "columns=[\"订单号\", \"日期\", \"客户编号\", \"产品编号\", \"数量\", \"单价\"],", ")", "raw.to_excel(\"原始订单.xlsx\", index=False)", "print(\"原始行数：\", len(raw))", "print(raw.dtypes)", "运行结果（本机真实运行输出）：", "原始行数： 15", "订单号     object", "日期      object", "客户编号    object", "产品编号    object", "数量       int64", "单价      object", "dtype: object", "要点：单价列是 `object` 类型，因为里面混进了空值与文本“待确认”——这正是脏数据的典型信号。`to_excel` 写文件时加 `index=False`，否则文件里会多出一列行号。", "示例 2：读回文件，并演示文本型数字的转换。", "import pandas as pd", "df = pd.read_excel(\"原始订单.xlsx\")", "print(\"读回行数：\", len(df))", "print(df.head(3).to_string(index=False))", "# 文本型数字转换演示：\"1500\" 这样的文本能转成数值，\"待确认\" 转不成，会变成 NaN", "s = pd.to_numeric(pd.Series([\"1500\", \"300\", \"待确认\"]), errors=\"coerce\")", "print(s.tolist())", "运行结果（本机真实运行输出）：", "读回行数： 15", "订单号         日期 客户编号 产品编号  数量   单价", "O001 2025-01-05 C001 P001   2 5000", "O002 2025-01-12 C002 P002   3 3000", "O003 2025-02-08 C001 P003  10  300", "[1500.0, 300.0, nan]", "读回行数 15，说明脏数据原样都在文件里；`pd.to_numeric(..., errors=\"coerce\")` 的规则是：能转的转成数值，转不了的变成 NaN（缺失值），而不是报错——清洗时就靠这个把“待确认”筛出来。上面最后一行 `[1500.0, 300.0, nan]` 就是转换结果，其中的 `nan` 表示“待确认”无法转成数值。", "示例 3：数据清洗——去重、删缺失、解析日期、算金额。", "import pandas as pd", "df = pd.read_excel(\"原始订单.xlsx\")", "df[\"单价\"] = pd.to_numeric(df[\"单价\"], errors=\"coerce\")", "df = df.drop_duplicates()", "df = df.dropna(subset=[\"单价\"])", "df[\"日期\"] = pd.to_datetime(df[\"日期\"])", "df[\"金额\"] = df[\"数量\"] * df[\"单价\"]", "print(\"清洗后行数：\", len(df))", "print(\"销售额合计：\", int(df[\"金额\"].sum()))", "print(\"数量合计：\", int(df[\"数量\"].sum()))", "df.to_excel(\"清洗后明细.xlsx\", index=False)", "运行结果（本机真实运行输出）：", "清洗后行数： 12", "销售额合计： 75600", "数量合计： 62", "清洗掉了 3 行：重复的 O003 去掉 1 行，单价缺失的 O013 去掉 1 行，单价“待确认”的 O014 去掉 1 行。清洗后 12 行、销售额 75600，与手工计算一致，说明清洗没有误删干净行。顺序要注意：先转数值再去重、删缺失——如果先删缺失，文本“待确认”那行当时还不是缺失，会漏网。", "示例 4：分组汇总——按产品、按地区、按月。", "import pandas as pd", "PRODUCTS = {\"P001\": \"电脑\", \"P002\": \"手机\", \"P003\": \"耳机\", \"P004\": \"键盘\", \"P005\": \"显示器\"}", "CUSTOMERS = {\"C001\": \"华东\", \"C002\": \"华南\", \"C003\": \"华北\", \"C004\": \"华西\"}", "df = pd.read_excel(\"清洗后明细.xlsx\")", "df[\"产品\"] = df[\"产品编号\"].map(PRODUCTS)", "df[\"地区\"] = df[\"客户编号\"].map(CUSTOMERS)", "df[\"月份\"] = pd.to_datetime(df[\"日期\"]).dt.strftime(\"%Y-%m\")", "by_product = df.groupby(\"产品\").agg(订单数=(\"订单号\", \"count\"), 数量=(\"数量\", \"sum\"), 销售额=(\"金额\", \"sum\"))", "print(by_product.to_string())", "by_region = df.groupby(\"地区\").agg(订单数=(\"订单号\", \"count\"), 销售额=(\"金额\", \"sum\"))", "print(by_region.to_string())", "by_month = df.groupby(\"月份\").agg(订单数=(\"订单号\", \"count\"), 销售额=(\"金额\", \"sum\"))", "print(by_month.to_string())", "运行结果（本机真实运行输出）：", "订单数  数量    销售额", "产品", "手机     2   5  15000", "显示器    2   6   9000", "电脑     4   8  40000", "耳机     2  30   9000", "键盘     2  13   2600", "订单数    销售额", "地区", "华东    4  29600", "华北    2   7000", "华南    4  28000", "华西    2  11000", "订单数    销售额", "月份", "2025-01    2  19000", "2025-02    1   3000", "2025-03    2   4000", "2025-06    1   5000", "2026-01    2  21000", "2026-02    2   7600", "2026-03    2  16000", "核对：按产品销售额 40000+15000+9000+2600+9000 = 75600；按地区 29600+28000+11000+7000 = 75600；按月 19000+3000+4000+5000+21000+7600+16000 = 75600。三张汇总表总额相同，互相印证。注意 `groupby` 的结果默认按分组键排序（按 Unicode 编码排，不是按销售额排）；要按销售额排需加 `.sort_values(\"销售额\", ascending=False)`。", "示例 5：完整分析流程——关联维度表算利润，一次写出 5 张表。", "import pandas as pd", "PRODUCTS = pd.DataFrame([", "{\"产品编号\": \"P001\", \"产品\": \"电脑\", \"成本\": 3800},", "{\"产品编号\": \"P002\", \"产品\": \"手机\", \"成本\": 2100},", "{\"产品编号\": \"P003\", \"产品\": \"耳机\", \"成本\": 150},", "{\"产品编号\": \"P004\", \"产品\": \"键盘\", \"成本\": 110},", "{\"产品编号\": \"P005\", \"产品\": \"显示器\", \"成本\": 1000},", "])", "CUSTOMERS = pd.DataFrame([", "{\"客户编号\": \"C001\", \"地区\": \"华东\"},", "{\"客户编号\": \"C002\", \"地区\": \"华南\"},", "{\"客户编号\": \"C003\", \"地区\": \"华北\"},", "{\"客户编号\": \"C004\", \"地区\": \"华西\"},", "])", "df = pd.read_excel(\"清洗后明细.xlsx\")", "df = df.merge(PRODUCTS, on=\"产品编号\").merge(CUSTOMERS, on=\"客户编号\")", "df[\"利润\"] = df[\"数量\"] * (df[\"单价\"] - df[\"成本\"])", "df[\"月份\"] = pd.to_datetime(df[\"日期\"]).dt.strftime(\"%Y-%m\")", "print(\"总利润：\", int(df[\"利润\"].sum()))", "print(\"利润率：\", round(df[\"利润\"].sum() / df[\"金额\"].sum() * 100, 2), \"%\")", "by_product = df.groupby(\"产品\").agg(订单数=(\"订单号\", \"count\"), 数量=(\"数量\", \"sum\"),", "销售额=(\"金额\", \"sum\"), 利润=(\"利润\", \"sum\")).reset_index()", "by_region = df.groupby(\"地区\").agg(订单数=(\"订单号\", \"count\"), 数量=(\"数量\", \"sum\"),", "销售额=(\"金额\", \"sum\")).reset_index()", "by_month = df.groupby(\"月份\").agg(订单数=(\"订单号\", \"count\"), 销售额=(\"金额\", \"sum\")).reset_index()", "with pd.ExcelWriter(\"销售分析.xlsx\", engine=\"openpyxl\") as writer:", "pd.read_excel(\"原始订单.xlsx\").to_excel(writer, sheet_name=\"原始数据\", index=False)", "df.to_excel(writer, sheet_name=\"清洗后明细\", index=False)", "by_product.to_excel(writer, sheet_name=\"按产品汇总\", index=False)", "by_region.to_excel(writer, sheet_name=\"按地区汇总\", index=False)", "by_month.to_excel(writer, sheet_name=\"按月汇总\", index=False)", "check = pd.read_excel(\"销售分析.xlsx\", sheet_name=\"按产品汇总\")", "print(\"读回核对电脑销售额：\", int(check.loc[check[\"产品\"] == \"电脑\", \"销售额\"].iloc[0]))", "print(\"读回核对总利润：\", int(check[\"利润\"].sum()))", "运行结果（本机真实运行输出）：", "总利润： 22770", "利润率： 30.12 %", "读回核对电脑销售额： 40000", "读回核对总利润： 22770", "前两行是分析结果（总利润 22770，利润率 30.12%）；后两行是写出后重新读回的核对结果——电脑销售额 40000，总利润 22770，与写出前一致，说明 `to_excel` 与 `read_excel` 往返没有丢数。利润手工验算：电脑 8×(5000-3800)=9600，手机 5×900=4500，耳机 30×150=4500，键盘 13×90=1170，显示器 6×500=3000，合计 22770。"], "scenarios": [{"title": "场景 1：每周销售周报，一键生成。", "body": "- 背景：每周一要交一份销售周报：本周销售额、按产品和按地区的汇总、异常订单清单。手工做要打开订单表、筛选、复制、粘贴、再拉透视表，至少半小时。\n- 做法：把本周订单导出成 xlsx，跑示例 3 到示例 5 的流程：读入、清洗、分组、写出 5 张表的报告文件；异常订单（单价缺失、重复行）在清洗步骤里自动被筛掉，清洗前后的行数差就是异常行数，直接写进周报。\n- 结果：以本篇数据为例，15 行原始数据清洗成 12 行，异常 3 行；报告文件一次生成，按产品、按地区、按月三张汇总表总额都是 75600，互相印证，下周数据换了直接重跑。\n\n场景 2：两个月的订单表对账。\n\n- 背景：财务给的订单表与仓库给的出库表，订单号有重叠也有各自独有的，要找出差异。\n- 做法：两张表分别 `read_excel` 读成 DataFrame，用 `merge(..., how=\"outer\", indicator=True)` 外连接，`_merge` 列等于 `left_only` 的是只有财务有、等于 `right_only` 的是只有仓库有、等于 `both` 的是对得上的。\n- 结果：差异清单一次算出，不用再用 VLOOKUP 逐行比对；这个做法在数据量上万行时优势最大，Excel 公式逐行比对会明显变慢。"}], "pitfalls": [{"problem": "`ImportError: Missing optional dependency 'openpyxl'`", "cause": "只装了 pandas，没装 openpyxl", "solution": "执行 `pip install openpyxl`；pandas 读写 xlsx 必须有 openpyxl 做引擎"}, {"problem": "`read_excel` 读到的数字变成 5000.0", "cause": "列里混进了空值或文本，pandas 把整列推断成浮点型", "solution": "用 `pd.to_numeric` 转回数值，或读时指定 `dtype={\"单价\": \"Int64\"}`（可空整数类型）"}, {"problem": "写出的 xlsx 多出一列无名的行号列", "cause": "`to_excel` 默认把索引也写进文件", "solution": "写文件时加 `index=False`；读回时若已有该列，用 `index_col=0` 读或直接删掉"}, {"problem": "`groupby` 后想继续用分组列，报 KeyError", "cause": "`groupby` 的结果把分组列变成了索引，不再是普通列", "solution": "分组后加 `.reset_index()` 把分组列变回普通列（示例 5 就是这样写的）"}, {"problem": "日期列读进来是文本，做不了按月分组", "cause": "日期在 Excel 里存的是文本，或格式不统一", "solution": "用 `pd.to_datetime(df[\"日期\"])` 统一解析，再用 `.dt.strftime(\"%Y-%m\")` 取月份"}, {"problem": "`dropna` 后行数没变，缺失还在", "cause": "缺失值不是真正的空值，而是空格、\"N/A\"、\"待确认\"这类文本", "solution": "先用 `pd.to_numeric(..., errors=\"coerce\")` 或 `replace` 把这类文本转成真正的缺失值，再 `dropna`"}, {"problem": "合并后行数暴涨（12 行变 60 行）", "cause": "关联键在维度表里不唯一，例如产品表里同一产品编号出现两次", "solution": "合并前检查维度表的关联键是否唯一：`df[\"产品编号\"].duplicated().sum()` 应为 0；不唯一先去重"}, {"problem": "`merge` 后某一列全是 NaN", "cause": "两边的关联键类型不一致（一边是文本 \"P001\"，另一边是数值）或多了空格", "solution": "合并前统一类型：`astype(str).str.strip()`；用 `df[\"产品编号\"].dtype` 检查两边类型是否相同"}, {"problem": "中文列名在 `groupby` 里写错一个字就报 KeyError", "cause": "列名里有看不见的空格，或全角半角括号混用", "solution": "打印 `df.columns.tolist()` 核对列名原样；读入后先 `df.columns = df.columns.str.strip()` 去掉首尾空格"}, {"problem": "`ExcelWriter` 写多张表后文件打不开", "cause": "在 `with` 块外又写了一次，或两次 `to_excel` 用了同一个 writer 但没关", "solution": "多张表必须在同一个 `with pd.ExcelWriter(...) as writer:` 块里写完，退出块时自动保存关闭，不要中途手动 `save`"}], "exercises": ["用 `read_excel` 读入示例 1 生成的原始订单，打印行数与列数，并说出单价列的数据类型为什么是 object。", "对原始订单做清洗：文本单价转数值、去重、删缺失、解析日期、算出金额列；清洗后应为 12 行，销售额合计 75600。写出清洗代码并报出你得到的行数与合计。", "用 `groupby` 按“地区”汇总订单数与销售额，并手工验算华东地区的销售额是不是 29600（提示：华东是 C001 的 4 笔订单）。", "用 `groupby` 按“月份”汇总销售额，找出销售额最高的月份是哪个月、金额是多少。", "把产品表（产品编号、产品、成本）与清洗后明细合并，算出每笔订单的利润，再按产品汇总利润；利润最高的产品的利润额是多少？", "用 `ExcelWriter` 把“清洗后明细”“按产品汇总”“按地区汇总”写进同一个 xlsx 的 3 张表，写完后用 `read_excel` 重新读回“按产品汇总”，核对电脑的销售额是不是 40000。"], "answers": ["行数 15，列数 6；单价列是 object，因为里面混进了空值（O013）与文本“待确认”（O014），pandas 无法把整列推断成数值类型，只能当作通用对象类型。", "清洗代码见示例 3。清洗后 12 行，销售额合计 75600，数量合计 62。如果得到 13 行，说明“待确认”那行没被筛掉：检查是不是忘了 `pd.to_numeric(..., errors=\"coerce\")`，或 `dropna` 写在了转数值之前。", "华东 4 笔、29600；华南 4 笔、28000；华西 2 笔、11000；华北 2 笔、7000。手工验算华东：O001 10000 + O003 3000 + O007 15000 + O010 1600 = 29600。四地区相加 75600，与总额一致。", "按月汇总：2025-01 是 19000，2025-02 是 3000，2025-03 是 4000，2025-06 是 5000，2026-01 是 21000，2026-02 是 7600，2026-03 是 16000。最高是 2026-01，21000（O007 15000 + O008 6000）。", "每笔利润 = 数量 ×（单价 - 成本）。按产品汇总利润：电脑 9600，手机 4500，耳机 4500，键盘 1170，显示器 3000。最高是电脑，9600。总利润 22770，利润率 22770 / 75600 = 30.12%。", "写法见示例 5（把 5 张表改成 3 张表即可）。读回核对：电脑销售额 40000；如果读回是 40000.0，属正常现象——pandas 读回数值列默认是浮点型，用 `int(...)` 转回整数再比较。"], "versions": "Python 3.10 及以上，pandas 2.1.4，openpyxl 3.1.2（pandas 读写 xlsx 依赖 openpyxl）；生成的 xlsx 文件可用 Excel 2016／2019／2021／365 打开", "file": "Python-pandas-analysis.py"}, {"id": "python-excel-03-xlwings", "group": "python-excel", "column": "C15", "level2": "C15-L2-3", "title": "xlwings：调用正在运行的 Excel，批量处理工作簿", "level": "进阶", "body": "### 2.1 xlwings 是什么\n\nxlwings 是一个让 Python 驱动 Excel 的库：Python 脚本通过 xlwings 向正在运行的 Excel 发命令——打开文件、选中区域、写入数值、调用宏、触发重算，再把结果读回来。Excel 是执行者，Python 是指挥者。\n\n### 2.2 xlwings 与 openpyxl 的根本区别\n\n| 对比项 | openpyxl（01 篇） | xlwings（本篇） |\n|---|---|---|\n| 需不需要装 Excel | 不需要，在 Linux 服务器上也能跑 | 需要，目标机器上必须装有 Excel |\n| 支持的操作系统 | Windows、macOS、Linux 都行 | 交互模式仅 Windows 与 macOS（Linux 上只能用 xlwings Server 或 Reader） |\n| 工作方式 | 直接读写 xlsx 文件 | 驱动正在运行的 Excel 程序 |\n| 公式 | 只写公式文本，不计算 | 可触发 Excel 重算，读到计算结果 |\n| 宏与加载项 | 不能运行 | 可以调用 VBA 宏 |\n| 速度 | 快，纯文件操作 | 慢，每步都要经过 Excel |\n| 适用场景 | 服务器上批量生成报表 | 办公室里批量操作已打开的工作簿、调用宏、做 Excel 界面做不到的自动化 |\n\n一句话：文件不在 Excel 里打开、也不需要 Excel 算公式时用 openpyxl；反之，任务必须经过 Excel 本身时用 xlwings。\n\n### 2.3 四个核心对象\n\n- 应用（App）：`xw.App(visible=False)` 启动一个 Excel 进程；`visible=False` 表示后台运行不显示窗口。\n- 工作簿（Book）：`app.books.open(路径)` 打开一个文件；`app.books.add()` 新建一个。\n- 工作表（Sheet）：`book.sheets[表名]` 或 `book.sheets[0]` 取表；`book.sheets.add(表名)` 新建表。\n- 区域（Range）：`sheet[\"A1\"]` 取一个格子，`sheet[\"A1:C5\"]` 取一个区域，`.value` 读写值；`sheet[\"A2\"].expand(\"table\")` 从 A2 起扩展到整张连续数据表。\n\n### 2.4 安装\n\n```bash\npip install xlwings\n```\n\n注意：在 Debian／Ubuntu 系的 Python 上直接 `pip install xlwings` 可能报外部环境管理错误（PEP 668），本机实测就是如此；解决办法是用虚拟环境，或加 `--break-system-packages` 参数。装好后检查版本（本机实测版本 0.37.8）：\n\n```python\nimport xlwings as xw\nprint(xw.__version__)\n```\n\n运行结果：\n\n```\n0.37.8\n```", "steps": ["检查环境：确认 xlwings 能 import，确认本机有没有可驱动的 Excel（示例 1；本机没有，往下走准备步骤）。", "准备分表样本：用 openpyxl 生成 3 张分公司分表（华东、华南、华西），作为批量合并的输入（示例 2；纯 Python，可在本机运行）。", "打开工作簿：`xw.App(visible=False)` 启动 Excel，`app.books.open(路径)` 打开分表文件（示例 3；未在 Excel 内执行验证）。", "批量合并：循环 3 张分表逐行读出，写入“汇总”表，金额列写公式，末尾加合计行（示例 4；未在 Excel 内执行验证）。", "Python 侧验算：不用 Excel，用 openpyxl 读分表样本，在 Python 里算出合并后的预期结果（6 行、数量 15、金额 51000），供在 Windows 或 macOS 上运行后对照（示例 5；可运行）。"], "sections": [{"title": "2. 基础概念", "body": "### 2.1 xlwings 是什么\n\nxlwings 是一个让 Python 驱动 Excel 的库：Python 脚本通过 xlwings 向正在运行的 Excel 发命令——打开文件、选中区域、写入数值、调用宏、触发重算，再把结果读回来。Excel 是执行者，Python 是指挥者。\n\n### 2.2 xlwings 与 openpyxl 的根本区别\n\n| 对比项 | openpyxl（01 篇） | xlwings（本篇） |\n|---|---|---|\n| 需不需要装 Excel | 不需要，在 Linux 服务器上也能跑 | 需要，目标机器上必须装有 Excel |\n| 支持的操作系统 | Windows、macOS、Linux 都行 | 交互模式仅 Windows 与 macOS（Linux 上只能用 xlwings Server 或 Reader） |\n| 工作方式 | 直接读写 xlsx 文件 | 驱动正在运行的 Excel 程序 |\n| 公式 | 只写公式文本，不计算 | 可触发 Excel 重算，读到计算结果 |\n| 宏与加载项 | 不能运行 | 可以调用 VBA 宏 |\n| 速度 | 快，纯文件操作 | 慢，每步都要经过 Excel |\n| 适用场景 | 服务器上批量生成报表 | 办公室里批量操作已打开的工作簿、调用宏、做 Excel 界面做不到的自动化 |\n\n一句话：文件不在 Excel 里打开、也不需要 Excel 算公式时用 openpyxl；反之，任务必须经过 Excel 本身时用 xlwings。\n\n### 2.3 四个核心对象\n\n- 应用（App）：`xw.App(visible=False)` 启动一个 Excel 进程；`visible=False` 表示后台运行不显示窗口。\n- 工作簿（Book）：`app.books.open(路径)` 打开一个文件；`app.books.add()` 新建一个。\n- 工作表（Sheet）：`book.sheets[表名]` 或 `book.sheets[0]` 取表；`book.sheets.add(表名)` 新建表。\n- 区域（Range）：`sheet[\"A1\"]` 取一个格子，`sheet[\"A1:C5\"]` 取一个区域，`.value` 读写值；`sheet[\"A2\"].expand(\"table\")` 从 A2 起扩展到整张连续数据表。\n\n### 2.4 安装\n\n```bash\npip install xlwings\n```\n\n注意：在 Debian／Ubuntu 系的 Python 上直接 `pip install xlwings` 可能报外部环境管理错误（PEP 668），本机实测就是如此；解决办法是用虚拟环境，或加 `--break-system-packages` 参数。装好后检查版本（本机实测版本 0.37.8）：\n\n```python\nimport xlwings as xw\nprint(xw.__version__)\n```\n\n运行结果：\n\n```\n0.37.8\n```"}, {"title": "4. 图文示例", "body": "示例：3 张分表合并成 1 张汇总表（文字版）。\n\n分表（每个分公司一张表，结构相同）：\n\n| 订单号 | 产品 | 数量 | 单价 |\n|---|---|---|---|\n| O001 | 电脑 | 2 | 5000 |\n| O007 | 电脑 | 3 | 5000 |\n\n华东 2 行、华南 2 行（O002 手机 3 件、O008 手机 2 件）、华西 2 行（O006 电脑 1 件、O011 显示器 4 件），共 6 行。\n\n合并后的汇总表：\n\n| 分公司 | 订单号 | 产品 | 数量 | 单价 | 金额 |\n|---|---|---|---|---|---|\n| 华东 | O001 | 电脑 | 2 | 5000 | 10000 |\n| 华东 | O007 | 电脑 | 3 | 5000 | 15000 |\n| 华南 | O002 | 手机 | 3 | 3000 | 9000 |\n| 华南 | O008 | 手机 | 2 | 3000 | 6000 |\n| 华西 | O006 | 电脑 | 1 | 5000 | 5000 |\n| 华西 | O011 | 显示器 | 4 | 1500 | 6000 |\n| 合计 | | | 15 | | 51000 |\n\n数量合计 2+3+3+2+1+4 = 15，金额合计 10000+15000+9000+6000+5000+6000 = 51000（待补图）。"}], "source": "docs/python-excel/03-xlwings.md", "updated": "2026-11-10", "objectives": ["说出 xlwings 与 openpyxl 的根本区别：前者驱动正在运行的 Excel，后者直接读写文件", "安装 xlwings 并检查版本，说清本机为什么跑不了 Excel 驱动代码", "用 xlwings 打开工作簿、读写单元格区域、调用 Excel 的公式重算与保存", "写一个批量处理脚本：把多个分表合并成一张汇总表", "判断一个任务该用 xlwings 还是 openpyxl（或 pandas），并说出理由"], "formulas": ["示例 1：import 检查与环境检查（可运行）。", "import xlwings as xw", "print(\"xlwings 版本：\", xw.__version__)", "try:", "print(\"正在运行的 Excel：\", xw.apps.keys())", "except Exception as exc:", "print(\"检查 Excel 失败：\", type(exc).__name__, str(exc))", "try:", "app = xw.App(visible=False)", "print(\"Excel 已启动\")", "app.quit()", "except Exception as exc:", "print(\"启动 Excel 失败：\", type(exc).__name__, str(exc)[:120])", "运行结果（本机真实运行输出，Linux，无 Excel）：", "xlwings 版本： 0.37.8", "检查 Excel 失败： XlwingsError The interactive mode of xlwings is only supported on Windows and macOS. On Linux, you can use xlwings Server or xlwings Reader.", "启动 Excel 失败： AttributeError 'NoneType' object has no attribute 'apps'", "结论：xlwings 本身装好了（0.37.8），但本机没有 Excel 可驱动。报错信息也说得很清楚：交互模式只支持 Windows 与 macOS。在 Windows 或 macOS 上跑同一段代码，`xw.apps.keys()` 会返回正在运行的 Excel 进程列表，`xw.App(visible=False)` 会以后台方式启动 Excel。", "示例 2：用 openpyxl 准备分表样本（可运行，纯 Python 部分）。", "from openpyxl import Workbook", "BRANCH_DATA = {", "\"华东\": [(\"O001\", \"电脑\", 2, 5000), (\"O007\", \"电脑\", 3, 5000)],", "\"华南\": [(\"O002\", \"手机\", 3, 3000), (\"O008\", \"手机\", 2, 3000)],", "\"华西\": [(\"O006\", \"电脑\", 1, 5000), (\"O011\", \"显示器\", 4, 1500)],", "}", "wb = Workbook()", "first = True", "for branch, rows in BRANCH_DATA.items():", "ws = wb.active if first else wb.create_sheet(branch)", "ws.title = branch", "first = False", "ws.append([\"订单号\", \"产品\", \"数量\", \"单价\"])", "for row in rows:", "ws.append(list(row))", "wb.save(\"分表样本.xlsx\")", "print(\"工作表：\", wb.sheetnames)", "print(\"每表行数：\", [wb[name].max_row for name in wb.sheetnames])", "运行结果（本机真实运行输出）：", "工作表： ['华东', '华南', '华西']", "每表行数： [3, 3, 3]", "每张表 3 行 = 1 行标题 + 2 行数据。这个文件就是示例 3 和示例 4 的输入；准备数据的活不需要 Excel，用 openpyxl 做更合适——这正是分工的一部分。", "示例 3：打开工作簿、读写单元格（未在 Excel 内执行验证）。", "import xlwings as xw", "# 未在 Excel 内执行验证：以下代码需在装有 Excel 的 Windows 或 macOS 上运行。", "app = xw.App(visible=False)", "book = app.books.open(\"分表样本.xlsx\")", "sheet = book.sheets[\"华东\"]", "print(sheet[\"A1\"].value)          # 读一个格子：订单号", "print(sheet[\"A1\"].expand(\"table\").value)  # 从 A1 扩展读整张表（含标题行）", "print(sheet[\"A1\"].expand(\"table\").value[1:])  # 去掉标题行，只剩数据行", "sheet[\"A5\"].value = \"O099\"        # 写一个格子", "book.save()", "book.close()", "app.quit()", "预期结果（未在 Excel 内执行验证）：`sheet[\"A1\"].value` 是 `订单号`；`expand(\"table\")` 从 A1 起扩展读到的整表是 `[[\"订单号\", \"产品\", \"数量\", \"单价\"], [\"O001\", \"电脑\", 2, 5000], [\"O007\", \"电脑\", 3, 5000]]`，其中第一行是标题行；切片 `[1:]` 去掉标题行后只剩两行数据。注意：`expand` 扩展的是包含起始格的整片连续区域，从 A2 起扩展同样会把上方的标题行包含进来，所以读数据行时要记得切掉第一行。要点：`app.quit()` 一定要写，否则 Excel 进程留在后台，下次再跑会打开第二个 Excel；读写完先 `book.save()` 再 `book.close()`。", "示例 4：批量合并 3 张分表（未在 Excel 内执行验证）。", "import xlwings as xw", "# 未在 Excel 内执行验证：以下代码需在装有 Excel 的 Windows 或 macOS 上运行。", "app = xw.App(visible=False)", "try:", "book = app.books.open(\"分表样本.xlsx\")", "summary = book.sheets.add(\"汇总\")", "summary[\"A1\"].value = [\"分公司\", \"订单号\", \"产品\", \"数量\", \"单价\", \"金额\"]", "row = 2", "for sheet in book.sheets:", "if sheet.name == \"汇总\":", "continue", "data = sheet[\"A1\"].expand(\"table\").value[1:]  # 去掉标题行，只剩数据行", "for order_id, product, qty, price in data:", "summary[row, 1].value = [sheet.name, order_id, product, qty, price, qty * price]", "row += 1", "summary[f\"A{row}\"].value = \"合计\"", "summary[f\"E{row}\"].value = f\"=SUM(E2:E{row - 1})\"", "summary[f\"F{row}\"].value = f\"=SUM(F2:F{row - 1})\"", "book.save(\"合并汇总.xlsx\")", "print(\"汇总完成，共写入数据行：\", row - 2)", "finally:", "app.quit()", "预期结果（未在 Excel 内执行验证）：汇总表 8 行（1 行标题 + 6 行数据 + 1 行合计），数量合计 15，金额合计 51000（见示例 5 的 Python 侧验算）。要点：循环里用 `sheet.name == \"汇总\"` 跳过新加的汇总表，否则会把汇总表自己也当分表读一遍；`try...finally` 保证即使中途报错也会 `app.quit()`，不留后台 Excel 进程；`summary[row, 1].value = [...]` 一次写一整行，比逐格写快得多。", "示例 5：合并结果的 Python 侧验算（可运行，不用 Excel）。", "from openpyxl import load_workbook", "wb = load_workbook(\"分表样本.xlsx\")", "total_qty = 0", "total_amount = 0", "rows = 0", "for name in [\"华东\", \"华南\", \"华西\"]:", "for _oid, _product, qty, price in wb[name].iter_rows(min_row=2, values_only=True):", "rows += 1", "total_qty += qty", "total_amount += qty * price", "print(\"合并后数据行数：\", rows)", "print(\"数量合计：\", total_qty)", "print(\"金额合计：\", total_amount)", "assert rows == 6 and total_qty == 15 and total_amount == 51000", "print(\"验算通过：与第 4 节汇总表一致\")", "运行结果（本机真实运行输出）：", "合并后数据行数： 6", "数量合计： 15", "金额合计： 51000", "验算通过：与第 4 节汇总表一致", "这个验算的意义：在 Windows 或 macOS 上跑完示例 4 后，打开“合并汇总.xlsx”核对合计行——数量应为 15、金额应为 51000；对不上就说明合并循环漏读或重复读了某张表。"], "scenarios": [{"title": "场景 1：每月合并 30 个分公司的报表。", "body": "- 背景：30 个分公司每月各交一张 xlsx，表头相同、行数不同，要合成一张总表再汇总；以前的做法是逐个打开复制粘贴，半天过去还容易粘错行。\n- 做法：按示例 4 的脚本循环：`app.books.open` 打开一个分表，`expand(\"table\")` 读整表，逐行追加到汇总表，处理完关闭该分表；30 个文件跑完后在汇总表末尾加合计行公式，一次保存。\n- 结果：以本篇 3 张分表为例，合并后 6 行、数量 15、金额 51000；30 张表同理，只是循环次数变多。注意：每处理完一张分表就 `close`，不要同时打开 30 个工作簿。\n\n场景 2：调用 VBA 宏完成 Excel 界面做不了的收尾。\n\n- 背景：报表生成后还要执行一段现成的 VBA 宏（例如按客户拆分工作表并分别打印设置），宏已经在文件里，手工点一次要等很久。\n- 做法：xlwings 打开文件后调 `book.macro(\"宏名\")()` 执行宏，再 `book.save()` 保存；Python 负责循环与文件管理，宏负责 Excel 内部操作。\n- 结果：Python 与 VBA 各做擅长的事；这个场景 openpyxl 做不了，因为它不能运行宏——这也是 xlwings 不可替代的一处。"}], "pitfalls": [{"problem": "`XlwingsError: The interactive mode of xlwings is only supported on Windows and macOS`", "cause": "在 Linux 上调用 `xw.App()` 或 `xw.apps`", "solution": "交互模式只支持 Windows 与 macOS；Linux 上改用 openpyxl／pandas，或用 xlwings Server／Reader 方案"}, {"problem": "`AttributeError: 'NoneType' object has no attribute 'apps'`", "cause": "同上：Linux 上没有 Excel 进程可连", "solution": "不是代码写错，是环境不支持；换一台装有 Excel 的 Windows 或 macOS 再跑"}, {"problem": "脚本跑完后任务管理器里一堆 EXCEL.EXE", "cause": "只 `open` 不 `quit`，Excel 进程留在后台", "solution": "每次都用 `try...finally: app.quit()`；已残留的进程在任务管理器里手动结束"}, {"problem": "`book.save()` 报文件被占用", "cause": "该文件正在 Excel 里手动打开着", "solution": "先关掉手动打开的文件，或另存为新文件名；不要让脚本与手工同时写同一个文件"}, {"problem": "`expand(\"table\")` 读到的表缺行或多行", "cause": "数据中间有空行或空列，扩展在空行处停下", "solution": "保证分表数据连续无空行；或不用 `expand`，改用 `sheet.used_range.value` 整片读再处理"}, {"problem": "写入的值在 Excel 里显示为文本（如 5000 左对齐）", "cause": "写入的是字符串 `\"5000\"` 而不是数值 `5000`", "solution": "写入前用 `int()`／`float()` 转数值；读分表时注意 `expand` 读到的文本型数字"}, {"problem": "循环写几千行非常慢", "cause": "逐格写 `sheet[\"A1\"].value`，每次写都是一次 Excel 调用", "solution": "一次写一整行（`summary[row, 1].value = [...]`）或整片写（`range.value = 二维列表`）"}, {"problem": "宏调用报 `book.macro` 找不到宏", "cause": "宏名写错，或宏在另一个工作簿／加载宏里", "solution": "核对宏名与所在模块；宏在 PERSONAL.XLSB 时先确认该文件已加载"}, {"problem": "`visible=False` 后 Excel 窗口还是弹出来了", "cause": "已有一个可见的 Excel 进程在运行，xlwings 连上了它", "solution": "先关掉已打开的 Excel，或用 `xw.App(visible=False, add_book=False)` 新起一个后台进程"}, {"problem": "中文表名或中文路径报编码错误", "cause": "旧版 xlwings 对非 ASCII 路径处理问题，或文件路径含特殊字符", "solution": "升级 xlwings 到最新版；路径用英文文件夹过渡，或用 `os.path.abspath` 取绝对路径再打开"}], "exercises": ["在本机运行 `import xlwings as xw; print(xw.__version__)`，报出版本号；再运行示例 1 的环境检查，写出两条报错信息分别说明了什么。", "用 openpyxl 生成 3 张分表样本（华东、华南、华西各 2 行），保存后重新打开，打印每张表的工作表名与行数。", "说出 `xw.App(visible=False)` 里的 `visible=False` 是什么意思；如果改成 `visible=True`，运行中会看到什么不同？", "示例 4 的循环里为什么要用 `if sheet.name == \"汇总\": continue` 跳过汇总表？如果不跳过，会发生什么？", "写出调用 VBA 宏的 xlwings 代码（假设宏名叫“拆分并打印设置”），并说出 `book.save()` 应该写在调用宏之前还是之后，为什么？", "判断题：以下三个任务各该用 xlwings、openpyxl 还是 pandas？（1）在 Linux 服务器上每晚定时生成 100 份报表；（2）在 Windows 办公室里把 30 张已打开的分表合并，并调用现成的 VBA 宏收尾；（3）一份 10 万行订单要清洗、分组汇总并输出报告。每个判断写出一句话理由。"], "answers": ["本机实测版本 0.37.8。两条报错：`XlwingsError: The interactive mode ... only supported on Windows and macOS` 说明交互模式只支持 Windows 与 macOS，Linux 上没有可驱动的 Excel；`AttributeError: 'NoneType' object has no attribute 'apps'` 是同一原因的连带报错，`xw.App()` 在 Linux 上拿不到 Excel 应用对象。两条都不是代码写错，而是环境不支持。", "做法见示例 2。重新打开后工作表名是 `['华东', '华南', '华西']`，每表行数 3（1 行标题 + 2 行数据）。如果某表行数是 2，说明漏写了标题行。", "`visible=False` 表示以后台方式启动 Excel，不显示窗口；改成 `visible=True` 会看到 Excel 窗口弹出来并实时执行每一步，适合调试，跑批量任务时用 False 更快且不干扰操作。", "因为汇总表是循环中新加的表，不跳过的话，循环走到汇总表时会把汇总表里刚写入的行又当作分表数据读一遍、再追加进去，造成重复行与合计越算越大。", "代码：`book.macro(\"拆分并打印设置\")()`。`book.save()` 应写在调用宏之后：宏会改动工作簿内容（拆分表、改打印设置），保存要在所有改动完成后做；先保存再调宏，宏做的改动就没存进去。", "（1）openpyxl：Linux 服务器上没有 Excel，xlwings 跑不了；定时生成报表是纯文件操作，openpyxl 最合适。（2）xlwings：任务必须经过正在运行的 Excel，还要调用现成的 VBA 宏，只有 xlwings 能做到。（3）pandas：10 万行清洗与分组汇总是 pandas 的主场，`groupby` 一行代码完成；openpyxl 逐格写 10 万行太慢，xlwings 更慢。"], "versions": "Python 3.10 及以上，xlwings 0.37.8；Excel 驱动部分需 Windows 或 macOS 上安装的 Excel（Microsoft 365 或买断版均可，xlwings 不依赖特定 Excel 版本）", "file": "Python-xlwings-batch.py"}, {"id": "python-excel-04-python-in-excel", "group": "python-excel", "column": "C15", "level2": "C15-L2-4", "title": "Python in Excel：用 =PY() 在单元格里写 Python", "level": "进阶", "body": "### 2.1 Python in Excel 是什么\n\nPython in Excel 是微软把 Python 放进 Excel 单元格的功能：在单元格里输入 `=PY(`，写 Python 代码，代码被送到微软云端（由 Anaconda 提供运行环境）执行，结果返回到工作表。不用在本机装 Python，不用装任何库，pandas、Matplotlib 这些数据分析库在云端已经装好。\n\n### 2.2 =PY() 与 xl()\n\n- `=PY()`：进入 Python 模式的公式。在单元格里输入 `=PY(` 后写 Python 代码，确认后单元格开始计算，计算时显示 BUSY，算完后返回结果。\n- `xl()`：Python 代码里引用 Excel 对象的专用函数。`xl(\"A1\")` 取一个格子，`xl(\"A1:G13\", headers=True)` 取一个区域并把第一行当表头返回 DataFrame，`xl(\"表名[#All]\", headers=True)` 取一整张表。\n- 输出类型：公式栏里的 Python 输出菜单可以切换两种输出。Python 对象：单元格显示 DataFrame 这样的对象卡片，点卡片看详情；Excel 值：把结果转成普通单元格数值，可以继续用公式引用、做图表。两种输出的数字相同，区别在结果能不能被其他单元格直接使用。\n\n### 2.3 版本与可用性（以 Microsoft 支持文档为准，2026-11-10 核对）\n\n| 用户类型 | 平台与最低版本 | 状态 |\n|---|---|---|\n| 企业与商业（Microsoft 365） | Windows 当前频道 2408 版（17928.20114）起 | 正式版 |\n| 企业与商业（Microsoft 365） | Windows 每月企业频道 2408 版（17928.20216）起 | 正式版 |\n| 企业与商业（Microsoft 365） | Windows 半年企业频道 2502 版（18526.20472）起 | 正式版 |\n| 企业与商业（Microsoft 365） | Excel 网页版 | 正式版 |\n| 企业与商业（Microsoft 365） | Mac 当前频道 16.96 版（25041326）起 | 正式版 |\n| 家庭与个人（Microsoft 365） | Excel 网页版，或 Windows 当前频道 2405 版（17628.20164）起 | 预览版 |\n| 家庭与个人（Microsoft 365） | Mac Insider 计划 Beta 频道 16.95 版（25021921）起 | 预览版 |\n| 教育订阅 | Windows，通过 Microsoft 365 Insider 计划，2406 版（17726.20016）起 | 通过 Insider 计划提供 |\n\n不支持的情况：Excel for iPad、iPhone、Android 上不能运行；买断版 Excel 2021／2024 与 Office LTSC 不支持；免费的消费者帐户与设备型授权（按设备而非按用户授权）不支持；共享计算机激活的订阅不支持。企业与商业订阅的预览已结束，符合条件的用户直接用正式版。\n\n### 2.4 计算方式与费用\n\n- 代码在微软云端运行，不是在你的电脑上运行：必须联网，且须开启 Microsoft 365 联网体验。\n- 包含在订阅里的是标准算力与自动重算模式；想要更快的计算（高级算力）与手动／部分重算模式，需购买 Python in Excel 附加许可证（或请管理员申请）。\n- 云端环境由 Anaconda 提供，预装 pandas、Matplotlib、seaborn、scikit-learn 等数据分析库；但出于安全原因，`pandas.read_csv`、`pandas.read_excel` 这类从外部读文件的函数在 Python in Excel 里不可用——数据要先放进工作表，再用 `xl()` 引用。", "steps": ["确认版本：按第 2.3 节的表核对自己的订阅类型、平台与 Excel 版本，确认可用再往下做（待补图）。", "准备数据：把 12 行订单放进工作表 A1:G13（含标题行），标题为订单号、日期、客户编号、产品、数量、单价、金额。", "写第一个 `=PY()` 公式：选中一个空单元格，输入 `=PY(`，写一行求和代码，确认后看结果（示例 1；未在 Excel 内执行验证）。", "引用区域做分组汇总：用 `xl(\"A1:G13\", headers=True)` 读整表，`groupby` 按产品汇总，输出选 Excel 值（示例 2；未在 Excel 内执行验证）。", "描述统计：`describe()` 一次算出数量、单价、金额的计数、均值、标准差与分位数（示例 3；未在 Excel 内执行验证）。", "本地对照：在没有 Microsoft 365 的电脑上，用本篇第 5 节的本地等价代码跑同样的逻辑，核对数字是否一致。"], "sections": [{"title": "2. 基础概念", "body": "### 2.1 Python in Excel 是什么\n\nPython in Excel 是微软把 Python 放进 Excel 单元格的功能：在单元格里输入 `=PY(`，写 Python 代码，代码被送到微软云端（由 Anaconda 提供运行环境）执行，结果返回到工作表。不用在本机装 Python，不用装任何库，pandas、Matplotlib 这些数据分析库在云端已经装好。\n\n### 2.2 =PY() 与 xl()\n\n- `=PY()`：进入 Python 模式的公式。在单元格里输入 `=PY(` 后写 Python 代码，确认后单元格开始计算，计算时显示 BUSY，算完后返回结果。\n- `xl()`：Python 代码里引用 Excel 对象的专用函数。`xl(\"A1\")` 取一个格子，`xl(\"A1:G13\", headers=True)` 取一个区域并把第一行当表头返回 DataFrame，`xl(\"表名[#All]\", headers=True)` 取一整张表。\n- 输出类型：公式栏里的 Python 输出菜单可以切换两种输出。Python 对象：单元格显示 DataFrame 这样的对象卡片，点卡片看详情；Excel 值：把结果转成普通单元格数值，可以继续用公式引用、做图表。两种输出的数字相同，区别在结果能不能被其他单元格直接使用。\n\n### 2.3 版本与可用性（以 Microsoft 支持文档为准，2026-11-10 核对）\n\n| 用户类型 | 平台与最低版本 | 状态 |\n|---|---|---|\n| 企业与商业（Microsoft 365） | Windows 当前频道 2408 版（17928.20114）起 | 正式版 |\n| 企业与商业（Microsoft 365） | Windows 每月企业频道 2408 版（17928.20216）起 | 正式版 |\n| 企业与商业（Microsoft 365） | Windows 半年企业频道 2502 版（18526.20472）起 | 正式版 |\n| 企业与商业（Microsoft 365） | Excel 网页版 | 正式版 |\n| 企业与商业（Microsoft 365） | Mac 当前频道 16.96 版（25041326）起 | 正式版 |\n| 家庭与个人（Microsoft 365） | Excel 网页版，或 Windows 当前频道 2405 版（17628.20164）起 | 预览版 |\n| 家庭与个人（Microsoft 365） | Mac Insider 计划 Beta 频道 16.95 版（25021921）起 | 预览版 |\n| 教育订阅 | Windows，通过 Microsoft 365 Insider 计划，2406 版（17726.20016）起 | 通过 Insider 计划提供 |\n\n不支持的情况：Excel for iPad、iPhone、Android 上不能运行；买断版 Excel 2021／2024 与 Office LTSC 不支持；免费的消费者帐户与设备型授权（按设备而非按用户授权）不支持；共享计算机激活的订阅不支持。企业与商业订阅的预览已结束，符合条件的用户直接用正式版。\n\n### 2.4 计算方式与费用\n\n- 代码在微软云端运行，不是在你的电脑上运行：必须联网，且须开启 Microsoft 365 联网体验。\n- 包含在订阅里的是标准算力与自动重算模式；想要更快的计算（高级算力）与手动／部分重算模式，需购买 Python in Excel 附加许可证（或请管理员申请）。\n- 云端环境由 Anaconda 提供，预装 pandas、Matplotlib、seaborn、scikit-learn 等数据分析库；但出于安全原因，`pandas.read_csv`、`pandas.read_excel` 这类从外部读文件的函数在 Python in Excel 里不可用——数据要先放进工作表，再用 `xl()` 引用。"}, {"title": "4. 图文示例", "body": "示例：工作表布局（文字版）。\n\n- A1:G13 是订单明细（12 行订单 + 1 行标题），其中 G 列金额是公式 `=E2*F2` 下拉得到的。\n- A15 单元格写 `=PY()` 求和公式，输出类型选 Excel 值，显示 75600。\n- A17 单元格写 `=PY()` 分组汇总公式，输出类型选 Excel 值，结果向下溢出成一张小表：电脑 40000、手机 15000、耳机 9000、键盘 2600、显示器 9000。\n- A25 单元格写 `=PY()` 描述统计公式，输出类型选 Excel 值，结果是一张描述统计表。\n\n注意：如果 A17 的溢出区域里已经有内容，公式会返回 #SPILL! 错误，先清空那片区域再算（待补图）。"}], "source": "docs/python-excel/04-python-in-excel.md", "updated": "2026-11-10", "objectives": ["说出 Python in Excel 是什么：`=PY()` 公式、代码在微软云端运行、不用在本机装 Python", "写出第一个 `=PY()` 公式，并用 `xl()` 引用工作表里的区域", "说出 Python 对象与 Excel 值两种输出方式的区别，并切换它们", "对照版本表判断自己的 Excel 能不能用 Python in Excel", "说出 5 条以上限制：不支持的平台、联网要求、读文件函数不可用、重算模式与付费提速", "在没有 Microsoft 365 的电脑上，用本地 pandas 复现同样的分析并核对结果"], "formulas": ["示例 1：第一个 `=PY()` 公式——总销售额（未在 Excel 内执行验证）。", "=PY(", "df = xl(\"A1:G13\", headers=True)", "df[\"金额\"].sum()", ")", "预期结果（未在 Excel 内执行验证；数值为本地 pandas 等价运算的真实运行输出）：75600。输出类型选 Excel 值时，单元格直接显示 75600，可以被其他公式引用；选 Python 对象时，单元格显示对象卡片，需点开卡片看值。`xl(\"A1:G13\", headers=True)` 把区域读成 DataFrame，第一行是列名；最后一行表达式的值就是返回给单元格的结果。", "本地等价代码（可运行，与上面 `=PY()` 逻辑相同）：", "import pandas as pd", "ORDERS = [", "(\"O001\", \"2025-01-05\", \"C001\", \"P001\", 2, 5000),", "(\"O002\", \"2025-01-12\", \"C002\", \"P002\", 3, 3000),", "(\"O003\", \"2025-02-08\", \"C001\", \"P003\", 10, 300),", "(\"O004\", \"2025-03-15\", \"C003\", \"P004\", 5, 200),", "(\"O005\", \"2025-03-20\", \"C002\", \"P005\", 2, 1500),", "(\"O006\", \"2025-06-10\", \"C004\", \"P001\", 1, 5000),", "(\"O007\", \"2026-01-06\", \"C001\", \"P001\", 3, 5000),", "(\"O008\", \"2026-01-15\", \"C002\", \"P002\", 2, 3000),", "(\"O009\", \"2026-02-10\", \"C003\", \"P003\", 20, 300),", "(\"O010\", \"2026-02-18\", \"C001\", \"P004\", 8, 200),", "(\"O011\", \"2026-03-05\", \"C004\", \"P005\", 4, 1500),", "(\"O012\", \"2026-03-22\", \"C002\", \"P001\", 2, 5000),", "]", "PRODUCTS = {\"P001\": \"电脑\", \"P002\": \"手机\", \"P003\": \"耳机\", \"P004\": \"键盘\", \"P005\": \"显示器\"}", "df = pd.DataFrame(ORDERS, columns=[\"订单号\", \"日期\", \"客户编号\", \"产品编号\", \"数量\", \"单价\"])", "df[\"产品\"] = df[\"产品编号\"].map(PRODUCTS)", "df[\"金额\"] = df[\"数量\"] * df[\"单价\"]", "df.to_excel(\"订单明细.xlsx\", index=False)", "print(\"总销售额：\", int(df[\"金额\"].sum()))", "print(\"订单笔数：\", len(df))", "print(\"客单价：\", int(df[\"金额\"].sum() // len(df)))", "运行结果（本机真实运行输出）：", "总销售额： 75600", "订单笔数： 12", "客单价： 6300", "示例 2：按产品分组汇总（未在 Excel 内执行验证）。", "=PY(", "df = xl(\"A1:G13\", headers=True)", "df.groupby(\"产品\")[\"金额\"].sum()", ")", "预期结果（未在 Excel 内执行验证；数值为本地 pandas 等价运算的真实运行输出）：", "产品", "手机     15000", "显示器     9000", "电脑     40000", "耳机      9000", "键盘      2600", "输出类型选 Excel 值时，结果向下溢出成两列（产品、金额）；选 Python 对象时，单元格只显示一个 Series 对象卡片。手工验算：电脑 10000+5000+15000+10000 = 40000，手机 9000+6000 = 15000，耳机 3000+6000 = 9000，键盘 1000+1600 = 2600，显示器 3000+6000 = 9000，五数相加 75600。", "本地等价代码（可运行）：", "import pandas as pd", "df = pd.read_excel(\"订单明细.xlsx\")", "by_product = df.groupby(\"产品\")[\"金额\"].sum()", "print(by_product.to_string())", "print(\"五产品合计：\", int(by_product.sum()))", "运行结果（本机真实运行输出）：", "产品", "手机     15000", "显示器     9000", "电脑     40000", "耳机      9000", "键盘      2600", "五产品合计： 75600", "示例 3：描述统计 `describe()`（未在 Excel 内执行验证）。", "=PY(", "df = xl(\"A1:G13\", headers=True)", "df[[\"数量\", \"单价\", \"金额\"]].describe()", ")", "预期结果（未在 Excel 内执行验证；数值为本地 pandas 等价运算的真实运行输出）：", "数量           单价            金额", "count  12.000000    12.000000     12.000000", "mean    5.166667  2500.000000   6300.000000", "std     5.390789  2083.702998   4093.009562", "min     1.000000   200.000000   1000.000000", "25%     2.000000   300.000000   3000.000000", "50%     3.000000  2250.000000   6000.000000", "75%     5.750000  5000.000000   9250.000000", "max    20.000000  5000.000000  15000.000000", "读法：`count` 是 12 行；`mean` 是平均值（平均每笔 6300 元）；`std` 是标准差（金额标准差 4093.01，说明订单金额波动大）；`50%` 是中位数（金额中位数 6000，低于均值 6300，说明少数大单拉高了均值）；`min` 与 `max` 是最小与最大订单金额（1000 与 15000）。输出类型选 Excel 值时整张表溢出到工作表里，可以直接用它做图表的数据源。", "本地等价代码（可运行）：", "import pandas as pd", "df = pd.read_excel(\"订单明细.xlsx\")", "desc = df[[\"数量\", \"单价\", \"金额\"]].describe()", "print(desc.to_string())", "by_product = df.groupby(\"产品\").agg(订单数=(\"订单号\", \"count\"), 数量=(\"数量\", \"sum\"),", "销售额=(\"金额\", \"sum\")).reset_index()", "with pd.ExcelWriter(\"分析结果.xlsx\", engine=\"openpyxl\") as writer:", "df.to_excel(writer, sheet_name=\"明细\", index=False)", "by_product.to_excel(writer, sheet_name=\"按产品汇总\", index=False)", "desc.to_excel(writer, sheet_name=\"描述统计\")", "check = pd.read_excel(\"分析结果.xlsx\", sheet_name=\"按产品汇总\")", "print(\"读回核对电脑销售额：\", int(check.loc[check[\"产品\"] == \"电脑\", \"销售额\"].iloc[0]))", "运行结果（本机真实运行输出）：", "数量           单价            金额", "count  12.000000    12.000000     12.000000", "mean    5.166667  2500.000000   6300.000000", "std     5.390789  2083.702998   4093.009562", "min     1.000000   200.000000   1000.000000", "25%     2.000000   300.000000   3000.000000", "50%     3.000000  2250.000000   6000.000000", "75%     5.750000  5000.000000   9250.000000", "max    20.000000  5000.000000  15000.000000", "读回核对电脑销售额： 40000", "本地等价代码（可运行）：交叉核对——把三处结果互相印证。", "import pandas as pd", "detail = pd.read_excel(\"分析结果.xlsx\", sheet_name=\"明细\")", "by_product = pd.read_excel(\"分析结果.xlsx\", sheet_name=\"按产品汇总\")", "desc = pd.read_excel(\"分析结果.xlsx\", sheet_name=\"描述统计\", index_col=0)", "print(\"明细行数：\", len(detail))", "print(\"明细总额与汇总表总额一致：\", int(detail[\"金额\"].sum()) == int(by_product[\"销售额\"].sum()) == 75600)", "print(\"描述统计里的金额均值：\", round(float(desc.loc[\"mean\", \"金额\"]), 2))", "print(\"描述统计里的金额最大值：\", int(desc.loc[\"max\", \"金额\"]))", "assert int(detail[\"金额\"].sum()) == 75600", "assert round(float(desc.loc[\"mean\", \"金额\"]), 2) == 6300.0", "assert int(desc.loc[\"max\", \"金额\"]) == 15000", "print(\"交叉核对通过\")", "运行结果（本机真实运行输出）：", "明细行数： 12", "明细总额与汇总表总额一致： True", "描述统计里的金额均值： 6300.0", "描述统计里的金额最大值： 15000", "交叉核对通过", "三处结果互相印证：明细表 12 行加总是 75600，按产品汇总表加总也是 75600，描述统计的金额均值 6300 正好等于 75600 / 12，最大值 15000 对应 O007 那笔订单。"], "scenarios": [{"title": "场景 1：周报里加一张“异常订单”分析，不离开 Excel。", "body": "- 背景：每周例会要回答三个问题：本周最大的一笔订单是多少、平均每笔多少、哪个产品卖得最好。数据已经在工作表里，但 Excel 公式写描述统计要拼一堆函数。\n- 做法：在空白单元格写 `=PY(df[[\"数量\", \"单价\", \"金额\"]].describe())`，输出选 Excel 值，一张描述统计表直接出现在工作表里；再写一个 `groupby` 公式得到按产品汇总。\n- 结果：以本篇数据为例，平均每笔 6300 元，中位数 6000 元，最大一笔 15000 元（O007），卖得最好的是电脑（40000 元）。下周数据更新后公式自动重算，不用重写。\n\n场景 2：给不懂 Python 的同事留一个“可改参数”的分析模板。\n\n- 背景：分析模板要交给同事用，同事不会 Python，但会改 Excel 里的数字。\n- 做法：把参数（例如“只看 2026 年的订单”）写成工作表里的单元格，`=PY()` 代码里用 `xl()` 读这个参数单元格做筛选；同事改参数、公式重算，结果跟着变。\n- 结果：同事全程只碰 Excel 单元格，不用学 Python；但要注意两点：一是文件必须在支持 Python in Excel 的电脑或网页版打开，否则 Python 单元格重算会报错；二是含 Python 公式的文件发给用买断版 Excel 的同事，对方只能看不能算。"}], "pitfalls": [{"problem": "输入 `=PY(` 后没有任何反应", "cause": "Excel 版本或订阅不符合第 2.3 节的版本表", "solution": "按版本表核对订阅类型、平台与版本号；买断版 Excel 2021／2024 不支持，需改用 Microsoft 365"}, {"problem": "Python 单元格显示错误，无法重算", "cause": "在 iPad、iPhone、Android 上打开，或订阅是设备型授权／共享计算机激活", "solution": "换到 Windows、Mac 或网页版 Excel；设备型授权与共享计算机激活不在支持范围"}, {"problem": "公式一直显示 BUSY 不出结果", "cause": "代码正在云端计算，或断网了", "solution": "等待计算完成；检查网络与 Microsoft 365 联网体验是否开启；代码死循环时删掉公式重写"}, {"problem": "结果溢出时返回 #SPILL!", "cause": "输出区域里已有内容，挡住了溢出位置", "solution": "清空输出区域内的单元格；或把公式移到一片空白区域再算"}, {"problem": "`xl()` 引用后读到的不是 DataFrame", "cause": "引用时忘了加 `headers=True`，第一行被当成数据而不是表头", "solution": "区域含标题行时写 `xl(\"A1:G13\", headers=True)`；整张表用 `xl(\"表名[#All]\", headers=True)`"}, {"problem": "想用 `pd.read_excel` 读文件，报错", "cause": "Python in Excel 出于安全原因不支持从外部读文件的函数", "solution": "数据先放进工作表，再用 `xl()` 引用；不要试图在 `=PY()` 里读本地文件"}, {"problem": "返回的对象卡片不能被其他公式引用", "cause": "输出类型是 Python 对象，不是 Excel 值", "solution": "在公式栏的 Python 输出菜单里切换为 Excel 值，再让其他公式引用它"}, {"problem": "同事打开文件后 Python 单元格全是错误", "cause": "对方用的 Excel 不支持 Python in Excel", "solution": "提前说明版本要求；或把 Python 输出切换为 Excel 值并粘贴为数值后再发给对方"}, {"problem": "大数据量时计算很慢", "cause": "标准算力有速度上限，自动重算会反复触发云端计算", "solution": "大表先筛选再算；需要更快速度或手动／部分重算模式时购买附加许可证"}, {"problem": "公式栏里看不到 Python 代码，只有结果", "cause": "单元格处于 Python 对象输出模式，或选中的不是 Python
