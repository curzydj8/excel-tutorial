<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Excel 综合站 - 从入门到精通</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#217346;--green-d:#1a5c38;--bg:#f4f7f5;--card:#fff;--text:#1f2937;--muted:#6b7280;--border:#e5e7eb}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.7}
header{background:linear-gradient(135deg,var(--green),var(--green-d));color:#fff;padding:28px 20px;text-align:center;position:sticky;top:0;z-index:50}
header h1{font-size:26px;margin-bottom:6px}
header p{opacity:.85;font-size:14px}
.searchbar{max-width:560px;margin:16px auto 0;display:flex;gap:8px}
.searchbar input{flex:1;padding:12px 16px;border:none;border-radius:10px;font-size:15px;outline:none}
.searchbar button{padding:12px 22px;border:none;border-radius:10px;background:#fff;color:var(--green);font-weight:700;cursor:pointer;font-size:15px}
.layout{display:flex;max-width:1280px;margin:0 auto;min-height:calc(100vh - 160px)}
aside{width:260px;flex-shrink:0;background:#fff;border-right:1px solid var(--border);padding:16px 0;position:sticky;top:150px;max-height:calc(100vh - 150px);overflow-y:auto}
.nav-group{margin-bottom:4px}
.nav-title{padding:10px 20px;font-weight:700;font-size:14px;color:var(--green);cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.nav-title:hover{background:#f0f9f3}
.nav-items{display:none;padding:2px 0}
.nav-group.open .nav-items{display:block}
.nav-item{padding:8px 20px 8px 36px;font-size:13px;color:var(--text);cursor:pointer;border-left:3px solid transparent}
.nav-item:hover{background:#f0f9f3}
.nav-item.active{background:#e8f5ec;border-left-color:var(--green);color:var(--green);font-weight:700}
main{flex:1;padding:24px;min-width:0}
.badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;color:#fff;font-weight:600;margin-right:6px}
.card{background:var(--card);border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card h3{font-size:17px;margin-bottom:8px;color:var(--green-d)}
.card h4{font-size:15px;margin:12px 0 6px}
pre{background:#1e293b;color:#e2e8f0;padding:14px;border-radius:8px;overflow-x:auto;font-size:13px;margin:8px 0;position:relative}
pre code{font-family:Consolas,monospace}
.copybtn{position:absolute;top:8px;right:8px;background:#334155;color:#fff;border:none;padding:4px 12px;border-radius:6px;font-size:12px;cursor:pointer}
.copybtn:hover{background:#475569}
table{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0}
th,td{border:1px solid var(--border);padding:8px 10px;text-align:left}
th{background:#f0f9f3;color:var(--green-d)}
.pitfall{background:#fef3c7;border-left:4px solid #f59e0b;padding:10px 14px;border-radius:0 8px 8px 0;margin:8px 0;font-size:13px}
.tip{background:#ecfdf5;border-left:4px solid var(--green);padding:10px 14px;border-radius:0 8px 8px 0;margin:8px 0;font-size:13px}
.func-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.func-card{background:var(--card);border-radius:10px;padding:14px;cursor:pointer;border:1px solid var(--border);transition:.15s}
.func-card:hover{border-color:var(--green);box-shadow:0 2px 8px rgba(33,115,70,.15)}
.func-card .fname{font-weight:700;font-size:15px;color:var(--green-d)}
.func-card .fdesc{font-size:13px;color:var(--muted);margin-top:4px}
.detail{display:none}
.kw-table td:first-child{font-weight:700;color:var(--green-d);white-space:nowrap}
.path{display:flex;align-items:center;gap:0;margin:16px 0;flex-wrap:wrap}
.path-step{background:var(--card);border:2px solid var(--green);border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer;text-align:center}
.path-step small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.path-arrow{font-size:20px;color:var(--green);margin:0 6px}
.hidden{display:none!important}
footer{text-align:center;padding:24px;color:var(--muted);font-size:13px}
@media(max-width:768px){.layout{flex-direction:column}aside{width:100%;position:static;max-height:none;border-right:none;border-bottom:1px solid var(--border)}}
</style>
</head>
<body>
<header>
<h1>📊 Excel 综合站</h1>
<p>从入门到精通 · 102 函数中文详解 · VBA 实例 · 图表 · 实战场景</p>
<div class="searchbar">
<input id="search" placeholder="搜索函数 / VBA关键字 / 技巧，如 VLOOKUP、数据透视表..." oninput="doSearch(this.value)">
<button onclick="doSearch(document.getElementById('search').value)">搜索</button>
</div>
</header>
<div class="layout">
<aside id="nav"></aside>
<main id="main"></main>
</div>
<footer>Excel 综合站 · 数据来源 excel-tutorial 项目 · 持续更新中</footer>
<script>
const DATA = {"functions": [{"name": "SUM", "cat": "math", "cat_name": "数学函数", "syntax": "SUM(数值1, [数值2], ...)", "desc": "求和：把一堆数字加起来，最常用的函数", "examples": ["=SUM(B2:B10)", "=SUM(B2:B10, D2:D10, F2:F10)"], "pitfalls": ["区域中混入文本会被自动忽略，不会报错，但求和结果可能与预期不符", "数字以文本形式存储（如左上角有绿三角）时会被跳过，先用「分列」转为数值", "公式返回 `#VALUE!` 通常是因为参数中引用了错误值"]}, {"name": "SUMIF", "cat": "math", "cat_name": "数学函数", "syntax": "SUMIF(条件区域, 条件, [求和区域])", "desc": "条件求和：只加满足条件的那部分", "examples": ["=SUMIF(A2:A50, \"销售部\", B2:B50)", "=SUMIF(B2:B50, \">\"&D1)"], "pitfalls": ["条件中的文本必须加英文双引号，数字条件如 `\">100\"` 整个也要加引号", "条件区域和求和区域行数不一致时，结果会错位，建议保持相同大小"]}, {"name": "SUMIFS", "cat": "math", "cat_name": "数学函数", "syntax": "SUMIFS(求和区域, 条件区域1, 条件1, [条件区域2, 条件2], ...)", "desc": "多条件求和：同时满足多个条件才加", "examples": ["=SUMIFS(C2:C100, A2:A100, \"销售部\", B2:B100, \"3月\")", "=SUMIFS(F2:F100, D2:D100, \">50\", E2:E100, \"<20\")"], "pitfalls": ["与 SUMIF 参数顺序相反（SUMIFS 求和区域在前），混用时最容易写错", "所有条件区域必须行列数一致，否则返回 `#VALUE!`", "通配符可用：`\"北*\"` 匹配所有以\"北\"开头的文本"]}, {"name": "AVERAGE", "cat": "math", "cat_name": "数学函数", "syntax": "AVERAGE(数值1, [数值2], ...)", "desc": "求平均值", "examples": ["=AVERAGE(B2:B40)", "=AVERAGE(C2:C40)"], "pitfalls": ["值为 0 的单元格**会计入**平均（分母包含它），空单元格则不计入；想排除 0 要用 AVERAGEIF", "区域全是文本时返回 `#DIV/0!`"]}, {"name": "AVERAGEIF", "cat": "math", "cat_name": "数学函数", "syntax": "AVERAGEIF(条件区域, 条件, [平均区域])", "desc": "条件平均：只对满足条件的求平均", "examples": ["=AVERAGEIF(B2:B40, \">=60\")", "=AVERAGEIF(A2:A100, \"技术部\", C2:C100)"], "pitfalls": ["没有满足条件的单元格时返回 `#DIV/0!`，建议外层套 IFERROR", "条件写法规则与 SUMIF 完全一致"]}, {"name": "COUNT", "cat": "math", "cat_name": "数学函数", "syntax": "COUNT(数值1, [数值2], ...)", "desc": "计数：数一数有多少个数字", "examples": ["=COUNT(B2:B40)", "=COUNT(C2:C32)"], "pitfalls": ["想统计非空单元格个数要用 COUNTA（见统计函数章），COUNT 会漏掉文本", "日期会被计入（日期本质是数字），这是合理的"]}, {"name": "ROUND", "cat": "math", "cat_name": "数学函数", "syntax": "ROUND(数值, 小数位数)", "desc": "四舍五入到指定位数", "examples": ["=ROUND(123.4567, 2)   → 123.46", "=ROUND(12345, -2)     → 12300"], "pitfalls": ["误以为 ROUND(-2.5, 0) 的行为：Excel 中是 -3（远离零取整），不是 -2", "只是改单元格格式显示小数位数，实际值并未改变；需要真正取整必须用 ROUND"]}, {"name": "ROUNDUP", "cat": "math", "cat_name": "数学函数", "syntax": "ROUNDUP(数值, 小数位数)", "desc": "向上舍入（只入不舍）", "examples": ["=ROUNDUP(3.2/0.5, 0)*0.5   → 3.5", "=ROUNDUP(47/8, 0)   → 6"], "pitfalls": ["与 ROUND 混淆：ROUNDUP(2.1, 0)=3，而 ROUND(2.1, 0)=2", "负数时远离零：ROUNDUP(-2.1, 0)=-3"]}, {"name": "ROUNDDOWN", "cat": "math", "cat_name": "数学函数", "syntax": "ROUNDDOWN(数值, 小数位数)", "desc": "向下舍入（只舍不入）", "examples": ["=ROUNDDOWN(4.9, 0)   → 4", "=ROUNDDOWN(99.999, 2)   → 99.99"], "pitfalls": ["与 INT 区别：ROUNDDOWN(-2.9, 0)=-2（向零），INT(-2.9)=-3（向下）"]}, {"name": "INT", "cat": "math", "cat_name": "数学函数", "syntax": "INT(数值)", "desc": "取整：直接砍掉小数部分", "examples": ["=INT(25/7)   → 3"], "pitfalls": ["负数向下取整：INT(-2.1)=-3，不是 -2，这是新手最常踩的坑"]}, {"name": "MOD", "cat": "math", "cat_name": "数学函数", "syntax": "MOD(被除数, 除数)", "desc": "取余数：如判断奇偶行", "examples": ["=MOD(A1, 2)=0", "=MOD(ROW(), 2)"], "pitfalls": ["除数为 0 时返回 `#DIV/0!`", "结果的符号与除数一致：MOD(-5, 2)=1（不是 -1），这点与很多编程语言不同"]}, {"name": "ABS", "cat": "math", "cat_name": "数学函数", "syntax": "ABS(数值)", "desc": "取绝对值", "examples": ["=ABS(B2-C2)"], "pitfalls": []}, {"name": "SQRT", "cat": "math", "cat_name": "数学函数", "syntax": "SQRT(数值)", "desc": "开平方", "examples": ["=SQRT(A1)"], "pitfalls": ["负数返回 `#NUM!`，需要虚数结果请用 IMSQRT"]}, {"name": "POWER", "cat": "math", "cat_name": "数学函数", "syntax": "POWER(底数, 指数)", "desc": "乘方", "examples": ["=POWER(2, 10)   → 1024", "=POWER(A1, 1/3)"], "pitfalls": ["负数开偶次方根返回 `#NUM!`；注意 `^` 运算符优先级高于负号，`=-2^2` 结果是 4"]}, {"name": "RAND", "cat": "math", "cat_name": "数学函数", "syntax": "RAND()", "desc": "生成 0~1 随机小数", "examples": ["=RAND()", "=60+RAND()*40"], "pitfalls": ["每次工作表重算都会变化；需要固定值时复制后「选择性粘贴为数值」", "RAND 是易失性函数，大量使用会拖慢表格重算"]}, {"name": "RANDBETWEEN", "cat": "math", "cat_name": "数学函数", "syntax": "RANDBETWEEN(下限, 上限)", "desc": "生成指定范围的随机整数", "examples": ["=RANDBETWEEN(1, 100)", "=INDEX(A2:A51, RANDBETWEEN(1, 50))"], "pitfalls": ["下限大于上限时返回 `#NUM!`", "同 RAND，每次重算都会变，定稿前记得粘贴为值"]}, {"name": "SUMPRODUCT", "cat": "math", "cat_name": "数学函数", "syntax": "SUMPRODUCT(数组1, [数组2], ...)", "desc": "乘积求和：先对应相乘再加总，万能函数", "examples": ["=SUMPRODUCT(B2:B100, C2:C100)", "=SUMPRODUCT((A2:A100=\"销售部\")*(C2:C100>10000))"], "pitfalls": ["区域中混入文本会导致 `#VALUE!`（不像 SUM 那样自动忽略）", "数组维度不一致返回 `#VALUE!`", "数据量大时计算较慢，能用 SUMIFS 的场景优先用 SUMIFS"]}, {"name": "SUBTOTAL", "cat": "math", "cat_name": "数学函数", "syntax": "SUBTOTAL(功能代码, 区域1, [区域2], ...)", "desc": "分类汇总：只对可见单元格求和，筛选后求和不翻车", "examples": ["=SUBTOTAL(9, B2:B100)", "=SUBTOTAL(109, B2:B100)   → 忽略手动隐藏行求和"], "pitfalls": ["功能代码写错区间（如写成 19）返回 `#VALUE!`", "1~9 会计入手动隐藏行，101~109 才忽略；筛选隐藏行两者都忽略"]}, {"name": "AGGREGATE", "cat": "math", "cat_name": "数学函数", "syntax": "AGGREGATE(功能代码, 选项, 数组, [参数k])", "desc": "聚合计算：SUBTOTAL 的升级版，可忽略错误值", "examples": ["=AGGREGATE(9, 6, B2:B100)", "=AGGREGATE(14, 6, B2:B100, 2)"], "pitfalls": ["比 SUBTOTAL 强大但参数更复杂，功能代码与 SUBTOTAL 不完全对应，注意查表", "引用整列（如 B:B）时性能较差，尽量限定具体区域"]}, {"name": "LEFT", "cat": "text", "cat_name": "文本函数", "syntax": "LEFT(文本, [字符数])", "desc": "从左边取指定个数的字符", "examples": ["=LEFT(A2, 3)   → \"138\"（A2=\"13812345678\"）", "=LEFT(A2, 4)   → \"2026\""], "pitfalls": ["字符数超过文本长度时返回整个文本，不会报错", "提取出的永远是文本，参与计算前先用 VALUE 转换"]}, {"name": "RIGHT", "cat": "text", "cat_name": "文本函数", "syntax": "RIGHT(文本, [字符数])", "desc": "从右边取指定个数的字符", "examples": ["=RIGHT(A2, 1)", "=RIGHT(A2, 4)   → \"xlsx\"（注意不含点，如需含点取 5 位）"], "pitfalls": []}, {"name": "MID", "cat": "text", "cat_name": "文本函数", "syntax": "MID(文本, 起始位置, 字符数)", "desc": "从中间指定位置取字符", "examples": ["=MID(A2, 7, 8)   → \"19900101\"", "=MID(A2, 5, 4)   → \"2026\""], "pitfalls": ["起始位置从 1 开始计数，不是 0", "起始位置超出文本长度返回空文本，不报错"]}, {"name": "LEN", "cat": "text", "cat_name": "文本函数", "syntax": "LEN(文本)", "desc": "计算文本长度（几个字）", "examples": ["=LEN(A2)=11", "=LEFT(A2, LEN(A2)-1)"], "pitfalls": ["LEN 统计的是字符数，不是字节数；如需字节数用 LENB（中文按 2 计）", "尾随空格也会被计入，清洗数据时先 TRIM"]}, {"name": "CONCAT", "cat": "text", "cat_name": "文本函数", "syntax": "CONCAT(文本1, [文本2], ...)", "desc": "拼接多个文本（CONCATENATE 的升级版）", "examples": ["=CONCAT(A2, B2, C2)", "=CONCAT(A2:A5)"], "pitfalls": ["旧版本只有 CONCATENATE；新文件发给旧版用户会显示 `#NAME?`", "合并数字时数字格式会丢失（如日期变成序列号），先用 TEXT 格式化"]}, {"name": "TEXTJOIN", "cat": "text", "cat_name": "文本函数", "syntax": "TEXTJOIN(分隔符, 忽略空值, 文本1, [文本2], ...)", "desc": "用分隔符拼接，自动跳过空值", "examples": ["=TEXTJOIN(\"、\", TRUE, A2:A5)   → \"张三、李四、王五\"", "=TEXTJOIN(\"-\", TRUE, A2:D2)"], "pitfalls": ["分隔符也要加引号，如 `\",\"`", "结果超过 32767 字符上限会返回 `#VALUE!`"]}, {"name": "TEXT", "cat": "text", "cat_name": "文本函数", "syntax": "TEXT(数值, 格式代码)", "desc": "把数字按指定格式转成文本", "examples": ["=TEXT(A2, \"yyyy年m月d日\")   → \"2026年10月3日\"", "=TEXT(1234567, \"#,##0\")   → \"1,234,567\""], "pitfalls": ["格式代码的年月日必须用英文半角：yyyy、m、d；中文引号会导致格式失效", "结果为文本，不能直接参与计算"]}, {"name": "VALUE", "cat": "text", "cat_name": "文本函数", "syntax": "VALUE(文本)", "desc": "把文本转成数字", "examples": ["=SUM(VALUE(A2:A10))   → 数组公式思路，365 可直接用", "=VALUE(SUBSTITUTE(SUBSTITUTE(A2,\"¥\",\"\"),\",\",\"\"))   → 1200"], "pitfalls": ["文本含非数字字符（如空格）时返回 `#VALUE!`，先用 TRIM/SUBSTITUTE 清理", "空文本返回 `#VALUE!`，不是 0"]}, {"name": "UPPER", "cat": "text", "cat_name": "文本函数", "syntax": "UPPER(文本)", "desc": "转大写", "examples": ["=UPPER(A2)   → \"AB123\""], "pitfalls": []}, {"name": "LOWER", "cat": "text", "cat_name": "文本函数", "syntax": "LOWER(文本)", "desc": "转小写", "examples": ["=LOWER(A2)"], "pitfalls": []}, {"name": "TRIM", "cat": "text", "cat_name": "文本函数", "syntax": "TRIM(文本)", "desc": "去掉首尾和多余空格", "examples": ["=TRIM(A2)", "=EXACT(TRIM(A2), TRIM(B2))"], "pitfalls": ["只能处理英文半角空格（ASCII 32）；中文全角空格或不换行空格（CHAR(160)）要用 SUBSTITUTE 单独处理", "网页粘贴的数据常含 CHAR(160)，`SUBSTITUTE(A2, CHAR(160), \"\")` 先清掉"]}, {"name": "SUBSTITUTE", "cat": "text", "cat_name": "文本函数", "syntax": "SUBSTITUTE(文本, 旧文本, 新文本, [替换第几个])", "desc": "替换指定的文本", "examples": ["=SUBSTITUTE(A2, \"/\", \"-\")   → \"2026-10-03\"", "=SUBSTITUTE(A2, \",\", \";\", 2)"], "pitfalls": ["区分大小写；不区分大小写的需求先 UPPER 统一", "与 REPLACE 区别：SUBSTITUTE 按内容替换，REPLACE 按位置替换"]}, {"name": "REPLACE", "cat": "text", "cat_name": "文本函数", "syntax": "REPLACE(旧文本, 起始位置, 字符数, 新文本)", "desc": "按位置替换文本", "examples": ["=REPLACE(A2, 4, 4, \"****\")   → \"138****5678\"", "=REPLACE(A2, 1, 3, \"NEW\")"], "pitfalls": ["起始位置从 1 计数；超出长度时：起始位置过大返回原文本", "新文本长度可以与被替换的不同，结果总长度自动调整"]}, {"name": "FIND", "cat": "text", "cat_name": "文本函数", "syntax": "FIND(查找文本, 源文本, [起始位置])", "desc": "查找字符位置（区分大小写）", "examples": ["=FIND(\"@\", A2)", "=MID(A2, 1, FIND(\"@\", A2)-1)"], "pitfalls": ["找不到时返回 `#VALUE!`，常套 IFERROR 处理", "要忽略大小写用 SEARCH；要用通配符也用 SEARCH"]}, {"name": "SEARCH", "cat": "text", "cat_name": "文本函数", "syntax": "SEARCH(查找文本, 源文本, [起始位置])", "desc": "查找字符位置（不区分大小写，支持通配符）", "examples": ["=ISNUMBER(SEARCH(\"北京\", A2))", "=SEARCH(\"第?章\", A2)"], "pitfalls": ["查找文本本身含 `?` `*` 时需加 `~` 转义，如 `\"~?\"`", "找不到同样返回 `#VALUE!`"]}, {"name": "TEXTBEFORE", "cat": "text", "cat_name": "文本函数", "syntax": "TEXTBEFORE(文本, 分隔符, [第几个], [区分大小写], ...)", "desc": "取分隔符之前的文本（新函数）", "examples": ["=TEXTBEFORE(A2, \"@\")   → \"zhangsan\"", "=TEXTBEFORE(A2, \"-\", 2)   → \"2026-10\""], "pitfalls": ["旧版 Excel 没有此函数，会显示 `#NAME?`；替代方案用 LEFT+FIND 组合", "分隔符不存在时返回 `#N/A`"]}, {"name": "TEXTAFTER", "cat": "text", "cat_name": "文本函数", "syntax": "TEXTAFTER(文本, 分隔符, [第几个], ...)", "desc": "取分隔符之后的文本（新函数）", "examples": ["=TEXTAFTER(A2, \"@\")   → \"company.com\"", "=TEXTAFTER(A2, \"-\", -1)   → \"03\"（A2=\"2026-10-03\"）"], "pitfalls": []}, {"name": "TEXTSPLIT", "cat": "text", "cat_name": "文本函数", "syntax": "TEXTSPLIT(文本, 列分隔符, [行分隔符], ...)", "desc": "按分隔符拆分文本到多列（新函数）", "examples": ["=TEXTSPLIT(A2, \",\")", "=TEXTSPLIT(A2, \",\", \";\")"], "pitfalls": ["结果是动态数组，需要右侧/下方有足够的空单元格，否则 `#SPILL!`", "旧版本替代方案：用「数据-分列」功能"]}, {"name": "TODAY", "cat": "date", "cat_name": "日期函数", "syntax": "TODAY()", "desc": "返回今天的日期", "examples": ["=A2-TODAY()", "=IF(A2-TODAY()<=7, \"即将到期\", \"正常\")"], "pitfalls": ["每天打开文件都会变；需要固定日期请按 `Ctrl+;` 输入静态日期", "易失性函数，大量使用影响性能"]}, {"name": "NOW", "cat": "date", "cat_name": "日期函数", "syntax": "NOW()", "desc": "返回当前日期和时间", "examples": ["=NOW()", "=NOW()-TODAY()   → 设置单元格格式为\"时间\""], "pitfalls": ["同 TODAY，每次重算都会更新；固定时间戳用 `Ctrl+Shift+;`", "显示为日期时间格式，如只想看时间需改单元格格式"]}, {"name": "DATE", "cat": "date", "cat_name": "日期函数", "syntax": "DATE(年, 月, 日)", "desc": "用年月日组成日期", "examples": ["=DATE(A2, B2, C2)", "=DATE(2026, 13, 1)   → 2027-1-1"], "pitfalls": ["年份用 4 位数；两位数年份按 1930~2029 窗口解析，易混淆", "文本型年月日需先 VALUE 转换，否则可能 `#VALUE!`"]}, {"name": "TIME", "cat": "date", "cat_name": "日期函数", "syntax": "TIME(时, 分, 秒)", "desc": "用时分秒组成时间", "examples": ["=TIME(A2, B2, C2)   → 9:30", "=TIME(21,30,0)-TIME(18,0,0)   → 0.1458，格式设为 [h]:mm 显示 3:30"], "pitfalls": ["超过 24 小时的时长显示要用 `[h]:mm` 格式，否则只显示余数"]}, {"name": "YEAR", "cat": "date", "cat_name": "日期函数", "syntax": "YEAR(日期)", "desc": "提取年份", "examples": ["=YEAR(A2)"], "pitfalls": []}, {"name": "MONTH", "cat": "date", "cat_name": "日期函数", "syntax": "MONTH(日期)", "desc": "提取月份", "examples": ["=MONTH(A2)=MONTH(TODAY())"], "pitfalls": []}, {"name": "DAY", "cat": "date", "cat_name": "日期函数", "syntax": "DAY(日期)", "desc": "提取日", "examples": ["=DAY(A2)=1"], "pitfalls": []}, {"name": "HOUR", "cat": "date", "cat_name": "日期函数", "syntax": "HOUR(时间)", "desc": "提取小时", "examples": ["=HOUR(A2)>=9"], "pitfalls": []}, {"name": "MINUTE", "cat": "date", "cat_name": "日期函数", "syntax": "MINUTE(时间)", "desc": "提取分钟", "examples": ["=HOUR(A2)&\"小时\"&MINUTE(A2)&\"分\""], "pitfalls": ["HOUR/MINUTE 配合时注意：时长超过 24 小时 HOUR 只返回余数部分"]}, {"name": "DATEDIF", "cat": "date", "cat_name": "日期函数", "syntax": "DATEDIF(开始日期, 结束日期, 单位)", "desc": "计算两个日期的差（年/月/日）", "examples": ["=DATEDIF(A2, TODAY(), \"Y\")", "=DATEDIF(A2, TODAY(), \"Y\")&\"岁\"&DATEDIF(A2, TODAY(), \"YM\")&\"个月\""], "pitfalls": ["开始日期晚于结束日期返回 `#NUM!`", "这是\"隐藏函数\"，输入时无智能提示，但所有版本都可用", "单位必须英文大写双引号"]}, {"name": "EDATE", "cat": "date", "cat_name": "日期函数", "syntax": "EDATE(开始日期, 月数)", "desc": "返回 N 个月之前/之后的日期", "examples": ["=EDATE(A2, 6)", "=EDATE(A2, -3)"], "pitfalls": ["月末日期顺延：EDATE(2026-1-31, 1) 返回 2026-2-28（自动取月末）", "结果显示为序列号时，改单元格格式为日期"]}, {"name": "EOMONTH", "cat": "date", "cat_name": "日期函数", "syntax": "EOMONTH(开始日期, 月数)", "desc": "返回 N 个月之前/之后的月末日期", "examples": ["=EOMONTH(TODAY(), 0)", "=A2=EOMONTH(A2, 0)"], "pitfalls": []}, {"name": "WEEKDAY", "cat": "date", "cat_name": "日期函数", "syntax": "WEEKDAY(日期, [类型])", "desc": "返回星期几", "examples": ["=WEEKDAY(A2, 2)>5", "=CHOOSE(WEEKDAY(A2, 2), \"一\",\"二\",\"三\",\"四\",\"五\",\"六\",\"日\")"], "pitfalls": ["类型 1 和 2 的周日起点不同，跨表复用公式时务必统一"]}, {"name": "NETWORKDAYS", "cat": "date", "cat_name": "日期函数", "syntax": "NETWORKDAYS(开始日期, 结束日期, [节假日区域])", "desc": "计算两个日期间的工作日天数", "examples": ["=NETWORKDAYS(A2, B2)", "=NETWORKDAYS(A2, B2, D2:D10)"], "pitfalls": ["默认周末是周六日；中东等周五六休息的地区用 NETWORKDAYS.INTL", "节假日区域中的日期若为文本格式会被忽略"]}, {"name": "WORKDAY", "cat": "date", "cat_name": "日期函数", "syntax": "WORKDAY(开始日期, 天数, [节假日区域])", "desc": "返回 N 个工作日之后/之前的日期", "examples": ["=WORKDAY(A2, 10)", "=WORKDAY(A2, 10, D2:D10)"], "pitfalls": ["天数可为负数，表示往前推算", "结果为序列号时记得改日期格式"]}, {"name": "DATEVALUE", "cat": "date", "cat_name": "日期函数", "syntax": "DATEVALUE(日期文本)", "desc": "把文本转成日期", "examples": ["=DATEVALUE(\"2026-10-03\")", "=DATEVALUE(A2)-DATEVALUE(B2)"], "pitfalls": ["文本格式无法识别时返回 `#VALUE!`（如 \"10月3日\" 无年份可能失败）", "转换后需设为日期格式，否则显示为 45925 这样的数字"]}, {"name": "IF", "cat": "logic", "cat_name": "逻辑函数", "syntax": "IF(条件, 条件成立的值, 条件不成立的值)", "desc": "如果…就…否则…，最常用的逻辑判断", "examples": ["=IF(A2>=60, \"及格\", \"不及格\")", "=IF(B2>=100000, B2*0.05, B2*0.03)"], "pitfalls": ["文本结果要加英文双引号，数字不需要", "条件中误用 `=` 代替 `>=` 等；文本比较如 `A2=\"完成\"` 注意全半角一致", "嵌套 IF 括号不匹配是新手第一大坑，写完从最内层往外数括号"]}, {"name": "IFS", "cat": "logic", "cat_name": "逻辑函数", "syntax": "IFS(条件1, 值1, [条件2, 值2], ...)", "desc": "多条件判断（IF 的嵌套升级版）", "examples": ["=IFS(A2>=90, \"优秀\", A2>=80, \"良好\", A2>=60, \"及格\", TRUE, \"不及格\")", "=IFS(B2>=100, \"S\", B2>=80, \"A\", B2>=60, \"B\", TRUE, \"C\")"], "pitfalls": ["条件按顺序判断，范围有重叠时把最严格的放前面", "无任何条件成立返回 `#N/A`，记得加 TRUE 兜底", "旧版 Excel 不支持，发给别人前确认对方版本"]}, {"name": "AND", "cat": "logic", "cat_name": "逻辑函数", "syntax": "AND(条件1, [条件2], ...)", "desc": "并且：所有条件都成立才为真", "examples": ["=AND(B2>=100000, C2>=0.9)", "=IF(AND(A2>=60, B2>=60), \"双科及格\", \"需补考\")"], "pitfalls": ["AND 返回的是逻辑值 TRUE/FALSE，显示为英文；要显示中文需套 IF 转换", "参数中有错误值时整个返回错误值"]}, {"name": "OR", "cat": "logic", "cat_name": "逻辑函数", "syntax": "OR(条件1, [条件2], ...)", "desc": "或者：任一条件成立即为真", "examples": ["=OR(WEEKDAY(A2,2)>5, COUNTIF(D2:D10, A2)>0)"], "pitfalls": []}, {"name": "NOT", "cat": "logic", "cat_name": "逻辑函数", "syntax": "NOT(逻辑值)", "desc": "取反", "examples": ["=NOT(A2=\"完成\")   → 等价于 A2<>\"完成\"", "=NOT(COUNTIF(黑名单!A:A, A2)>0)"], "pitfalls": []}, {"name": "XOR", "cat": "logic", "cat_name": "逻辑函数", "syntax": "XOR(条件1, [条件2], ...)", "desc": "异或：奇数个真才为真", "examples": ["=XOR(A2, B2)   → 只勾一个时 TRUE，都勾或都不勾时 FALSE"], "pitfalls": ["三个条件时：成立 1 个或 3 个返回 TRUE，成立 2 个返回 FALSE（奇偶性），容易误解", "使用频率低，多数场景 AND/OR 更直观"]}, {"name": "IFERROR", "cat": "logic", "cat_name": "逻辑函数", "syntax": "IFERROR(公式, 出错时返回的值)", "desc": "出错时显示指定内容，告别 #N/A 满屏", "examples": ["=IFERROR(VLOOKUP(A2, 表!A:B, 2, 0), \"未找到\")", "=IFERROR(A2/B2, 0)"], "pitfalls": ["会掩盖所有错误（包括公式本身写错），调试阶段先不用，定稿再套", "只想捕获 `#N/A` 时用 IFNA 更精确，避免把 `#REF!` 等严重错误也藏起来"]}, {"name": "IFNA", "cat": "logic", "cat_name": "逻辑函数", "syntax": "IFNA(公式, 为#N/A时返回的值)", "desc": "只处理 #N/A 错误", "examples": ["=IFNA(VLOOKUP(A2, 表!A:B, 2, 0), \"\")"], "pitfalls": ["与 IFERROR 区别：IFNA 只处理 `#N/A`，这是它存在的意义", "2013 以下版本不支持"]}, {"name": "LET", "cat": "logic", "cat_name": "逻辑函数", "syntax": "LET(名称1, 值1, [名称2, 值2], ..., 计算式)", "desc": "给公式中的重复计算起个名字，提高可读性", "examples": ["=LET(提成, B2*0.05, IF(B2>100000, 提成*1.2, 提成))", "=LET(结果, XLOOKUP(A2, 表!A:A, 表!B:B), IF(ISNA(结果), \"无\", 结果))"], "pitfalls": ["名称不能与单元格地址冲突（如不能叫 A1）", "旧版 Excel 会 `#NAME?`，注意兼容性", "LET 的核心价值是性能+可读性，简单公式没必要用"]}, {"name": "SWITCH", "cat": "logic", "cat_name": "逻辑函数", "syntax": "SWITCH(表达式, 值1, 结果1, [值2, 结果2], ..., [默认值])", "desc": "多值匹配，比嵌套 IF 清晰", "examples": ["=SWITCH(A2, \"XS\", \"销售部\", \"JS\", \"技术部\", \"CW\", \"财务部\", \"未知部门\")", "=SWITCH(WEEKDAY(A2,2), 1,\"一\", 2,\"二\", 3,\"三\", 4,\"四\", 5,\"五\", 6,\"六\", \"日\")"], "pitfalls": ["SWITCH 只做**精确相等**匹配，不能写 `>=90` 这样的区间条件，区间用 IFS", "漏写默认值时无匹配返回 `#N/A`"]}, {"name": "VLOOKUP", "cat": "lookup", "cat_name": "查找引用", "syntax": "VLOOKUP(查找值, 表格区域, 返回第几列, [精确/模糊匹配])", "desc": "纵向查找：按关键字在表格中找对应值", "examples": ["=VLOOKUP(A2, 员工表!A:D, 2, 0)", "=VLOOKUP(B2, 税率表!A:B, 2, 1)"], "pitfalls": ["查不到返回 `#N/A`，套 IFERROR/IFNA 美化", "第 3 参数列号是相对区域的列数，不是工作表绝对列号", "插入列会导致列号错位，这是 VLOOKUP 最大硬伤，重要表格改用 INDEX+MATCH 或 XLOOKUP"]}, {"name": "HLOOKUP", "cat": "lookup", "cat_name": "查找引用", "syntax": "HLOOKUP(查找值, 表格区域, 返回第几行, [精确/模糊匹配])", "desc": "横向查找（VLOOKUP 的横版）", "examples": ["=HLOOKUP(A2, 数据!A1:M3, 3, 0)"], "pitfalls": []}, {"name": "XLOOKUP", "cat": "lookup", "cat_name": "查找引用", "syntax": "XLOOKUP(查找值, 查找区域, 返回区域, [未找到时], [匹配模式], [搜索模式])", "desc": "新一代查找：VLOOKUP 的完美替代品", "examples": ["=XLOOKUP(A2, 员工表!A:A, 员工表!B:B, \"查无此人\")", "=XLOOKUP(A2, 打卡!A:A, 打卡!C:C, , , -1)"], "pitfalls": ["查找区域与返回区域行数必须一致，否则 `#VALUE!`", "旧版 Excel 不支持，注意文件分发兼容性"]}, {"name": "INDEX", "cat": "lookup", "cat_name": "查找引用", "syntax": "INDEX(区域, 行号, [列号])", "desc": "按行列号取区域中的值", "examples": ["=INDEX(B2:D10, 3, 2)", "=INDEX(A2:D10, 3, 0)   → 返回第 3 行整行"], "pitfalls": ["行列号超出区域返回 `#REF!`", "单独用意义不大，威力在于与 MATCH 组合"]}, {"name": "MATCH", "cat": "lookup", "cat_name": "查找引用", "syntax": "MATCH(查找值, 查找区域, [匹配类型])", "desc": "找某个值在区域中的位置", "examples": ["=MATCH(\"李四\", A2:A100, 0)", "=INDEX(员工表!B:B, MATCH(A2, 员工表!A:A, 0))"], "pitfalls": ["找不到返回 `#N/A`", "匹配类型省略默认为 1（模糊），新手常忘记写 0 导致结果莫名其妙"]}, {"name": "OFFSET", "cat": "lookup", "cat_name": "查找引用", "syntax": "OFFSET(基准单元格, 下移行数, 右移列数, [高度], [宽度])", "desc": "以某个单元格为基准偏移取区域", "examples": ["=OFFSET(A1, 2, 3)", "=SUM(OFFSET(B2, 0, 0, COUNTA(A:A)-1, 1))"], "pitfalls": ["易失性函数，每次重算都触发，大量使用严重拖慢表格", "偏移超出工作表边界返回 `#REF!`", "动态区域需求优先考虑用表格结构化引用或 365 动态数组替代"]}, {"name": "INDIRECT", "cat": "lookup", "cat_name": "查找引用", "syntax": "INDIRECT(文本地址, [A1样式])", "desc": "把文本转成引用，实现动态引用", "examples": ["=INDIRECT(A2&\"!B2\")", "=SUM(INDIRECT(A2&\"!C2:C100\"))"], "pitfalls": ["易失性函数，性能杀手，能不用就不用", "引用的工作簿关闭后返回 `#REF!`（跨文件时）", "文本地址写错（如缺 `!`）返回 `#REF!`，调试困难"]}, {"name": "CHOOSE", "cat": "lookup", "cat_name": "查找引用", "syntax": "CHOOSE(序号, 值1, 值2, ...)", "desc": "按序号从列表中取值", "examples": ["=CHOOSE(WEEKDAY(A2,2), \"一\",\"二\",\"三\",\"四\",\"五\",\"六\",\"日\")", "=CHOOSE(A2, \"一季度\", \"二季度\", \"三季度\", \"四季度\")"], "pitfalls": ["序号超出范围返回 `#VALUE!`", "参数最多 254 个，超长列表用 VLOOKUP 建对照表更好"]}, {"name": "ROW", "cat": "lookup", "cat_name": "查找引用", "syntax": "ROW([单元格])", "desc": "返回行号", "examples": ["=ROW()-1   → 在第 2 行返回 1，第 3 行返回 2……", "=MOD(ROW(), 2)=0"], "pitfalls": []}, {"name": "COLUMN", "cat": "lookup", "cat_name": "查找引用", "syntax": "COLUMN([单元格])", "desc": "返回列号", "examples": ["=VLOOKUP(A2, 表!A:D, COLUMN(B1), 0)"], "pitfalls": []}, {"name": "TRANSPOSE", "cat": "lookup", "cat_name": "查找引用", "syntax": "TRANSPOSE(数组)", "desc": "行列转置", "examples": ["=TRANSPOSE(A2:A10)"], "pitfalls": ["365 中结果自动溢出，需保证目标区域为空，否则 `#SPILL!`", "旧版需先选中目标区域，按 Ctrl+Shift+Enter"]}, {"name": "SORT", "cat": "lookup", "cat_name": "查找引用", "syntax": "SORT(数组, [排序列], [升/降序], [按行/列])", "desc": "动态数组：自动排序（新函数）", "examples": ["=SORT(A2:B100, 2, -1)", "=TAKE(SORT(A2:B100, 2, -1), 5)"], "pitfalls": ["结果为动态数组，源数据变更自动重排，无需手动再排序", "多列排序需求用 SORTBY"]}, {"name": "FILTER", "cat": "lookup", "cat_name": "查找引用", "syntax": "FILTER(数组, 筛选条件, [无结果时显示])", "desc": "动态数组：按条件筛选（新函数）", "examples": ["=FILTER(A2:C100, A2:A100=\"销售部\")", "=FILTER(A2:C100, (A2:A100=\"销售部\")*(C2:C100>10000), \"无\")"], "pitfalls": ["无匹配且未设第 3 参数时返回 `#CALC!`", "条件区域行数必须与数组一致", "这是 365 最实用的函数之一，可替代 90% 的高级筛选场景"]}, {"name": "UNIQUE", "cat": "lookup", "cat_name": "查找引用", "syntax": "UNIQUE(数组, [按列], [只取唯一值])", "desc": "动态数组：去重取唯一值（新函数）", "examples": ["=UNIQUE(A2:A100)", "=SORT(UNIQUE(A2:A100))"], "pitfalls": ["空单元格会被当作一个 0 值参与去重，注意源数据先清理", "旧版替代方案：「数据-删除重复项」"]}, {"name": "COUNT", "cat": "stat", "cat_name": "统计函数", "syntax": "COUNT(数值1, [数值2], ...)", "desc": "计数：数一数有多少个数字", "examples": ["=COUNT(B2:B40)"], "pitfalls": []}, {"name": "COUNTA", "cat": "stat", "cat_name": "统计函数", "syntax": "COUNTA(数值1, [数值2], ...)", "desc": "计数：数一数有多少个非空单元格", "examples": ["=COUNTA(A2:A40)", "=ROWS(A2:A40)-COUNTA(B2:B40)"], "pitfalls": ["公式返回的 `\"\"` 空文本也会被计入（它不是真正的空）", "含空格的\"假空\"单元格也会被计入，先 TRIM 清理"]}, {"name": "COUNTBLANK", "cat": "stat", "cat_name": "统计函数", "syntax": "COUNTBLANK(区域)", "desc": "数一数有多少个空单元格", "examples": ["=COUNTBLANK(C2:C100)"], "pitfalls": ["同样会把 `\"\"` 空文本计为空，这是符合预期的", "COUNTBLANK 只能接单个区域，不能多区域"]}, {"name": "COUNTIF", "cat": "stat", "cat_name": "统计函数", "syntax": "COUNTIF(条件区域, 条件)", "desc": "条件计数：满足条件的有几个", "examples": ["=COUNTIF(B2:B40, \">=60\")", "=COUNTIF(A:A, \"张三\")"], "pitfalls": ["条件文本加引号：`\">=60\"`、`\"张三\"`；引用单元格则 `\"=\"&D1`", "通配符：`\"张*\"` 统计所有姓张的"]}, {"name": "COUNTIFS", "cat": "stat", "cat_name": "统计函数", "syntax": "COUNTIFS(条件区域1, 条件1, [条件区域2, 条件2], ...)", "desc": "多条件计数", "examples": ["=COUNTIFS(A2:A100, \"销售部\", B2:B100, \">=60\")", "=COUNTIFS(B2:B100, \">=80\", B2:B100, \"<90\")"], "pitfalls": ["各条件区域必须大小一致，否则 `#VALUE!`", "条件之间是\"且\"关系；要\"或\"关系用多个 COUNTIF 相加"]}, {"name": "AVERAGEIF", "cat": "stat", "cat_name": "统计函数", "syntax": "AVERAGEIF(条件区域, 条件, [平均区域])", "desc": "条件平均：只对满足条件的求平均", "examples": ["=AVERAGEIF(B2:B40, \">=60\")"], "pitfalls": []}, {"name": "AVERAGEIFS", "cat": "stat", "cat_name": "统计函数", "syntax": "AVERAGEIFS(平均区域, 条件区域1, 条件1, ...)", "desc": "多条件平均", "examples": ["=AVERAGEIFS(C2:C100, A2:A100, \"销售部\", B2:B100, \"男\")"], "pitfalls": ["与 AVERAGEIF 参数顺序不同（AVERAGEIFS 平均区域在前），照抄 AVERAGEIF 会错", "同样注意各区域大小一致"]}, {"name": "MAX", "cat": "stat", "cat_name": "统计函数", "syntax": "MAX(数值1, [数值2], ...)", "desc": "取最大值", "examples": ["=MAX(B2:B40)", "=MAX(IF(A2:A100=\"销售部\", C2:C100))   → 365 直接回车，旧版三键数组"], "pitfalls": []}, {"name": "MIN", "cat": "stat", "cat_name": "统计函数", "syntax": "MIN(数值1, [数值2], ...)", "desc": "取最小值", "examples": ["=MIN(B2:D2)"], "pitfalls": []}, {"name": "LARGE", "cat": "stat", "cat_name": "统计函数", "syntax": "LARGE(数组, k)", "desc": "取第 N 大的值", "examples": ["=LARGE(B2:B40, 2)", "=AVERAGE(LARGE(B2:B40, {1,2,3}))   → 365 动态数组直接求平均"], "pitfalls": ["k 大于数据个数返回 `#NUM!`", "有并列时：如两个 100 分，LARGE(…,1) 和 LARGE(…,2) 都是 100"]}, {"name": "SMALL", "cat": "stat", "cat_name": "统计函数", "syntax": "SMALL(数组, k)", "desc": "取第 N 小的值", "examples": ["=(SUM(B2:B40)-SMALL(B2:B40,1))/(COUNT(B2:B40)-1)"], "pitfalls": []}, {"name": "RANK", "cat": "stat", "cat_name": "统计函数", "syntax": "RANK(数值, 引用区域, [排序方式])", "desc": "排名", "examples": ["=RANK(B2, B$2:B$40, 0)", "=SUMPRODUCT((B$2:B$40>B2)/COUNTIF(B$2:B$40, B$2:B$40&\"\"))+1"], "pitfalls": ["忘记绝对引用是排名错误的第一原因", "并列时 RANK 会跳号（如两个第 1，则无第 2），这是标准行为不是 bug"]}, {"name": "MEDIAN", "cat": "stat", "cat_name": "统计函数", "syntax": "MEDIAN(数值1, [数值2], ...)", "desc": "取中位数", "examples": ["=MEDIAN(C2:C100)"], "pitfalls": []}, {"name": "MODE", "cat": "stat", "cat_name": "统计函数", "syntax": "MODE(数值1, [数值2], ...)", "desc": "取众数", "examples": ["=MODE(B2:B40)"], "pitfalls": ["无重复值时返回 `#N/A`", "多个并列众数只返回第一个；要全部用 MODE.MULT（365）"]}, {"name": "STDEV", "cat": "stat", "cat_name": "统计函数", "syntax": "STDEV(数值1, [数值2], ...)", "desc": "标准差（样本）", "examples": ["=STDEV(B2:B40)   → 值越大分数越参差不齐"], "pitfalls": ["样本 vs 总体：抽样数据用 STDEV.S（n-1），全体数据用 STDEVP/STDEV.P（n），用错结论偏差", "数据少于 2 个返回 `#DIV/0!`"]}, {"name": "VAR", "cat": "stat", "cat_name": "统计函数", "syntax": "VAR(数值1, [数值2], ...)", "desc": "方差（样本）", "examples": ["=VAR(C2:C100)"], "pitfalls": []}, {"name": "PMT", "cat": "fin", "cat_name": "财务函数", "syntax": "PMT(利率, 期数, 现值, [终值], [类型])", "desc": "计算每期还款额（房贷月供）", "examples": ["=PMT(4.5%/12, 20*12, 500000)   → -3187.38（负号表示支出）", "=ABS(PMT(4.5%/12, 240, 500000))"], "pitfalls": ["忘记把年利率除以 12、年数乘以 12，这是最常见的错误，结果会差一个数量级", "结果为负是正常的（代表现金流出），不是报错"]}, {"name": "FV", "cat": "fin", "cat_name": "财务函数", "syntax": "FV(利率, 期数, 每期付款, [现值], [类型])", "desc": "终值：现在存钱未来值多少", "examples": ["=FV(6%/12, 10*12, -2000)   → 327,095.13", "=FV(6%/12, 120, -2000, -100000)"], "pitfalls": ["每期付款符号：定投是支出，写 -2000，结果为正（ inflow 视角）；符号混乱是主要坑", "利率为 0 时公式退化为简单加总，函数仍可正常计算"]}, {"name": "PV", "cat": "fin", "cat_name": "财务函数", "syntax": "PV(利率, 期数, 每期付款, [终值], [类型])", "desc": "现值：未来的钱现在值多少", "examples": ["=PV(4%, 20, 50000)   → -679,516.31（负号表示为得到它现在要付出的价格）", "=PV(5%, 10, 0, 1000000)   → -613,913.25"], "pitfalls": []}, {"name": "NPV", "cat": "fin", "cat_name": "财务函数", "syntax": "NPV(利率, 现金流1, [现金流2], ...)", "desc": "净现值：评估投资值不值", "examples": ["=NPV(8%, 300000,300000,300000,300000,300000)-1000000   → 197,813（>0 值得投）"], "pitfalls": ["把期初投入也放进 NPV 参数是头号错误，会导致结果虚高一期", "各期现金流符号：投入为负、回报为正要统一"]}, {"name": "IRR", "cat": "fin", "cat_name": "财务函数", "syntax": "IRR(现金流数组, [预估值])", "desc": "内部收益率", "examples": ["=IRR(A2:A6)   → 约 15.2%", "=IRR(A2:A10, 0.1)"], "pitfalls": ["现金流必须**至少一正一负**，否则返回 `#NUM!`", "非常规现金流（符号多次变化）可能有多解或无解，结果需结合 NPV 判断", "默认预估 10%，不收敛时换预估值试试"]}, {"name": "RATE", "cat": "fin", "cat_name": "财务函数", "syntax": "RATE(期数, 每期付款, 现值, [终值], [类型], [预估值])", "desc": "利率", "examples": ["=RATE(240, -3187, 500000)*12   → 约 4.5%（年化）"], "pitfalls": ["付款与现值符号必须相反（一个流入一个流出），同号返回 `#NUM!`", "结果是每期利率，记得换算成年化"]}, {"name": "NPER", "cat": "fin", "cat_name": "财务函数", "syntax": "NPER(利率, 每期付款, 现值, [终值], [类型])", "desc": "期数", "examples": ["=NPER(4.5%/12, -5000, 500000)/12   → 约 10.9 年"], "pitfalls": ["每期还款额若小于每期利息（还不起本金），返回 `#NUM!`，这是合理的——永远还不清"]}, {"name": "SLN", "cat": "fin", "cat_name": "财务函数", "syntax": "SLN(原值, 残值, 使用年限)", "desc": "直线折旧法", "examples": ["=SLN(100000, 10000, 5)   → 18000"], "pitfalls": ["残值不能大于原值；年限为 0 返回 `#DIV/0!`"]}, {"name": "DB", "cat": "fin", "cat_name": "财务函数", "syntax": "DB(原值, 残值, 使用年限, 第几年, [首年月份数])", "desc": "余额递减折旧法", "examples": ["=DB(100000, 10000, 5, 1)   → 36900（比直线法的 18000 多）", "=DB(100000, 10000, 5, 3)"], "pitfalls": ["第几年不能超过使用年限，否则 `#NUM!`", "首年月份数省略默认 12；不满一年购入的设备要填实际月份数", "与 SLN 对比：DB 前期折旧快，适合技术更新快的设备"]}], "vba_keywords": [{"kw": "Dim", "cn": "声明变量", "code": "Dim name As String          ' 声明单个变量\nDim x As Long, y As Long    ' 一行声明多个\nDim arr(1 To 10) As Long    ' 声明数组\nDim ws As Worksheet         ' 声明对象变量", "note": "作用域：过程内部，只能在当前过程中使用。"}, {"kw": "Private", "cn": "模块级私有声明", "code": "Private counter As Long     ' 模块顶部，整个模块可用，外部模块不可见\n\nPrivate Sub Helper()\n    ' 私有过程，只能被本模块调用\nEnd Sub", "note": ""}, {"kw": "Public", "cn": "公开声明", "code": "Public appName As String    ' 整个工程可用\n\nPublic Sub Main()\n    ' 公开过程，可被其他模块调用，也可出现在 Alt+F8 宏列表\nEnd Sub", "note": ""}, {"kw": "Static", "cn": "静态变量（保持值）", "code": "Sub CountCalls()\n    Static times As Long   ' 只初始化一次\n    times = times + 1\n    MsgBox \"这是第 \" & times & \" 次调用\"\nEnd Sub", "note": "普通局部变量在过程结束後就销毁；`Static` 声明的变量在多次调用之间**保留上次的值**： 也可以让整个过程的变量都静态：`Static Sub CountCalls()`。"}, {"kw": "Const", "cn": "常量", "code": "Const TAX_RATE As Double = 0.13\nConst APP_NAME As String = \"报表系统\"\n' Const MAX_ROWS As Long = 1048576", "note": "常量在编译时确定，不能在运行中修改。魔法数字（税率、上限等）都应该用常量。"}, {"kw": "ReDim", "cn": "重定义动态数组", "code": "Dim arr() As Long\nReDim arr(1 To 10)              ' 分配空间\nReDim Preserve arr(1 To 20)     ' 扩大并保留原有数据", "note": "规则： - 只能用于动态数组（声明时不写上下界）。"}, {"kw": "Option Explicit", "cn": "强制变量声明", "code": "Option Explicit   ' 必须写在模块最顶部，所有代码之前", "note": "开启后，未经 `Dim` 的变量直接报错。防止拼写错误产生难以察觉的 bug。**所有模块都应该加。** ---"}, {"kw": "Select / Case", "cn": "多分支选择", "code": "Select Case score\n    Case Is >= 90\n        grade = \"A\"\n    Case 80 To 89\n        grade = \"B\"\n    Case 70, 71, 72\n        grade = \"C\"\n    Case Else\n        grade = \"D\"\nEnd Select", "note": "`Case` 的四种形式：`Is` 比较、`To` 范围、逗号多值、`Else` 兜底。"}, {"kw": "For / Next", "cn": "计数循环", "code": "For i = 1 To 10 Step 2    ' Step 可省略（默认1），可为负数\n    Debug.Print i\nNext i", "note": ""}, {"kw": "For Each", "cn": "集合遍历", "code": "Dim ws As Worksheet\nFor Each ws In Worksheets\n    Debug.Print ws.Name\nNext ws", "note": "注意：`For Each` 的循环变量**必须是 Variant 或对象类型**，不能是 `Long`。"}, {"kw": "Do / Loop", "cn": "条件循环", "code": "Do While 条件      ' 先判断，后执行（可能一次都不执行）\n    ' ...\nLoop\n\nDo Until 条件      ' 条件成立时退出\n    ' ...\nLoop\n\nDo                 ' 先执行，后判断（至少执行一次）\n    ' ...\nLoop While 条件\n\nDo\n    ' ...\nLoop Until 条件", "note": "四种形式："}, {"kw": "While / Wend", "cn": "旧式循环", "code": "While i < 10\n    i = i + 1\nWend", "note": "功能与 `Do While...Loop` 相同，是老式写法。新代码推荐用 `Do...Loop`。"}, {"kw": "GoTo", "cn": "跳转", "code": "Sub Demo()\n    On Error GoTo ErrHandler\n    ' ... 正常代码 ...\n    Exit Sub\n\nErrHandler:                  ' 标签以冒号结尾\n    MsgBox \"出错了：\" & Err.Description\nEnd Sub", "note": "现代 VBA 中 `GoTo` 主要用于错误处理。随意跳转会让代码难以维护，**不要**用它代替正常的条件分支。"}, {"kw": "Exit", "cn": "提前退出", "code": "Exit Sub        ' 退出 Sub 过程\nExit Function   ' 退出 Function 函数\nExit For        ' 跳出 For 循环\nExit Do         ' 跳出 Do 循环", "note": "常用于\"卫语句\"：先处理异常情况并退出，主逻辑保持平直："}, {"kw": "End", "cn": "终止程序", "code": "End   ' 立即终止所有代码执行，释放所有变量", "note": "> **警告**：`End` 会粗暴终止一切，不触发任何清理代码。正常结束过程用 `Exit Sub`，几乎用不到 `End`。 ---"}, {"kw": "Sub", "cn": "过程（做事）", "code": "Sub SayHello()\n    MsgBox \"你好\"\nEnd Sub\n\nSub Greet(name As String, Optional title As String = \"先生\")\n    MsgBox title & name & \"，你好\"\nEnd Sub", "note": ""}, {"kw": "Function", "cn": "函数（算值并返回）", "code": "Function CircleArea(r As Double) As Double\n    CircleArea = 3.14159 * r * r   ' 函数名 = 返回值\nEnd Function\n\n' 提前返回\nFunction SafeDiv(a As Double, b As Double) As Variant\n    If b = 0 Then\n        SafeDiv = \"除数不能为零\"\n        Exit Function\n    End If\n    SafeDiv = a / b\nEnd Function", "note": ""}, {"kw": "Call", "cn": "调用过程", "code": "Call Greet(\"张三\")   ' 显式调用，加括号\nGreet \"张三\"         ' 省略 Call，不加括号（效果相同）", "note": "> 省略 `Call` 是更常见的写法。注意：省略 Call 时参数不能加括号，否则会被当作求值。"}, {"kw": "ByVal / ByRef", "cn": "传值 vs 传址", "code": "Sub ByValDemo(ByVal x As Long)   ' 传值：复制一份，内部修改不影响外部\n    x = x + 10\nEnd Sub\n\nSub ByRefDemo(ByRef x As Long)   ' 传址：操作原变量，内部修改影响外部\n    x = x + 10\nEnd Sub\n\nSub Test()\n    Dim n As Long\n    n = 5\n    ByValDemo n\n    Debug.Print n   ' 还是 5\n    ByRefDemo n\n    Debug.Print n   ' 变成 15\nEnd Sub", "note": "**VBA 默认是 `ByRef`**（与大多数语言相反）。如果不希望过程修改传入的变量，显式写 `ByVal`。"}, {"kw": "Optional", "cn": "可选参数", "code": "Sub Print2D(rng As Range, Optional copies As Long = 1)\n    Dim i As Long\n    For i = 1 To copies\n        rng.PrintOut\n    Next i\nEnd Sub\n\nPrint2D Range(\"A1\")          ' copies 用默认值 1\nPrint2D Range(\"A1\"), 3       ' 打印 3 份", "note": "规则：`Optional` 参数必须有默认值，且必须放在参数列表最后。"}, {"kw": "ParamArray", "cn": "可变数量参数", "code": "Function SumAll(ParamArray nums() As Variant) As Double\n    Dim n As Variant, total As Double\n    For Each n In nums\n        total = total + n\n    Next n\n    SumAll = total\nEnd Function\n\nDebug.Print SumAll(1, 2, 3)          ' 6\nDebug.Print SumAll(10, 20, 30, 40)   ' 100", "note": "`ParamArray` 只能有一个，必须是最后一个参数，类型必须是 `Variant` 数组。 ---"}, {"kw": "Set", "cn": "对象赋值", "code": "Dim ws As Worksheet\nSet ws = ThisWorkbook.Worksheets(\"数据\")   ' 对象必须用 Set\n\nDim n As Long\nn = 100                                    ' 普通变量直接 =", "note": "忘记 `Set` 会报运行时错误 424\"需要对象\"。"}, {"kw": "New", "cn": "创建对象实例", "code": "Dim dict As Object\nSet dict = New Scripting.Dictionary   ' 需要引用 Microsoft Scripting Runtime\n\n' 或者声明时直接 New（不推荐：每次使用都检查是否已创建，有开销）\nDim dict2 As New Scripting.Dictionary", "note": ""}, {"kw": "Nothing", "cn": "空对象 / 释放对象", "code": "Dim ws As Worksheet\nSet ws = Nothing   ' 释放对象引用\n\n' 判断对象是否为空\nIf ws Is Nothing Then\n    MsgBox \"对象未初始化\"\nEnd If", "note": "对象比较必须用 `Is` / `Is Not`，不能用 `=`。"}, {"kw": "With", "cn": "对象简化书写", "code": "With Range(\"A1\")\n    .Value = \"标题\"\n    .Font.Bold = True\n    .Font.Size = 16\n    .Interior.Color = RGB(255, 255, 0)\nEnd With", "note": ""}, {"kw": "Me", "cn": "当前对象自身", "code": "' 在 Sheet1 的代码模块中\nPrivate Sub Worksheet_Change(ByVal Target As Range)\n    Me.Range(\"B1\").Value = Now   ' Me = Sheet1 本身\nEnd Sub\n\n' 在用户窗体中\nPrivate Sub UserForm_Click()\n    Me.Caption = \"被点了\"        ' Me = 这个窗体\nEnd Sub", "note": "在**工作表/工作簿模块**或**用户窗体**代码中，`Me` 指代当前对象： ---"}, {"kw": "On Error", "cn": "错误处理开关", "code": "' 1. 出错时跳转到标签\nSub Demo1()\n    On Error GoTo ErrHandler\n    ' ... 可能出错的代码 ...\n    Exit Sub\nErrHandler:\n    MsgBox \"出错：\" & Err.Description\nEnd Sub\n\n' 2. 出错时继续执行下一行（用于可预期的、要逐个处理的情况）\nSub Demo2()\n    On Error Resume Next\n    Workbooks(\"不存在.xlsx\").Close   ' 如果文件没打开也不报错\n    On Error GoTo 0                  ' 恢复默认（报错即中断）\nEnd Sub\n\n' 3. 出错时跳转到下一行（Resume Next 的标签版）\nSub Demo3()\n    On Error GoTo SkipIt\n    ' ...\nSkipIt:\n    Resume Next\nEnd Sub", "note": "三种模式： > `On Error Resume Next` 是双刃剑：它会**吞掉所有错误**。使用后必须立即检查 `Err.Number`，并尽快用 `On Error GoTo 0` 恢复。"}, {"kw": "Resume", "cn": "恢复执行", "code": "Sub Demo()\n    On Error GoTo Handler\n    x = 1 / 0\n    Exit Sub\nHandler:\n    MsgBox \"除数不能为零\"\n    Resume Next        ' 从出错的下一行继续\n    ' Resume           ' 从出错的那一行重试\n    ' Resume ExitHere   ' 跳转到指定标签\nExitHere:\nEnd Sub", "note": ""}, {"kw": "Err", "cn": "错误对象", "code": "Sub ErrDemo()\n    On Error Resume Next\n    Dim n As Long\n    n = \"abc\"                  ' 类型不匹配错误\n\n    If Err.Number <> 0 Then\n        Debug.Print \"错误号：\" & Err.Number         ' 13\n        Debug.Print \"错误描述：\" & Err.Description  ' 类型不匹配\n        Debug.Print \"出错过程：\" & Err.Source\n        Err.Clear                  ' 清除错误状态\n    End If\n    On Error GoTo 0\nEnd Sub", "note": "常见错误号：13（类型不匹配）、9（下标越界）、424（需要对象）、91（对象变量未设置）、1004（Excel 内部错误）。 ---"}, {"kw": "And / Or / Not", "cn": "逻辑运算", "code": "If age >= 18 And age <= 60 Then MsgBox \"劳动年龄\"\nIf city = \"北京\" Or city = \"上海\" Then MsgBox \"一线城市\"\nIf Not done Then MsgBox \"还没完成\"", "note": "注意 VBA 没有短路求值：`If A And B` 中 A、B 都会被计算。"}, {"kw": "True / False", "cn": "布尔字面量", "code": "Dim done As Boolean\ndone = True\nIf done = False Then   ' 也可以写 If Not done Then", "note": ""}, {"kw": "Type", "cn": "自定义数据类型", "code": "' 模块顶部定义\nType Employee\n    Name As String\n    Age As Long\n    Salary As Double\nEnd Type\n\nSub UseType()\n    Dim emp As Employee\n    emp.Name = \"张三\"\n    emp.Age = 30\n    emp.Salary = 8000\n    MsgBox emp.Name & \"的工资是\" & emp.Salary\nEnd Sub", "note": ""}, {"kw": "Enum", "cn": "枚举", "code": "' 模块顶部定义\nEnum WeekDay\n    星期一 = 1\n    星期二 = 2\n    星期三 = 3\nEnd Enum\n\nSub UseEnum()\n    Dim d As WeekDay\n    d = 星期三\n    MsgBox d   ' 显示 3\nEnd Sub", "note": "给一组相关的常量起名字，提高可读性："}], "vba_examples": [{"title": "实例 1：批量重命名工作表", "code": "Option Explicit\n\nSub BatchRenameSheets()\n    Dim ws As Worksheet\n    Dim i As Long\n    Dim newName As String\n\n    Application.DisplayAlerts = False   ' 重命名冲突时不弹窗，由代码处理\n    i = 1\n    For Each ws In ThisWorkbook.Worksheets\n        newName = \"部门_\" & Format(i, \"00\")   ' 部门_01、部门_02...\n        On Error Resume Next                  ' 重名时跳过\n        ws.Name = newName\n        If Err.Number <> 0 Then\n            Debug.Print \"跳过重名：\" & ws.Name\n            Err.Clear\n        End If\n        On Error GoTo 0\n        i = i + 1\n    Next ws\n    Application.DisplayAlerts = True\n\n    MsgBox \"重命名完成，共处理 \" & (i - 1) & \" 个工作表\"\nEnd Sub", "explain": "把工作簿中所有工作表按\"部门_序号\"规则重命名。 **要点**：`Format(i, \"00\")` 把数字格式化为两位数；重名会报错，用错误处理跳过。 ---"}, {"title": "实例 2：合并多个工作簿", "code": "Sub MergeWorkbooks()\n    Dim folder As String\n    Dim fileName As String\n    Dim wb As Workbook\n    Dim targetRow As Long\n    Dim srcRows As Long\n\n    ' 让用户选择文件夹\n    With Application.FileDialog(msoFileDialogFolderPicker)\n        .Title = \"选择要合并的文件夹\"\n        If .Show <> -1 Then Exit Sub\n        folder = .SelectedItems(1) & \"\\\"\n    End With\n\n    Application.ScreenUpdating = False\n    Application.DisplayAlerts = False\n\n    targetRow = 2   ' 目标表第1行是表头，从第2行开始写\n    fileName = Dir(folder & \"*.xlsx\")\n\n    Do While fileName <> \"\"\n        ' 跳过当前工作簿自己\n        If folder & fileName <> ThisWorkbook.FullName Then\n            Set wb = Workbooks.Open(folder & fileName, ReadOnly:=True)\n            ' 找到源表最后一行\n            srcRows = wb.Worksheets(1).Cells(Rows.Count, 1).End(xlUp).Row\n            If srcRows >= 2 Then\n                wb.Worksheets(1).Range(\"A2:Z\" & srcRows).Copy _\n                    Destination:=ThisWorkbook.Worksheets(1).Cells(targetRow, 1)\n                targetRow = targetRow + (srcRows - 1)\n            End If\n            wb.Close SaveChanges:=False\n        End If\n        fileName = Dir()   ' 下一个文件\n    Loop\n\n    Application.ScreenUpdating = True\n    Application.DisplayAlerts = True\n    MsgBox \"合并完成，共写入 \" & (targetRow - 2) & \" 行数据\"\nEnd Sub", "explain": "把指定文件夹下所有 Excel 文件的第一个工作表数据合并到当前工作簿（假设表头都在第 1 行，数据从第 2 行开始）。 **要点**：`Dir()` 函数遍历文件夹；`FileDialog` 让用户选文件夹；记得 `ReadOnly:=True` 打开和用完关闭。 ---"}, {"title": "实例 3：自动生成报表（带格式）", "code": "Sub GenerateReport()\n    Dim src As Worksheet, rpt As Worksheet\n    Dim lastRow As Long, i As Long\n    Dim total As Double\n\n    Set src = ThisWorkbook.Worksheets(\"数据源\")\n\n    ' 删除旧报表（如果存在）\n    On Error Resume Next\n    Application.DisplayAlerts = False\n    ThisWorkbook.Worksheets(\"报表\").Delete\n    Application.DisplayAlerts = True\n    On Error GoTo 0\n\n    Set rpt = ThisWorkbook.Worksheets.Add(After:=src)\n    rpt.Name = \"报表\"\n\n    ' --- 标题区 ---\n    With rpt.Range(\"A1:D1\")\n        .Merge\n        .Value = \"2026年销售报表（\" & Format(Date, \"yyyy-mm-dd\") & \" 生成）\"\n        .Font.Size = 16\n        .Font.Bold = True\n        .HorizontalAlignment = xlCenter\n        .Interior.Color = RGB(0, 112, 192)\n        .Font.Color = RGB(255, 255, 255)\n    End With\n    rpt.Range(\"A1\").RowHeight = 30\n\n    ' --- 表头 ---\n    Dim headers As Variant\n    headers = Array(\"产品\", \"数量\", \"单价\", \"金额\")\n    For i = 0 To 3\n        With rpt.Cells(3, i + 1)\n            .Value = headers(i)\n            .Font.Bold = True\n            .Interior.Color = RGB(217, 217, 217)\n            .HorizontalAlignment = xlCenter\n        End With\n    Next i\n\n    ' --- 数据区 ---\n    lastRow = src.Cells(Rows.Count, 1).End(xlUp).Row\n    total = 0\n    For i = 2 To lastRow\n        rpt.Cells(i + 2, 1).Value = src.Cells(i, 1).Value   ' 产品\n        rpt.Cells(i + 2, 2).Value = src.Cells(i, 2).Value   ' 数量\n        rpt.Cells(i + 2, 3).Value = src.Cells(i, 3).Value   ' 单价\n        rpt.Cells(i + 2, 4).Formula = \"=B\" & (i + 2) & \"*C\" & (i + 2)  ' 金额公式\n        total = total + src.Cells(i, 2).Value * src.Cells(i, 3).Value\n    Next i\n\n    ' --- 汇总行 ---\n    Dim sumRow As Long\n    sumRow = lastRow + 3\n    With rpt.Range(\"A\" & sumRow & \":C\" & sumRow)\n        .Merge\n        .Value = \"合计\"\n        .Font.Bold = True\n        .HorizontalAlignment = xlRight\n    End With\n    rpt.Cells(sumRow, 4).Value = total\n    rpt.Cells(sumRow, 4).Font.Bold = True\n    rpt.Cells(sumRow, 4).NumberFormat = \"#,##0.00\"\n\n    ' --- 收尾 ---\n    rpt.Range(\"A3:D\" & sumRow).BorderAround LineStyle:=xlContinuous, Weight:=xlMedium\n    rpt.Range(\"A3:D\" & sumRow).Borders.LineStyle = xlContinuous\n    rpt.Columns(\"A:D\").AutoFit\n\n    MsgBox \"报表已生成，共 \" & (lastRow - 1) & \" 条数据，合计 \" & Format(total, \"#,##0.00\")\nEnd Sub", "explain": "从\"数据源\"表读取销售数据，生成带标题、格式、汇总行的\"报表\"表。 **要点**：先删旧表再建新表；金额列用公式而不是写死值，源数据变了报表自动更新。 ---"}, {"title": "实例 4：查找替换增强版", "code": "Sub BatchReplace()\n    Dim mapWs As Worksheet, dataWs As Worksheet\n    Dim lastMap As Long, i As Long\n    Dim findStr As String, replStr As String\n    Dim count As Long, totalCount As Long\n\n    ' 对照表：A列=查找内容，B列=替换为\n    Set mapWs = ThisWorkbook.Worksheets(\"对照表\")\n    Set dataWs = ThisWorkbook.Worksheets(\"数据\")\n\n    lastMap = mapWs.Cells(Rows.Count, 1).End(xlUp).Row\n    totalCount = 0\n\n    Application.ScreenUpdating = False\n    For i = 2 To lastMap\n        findStr = CStr(mapWs.Cells(i, 1).Value)\n        replStr = CStr(mapWs.Cells(i, 2).Value)\n        If findStr <> \"\" Then\n            ' 先数有多少个，再替换\n            count = Application.WorksheetFunction.CountIf(dataWs.UsedRange, \"*\" & findStr & \"*\")\n            dataWs.UsedRange.Replace What:=findStr, Replacement:=replStr, _\n                LookAt:=xlPart, MatchCase:=False\n            totalCount = totalCount + count\n            Debug.Print findStr & \" -> \" & replStr & \"（约\" & count & \"处）\"\n        End If\n    Next i\n    Application.ScreenUpdating = True\n\n    MsgBox \"批量替换完成，共处理 \" & (lastMap - 1) & \" 组规则\"\nEnd Sub", "explain": "普通查找替换一次只能处理一个词。这个版本批量处理\"对照表\"中的多组替换，并报告替换次数。 **要点**：`Replace` 的 `LookAt:=xlPart` 表示部分匹配；`CountIf` 配通配符 `*` 先统计。 ---"}, {"title": "实例 5：数据去重", "code": "Sub RemoveDuplicates()\n    Dim ws As Worksheet\n    Dim lastRow As Long\n    Dim beforeCount As Long\n\n    Set ws = ActiveSheet\n    lastRow = ws.Cells(Rows.Count, 1).End(xlUp).Row\n    beforeCount = lastRow\n\n    If lastRow < 2 Then\n        MsgBox \"没有数据可处理\"\n        Exit Sub\n    End If\n\n    ' 按A列去重（多列去重传数组，如 Array(1, 2) 表示按A、B列组合去重）\n    ws.Range(\"A1:Z\" & lastRow).RemoveDuplicates Columns:=1, Header:=xlYes\n\n    lastRow = ws.Cells(Rows.Count, 1).End(xlUp).Row\n    MsgBox \"去重完成，删除了 \" & (beforeCount - lastRow) & \" 行重复数据\"\nEnd Sub", "explain": "删除指定列的重复行，保留第一次出现的，并报告删除了多少行。 **要点**：`RemoveDuplicates` 是 Excel 2007+ 的内置方法，比自己写循环快得多；`Header:=xlYes` 表示第一行是表头不参与去重。 ---"}, {"title": "实例 6：批量插入图片", "code": "Sub BatchInsertPictures()\n    Dim folder As String\n    Dim fileName As String\n    Dim pic As Picture\n    Dim row As Long\n    Dim ext As String\n\n    With Application.FileDialog(msoFileDialogFolderPicker)\n        .Title = \"选择图片文件夹\"\n        If .Show <> -1 Then Exit Sub\n        folder = .SelectedItems(1) & \"\\\"\n    End With\n\n    Application.ScreenUpdating = False\n    row = 2\n    ' A1写表头\n    Range(\"A1\").Value = \"图片\"\n    Range(\"B1\").Value = \"文件名\"\n\n    fileName = Dir(folder & \"*.*\")\n    Do While fileName <> \"\"\n        ext = LCase(Right(fileName, 4))\n        If ext = \".jpg\" Or ext = \"jpeg\" Or ext = \".png\" Or ext = \".bmp\" Or ext = \".gif\" Then\n            ' 插入图片\n            Set pic = ActiveSheet.Pictures.Insert(folder & fileName)\n            With pic\n                .Top = Cells(row, 1).Top + 2\n                .Left = Cells(row, 1).Left + 2\n                .Height = 80\n                ' 按比例缩放宽度\n                .Width = .Width * (80 / .Height)\n                .Placement = xlMoveAndSize   ' 图片随单元格移动和缩放\n            End With\n            Cells(row, 1).RowHeight = 84\n            Cells(row, 2).Value = fileName\n            row = row + 1\n        End If\n        fileName = Dir()\n    Loop\n\n    Columns(\"A\").ColumnWidth = 20\n    Application.ScreenUpdating = True\n    MsgBox \"共插入 \" & (row - 2) & \" 张图片\"\nEnd Sub", "explain": "把文件夹中的图片按文件名顺序插入到工作表，每行一张，自动调整行高列宽。 **要点**：`Pictures.Insert` 插入图片；设置 `.Placement = xlMoveAndSize` 让图片跟随单元格；先定高度再按比例算宽度避免变形。 ---"}, {"title": "实例 7：发送邮件（Outlook）", "code": "Sub SendMailViaOutlook()\n    Dim olApp As Object\n    Dim olMail As Object\n    Dim ws As Worksheet\n    Dim lastRow As Long, i As Long\n    Dim toAddr As String, subject As String, body As String\n    Dim attachPath As String\n    Dim sentCount As Long\n\n    ' 收件人清单：A列=邮箱，B列=姓名\n    Set ws = ThisWorkbook.Worksheets(\"收件人\")\n    lastRow = ws.Cells(Rows.Count, 1).End(xlUp).Row\n    attachPath = ThisWorkbook.Path & \"\\报表.pdf\"   ' 附件路径（需提前存在）\n\n    ' 后期绑定：不需要引用 Outlook 库，换电脑也能跑\n    On Error Resume Next\n    Set olApp = GetObject(, \"Outlook.Application\")\n    If olApp Is Nothing Then\n        Set olApp = CreateObject(\"Outlook.Application\")\n    End If\n    On Error GoTo 0\n\n    If olApp Is Nothing Then\n        MsgBox \"未检测到 Outlook，请先安装并配置\"\n        Exit Sub\n    End If\n\n    sentCount = 0\n    For i = 2 To lastRow\n        toAddr = Trim(CStr(ws.Cells(i, 1).Value))\n        If toAddr Like \"*@*\" Then   ' 简单校验邮箱格式\n            Set olMail = olApp.CreateItem(0)   ' 0 = 邮件\n            With olMail\n                .To = toAddr\n                .Subject = \"2026年销售报表\"\n                .Body = ws.Cells(i, 2).Value & \"，你好：\" & vbCrLf & vbCrLf _\n                      & \"附件是本月销售报表，请查收。\" & vbCrLf & vbCrLf _\n                      & \"报表系统（自动发送）\"\n                If Dir(attachPath) <> \"\" Then\n                    .Attachments.Add attachPath\n                End If\n                .Send   ' 改成 .Display 可先预览不直接发\n            End With\n            sentCount = sentCount + 1\n        End If\n    Next i\n\n    Set olMail = Nothing\n    Set olApp = Nothing\n    MsgBox \"发送完成，共发送 \" & sentCount & \" 封\"\nEnd Sub", "explain": "把报表作为附件，用 Outlook 自动发送给收件人列表。 **要点**： - 用 `CreateObject(\"Outlook.Application\")` 后期绑定，不用手动加引用。 - 测试时先用 `.Display` 预览，确认无误再改 `.Send`。"}, {"title": "实例 8：自定义函数（UDF）", "code": "Option Explicit\n\n' 1. 提取身份证中的出生日期\n' 用法：=GetBirth(A1)\nFunction GetBirth(idCard As String) As String\n    Dim s As String\n    s = Trim(idCard)\n    If Len(s) = 18 Then\n        GetBirth = Mid(s, 7, 4) & \"-\" & Mid(s, 11, 2) & \"-\" & Mid(s, 13, 2)\n    ElseIf Len(s) = 15 Then\n        GetBirth = \"19\" & Mid(s, 7, 2) & \"-\" & Mid(s, 9, 2) & \"-\" & Mid(s, 11, 2)\n    Else\n        GetBirth = \"身份证号无效\"\n    End If\nEnd Function\n\n' 2. 判断是否为周末\n' 用法：=IsWeekend(A1)\nFunction IsWeekend(d As Date) As Boolean\n    Dim w As Long\n    w = Weekday(d, vbMonday)   ' 以周一为一周开始\n    IsWeekend = (w >= 6)\nEnd Function\n\n' 3. 人民币大写转换\n' 用法：=RMBUpper(A1)\nFunction RMBUpper(amount As Double) As String\n    Dim digits As Variant, units As Variant\n    Dim s As String, i As Long, result As String\n    Dim n As Long, digit As Long\n\n    digits = Array(\"\", \"壹\", \"贰\", \"叁\", \"肆\", \"伍\", \"陆\", \"柒\", \"捌\", \"玖\")\n    units = Array(\"\", \"拾\", \"佰\", \"仟\")\n\n    If amount < 0 Or amount >= 100000 Then\n        RMBUpper = \"超出范围\"\n        Exit Function\n    End If\n\n    n = Int(amount)\n    s = CStr(n)\n    result = \"\"\n    For i = 1 To Len(s)\n        digit = Val(Mid(s, i, 1))\n        If digit <> 0 Then\n            result = result & digits(digit) & units(Len(s) - i)\n        Else\n            ' 避免连续多个零\n            If Right(result, 1) <> \"零\" And i < Len(s) Then\n                result = result & \"零\"\n            End If\n        End If\n    Next i\n\n    ' 处理小数部分\n    Dim cents As Long\n    cents = Round((amount - n) * 100)\n    If cents = 0 Then\n        result = result & \"元整\"\n    Else\n        Dim jiao As Long, fen As Long\n        jiao = cents \\ 10\n        fen = cents Mod 10\n        result = result & \"元\"\n        If jiao > 0 Then result = result & digits(jiao) & \"角\"\n        If fen > 0 Then result = result & digits(fen) & \"分\"\n    End If\n\n    ' 清理多余的零\n    Do While InStr(result, \"零零\") > 0\n        result = Replace(result, \"零零\", \"零\")\n    Loop\n    result = Replace(result, \"零元\", \"元\")\n    If Left(result, 1) = \"零\" Then result = Mid(result, 2)\n\n    RMBUpper = result\nEnd Function", "explain": "写在标准模块中的 `Function` 可直接在单元格公式中使用。下面是三个实用的自定义函数。 **UDF 注意事项**： 1. 必须写在**标准模块**（不是工作表模块/Sheet 代码区）。 2. 不能修改其他单元格的值/格式，只能返回一个值（可以返回数组形成动态数组）。"}], "shortcuts": [{"cat": "导航（14 个）", "keys": [{"key": "`Ctrl + 方向键`", "desc": "跳到当前数据区域边缘（连续按穿越整张表）", "hot": true}, {"key": "`Ctrl + Home`", "desc": "回到 A1", "hot": true}, {"key": "`Ctrl + End`", "desc": "跳到已用区域右下角", "hot": true}, {"key": "`PageUp / PageDown`", "desc": "上/下翻一屏", "hot": false}, {"key": "`Alt + PageUp / PageDown`", "desc": "左/右翻一屏", "hot": false}, {"key": "`Ctrl + PageUp / PageDown`", "desc": "上一个/下一个工作表", "hot": false}, {"key": "`F5` 或 `Ctrl + G`", "desc": "定位（跳到指定单元格/区域）", "hot": false}, {"key": "`Ctrl + Backspace`", "desc": "滚动回当前活动单元格（看丢了时用）", "hot": false}, {"key": "`Tab / Shift+Tab`", "desc": "右/左移一格", "hot": false}, {"key": "`Enter / Shift+Enter`", "desc": "下/上移一格", "hot": false}, {"key": "`Home`", "desc": "回到本行 A 列", "hot": false}, {"key": "`Ctrl + F6`", "desc": "在多个打开的工作簿间切换", "hot": false}]}, {"cat": "选择（14 个）", "keys": [{"key": "`Ctrl + A`", "desc": "全选（在数据区按一次选当前区域，按两次选全表）", "hot": true}, {"key": "`Shift + 方向键`", "desc": "按格扩展选区", "hot": true}, {"key": "`Ctrl + Shift + 方向键`", "desc": "扩展到数据区域边缘（选整列数据神器）", "hot": true}, {"key": "`Ctrl + 空格`", "desc": "选中整列", "hot": true}, {"key": "`Shift + 空格`", "desc": "选中整行", "hot": true}, {"key": "`Ctrl + Shift + *`", "desc": "选中当前数据区域（`*` 是数字 8 上档键）", "hot": false}, {"key": "`Shift + Ho  false}, {"key": "`Alt + E, S, V`", "desc": "选择性粘贴为数值（去公式留结果）", "hot": false}, {"key": "`F1`", "desc": "帮助", "hot": false}, {"key": "`Alt`", "desc": "显示功能区快捷键提示（按字母操作菜单，不用鼠标）", "hot": false}, {"key": "`Ctrl + 鼠标滚轮`", "desc": "缩放工作表", "hot": false}]}], "advanced": [{"id": "pivottable", "title": "数据透视表", "sections": [{"title": "1. 为什么用数据透视表", "body": "想象你有一张 5000 行的销售明细：日期、销售员、产品、金额。老板问：\"每个销售员每个月的销售额是多少？\"\n- 不用透视表：写一堆 SUMIFS，还要手动列出所有销售员和月份，容易漏。\n- 用透视表：**拖三下鼠标，3 秒出结果**。源数据增删行后点一下\"刷新\"即可更新。\n核心思想：**把\"分组+聚合\"这个动作交给 Excel**，你只负责告诉它\"按什么分组、对什么求和\"。"}, {"title": "2. 创建步骤", "body": "1. 点击源数据区域任意单元格（确保数据是规范的二维表：第一行是标题行，无合并单元格、无空行空列）。\n2. 「插入」→「数据透视表」。\n3. 选择放置位置：建议选\"新工作表\"，报表和源数据分开更清爽。\n4. 右侧出现「数据透视表字段」窗格，开始拖字段。\n> 数据规范是透视表好用的前提：一列只放一种含义的数据，日期列全是日期，不要出现\"合计\"行混在明细里。"}, {"title": "3. 四个区域详解", "body": "操作要点：\n- 同一字段可以拖到多个区域（如\"日期\"同时拖到行和筛选器）。\n- 拖错了直接把字段拖出窗格即可移除。\n- 字段顺序决定层级：行区域里\"年份\"在上、\"月份\"在下，就是先按年再按月展开。"}, {"title": "4. 值汇总方式", "body": "默认对数字字段\"求和\"，对文本字段\"计数\"。右键值字段 →「值字段设置」可切换：\n**显示方式**（同一对话框的「值显示方式」选项卡，更实用）：\n- **占总和的百分比**：每个销售员占总销售额的比例。\n- **父行汇总的百分比**：某产品占其所属类别的比例。\n- **差异**：本月 vs 上月的差额（需配合日期分组）。\n- **差异百分比**：环比增长率——做月报的神器。"}, {"title": "5. 分组", "body": "### 日期分组\n右键行区域的日期字段 →「组合」：\n- 按月：选\"月\"，自动按年月分组。\n- 按季度+年：同时勾选\"季度\"和\"年\"。\n- 按周：选\"日\"，天数填 7。\n### 数字分组\n右键数字字段 →「组合」：如把年龄按 10 岁一段分组（起始 20，终止 60，步长 10），快速做年龄段分布。"}, {"title": "6. 切片器与时间线", "body": "- **切片器**：「数据透视表分析」→「插入切片器」→ 勾选字段（如\"产品类别\"）。生成一排可点击的按钮，点选即筛选，比下拉框直观，适合做仪表盘。\n- **时间线**：专门用于日期字段，拖动滑块筛选时间段。\n- 一个切片器可以同时控制**多个**透视表：右键切片器 →「报表连接」，勾选其他透视表——做联动仪表盘的核心技巧。"}]}, {"id": "array-formulas", "title": "数组公式", "sections": [{"title": "1. 先理解\"数组\"是什么", "body": "数组就是\"一串值\"。`{1,2,3}` 是横向数组，`{1;2;3}` 是纵向数组（分号换行）。Excel 公式本来就是按数组思维设计的：\n[代码示例]\n这行公式的含义是\"把 A1、A2、A3 每个都乘以 2\"，得到 `{A1*2, A2*2, A3*2}`。普通公式只显示第一个结果，数组公式则能把全部结果\"摊开\"显示。"}, {"title": "2. 传统数组公式（Ctrl+Shift+Enter）", "body": "在旧版本 Excel 里，想让公式返回多个结果：\n1. 先选中**多个**单元格（结果要占几格就选几格）。\n2. 输入公式，如 `=A1:A3*2`。\n3. 按 **Ctrl+Shift+Enter**（不是只按 Enter）。\n公式两端会自动加上花括号 `{=A1:A3*2}`，表示这是数组公式。**花括号是 Excel 自己加的，手工输入无效。**\n经典用途——多条件计数（COUNTIFS 出现之前的写法，现在仍有人用）：\n[代码示例]\n原理：`(A2:A100=\"销售部\")` 得到一串 TRUE/FALSE，`(B2:B100>5000)` 得到另一串，两串相乘（TRUE=1、FALSE=0），只有两个条件都成立的位置是 1，SUM 加总即为同时满足的人数。"}, {"title": "3. 动态数组：新时代的写法", "body": "Microsoft 365 引入动态数组后，**只按 Enter**，结果自动\"溢出\"到相邻单元格。不再需要三键，也不再需要预选区域。\n### FILTER：按条件筛选\n[代码示例]\n返回 B 列等于\"销售部\"的所有行（A:C 三列）。做\"部门人员清单\"一公式搞定，源数据增减行自动更新。\n加\"无结果\"提示：\n[代码示例]\n### SORT：排序\n[代码示例]"}, {"title": "4. #溢出! 错误处理", "body": "当动态数组的结果没地方\"摊开\"时，报 `#溢出!`。常见原因和解法：\n`#` 引用是动态数组时代的重要符号：公式结果变长变短，`A2#` 自动跟着变，SUM 永远求和的是最新结果。"}, {"title": "5. 实战案例", "body": "### 案例 1：多条件求和（替代 SUMIFS 的数组思路）\n统计\"销售部\"且\"金额>5000\"的总额：\n[代码示例]\n普通 Enter 即可（365 会自动按数组算）。\n### 案例 2：动态部门筛选器\n[代码示例]\nF1 做下拉选部门，右侧自动列出该部门所有人——简易查询系统。\n### 案例 3：自动去重+计数"}, {"title": "6. 新旧对照速查", "body": ""}]}, {"id": "powerquery", "title": "Power Query", "sections": [{"title": "1. Power Query 是什么", "body": "它是 Excel 里的一个**数据加工流水线**：你把\"获取→清洗→整理\"的每一步操作点一遍，Power Query 会把步骤记下来。下个月拿到新的源文件，点一下\"刷新\"，所有步骤自动重跑一遍。\n和公式的区别：\n- 公式是\"算出一个结果\"，Power Query 是\"产出一张干净的表\"。\n- 公式适合行内计算；Power Query 适合**结构性整理**：拆分列、转置、合并文件、逆透视——这些用公式写会很痛苦。\n核心观念：**你点的每一步都会变成一行 M 代码**，记录在右侧「应用的步骤」里。可以回头修改、删除、调整顺序。"}, {"title": "2. 获取数据", "body": "「数据」→「获取数据」，来源非常多：\n选中来源后点「转换数据」进入 Power Query 编辑器，开始清洗。"}, {"title": "3. 常用清洗步骤", "body": "### 拆分列\n一列里混着\"省-市-区\"？选中列 →「拆分列」→「按分隔符」→ 输入 `-`。一列变三列。也可以按固定宽度、按大小写转换处拆分。\n### 替换值\n选中列 → 右键 →「替换值」：把\"男/女\"换成\"M/F\"，把\"N/A\"换成空。支持整列批量。\n### 填充\n导出的报表经常只有第一行有\"部门\"名，下面是空的（合并单元格拆开后的样子）。选中列 →「转换」→「填充」→「向下」。空单元格自动填上上方的值，透视表分组的前提。\n### 更改类型\n每列顶上有个类型图标（ABC/123/日历）。点它把文本改成数字、日期。**类型不对会导致求和变计数、日期无法分组**，清洗时务必检查。"}, {"title": "4. 合并查询：比 VLOOKUP 更强的关联", "body": "场景：A 表是订单（有\"客户编号\"），B 表是客户档案（\"客户编号\"→\"客户名称\"），想给订单带上客户名称。\n1. 在编辑器里选中订单查询 →「合并查询」。\n2. 上表选\"客户编号\"，下表选\"客户档案\"的\"客户编号\"（点列表头选中，两边都要点）。\n3. 联接种类选\"左外部\"（保留订单全部行，档案对不上的留空——对应 VLOOKUP 的精确匹配）。\n4. 确定后多出一列，点列头的展开按钮，勾选\"客户名称\"。\n比 VLOOKUP 强的点：\n- **可按多列关联**：Ctrl+点选多个列头，一次按\"省+市\"两列匹配，VLOOKUP 要拼辅助列。\n- **模糊匹配**：联接时勾选\"模糊匹配\"，自动处理\"北京\"vs\"北京市\"这种差异，还能设相似度阈值。"}, {"title": "5. 追加查询：纵向堆叠", "body": "场景：12 个月的销售表结构相同，要拼成一张全年表。\n「追加查询」→ 选\"三个或更多表\" → 把 12 个表都加进来。列名相同的自动对齐，某表多出的列会以空值补齐。\n**从文件夹追加**（更常用）：「获取数据」→「从文件夹」→ 选存放 12 个文件的文件夹 →「合并和转换」。以后每月往文件夹里丢新文件，刷新一次全进来——月报自动化。"}, {"title": "6. 透视列与逆透视列", "body": "### 逆透视（Unpivot）：把交叉表\"拆长\"\n源数据是\"姓名×12个月\"的矩阵（1 月、2 月…各一列），透视表吃不了这种格式。\n选中 12 个月份列 → 右键 →「逆透视列」。变成三列：姓名、月份、销售额。**这是 Power Query 最经典的用途之一。**\n### 透视列（Pivot）：反向操作\n把\"月份、销售额\"两列转回交叉表：选中\"月份\"列 →「透视列」→ 值列选\"销售额\"、聚合选\"求和\"。"}]}, {"id": "conditional-formatting", "title": "条件格式", "sections": [{"title": "1. 核心原理", "body": "条件格式 = **\"规则\" + \"格式\"**。规则判断每个单元格\"达不达标\"，达标就套用你设的格式（红底、加粗等）。\n关键理解：**格式是\"活\"的**。单元格的值变了，格式自动跟着变——和你手工涂色有本质区别。删掉规则（「开始」→「条件格式」→「清除规则」）就恢复原样，不破坏数据。\n操作入口：「开始」→「条件格式」。先**选中要应用的区域**再设规则，这点最重要。"}, {"title": "2. 内置规则：突出显示单元格规则", "body": "最常用的一类：「条件格式」→「突出显示单元格规则」：\n每个规则点开后选格式（浅红填充深红文本等），也可以点「自定义格式」自己配。"}, {"title": "3. 数据条：在单元格里画\"进度条\"", "body": "「条件格式」→「数据条」→ 选一种颜色。数值越大，条越长。\n- 适合：完成率、销售额对比——一眼看出谁高谁低，不用看数字。\n- 技巧：勾选「仅显示数据条」（管理规则→编辑规则），隐藏数字，只留条形，更像仪表盘。\n- 注意：数据条的长度是按**选中区域内的最大/最小值**自动缩放的，区域不同不能直接比长短。"}, {"title": "4. 色阶：热力图", "body": "「条件格式」→「色阶」→ 如\"绿-黄-红\"。数值映射到颜色渐变，**适合看分布**：\n- 12 个月的销售热力图，旺季月份自动变红。\n- 学生成绩表，一眼看出哪科普遍偏低。\n双色刻度和三色刻度：三色多一个中间色，适合\"中间值也想区分\"的场景。"}, {"title": "5. 图标集：红绿灯", "body": "「条件格式」→「图标集」→ 如\"三色旗/红绿灯\"。数值分三档，分别显示 ●●●。\n默认按百分比划分（67%/33%），想按绝对值：管理规则 → 编辑规则 → 类型改成\"数字\"，填阈值。如：完成率 ≥100% 绿灯、≥80% 黄灯、<80% 红灯。"}, {"title": "6. 重点：自定义公式规则", "body": "内置规则不够用时，用公式。入口：「条件格式」→「新建规则」→「使用公式确定要设置格式的单元格」。\n**核心心法**：公式是**相对选中区域左上角**写的。选中 A2:D100 后写公式，公式里的 A2 指\"当前正在判断的行的 A 列\"。Excel 会把公式逐行（逐格）套用一遍。\n### 示例 1：整行标红（金额>10000 的行整行变红）\n选中 A2:D100，公式：\n[代码示例]\n`$C` 锁定列（每行都看 C 列），`2` 不锁定行（随行变化）。这就是整行格式化的标准写法：**列锁定、行不锁定**。\n### 示例 2：标出重复值（内置规则只能标单元格，公式可标整行）\n[代码示例]"}]}, {"id": "data-validation", "title": "数据验证", "sections": [{"title": "1. 数据验证是什么", "body": "「数据」→「数据验证」。它在**输入的那一刻**拦截不合法的值，而不是事后检查。\n三个可配置项：\n1. **设置**：允许输入什么（整数/小数/日期/序列/文本长度…）。\n2. **输入信息**：选中单元格时弹出的提示（\"请输入 1-100 的整数\"）——主动引导。\n3. **出错警告**：输错时的弹窗，样式可选\"停止\"（硬拦截）/\"警告\"（可继续）/\"信息\"（仅提醒）。"}, {"title": "2. 下拉列表（最常用）", "body": "### 固定选项\n选中单元格 → 数据验证 → 允许「序列」→ 来源填 `男,女`（中文逗号不行，必须用**英文逗号**分隔）。单元格右侧出现下拉箭头。\n### 引用区域\n来源填 `=$F$2:$F$10`（部门清单）。清单变了下拉自动变。建议把清单放在单独的\"基础数据\"表，隐藏起来。\n### 动态二级联动：选\"省\"后\"市\"跟着变\n这是数据验证的经典难题，标准解法是 **INDIRECT + 命名区域**：\n1. 准备对照表：A 列是省名（广东、江苏…），B 列开始每列是一个省的城市，第一行是省名。\n2. 给每个省的城市区域**定义名称**：选中广东的城市 → 名称框输入 `广东` → 回车。注意名称不能含空格，省名有空格先替换。"}, {"title": "3. 输入限制", "body": "自定义公式的心法和条件格式一样：**相对左上角写**。选中 B2:B100 后公式写 `=LEN(B2)=11`，表示\"本单元格长度必须 11\"。"}, {"title": "4. 圈释无效数据", "body": "数据验证只拦**新输入**，历史脏数据怎么办？「数据」→「数据验证」→「圈释无效数据」。所有违反规则的旧数据会被红圈圈出来，改完后「清除无效数据标识」去掉圈。\n用途：接手别人的表，先圈一遍，脏数据一目了然。"}, {"title": "5. 工作表保护：锁公式、开放录入区", "body": "场景：模板发给 20 个人填，只允许填黄色区域，公式列不许碰。\n1. **先解锁录入区**：选中允许填写的单元格 → 右键「设置单元格格式」→「保护」→ **取消勾选\"锁定\"**。默认所有单元格都是\"锁定\"状态，但不保护时锁无效。\n2. 「审阅」→「保护工作表」→ 设密码 → 勾选允许的操作（一般保留\"选定未锁定的单元格\"）。\n3. 效果： locked 的公式格点不进去，未锁定的可填。有人想改公式？弹密码框。\n取消：审阅 → 撤销工作表保护 → 输密码。"}, {"title": "6. 允许编辑区域：多人分工", "body": "保护工作表是一刀切，\"允许编辑区域\"可以**按区域设不同密码**：\n「审阅」→「允许编辑区域」→「新建」：\n- 区域 A1:B10，密码 111 → 销售部用密码 111 可改\n- 区域 C1:D10，密码 222 → 财务部用密码 222 可改\n每人只能改自己的区，保护工作表后依然有效。适合部门分工录入同一张表。"}]}], "basics": [{"id": "interface", "title": "认识 Excel 界面", "level": "入门", "body": "标题栏→功能区（选项卡+命令组）→编辑栏（显示/输入公式）→工作表区（行列交叉为单元格，如 B3）→工作表标签（底部切换/新增）→状态栏（快速看求和/平均）。记住：名称框可直接输入 B100 跳转，编辑栏是公式的家。", "steps": ["打开 Excel，观察功能区：文件/开始/插入/页面布局/公式/数据/审阅/视图", "点击名称框输入 D20，回车直接跳转", "在编辑栏输入 =1+2，回车看结果"]}, {"id": "enter", "title": "数据录入技巧", "level": "入门", "body": "Enter 下移、Tab 右移、Shift+Enter 上移。选中区域后按 Enter 在区域内循环。Ctrl+Enter 批量填充选中区域。Alt+↓ 调出下拉历史。Ctrl+; 输入今天日期，Ctrl+Shift+; 输入当前时间。", "steps": ["选中 A1:A10，输入内容后按 Ctrl+Enter 批量填充", "按 Ctrl+; 快速输入今天日期", "用 Alt+↓ 在已有列表中快速选择"]}, {"id": "format", "title": "单元格格式", "level": "入门", "body": "数字格式决定显示方式：常规/数值/货币/百分比/日期。Ctrl+1 打开设置单元格格式对话框。对齐、字体、边框、填充都在「开始」选项卡。格式刷（双击可多次使用）是排版神器。", "steps": ["选中金额列，按 Ctrl+Shift+4 设为货币格式", "选中日期列，Ctrl+1 设为日期格式", "双击格式刷，把标题格式刷到多个地方"]}, {"id": "sortfilter", "title": "排序与筛选", "level": "入门", "body": "筛选（Ctrl+Shift+L）：按条件只显示想要的行，箭头图标点开设条件。排序：按某列升序/降序，多关键字排序用「自定义排序」。注意：排序前先选中整个数据区域，否则会错乱！", "steps": ["选中表头，按 Ctrl+Shift+L 开启筛选", "点箭头，只勾选「销售部」", "按销售额列降序排列"]}, {"id": "print", "title": "打印设置", "level": "入门", "body": "页面布局→打印标题（顶端标题行每页重复）→设置打印区域→分页预览拖蓝线。页眉页脚加页码。打印前一定用「打印预览」检查。", "steps": ["页面布局→打印标题，设置顶端标题行", "选中区域→页面布局→打印区域→设置", "视图→分页预览，拖动蓝线调整"]}], "charts": [{"id": "choose", "title": "图表类型选择指南", "level": "进阶", "body": "比较大小用柱状图/条形图，看趋势用折线图，看占比用饼图/环形图（类别≤6），看关系用散点图/气泡图，看分布用直方图/箱线图。双坐标用组合图。记住：一图只讲一件事。", "types": [{"name": "柱状图", "use": "比较各类别数值大小", "example": "各部门销售额对比"}, {"name": "折线图", "use": "看随时间变化的趋势", "example": "12 个月营收走势"}, {"name": "饼图", "use": "看各部分占比（≤6 类）", "example": "市场份额"}, {"name": "条形图", "use": "类别名称长时的比较", "example": "产品线排名"}, {"name": "散点图", "use": "看两个变量的关系", "example": "广告费 vs 销售额"}, {"name": "面积图", "use": "看累计趋势", "example": "累计用户增长"}, {"name": "雷达图", "use": "多维度综合评价", "example": "员工能力六维图"}, {"name": "组合图", "use": "两个量级不同的序列", "example": "销售额（柱）+增长率（线）"}]}, {"id": "make", "title": "图表制作步骤", "level": "进阶", "body": "选中数据→插入→选图表类型→切换行列（数据反了就点它）→添加数据标签→调坐标轴。数据源：右键→选择数据，可增删系列。", "steps": ["选中数据区域（含表头）", "插入→柱状图→簇状柱形图", "右键图表→添加数据标签", "双击坐标轴调整刻度"]}, {"id": "beauty", "title": "图表美化技巧", "level": "高级", "body": "删网格线、删图例（直接标数据）、统一配色（莫兰迪/商务蓝）、加粗标题讲结论、坐标轴从 0 开始（柱状图）。少即是多：每删一个元素，图表清晰一度。", "steps": ["选中网格线按 Delete 删除", "把图例删掉，直接在柱子上标数值", "标题改成结论句，如「Q3 华东区增长最快」"]}, {"id": "dynamic", "title": "动态图表", "level": "高级", "body": "下拉菜单联动图表：数据验证做下拉→INDEX+MATCH 取数→图表数据源引用。用复选框控制系列显示。用 OFFSET 做动态区域，新增数据自动进图。", "steps": ["用数据验证做月份下拉菜单", "用 INDEX+MATCH 根据选择取数", "图表数据源指向取数区域"]}], "scenarios": [{"id": "finance", "title": "财务报销统计", "level": "进阶", "desc": "每月上百条报销记录，自动汇总到部门/类别", "formulas": ["SUMIFS 多条件汇总", "EOMONTH 判断月份", "IFERROR 容错"], "example": "=SUMIFS(金额列, 部门列, \"销售部\", 日期列, \">=\"&EOMONTH(TODAY(),-2)+1)", "tips": "用数据验证限制部门只能选列表值；条件格式标出超 5000 的报销"}, {"id": "sales", "title": "销售业绩分析", "level": "高级", "desc": "销售明细表 → 自动排名、环比、Top10", "formulas": ["RANK 排名", "VLOOKUP/XLOOKUP 匹配", "SUMPRODUCT 加权"], "example": "=RANK(B2, $B$2:$B$50)  // 业绩排名\n=(本月-上月)/上月  // 环比增长率", "tips": "数据透视表按季度汇总；条件格式数据条直观对比；切片器做交互报表"}, {"id": "hr", "title": "人事考勤统计", "level": "进阶", "desc": "打卡记录 → 迟到/早退/缺勤自动统计", "formulas": ["COUNTIF 统计次数", "IF 判断迟到", "NETWORKDAYS 工作日"], "example": "=IF(上班时间>TIME(9,0,0), \"迟到\", \"正常\")", "tips": "用 TIME 函数设标准时间；数据透视表按人汇总月度考勤"}, {"id": "inventory", "title": "库存预警管理", "level": "高级", "desc": "出入库流水 → 实时库存 + 低库存预警", "formulas": ["SUMIF 分别汇总出入库", "IF 判断预警", "VLOOKUP 匹配单价"], "example": "=SUMIF(类型列,\"入库\",数量列)-SUMIF(类型列,\"出库\",数量列)", "tips": "条件格式标红低于安全库存；用 Power Query 合并多仓数据"}, {"id": "dashboard", "title": "经营仪表盘", "level": "专家", "desc": "一页看懂公司经营：KPI 卡片 + 趋势图 + 明细", "formulas": ["INDEX+MATCH 动态取数", "OFFSET 动态区域", "TEXT 美化显示"], "example": "KPI 卡片 =TEXT(销售额,\"¥#,##0\")&\"  同比 \"&TEXT(增长率,\"0%\")", "tips": "组合：数据透视表+切片器+图表=交互式仪表盘；用照相机功能拼排版"}]};
const LEVEL_COLOR = {"入门":"#22c55e","进阶":"#3b82f6","高级":"#f59e0b","专家":"#ef4444"};
const CAT_META = {"math":["数学函数","∑"],"text":["文本函数","T"],"date":["日期函数","📅"],"logic":["逻辑函数","⚡"],"lookup":["查找引用","🔍"],"stat":["统计函数","📊"],"fin":["财务函数","💰"]};
let cur = "path";

function badge(lv){return `<span class="badge" style="background:${LEVEL_COLOR[lv]||'#6b7280'}">${lv}</span>`}
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;")}

function buildNav(){
  const groups = [
    ["guide","🧭 学习指南",[["path","学习路径"],["howto","本站使用指南"]]],
    ["basic","🌱 入门基础", DATA.basics.map(b=>["basic_"+b.id,b.title])],
    ["func","∑ 函数公式", Object.keys(CAT_META).map(k=>["func_"+k, CAT_META[k][0]])],
    ["adv","🚀 进阶技巧", DATA.advanced.map(a=>["adv_"+a.id,a.title])],
    ["chart","📈 图表可视化", DATA.charts.map(c=>["chart_"+c.id,c.title])],
    ["vba","⚙️ VBA 编程",[["vba_kw","关键字中文手册"],["vba_ex","实例代码精讲"]]],
    ["scene","💼 实战场景", DATA.scenarios.map(s=>["scene_"+s.id,s.title])],
    ["ref","📖 速查手册",[["ref_keys","快捷键大全"],["ref_func","函数索引"]]],
  ];
  let h = "";
  groups.forEach((g,i)=>{
    h += `<div class="nav-group${i===0?' open':''}"><div class="nav-title" onclick="this.parentNode.classList.toggle('open')">${g[1]}<span>▾</span></div><div class="nav-items">`;
    g[2].forEach(it=>{ h += `<div class="nav-item${it[0]===cur?' active':''}" data-k="${it[0]}" onclick="go('${it[0]}',this)">${it[1]}</div>`; });
    h += `</div></div>`;
  });
  document.getElementById("nav").innerHTML = h;
}

function go(k, el){
  cur = k;
  document.querySelectorAll(".nav-item").forEach(e=>e.classList.remove("active"));
  if(el) el.classList.add("active");
  render(k);
  window.scrollTo({top:0,behavior:"smooth"});
}

function funcDetail(f){
  let h = `<div class="card"><h3>${f.name}</h3><p style="color:var(--muted);font-size:14px">${esc(f.desc)}</p>`;
  h += `<p style="margin-top:8px"><span class="badge" style="background:#e8f5ec;color:var(--green-d)">${f.cat_name}</span></p>`;
  if(f.syntax) h += `<h4>语法</h4><pre><code>${esc(f.syntax)}</code><button class="copybtn" onclick="copyCode(this)">复制</button></pre>`;
  if(f.examples&&f.examples.length){ h += `<h4>示例</h4>`; f.examples.forEach(e=>{ h += `<pre><code>${esc(e)}</code><button class="copybtn" onclick="copyCode(this)">复制</button></pre>`; }); }
  if(f.pitfalls&&f.pitfalls.length){ h += `<h4>⚠️ 避坑</h4>`; f.pitfalls.forEach(p=>{ h += `<div class="pitfall">${esc(p)}</div>`; }); }
  h += `<p style="margin-top:12px"><a href="javascript:go('func_${f.cat}')" style="color:var(--green)">← 返回${f.cat_name}</a></p></div>`;
  return h;
}

function render(k){
  const M = document.getElementById("main");
  let h = "";
  if(k==="path"){
    h = `<div class="card"><h3>🧭 Excel 学习路径（从易到难）</h3><p style="color:var(--muted)">跟着这条路走，零基础到高手。点击每个阶段进入学习。</p><div class="path">`;
    const steps = [["basic_interface","第一阶段","入门基础<br><small>界面/录入/格式/排序</small>"],["func_math","第二阶段","函数公式<br><small>102 个函数中文详解</small>"],["adv_pivottable","第三阶段","进阶技巧<br><small>透视表/条件格式/验证</small>"],["chart_choose","第四阶段","图表可视化<br><small>选型/制作/美化/动态</small>"],["adv_powerquery","第五阶段","高级功能<br><small>数组/Power Query</small>"],["vba_kw","第六阶段","VBA 编程<br><small>关键字/实例/自动化</small>"],["scene_dashboard","第七阶段","实战场景<br><small>财务/销售/仪表盘</small>"]];
    steps.forEach((s,i)=>{ if(i>0) h+=`<span class="path-arrow">→</span>`; h+=`<div class="path-step" onclick="go('${s[0]}')">${s[1]}<small>${s[2].split("<br>")[1]||""}</small><div style="font-size:13px">${s[2].split("<br>")[0]}</div></div>`; });
    h += `</div></div>`;
    h += `<div class="card"><h3>📊 本站内容一览</h3><table><tr><th>模块</th><th>内容</th><th>难度</th></tr>
    <tr><td>入门基础</td><td>${DATA.basics.length} 篇</td><td>${badge("入门")}</td></tr>
    <tr><td>函数公式</td><td>${DATA.functions.length} 个，全部中文解释</td><td>${badge("入门")} ${badge("进阶")}</td></tr>
    <tr><td>进阶技巧</td><td>${DATA.advanced.length} 个专题</td><td>${badge("进阶")}</td></tr>
    <tr><td>图表可视化</td><td>${DATA.charts.length} 个专题</td><td>${badge("进阶")} ${badge("高级")}</td></tr>
    <tr><td>VBA 编程</td><td>${DATA.vba_keywords.length} 关键字 + ${DATA.vba_examples.length} 实例</td><td>${badge("高级")} ${badge("专家")}</td></tr>
    <tr><td>实战场景</td><td>${DATA.scenarios.length} 个场景</td><td>${badge("进阶")} ${badge("专家")}</td></tr>
    <tr><td>快捷键</td><td>${DATA.shortcuts.reduce((a,c)=>a+c.keys.length,0)} 个</td><td>${badge("入门")}</td></tr></table></div>`;
  }
  else if(k==="howto"){
    h = `<div class="card"><h3>📖 本站使用指南</h3>
    <div class="tip"><b>搜索：</b>顶部搜索框可搜函数名、VBA关键字、技巧名，中英文都行。</div>
    <div class="tip"><b>难度徽章：</b><span class="badge" style="background:#22c55e">入门</span><span class="badge" style="background:#3b82f6">进阶</span><span class="badge" style="background:#f59e0b">高级</span><span class="badge" style="background:#ef4444">专家</span> 帮你判断先学什么。</div>
    <div class="tip"><b>复制代码：</b>每个代码块右上角有点「复制」，VBA 代码可直接粘贴到编辑器用。</div>
    <div class="tip"><b>建议顺序：</b>入门基础 → 函数公式 → 进阶技巧 → 图表 → VBA → 实战场景。</div></div>`;
  }
  else if(k.startsWith("basic_")){
    const b = DATA.basics.find(x=>"basic_"+x.id===k);
    h = `<div class="card">${badge(b.level)}<h3 style="margin-top:8px">${b.title}</h3><p>${esc(b.body)}</p>`;
    if(b.steps){ h+=`<h4>👣 操作步骤</h4><table>`; b.steps.forEach((s,i)=>{ h+=`<tr><td style="width:40px;font-weight:700;color:var(--green)">${i+1}</td><td>${esc(s)}</td></tr>`; }); h+=`</table>`; }
    h += `</div>`;
  }
  else if(k.startsWith("func_") && k!=="func_detail"){
    const cid = k.slice(5);
    const list = DATA.functions.filter(f=>f.cat===cid);
    h = `<div class="card"><h3>${CAT_META[cid][1]} ${CAT_META[cid][0]}（${list.length} 个）</h3><p style="color:var(--muted);font-size:14px">点击卡片查看语法、示例和避坑指南</p></div><div class="func-grid">`;
    list.forEach(f=>{ h += `<div class="func-card" onclick='showFunc(${JSON.stringify(f.name)})'><div class="fname">${f.name}</div><div class="fdesc">${esc(f.desc)}</div></div>`; });
    h += `</div>`;
  }
  else if(k.startsWith("adv_")){
    const a = DATA.advanced.find(x=>"adv_"+x.id===k);
    h = `<div class="card">${badge("进阶")}<h3 style="margin-top:8px">${a.title}</h3>`;
    a.sections.forEach(s=>{ h += `<h4>${esc(s.title)}</h4><p style="font-size:14px;white-space:pre-line">${esc(s.body)}</p>`; });
    h += `</div>`;
  }
  else if(k.startsWith("chart_")){
    const c = DATA.charts.find(x=>"chart_"+x.id===k);
    h = `<div class="card">${badge(c.level)}<h3 style="margin-top:8px">${c.title}</h3><p>${esc(c.body)}</p>`;
    if(c.types){ h += `<h4>图表类型速查</h4><table><tr><th>类型</th><th>用途</th><th>例子</th></tr>`; c.types.forEach(t=>{ h+=`<tr><td><b>${t.name}</b></td><td>${t.use}</td><td>${t.example}</td></tr>`; }); h+=`</table>`; }
    if(c.steps){ h+=`<h4>👣 操作步骤</h4><table>`; c.steps.forEach((s,i)=>{ h+=`<tr><td style="width:40px;font-weight:700;color:var(--green)">${i+1}</td><td>${esc(s)}</td></tr>`; }); h+=`</table>`; }
    h += `</div>`;
  }
  else if(k==="vba_kw"){
    h = `<div class="card"><h3>⚙️ VBA 关键字中文手册（${DATA.vba_keywords.length} 个）</h3><p style="color:var(--muted);font-size:14px">每个关键字配中文解释和代码示例</p></div>`;
    DATA.vba_keywords.forEach(w=>{
      h += `<div class="card"><h3>${w.kw} <span style="font-size:14px;color:var(--muted)">— ${esc(w.cn)}</span></h3>`;
      if(w.code) h += `<pre><code>${esc(w.code)}</code><button class="copybtn" onclick="copyCode(this)">复制</button></pre>`;
      if(w.note) h += `<p style="font-size:14px">${esc(w.note)}</p>`;
      h += `</div>`;
    });
  }
  else if(k==="vba_ex"){
    h = `<div class="card"><h3>💡 VBA 实例代码精讲（${DATA.vba_examples.length} 个）</h3><p style="color:var(--muted);font-size:14px">复制即用，每个实例配中文讲解</p></div>`;
    DATA.vba_examples.forEach((e,i)=>{
      h += `<div class="card">${badge("高级")}<h3 style="margin-top:8px">${i+1}. ${esc(e.title)}</h3><pre><code>${esc(e.code)}</code><button class="copybtn" onclick="copyCode(this)">复制</button></pre><div class="tip">${esc(e.explain)}</div></div>`;
    });
  }
  else if(k.startsWith("scene_")){
    const s = DATA.scenarios.find(x=>"scene_"+x.id===k);
    h = `<div class="card">${badge(s.level)}<h3 style="margin-top:8px">💼 ${s.title}</h3><p>${esc(s.desc)}</p>`;
    h += `<h4>🔧 用到的武器</h4>`; s.formulas.forEach(f=>{ h+=`<div class="tip">${esc(f)}</div>`; });
    h += `<h4>📝 核心公式</h4><pre><code>${esc(s.example)}</code><button class="copybtn" onclick="copyCode(this)">复制</button></pre>`;
    h += `<h4>💡 场景搭配技巧</h4><div class="tip">${esc(s.tips)}</div></div>`;
  }
  else if(k==="ref_keys"){
    h = `<div class="card"><h3>⌨️ 快捷键大全</h3><p style="color:var(--muted);font-size:14px">★ 为高频，建议先记</p></div>`;
    DATA.shortcuts.forEach(c=>{
      h += `<div class="card"><h3>${esc(c.cat)}</h3><table class="kw-table"><tr><th>快捷键</th><th>功能</th></tr>`;
      c.keys.forEach(x=>{ h += `<tr><td>${x.hot?"★ ":""}<code>${esc(x.key)}</code></td><td>${esc(x.desc)}</td></tr>`; });
      h += `</table></div>`;
    });
  }
  else if(k==="ref_func"){
    h = `<div class="card"><h3>∑ 函数索引（${DATA.functions.length}）</h3><p style="color:var(--muted);font-size:14px">按分类浏览，点击查看详情</p></div><div class="func-grid">`;
    DATA.functions.forEach(f=>{ h += `<div class="func-card" onclick='showFunc(${JSON.stringify(f.name)})'><div class="fname">${f.name}</div><div class="fdesc">${esc(f.desc)}</div></div>`; });
    h += `</div>`;
  }
  M.innerHTML = h;
}

function showFunc(name){
  const f = DATA.functions.find(x=>x.name===name);
  if(f) document.getElementById("main").innerHTML = funcDetail(f);
  window.scrollTo({top:0,behavior:"smooth"});
}

function doSearch(q){
  q = q.trim().toLowerCase();
  const M = document.getElementById("main");
  if(!q){ render(cur); return; }
  let h = `<div class="card"><h3>🔍 搜索「${esc(q)}」</h3></div>`;
  const fs = DATA.functions.filter(f=>f.name.toLowerCase().includes(q)||(f.desc&&f.desc.includes(q)));
  if(fs.length){ h += `<h4 style="margin:12px 4px">函数（${fs.length}）</h4><div class="func-grid">`; fs.slice(0,24).forEach(f=>{ h+=`<div class="func-card" onclick='showFunc(${JSON.stringify(f.name)})'><div class="fname">${f.name}</div><div class="fdesc">${esc(f.desc)}</div></div>`; }); h += `</div>`; }
  const ks = DATA.vba_keywords.filter(w=>w.kw.toLowerCase().includes(q)||w.cn.includes(q));
  if(ks.length){ h += `<h4 style="margin:12px 4px">VBA关键字（${ks.length}）</h4>`; ks.slice(0,10).forEach(w=>{ h+=`<div class="card"><h3>${w.kw} — ${esc(w.cn)}</h3>${w.code?`<pre><code>${esc(w.code)}</code><button class="copybtn" onclick="copyCode(this)">复制</button></pre>`:""}</div>`; }); }
  const ss = DATA.scenarios.filter(s=>s.title.includes(q)||s.desc.includes(q));
  if(ss.length){ h += `<h4 style="margin:12px 4px">实战场景（${ss.length}）</h4>`; ss.forEach(s=>{ h+=`<div class="card" style="cursor:pointer" onclick="go('scene_${s.id}')">${badge(s.level)} <b>${s.title}</b><p style="font-size:13px;color:var(--muted)">${esc(s.desc)}</p></div>`; }); }
  if(!fs.length&&!ks.length&&!ss.length) h += `<div class="card"><p>没有找到相关内容，换个关键词试试。</p></div>`;
  M.innerHTML = h;
}

function copyCode(btn){
  const code = btn.parentNode.querySelector("code").innerText;
  navigator.clipboard.writeText(code).then(()=>{ btn.textContent="已复制"; setTimeout(()=>btn.textContent="复制",1500); });
}

buildNav(); render("path");
</script>
</body>
</html>
